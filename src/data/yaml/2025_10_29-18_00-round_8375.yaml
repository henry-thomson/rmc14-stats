roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nisha Helm, Hugo 'Mugshot' Mach, Frida Norrgard, Peter 'Parabellum' Cencer, Gives-The-Fish, Sol Umber, Krieg Barkhart.



  Royal Jelly Awards:

  Drone (XX-656) is awarded the Royal jelly of rejuvenation: 'You were the healer, the savior, for your sisters for you have sacrificed twice, one I have witness myself, where you bestow to save their life at the right time. When they recklesly pushed to get tubed, you were there to put in your effort in ensuring their survival. I thank you for saving vital tier 3's on the front line, from your healer work! Rejoice!' by Prime Queen (PRO)

  Mature Drone (PA-721-T) is awarded the Royal jelly of rejuvenation: 'For your great work in ensuring the frontline was always healthy with your fruits, I am bestowing this jelly for without your effort, the healers, and tier 3's wouldn't have been doing as great, or getting back into the frontline activity as they should. May I see more of your work in future battles that is to come, may you bring prosperity to the hive! Rejoice!' by Prime Queen (PRO)




