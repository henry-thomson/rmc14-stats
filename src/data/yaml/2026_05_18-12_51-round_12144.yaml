roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Svyatoslav Yevgenyevich, Del Smirnov, Rosa Sanchez, Bartholomew 'Bart' Mann, Saimon Deshid, Mark Markson.



  Medal Awards:

  Lance Corporal Aubrey Honeybutton is awarded the Bronze heart medal: 'RFN Honeybutton exemplified the spirit of "treat others before yourself". While Alpha held their embattled trench line south of Marshal Office, this RFN ensured no scratch went unmarked. They helped their team, and medics, mitigate the influx of heavy losses.


  Ultimately though they healed others....we could not do the same for them. They paid the ultimate price, and for their valor, are awarded this medal.' by Lieutenant Colonel Atlas Bootes

  Lance Corporal Terra Korzak is awarded the Distinguished conduct medal: 'Lance Corporal Terra Korzak, though fresh from training, proved what it means to be a SADAR operator. Though no enemy tanks or vehicles awaited us, they adapted fastly to our unique situation. No xenonid truly was safe behind their crests, against this new generation of marines!' by Lieutenant Colonel Atlas Bootes

  Lance Corporal Kas'Lurla-Skeh'Kasar is awarded the Medal of valor: 'During the hijacking of our war vessel by the hive, nearly all hope was lost at our Lifeboats. We could only fight and stand our ground, as the Queen horde pincered us from an unseen flank. As I rushed to make one final announcement to my beloved corp, I noticed the Queen Horde mere feet away from me. 


  Stunned, and being dragged to the depths of the hive, I muttered what I thought to be my last words "So this is how I die" But like a flash of lightning, RFN Kas speared through the entire horde. Swift as the wind, my last view before losing conciousness was their hand reaching out for me. 


  I awoke safe, with my army.' by Lieutenant Colonel Atlas Bootes



  Royal Jelly Awards:

  Mature Hivelord (KV-620) is awarded the Royal jelly of resilience: 'KV, today you and your build team proved what is strongest in a hive. The backbone of all our fighting comes from our great builders.


  You proved what it takes when the talls skyfired marshal. You didn't falter, instead, you stepped up and started building even harder. Our victory today comes on the back of your labour with your build team.


  YIP is proud of your work today and all you have acomplished.


  YIP!!' by Ancient Queen (YIP)

  Young Drone (KI-88) is awarded the Royal jelly of resilience: 'KI, today you worked diligently together with the build team. Without your support we would never have gotten the win we did.


  We are all proud of your work and hope to see you build many more great hives in the future.


  YIP!!' by Ancient Queen (YIP)

  Elder Hivelord (FAE-76) is awarded the Royal jelly of resilience: 'FAE, your great work today has paid off. Together with the build team we have managed to win the day. When things seemed on the edge of falling appart, you and the build team mended it back together.


  YIP hopes to see more work like this in the fututure. Together we can make anything possible.


  YIP!!' by Ancient Queen (YIP)




