roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Luanne Greenawalker, Ron 'Fluffy' Paxton, Paul Savage, Knox 'Chef' Eterna, Mixes-the-Fuel, Rhys Hendricks, Stares-at-Stars, Canderous Boone, Liam Lovepepper, Juno 'Kleptocat' Kaneko, Cassian Baer, Blue Reeds Rivers, Eats-The-Cheeseburger, Aurora 'Birdcage' Lockheart.



  Medal Awards:

  Corporal Juno 'Kleptocat' Kaneko is awarded the Bronze heart medal: 'Juno Kelptocat Kaneko rushed in with alpha fireteam 2 and followed orders to the letter, risking their life to get sensros online. After getting sensors online they gave up their life to push and take out the queen that was in ovi. Severely crippling the hive. Their sacrifice will be remembered throughout the archieves of the UNMC. Lest we forget, Juno Kelptocat.


  Awarded by Colonel Sicilia Drakonovisch on 05/24/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch

  Sergeant Stares-at-Stars is awarded the Medal of valor: 'Not often do I grant the medal of Valor, but Sergeant Stares-At-stars earned it today. Diving to celestia to secure intel and deep behind enemy lines, stars completed their task to the very letter. Stares wen fare beyond the call of duty and pushed biogen lifting lockdown when ordered, and had their team secure sensors. With her cohesion we scored a big victory against the hive, even killing the queen and saving many lives. Excellent work today Sergeant. If only you could live to see this medal.


  Awarded by Colonel Sicilia Drakonovisch on 05/24/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





