  [color=green]All of the xenos were wiped out![/color]


  Medal Awards:

  Crow Baker is awarded the Distinguished conduct medal: 'Crow Baker fought off a great deal of xenonids to cover for the rest of the intelligence team. Along the way, they were also captured, but they were recovered by UNMC forces and made a speedy recovery from their surgery.


  Solid work today.'

  Zayden 'Soap' Kirkson is awarded the Distinguished conduct medal: 'Zayden Soap was the one who struck down the xenonid queen in battle today, surrounded by their comrades. Though it was a team effort, there is a commendable amount of courage required to be the first one into the gates of hell to skewer your enemy.


  Solid work today, marine.'





