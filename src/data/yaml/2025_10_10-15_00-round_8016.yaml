roundEndText: >2-

  The ship begins a cruise into space, reality warping around it as you flow into taychon shunt.


  Stars meld together, you . . don't know where you going.


  Though, whever it is, perhaps it's safer than where you once were - The home of these people who made all his, perhaps?


  Or just . . another planet to search for.


  All you know is that you weathered the storm, you're alive, you've gone through the veil.


  Everything'll be okay, you pray. It falls upon deaf ears, but that's okay. . everything's okay.


