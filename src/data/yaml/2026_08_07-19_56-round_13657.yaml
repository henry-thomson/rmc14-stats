roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Boiler (RE-788-D) is awarded the Royal jelly of sabotage: 'RED, you have spent the entire day harassing the talls in scrubland, effectively occupying at least half of the entire caste.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)

  Young Hivelord (UN-840-O) is awarded the Royal jelly of proliferation: 'UN-O, I've been told that you have spent the entire day building up our great hive, and have even saved sisters directly and by melting green sticks. Such caution is a great thing in my hive.


  For this, I award you this jelly of proliferation. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Praetorian (MIA-101) is awarded the Royal jelly of proliferation: 'MIA, you were fearless, always charging in first to make sure these pesky talls never saw the light of day again. There was always a capture on every push, and that was thanks to you, our youngest dancer.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Hivelord (HPI-83) is awarded the Royal jelly of resilience: 'HPI, you were our great build leader, always making sure we had resin to capture the talls with ease. You worked tirelessly all day guiding younger sisters.


  For this, I award you t his jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)




