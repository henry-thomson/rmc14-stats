roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Andromeda, Elroy Aegyr, Chez 'Cheese' Woodtiger, Derick 'Naptime' Hunt, Fenrisulfr AW Thumper, Blake Stone, Eris Greyseer, Ivana 'Blood Moon' Rhinehart, Skye 'Firefox' Sawyer, Aurora 'Birdcage' Barkheart, Merlin Stargazer, Lou Mars.



  Medal Awards:

  Second Lieutenant Tyson Weller is awarded the Bronze heart medal: '2nd Lieutenant Tyson Weller sacrificed their life in pursuit of victory during operations on Hybrisa Prospera. During the operation Lieutenant Weller was responsible for various actions that eliminated xenonid threats, though one action stood above them all.


  Lieutenant Weller identified and exploited a weakness in the local hive structure, approaching a young queen and ensuring her elimination before she became a threat. Rapidly accelerating operational goals and likely preventing the loss of significant marine life in the later parts.


  Your sacrifice will be remembered in the history books Lieutenant, teaching generations of the bravery of all our elements. May you rest in peace.


  Awarded by LtCol. Kaitlin Zalack on 21/09/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





