roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Larry Acewing, Michael 'Mikey' McGoggins, Matthew 'Skidmark' Fields, Silver, Dhazhali, Salts-The-Fries, Hank Starseer, Teagan McDonald, Davlat 'granddad' Lukin.



  Medal Awards:

  Sergeant Willow Temnora is awarded the Distinguished conduct medal: 'Sergeant Willow Temnora, during our difficult time, has stepped up into the role of Acting Squad Leader and has exceeded my expectations during Operation: Detour Cajun-Enterprise. Despite the difficulties and hardships encountered during the operation, Sergeant Temnora continued to lead their squad without fear.' by Lieutenant Colonel Michael Wilson





