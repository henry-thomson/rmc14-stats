roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Milo 'The Wimp' Fisher, Dune 'Friendly Killer' Ale, Ignaz Koehler, Monte Palmer, Nova Webb, Porter 'Porker' Keopple, Guaco Micheal, Glup 'The Ooze' Zarethis, Ruff Holt, Duncan 'Big Iron' Stall, Stellaria Araweb, Blinds-With-Welder.



  Medal Awards:

  Sergeant Spits-The-Fire is awarded the Distinguished conduct medal: 'Sergeant Spits-The-Fire you were the silent guard of FOB especially after it breached. You patrolled around giving clear warning to all of us of the Queen movements and killing Xenonids trying to take out lone marines. Your service today was everything we needed marine.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/02/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Atlas 'Wolfy' Snowlight

  Sergeant Blanka 'Disater' Zuan is awarded the Distinguished conduct medal: 'Sergeant Zuan you managed a impressive amount of critical kills today, most importantly when FOB breached you managed to help us clear out most of her teir 3s. Your work today was what we needed to secure victory.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/02/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Atlas 'Wolfy' Snowlight





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



