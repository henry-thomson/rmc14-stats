roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Dan, Buzz Fibres.



  Royal Jelly Awards:

  Young Carrier (ASH-18) is awarded the Royal jelly of proliferation: 'Today marked the use of unconventional tactics, and that required a strong and flexible approach. This sister never stopped taxing, constantly building up areas the talls were not in and keeping the hive alive. Your efforts gave the time needed for so many sisters to burst. WELL DONE!' by Prime Queen (HSQ)

  Young Hivelord (XX-555) is awarded the Royal jelly of resilience: 'Although you may be a young mind, you were this hive's heavyweight. You constantly built up areas to delay the tall advance until they ran out of time, and knew exactly what to do. You built up 3 fronts, and your efforts DIRECTLY LEAD TO 3 SEPERATE WIPES. I AM SO PROUD OF YOU.' by Prime Queen (HSQ)

  Prime Drone (FE-865-EN) is awarded the Royal jelly of rejuvenation: 'This one never gave up despite overwhelming odds. You were observed healing sisters mid fight to ensure 3 seperate wipes were completed. You were second to none, and it showed. We are so proud of your efforts today!' by Prime Queen (HSQ)

  Ancient Ravager (KR-455-IS) is awarded the Royal jelly of slaughter: 'This one was an absolute powerhouse. Following their queen like a shadow, and leaving absolute carnage in their wake. You tore through those tall castes like butter. Not once, not twice, but 3 entirely seperate wipes done mostly by your claws. A slaughter even the queen mother would be proud of. Thank you.' by Prime Queen (HSQ)

  Young Praetorian (EK-583) is awarded the Royal jelly of resilience: 'This was a battle which lasted for awhile, with no OVI time. I pushed you to your absolute limit, and asked a lot from you. Not only did you follow the plan to the letter, you managed to live to tell the tale while most did not. Wear this jelly with pride, you did more than earn it.' by Prime Queen (HSQ)




