roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  John 'Human' Coelho, Olive Orr, Fritz Fritzenhammer, Blighthound Bloodsworth, Kiefer Stahl.



  Royal Jelly Awards:

  Prime Crusher (MRT-817) is awarded the Royal jelly of slaughter: 'This crusher has stayed my royal guard from the start, has managed to cap and kill many a tall, they shielded me in time of stress, without them this victory may not have been possible.' by Elder Queen (AWW)

  Prime Boiler (WAR-149) is awarded the Royal jelly of slaughter: 'This boiler has stayed with me from the start, with their wonderful boils they managed to make clouds behind my screams, kill many talls with their acid boil and shield any caps getting dragged off, great job' by Elder Queen (AWW)

  Ancient Praetorian (REH-813) is awarded the Royal jelly of resilience: 'Our only valk, they have saved me in the time of stress from the tuber, without them this could've went very differently, I'm very proud of you my daughter!' by Elder Queen (AWW)

  Ancient Drone (GL-274-M) is awarded the Royal jelly of rejuvenation: 'This healer drone has saved many xisters with their saliva from dying, if not them many more of our daughters could've died, I'm very proud of you my daughter!' by Elder Queen (AWW)




