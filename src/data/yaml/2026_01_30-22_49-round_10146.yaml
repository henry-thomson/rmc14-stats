roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lena 'Spider Lily' Milize, Rhaun-Ironclaw, Locklsey Bashheart, Spits-The-Fire, Jamal Johnson, Finds-the-Gatfruit, Josephe Starloine.



  Royal Jelly Awards:

  Elder Hivelord (MOP-134) is awarded the Royal jelly of proliferation: 'For your first time as hive leader, you lead your sisters to the correct areas that was vital to be built up.


  You followed every order to the letter perfectly, you built up the skyfire of marshal.


  You rebuilt bar

   you rebuilt hydroponics, you were absolute building machine!

  Overall, you deserve this I hope you enjoy leading your sisters, and I hope to see more of that in the future! Rejoice!' by Prime Queen (PRO)

  Elder Praetorian (BRU-814) is awarded the Royal jelly of sabotage: 'During the engagement of Bar Valley.


  You pulled the fabled Tuber, to of which was permanently decomissioned at a highly horrible position.


  Because of that was I able to make recklessly push an dance around the entire battle field at ease because of that.


  Rejoice! You earned it!' by Prime Queen (PRO)

  Elder Drone (QI-775-X) is awarded the Royal jelly of proliferation: 'For your hard work since the beginning of the hive.


  You were working eagerly with MOP caste, building up marshal, hydroponics, and every area that was vital to the hive!


  Every builder deserve their praise, as there was few for the hive.

  Though i say you did absolutely amazing, and you should be always proud of every wall placed against the talls!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
