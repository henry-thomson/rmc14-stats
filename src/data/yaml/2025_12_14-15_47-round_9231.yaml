roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Olivia Croft, Jatayu 'Nerd' Corvuson, Stony Tony, Erin Cox, Yahir Lineman, Crafty Scuttlebug, Paulie 'Conman' Zarroni, Mason Rourke, Dandy D Danderson, Colton Oliver, Titus Hostimortus, Cecilia Wile, Charles Deppy Payne, Angela 'DUI' Whittier, Bill Biggers, Milton Matthews, Carlos Kennedy, John 'Port' Larboardson, Cheeky Pawswell, Atlas Bootes, Horgan Glueman.



  Medal Awards:

  Xuangir'Lir Mirxei is awarded the Medal of valor: 'Lance Corporal Xuangir'Lir Mirxei, together with Corporal Thales Antares, held the Biosensor Tower's completely isolated and outnumbered in hostile territory, valiantly fighting off enemy forces until reinforcements arrived.


  Awarded by LtCol. Daphne Nymphoiry on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Thales 'Careless' Antares is awarded the Medal of valor: 'Lance Corporal Xuangir'Lir Mirxei, together with Corporal Thales Antares, held the Biosensor Tower's completely isolated and outnumbered in hostile territory, valiantly fighting off enemy forces until reinforcements arrived.


  Awarded by LtCol. Daphne Nymphoiry on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Breaks-the-Tides is awarded the Bronze heart medal: 'Gunnery Sergeant Breaks-the-Tides diligently held both his squadron and the FOB together when cut off from reinforcements. Unfortunately, they met their end at the hands of the Xenonid Queen, being torn to pieces, sacrificed so the operation could be won and others would keep on living.


  Awarded by LtCol. Daphne Nymphoiry on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





