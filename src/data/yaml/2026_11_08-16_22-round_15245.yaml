roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  unknown.



  Royal Jelly Awards:

  Elder Drone (HU-537-X) is awarded the Royal jelly of rejuvenation: 'HUX the so gracious! Our sister was always grazing the edge of danger on the frontlines, yet at the same time being safe at all times. It is without a doupt that her infinite healing allowed the hive to succeed, and her sacrifices were always at the ready! HUX you must help the hive again, your contributions is what makes us succeed.' by Prime Queen (LIMA)

  Prime Drone (DU-947-CK) is awarded the Royal jelly of rejuvenation: 'DUCK was just outright a master of her craft! Eternally stuck to the queen like a bad tumor, but in a good way of course, she saved not only myself, but likely the whole hive at some point. DUCK is what makes us survive the times when even the most apex sisters have a death wish. I avoid rewarding apex sisters with a jelly, but DUCK proved her value time and time again. Literally sacrificed herself while she was being awarded a jelly...' by Prime Queen (LIMA)

  Ancient Hivelord (GRY-932) is awarded the Royal jelly of resilience: 'GRY is maybe too old for a jelly, but her mighty walls stood high and strong just like the hive. She stalked the talls with her keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! Once the talls were surrounded, all that was left was to watch them breath their last breath. We can only beg her for her help in the future!' by Prime Queen (LIMA)

  Prime Carrier (WI-695-LZ) is awarded the Royal jelly of sabotage: 'I avoid awarding apex sisters, but there can be no doubt that WILZ proved her mettle. Constant hugging, spending time with children, seeing them grow, occasional murder of a tall. Such is life of a carrier! She is a living legend, but what do you expect from a sisters of her caliber?! May the future hives are blessed with her presence as well. I wouldnt want to be a tall around her, but maybe it is a blessing to become part of the hive, at the hand of WILZ!' by Prime Queen (LIMA)




