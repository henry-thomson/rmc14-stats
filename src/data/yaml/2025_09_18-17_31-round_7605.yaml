roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Elena Oppenheimer, Glorb Radiatus, Tavish 'Vampire' Ironeater, Thales 'Careless' Antares, Lucian Hunter, Garry Yelis, Blake 'Bark' Barker, Mizooki 'PillBug' Akiya.



  Medal Awards:

  Julianne Eckhard is awarded the Bronze heart medal: '"For their exceptional performance and confidence following their promotion to Acting Squad Leader, they rose to the challenge of their new responsibilities and exceeded my expectations. Unfortunately, they lost their life in the line of duty during the Operation: Inspection Epsilon-Staple'

  Vera Williams is awarded the Distinguished conduct medal: 'Recommended by multiple fellow Marines, This Combat Technician went above and beyond in securing out Landing Zone and FOB, saying that they've constructed a fortress would be an understatement. Splendid work.'

  Thales 'Careless' Antares is awarded the Bronze heart medal: 'For their sacrifice during Operation: Inspection Epsilon-Staple, their precision with rockets not only felled multiple Xenonids but also created numerous opportunities for advances that ultimately led to the Queen’s death. Your sacrifice and leadership did not go unnoticed. Semper Fi.'



  Royal Jelly Awards:

  Elder Praetorian (BEL-259) is awarded the Royal jelly of proliferation: 'Each  abduct was a masterpiece of art, you have earned this jelly through sheer willpower and dedication. You have shown the talls the detrimental effects of working with an egg carrier, and hive cluster weeds, and much more. You have sway the talls away from our lands, even after the first queen death you still held on. Which allowed us to turn the battle around thanks to you. I will say it was worth watching you perform against these pathetic talls. May the Queen Mother watch over you!' by Prime Queen (PRO)

  Mature Carrier (KAI-430) is awarded the Royal jelly of proliferation: 'I will say you were one our original carriers, I may have not witness much, but I do know what we both know is true. You were an amazing carrier till the end, you massively impact the battle field with you supporting the only oppressor within our hive, and allowed the hive to essentially recover thanks to you. Ashame your death has occured, but I will not forget you, nor will the hive. May the Queen Mother guide you to the next life. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
