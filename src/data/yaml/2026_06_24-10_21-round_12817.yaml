roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Brady Ahmed, Donte Holmes.



  Royal Jelly Awards:

  Young Boiler (GRU-227) is awarded the Royal jelly of resilience: 'Young yet incredibly capable sister played a vital role in terrorizing the talls. She kept rotating, boiling, and aciding anything she could get her claws on, and poor talls just watched in despair. I am truly convinced that her melting of everything she came in contact with was literally a major key to victory! We hope to see our sister soon enough!' by Prime Queen (LIMA)

  Mature Hivelord (YO-808) is awarded the Royal jelly of resilience: 'Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Prime Queen (LIMA)

  Prime Praetorian (MIA-728) is awarded the Royal jelly of proliferation: 'For her incredible work as a carrier of supreme caliber, MA has deserved the royal award! Sister managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war, she was a partial mother to the rest of the hive as one of the two carriers. Oh how we becon MA to help the further hive expansion! May her children are plenty!' by Prime Queen (LIMA)

  Young Burrower (NB-204) is awarded the Royal jelly of sabotage: 'NB worked tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Always alive, yet always present on the front, how is that even possible?! NB you must help the hive again, your contributions is what makes us succeed.' by Prime Queen (LIMA)

  Young Drone (MW-547) is awarded the Royal jelly of proliferation: 'Sister MW proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Always at the front, saving her queen in times of need! No matter how many times she dies her talents will be of high demand! Help us MW, make us one of your great gardens.' by Prime Queen (LIMA)




