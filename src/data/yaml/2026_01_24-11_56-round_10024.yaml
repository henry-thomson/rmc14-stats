roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Saves-Lives, K-tac Madlack, Velsha Zarethis, Lune Pourpre, Tamika Ann, Kahani, Polishes-the-Boots, Dale 'The Gambler' Livosky.



  Royal Jelly Awards:

  Young Warrior (XX-918) is awarded the Royal jelly of proliferation: 'For your immense work since the beginning you were born.


  You had put your dedication straight ahead as a young praetorian, and a young mind as well. I am so proud of your work and growth.


  You did absolutely amazing for somebody who first started out as an oppressor.


  That was some crazy fishing skills, I hope to see more of that in the future from you.


  You do have potential, and I hope to see it go even higher.


  Rejoice!' by Prime Queen (PRO)

  Elder Defender (SUN-525) is awarded the Royal jelly of resilience: 'Since the beginning you arrived.


  You were in charge of being a hive leader and taking lead of nest duty, over and over you would get tier 1's back to do patrols with you, or whatever activity that made it best for the hive!


  You made it where they don't go to the front line where red dot exist and proceed to get eradicated because of your dedication.


  It was tiresome work, but it was definitely great to see you pull it off.


  Keep it up! rejoice!' by Prime Queen (PRO)

  Elder Hivelord (RIK-876) is awarded the Royal jelly of proliferation: 'For creating the entire nest south east of research habitation,  mainly by you.


  Your tiresome work was noted, and I acknowledge the fact that it should be rewarded for such hard work.


  Builders all around are appreciated, but your dedication alone is always worthwhile to see.


  I hope you don't grow bored doing these roles, as you make the world a better place as you remake it in the hive image.


  Rejoice! You earned it' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
