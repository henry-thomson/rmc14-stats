roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  The Fruit of Intensity, The Lilac of Calmness, Silvie Wible, Althea Leander.



  Royal Jelly Awards:

  Elder Hivelord (WL-697) is awarded the Royal jelly of rejuvenation: 'For your work as the build lead, constantly building our hive and helping encircle the talls to finish the battle once and for all. Without your quick response, they may have pushed us back. Well done.' by Prime Queen (HEK)

  Ancient Drone (FL-566-W) is awarded the Royal jelly of rejuvenation: 'For your work saving your sisters,


  I heard you have saved many of our tier threes. Our deaths are not shrugged off so easily, and these efforts allowed us to retain our sharp claws so that when the time came. We could strike the killing blow.


  Thank you, you are truly a boon to any hive.' by Prime Queen (HEK)

  Ancient Carrier (EEP-291) is awarded the Royal jelly of proliferation: 'For your efforts making sure our hive was not only trapped, but felt alive.


  Talls dared not cross into our backlines, no one came to aid the encirclement. I believe these are your efforts manifested. Thank you.' by Prime Queen (HEK)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



