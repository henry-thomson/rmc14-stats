roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joshua Lee, Pepper Sharp, Jezala, Urist Graniteheart, David Davidson, Crafty 'Never Dies' Scuttlebug, Kit Gomez, Drinks-the-Razorium, Hugo Knapenberger.



  Royal Jelly Awards:

  Prime Praetorian (MIA-196) is awarded the Royal jelly of resilience: 'MIA, once again you prove to be the BEST DANCER that a queen can have, I AM EXTREMELY PROUD OF YOU TODAY.

  Againts all odds, and after losing most of our hive, you got capture, after capture, after capture in every single scream. I was worthy to witness how you even got that annoying boomsticker that denied many captures to us.

  Thanks to you, the hive can rise again once more from the brink of defeat.

  And again, I am really proud of you.

  With love, LAG.' by Ancient Queen (LAG)




