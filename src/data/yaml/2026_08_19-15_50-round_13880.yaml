roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  Royal Jelly Awards:

  Prime Praetorian (FR-70-NC) is awarded the Royal jelly of proliferation: 'FRNC, one of my great dancers. You helped in the capture of many talls today, granting a chance at victory through numbers. You have also aided greatly in the wipe of talls at eye. Today wouldn't have been the same without you.


  For this, I award you this jelly of proliferation. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Praetorian (ZAI-648) is awarded the Royal jelly of proliferation: 'ZAI, You have been a key sister today, constantly making sure we would get at least one capture at every engagement. You have made the most out of our bad situation, and allowed us to come out victorious this day.


  For this, I award you this jelly of proliferation. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Ravager (FF-701-FF) is awarded the Royal jelly of resilience: 'FFFF, You have been my shield, my protector. You have been blocking spit with your own body all day and have even saved me twice doing this. I would not be here if it wasn't for you.


  For this, I award you this jelly of resilience. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)




