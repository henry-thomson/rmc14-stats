roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Olaf 'Fish-eye' Olafson, Minji 'Failsafe' Kilgrim, Alyssia Ryals, Rhys Hendricks, Komi, Axes-The-Lotels, Gregor Carlos, Gael Quirin, Davlat 'granddad' Lukin.



  Royal Jelly Awards:

  Elder Carrier (DI-221-ES) is awarded the Royal jelly of proliferation: 'For the greatest of dedication towards staying alive, capturing talls time and time again, being the ACE of all castest, it is with pride and joy that we have DIES is part of our hive. Her skills are of a legendary status, and we must have them help us again in the future!' by Ancient Queen (LIMA)

  Mature Drone (IV-2) is awarded the Royal jelly of rejuvenation: 'Sister IV proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Always at the front, saving her queen in times of need! No matter how many times she dies her talents will be of high demand! Help us IV, make us one of your great gardens.' by Ancient Queen (LIMA)

  Young Hivelord (CU-994) is awarded the Royal jelly of resilience: 'Our most honorable sister CU kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)

  Ancient Burrower (IRA-57) is awarded the Royal jelly of sabotage: 'If it is not obvious already, IRA is one of the most famous burrowers around! As is a custom, whenever talls see her, the know of their futility, they know that the moment they turn a corner they step into a trap, they know the moment they push one nest whole hive just tunnels into another! This war was proof of her skills, and yet again, IRA played the critical role of allowing us rotations, and security THE most decisive fight of the war. IRA, we can only hope you can help us again.' by Ancient Queen (LIMA)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
