  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Blobert Fonza, Kyriss 'Snow' Winters, Jamal Johnson.



  Medal Awards:

  Althea Leander is awarded the Distinguished conduct medal: 'You struck a blow on this day against a fould hive that would see us all dead. you not only killed their queen. but many of her honor guard


  Awarded by Maj. Tyr Ragnarson on 10/09/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Atlas 'Wolfy' Snowlight is awarded the Medal of valor: 'Captain. you have proven yourself to me a more than capable leader. and a good partner in the CIC. together we pulled off an amazing encircment that crippled the hive to non functionality. your valor in the CIC has been noted. and honored


  Awarded by Maj. Tyr Ragnarson on 10/09/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





