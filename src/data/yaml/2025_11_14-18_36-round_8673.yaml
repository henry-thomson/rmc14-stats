roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ruka, Salts-The-Fries, Drogar 'Snare' Greeneye, John Hunter, Stankashi Neuer, Munches-The-Ordinance.



  Royal Jelly Awards:

  Mature Ravager (WAR-113) is awarded the Royal jelly of slaughter: 'was the only ravagers in this hive. a first born. they fought hard. wiping more talls and protecting others. a sight to see, worthy of being looked up to by the hive... REJOICE!!!' by Elder Queen (HEN)

  Ancient Praetorian (RI-47-SK) is awarded the Royal jelly of rejuvenation: 'saving atleast half of the hive by her claw only. knocking down more talls than i can count on my claws. without her we wouldn't be here.' by Elder Queen (HEN)

  Ancient Praetorian (BEL-231) is awarded the Royal jelly of slaughter: 'being the one to pull in countless talls on the western caves while wall was being destroyed. scoring us a full cast wipe' by Elder Queen (HEN)

  Ancient Praetorian (YIP-575) is awarded the Royal jelly of slaughter: 'helping a lot in wiping casts at last. was the last puzzle piece to the victory of the hive. pulled in more than i can get with my scream. REJOICE!!!' by Elder Queen (HEN)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Arcturus's Xeno Pet[/color]![/bold]
