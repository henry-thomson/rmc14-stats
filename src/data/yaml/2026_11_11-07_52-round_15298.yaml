roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Ravager (REA-882) is awarded the Royal jelly of slaughter: 'REA was one of three ravagers who bravely stormed the talls and ceased their healing, cutting off their talls source of revival and crippling their hive. Your claws have rended and cut many, spilling the blood of these foolish talls. For that, you have been a major asset of our push.


  Rejoice.' by Elder Queen (MIN)

  Mature Ravager (DE-433-AN) is awarded the Royal jelly of slaughter: 'One of three ravagers who died for the cause, your sacrifice was a major part in forcing the talls to flee. You were a figure of fear to the talls and killed many. Though you may have lost your body, your mind lives on to continue your slaughter.


  Rejoice.' by Elder Queen (MIN)

  Young Hivelord (AU-545-L) is awarded the Royal jelly of resilience: 'A major part in our build, your leadership in constructing a hive the talls would slowly prick themselves to death on was a major reassurance to the hive, as they would always have a place to fall back on. Without your build, our hive would have no home.


  Rejoice.' by Elder Queen (MIN)

  Mature Ravager (PEK-326) is awarded the Royal jelly of slaughter: 'The final ravager of the trio who slaughtered the talls. Your sacrifice was not in vain as many talls fell to your clutches. Though you lost your body, your work pushed the hive forward. Without your abilities, the hive might have seen another fate today.


  Rejoice.' by Elder Queen (MIN)




