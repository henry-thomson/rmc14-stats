roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Iva 'Moff' Lynx, Sora 'Cat' Haiiro.



  Royal Jelly Awards:

  Ancient Drone (NUB-975) is awarded the Royal jelly of rejuvenation: 'Our main joy of the hive GIG, played a role of utmost importance! Always at the front, saving her queen in times of need. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. We can only hope she continues to help us the never ending slaughter!' by Prime Queen (LIMA)

  Young Hivelord (XX-487) is awarded the Royal jelly of resilience: 'Beyond a belief, our sister proved herself as an incredible show of resilience and survival! Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Through her talents and dedication, talls could not push one step forward! By the queen can we not even comprehend her true powers as she reaches older age!' by Prime Queen (LIMA)

  Young Burrower (ORI-206) is awarded the Royal jelly of sabotage: 'Although talls didnt even get out of the perch, ORI took care of always providing tunnels, saving multiple sisters, and with all seriousness giving us incredible potential to move around. You were the only burrower, and yet you proved your might! Help us ORI, and trap the talls in your mazes!' by Prime Queen (LIMA)

  Young Praetorian (AC-795-E) is awarded the Royal jelly of resilience: 'Although I don't award jellis to the combat sisters, this one is an exceptional one. ACEs powerful stomppers making tall dizzy and incapable of fight at just the right moment! They saved many of their sisters, me including!, and killed just as many talls, directly or indicredly. Help us ACE save even more sisters!' by Prime Queen (LIMA)

  Mature Boiler (ASH-208) is awarded the Royal jelly of slaughter: 'Well I will have to do it eventually. ASH needs no introduction, the legends are true, and they are part of the supreme handsomeness order, RP can confirm. ASH played a vital role and blocking any and all counter pushes, melt skin and bone as a boiler! ASH heals and ASH keeeeels! Beware of it is poisonous gas!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
