roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Drone (APL-868) is awarded the Royal jelly of resilience: 'During the time, when you first was born in the prime hive, you stood up to be my royal praetorian Valkyrie. During the engagement of Armory, South Perch 2. I was attempting to make a confirmed capture on a tall healer that would make attrition entirely more easier for the hive altogether.


  Because of your sacrifice you took the tube for of which I am grateful, your intent was noted. I thank you the bottom of my heart, may your resolve still shine throughout other chapters.' by Prime Queen (PRO)

  Mature Drone (LU-303-N) is awarded the Royal jelly of rejuvenation: 'During the engagement of Low Security, West of Engineering Ring.


  I was fatally stunned at a horrible moment, of which my death was most certain, but you decided to sacrifice your own body for the sake of rejuvenating my condition in the vital condition when needed.


  I'm actively impressed from that performance, the only hope I generally did really had was just a healer sacrificing, which you did.


  I wanna thank you for helping the hive along the way, may nobody shun your efforts in your future chapters. Rejoice!' by Prime Queen (PRO)

  Elder Drone (RY-267-N) is awarded the Royal jelly of rejuvenation: 'For being the only gardener to fuel me with alacrit, that of which scored and most certainly you were one of the main support of the hive, because every time I turned around I saw a glowing purple fruit in the darkness and it was made by you. I literally see you delivering it to me every time, and it made me do the greatest stuff ever, so I thank you. For actively doing your purpose and role in terms of support, perhaps you even did healing,  but I wanted to take note of the fact you were actively delivering me what I needed to conquer the talls!!!' by Prime Queen (PRO)

  Prime Praetorian (NU-646-LL) is awarded the Royal jelly of proliferation: 'Honestly, actively impressed on the captures you made. You were one our main capture tier 3 caste, and I thank you for removing annoying talls that I genuinely didn't want existing when I arrived first hand in combat.


  You made some wicked moves that I did account and honestly, they were pretty great. Keep up the good work as a prime as you are, and keep going forward in future chapters!!! Rejoice!' by Prime Queen (PRO)




