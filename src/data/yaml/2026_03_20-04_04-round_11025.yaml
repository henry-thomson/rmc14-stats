  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rayna Lexis, Jeremy Nguyen, Henry, Pepper, Rhys Hendricks, Autumn 'Cocktail' Sheauvern, Zoey Kimple, Bjorn 'Viking' O'Neil, Manuel Brinigh, Dimitri Orlovsky, Danny AW Macuahuitl, Pablo Sanchez.



  Royal Jelly Awards:

  Mature Hivelord (OSO-539) is awarded the Royal jelly of proliferation: 'Your efforts, and your labors, were the reason we won this war OSO. You constant building of the colony delayed talls long enough for the hive to enact our plans. Your contribution did not go unoticed, OSO. And for that, I thank you. For your dedicated building, your stalwart service, and overall excellent preformance, i give you this jelly of proliferation


  Rejoice, and stand tall. May you live long, and hive prosperously' by Ancient Queen (CMP)




