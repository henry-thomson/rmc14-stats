roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Kuafu Usta, Adeline Garland, Simon Walker, Frankie Winters, Neizv-Estni'.



  Royal Jelly Awards:

  Young Ravager (AN-227) is awarded the Royal jelly of resilience: 'This daughter stood the test of time, falling to no tall during the reign of the first queen. It was when I stepped in and started to lead the hive, this daughter sacrificed themselves for me, all that so i could have their empress for myself. They have earned this jelly of resilience through their actions and even more, their mindset.' by Prime Queen (GIB)

  Elder Drone (BL-889-U) is awarded the Royal jelly of rejuvenation: 'This daughter healed and healed me when i was fleeing with the talls empress, keeping me alive until i could safely escape. They fell in the heat of the spits, but they left their mark on the fight, saving my life and making our Queen Mother proud.' by Prime Queen (GIB)

  Elder Defender (BEL-702) is awarded the Royal jelly of resilience: 'This daughter was one of the two defenders blocking spit for me during my escape, earning them this jelly of resilience. Their mark on the battle exceeded this one singular moment, I fought beside them and learnt of their resilience first hand. They gave their body for the hive, and this great sacrifice must be rewarded.' by Prime Queen (GIB)

  Elder Defender (NOX-159) is awarded the Royal jelly of resilience: 'This daughter, although their deaths were many, their captures were even greater. Their slaughter on the talls earlier in the battle is to be admired at, but it is not the reason for this jelly. Their efforts to protect me from the tall spit during my run to safety with the tall empress, solidifies the fact, that they have earned this jelly of resilience.' by Prime Queen (GIB)

  Mature Ravager (OX-886-Q) is awarded the Royal jelly of slaughter: 'This daughter lived through two queens, slaughtering many talls in both our names. They lived for so long, when other ravagers surely would have perished. Their efforts have not gone unnoticed, especially by the talls. You daughter, truly deserve this jelly.' by Prime Queen (GIB)




