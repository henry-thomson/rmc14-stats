roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jaxson Alliman, Drinks-the-Razorium.



  Royal Jelly Awards:

  Ancient Ravager (LU-952-AN) is awarded the Royal jelly of slaughter: 'This ravenger made the ultimate sacrafice. When it came time she charged the tall ball head first. With no regard for her own life she cut down talls numberless. All ravengers shall remember her name! Bravo!' by Prime Queen (ARG)

  Young Carrier (WE-323) is awarded the Royal jelly of proliferation: 'During the preamble to the tall invasion we removed all the solid cover in the colony. However this did not stop my daughter from supporting the frontline. With no resin or walls to hide behind she dared to make sure captures were secured on the frontlines. We look forward to seeing the prime you are to become! Rejoice!' by Prime Queen (ARG)

  Elder Hivelord (IR-701-I) is awarded the Royal jelly of resilience: 'In the precursor to the tall invasion we removed all the cover and walls from the colony. With little time this hivelord rebuilt the cover as mother needed. Making sure frontline clusters were always in place. Without her efforts the hive would have surely perished this day. Bravo!' by Prime Queen (ARG)

  Young Hivelord (MW-393) is awarded the Royal jelly of resilience: 'In the precursor to the tall invasion, mother ordered the removal of all cover in the colony. Even with this, this daughter did not fear. She faithfully built the needed resin and ensured that there were always frontline clusters. Without her efforts this day, the battle would have surely been lost. Bravo!' by Prime Queen (ARG)

  Young Crusher (LI-574-MA) is awarded the Royal jelly of slaughter: 'The last of our 9 chargers. This daughter held fast until the very end. We prepared the whole colony for her arrival. And arrive she did, speeding through the battle lines of the tall invasion, she crushed, scraped, charged, blew though all obsticles in her way. She carries with her the dreams and hopes of all my other chargers who gave their lives. Her spirit is a testimony to them all. REJOICE!!' by Prime Queen (ARG)




