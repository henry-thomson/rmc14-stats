roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rex 'Judas' Dogston, Kaxafin Xerafin, Hudson 'Hungry' Demuth.



  Royal Jelly Awards:

  Boiler (MEL-94) is awarded the Royal jelly of slaughter: 'For your shortcoming, you rose during the most direst time, when the Hive required a guardian to halt the onslaught of the tall menace, the ones who existed only to cease our existence.


  You were the only hope of the Hive. You arrived when we were at our weakest, and you ended it swiftly, bringing the tall menace's onslaught to an end and securing a victory for the Hive.


  You came when we needed you the most, and you delivered.


  Thank you MEL.' by Ancient Queen (SVI)




