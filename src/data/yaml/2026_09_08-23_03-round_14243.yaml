roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Panacea, Is-The-Fish, Gallagin 'GC Addict' Caitman, Sylvester Ward, Garrett Baskett, Francis Simpson, Grendel Houser, Linsy Field, Licks-the-Wall, Grok, Guye 'Sticky' Leffree, Eats-the-Mice, Ei-Az, Exi-Brize, Kahiruki, Wyatt 'Hoss' Cross, Wan Filey, Defends-The-Comrades.



  Royal Jelly Awards:

  Prime Ravager (JA-215-KE) is awarded the Royal jelly of slaughter: 'JAKE had a crazy plan on VAN that i was sure it would fail.


  2 healers.

  1 tall leader.

  2 smart spitter.

  18 talls total rotted at metal tin.


  Your rage did not blind you from your faith, and you kept killing even when i was away.


  Rejoice my dear sister, and that ash, dust and dead talls be eternally under you.' by Prime Queen (RP)

  Prime Ravager (AR-953-ES) is awarded the Royal jelly of resilience: 'ARES, our little Goddess of War, kills and slashes through many talls flesh. They are fierce, brave and loyal, and follow through every order i give. They had captured over 10 talls, and killed more than 30 leading into final wipe.


  For your kills, captures, and most impressively, being the only sister that lived through it all, even being our little gremlin sister knowing for getting to excited wiping and dying early, i will award you with this jelly of resilience.


  May your loyalty inspire many sisters, so that they flinch less while doing their orders... You are an example to the hive. Rejoice my dear sister!!' by Prime Queen (RP)

  Hivelord (XX-229) is awarded the Royal jelly of sabotage: 'For your grand work on building both remotely and reinforcing the hive, you made us able to wipe on caves and keep stalling on colony while i was away.


  You are a great sister that i adore much, even going by many names, i always will recognize you.


  Rejoice my dear sister, and may your build be as perfect as it is eternally!!' by Prime Queen (RP)

  Mature Ravager (SAL-704) is awarded the Royal jelly of proliferation: 'For your work capturing talls in general, especially capturing heavy boomsticker which is a huge stone in my shoe all by yourself, you are awarded with this dear jelly of proliferation!


  Rejoice my dear sister SAL, and may you keep dragging as you should, you did well today, hope you keep this up!!' by Prime Queen (RP)

  Ancient Drone (FIG-110) is awarded the Royal jelly of rejuvenation: 'For your tremendous work healing sisters and Queen alike together with sister DUK, you saved me dozens of times while low health. You are the backbone of our hive, and made sure that Queen wouldn't just throw in the towel.



  Rejoice my dear sister, and may you keep holding dear your beliefs eternally!!' by Prime Queen (RP)




