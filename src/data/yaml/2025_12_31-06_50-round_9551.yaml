  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Fabian Lester, Paduxi-Utamukeeus, Alec Houser, Denis Maclough, Robin Zephyr, Hakani Steelnest Pack.



  Medal Awards:

  Lai-Neetra is awarded the Distinguished conduct medal: 'Your experienced leadership led to an unbreakable defense at comms, no doubt securing our advantage over the entirety of Inspection Industrial-Juliett.'

  Astolfo MacGillycuddy is awarded the Distinguished conduct medal: 'During Inspection Industiral-Juliett, maintained a strong, formidable defensive line that was tested time and time again against the XX-121 hive present. They could not break you, your cades, or your spirit.'

  Mary Rose is awarded the Distinguished conduct medal: 'During Inspection Industiral-Juliett, maintained a strong, formidable defensive line that was tested time and time again against the XX-121 hive present. They could not break you, your cades, or your spirit.'

  Hakani Steelnest Pack is awarded the Bronze heart medal: 'During Inspection Industiral-Juliett, maintained a steady flow of intel throughout, despite the resistance of a ravenous XX-121 hive. You gave your life in service to the UN and her people, protecting the Intelligence Officers that eventually secured the nuke for us. Your name will be remembered.'

  Lobo 'Brownpant' Bonita is awarded the Distinguished conduct medal: 'During Inspection Industiral-Juliett, displayed exceptional combat prowess and offensive use of the M34 flamer, something that no doubt won us the operation. If each marine were as skilled as you, we would struggle no more long wars.'

  Jacob 'Hearse' Pope is awarded the Distinguished conduct medal: 'Showed excellent leadership prowess and clear, level-headed judgement, leading to the victory over the XX-121 hive on Fiorina's Science Annex.'





