roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jun Hao, Ilas-Teegla, Roman Lamphugger, Ricky Fischer.



  Medal Awards:

  Sergeant Yeo 'Sakura' Bunnia is awarded the Distinguished conduct medal: 'Sergeant Yeo Bunnia took initiative during an optimistic marshall's push following an orbital bombardment, and following a scream from a xenonid queen bravely pushed forward to recover the pyrotechnicial specialist being gutted when the opening showed itself.


  We live and die through the help of our brothers and sisters in arms, you showed exemplary knowledge of such.


  Awarded by Maj. Kaitlin Zalack on 26/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





