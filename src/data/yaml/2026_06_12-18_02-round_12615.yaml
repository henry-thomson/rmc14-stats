roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Simon Mothman, Holding of Root, Elias Palehaven, Fat-Tail Chonker, Nasami, Dallas Weeter, Mao 'Cheshire' Mao, Rost-Ti, Azram Amberbarrel, Falls-from-Grace, Aurora Moffington, Blobby Oozeworth, Johnson Evilton, Jakob 'Shovels' Stough, Frank 'Pinkie' Salami, Ethan Strange.



  Medal Awards:

  Warrant Officer Severina Aleya is awarded the Distinguished conduct medal: 'At a pivotal moment and with cool and calm behaviour they stopped a potential crisis into an outstanding advantage. Their shots destroyed a large part of the xeno horde including many Tier 3's. Their ability to remain calm under pressure enabled the marines to tip the scales of balance firmly in our favour resulting in our eventual victory.' by Major Reed McMatherson





