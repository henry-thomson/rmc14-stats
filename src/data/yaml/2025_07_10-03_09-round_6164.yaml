  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Willow Temnora, Austin 'Un'Lucky' Eventide, Kalaveer 'Kala' Singh, Maple Leander.



  Royal Jelly Awards:

  Elder Praetorian (LL-514-Y) is awarded the Royal jelly of proliferation: 'As but a dancer, you secured valuable captures for the hive very quickly, shattering the talls hopes. Within my screams, you captured three smart spitters and valiantly helped me capture the lurker tall after it made a small blunder. For these feats, I award you with the jelly of proliferation! Good job dancer.' by Ancient Queen (SEA)

  Mature Hivelord (QU-29) is awarded the Royal jelly of sabotage: 'As a hivelord, you followed my orders to the letter, beautifully building up scrubland. Once I told you to, you began expand the scrubland hive and, upon the realization that they were being encircled, the tall queen pulled back their forces. For this great service to the hive, I award you the jelly of sabotage.' by Ancient Queen (SEA)




