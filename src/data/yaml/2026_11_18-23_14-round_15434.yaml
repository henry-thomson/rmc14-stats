roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Charlie Chasney, Florian Casset, Licks-The-Beans, Peucemus Reedriel, Kana, Liberty AW Falchion, Vallerie Nemura.



  Royal Jelly Awards:

  Ancient Hivelord (BOX-534) is awarded the Royal jelly of resilience: 'Our build designer from the very start of the hive. When mother requested a daughter, this mind rose to the challenge. Crafting resin through the tall invasion, you have been our main source of cover for much of the battle. Where you went, protection and saftey followed. I thank you for your dedication to our hive. Rejoice!' by Prime Queen (ARG)

  Elder Ravager (CU-449-L) is awarded the Royal jelly of sabotage: 'Our shield in this fight, our claws in the dark. You have covered and swiped through every engagment with mother. Providing critical cover to our captures, your carapase has shielded the hive and their queen. You have shown wisdom and grit of a mind twice your age. I look forward to seeing the prime you will one day become! Bravo!' by Prime Queen (ARG)

  Prime Lurker (MAD-159) is awarded the Royal jelly of proliferation: 'A textbook example of the perfect interception lurker. On every engagement you ran ahead of mother and chose a tall. That tall met its doom at your claw. You had faith that your queen would follow you into danger, always putting yourself at risk, you are a true example to the hive. Rejoice!' by Prime Queen (ARG)




