roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Josephi 'Meowlamo' Catkowski.



  Royal Jelly Awards:

  Elder Ravager (RNG-490) is awarded the Royal jelly of slaughter: 'At the climax of our battle, we broke the feeble doors of the tall bird, and rushed inside to slaughter the pathetic tall army. While I was unfortunately not able to stay inside the bird, you and your other sisters valiantly fought while outnumbered by a magnitude of over 10. Despite the odds, however, you and your other sisters pulled through and completly took out the entirety of the tall fighting force. At the end of the massacre, with your other sisters lying dead on the floor, you alone stood triumphant amidst a sea of tall corpses. Though you later unfortunately perished to the backup tall force, this achievement cannot be understated or underlooked. I find you fully deserving of the jelly of slaughter.' by Prime Queen (SEA)




