roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Desmond 'Dose' Mercer, Guy Snyder, Donna Otis, Arnie Sauter, In-The-Middle.



  Medal Awards:

  Sergeant Aurora 'Birdcage' Lockheart is awarded the Distinguished conduct medal: 'Remaining calm and collected while being able to communicate clearly and rapidly to any given situation. Pushing the hive and saving two captured IO's alone. You have shown great courage in the face of extreme adversity.' by Major Reed McMatherson





