roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nezuni-Arksai.



  Royal Jelly Awards:

  Prime Ravager (JA-161-KE) is awarded the Royal jelly of sabotage: 'JAKE captured Tuber, Longspitter and Empress. Not only that, but they had wiped many as a ravager, and when they died to defend a young sister, they came back as defender and ensured the gray bird as safe for me to return.



  Rejoice my dear sister, and may this magical day be in your memories. You have done me a great favour all this time, and i owe you big time for all you have done.


  Thank you my sister JAKE! Rejoice on this great Apex Day!!' by Prime Queen (RP)




