roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Elijah Clarke, Juan  'NOT CORTEZ' Gonzalez, Hickmania Simus.



  Royal Jelly Awards:

  Elder Hivelord (AL-5-X) is awarded the Royal jelly of resilience: 'Our amazing sponsor: Queen mother. Has given us a HUGE amount of plasma to provide a PRIZE for the best contestants I've seen today!! ALX. You are one of the only builders I have seen today throughout the hive! With the amount of times I have been tubed and saw you STILL building and weeding exactly where I needed it was incredible. Its almost as if I was watching a show myself instead of hosting one! You've helped, build, capture and drag within my glorious hive and for that I reward you with... This here Jelly! Rejoice!!' by Queen (HOST)

  Ancient Praetorian (VV-92) is awarded the Royal jelly of rejuvenation: 'Seccond sister I want to invite here will be suprising to most however in my eyes they seem like the most important candidate. I have been tubed today many times. I have tasted the caraprace piercing tubes... Way too many times for my liking.. Whilst it may be true you weren't here to save me for the first time... Or seccond time... You have saved me the moment I needed it most. Whats that moment you may ask? Obviously it was the final round!! Just before we gibbed the empress and JUST before the king was reborn. If you haven't saved me then the hive would have been annihilated and the empress left... UNGIBBED!!! Your assistance throughout the hive is trully appriciated. For that I reward you with this here Jelly. Rejoice!!' by Queen (HOST)




