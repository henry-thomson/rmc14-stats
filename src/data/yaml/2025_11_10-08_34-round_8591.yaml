roundEndText: >2-

  Sent to clear out a CLF Cell and recover a HVT Executive, the Marines succeeded in killing . . but swung too far, their bullets striking down the HVT before he could even speak.


  Their actions resulting in an opening on their dropship, they found themselves caught with their Platoon Commander as a hostage.


  Careful negotiations would secure them the hostage back, but a fit of rage would cause the vest to trigger.


  Verdict : CLF Minor.




