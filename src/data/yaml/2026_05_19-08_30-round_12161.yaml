roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Second Lieutenant Amaryllis 'Alice' Alison is awarded the Bronze heart medal: 'Sacrificed themselves by sending the south lifeboat along with the queen and the majorty of her horde with them. This act alone deserves significant praise and enabled us an actual chance to escape. Your sacrifice won't ever be forgotten.' by Major Reed McMatherson



  Royal Jelly Awards:

  Elder Ravager (REA-758) is awarded the Royal jelly of slaughter: 'As a Berserker, you fought exceptionally well against the tall menace, even when the odds were stacked against you. Through sheer fury and murderous instinct, you annihilated the entire caste in a single brutal evisceration, aiding your sisters and preventing further preventing their death.


  But the slaughter have it outcome, you have fallen under the tuber menace without the valkrine to assist you, may you live on to another planet. Prevail. My. Daughter.' by Elder Queen (FEAR)

  Ancient Praetorian (PO-988-NY) is awarded the Royal jelly of proliferation: 'You, through your unmatched performance against the Tuber menace, saved me and raised me from the grave so I could stand once more and wipe out the entire caste alone. By your sacrifice and fury, you single-handedly carried the legacy of the Hive with your life and my trust. 


  Live on my daughter.' by Elder Queen (FEAR)




