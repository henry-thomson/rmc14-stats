  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Mature Warrior (SU-367-N) is awarded the Royal jelly of slaughter: 'Rewarded for excelling in repelling and capturing talls, and punting them into fires in a most saucy way. Their salubrious service ensured the growth of our hive.' by Elder Queen (REE-806)

  Young Burrower (TI-893) is awarded the Royal jelly of resilience: 'The furtive burrower, so easily forgotten. But within them lies the soul of one dedicated to  providing a means to accesing the frontline, as well as traps.' by Elder Queen (REE-806)

  Boiler (SC-633) is awarded the Royal jelly of slaughter: 'Boiler, O Boiler. No amount of praise is overmuch for one so noxious and essential against the tall invader. Your clouds blunted their pathetic assault as the strongest resin blunts metal.' by Elder Queen (REE-806)

  Young Hivelord (XX-820) is awarded the Royal jelly of rejuvenation: 'Essential to any hive, YOU hivelord have provided many nooks and hivespaces for us to recover and fight from. Boilers in particular sing your praise in the great hive above.' by Elder Queen (REE-806)

  Young Lurker (RS-865-K) is awarded the Royal jelly of sabotage: 'Though your captures were quite normal in quantity, you reported locations dilligently- and furthermore made great effort to remove any lights or communications the talls may have levied against us.' by Elder Queen (REE-806)




