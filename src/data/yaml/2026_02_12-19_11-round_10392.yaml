roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Polishes-the-Boots, Mizooki 'PillBug' Akiya, Paduxi-Utamukeeus, Diarsia 'Dima' Maxima, Izabella Orbatos, Gnaws-on-Bones, John 'Arsonist' Spade.



  Royal Jelly Awards:

  Prime Ravager (GUH-937) is awarded the Royal jelly of sabotage: 'One of my many Hedgehogs in this battle, they gave there life assaulting a tall position. But this is not why they are awarded this day. During the battle there cunning and wit lead to many captures, calling out key rotates. For this effort they are awarded, they have made the ultimate sacrifice. Rejoice!' by Ancient Queen (ARG)

  Young Hivelord (GDP-845) is awarded the Royal jelly of resilience: 'Our designer hivelord, has been crafting hives from the very beginning. There resin spans the colony, there determination unmatched. There efforts were critical in creating a noose around the talls neck. They showed true grit this day. Bravo!' by Ancient Queen (ARG)

  Prime Praetorian (FLA-25) is awarded the Royal jelly of resilience: 'When the call was given for old minds to take up the charge of the valkyrie. This daughter did not hesitate. Through this battle they have stayed by my side. On at least two occassions they saved our frontline hogs from near certain death. They are not known for being a valkyrie, but they make the best of daughters. Rejoice!' by Ancient Queen (ARG)




