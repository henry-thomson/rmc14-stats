roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Flames-The-Plasma.



  Royal Jelly Awards:

  Mature Carrier (AKI-417) is awarded the Royal jelly of proliferation: 'I want to reinstate the fact that the eggs you placed south of admin was so tremendously helpful I would praise you a thousand fold, those were genuinely one of the great reasons why everything went as smoothly transition for captures, so I want to thank you for helping tremendously out by putting every tall we capture to sleep with your egg placements, especially the one south of admin.


  Rejoice for your effort was amazing!' by Prime Queen (PRO)

  Mature Drone (XX-845) is awarded the Royal jelly of proliferation: 'You were working eagerly for the hive, and for that I implore your efforts and wish to tell you that every wall built every construction was worth even if all was never foreseen, your work was noted, and for that you get the jelly of proliferation for your hard dedicated efforts.


  Enjoy.' by Prime Queen (PRO)




