roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Jatayu 'Nerd' Corvuson, Sato Ach-Menoe, Chews-the-Wires, Kain Weller, Emiko AW Kaiten, Ollie Aluru.



  Royal Jelly Awards:

  Prime Drone (UWU-918) is awarded the Royal jelly of rejuvenation: 'During ciritical moments in the battle against the tall, when mother was nearly defeated, this daughter dove in to save mother. Her constant flood of plasma and healing enabled mother to wipe the talls inside reactors. Without her efforts the battle could have been lost. Bravo!' by Prime Queen (ARG)

  Prime Praetorian (FOX-26) is awarded the Royal jelly of slaughter: 'During the final moments of the tall invasion, this sister dove forward into the talls lines with no regard for her own life. Cutting down talls left and right, her claws ensured that no tall escaped our hive. Rejoice!' by Prime Queen (ARG)




