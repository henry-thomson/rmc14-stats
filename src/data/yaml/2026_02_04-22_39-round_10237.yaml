roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sylwen 'Crybaby' Ashvale, Jorge Poppa, Ezekiel Strax, Vin 'Birthday girl' Peyton, Izabella Orbatos.



  Royal Jelly Awards:

  Mature Hivelord (MI-505-M) is awarded the Royal jelly of proliferation: 'For making insane nasty frontlines, and including uncontested areas later down the road. I want to bestow this reward of jelly for your great work in regards of your career as our hivelord.


  You have done amazingly well! You were an absolute unit!


  Rejoice!' by Prime Queen (PRO)

  Young Carrier (XX-758) is awarded the Royal jelly of proliferation: 'Since the beginning you were base carrier, to egg carrier strain.


  You have help the hive through it all, putting your best forward, not to mention you were an absolute support carrier through it all!


  When I died at north of aero, an risen once more, you were the true key to the master plan!


  You were amazing carrier, that should always look back on this jelly as a good foot forward in the right direction!


  Great job young mind!


  Rejoice!' by Prime Queen (PRO)

  Ancient Crusher (TA-175-NK) is awarded the Royal jelly of resilience: 'You were absolute TANK, you ensured the survival of the hive with your expertise of being a warrior when I was in ovi south east of research habitation.


  You then made several engagements near botany, and even came forth in the finale of eradicating the talls by myself.


  You did amazing, other sisters also believed you did amazing well done overall!

   Rejoice!' by Prime Queen (PRO)
  Young Drone (LUA-811) is awarded the Royal jelly of rejuvenation: 'Since the beginning you were born, you provided substantial amount of healing to wherever front you went to.


  You were a key drone to the survival of the hive, by making greater resin fruits and many others! to support all your sisters!


  Rejoice! You did amazing!' by Prime Queen (PRO)

  Elder Praetorian (REE-213) is awarded the Royal jelly of rejuvenation: 'Since the beginning you have help the hive in your best way possible!


  You saved a crusher north east of aerodrome, when they got tubed, and did a really beautiful save that made me actually weep tears.


  You saved me, I believe you did, east of botany when I got tubed at a critical moment to end the battle once an for all against these fable talls!


  Overall, you did above average than the normal valk can pull off in a battle, and you should look back on this jelly for the work you have pulled off!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
