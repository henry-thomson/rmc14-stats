roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Spits-The-Fire, Harald Hammerson, Alan Licht, Hark Willson.



  Royal Jelly Awards:

  Ancient Lurker (ALT-739) is awarded the Royal jelly of sabotage: 'ALT had captured many of the talls, alongside grabbing the tubed on top of a dot whereas tuber also had their team. With my support, we were able to get tuber and gib him.


  However, none of this would be possible if not for their lunges. They did an amazing work and i am proud of them.


  Rejoice my gambler, and may your results be plentiful!!' by Prime Queen (RP)

  Ancient Defender (JA-165-KE) is awarded the Royal jelly of resilience: 'For your efforts in defending and trapping the beast out, in both of your defenders lifes, i reward you with this jelly of resilience.


  May your braveness be learned by many of your hive.


  Rejoice my dear sister, and may your defender fu be taught for every sister on the hive!!' by Prime Queen (RP)

  Elder Ravager (CRO-577) is awarded the Royal jelly of slaughter: 'For your work capturing, leading the hive, and killing the beast tamers, i award you with this jelly of slaughter.


  Rejoice my dear sister, and may we keep our hive united eternally!!' by Prime Queen (RP)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
