roundEndText: >2-

  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Kameron Clewett, Dalham Huggman, Speedy 'Explosive' Garrison.



  Medal Awards:

  Evelyn Fitzberg is awarded the Distinguished conduct medal: 'Evelyn Fitzberg, as the Delta smart gunner slew a great number of xenonids upon the colony of Solaris Ridge, through the simple yet effective warfare tactic of providing suppressing fire for our marines. It is thanks to your efforts that the operation went so well today.


  Thank you!'

  Sadie Sims is awarded the Distinguished conduct medal: 'Sadie Sims, as a humble rifleman stepped up for the extra responsibility of giving our CAS pilot targets to shoot at. It just so happened, and I believe this to not be a fluke or simply luck, that their targets were utmost effective. One of their signal flares lead to the demise of both a praetorian and a Queen - truly a master of JTAC.'

  Alicia Evergreen is awarded the Distinguished conduct medal: 'For their absolutely stellar work as Hospital Corpsman, Alicia Evergreen was responsible for saving many lives today as we dived head-first into the caverns filled with the gnashing teeth and bubbling acid of the xenonid menace. 

  Thank you!'





  [bold]Operation funded by [color=green]Iantha Atikson[/color]![/bold]



