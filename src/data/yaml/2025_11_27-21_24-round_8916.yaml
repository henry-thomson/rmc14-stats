roundEndText: >2-

  And thus ended the CLF cookout in the caves of Bosenmori Basho.


  While the chef and her guards may of,, mostly died on the way out,,, and then the survivors were arrested,, they did at least get enough product picked up to make it all worth it.


  Nine tanks of the illicit chemical known as "GC", and the corpse of their leader were extracted in a truck off the coast of the cooksite. 



  CLF Minor.




