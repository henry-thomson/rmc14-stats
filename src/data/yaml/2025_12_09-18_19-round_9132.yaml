  Hey all

  Sorry you didn't get your CLF greenshift as promised, but I hope this take and hold was an adequate enough replacement. I hope i'll get to actually run that planned map soon after I figure out what the heck happened.


  I hope you have a good day, OR night wherever you are. I'm off to go make some bread pudding now. Yum, bread pudding.




