  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Altair 'Christmas' Nightwish, Lily Evans, Charlie 'Sweats-Off' Westoff, Guy Irwin.



  Medal Awards:

  Malik Fulton is awarded the Distinguished conduct medal: 'For exemplary leadership as Executive Officer and for providing clear, timely callouts that greatly assisted me in decision making during operation Recon Valiant-Staple, on Trijent Dam.


  Awarded by Col. Freya Locke on 02/05/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





