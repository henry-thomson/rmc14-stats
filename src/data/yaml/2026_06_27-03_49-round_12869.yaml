roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Alaric 'Slab' Torkilsson, Samuel Evans, Gonzalez Creamer, Emiliano'Alcoholic'Staliano, Guitar Fish, Barsuk Nikolaev, Joshua Lee, Tristan Long, Beedo Waggin, Dac Muc, Lily Padding, Sibylle Vael, Anastasia 'Butterfingers' Saylor.



  Medal Awards:

  Staff Sergeant Stares-at-Stars is awarded the Distinguished conduct medal: 'While serving as a Squad Leader during Inspection Hotel-Goblin, Stares-At-Stars led their squad to kill two xenonid queens, over six tier three xenonids, and greatly assisted in clearing out the city of Hybrisa Prospera from the infestation that had over taken it. You are truly a shining example of leadership and represent all an NCO should be.


  Awarded by Maj. Danielle Sparks on 6/27/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Danielle Sparks





