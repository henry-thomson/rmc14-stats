roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ezra 'Mayfly' Dietrich, Crimestoer 'Claymore' Mauler, Junco, Buster 'Geezer' Alter, 'Salami' Kalami, Sharie 'Damsel' Hexane, Erdis Murnter, Anne 'Artichoke' Powell, Yuri Martinez, Long-ears Lucas, Jay Stark, Rex 'Judas' Dogston, Erin Mizushima, Ruff Holt, Eva Takoda, Absurdist-by-Nature, Vornak Hunter, Lenny 'regicide' Kuster, Alexis 'Concord' Mayfield.



  Medal Awards:

  Second Lieutenant Manuel Miller is awarded the Bronze heart medal: 'You did what anyone could ask of you, and you paid the ultimate price. He managed to gather intel deep within the hive, and even managed to sneak in repairing sensors just in time for us to see Queen attempting to head to FOB and breach it. Saving the operation for a time. Well done. 


  Awarded by Lt. Colonel Breaks-the-Tides on 7/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Corporal Nezoli 'Streetrat' Sharpfeather is awarded the Medal of valor: 'Despite early losses of your brothers and sisters, you carried the torch of your previous SL, and lead your team to victory. Amazing direction, cohesion, and communication. You are exactly what the UNMC needs in Leaders. On this day, we salute you. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 7/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Corporal Vince Vale is awarded the Medal of valor: 'Countless Xenos were killed to your work with a grenade launcher. Where you walked, death was right beside you. I counted several occasions where you successfully killed multiple Xenos at once down a choke, completely denying their control. The UNMC, no, the universe needs more like you.


  Awarded by Lt. Colonel Breaks-the-Tides on 7/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





