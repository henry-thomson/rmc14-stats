  [color=green]All of the xenos were wiped out![/color]


  Medal Awards:

  Noriko Shisune is awarded the Distinguished conduct medal: 'Personally escorted General Sinclair to the FOB amidst the chaos of battle today. Good work.'

  Amaya Mint is awarded the Distinguished conduct medal: 'Excellent shooting today, your rockets rang true and many xenonids were felled to your explosive power - including a Queen type xenonid!'

  Anthony 'Basilisk' Abrams is awarded the Distinguished conduct medal: 'Built a great deal of fortifications that we utilized during the operation today. In a discipline that frankly lacks appreciation, you stood out today.'

  Zenari Morgan is awarded the Distinguished conduct medal: 'Excellent work leading Charlie squad today. Communicated well with CIC, provided OB coords and feedback, kept their marines effective.'




