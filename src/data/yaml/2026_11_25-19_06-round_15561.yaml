  Bluish Tato, Moss-Boy, Victoria Valdez, Elijah Clarke.



  Royal Jelly Awards:

  Elder Hivelord (TA-719-ZO) is awarded the Royal jelly of resilience: 'You and OLD choked the tall meance to death with resin. They must of had resin posioning from all the work you made them do. Well done. Thank you daughter.' by Ancient Queen (EKAJ)

  Mature Hivelord (OLD-379) is awarded the Royal jelly of resilience: 'You and TAZO choked the tall meance to death with resin. They must of had resin posioning from all the work you made them do. Well done. Thank you daughter.' by Ancient Queen (EKAJ)

  Mature Ravager (WAL-865) is awarded the Royal jelly of slaughter: 'WAL, my mature HOG, you have done amazing work in wiping the divers at aero. I am proud of you. You have a talent I see in your eyes for ravager. Embrace the slaughter. Good shit daughter. Thank you daughter.' by Ancient Queen (EKAJ)




