roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Connor Bell, Bor Borington, Titus Wheelian, Rosie 'White Paw' Celeste, Shira Asher, Tato 'Crispy' Prank, Gives-The-Fish.



  Royal Jelly Awards:

  Elder Boiler (CO-722-SM) is awarded the Royal jelly of slaughter: 'Although I don't award jellis to the combat sisters, this one is a beyond exceptional one. COSM is the true pride of the hive, they lived to the bitter end! Only died because of my mistakes, i am sorry I let you down. Please, I beg! Honor us with your presence in the future hives once again! You survival and power is unmatched!' by Prime Queen (LIMA)

  Elder Hivelord (M-240) is awarded the Royal jelly of resilience: 'Incredible work M, beyond exemplary work as a lord of a major caliber. It was unfortunate our plan to kill of the cowards at eye failed, however you were the one to pull it off in the first place! No doubt your life will be filled with more tall corpses, and I cannot wait to see you once again!' by Prime Queen (LIMA)

  Elder Ravager (NS-753-KO) is awarded the Royal jelly of slaughter: 'Although I don't award jellis to the combat sisters, I have to make another exception. NSKO, you clawed your way through the tall corpses, killed them all, and allowed us death. Blessyou!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]Isadora AW Brooke's videos of Marine Mess-ups[/color]![/bold]



