  Royal Jelly Awards:

  Praetorian (RE-358-M) is awarded the Royal jelly of resilience: 'REM, today you did everything you needed to. You have saved countless daughters and even mother a few times.


  I should of died 3 times over that fight but since you were here i didnt. You kept me going and kept giving the hive hope with your brilliance.


  For this, you get the royal jelly of resilience. REJOICE!! For mat your talents prove useful for hives to come.' by Elder Queen (NSKO)

