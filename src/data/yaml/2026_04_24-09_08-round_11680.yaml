roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joshua Lee, Na 'Juno' Mao.



  Royal Jelly Awards:

  Mature Crusher (OG-859-RE) is awarded the Royal jelly of slaughter: 'Sister proved time and time again her undying loyalty to the hive. OGRE not only stayed constanly rotating along side the queen, but they walked the incredibly thin line between an agressive warrior and a dead warrior. Their talents were clearly proven when they managed to catch a special tall off guard and solo captured them. Talls were in total chaos! We must hope that OGRE helps the future hives as well!' by Ancient Queen (LIMA)

  Ancient Drone (RI-733-KI) is awarded the Royal jelly of rejuvenation: 'For RIKIs incredible work keeping the hive always fresh and battle ready, we are deeply greatful! Our sister allowed a continuos slaughter of the talls, constant weeding, and unending terror for the invaders. May she bless us with her presence and healing skills in our future endeavours!' by Ancient Queen (LIMA)

  Mature Hivelord (TTT-961) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls, although this award belongs partially to the rest of the lords as well. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Ancient Queen (LIMA)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
