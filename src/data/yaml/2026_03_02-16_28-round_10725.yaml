roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Salts-The-Fries, Iris 'Goobia' Cookia, Tamika Ann, Elijah Clarke, Reed McMatherson.



  Royal Jelly Awards:

  Prime Ravager (KR-29-IS) is awarded the Royal jelly of resilience: 'KRIS was my loyal knight that endured since the start of our hive, even after i dying twice they kept wiping and capturing talls.


  Rejoice my daughter!! May your determination be eternal!!' by Ancient Queen (RP)

  Praetorian (XX-121) is awarded the Royal jelly of proliferation: 'XX-121 was our Praetorian that kept on backline getting captures with the backline gang.


  Rejoice my daughter!! May your captures be plenty!!' by Ancient Queen (RP)

  Mature Carrier (CHO-491) is awarded the Royal jelly of slaughter: 'CHO as a berserker ravager did a wipe on biogen together with DAVE, with eventually snowballed into their frontline wipe.


  Rejoice my daughter!! May your wipes be plenty!!' by Ancient Queen (RP)

  Mature Praetorian (DA-90-VE) is awarded the Royal jelly of slaughter: 'As a base praetorian, together with CHO, they wiped biogen which eventually snowballed into the frontline wipe.


  Rejoice my daughter!! May your wipes be plenty!!' by Ancient Queen (RP)

  Elder Drone (WA-21) is awarded the Royal jelly of rejuvenation: 'As our loyal gardener, WA kept healing the frontline sisters which allowed them for quick recovery.


  Rejoice my daughter!! May your joy be eternal!!' by Ancient Queen (RP)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
