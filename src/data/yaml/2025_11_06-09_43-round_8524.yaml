roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Smokes-the-Blunts, Reed McMatherson, Shei-Nakuma, Ricardo Rohtin, Denise 'Omen' Demise, Ted Nighteyes, Velenys 'Elfie' Thalorien.



  Royal Jelly Awards:

  Prime Ravager (KR-699-IS) is awarded the Royal jelly of slaughter: 'One of my first borns that lived to the end. This sisters showed why ravagers are the most fearful caste once more. Their timely slaughter, dragging captures in critical moments helped this hive to live. They were my backbone. Rejoice, KRIS! Queen Mother would be proud of your feats' by Elder Queen (LOL)

  Young Carrier (FE-147-W) is awarded the Royal jelly of resilience: 'One of the first born sisters that stood until end and helped me secure many captures that would be lost otherwise. They did the what an Eggsac carrier should do the best. Rejoice! You are most deserving of this jelly. Queen mother would be proud of you!' by Elder Queen (LOL)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



