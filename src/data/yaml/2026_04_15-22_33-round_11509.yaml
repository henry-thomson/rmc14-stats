roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Silas Fielding, Antoine Tchou, Cecelia Church, Lockie 'Venator' Demuth, Iris 'Silkweaver' Softcoat, Deeza Roundhouse.



  Royal Jelly Awards:

  Young Burrower (EI-854) is awarded the Royal jelly of sabotage: 'EI is awarded with the jelly of Sabotage, one of few i ever give. They burrowed bravely into a heavy mounted spitter user, killing them and opening the way to breach perch.


  Rejoice my daughter!! May your trickery be eternal!!' by Prime Queen (RP)

  Prime Hivelord (ZAO-133) is awarded the Royal jelly of rejuvenation: 'ZAO is awarded with the jelly of rejuvenation for the amount of clusters and builds they did. They literally were the backbone of our hive granting us the victory, even in a colony hard to build like this one.


  Rejoice my daughter!! May your foundation be eternal!!' by Prime Queen (RP)

  Mature Boiler (PO-724-NY) is awarded the Royal jelly of slaughter: 'PONY did a great amount of boils with my screeches, including the hivemind siege and on the perch first breach.



  Rejoice my daughter!! May your boils be eternal!!' by Prime Queen (RP)

  Elder Boiler (IRS-51) is awarded the Royal jelly of slaughter: 'IRS is awarded with the jelly of slaughter for the numberous boils at nexus and cargo storage, which allowed to stall, kill and capture talls.


  Rejoice my daughter!! May your acid be eternal!!' by Prime Queen (RP)

  Ancient Ravager (NEV-425) is awarded the Royal jelly of rejuvenation: 'NEV captured multiple captures that i thought it was impossible, even being old they still got it in them. They were my loyal knight who saved me at every moment and captured many, being crucial to our victory.


  Rejoice my sister, may this your final jelly as an Ancient Ravager, so that you can truly show us your Eternal Prime.' by Prime Queen (RP)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
