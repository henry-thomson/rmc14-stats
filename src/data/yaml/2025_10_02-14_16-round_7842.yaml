roundEndText: >2-

  After scraping by all their combat encounters with the unknown menace on CORSAT, the Sun Riders exfiltrated, having accomplished none of their objectives and finding nothing out about what happened to the researchers, or how the creatures came to arrive to the facility.


  Down seven marines and some ammo, the Sun Riders will now have to sit and wait until they get some hopefully easier work.


  And it seems a new distress signal is ringing out into the cosmos from a city nearby,,,




