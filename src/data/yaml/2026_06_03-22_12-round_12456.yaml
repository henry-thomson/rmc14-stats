  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nat 'The Silly' Rosesteel, John Mcdoe Pimm, Godfrey Muller, Stares-at-Stars, John Miller.



  Medal Awards:

  Second Lieutenant Trixie De Launay is awarded the Distinguished conduct medal: '2nd Lieutenant Trixie De Launay for over 2 hours continued to support her department in medical. She made well over 100 bottles of pills and helped out consistently. At the recommendation of your Chief Medical officer you are reciving this medal for your exceptional good work today.


  Awarded by Colonel Sicilia Drakonovisch on 06/3/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch

  Staff Sergeant Ashley Winters is awarded the Bronze heart medal: 'Staff Sergeant Ashley Winters give it their all to their squad during today's operation. With determination in the face of resistance Ashley upheld cohesion and communicated effectively throughout the entire operation. Keeping their squad together allowed us to continue for as long as we did. Tragically dying while leading their squad to the very end.


  Awarded by Colonel Sicilia Drakonovisch on 06/3/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch



  Royal Jelly Awards:

  Mature Warrior (VOW-642) is awarded the Royal jelly of resilience: 'VOW, today you worked together with the build team to efficiently build up all areas that were asked of you. While your prior body was obliterated, your resin still stood fast.


  Your work today with the team is what caused us to win the day. If not for you and the team of builders we would have stood no chance against the tall onslaught.


  YIP!!' by Ancient Queen (YIP)

  Young Spitter (WL-540-W) is awarded the Royal jelly of resilience: 'WLW, today you worked hard as a lord to build up every single area that YIP asked of you. Without your work today together with the build team we would have stood no chance of wining.


  While your body may have been obliterated, your impact was not lessened. You should be proud of your efforts and continue working together with sisters in the future to get more glorious build. Together you're always stronger than alone.


  YIP!!' by Ancient Queen (YIP)




