roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Calvin Crux, Wulfrun Blue.



  Medal Awards:

  Lance Corporal Dante Minnie is awarded the Medal of valor: 'Lance Corporal Dante Minnie significantly assisted the operation by risking and sacrificing their own life to sneak behind enemy lines, deep into a xenonid hive and catching an Ovi Queen by suprise. Eliminating her where otherwise we would've evacuated.


  This action increased the morale, hope and progress of the operation by an extend that should be remembered.


  May your rest in peace Marine, knowing your sacrifice was worth it.


  Awarded by LtCol. Kaitlin Zalack on 12/08/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





