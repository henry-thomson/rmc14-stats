  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Drone (VV-329) is awarded the Royal jelly of rejuvenation: 'VV, You have saved the lives of many sisters. You were even selfless enough to sacrifice yourself to save your sister SAL, a key sister in today's victory.


  For your great work, I award you this jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Boiler (SAL-118) is awarded the Royal jelly of slaughter: 'SAL, You were our last living boiler. You have provided sister with the boils necessary for cover AND slaughter. You have bullied the beast constantly and protected the evil eye.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Ravager (EF-492-EE) is awarded the Royal jelly of proliferation: 'EFEE, your work in the backline has been noticed. You have captured many talls and have given me the information I needed today to allow for our victory.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)




