roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Gold Moonshine.



  Royal Jelly Awards:

  Mature Warrior (BO-354-B) is awarded the Royal jelly of sabotage: 'BOB, today you managed to secure the tuber for a gib. A great job that ultimately sealed the fate of all the encircled talls.


  Without the gibbing of the tuber we may have lost many more siststers in this battle. Though thanks to your bravery we managed to end their final hopes of survival.


  Keep working this way for the future and you shall reach great heights!


  YIP!!' by Prime Queen (YIP)

  Ancient Ravager (SVI-899) is awarded the Royal jelly of proliferation: 'SVI, today you showed the true strength of the hedgehog. Your great spikes shielded you from any harm while your shed filled you with great determination.


  You managed to make capturing look easy with the number of talls you captured. Easily more than 10, possibly even 15. YIP is proud of your work. Do keep working like this in the future to bring strength to all hives in the future.


  YIP!!' by Prime Queen (YIP)

  Elder Drone (VAN-868) is awarded the Royal jelly of rejuvenation: 'VAN, you are YIP's second ever royal gardener, and you delivered. Not once did you let YIP go hungry for spore, not once was an alacrit not in YIP's claws.


  Your great work as gardener today has helped us secure 3 captures with the spore. You clearly are a very capable support and know how to keep alive long enough to make the hard work worth it.


  YIP!!' by Prime Queen (YIP)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
