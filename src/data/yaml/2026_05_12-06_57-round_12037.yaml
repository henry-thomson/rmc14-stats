roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bailey.



  Royal Jelly Awards:

  Ancient Warrior (ULI-616) is awarded the Royal jelly of proliferation: 'ULI, today was a short battle, but not one without mistakes. YIP managed to die to a moment of recklessness. The evil tuber showed why it is to be feared by all.


  Luckily, you ULI, managed to take care of said tuber shortly after removing it and expanding our hive in the process. Your fearless attitude pays off with the great captures you achieve.


  The battle may have been too short for you to gain a record number of captures, but the value of the ones you got is not to be downplayed.


  YIP!!' by Ancient Queen (YIP)




