  [color=purple]The xenos hijacked a dropship[/color] [color=green]but were wiped out by the marines![/color]


  In memoriam of our fallen soldiers:

  Molto Quibbles, Satoru Cook, Neeth 'Bulwark' Kraal, Wisdom 'Blueshield' Hook, Xaaqquex Teqxuq, Paulie 'Wiseguy' Mozarelli, Olive Orr, Desmond Pickles, Kalaveer 'Kala' Singh, Klein Moretti, Smoke Perkins, Avalon 'Goose' Bone-Mender, Sivali, Sava ''Echo'' Stojki, Itsee Shou-Bitsee, Sebastian Wallick, Ivan 'Robusto' Castro, Ielenia Amastacia, Spike MacLagan, Nyzora Lioren, Guui Gaius, Purp Winter, Cinder Eikuni, Seeks-to-Fight, Vander Conwern, Zhenkar Velmara, Onurai-Xal, Austin 'Spectre' Eventide, Shoots-for-Moon, Alvin Grant, Hugo McHuckle, Junal-Okaw, Rico 'Bites' Fletcher, Beatrix Nightflitter, Aurora Starseeker, Chris 'Crispy' Bacon, Sadie Sims, Hyde Yoseff, Teagan Flemming, Deed-Okaw, Giovanni 'Esgio' Guess, Clumsy Bob.



  Medal Awards:

  Iris Cookia is awarded the Medal of valor: 'After being left behind by their allies, evacuated the corpses of multiple marines and managed to escape. Their actions directly saved the lives of multiple who would have otherwise been lost for cert'

  Clukay 'Heckler' Koch is awarded the Medal of exceptional heroism: 'With Lieutenant Mechty Koch, managed to slay the mature XX-121 queen on a standstill operation, resulting in the hope for victory as evacuation was being considered.'

  Mechty 'Sleepo' Koch is awarded the Medal of exceptional heroism: 'With Clukay, managed to slay a mature XX-121 queen and grant hope of victory to a failing operation, in addition to their intel work that allowed us to proceed with enhanced strength.'





