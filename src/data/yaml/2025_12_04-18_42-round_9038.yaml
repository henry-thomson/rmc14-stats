roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Samuel 'Cabbagehead' Bairstow, Corinne 'Damp' Royce, Nya 'Kitkat' Firestar.



  Royal Jelly Awards:

  Ancient Carrier (MIU-403) is awarded the Royal jelly of proliferation: 'You were a highly impactful carrier on the main front line. You made eggs, traps, that was highly impactful during it key moments.

  I believe even capturing the purple leader if I am not mistaken.


  To convey you did more than just your role, you help win the battle with your support when I needed it the most.


  May your work be forever remembered, Rejoice!' by Prime Queen (PRO)

  Warrior (REH-622) is awarded the Royal jelly of proliferation: 'You were the beast, the warrior in the dark.


  Every engagement, you made the talls suffered from your attacks, and ensured captures amongst them as well!


  You made it easier to remove backlines talls when needed, and even removed the tall lurker that was creating issues!


  May your work be forever remembered, as you have made a new hive! Rejoice!' by Prime Queen (PRO)

  Young Crusher (XE-46) is awarded the Royal jelly of resilience: 'You were a shield, a knight in shiny carapace, no talls were ever able to harm me nor your sisters in combat. 


  I want to thank you for the amazing performance you did as a young crusher, you made sure captures were not killed. Ensured my well being during combat.


  Every engagement you always did your best, and providing what you can to the hive.


  For this, you deserve this jelly! Rejoice!' by Prime Queen (PRO)




