roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Warrior (XX-474) is awarded the Royal jelly of resilience: 'Even though you were learning and many more actions lay out before you, your fate had plans. You became a warrior eventually and fought out north of cargo, taking out a couple of talls before your downfall. However that enough show me you were learning in the correct way so I am here to encourage that.


  Your death brought down two talls that I loved getting removed regardless of how impactful it was, I thank you from the bottom of my heart, and that you will not be forgotten. Rejoice!' by Prime Queen (PRO)

  Young Burrower (KZ-272-N) is awarded the Royal jelly of rejuvenation: 'Sacrificing yourself when I was near the brink of death east of cargo. Regardless of the result of it actively actually saving my life, I thank you for doing it because this performance should be appraise on anytime it occurs. always be willing to sacrifice yourself for the greater good holds the best purpose of them all.


  May you continue to strive forward when you take the path of Healer Drone.' by Prime Queen (PRO)

  Young Boiler (MW-485) is awarded the Royal jelly of resilience: 'For consecutively boiling through all dangers that laid before you, you always committed with boils, that even I had to shield you to get your effort through. 


  Albeit, it was dangerous, it came out just fine for you and you made great boils for the hive that was needed when it was.


  Thank you for performance young boiler, keep it up.' by Prime Queen (PRO)




