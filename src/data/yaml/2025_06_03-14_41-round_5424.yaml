roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Jack 'solid serpent' Lensten, Herbsquirto, James Ludlow, Attacus Moondancer.



  Royal Jelly Awards:

  Ancient Boiler (HAZ-675) is awarded the Royal jelly of resilience: 'For their efforts during the tall siege on our cave hive, they ensured that no talls could make significant progress, as well as allowing me to harass their backlines. Their gas choked out all of the talls and denied many talls from saving their own. Without them, I would not have been able to execute my plans, so they did me and queenmother very proud.' by Prime Queen (GIB)

  Elder Carrier (MAR-193) is awarded the Royal jelly of proliferation: 'This daughter proved incredibly useful in assisting on infecting talls. They ensured every single tall had a child in them. They ensured no one would die carrying captures. They brought great profileration to our hive with their eggs. During our first screech, they immensely helped secure 5 captures, getting us to an incredibly strong start.' by Prime Queen (GIB)




  [bold]Operation funded by [color=green]Iantha Atikson[/color]![/bold]



