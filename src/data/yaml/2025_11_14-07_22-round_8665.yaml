roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Simon Sandford, Clarie Juszczyk, Andrew Bunten.



  Royal Jelly Awards:

  Mature Spitter (MO-638-TH) is awarded the Royal jelly of sabotage: 'When you were a sentinel, MO-TH, you fough by my side, during a certain engagement helping in the backlines.  You help spit at a smart spitter, that of which would of been faster than me, but no! you decided to declare their fate with only one slow spit, that declare their life sold to the hive!


  May you be forever a menance in the future against all enemies, and that all shall fear the sentinel that applies their abilities at the right time.


  Rejoice! You deserve this jelly!' by Prime Queen (PRO)

  Mature Hivelord (CA-850-S) is awarded the Royal jelly of proliferation: 'You were a hivelord till the end of time. None was left uncheck in your eyes, all lands were resinified in your claws.


  You created pinwheel after pinwheel, and followed commands perfectly when needed the most.


  The creation of the unknown vessel nest spot was definitely vital for the hive that of which made it where, we could continue to make captures safely, and ensure that we were victorious in battle. 


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (EF-422-E) is awarded the Royal jelly of proliferation: 'You were the grand architect daughter of the hive, you ensured that structures were made flawlessly, and proficiently when needed the most. 


  You help made south west caves, where hivecore was made.


  You ensured other areas was created with well built forticiation by your claws, without these we wouldn't have a place to fall back to, I want to say you have done an excellent job for this battle!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Arcturus's Additional Pylons[/color]![/bold]



  [bold]Hive established by [color=purple]Arcturus's Xeno Pet[/color]![/bold]
