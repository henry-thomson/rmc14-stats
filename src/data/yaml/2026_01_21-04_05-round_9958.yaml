roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joe Rose, 'Sandbag' Sariel, Xyros 'Cade' Vult, Edouard 'Butter' Jenkins, Nisha Helm, Lune Pourpre, Jack Cuban.



  Royal Jelly Awards:

  Young Drone (MU-972) is awarded the Royal jelly of sabotage: 'Sister MU did such an great job that they deserve two jellies: Of Sabotage and of Rejuvenation. Sister MU did an absurd amount of traps with sister FOOL, but not only that, they also sacrificed for me in an critical moment. Even being Young, you already seek greatness.


  Rejoice, my child, and i expect even more great deeds from you in the future!' by Elder Queen (RP)

  Ancient Praetorian (RAD-785) is awarded the Royal jelly of resilience: 'RAD was my Valkyrie Praetorian since the start. They have saved me multiple times and did an great job at saving all of hive multiple times. For that, i will give to them the jelly of Resilience!!


  Rejoice!!' by Elder Queen (RP)

  Elder Ravager (AR-760-ES) is awarded the Royal jelly of slaughter: 'ARES was an ravager two times, and in both of their lifes they were an great killer that helped hive multiple times. I hope you inspire more ravagers to be like you!



  Rejoice!!' by Elder Queen (RP)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



