roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Randy Ironbrow, Tony Guiseppe, Bob Barret, Gallagin 'GC Addict' Caitman, Ups-The-Downs.



  Royal Jelly Awards:

  Mature Runner (NHH-634) is awarded the Royal jelly of resilience: 'You were born in a location undesirable for any sister. 


  Matter not, you pulled through, you reached out to me and I tried to bestow what blessings I could.


  You had a mission to try to sabotage the talls creations on their hive, your courage in your attempt was noted and that of which I couldn't ignore.


  For that you are being bestowed the jelly of resilience for your bravery to face the unknown, and doing your best.


  Ashame you died, but you are always remember in my heart.


  Rejoice!' by Prime Queen (PRO)

  Mature Carrier (GU-260-H) is awarded the Royal jelly of proliferation: 'For your devoted attention to the frontline at all times, leaning in giving your all to wherever you could. You have ensured the frontline always had eggs to make it easier for your sisters to make captures.


  I love it when I see support always doing their hardest, even though you are not the one killing, your the one giving it your all, so enjoy this jelly, and be proud of your work. It is always appreciated.


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Kate's Mercenary Funds[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
