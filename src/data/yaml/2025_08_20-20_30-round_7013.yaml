roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Adam 'Fractured' Johnson, Moses Blyant.



  Royal Jelly Awards:

  Young Hivelord (AH-530) is awarded the Royal jelly of resilience: 'This daughter built up the hive incredibly well, their resin stood against the tall queens army of talls. Queen mother would be proud of their resin, despite their young age, they knew how and where to build. Rejoice!' by Prime Queen (GIB)

  Mature Hivelord (PI-180) is awarded the Royal jelly of sabotage: 'Their resin stood strong and they stood even stronger. Their might to keep pushing on and build the hive for my daughters to fight in inspired everyone to fight better. Incredibly work!' by Prime Queen (GIB)

  Mature Hivelord (NO-386) is awarded the Royal jelly of sabotage: 'Their indomitable spirit let them keep pushing the talls backlines, securing us an incredible flank. They worked incredibly well with their sisters and served the hive very well!' by Prime Queen (GIB)

  Elder Hivelord (AMK-151) is awarded the Royal jelly of sabotage: 'This daughter led the hivelords to build the backlines strongly, they lifted the other sisters up and helped them build. To the hivelords they were a bastion of resistance and a sister they inspired to be. Rejoice!' by Prime Queen (GIB)

  Young Hivelord (XX-554) is awarded the Royal jelly of resilience: 'The jelly of resilience is a jelly awarded to the most resilient daughters, and this daughter was resilient. Through skyspit and skyfires, they survived, their carapace staying strong. Though many scars covered their body, they pushed themselves to pull through and build the hive. May other young daughters learn from you.' by Prime Queen (GIB)




