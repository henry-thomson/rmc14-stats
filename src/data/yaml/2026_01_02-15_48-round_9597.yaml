  Kayla Svart.



  Medal Awards:

  Aaron 'Lockjaw' Wall is awarded the Distinguished conduct medal: 'Commended for exceptional performance during Operation: Operation Bird-Honey.


  2nd Lieutenant Wall worked tirelessly inside the chemistry lab to ensure that all of our Corpsmen were fully supplied with advanced life-saving equipment.'





