roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Cooper Howe, Sawyer Stough, Duke Bunten, Talia 'Lifesaver' Deneuve, Rodney 'Baus' Thenbrack, Manuel Miller, Andrew 'Hamfist' Honk, Alice Song, Oswald Black, Altay ''Syntax'' Khan, Amos 'Gorilla' Ramos, Paulie 'Conman' Zarroni, Titus Wheelian, Adrian McKnight.



  Medal Awards:

  Staff Sergeant Olivia 'Haze' Prospero is awarded the Distinguished conduct medal: 'Staff Sergeant Propsero you lead Charlie through the thick of it, your Squad kept together pushing the crucial chokes. You also got me many of the OB coords needed for our quick and rapid assault. Without your leadership we would have never gotten to here and for that I thank you.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Atlas 'Wolfy' Snowlight





