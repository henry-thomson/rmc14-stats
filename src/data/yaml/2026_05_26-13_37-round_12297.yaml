  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jacoby Zaun, Quiet Maplewood, Bahami.



  Royal Jelly Awards:

  Elder Hivelord (VOW-367) is awarded the Royal jelly of sabotage: 'This daughter was our ONLY hivelord for much of the battle with the talls. Not only were they dedicated in their efforts to build up our hive, at a critical moment in the battle for north perch this daughter  was essential. They braved stick and spit to build defences preventing the recovery of the red caste. we all wish to be like you one day!' by Prime Queen (ARG)




