roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Socrates Lightseeker, Fenrir 'Loud-mouth' Kahler, Leonard 'Breacher' State, Blue, Scott Newage, Ikaros 'Storm' Aoboshi, Paduxi-Utamukeeus, Turner Parker, Ian Langely, Greedy Morgan.



  Royal Jelly Awards:

  Mature Hivelord (EE-873-F) is awarded the Royal jelly of sabotage: 'Since the very beginning of our hive this sister has been constructing grand designs. Although they do not like to lead, sisters have flocked to follow them. They lead a build team through the build phase and continously built the hive long after. There efforts allowed us to out manuver the tall invasion and claim victory. Bravo!' by Ancient Queen (ARG)

  Ravager (AT-704-K) is awarded the Royal jelly of resilience: 'This daughter of mine did not fear the talls. When the invasion came they vowed to shield others with their thick hide and punish those who attempted to harm others. At a critical juncture in the battle during the storming of garden, this daughter shielded mother and another ravenger enabling there escape. For their work today they will be remembered. Rejoice!!' by Ancient Queen (ARG)

  Mature Praetorian (EI-954) is awarded the Royal jelly of resilience: 'My valkyire daughter, although your hide is not as thick as others, you never failed to charge headfirst in the support of our ravengers. Through your efforts you saved many a sister who would otherwise have been cut down by the tall invasion. Your efforts this day have not gone unoticed. Rejoice!!' by Ancient Queen (ARG)

  Prime Burrower (AID-752) is awarded the Royal jelly of proliferation: 'My daughter has filled many roles this day. But above all they have imparted knowledge onto newer minds. This takes dedication, patience and experience. Any daughter willing to take time to teach others is worthy of recognition. Today the hive noticed and you were nominated for your efforts in proliforation of hive knowledge. May all our sisters be as wise as you one day! Rejoice!' by Ancient Queen (ARG)




