  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jane Holiday, Noelle Dollfuss, Axel Fitzroy.



  Royal Jelly Awards:

  Prime Drone (FO-286-OL) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself to save a ravager who possibly could of died without your help. I thank you for doing this as it provide them a 2nd chance in the battle Of Fiorina. Rejoice!' by Prime Queen (PRO)

  Ancient Drone (RW-437) is awarded the Royal jelly of rejuvenation: 'You sacrificed yourself for a sister near the brink of reaching the end of their life. You were also doing non stop healing and providing phermone support to all your sisters.  I thank you for doing so, for all the wonderful support you have done for this hive. Rejoice!' by Prime Queen (PRO)




