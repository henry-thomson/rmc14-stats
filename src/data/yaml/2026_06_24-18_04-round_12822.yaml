  Except from the article "Bosenmori Basho Crater" on WeYapedia:


  Due to the (Hyperlink Broken) incident, the former colony sank into the earth below it, as the explosives started a series of mass cave ins.


  Now, more than (REDACTED) years later, (Hyperlink Broken) is thinking of rebuilding the colony to it's former state, through state of the art construction techniques.


  In memoriam of our fallen soldiers:

  Mia Adler, Speer Hai, Luna Pine.





