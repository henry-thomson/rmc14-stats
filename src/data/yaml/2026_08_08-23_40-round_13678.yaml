  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lady McMullen.



  Royal Jelly Awards:

  Prime Praetorian (FR-935-NC) is awarded the Royal jelly of resilience: 'FRNC, your talons and tail slashed through the talls resin like it was nothing, your body moving through the wind like it was floating. I have no other words than it was what dancers should be for our hive, so today I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)

  Prime Hivelord (VY-263-NL) is awarded the Royal jelly of proliferation: 'VYNL, When we awoke on this desolate place it was bare and raw, however you rised with resin in your claws and mouth and decided no longer to be touched by the tall filthy claws, instead it is our home for our young to flourish and thrive. Today I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)

  Prime Warrior (TO-739-MB) is awarded the Royal jelly of sabotage: 'TOMB, you are a sister that is old however just as exciting to watch as a young, your dedication and work with RAD was amazing to witness creating many captures to keep our hive healthy. I reward you this Jelly today to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)

  Prime Carrier (RAD-473) is awarded the Royal jelly of rejuvenation: 'RAD, You have always been a backbone in our hive, creating many eggs and many captures for our hive to continue flourishing even after my mistakes, I cannot thank you enough for the work and support you did today with TOMB. So I reward you this Jelly today to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)




