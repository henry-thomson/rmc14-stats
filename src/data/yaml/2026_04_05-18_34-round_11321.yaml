roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Dora Kirkov, Holden Wilkerson, Ying Xiu.



  Royal Jelly Awards:

  Ancient Praetorian (ALT-818) is awarded the Royal jelly of resilience: 'vI want to state thank you for creating a time gap opportunity to exploit when you made a noticable aggression action at Engineering, where you slow down talls just enough for results, and that result was satisfactory because actually I able to get captures and was well done commitment, even though I lost you, I gained more from it, so I thank you for your sacrifice.


  Rejoice!' by Prime Queen (PRO)

  Elder Drone (SPX-841) is awarded the Royal jelly of resilience: 'You were one of our main healers of the hive, even healing me quite alot, and generally being a supportative main front line support that was needed.


  Thank you for taking care of everybody and doing your valuable duty as our healer.


  You saved 2 sisters, and died many times in the act of the duty of the hive, for that you deserve this jelly for profound dedication an effort.


  Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (KRS-825) is awarded the Royal jelly of rejuvenation: 'For providing essential warding, you were one of our main combat support orientated caste that focused around removing negative effects from sisters, and also were the only valk in line of combat.


  You saved a boiler from my recollection and that is a key detail I remember because it actively did save them, and also many others around me.


  So thank you for doing your part at a excellent pace, rejoice!' by Prime Queen (PRO)




