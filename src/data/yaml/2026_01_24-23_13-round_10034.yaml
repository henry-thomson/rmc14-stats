roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Hates-You, Julianne Eckhard, Faces-The-Music, Slamington Steele, Dell 'Terra' Dellitrasse, The Herb of Highness, Kolilo Southstar, Mishel Zumacher.



  Royal Jelly Awards:

  Prime Hivelord (RO-383-CK) is awarded the Royal jelly of sabotage: '"A hive should be a place of suffering."

  ROCK is a great hivelord that do helps us a lot, the creator of hell hive, and a sister who truly helps us to win whenever their resin comes into the scene.


  Rejoice!' by Elder Queen (RP)

  Prime Hivelord (SIP-536) is awarded the Royal jelly of sabotage: '"The strength of the Resin is only as strong as the Hive."


  SIP is the oldest Hivelord who likes a lot Cross Resins, being one of the most trusted builder in the hive. May your wiseness become immortal into our hivemind.


  Rejoice!!' by Elder Queen (RP)

  Prime Hivelord (ZAO-791) is awarded the Royal jelly of sabotage: '"The talls will break themselves upon my resin."


  ZAO is one of the most trusted minds in the hivemind, who says that they build literally their soul, showing great experience and a lot of castes and great building experience.


  Rejoice!!' by Elder Queen (RP)

  Prime Praetorian (PRO-810) is awarded the Royal jelly of proliferation: 'PRO did amazing captures, capturing the tall lurker and killing the tuber. A well-known hivemind that deserves the best of the best.


  Rejoice!!' by Elder Queen (RP)

  Ancient Hivelord (WIL-492) is awarded the Royal jelly of sabotage: '"Excellence is not an art, it's pure habit, we are what we repeatedly do."


  Sister WIL is a amzing hivelord who likes the old-fashioned pinwheels, who inspires new hivelords everyday. 


  Rejoice!!' by Elder Queen (RP)




