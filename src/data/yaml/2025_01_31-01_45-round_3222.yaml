  Medal Awards:

  Lune Pourpre is awarded the Bronze heart medal: 'As the Bravo scout, was an absolute terror for any xenonid looking to prowl in our backline. Scored double digit kills before eventually being captured by the bug menace. A most excellent performance,'

  Stares-at-Stars is awarded the Distinguished conduct medal: 'A most faithful honor guard. Stood by my side, assisted me with logistics duties. Went above and beyond, in this regard.'

  Commet Brown is awarded the Distinguished conduct medal: 'Did an excellent job handling the logistics of Delta squadron and providing OB coordinates to the CIC during the operation today. A job well done, to be sure.'



