roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hates-You, Rhys Hendricks, Stares-at-Stars, Larry Lacewing, Erin Baker, Kyriss 'Snow' Winters, Aireen Lavigne, Luna Temnora, Selina 'Cavity' Alara, Ryan Murphy, Jamal Johnson, Nora Vera.



  Royal Jelly Awards:

  Ancient Praetorian (RAD-967) is awarded the Royal jelly of proliferation: 'This daughter as a valkyrie not only distinguished herself by saving multiple of my daughters. She was also cirtical in secureing captures in mothers assaults. She put her own life on the line to grow our hive, and for this she deserves our respect!' by Ancient Queen (ARG)

  Prime Crusher (MRT-818) is awarded the Royal jelly of sabotage: 'The mind of this daughter cannot be understood by normal sisters. At a critical moment in the tall invasion she suggested a terrible core location. This in fact proved incredibly effective thanks to her efforts in the talls rear. Her continued sabotarge of the talls efforts make her truely a worthy daughter of praise!' by Ancient Queen (ARG)

  Ancient Crusher (TA-65-NK) is awarded the Royal jelly of slaughter: 'Young defenders wish to be as fearless as you when they grow up. Time and time again I witnessed you charge through the tall battle ranks, killing as you went. The confusion you created was critical in our victory. No place was safe from your might. Bravo!' by Ancient Queen (ARG)

  Mature Praetorian (AR-534-F) is awarded the Royal jelly of resilience: 'This daughter gave her life for the hive. Nominated in her absence by her sister SOL. Together they performed chain grabs as oppressors, capturing many talls. Not only did she make the ultimate sacrifice. Her efforts stalled the talls advance and left a notable impression on her sisters. We rejoice at your efforts and your loss in battle!' by Ancient Queen (ARG)




  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



  [bold]Hive established by [color=purple]Rubylord SIP.[/color]![/bold]
