  [color=purple]All of the marines were wiped out![/color]


  Medal Awards:

  Dargir 'Thunder' Coalbelly is awarded the Distinguished conduct medal: 'As the Alpha SGO, scored a great number of kills and kept their barrel firing throughout the entire operation. You gave them hell today, and went through it, too.'

  Kyra Cowart is awarded the Distinguished conduct medal: 'Excellent leadership of Delta this operation. You kept the marines together and focused, making sure their killer instinct could manifest itself.'



  Royal Jelly Awards:

  Hivelord (XX-423) is awarded the Royal jelly of proliferation: 'For surviving till the very end of the war, you have never stop building. Not even once, I believe because of your effort there was main benefit from  your structures. Rejoice, you have done excellent' by Prime Queen (PRO-332)

  Ancient Hivelord (OPA-522) is awarded the Royal jelly of proliferation: 'You survived from the beginning to end, I bestow on you the jelly of proliferation, for rapid production of resin walls in their backlines and also front lines. Well done.' by Prime Queen (PRO-332)

  Ancient Hivelord (ZAO-508) is awarded the Royal jelly of proliferation: 'this one is mainly pointed toward you since you were mainly was building behind the talls. I commend you greatly for your efforts, mainly because without that part where you would rebuild areas talls' by Prime Queen (PRO-332)

  Young Carrier (FM-35-L) is awarded the Royal jelly of proliferation: 'For maintaining your life to the end of the great tall war. I commend you for maintaining count of the parasites and informing me as queen. Also by ensuring captures are nested in safe locations. Rejo' by Prime Queen (PRO-332)




