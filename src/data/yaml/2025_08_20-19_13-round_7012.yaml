roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Agustin 'silver' Villanueva, Terrence 'T'Chankla' Chenkla.



  Medal Awards:

  Mizuno 'Kitty' Drakonovisch is awarded the Distinguished  conduct medal: 'Mizuno and their team alone held strong and firmly against a gnashing xenonid hive as they attempted to escape from the caverns. Strategically, they bought us enough time to deny the xenos any and all sort of control or resistance in the colony, so that we were able to focus our efforts on the caves and caves alone. In this sense, they were paramount to our victory today.


  Awarded by Col. Scraps-the-Copper on 8/20/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





