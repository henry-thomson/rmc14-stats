roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Alice Firewatch, Nathaniel Sagan.



  Royal Jelly Awards:

  Mature Drone (HA-245) is awarded the Royal jelly of rejuvenation: 'Congratulation Mature Drone HA-245. You were at the right place, at the right time. Your healing saved my life, during the fight at fitness, you have shown excellent commitment to your role, healing everybody you could. That save was amazing and that of which I want to say you were amazing. I hope to see more healer saves like that from you in the future, may the Queen Mother watch over you. Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (FLA-250) is awarded the Royal jelly of proliferation: 'I want to say, you were amazing from beginning to end, there no denying that. You help achieve many captures from A BLock, Security, Fitness, then the finale Reactor. When the talls reached reactor, I believe that when you shine the most, because you weren't just making captures, you were stopping the entire tall front because they couldn't push forward without getting either killed or captured by your claws. Once again absolute phenomenal work, and hope to see more of that in the future.' by Prime Queen (PRO)

  Elder Praetorian (FOG-822) is awarded the Royal jelly of proliferation: 'Hello, Elder Praetorian FOG-822. You have shown your skills during the battle against the sky talls. Your effort was not ignored, in fact you done so well you earned this jelly for your many captures. Speaking of which the main point of interest was your effort at reactor choke hold, you shine the most there, and shown those talls to be afraid of an oppressor with the right support. I hope to see more of this talent of yours in the future, it was absolutely satisfying to watch you fight the talls, and make them get routed for their silly attempt to invade the hive. May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)




