  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Progradungula Tuxtlensis, Alkash Narkamaninov.



  Medal Awards:

  Staff Sergeant Scott 'Dad' Greaves is awarded the Distinguished conduct medal: 'For dealing with the arrest of the CMP and XO I am granting you this medal for your exceptional conduct today. It was rough and you were stressed but you pushed through. As the acting CMP you arrested more disorderly marines. Good work.


  Awarded by Colonel Sicilia Drakonovisch on 05/31/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





