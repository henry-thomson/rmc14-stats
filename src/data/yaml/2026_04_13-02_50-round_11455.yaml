roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Drone (BU-860-RG) is awarded the Royal jelly of rejuvenation: 'For  couragously charging in through fire and flames, you sacrifice yourself in for the betterment of someone else.


  You saved FIG-477 the Burrower, who was at death door, and you denied their death with such valid attempt, I thank you for pushing forward an ensuring your sister survival.

   Well done!' by Prime Queen (PRO)
  Young Hivelord (EM-375-O) is awarded the Royal jelly of proliferation: 'Since the beginning, after the crushing defeat of the planet talls, you were working really eagerly I think you built so much I was even impressed because of the fact I had to remote plasma transfer you like 10 and more times to keep you well supplied, genuinely good effort.


  keep up that actual impact of using all your plasma and quick thinking because that a the true way of a hivelord, and I implore you to keep that education.


  It is rare that I see an actual builder go so far to the point they are always dry out of plasma.


  May you make a thousand more walls! Rejoice!' by Prime Queen (PRO)

  Elder Boiler (ME-626-LT) is awarded the Royal jelly of resilience: 'For creating the tides of despair of acid and neuro globs that render many successful engagements, and siege attempts I am bestowing the jelly of resilience for your well performed act as our only last surviving boiler, who kept at it peak at all times.' by Prime Queen (PRO)




