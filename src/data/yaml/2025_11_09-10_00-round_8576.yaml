roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Drost Winter, Jack 'Solid' Lensten, Flint Larson, Chell Conagher, Icarus Nightflitter, Erebus Firebrush, Snow Fish.



  Royal Jelly Awards:

  Ancient Drone (MO-685-TH) is awarded the Royal jelly of rejuvenation: 'MO-TH, one of my backbones who allowed me to survive endless tall horde slaughters. Thanks to their timely heal I survived many situation that would be lethal otherwise. Not only that, their positioning allowed them to drag out many captures from my screech. If hive won today, it was thanks to their efforts. Rejoice! You are most deserving of this jelly! Queen mother would be proud of your feats!' by Elder Queen (LOL)

  Elder Hivelord (OK-583) is awarded the Royal jelly of sabotage: 'OK! One of my builders that endlessly build the backline and allowed me to recover from a lethal mistake. Thanks to their resin, we kept the tall horde atbay until I matured and allowed me to make a comeback. They are one of the daughters I am most glad I have. Rejoice! You are most deserving of this jelly! Queen mother would be proud of your feats!' by Elder Queen (LOL)

  Young Praetorian (KY-260) is awarded the Royal jelly of resilience: 'KY! You were one of our youngest yet you managed to survive until the end. Thanks to your effort, we secured many caps and stalled talls until I matured. I want to say this sister holds a promise of a bright prime praetorion. Rejoice! You are most deserving of this jelly! Queen mother would be proud of your feats!' by Elder Queen (LOL)

  Mature Warrior (EMP-516) is awarded the Royal jelly of slaughter: 'EMP! One of the daughters that helped me most in dire situation. Thanks to their clever positioning, they managed to drag many important talls which kept the hive going. Their help to hive is undisputable. Rejoice! You are most deserving of this jelly! Queen mother would be proud of your feats!' by Elder Queen (LOL)

  Elder Burrower (SIS-98) is awarded the Royal jelly of sabotage: 'SIS! One of the first born daughters that I am most proud to have! Thanks to their tunnels and traps we managed to secure the backline and turn the tides. Their feats are many, the talls they captured are countless. Thanks to their effort, we won today! Rejoice! You are most deserving of this jelly! Queen mother would be proud of your feats!' by Elder Queen (LOL)




