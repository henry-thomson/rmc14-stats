  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Joey Fartcoski, Carmen Sagan, Edward Eddies.



  Royal Jelly Awards:

  Ancient Drone (BRN-167) is awarded the Royal jelly of rejuvenation: 'For their unending dedication to growing their garden, keeping sisters safe, and backlines operational! May their garden grow lush and ripe with fruit!' by Elder Queen (JAN)

  Mature Burrower (CA-543-T) is awarded the Royal jelly of sabotage: 'Together with other burrowers CAT showed edless dewotion to digging a hole one after another. May her sisters experience her tunnels and future hives terrorize the talls!' by Elder Queen (JAN)

  Mature Burrower (CA-543-T) is awarded the Royal jelly of sabotage: 'Sister proved indispensable in digging tunnel after tunnel, giving no rest for the talls and allowing endless freedom of movement to hive and her sisters!' by Elder Queen (JAN)




