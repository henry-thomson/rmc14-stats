roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Avery 'apple pie' Cometrider, Erika Taylor, Clarissa 'Clara' Geladdux, Dawn Usta, Paul Durstine.



  Royal Jelly Awards:

  Elder Hivelord (AL-106-M) is awarded the Royal jelly of proliferation: 'You are being rewarded the jelly of proliferation, upon the great battle of soro, of which I am impressed of your dedication to making the encirclement way easier with your help. You were building since the beginning, and providing support where it counts. The talls ignored our encirclement, and then had to retreat and die thanks to your work. Rejoice!' by Prime Queen (PRO)

  Ancient Lurker (KV-413-AN) is awarded the Royal jelly of sabotage: 'Rewarding the jelly of sabotage on the capture of tuber, after you pounced on them as a lurker, you made it possible to capture them at colony power. This was taken place at soro, since their removal less tier 3's were destroyed because of that. Rejoice for your achievement!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]SireHambone[/color]![/bold]



  [bold]Hive established by [color=purple]Momma Kanin's Sandal[/color]![/bold]
