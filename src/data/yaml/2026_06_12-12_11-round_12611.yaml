roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alex Knightly, Paduxi-Utamukeeus.



  Royal Jelly Awards:

  Ancient Praetorian (FR-492-NC) is awarded the Royal jelly of resilience: 'For taking a tube for the hive, you ensure the capture of the tuber thanks to a accident that occured your death. I wish you were still here, it was a shame to lose you, but you made something out of it regardless. I want to thank you for that. thank you for the captures that were made it was a pleasure to have had you by my side when you were making captures within the battle field.


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (PEE-223) is awarded the Royal jelly of proliferation: 'You were one of the leaders I could lean on in ensuring other stuff could be done without my input or orders, I thank you for doing that. You made the entire fortification all around north west section of the battle field Of Shiva, Near the north telecomms. this ensured that I had the necessary defenses requires for future engagements. You also build the b ball nest for this was incase research hab interior falls, once again. Thank you for doing this it lets me focus on other stuff rather than trying to lead everything all at once. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



