roundEndText: >2-

  [color=lightblue]"Well, good news. We were able to salvage parts of June's blackbox. We don't really know what happened down there but we know for damn sure it wasn't good."


  "Most of her data is corrupted. We'll see about porting it to a contained backup fork we have, and see if that helps stabilize what we ripped out. then again, it won't fix a melted motherboard."


  "N-512 is considered lost. The area 50 miles around it is considered Condemned, and Weston Yamada is to maintain a persistent lookout for the area 100 miles around N-512's radius..."


  "As for the xenoarch team, they've lost most of what they had on the thing. Most of the members were out of town though, so we'll need to quiz them and see what the hell happened.."


  "Survivors meanwhile, will be under NDA. We'll keep this tight lipped for as long as we can..." [/color]




