roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Hivelord (KI-246) is awarded the Royal jelly of resilience: 'Our most honorable KI kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. Allowing every single flank. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)

  Ancient Praetorian (FR-987-NC) is awarded the Royal jelly of slaughter: 'Our dearest FRNC played a beyond vital role in terrorizing the talls from the complete start to the end. She kept rotating, capturing, scouting, and running down anything she could get her deadly claws on. Poor talls could just watch in despair. It is without a doupt that her actions allowed the hive to succeed! Secure the slaughter again!' by Ancient Queen (LIMA)

  Ravager (FF-201-Fﬃ) is awarded the Royal jelly of slaughter: 'For her incredible work as a ravager of supreme caliber, Fluffi has deserved the royal award! Sister managed to capture talls time and time again, calling out one of THE major flanks! Not only did she survive the whole war, but she utterly ripped the talls apart. I am against awarding the most Apex sisters of them all, but alas it has to happen at least once. May she blesses us with her future contributions as well!' by Ancient Queen (LIMA)

  Ancient Drone (AKI-353) is awarded the Royal jelly of proliferation: 'AKI proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Eternally stuck to the queen like a bad tumor, but in a good way of course, she played the talls like a fiddle. May the future hives be blessed with her presence as well!' by Ancient Queen (LIMA)

  Young Carrier (HU-169) is awarded the Royal jelly of proliferation: 'Although seemingly young, HU played a role of utmost importance in the hive! Together with the other carriers she managed to capture talls one after another. Not only did she survive the whole war, but she kept living on the edge of the frontline between life and death! HU stay with us longer!' by Ancient Queen (LIMA)




