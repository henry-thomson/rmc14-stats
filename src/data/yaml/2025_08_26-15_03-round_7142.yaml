roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Mizuno 'Kitty' Drakonovisch, Alfred Mainblood, Sofia Addison, Vince 'Dog' Petrov, Ricardo Rohtin, Bailey 'Timber' Hayes, Char Rockson.



  Royal Jelly Awards:

  Ancient Ravager (KR-235-IS) is awarded the Royal jelly of proliferation: 'Today, we had 6 ravagers, but there's only two that I would deem as crucial to the success of this hive. While your other four sisters perished rather quickly in battle, you stood with me by my side at all times, dragging captures into the hive and shielding your sisters from danger. In the long and challenging battle of reactors, you delivered critical captures which slowly led to our victory. I consider your actions 50% of the reason we won today, and so you deserve the jelly of proliferation for your deeds.' by Ancient Queen (SEA)

  Ancient Ravager (GUH-718) is awarded the Royal jelly of slaughter: 'Your were one of the two ravs that I consider crucial to the success of this hive today. Due to our lack of boilers, I found it unlikely that we would be able to slaughter the immense bulk of talls in the reactors today. However, you eviscerated dozens upon dozens of talls, and took out key targets which were a threat to our hive; like tripple scatter spitters. Via your actions today we were able to easily conquer the pathetic tall force and grow our hive, and had I not had you along side me today I do not doubt this hive would have died. Due to your honorable deeds, I award you with the jelly of slaughter.' by Ancient Queen (SEA)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
