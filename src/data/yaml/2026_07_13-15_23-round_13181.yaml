roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Greedy Morgan, Daniel 'Survivor' Kamon, Yornex'xel St'Rwuzzle, Voltaine Highmore, David 'Dig' Diggle, Hans Brandenburg, Phaethon 'Steelwall' Silktongue, Isaac twisted Clark, Crafty 'Never Dies' Scuttlebug, Hugo Knapenberger, Fights-The-Dark, Auburn Wetering, Kit Gomez, Iluca 'Hotbox' Sia, Soliz Cotrole, Borkus Smorkus, Zachariah 'Dirtface' Kirkson, Henry Banani, Locke 'Lancaster' Heart, The Oak of Desire, Matthew 'Skidmark' Fields, Jimmy James, Endures-Till-End, Alan Myers, Kilometer Dash, Artie 'Hound' Mitsch, Miguel 'Padre' Santiago, Nithcraal 'Bulwark' Enoki, Bennett Biery.



  Medal Awards:

  Gunnery Sergeant Shana 'Snow' McTavish is awarded the Medal of exceptional heroism: 'It's not often I can see a operation saved through amazing leadership. Today I witnessed you do just that. You kept your marines together even as the operation was at its darkest. You brought this victory to the UNMC. Well done. 


  Awarded by Maj. Breaks-the-Tides on 7/13/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Breaks-the-Tides

  Second Lieutenant Selena Carter is awarded the Medal of valor: 'Despite the hardship of being the only Intelligence Officer for nearly the entire operation. Selena ensured a steady flow of Intelligence throughout the entire operation, maintaining their composure. All as a relatively new officer of the department. Good work, and well done. 


  Awarded by Maj. Breaks-the-Tides on 7/13/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Breaks-the-Tides

  Captain Fenrir 'Ghost' Kahler is awarded the Bronze heart medal: 'While not everything went to plan, and mistakes happen. You saved this operation. Without your deployment, quick decision making, and execution of your ground forces defeat was inevitable. You prevented that, and you will not be forgotten. 


  Awarded by Maj. Breaks-the-Tides on 7/13/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Breaks-the-Tides





