roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Gerardo Aultman, Rhys Hendricks, unknown, Stony Tony, Axel Greaser.



  Medal Awards:

  Lance Corporal Hannah AW Khopesh is awarded the Medal of exceptional heroism: 'For holding out at sensors near entirly on your own against a whole hive. your bravery has secured us vital information that i used to destroy a xeno strong point. and kill several bugs with an OB. your courage knows no bounds. and i greatly admire that


  Awarded by Col. Tyr Ragnarson on 03/03/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Christian Vincent is awarded the Medal of exceptional heroism: 'For outstanding work with a grenade launcher. killing several boilers. and keeping pressure on our pushes. you rounded up this great act of heroism by nailing the vile queen with a well placed baton to stunn her for just a moment. but the moment we needed to kill her


  Awarded by Col. Tyr Ragnarson on 03/03/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Sergeant Ayumi is awarded the Medal of valor: 'For an outstanding show of valor in the thick of the fight. through a long and brutal opperation. you kept alpha together and strong. an outstanding show of leadership. 


  Awarded by Col. Tyr Ragnarson on 03/03/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Corporal Nat 'The Silly'  Rosesteel is awarded the Medal of valor: 'you shown great skill in leadership today. brining your squad together when all your leaders fell. while also maintaining your own duties. im proud to have you under me. and look forward to having you more


  Awarded by Col. Tyr Ragnarson on 03/03/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Private First Class Agile Flopshire is awarded the Distinguished conduct medal: 'Hleping your LO basically on your own for the entire opperation. you have been a great help to us on the ground as i have seen the steady flow of supplies myself. good work soldier


  Awarded by Col. Tyr Ragnarson on 03/03/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





