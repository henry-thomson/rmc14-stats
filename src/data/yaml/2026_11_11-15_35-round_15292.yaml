roundEndText: >2-

  [italic]This memorial is dedicated to the brave Men and Women serving aboard the [bold][color=Gold]UNS Endeavour[/color][/bold].


  Whose sacrifice brought time for the evacuation of the 15,941 colonists of Tiamat III


  Your deeds will be sung of for generations.

  Your names are now carved forever in stone.[/italic]


