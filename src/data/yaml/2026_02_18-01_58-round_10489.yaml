roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  John Miller, Alicor 'Pinkie' Merow, Commet 'Flame' Brown, Eliza 'No-Name' Collie, Olive Orr, Romulus Deathwing, Nomi, Silas Candlewing, Aislinn Knoles, Rowan Gibson, Spits-The-Fire, Don Hardy, Peter Thomlinson, Jay Winton.



  Royal Jelly Awards:

  Prime Drone (RO-156-SA) is awarded the Royal jelly of rejuvenation: 'ROSA was one of the sisters that most healed and even predicted a tuber and sacrificed so i would not stun, which rprevented my death.


  Rejoice ROSA!

  Thank you for every sacrifice you did, the best Martyr ever!' by Ancient Queen (RP)

  Prime Boiler (HAZ-887) is awarded the Royal jelly of resilience: 'Even at our darker times, HAZ kept on.

  Even when looked like there was no hope, they kept boiling.

  HAZ is a one of a kind boiler that i trust them with my life.


  Rejoice my daughter!!' by Ancient Queen (RP)

  Young Drone (KT-466) is awarded the Royal jelly of rejuvenation: 'KT was a smart healer that sacrificed for me 5 times, one of the best healers i have ever had the joy to meet.


  Rejoice my daughter!' by Ancient Queen (RP)




