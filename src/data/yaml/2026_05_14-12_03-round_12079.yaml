roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Runner (RP-99) is awarded the Royal jelly of proliferation: 'RP, you have captured many talls today. The talls stubborness have lead you to secure the future of many sisters by capturing those foolish talls, and your leadership has helped these new sisters situate themselves and contribute greatly to our hive.


  For this, I award you this jelly of proliferation. Keep it up!


  See you in the next hive!' by Elder Queen (NEV)

  Elder Praetorian (FAE-688) is awarded the Royal jelly of sabotage: 'FAE, I have witnessed you. I have seen you steal the tall's tuber from right under their nose. It was a beautiful sight. While they fled in fear of us, you bravely lunged the tuber after it had shot me, securing its capture.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Elder Queen (NEV)

  Prime Hivelord (SIP-505) is awarded the Royal jelly of resilience: 'SIP, you have lived this entire day by working hard and erecting great resin walls in our name. You have made sure the talls could never get far no matter what, and have received to love of many of your sisters.


  For this, I award you this jelly of resilience, on behalf of your sisters.



  See you in the next hive!' by Elder Queen (NEV)




