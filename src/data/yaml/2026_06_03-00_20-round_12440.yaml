roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  unknown, Scarlet Winter.



  Royal Jelly Awards:

  Elder Ravager (VV-740) is awarded the Royal jelly of slaughter: 'At a critical moment in the battle against the talls, when they were diving for mother, hungry for our acid, this daughter answered the call. They rotated to the invading talls and secured a critical wipe. Without their efforts the day would not have been won. Bravo!' by Prime Queen (ARG)

  Prime Praetorian (YIP-460) is awarded the Royal jelly of sabotage: 'This daughter was a beacon of hope during the talls push into deep sec. Without their efforts the tall invasion would have overwhelemed the hive. They provided a focal point of defence and stalled the talls long enough for the backline and mother to evolve. Without their support the day would not have been won. Rejoice!!' by Prime Queen (ARG)

  Young Boiler (BI-479) is awarded the Royal jelly of slaughter: 'Our boiler daughter, although young and one of many they distinguished themselves in a critical battle during the tall invasion. When time came to protect mother they answered the call. Their skillful boil provided the needed cover for the ravengers to secure a wipe. Without their efforts the day would not have been won. We look forward to seeing the Prime you will become! Rejoice!' by Prime Queen (ARG)




