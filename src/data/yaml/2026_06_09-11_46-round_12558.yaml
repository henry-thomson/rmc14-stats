roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Drone (XX-50) is awarded the Royal jelly of resilience: 'Young yet incredibly capable sister played a vital role in terrorizing the talls. She kept rotating, weeding, and aciding anything she could get her claws on, and poor talls just watched in despair. As a part of her incredible team, she managed to build walls high and tall, that were no match for the intruders! We hope to see our sister soon enough!' by Prime Queen (LIMA)

  Drone (CL-744-B) is awarded the Royal jelly of resilience: 'Is CLB perhaps hiding her apex form?! Sister is an incredible example of cooperation. Her work, and symbiosis with other sisters tired out talls so much that they could barely push! Once they got too deep, all that was needed was for the CLB to just come in and surround them! Talls took their last breath, and CLB watched how the light disappeared from their eyes. Slaugher is best served cold, too bad CLB has an incredibly warm heart! Help us in our future wars CLB!' by Prime Queen (LIMA)

  Ancient Lurker (GWN-296) is awarded the Royal jelly of slaughter: 'Although sister GWN met an unfortunate demise, somewhat as she predicted herself, she no less kept the hive constantly informed! She stalked the talls with her keen senses, and not ever gave them a room to breath. She was of incredible help during th slaughter, and while capturing! We can only beg her for her help in the future!' by Prime Queen (LIMA)




