roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Lymanzia Moonrunner, Maria Sheppard, Satoru Suzuki.



  Royal Jelly Awards:

  Elder Defender (NOX-421) is awarded the Royal jelly of resilience: 'Congratulation Defender, you have shown your resilience by putting your body infront of the valk body when they got tubed, preventing them from getting spit on and killed, you saved a valuable sisters for exchanging your own life. I am proud of what you did, as most can't even fathom to achieve what you have done. You truly were a shining example for the hive. Rejoice!' by Prime Queen (PRO)

  Mature Praetorian (STL-226) is awarded the Royal jelly of rejuvenation: 'You have done a phenomenal impact on this battle, you have saved many of my daughter with your excellent timing of warding, and making sure the tuber was pretty much useless. you were a heavy impact on this battle as your warding ensured many won't go down that quickly, and could be rescued. for that you deserve this jelly for being a powerful valk in the front when needed. May the Queen Mother be proud of you! Rejoice!' by Prime Queen (PRO)

  Elder Crusher (BO-114-OT) is awarded the Royal jelly of sabotage: 'When you were a warrior, you have shown your skills once again, by removing special talls with ease, and many others! Your greatest achievement was killing or capturing special talls which was 3 of them! Amazing performance overall, also helping transport captures, and made sure to help others in transporting as well, when they struggle a bit. May the Queen Mother be proud of you! Rejoice!' by Prime Queen (PRO)




