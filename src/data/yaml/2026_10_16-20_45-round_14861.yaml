roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Pulls-The-Pins, Kiko 'Keeko' Winterrey, Leonard 'Breacher' State, Hugh 'Clumsy' Dannerson, Ymira Yllora, Kain Weller, Ansgar Firebeard, Danielle 'Careless' Winchester, Granola Buckdonald, Maximus 'Max' Espinosa, Sunny Flarewing, Jerome 'Unc' Hawking, Jared Riggle, Moises Fuchs, Bailey Warren, Long-ears Lucas, Snoozy Stanley, Willie Manley, Lennox Adams, Steven Green, Danny 'Ketchup' Heinz, Tera 'Weedkiller' Marynkore, Krakaud Stoneguard, Keith 'Rat Killer' Valentine, Lilac Vitale, Elios 'BIC' Lightsworn, Suffer-The-Consequences, Lorgosto ''Purple'' Coste, Ruby Nightwatcher, Tail-Tail, Nyx Nightflyer, Adzi-Marz, The Orchid of Competence, Rufus Nightjar, Aeolyn Starling, Sebastian 'Squish' Eventide, Dale Hickory, Zircon 'Scav 'Nightspawn, Cesara McAlpine, Eddie 'Undead' Carmichael, Paul Peterson, Elroy Aegyr, Frank Hastings.



  Medal Awards:

  Lance Corporal Roaen Morzanth is awarded the Distinguished conduct medal: 'This Marine was our last HM, They revived the squad and other marines on multiple wipes or minor Wipes they were Key to the survival of Delta and others. This marine went above and beyond what was required of them. They saved many lives and did honorable work. Well done.


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Corporal Alan 'Gambit' Braun is awarded the Distinguished conduct medal: 'For fearless supressive fire, engaging xenonids whilst on the move during our diving pushes through tooth and nail. They were relentless and did flawlessly. Well done.


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Gunnery Sergeant Ne'Zun 'G-Line' Verinsoar is awarded the Distinguished conduct medal: 'Through Valor alone, This squad leader has lead a successfull squad through the perils of xeno threat. They were knocked down numerous times yet refused to give up. Living up to a Squad Leaders Legacy. You are the reason Gunnerys earn the respect they get. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





