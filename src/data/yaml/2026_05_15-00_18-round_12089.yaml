roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Roland 'Stahl' Kraus, Sergio Morris, Racc N'Bin, Vexillum Regis Obice, Adam 'Fractured' Johnson, Lissette Beckman, Rirro Darkmist, Altair Stargazer, Joni Nebulus, William ''Earth'' Rolcker.



  Medal Awards:

  Lance Corporal Isaiah Merryman is awarded the Distinguished conduct medal: 'Lance Corporal Isaiah Merryman during Operation: Project Spartan-Sweep performed their job above the normal call of duty. At the recommendation of the Logistics Officer Danielle Sparks, Isaiah is awarded the Medal of Distinguished conduct. Isaiah helped with keeping req in order ensuring supplies was managed well when at the time we needed crates. Not only this but Isaiah trained a RT while keeping our supplies up. This is the exact type of behavior I like to see in this department. Lifting each other up while keeping the marines supplied when req was in a bad spot.

  Excellent work.


  Awarded by LtCol. Sicilia Drakonovisch on 05/14/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Staff Sergeant Knox 'Meowster' Eterna is awarded the Distinguished conduct medal: 'Staff Sergeant Knox 'Meowster' Eterna during Operation: Project Spartan-Sweep is to be awarded the medal of Distinguished Conduct for their actions during the operation. They upkept cohesion during a difficult battle and ensured their squad remained together at critical and pivtol moments. The maneuvers she performed were critical to the operations success and went above the normal call of duty of the role. Knox you should be proud to recieve this honor. Excellent work.


  Awarded by LtCol. Sicilia Drakonovisch on 05/14/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





