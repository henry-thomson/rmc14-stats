roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Elliot Galequill, Yells-At-People, Lucas Bustin, Ashvali Daratova, Titus Wheelian, Nid Rangatira, Brenton 'Xeno Remover', Addyson 'Fortuna' Zappy, The Thorns of Honesty, Vince Vale.



  Medal Awards:

  Sergeant Hudson 'Hungry' Demuth is awarded the Distinguished conduct medal: 'Sergeant Hudson Demuth performed their duties of Military Police to the acceptable standard aboard the dropship, though when the ultimate call for duty came as Honor Guard they went above and beyond. Operating greatly within the bounds set by myself to ensure a smooth operation they had managed to eliminate a queen specimen and prevent various captures.


  Furthermore, their bravery in sticking with their assigned protective personell resulted in the frontline following their example of bravery to an efficient extend ensuring lines moved when needed. Take pride in your performance today.


  Awarded by Maj. Kaitlin Zalack on 04/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





