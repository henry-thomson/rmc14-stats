roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Roman 'Ranger' Bandera, Gavin 'HR-Nightmare' Blackbeard, Mixes-the-Fuel, Shoots-for-Moon, Spits-The-Fire, Lillifen Hellalyl, Dillon Turner, Samuel Gonzales, Butch Ratcliff, Lane Berkheimer, Nohkin, Scoff Mykll, Kun Ironclaw Pack, Daniel Jones, Ginger 'Sir' Hops-a-Lot, John Viper, Erisia Eneka, Slim Cognito, Kevin Soup, Nades-The-Cades, Addyson 'Fortuna' Zappy, Aster Seelis, Einaka, Lemonus Coralith, Matthias Nereid.



  Royal Jelly Awards:

  Prime Praetorian (YIP-20) is awarded the Royal jelly of proliferation: 'Your hook fished so many talls i can't even count on my claws. You killed and captured many, helping us have enough numbers to crush talls efficently.



  Rejoice my sister! May your joy be eternal!! YIP!!' by Prime Queen (RP)

  Elder Lurker (LU-432-AN) is awarded the Royal jelly of slaughter: 'LUAN was ravager two times in which they dragged and killed many talls allowing us to rot and rejuvenate our captures.



  Rejoice my sister!! May your wipes be eternal!!' by Prime Queen (RP)

  Elder Crusher (AD-789-Y) is awarded the Royal jelly of resilience: 'ADY kept fighting even when i died together with LUAN and YIP, allowing our pressure to never give down.

  You made an amazing job that allowed us to still secure our hive.


  Thank you my daughter, and may your determination be eternal!!' by Prime Queen (RP)

  Mature Drone (WW-935-A) is awarded the Royal jelly of rejuvenation: 'You were our bastion that held and healed sisters even when i was dead. You made an amazing job that requires a lot of recognizement. I am eternally grateful to you.



  Rejoice my daughter!! May your gardens lead us to eternity!!' by Prime Queen (RP)

  Young Warrior (BO-98-B) is awarded the Royal jelly of resilience: 'Even when we were committing to bird you kept fighting and capturing on planet. You helped the hive and sustained the hive.


  Rejoice my daughter!! May your resilience be eternal!!' by Prime Queen (RP)




