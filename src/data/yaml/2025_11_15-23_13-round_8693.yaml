roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jeremiah Reed, Oxnard Montalvo, Nicholas Stone, Drunthar 'Pushflamer' Stoneforge, Poul Rutherford, Jade Ware, Andrew Bunten, Icey Iana, Bence Peckler, Selina 'Cavity' Alara, Astria, Jack Cuban, Reese Day, Bobert Brockson, Brings-In-Catch, Ends-The-Bloodlines, Colten Sloan, Alexis Andreeva, Bohn 'Zombie' Griff.



  Royal Jelly Awards:

  Young Praetorian (FL-901-O) is awarded the Royal jelly of resilience: 'FLO, in your efforts in this war in my horde, you remained a steadfast follower. Constantly protecting and covering retreating sisters, and disrupting tall counterpushes. All the while, you remained alive and well. For your efforts in protecting sisters, I give you this jelly. Henceforth, may you be known as FLO the furious' by Ancient Queen (CMP)

  Ancient Praetorian (ZAO-949) is awarded the Royal jelly of proliferation: 'ZAO, as a loyal and steadfast memeber of my royal horde, you undertook one of our most important tasks, the expansion and preservation of our hive. You constantly covered retreating sisters, and on my screams and neuro spits, you managed to capture many talls, healing our hive in our time of need. For your efforts in expanding our numbers, I award you this jelly. May you henceforth be known as ZAO the Zealous' by Ancient Queen (CMP)




