roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Reed McMatherson.



  Royal Jelly Awards:

  Elder Drone (OXQ-659) is awarded the Royal jelly of rejuvenation: 'Our worderful gardener grew her bountiful harvest of fruits that kept endlessly refreshing us! She not only constantly rotated and kept everyone fed, but also managed to survive all of the slaughter! May the future hives are blessed with her skills as well!' by Ancient Queen (LIMA)

  Elder Runner (KAT-834) is awarded the Royal jelly of sabotage: 'Her speed and stealth is unmatched! Sister managed to out run every possible talls, constantly reporting on the situation possible captures. The pinacle of her capabilities were proven as she managed to outsmart and outskill a smart spitter no less!' by Ancient Queen (LIMA)

  Elder Drone (EG-299-O) is awarded the Royal jelly of rejuvenation: 'The battle was short lived however sisters healing was eternal! To this day we don't know if the talls panicked and ran because they saw our capable healers, or if they realized that our healt was always at maximum? Either way, we hope our sister will manage to bless us with her help presence once again!' by Ancient Queen (LIMA)

  Young Hivelord (RI-373-K) is awarded the Royal jelly of resilience: 'Even though our sister didn't see any scaled hosts in the backlines, she proved her undying loyalty to the hive by always being on top of her wall game! She kept rotations going and talls trembling in terror of surround. The hive desires her skills in the future agian!' by Ancient Queen (LIMA)




