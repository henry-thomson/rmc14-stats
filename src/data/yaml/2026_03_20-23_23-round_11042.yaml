roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ardy 'Ape Man' Guy, Tombathy Chucklechops, Porter 'Porker' Keopple, Noelle Dollfuss, Ian Langely, Garret 'Sieve' Petrov, Neoscona Orbweaver.



  Royal Jelly Awards:

  Elder Hivelord (ARG-984) is awarded the Royal jelly of resilience: 'Since the start of my hive, you proved an essential builder and led a pack of hivelords with you as a designer. You worked tirelessly, planting resin each and every second it was possible, and without you victory here today would have been completely impossible.


  For your incredible support as a builder, I commend you with the jelly of resilience.' by Prime Queen (SEA)

  Elder Ravager (LU-271-RK) is awarded the Royal jelly of slaughter: 'Most, if not at all, of my main attack castes died early on into our battle. However, you valiantly charged forward each and every single time yet remained standing to continue murdering talls left and right. I saw you slaughter dozens of talls first hand, and cap those who I expected you to cap. 


  For your incredible profiency as a ravager, I award you with the jelly of slaughter.' by Prime Queen (SEA)

  Prime Hivelord (WI-727-LO) is awarded the Royal jelly of resilience: 'Alongside your fellow hivelord, ARG, you worked to continously plant resin everywhere where it was strategically beneficial. Without your dedicated support, there you would have been no ground to fight on, and no victory in sight.


  For your magnificent work as a hivelord, I award you the jelly of resilience.' by Prime Queen (SEA)

  Elder Lurker (NEV-355) is awarded the Royal jelly of slaughter: 'Your work as a ravager did not go unnoticed. First hand, I experienced you cleave through talls and capture many who stood in my way. Cleverly, you dragged those I wanted you to drag, and killed those I wanted you to kill. Though you fell in battle, you lived longer than most of your sister ravagers, and provided me with your support for over an hour of combat.


  For your awesome work a ravager, I bestow upon you the royal jelly of slaughter.' by Prime Queen (SEA)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
