roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Garret 'Sieve' Petrov.



  Royal Jelly Awards:

  Ancient Praetorian (WA-1-LL) is awarded the Royal jelly of proliferation: 'Sister. Today you showed us expectional heroism getting vital captures in the most desperate for our hive times. Others noted your efforts. At the battle of weyamart you stalled talls and it lead to their wipe. Hive is proud of you so am I' by Immature Queen (RISK)

  Mature Boiler (YEP-637) is awarded the Royal jelly of sabotage: 'Sister. Today you were lethal. Avoided every green stick and red dot you stalled the tall ball first at the battle of Dynagrid and after at the great battle of Weyamart. Many young sisters need to learn how to avoid skybird the same way you do. For your great work you are getting this jelly. Hive is proud of you so am I.' by Ancient Queen (RISK)

  Ancient Hivelord (ABG-64) is awarded the Royal jelly of resilience: 'Sister. Building is a hard task. You need to be resilient. You need to have a strategic mind. See the full picture. Today you showed it all. Due to your great efforts at the second battle of Dynagrid and at the great battle of Weyamart we were able to encircle talls leading to the wipe. Hive is proud of you so am I.' by Ancient Queen (RISK)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



