roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Eikii Nemesis.



  Royal Jelly Awards:

  Ravager (XX-990) is awarded the Royal jelly of sabotage: 'The sky is blue, the stars shine bright. With your claws maliciously sweeping across the radiant sky, your resolve unwavering and relentless, your edge claw forged for slaughter... oh my, you're such a lovely daughter of mine.


  With such a performance, I witnessed your actions and the full potential of a prime ravager. Your relentless and fearless assault, taking down the Flamewalker while bringing total misery and despair upon the Tall... I found that you're worthy of this jelly. You are truly the star of the hive, the savior rather, the future of the hive.


  I thank you for your service. I have no words. You did amazingly, XX.' by Ancient Queen (SVI)




