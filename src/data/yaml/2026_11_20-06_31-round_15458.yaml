roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Hivelord (KI-548-S) is awarded the Royal jelly of proliferation: 'Since the beginning of the battle Kutjevo, you built up the entire world! your carapace was burning brighter than the burning flames the talls unleashed upon these lands. Let no further put any doubt in my mind that you were a shining star of the hive by building up pillars upon pillars in my name, for that you deserve this jelly for building to your max potential! Rejoice! Good work my hivelord!' by Prime Queen (PRO)

  Ancient Ravager (RP-649) is awarded the Royal jelly of slaughter: 'During the battle of Kutjevo. Your blade drenched in the blood of my enemies after the slaughter you provided upon thee. For that you are given this jelly! However I will mention you wiped a group of talls assaulting core from the west of South Colony Caves! Then Another, an another... it gets little bit old but regardless you did such a good hunt today. I hope you keep your blade as sharpen during this moment, so that any tall you strike is permanently striked down. Rejoice!' by Prime Queen (PRO)

  Young Praetorian (SW-509) is awarded the Royal jelly of proliferation: 'During the battle of Soro, You captured and danced and weaved through all enemies. Taking them one by one, through my rampage. For that you deserve this jelly of grand effort in your dedication to making the hive bloom with life. Rejoice!' by Prime Queen (PRO)




