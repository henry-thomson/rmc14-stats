  Royal Jelly Awards:

  Mature Drone (RE-971) is awarded the Royal jelly of rejuvenation: 'This healer drone sacrificed themselves twice to save sisters from imminent danger, by the time the talls left, they had healed enough for a third sacrifice! For keeping the hive safe and healed, I be' by Young Queen (DB-341)

  Ancient Boiler (WAR-279) is awarded the Royal jelly of slaughter: 'These boilers have greatly helped in killing the talls, they were always with me when I went to scream at that talls, and helped me and my other sisters greatly. For this, I offer the jelly of Slaught' by Young Queen (DB-341)

