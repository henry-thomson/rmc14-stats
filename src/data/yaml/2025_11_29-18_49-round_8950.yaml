roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Percival Weeter, Stony Tony, Ihchibir 'Jaeger' Shuash, Smoke Ahmed, Kalakian, Nicolus Mull, John Smith, Arthur 'Knight' Derthert, Chi Yanne, Icey Iana, Javon 'ill-gotten' Nash, Stu 'Stew' Lizo, Evil Astronaut, Alder Whin, Reginald Goetia, Kaylie 'Twin' Ann, Tolly Metzer, Bean Jr Junior, Asya Emilee, Grabs Beekus, Simon Walker, Atlas Gerster, William Watson, Zac Andrewist, Restless Haven, Kiefer Stohl, Byrne Keener, Tall-legged Marcus.



  Medal Awards:

  Stu 'Stew' Lizo is awarded the Medal of exceptional heroism: 'For being personally responsible for our encloser of the xenos at gonzo. and advancing our position. at the risk of your own life. youve show what i believe is the truest sign of leadership. and without question heroism. so from this day on. wear this medal with pride


  Awarded by Maj. Tyr Ragnarson on 11/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Ancient Hivelord (FDT-1) is awarded the Royal jelly of proliferation: 'You held gonzo for so long building, great work' by Prime Queen (PRK)




