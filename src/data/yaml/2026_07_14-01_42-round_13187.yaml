roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  John 'Sol' Doe, Izack Williams, Hark Willson, Chelly 'Smokie' Yong, Granola 'Biggy' Foot, Wulfrun Blue, Alain 'Rookie' Kellogg.



  Royal Jelly Awards:

  Mature Sentinel (PI-904-LL) is awarded the Royal jelly of sabotage: 'This daughter helped to capture and rot two special talls during the invasion. Although small in size they used the sentinels abilities cunningly. Without their efforts the tall invasion force would have been much stronger than it was. This is quite the achievement from a T1. We look forward to seeing the prime you will become! Rejoice!' by Prime Queen (ARG)

  Ancient Carrier (STU-947) is awarded the Royal jelly of proliferation: 'My carrier daughter distinguished herself in front of the hive, making at least 10 captures during the battle. Although no small feat, she managed something even greater, earning the love and respect of the hive. Nominated by her sisters, this daugther has made a lasting impact on the hive. Bravo!' by Prime Queen (ARG)

  Prime Hivelord (ZAO-649) is awarded the Royal jelly of resilience: 'Building from the start, this daughter showed that experience brings many lessons worthy learning. Our hive is mighty, our walls and resin strong. When the entire colony was cleared this daugther put herself in the line of fire to rebuild and reclaim the open ground. She has shown that her dedication to the Art of The Hive is unquestionable. Once again we thank you, mighty lord. Rejoice!' by Prime Queen (ARG)

  Prime Hivelord (WI-545-LO) is awarded the Royal jelly of resilience: 'Building from the start, this daughter showed that experience brings many lessons worthy learning. Our hive is mighty, our walls and resin strong. When the entire colony was cleared this daugther put herself in the line of fire to rebuild and reclaim the open ground. She has shown that her dedication to the Art of The Hive is unquestionable. Once again we thank you, mighty lord. Rejoice!' by Prime Queen (ARG)




