roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kyra Cowart, Chip Cooper, Marigold Overstreet.



  Royal Jelly Awards:

  Mature Hivelord (BRK-318) is awarded the Royal jelly of proliferation: 'Since the beginning you yearn for the power of art of the hive. that you did, you built and designed many for the hive. Even leading your sisters in the power of design. I hope you learned alot today my mature hivelord, for you have given alot in such short time. May you continue if you wish down this path and further bring these results. Rejoice!' by Prime Queen (PRO)

  Elder Praetorian (MON-470) is awarded the Royal jelly of sabotage: 'During the engagement  of Aerodrome Hangar, you pull in the flame walker into the narrow choke of doom an despair. Which allowed me to freely gib them. removing the waves of flames that would other wise slow me down. I thank you for doing such a joyous action for the hive. Rejoice!' by Prime Queen (PRO)




