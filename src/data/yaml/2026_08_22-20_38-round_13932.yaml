roundEndText: >2-

  [color=green]

  After a thorough testing period, the exploratory committee has found that the G3 battle rifle will be the best weapon to issue to our contractors for future operations.


  Other weapons tested will be examined for secondary roles, as some have concerns that adopting a battle rifle will lead to potential logistical and practical issues.


  But for now, this try out is a...


  SUCCESS [/color]


  G3 rifles have been sent to the range, you may test the out before we close. Thank you for attending, and thank you to corigin for subbing in when I had to explode.


  Another thanks to KittenColony and TadJohnson for the G3 and F50 rifles.





  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



