roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Molto Quibbles, Molly Philips, Terra Korzak, Krowie Tezari, Kevin '4th Survivor' Khan, Maximus 'Max' Espinosa, Tom 'Dumb' Thomas, Boris Kuznetsov, Jimmy 'Johns' Todd, Teagan McDonald, Mira 'Head Empty' Aoyama, Althis Lars, Jill Stahdt, Alexis Andreeva.



  Royal Jelly Awards:

  Ancient Ravager (SVI-266) is awarded the Royal jelly of proliferation: 'My Daughter your relentless captures of the talls have secured our victory. Over 25 talls by your claws alone and not to mention all protection you did for our sisters. Without you this battle would been lost and so I reward you with this Jelly. REJOICE!' by Elder Queen (FOP)

  Elder Praetorian (SG-94-UY) is awarded the Royal jelly of resilience: 'My Daughter not only have you saved my life, but many daughters lives this day. Without you this hive wouldn't have gotten to where we have. For your hard work I gift you this Jelly. REJOICE!' by Elder Queen (FOP)

  Elder Hivelord (AI-196) is awarded the Royal jelly of resilience: 'My Daughter you builded to your heart content, without you and the rest we wouldn't have been able to stall the talls as much as we did. I recongize you and your sister works with this Jelly. REJOICE!' by Elder Queen (FOP)




