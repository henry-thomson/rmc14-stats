  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Gunnery Sergeant Strikes-with-Fury is awarded the Distinguished conduct medal: 'Strikes-With-Fury led their squad well during Operation Task Force Bravo-Cigar. Without their leadership in the field I fear that the marines would have wiped earlier. They held the northern flank and followed orders when needed. Their efforts overall allowed us to even get off the planet alive.' by Major Sicilia 'Rose' Drakonovisch





