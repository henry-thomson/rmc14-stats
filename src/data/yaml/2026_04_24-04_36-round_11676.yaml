roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  Medal Awards:

  Corporal Mocha is awarded the Medal of valor: 'While serving as a Corpsman during Inspection Itching-Lima, courageously charged into a group of Xenonids while surrounded by resin, spearheading the push to kill the Xenonid queen that terrorized the AO. Your excellence in combat and bravery is something all marines should aspire to.' by Lieutenant Colonel The Force of Nature

  Gunnery Sergeant James 'SteelJaw' Hill is awarded the Medal of valor: 'While serving as a Squad Leader during Inspection Itching-Lima, engaged in close quarters combat against a Xenonid hive while outnumbered and surrounded by resin, and confirmed multiple kills through sheer courage and combat expertise. You set an excellent example for your marines today.' by Lieutenant Colonel The Force of Nature





