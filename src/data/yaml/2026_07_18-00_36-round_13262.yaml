roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rabblerouser Ray-Ray, Keith Sosa, Klein Moretti, Vex Vespidii, Kylee Wible, Olive Orr, Lochlan AW Madsen, Felix Harada, Bill Titan, Teagan McDonald, Jonathan Bellford, Wulfrun Blue, Vulfstagmir Zadovsky, Solus Stargazer, Hallowette Day, Joshua Lee, Raluli, David 'Dig' Diggle, Hark Willson, Alexis Mayfield, Stella 'Lumi' Strut, Jeroh 'Uncle Fobbers' Ward, Runnie 'Ruckus' Roach, Jasyo.



  Medal Awards:

  Lance Corporal Rough Grace is awarded the Distinguished conduct medal: 'This tech was praised to have been a major support to the requistions team. They handled most of the supplies while the LO taught new marines. We are nothing without our supplies. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 7/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Second Lieutenant Halo 'Q' Pale is awarded the Distinguished conduct medal: 'As a new IO, was the sole survivor of the operation.  Stayed true until the end, allowing intel to retrieve is almost all intelligence.  Your work was paramount to our success, and literally helped us get to the finish line.  Good work, and welcome to intel.


  Awarded by Lt. Colonel Breaks-the-Tides on 7/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





