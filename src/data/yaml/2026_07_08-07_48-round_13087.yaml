roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Adolf 'The Darkness' Heartman.



  Royal Jelly Awards:

  Boiler (ZY-660) is awarded the Royal jelly of sabotage: 'With your commitment and resolve in preventing the Tall from their initial stall, we took their soul, their body, and stripped away all their ability to fight against us.


  Your boil and the terror brought upon the Tall have proven your worth of this jelly. Your ability, and the simplicity of using it effectively, were amazing.


  For a young boiler like you, this is a talent. You lived and outlived all your boiler sisters to prevail and prevent the Tall from recovering the wipe at Engineering.' by Elder Queen (SVI)

  Young Hivelord (KE-46) is awarded the Royal jelly of rejuvenation: 'For a young Hivelord, you took the initiative, and with my guidance, improved your skill dramatically.


  Building where you were told to build, with your talent, you seem to be worthy of this jelly, i have no words for you daughter, you're AMAZING!!


  Alongside your ability and sense to prevent the Tall from recovering the wipe at Engineering, you have proven yourself worthy.' by Elder Queen (SVI)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
