roundEndText: >2-

  [color=purple]The xenos hijacked a dropship[/color] [color=green]but were wiped out by the marines![/color]


  In memoriam of our fallen soldiers:

  Arthur 'Knight' Derthert.



  Medal Awards:

  Bohn 'Zombie' Griff is awarded the Distinguished conduct medal: 'Staff Sergeant Griff is hereby commended for exceptional performance under significant stress and operational pressure due to severe staffing shortages. Demonstrating unwavering dedication and resilience, Staff Sergeant Griff worked tirelessly to fulfill all requisitions and ensured the timely provision of critical supplies. Their efforts were instrumental in enabling Operation: Recon Rude-Saturation to proceed without disruption.'

  Josephi 'Meowlamo' Catkowski is awarded the Distinguished conduct medal: 'For exemplary dedication and composure under pressure, 2nd Lieutenant Catkowski is commended for being the only medical personnel awake during  the start of Operation: Recon Rude-Saturation.  They worked under significant stress and during a period of critical staff shortages, to supply our Field Medics with essential medical supplies, Their commitment and professionalism were vital to the continuity of care during a time of great need.


  Thank you for your outstanding service.'





