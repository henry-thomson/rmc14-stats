  Ash 'Silly' Winter, Luanne Greenawalker, Nyx Nova.



  Royal Jelly Awards:

  Young Defender (GR-966) is awarded the Royal jelly of resilience: 'as a young defender, her bulky crest was responsible for the protection of many of my daughters, saving many lives and providing invaluable cover against the onslaught of tall spits. It is rare for one so young to save so many, and rarer still to live to tell the tale.' by Ancient Queen (ZERO)




