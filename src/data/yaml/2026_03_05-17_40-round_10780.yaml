  Luna Pines, Zixxaeq Teqxuq, Scarlet 'Scar' Aurora, Andre Yeskey, Nelson Stange, Kaylie 'Twin' Ann, Nat 'The Silly'  Rosesteel, Iris 'Goobia' Cookia, Seera-Letun, Raphael Plouffe, Nahami, Evelyn Fitzberg.



  Royal Jelly Awards:

  Prime Warrior (FAN-43) is awarded the Royal jelly of slaughter: 'Although our fate is uncertain, i want to give a Royal Jelly to FAN for their tremendous captures, and not only that, FAN also got planet tall lurker and THREW on the skyfire, gibbing them. That required bravery since they had to be on the blast radius, but had a huge payoff.


  Rejoice my daughter!! Even if i do not know how we will end and Tuber just tubed you while i was making this jelly, you deserve it. May your bravery be eternal.' by Prime Queen (RP)




