roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  Royal Jelly Awards:

  Elder Boiler (MAT-301) is awarded the Royal jelly of slaughter: 'As one of our boilers this daughter distingushed herself. When the talls came to steal our hive, this daughter stood in their way. When mother fell they continued to hold a critical choke point preventing the talls from recovering there losses. The talls today fell in hordes to your boil. Without you the day would not have been won, Bravo!' by Ancient Queen (ARG)

  Mature Boiler (RA-876) is awarded the Royal jelly of slaughter: 'As one of our boilers this daughter distinguished herself. When the talls came for our hive this one did not fear. When our trap was sprung this daughter held the line against countless talls, slaughtering them as they tried to recover their dead. They proved to be one of the hives greatest warriors, Bravo!' by Ancient Queen (ARG)




