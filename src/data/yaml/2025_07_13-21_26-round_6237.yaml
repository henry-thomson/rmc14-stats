  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Miles 'Deep Diver' Priebe.



  Royal Jelly Awards:

  Ancient Ravager (PRO-567) is awarded the Royal jelly of slaughter: 'Your claws are sharp, your killing instincts sharper. You likely killed over 30 talls permantely, probably even more. You are the anger, you are the rage. For the wholesale massacre of two entire tall color castes, i give you this jelly of slauther' by Elder Queen (CMP)

  Young Praetorian (HL-738-X) is awarded the Royal jelly of slaughter: 'Your tail strikes true, your hide is tough, you dive headfirst into battle, and come out on top. You are the battle, you are the war. And even if you are young for now, I see a prime Praetorian of the hive in the future. For the wholesale slaughter of two castes, i give you this jelly' by Elder Queen (CMP)

  Elder Praetorian (ALT-691) is awarded the Royal jelly of slaughter: 'You are the charge, you are the master of combat. Your anger is keen and your mind is ruthless. You are the hunt, you are the killer. For helping the ruthless culling of two tall castes, I award thee this jelly of slaughter' by Elder Queen (CMP)




