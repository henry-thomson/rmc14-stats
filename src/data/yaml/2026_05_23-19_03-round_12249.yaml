roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Emiko AW Kaiten, Chews-the-Wires, Ana Zaychikova, Lilliana Taggart, Svyatoslav Yevgenyevich, Garry Hammerson, Elise Tedrow, Natasha Alice, Darren Linton, Levi 'bait', Gary Candidus, Glorp Blorbleson, Archibald 'Misfire' Garcia, Grant Fulton, Stella Falke, Karl Schmidt, Mundey 'Loudmouth' Laurie, Becomes-The-Beauty.



  Medal Awards:

  Corporal Studies-The-Lights is awarded the Distinguished conduct medal: 'Corporal Studies the Lights charged head first and scored a crucial shot killing the queen. This brought the entire hive's down fall. With this we were able to gain the momentum we needed to continue fighting and clear the colony.


  Awarded by Colonel Sicilia Drakonovisch on 05/23/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch

  Second Lieutenant John 'Arsonist' Spade is awarded the Distinguished conduct medal: '2nd Lieutenant John 'Arsonist' Spade is awarded the medal of Distinguished Conduct for their efforts today. He made 14 tanks of gc before drop and another 14 later on. In addition made high comb, being the well accomplished chemist he is I believe he has deserved this medal. Excellent work today.


  Awarded by Colonel Sicilia Drakonovisch on 05/23/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





