roundEndText: >2-

  END OF ACTION REPORT


  Echo checkpoint, along with the majority of the highway were lost in a

  lightning offensive by the CLF. While the UNMC reported CLF losses were much

  higher than UNMC ones, the public image of the CLF being contained has been

  utterly shattered.


  The Midas Sector CLF, once thought moribund, seems not only to be alive, but

  much, much deadlier than the UNMC ever could've imagined..


  Casualties:

  Camden Palleen - sniper fire

  Sophia daisy - Sniper fire

  Jason Fogson - Killed instantaneously by a car bomb


  Laine AW Sword - Missing in action





