roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Han Merryman, Drunthar 'Pushflamer' Stoneforge, Snow Fish, Collin 'Rock' Ironside, Jenny Arakami, Adam Ocelot, Grey Stargazer, Ina Shiba, Francis Monroe, Trixie 'Burner' Burns, Travis Fuentes, Kurt Ratchell, unknown, unknown, unknown, unknown, unknown, Bleslie Flumpguffin, Clukay 'Heckler' Koch, Dirk 'Spades' Swanda, Larry de-Pain, Alonso Quixote, Blobby Oozeworth, Robby Hearns, Archibald 'Ripcord' Butterfill, Jhony Black, Marilyn Okomi, Ends-The-Bloodlines, Nan 'Redacted' Mazu, Keegan '007' Riley.



  Medal Awards:

  Darfman Forgemog is awarded the Bronze heart medal: 'Bravely fell in the line of duty today against an overwhelming xenonid threat. Your services, and sacrifice will be remembered.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Stu 'Stew' Lizo is awarded the Distinguished conduct medal: 'For being thrust into the position of leadership, you had quite large shoes to fill in the absence of Gunnery Sergeant Darfman. However, your peers, and myself believe you performed admirably under the circumstances. Thank you for keeping Delta in one piece and in fighting condition.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juniper 'Evergreen' Viridia is awarded the Medal of valor: 'Viridia performed the duties of a corpsman excellently. Running through almost three full defibs, 450 units of epinephrine, all spent on reviving our marines and keeping people on their feet. A feat I got to see for myself, as I was plunged from the realm of darkness due to your steady hands and steel resolve.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Nikki 'Ferret' Blackburn is awarded the Medal of valor: 'As per recommendation of your ASO, you performed admirably in the line of duty today as an intel officer. Destroying backline hives, collecting intelligence, communicating the presence of backliners. You went above and beyond, and put life and limb at risk for victory today.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Jothua 'Mothua' Mothington is awarded the Distinguished conduct medal: 'On behalf of the entire requisitions department, I see it fit to commend your efforts. The requisitions department ran like a damn war machine today, just as it's supposed to. You ran out of funding twice, and I increased your budget twice, because I knew that you and your subordinates would be up to the task of keeping my marines supplied with what they needed for victory today. A choice I would make again and again, in the same shoes.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





