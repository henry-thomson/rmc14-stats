roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Petruso Ank, Maximus Hawking, Fenton Kirkson, Khal Onari, Giu 'Purple' Pake, Felix 'CopyCat' Phill, Effie Mikasi, Tail-Tail, Noah Keller, Kun Ironclaw Pack, Alice Carr, Cyi Ratilo, Dale Hickory, Clyde Bootes, Rorik 'Guppy' Harder, Cook Justin, Aiden Straus, Ruki Trigger, Fluffers, Morel, June Tolkin, Jebediah AW Super-Shorty, Sophia Murray, Byrrne EmberFeathers Pack, Grant Miller, Samus ''Rook'' Tharrison, Callen Voss, Miun Rongrong, Aazani 'Magnet' Starclaw, Mia James.



  Medal Awards:

  Staff Sergeant Finn 'Nomad' Neso is awarded the Medal of valor: 'Staff Sergeant Neso you lead Alpha through the harshest of pushes throughout our OP. Leading the charge into scrubland was only the start pushing against countless Xenonids with your squad killing many. Once I landed you kept your squad pushing through the heavy choke points of the east caves showing no fear in the face of our enemy. Your valor was shown today and was reflected in your squad for that I thank you for your work.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/22/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Lance Corporal Envy 'Ensyl' Syltran is awarded the Distinguished conduct medal: 'Lance Corporal Syltran you played a important supporting effort for Alpha amazing work shown today. When your SL fell in the fight many times you kept Alpha as a whole moving and pushing keeping the pressure needed to win this. Supporting constantly by gathering and moving the supplies as we push your work might have not been seen as a glorious one, but it is a very important one.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/22/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





