roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hugs-The-Cades, Mizooki 'PillBug' Akiya, Vuk Drexler, Beace Poppers, Pat Patlal.



  Royal Jelly Awards:

  Mature Hivelord (LU-61-K) is awarded the Royal jelly of resilience: 'The efforts of this sister cannot be praised enough. She alone has rebuilt giant swathes of empty land, working without rest to take back that which was lost to the tall menace. Without her efforts the hive would not have survived.' by Elder Queen (LEON)

  Young Ravager (CG-632-V) is awarded the Royal jelly of resilience: 'This sister has stood resilient  in the face of the tall menace, taking on multiple hits from their tubes and surviving it all. She is a beacon for the resilience of our hive, one we should all aspire to be.' by Elder Queen (LEON)




  [bold]Operation funded by [color=green]Iantha Atikson[/color]![/bold]



