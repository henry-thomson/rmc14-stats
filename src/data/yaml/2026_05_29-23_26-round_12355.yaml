roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Katerina AW Dragunov.



  Medal Awards:

  Corporal Eden 'Matchstick' Faust is awarded the Medal of exceptional heroism: 'Corporal Eden 'Matchstick' Faust during operation Program Kill-Whiskey dove behind enemy lines. This diving operation serving as the operation's soul scout saved a marine that was captured. During this, Eden killed the queen severely crippling the hive. This hive dive risked their own life but Eden did not care, and pursued their objective. Eden went way beyond the usual call of duty. Their sacrifice will be remembered.


  Awarded by Colonel Sicilia Drakonovisch on 05/29/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





