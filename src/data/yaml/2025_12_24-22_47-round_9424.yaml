roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Kimberly Hunt is awarded the Bronze heart medal: 'This marine made a daring dive to repair the experimental sensors relay once the xenonid hive was distracted fighting our forces for the second comms relay. While they were not able to make it out of the operation alive, the information gathered by the sensors relay allowed me to read their movements and prevent what would have otherwise been a successful takeover of our FOB.


  Awarded by Col. Scraps-the-Copper on 12/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Evelyn Fitzberg is awarded the Distinguished conduct medal: 'It is a common trope that the demolitions specialists work is flashy and thus attracts medals and commendations like nobody's business. I do not intend to break this trope. However, even with this expectation, I can say with confidence that you have done your duty diligently - slaying two xenonid queens in the process. Victory came that much easier because of your efforts.


  Awarded by Col. Scraps-the-Copper on 12/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Kaitlin Zalack is awarded the Distinguished conduct medal: 'A valuable asset on the battlefield - able to route both bug and marine alike. Preventing the marines from making terrible decisions, and forcing the xenos to make terrible decisions is a surefire way to bring victory that much closer to our grasp.


  Awarded by Col. Scraps-the-Copper on 12/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





