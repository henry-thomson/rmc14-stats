roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jose Cazadores, Spike MacLagan, Shoots-for-Moon, Joe Miller, Mariabella Dryfus, The Aquifer of Cowardice 'Aqua', Miguel Delpontes.



  Royal Jelly Awards:

  Young Hivelord (XP-458) is awarded the Royal jelly of proliferation: 'For your non stop building since the beginning and end of the battle. You are earning this jelly for immense impact on making fortications when required to do so. May I see more of your work in the future! Rejoice!' by Prime Queen (PRO)

  Elder Boiler (FI-334-N) is awarded the Royal jelly of resilience: 'For your great help in defending the hivecore north west of admin for so long. Buying at least 20 or 15 minutes of time, allowing new tier 3's I am rewardng this jelly for your resilience, in prevention of the talls advance. It was so awesome to manage and overlook this battle, I am proud of you. Rejoice!' by Prime Queen (PRO)

  Young Ravager (OXD-680) is awarded the Royal jelly of sabotage: 'For your immenseful observation and gathering information on weaknseses, you pointed out to me, a fable weak spot in the tall nest that allowed us to get free captures in their nest. forcing the talls to all retreat and defend it until resecured. You did an immense amount of help, thank you.


  Rejoice!' by Prime Queen (PRO)




