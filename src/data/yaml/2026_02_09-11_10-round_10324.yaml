roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Elise 'Purple' Veira.



  Royal Jelly Awards:

  Ancient Defender (CHO-502) is awarded the Royal jelly of proliferation: 'For your efforts in securing the tuber, whom YIP has a great grudge with, you are awarded this here jelly of proliferation. Your amazing work during the lowest of lows of the hive has been noted and rewarded.


  Not only that you also continued to secure captures during our entire battle even without the help of YIP.


  YIP!!' by Elder Queen (YIP)

  Mature Warrior (BR-860-G) is awarded the Royal jelly of proliferation: 'BRG, today you helped secure a lot of captures. You worked hard with your fellow sisters to safely secure captures for our hive to grow ever stronger.


  Even when YIP went down in a fit of greed, you still stayed strong and kept on capturing. For this you deserve the jelly of proliferation.


  YIP!!' by Elder Queen (YIP)

  Ancient Carrier (EEP-407) is awarded the Royal jelly of sabotage: 'EEP, your great efforts of psychological warfare does not go unnoticed. You make every step the talls take feel like a gamble. When the talls have to question the very ground they stand on they can't be expected to think clearly.


  Your efforts have helped us secure victory today. YIP is proud of your work in both helping secure captures but most importantly causing the talls to worry that every step could be their last.


  YIP!!' by Elder Queen (YIP)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
