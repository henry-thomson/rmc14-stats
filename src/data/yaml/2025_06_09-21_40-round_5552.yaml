  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Judd McClaine, Chews-Her-Tail, Jake Keas, Mizuno 'Kitty' Drakonovisch, Snorri Stoutbrow, Alec 'Protag' Buchanan, Rex 'The Hammer' Harrigan, Chiki Sugimoto, Kurome 'Nyawka' Nyawkowska, Bill Skyler, Alexander Mehankov, Samuel Bairstow, Tanya 'Tempest' Era.



  Medal Awards:

  Samuel 'Shady' Scott is awarded the Distinguished conduct medal: 'It's not every day you expect an FTL to go above and beyond their duty. But today is one of those days. "Shady Scott" as I like toc all him, displayed what it means to be a Team Leader. If you ever find them in your platoon, rest easy!'



  Royal Jelly Awards:

  Ancient Drone (LO-225-VE) is awarded the Royal jelly of rejuvenation: 'This one supported us in a time of crisis. Providing much needed curor fruits in order to bolster the initial hive defenses. Thank you so much for your support today.' by Prime Queen (HSQ)




