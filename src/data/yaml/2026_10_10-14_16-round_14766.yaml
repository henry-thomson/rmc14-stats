  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Victoria Petrova.



  Royal Jelly Awards:

  Drone (MN-4-C) is awarded the Royal jelly of rejuvenation: 'You have earned ARGs respect by giving your life to capture the tall lurker. That monster kept our backlines clear and consistinly removed our build and killed sisters. Thank you daughter.' by Elder Queen (EKAJ)

  Ancient Defender (ARG-15) is awarded the Royal jelly of proliferation: 'You did many defender Fu captures while I was in ovi, being our main source of new sisters for a LONG TIME. You then devoed from warrior to KEEP dragging off me and did exactly what I needed to capture MANY talls. Thank you daughter.' by Elder Queen (EKAJ)

  Prime Hivelord (SIP-547) is awarded the Royal jelly of resilience: 'You did exactly what you needed as a builder. You repaired pylon and held the line in the face of dozens of talls. You also built the front and backline that allowed for us to win this day. Thank you daughter.' by Elder Queen (EKAJ)

  Mature Carrier (MEL-285) is awarded the Royal jelly of proliferation: 'performed admirably producing captures via traps. Many talls were taken by defenders into traps that produced sisters to fight this war. We needed you. Thank you daughter.' by Elder Queen (EKAJ)

  Elder Queen (EKAJ) is awarded the Queen Mother Royal jelly of supremacy: 'For your dedicated perseverance and exemplary leadership snatching victory from the clutches of the Tall menace even when they sought to utilise a Hive Killer. Rejoice!!' by The Queen Mother




