  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kiefer Stohl, Kas'Lurla-Skeh'Kasar, Nelliel Terhaus, Emma Faith.



  Royal Jelly Awards:

  Young Burrower (SLM-340) is awarded the Royal jelly of resilience: 'SLM tunnels saved more than half of the hive in critical moments, specially when our hold in colony fell. Allowing sisters to retreat without any casualty. Without her tunnels, the hive would have been doomed from the start. We are proud to have you in the hive!!' by Elder Queen (LAG)




