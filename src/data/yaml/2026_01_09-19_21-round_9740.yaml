roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vasra Deltora, John Moore, Daniel Dennis, Diarsia 'Dima' Maxima.



  Royal Jelly Awards:

  Prime Runner (ABO-649) is awarded the Royal jelly of sabotage: 'You gave vital information at every turn. Every information given has allowed me to exploit the talls defenses at ease because you were my eyes, and gave information that I listened to.


  You have shined once again prime runner, you also made many captures because of this, Rejoice!' by Prime Queen (PRO)

  Young Runner (RA-749) is awarded the Royal jelly of sabotage: 'You have shown commitment to your role, as scout leader you have ensured to report every tall location and did amazing, you even slow down tall to get captured.


  Every information given as rewarded me captures


  I am proud of you for the growth you have made, rejoice!' by Prime Queen (PRO)

  Mature Drone (AX-328) is awarded the Royal jelly of rejuvenation: 'You have done a superb job mature drone, your passion of healing knowns no bounds, the rules flip upside down the moment you instant healed all injured sisters, so that they can fight back instantly.


  You have aid and perform greatly to the battle of attrition great work!


  Rejoice!' by Prime Queen (PRO)




