roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Patton Hawkins.



  Medal Awards:

  Gunnery Sergeant Andreas 'Martyr' Savalas is awarded the Medal of exceptional heroism: 'Gunnery Sergeant Savalas you were savor of our FOB today after so much of bravo was wiped out. You managed to help keeps comms up, our backline safe and prevented many breaches. You had your Squad of Deltas fight the horde on their own for much of the Operation. Your bravery is reflected in your Squad Gunny and for that the UNMC is proud to have you as one of their elites.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





