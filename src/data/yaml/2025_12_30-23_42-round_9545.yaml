roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ron 'Spitz' Purrman, Izumi AW Maxim, Camilla Harland, Hudson 'Hungry' Demuth, Swift Burrows, Tybalt Entenjager, Shoots-for-Moon, Gary C Humperdink, Violet 'Quickdraw'  Weisgarber, Nyx Nova, Squeak, Cecilia Wile, Titus Gregory, Rhaun-Ironclaw, Greg Litchkin, Kylee Wible, Chaz Bimbles.



  Medal Awards:

  Dante Minnie is awarded the Distinguished conduct medal: 'For his actions groundside and heroism groundside.

  Corporal Minnie ran straight towards the sensory tower, getting it up in no time and allowing us to see the picture on the battlefield cearly.


  Awarded by Col. Freya Locke on 12/31/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





