roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Althea Leander, Rhys Hendricks, Speedy 'Explosive' Garrison, Sam Cresthzein.



  Royal Jelly Awards:

  Prime Hivelord (DEV-900) is awarded the Royal jelly of proliferation: 'You were the whisperer of resin, the floor beneath you obey as you rise pillar after pillar.


  Your cover as provided substantial benefits as my daughters utilized it to inch ever so closer to the threat at hand.


  You were praised for your immense help when needed I thank you for pushing through and making yourself stand out!


  Be proud prime hivelord, for you have earned it.' by Prime Queen (PRO)

  Young Boiler (LI-511) is awarded the Royal jelly of resilience: 'Through thick and thin, no matter the danger, you were always by my side boiling to provide substantial cover and smoke of death that clouded the talls accuracy, perhaps even scoring me a couple captures here and there as I recalled.


  I implore your bravery and effort young one, may you preserve and live longer with this jelly I bestow upon you, and may you look back and be proud of the way and route you have made through this battle.


  Rejoice!' by Prime Queen (PRO)

  Ancient Drone (AX-928-E) is awarded the Royal jelly of resilience: 'For your bravery through this battle. I am bestowing the jelly of resilience.


  You kept building up behind each main push allowing us to hold ground and continue the will of the hive.


  It helped protect many injured from fatal injuries, and focus around building support strucutres that help aid the recovery of your sisters. 


  I thank you for your immense work, rejoice!' by Prime Queen (PRO)




