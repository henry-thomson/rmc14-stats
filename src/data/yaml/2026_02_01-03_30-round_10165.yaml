roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Moist Log, Ella 'The Bat' Cliff.



  Royal Jelly Awards:

  Mature Praetorian (AR-810-ES) is awarded the Royal jelly of resilience: 'Daughter ARES did a wonderful job at being a valkyrie, being tubed once and saving sisters multiple times from Tuber.



  Rejoice! To more hives with you i shall pray!' by Ancient Queen (RP)

  Elder Praetorian (ARF-723) is awarded the Royal jelly of resilience: 'Daughter ARF did a wonderful job as a valk, saving multiple sisters and doing good tantrums.


  Rejoice! I know that i can count on you with my life!' by Ancient Queen (RP)

  Prime Hivelord (ZAO-894) is awarded the Royal jelly of rejuvenation: 'Sister ZAO was a hivelord very important to the frontline, securing wipes and giving safe places at every open space.



  Rejoice! I love you a lot my sweet hivelord, and hope to continue seeing you!' by Ancient Queen (RP)




