roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  Medal Awards:

  Juan 'Lazarus' Cruz is awarded the Distinguished conduct medal: 'Exceptional leadership of Delta squadron. Ensured that their fellow marines were well supplied and well coordinated to be killers.'

  Nevaeh Pfeifer is awarded the Medal of valor: 'Went above the line of duty today. When their SL and FTLs all fell in battle, they took up the mantle of leadership and performed admirably.'

  Ayumi is awarded the Distinguished conduct medal: 'Saved the lives of many marines today with their medical prowess. Many of us today owe the fact that we are still alive to you.'

  Samuel Draxler is awarded the Medal of exceptional heroism: 'As the Bravo squad leader, held the line against insurmountable odds as the xenonid hordes bore down upon the FOB whilst the marines gave them hell elsewhere. A true symbol of what it means to be a me'

  Polishes-The-Boots is awarded the Distinguished conduct medal: 'Scored a great number of kills against the xenonids during this operation. A true killer, something every marine should aspire to be.'



  Royal Jelly Awards:

  Elder Drone (SPR-829) is awarded the Royal jelly of rejuvenation: 'Your healing was perfection. You healed majority of your sisters through out this war. I hope to see that you even further perfect your ways of healing!!!' by Prime Queen (PRO-290)

  Young Boiler (XX-414) is awarded the Royal jelly of slaughter: 'Your boils were excellent! You have withstand the harsh condition this war and kept speaking globs of acid at the talls. You survived from the beginning to end. Well done!' by Prime Queen (PRO-290)

  Mature Crusher (CR-578-S) is awarded the Royal jelly of resilience: 'For your resilience for the hive. You protected sisters to make safe captures. You stomp on the tall army without fear and furthermore you decide to even survive till the end of the war! rejoice!' by Prime Queen (PRO-290)

  Elder Lurker (ACE-499) is awarded the Royal jelly of proliferation: 'For your captures for the hive, you bring forth a future generation! You capture a total of 10  and a bit more well done! May the queen mother be proud!' by Prime Queen (PRO-290)




