roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Cheeky Chloe, Glorp Blorbleson, Felix 'Cat' Phillips, Blooms-In-Blood.



  Royal Jelly Awards:

  Elder Praetorian (OH-841-M) is awarded the Royal jelly of resilience: 'Quick thinking, great timing, and wonderful skill. You displayed all of these today. In the heat of the moment, when it seemed the hive would end, you evolved, and secured us yet more life, and from that, we inched our victory. Though you died, you are celebreated dearly. Keep the ambition up.


  Love,
    Mother.' by Ancient Queen (JINX)
  Ancient Hivelord (GRY-463) is awarded the Royal jelly of proliferation: 'This colony and hive was built and destroyed over and over and over this day. And yet, you stood strong, and kept it built over and over forth. The talls kept pushing further in, and you kept covering their paths in resin. If it wasn't for you, the talls would've cleared us out handily. Your hard work payed off today. Rest will daughter.


  Love,
    Mother.' by Ancient Queen (JINX)
  Mature Carrier (ZAI-734) is awarded the Royal jelly of rejuvenation: 'While this jelly is normally for healing, Today, this jelly is for life! While at our lowest moments, we captured talls slowly, over and over, and we couldn't have done so without a constant supply of eggs just around the corner each time. Your quick thinking and endless percistence over this day has proven well, and we will look forward to the effort as the hives go on.


  Love,
    Mother.' by Ancient Queen (JINX)



