roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Drone (AKI-928) is awarded the Royal jelly of rejuvenation: 'AKI proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Oh the tragedy of my heart when I saw AKI die, no matter we avenged her! May the future hives are blessed with her presence as well!' by Ancient Queen (LIMA)

  Ancient Drone (SI-606-L) is awarded the Royal jelly of rejuvenation: 'Eternally stuck to the queen like a bad tumor, but in a good way of course, she provided whole hive with most scrumptious fruit! SIL made sure ALL of the hive is working at their maximum performance. Talls had only ONE goal in mind, kill SIL. Clearly they failed! Such is life of SIL, the terror of her immortality scares them to run. Thank you SIL for scaring them away!' by Ancient Queen (LIMA)

  Ancient Ravager (LU-164-AN) is awarded the Royal jelly of slaughter: 'For her incredible work as a murderer of a supreme caliber, LUAN deserves the royal award! She managed to capture talls time and time again, a literally never ending flow. She had her head straight, priorities high, and captured tuber no less! Her demise was untimely, nobody is perfect after all, but LUANs status preceeds her. Oh how we becon her to help the further hive expansion!' by Ancient Queen (LIMA)

  Young Carrier (ZR-96-G) is awarded the Royal jelly of sabotage: 'Young yet incredibly capable sister played a vital role in terrorizing the talls. She kept rotating, weeding, and trapping anything she could get her claws on, and poor talls just watched in despair. Her children were plenty, her skills obvious! We hope to see our sister soon enough!' by Ancient Queen (LIMA)




