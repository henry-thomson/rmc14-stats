roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Maximus 'Max' Espinosa, Marshall Poley.



  Royal Jelly Awards:

  Ancient Defender (BU-560-RG) is awarded the Royal jelly of resilience: 'Your bravery kept you holding the metal beast doesnt matter how much pain you felt. Everyone backed out, with the exception of me and you. We kept there to the end. Until the beast was slain.


  Wonderful work, my dear daughter, for you held the beast so long our units and their own spit made it die.


  You are now BURG, our beast slayer.' by Prime Queen (RP)




