roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Zhyara Thalorin, Estelle Kanin, Polishes-the-Boots, Caleb Bloodworth, Diego 'Snake' Santiago, Aurelius Magnus Copperward, Blossom 'Rose' Nibbles, Avalon 'Goose' Bone-Mender, Brock Beckles, Lilly 'Pipsqueak' Harding, Smoke Woolery, Mick AW Flamer, Elias 'Donut' Bennett, Vesper Finley-Arcus, Trent 'Fent' Morgan, Huffie Dawkins.



  Royal Jelly Awards:

  Elder Ravager (TCH-907) is awarded the Royal jelly of slaughter: 'TCH you truly proved yourself a relentless killing machine today in the battle of Chance's Claim. In the direst of times, even when the talls showed no fear and pressed into the heart of our hive, you brought forth your claws in a spectacular whirl of blood and guts. I was immature but under my pheromones, you and your sisters descended upon our prey and wiped them out against all odds, making this victory possible. You were an unwavering force when the hive needed you most. Let this jelly recognize your efforts. Rejoice!' by Ancient Queen (OTTO)




