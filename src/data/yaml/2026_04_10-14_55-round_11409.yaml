roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Amaryllis 'Alice' Alison, Xi-Na, Kara Hathaway, Pepper.



  Royal Jelly Awards:

  Mature Sentinel (JAM-446) is awarded the Royal jelly of rejuvenation: 'JAM, your drone body was surrendered and thus can't recieve this jelly. Though your mind was the one which saved ALI as a healer when most needed.


  Your sacrifice at the right moment to save a T3 has helped us greatly this day, and for your selfless act you shall recieve this here jelly of rejuvination!


  More sisters should act like you and save sisters in need!


  YIP!!' by Ancient Queen (YIP)

  Mature Praetorian (FIG-146) is awarded the Royal jelly of rejuvenation: 'Your scream at the right time has undoubtedly saved our ravager ALI this day. For your  quick wits and fast reactions you shall recieve this here jelly of rejuvination.


  YIP will always love to have sisters who know when to scream to save a fellow sister in the hive. Keep on working as you do for the future and never let yourself get distracted. For we never know when a scream could save a sister.


  YIP!!' by Ancient Queen (YIP)




