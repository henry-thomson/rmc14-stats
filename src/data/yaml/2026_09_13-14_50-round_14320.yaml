roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Starts-The-Fire.



  Royal Jelly Awards:

  Prime Boiler (EH-784-HE) is awarded the Royal jelly of slaughter: 'EHHE, Our only boiler. You have done well in stalling the talls in caves. They could never make progress as your boils constantly hindered their progress.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Prime Queen (NEV)

  Prime Ravager (DA-538-RK) is awarded the Royal jelly of sabotage: 'DARK, You have wiped the scavs on your own, and effectively halted their plasma gain. You have also helped greatly in our final push to force the talls into fleeing.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Prime Queen (NEV)

  Prime Ravager (DID-953) is awarded the Royal jelly of slaughter: 'DID, You have done an amazing job capturing and mostly killing the talls in caves. You have helped immensely in the wipe aswell, securing many talls to be rotted and forgotten.


  For this, I award you this jelly of slaughter, Rejoice!


  See you in the next hive!' by Prime Queen (NEV)

  Prime Praetorian (FOX-814) is awarded the Royal jelly of rejuvenation: 'FOX, You have spent the entire day trying your best, not only to secure captures for our great hive, but also saving as many sisters from the talls as you could. Many of them wouldnt be here without you.


  For this, I award you this jelly of rejuvenation.


  See you in the next hive!' by Prime Queen (NEV)




