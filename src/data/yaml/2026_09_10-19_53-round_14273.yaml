roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Melvyn Gutterswipe, Varisia Lote, unknown.



  Medal Awards:

  Second Lieutenant Aurora 'Birdcage' Barkheart is awarded the Medal of exceptional heroism: 'Your excellent use of your air frame battered and bruized the xeno horde. putting them on the back foot allowing marines to take every foot hold we got a hold of. without you i doubt we could of done anything this opperation. for that i grant you the highest honor i am allowed to  offer


  Awarded by Col. Tyr Ragnarson on 09/10/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Sergiy 'Hell' Vovk is awarded the Bronze heart medal: 'died in the line of duty trying to save his fellow marines. you put your all into your action and your actions although heroic. sadly did not pan out in your favor. if only we had more like you


  Awarded by Col. Tyr Ragnarson on 09/10/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





