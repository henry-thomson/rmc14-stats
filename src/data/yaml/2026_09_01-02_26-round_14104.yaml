roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Snaps-the-Bolt.



  Royal Jelly Awards:

  Prime Ravager (JA-975-KE) is awarded the Royal jelly of sabotage: 'JAKE, with the help of FOOL, you have not only sabotaged the tall's resin line, but killed and rotted a good number of them. You have also killed the tuber inside the lesser beast, allowing for a quick and easy perch wipe.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)

  Prime Burrower (FO-844-OL) is awarded the Royal jelly of sabotage: 'FOOL, You have done well. Your plan to hide in the lesser beast and kill any foolish enough talls to enter with JAKE went great. This plan even lead to the tuber dying and allowing us to wipe perch easily.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



