  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Sviatoslav Konstantinovich, Porter 'Porker' Keopple.



  Medal Awards:

  Private First Class Edwardo 'El Guapo' Flores is awarded the Distinguished conduct medal: 'For an outstanding show keeping our sensors on as long as you did. making sure we never lost track of the queen and her brood.  you did an outstanding job to your squad. and a great service for the company


  Awarded by Lt Col. Tyr Ragnarson on 02/20/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





