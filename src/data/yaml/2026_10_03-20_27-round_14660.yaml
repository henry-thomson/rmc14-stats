roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Tyrone Choom, Camryn 'Cavalry' Turnehare, Yornex'xel St'Rwuzzle, Alicor 'Pinkie' Merow, Cronin 'Fig' Pekoe, Frances Coggs, Texas Winchester.



  Medal Awards:

  First Lieutenant Aurora 'Birdcage' Barkheart is awarded the Distinguished conduct medal: '1st Lieutenant Aurora Barkheart significantly contributed to the the blood of the UNMC and its operations through their valiant efforts in maintaining the logistical supply chain through requisitions.


  Their efforts were reported by both CIC and Frontline troops as instrumental to the operational success. It is a saying often spoken, but seldom as truly embodied as today 'Logistics wins wars'. Well done Lieutenant.


  Awarded by LtCol. Kaitlin Zalack on 04/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





