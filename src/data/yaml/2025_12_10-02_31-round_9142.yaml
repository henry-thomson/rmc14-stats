roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Kip, Marvin 'Potshot' Stange, Liam 'Property Damage' Harper, Kyriss 'Snow' Winters, Hams Kuro, Sophia 'Muffin' Moeller, Night-hunting Monty, Mag Leadthrower, Sarah Al-Ghamdi, Felix Harada, Elias Palehaven, Kozmi, Vinny Sanders.



  Medal Awards:

  Sadie Sims is awarded the Distinguished conduct medal: 'For their diligent use of the XM51 and clearing our way forwards, I commend your efforts as a marine to get the job done, no matter what.


  Awarded by Col. Scraps-the-Copper on 12/9/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
