  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Defender (FE-841-ET) is awarded the Royal jelly of resilience: 'During the battle of solaris you thrown your life away for the destruction of the metal beast, this is for all sisters who did the same deed. However I just wanted to commend good effort in your valid attempt in doing so, all efforts are painted in gold. Rejoice for the deeds you did for the hive!' by Prime Queen (PRO)

  Prime Ravager (NEV-967) is awarded the Royal jelly of slaughter: 'During the battle of solaris. After the first queen death BUH. I tooken over during that time frame, I saw you do multitude max rage in the open field thanks to my phermone support, and healing. You were able to continously punish them in the open field. Even after they sky fired, it wasn't still enough and we pushed them back to the point of wiping them you were the main reason of the slaughter. Thank you for pushing through your limits to smite down the talls for the hive. Rejoice!' by Prime Queen (PRO)




