  [color=purple]All of the marines were wiped out![/color]


  Medal Awards:

  Astor Debb is awarded the Distinguished conduct medal: 'Excellent shooting during this operation - many a xenonid menace fell to your precisely aimed rockets, including one xenonid Queen.'

  Atlas Stargazer is awarded the Distinguished conduct medal: 'Excellent leadership of Charlie after their squad leader was taken. Held the line at engineering - ensuring we had communications established the whole op.'

  Ranuko is awarded the Distinguished conduct medal: 'Took charge of Alpha squad after their squad leader was transferred to Echo for our strategies. Did an excellent job of it, too.'



  Royal Jelly Awards:

  Young Drone (XX-776) is awarded the Royal jelly of rejuvenation: 'For sacrificing your life to prolong mine in my first queen body, you did great. I am proud of you, you did a vital moment to sacrifice yourself for the greater good, well done!' by Immature Queen (PRO-8)




