roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Luna Kuster, Randolph Carter.



  Royal Jelly Awards:

  Elder Carrier (DI-353-ES) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, sisterhas deserved the royal award! She managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war, she was a partial mother to the rest of the hive, and seemingly the only carrier around! Oh how we becon DIES to help the further hive expansion! May her children are plenty!' by Ancient Queen (LIMA)

  Young Hivelord (VAN-675) is awarded the Royal jelly of resilience: 'Our most honorable sister VAN kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls as the sole hivelord! She stalked the talls with her keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)

  Drone (XX-211) is awarded the Royal jelly of rejuvenation: 'Sister proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Always at the front, saving her queen in times of need! No matter her name, her talents will be of high demand! Help us sister! Make us one of your greatest gardens.' by Ancient Queen (LIMA)

  Prime Ravager (PRO-381) is awarded the Royal jelly of slaughter: 'As is fortold, our most gracious PRO is a sight to behold. I avoid awarding jellies to experienced sisters outside of truly prime accomplisments. Today PRO proved herself with impeccable timing on rotations towards the eye after we breached perch, an endless pressure towards the talls attempting to recover the eye slaugher, and repeated attempts at forcing talls to evac by slaugheting them in perch! Such is life of a legendary APEX!' by Ancient Queen (LIMA)




