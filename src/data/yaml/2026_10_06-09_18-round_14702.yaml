roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Bennett Biery, Alfred Byers, Helle 'Hellfire' Scorchedwing, Nahami, Samuel Starseeker, Dillon Turner.



  Medal Awards:

  Corporal Ron 'Camouflage' Stanton is awarded the Medal of valor: 'Corporal Ron Stanton during an operation facing xenonid opponents risked life and limb as they manouvred behind enemy lines, delivering critical intelligence and subterfuge.


  Among the actions undertaken, the cause for this award, was the rescue of 3 captured marines from a xenonid hive and the active defense of their evacuation as the hive responded. Corporal Stanton would not return to see their success as they sacrificed their live to ensure those marines saw another day.


  Your bravery will live on in our hearts Corporal, and stand as an example to what it means to be a marine. May you rest easy.


  Awarded by LtCol. Kaitlin Zalack on 06/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





  [bold]Operation funded by [color=green]Xeno Agents[/color]![/bold]



  [bold]Hive established by [color=purple]Momma Kanin's Sandal[/color]![/bold]
