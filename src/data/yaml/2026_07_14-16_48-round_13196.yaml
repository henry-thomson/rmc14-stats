roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tony Focell.



  Royal Jelly Awards:

  Warrior (XIP-780) is awarded the Royal jelly of resilience: 'This sister, despite many tall attempts, stood firm and captured many talls, leading to our victory. 


  For that I reward you, little one!' by Ancient Queen (GDP)

  Drone (XX-30) is awarded the Royal jelly of rejuvenation: 'She saved our best warrior in the moment it mattered most: Saving our strength for the assault that broke the talls back


  We thank you little one' by Ancient Queen (GDP)

  Young Runner (WE-836-T) is awarded the Royal jelly of sabotage: 'Her claws found their way to the talls weakest point: allowing older sisters to use the moment and defeat the talls once and forall


  Thank you little one' by Ancient Queen (GDP)

  Mature Hivelord (CZ-154-E) is awarded the Royal jelly of resilience: 'Her timeley build lead allowed us to not only hold our ground: But gain it - her leadership allowed many captures and advancments into talls


  I thank you little one.' by Ancient Queen (GDP)




