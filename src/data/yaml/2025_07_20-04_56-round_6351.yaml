  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  The Willow of Control, Bloody 'Bloody' Light, Gnaws-on-Bones, Chez 'Cheese' Woodtiger, Gustav Adolphus, 'Granny' Smith, Vairel 'Scorne' Kilgrim, Justin Smit, Fitz Wallick, Nahami, Boneapus Allspark XV, Nikki 'Ferret' Blackburn.



  Royal Jelly Awards:

  Young Carrier (AN-281) is awarded the Royal jelly of proliferation: 'You have done an amazing job my carrier, for that you deserve this jelly of proliferation. Since the beginning I was in ovi, I ordered you to work with an prime oppressor praetorian. You went ahead did it, and made things happen! Absolute peak performance was done, as you placed eggs in the right positions for the oppressor to utilize, even thought it stressful perhaps for you. You made an huge impact in the battle. Not to mention when I got up I was even able to use your eggs as well, scoring even more captures than I can even count. You were truly a shining example of a egg carrier when we needed the most. May the Queen Mother watch over you, rejoice!' by Prime Queen (PRO)




