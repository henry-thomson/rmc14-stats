roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sadie Sims, Xi-Na.



  Royal Jelly Awards:

  Ancient Praetorian (AL-867-BY) is awarded the Royal jelly of slaughter: 'Despite the hard fought battle, your bravery shone through. Between being part of the great tuber capture to your many efforts throughout the fights, without you we surely would not have had as great a victory, if one at all. Rejoice!' by Elder Queen (WAR)

  Young Spitter (NEY-637) is awarded the Royal jelly of resilience: 'Throughout the fight, I noticed you, giving information, combatting the talls, and in your shining moment, being part of the great tuber grab, without need of my help at all. Your contributions cannot be overstated and without you, this hive would feel empty. Rejoice!' by Elder Queen (WAR)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



