roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Yildiz Turkuvaz, Qorrak Oryndis, Quarter-Off, Tesumi.



  Royal Jelly Awards:

  Elder Warrior (OWL-596) is awarded the Royal jelly of proliferation: 'Though I was not present, sister OWL has been reported to me as a great warrior and helping the hive alot! I believe she made alot of captures, therefore I grant her this jelly of proliferation! Rejoice!' by Elder Queen (XR)

  Mature Hivelord (KAR-887) is awarded the Royal jelly of resilience: 'KAR, Our great hivelord has been with us from the start and almost made it to the end. she fell like a hero, however. For building our hive from the start and up until she died, I grant her this jelly of resilience. Rejoice!' by Elder Queen (XR)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
