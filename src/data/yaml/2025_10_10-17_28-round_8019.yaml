roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nia Lovelace, Bofrin 'Thirsty' Stoutbeard, Barka Symphony, John Plum, Cooper Wright, Hazzy Licious, Shei-Teegla, Foilage of Bravery, Ae Ti, Astraia-Seraph.



  Medal Awards:

  John Arcade is awarded the Distinguished conduct medal: 'Was instrumental in constructing, and managing a FOB that stood the test of a xeno infestation. So much so, in fact, that one of their very own matriarch fell in trying to pierce the defenses. Thank you for your efforts.


  Awarded by Col. Scraps-the-Copper on 10/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





