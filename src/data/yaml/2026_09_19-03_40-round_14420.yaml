  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  The Winter of Silence, Sips-The-Cola, Rekoli, Liberty AW Falchion, Burns-The-Flowers, Nina Fontain, Tyson Weller, Risk-the-Empire, Harry Johnson, Sanna Holberg, Ragna Colt, Spits-The-Fire, Ocean Rain, Starsus Platinus, Bites-the-Cables, Harlow 'Deadman' Kazimierz, Ivan Petrenko, Ash Comierdre, Claude de Anges, Ember 'Foxfire' Crux, Solus Astrania, Koho Ustas, Annie 'Ark' Keys, Reika 'SweetTooth' Inazuma, Harlem Kosiva, Armando Olphert, Glorp Blorbleson, Menodora Mothaden, Nesyo 'Chemist' Konuni.



  Medal Awards:

  Captain Otto von Eichensthal is awarded the Distinguished conduct medal: 'While serving as Executive Officer during Detour Uniform-Saif, you demonstrated exceptional leadership and tactical acumen by relaying vital hostile positions and managing operational flow, significantly minimizing casualties and ensuring mission success. Your exemplary leadership reflects great credit upon yourself and upholds the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature

  Staff Sergeant Buck 'Pretty' Tern is awarded the Medal of exceptional heroism: 'While serving as a Squad Leader during Detour Uniform-Saif, you demonstrated extraordinary heroism by advancing through neurotoxic boiler gas that had severed you from your squad, relentlessly pressuring the boiler into retreat at the grave risk of your own life. Your selfless courage reflects great credit upon yourself and upholds the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature





