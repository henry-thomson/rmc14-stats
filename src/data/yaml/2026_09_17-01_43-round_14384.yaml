  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Aurora 'Birdcage' Barkheart, Defends-The-Comrades, Aiko Locuster, Stellamaris Hall, Dustin 'Fisheyes' Graham, Kon-iro 'Blue' Nyako, Jim 'Smokey' Werner, Alicor 'Pinkie' Merow, Bonney 'Bun' Violet, Cay 'Stargazer' Neseko, Screams-A-Lot, Velsha Xilareth, Ruco 'Roz' Amenaza, Lyn 'Liquid' Nakamura, Bastian Antlia, Donovan Todd, Eliot Joyce, Stares-at-Stars, Pickles Ticklesome, Jasyo, Willie Manley, Long-ears Lucas, Chews-the-Wires.



  Medal Awards:

  Sergeant Culls-The-Leviathan is awarded the Medal of valor: 'For the expert use of your JTAC skills. marking cords directly onto the queens horde. which was used to drop a bomb direct on their head from the Almayer. this was an excellent show of your skill and glad we have you in the corp


  Awarded by Col. Tyr Ragnarson on 09/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





