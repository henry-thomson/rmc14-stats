roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Luh-Jilux, Reesa-Seed, Icey Iana, Iris 'Nades' Moondancer, Ryushi Okazaki, Sevastyan 'Sevas' Rusin, Jamal Johnson, Vuk Drexler, Esmeralda 'Rockin' Stone, Nyx Sparkdrawn, Luxi 'Ordance' Lustrion, Alec 'Protag' Buchanan, Dale Gregors, Chee 'Pressure' Mach, Bobert Brockson, Percival Weeter, Krezz-the-Dawn, Emilia Maekh, Stares-at-Stars, Hector 'Shish' Bakirtzis, Del Smirnov, Cinnabar, The Bay of Fragility.



  Medal Awards:

  Del Smirnov is awarded the Bronze heart medal: 'Gave their life during the events of Operation Peacekeeping Mission Grumpy-Warden to safeguard the lives of their fellow marines.

  We will remember you.


  Awarded by Col. Scraps-the-Copper on 11/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Edy Nelson is awarded the Distinguished conduct medal: 'This rifleman took up the mantle of leadership and helped to coordinate their fellow marines to hold fast against numerous xenonid attacks on the FOB. They tested us hard during the opening moments, and we weathered the storm.


  Awarded by Col. Scraps-the-Copper on 11/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Carlos 'Helsing' Santiago is awarded the Medal of valor: 'Bravely charged alongside myself into the xenonid hordes numerous times, being an inspiration to all as we fought and fought against a tireless enemy.


  Awarded by Col. Scraps-the-Copper on 11/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  John 'Lifeline' Spade is awarded the Distinguished conduct medal: 'Through commendation of your chief medical officer, I see it fit to award your efforts.


  You were instrumental in ensuring that the medbay had as many supplies as it did, and so quickly! I can vouch for these facts myself, as I was able to procure myself a full suite of pills with tons to spare for the other marines before first drop.


  Awarded by Col. Scraps-the-Copper on 11/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Stu 'Stew' Lizo is awarded the Medal of valor: 'Was instrumental not only in the construction and defense of the FOB, but the construction and defense of our desperate holdout against the xenonid menace that had found their way on to our vessel.

  Truly, a master of the FOB. A shame the groundside FOB could not be utilized more to our advantage.


  Awarded by Col. Scraps-the-Copper on 11/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Mature Boiler (CTC-992) is awarded the Royal jelly of slaughter: 'You were here since the beginning of time, boils always hit their mark.


  You never have missed a single target left uncheck, each tall fallen and coughed through the destruction, the screams were delicious.


  You were rewarded this jelly not because of your role, but because of how vital and required you were needed for this. 


  May you be remembered through the hearts of a new hive. 


  Rejoice!' by Prime Queen (PRO)

  Prime Burrower (AID-850) is awarded the Royal jelly of proliferation: 'You were the prime burrower, since the beginning of the battle. 


  Through it all, you have made captures for the hive.


  Tunnels all used since the beginning to end of the battle we had.


  Your performance was no other than vital to this hive, that of which had led to the defeat to the tall army. 


  The tunnel that were utilized, Admin, excavation, workshop, hospital. All of these were perfect, that were created by you.


  May you always be evil against talls, as each trap, and each tremor made brought only death to them all.


  Rejoice, for you have deserve this jelly for your work.' by Prime Queen (PRO)

  Mature Defender (GU-929-P) is awarded the Royal jelly of resilience: 'You have done an excellent job defender, you sacrificed yourself, so that I could live, I took note of it because without you shielding I was definitely going to die without you.


  May you keep this mindset in mind may you always shine to be the true defender you always were.


  The hive will not forget your sacrifice. Rejoice!' by Prime Queen (PRO)

  Prime Crusher (MRT-817) is awarded the Royal jelly of resilience: 'Crusher, The wall, the shield of the hive. You were here since the beginning of time, be the unstoppable shield you were, you prevented the deaths of many sisters. 


  You also made sure that captures were made by shielding or disrupting talls pushs as I exploited their weakness.


  You did your duty till death was the only thing to stop you, even after your death the hive shall remember you!


  Rejoice!' by Prime Queen (PRO)




