roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Billy Zerkgnoff.



  Royal Jelly Awards:

  Elder Runner (SA-374-D) is awarded the Royal jelly of slaughter: 'My dear child, you have proved your loyalty towards our hive, I am not gonna lie to you if not for you my child this could have gone much more differently


  You have gathered 1000 acid from hitting those disgusting talls allowing you to maximize the radius of your explosion. When you exploded on my scream killing many talls you've secured the victory for us. I am very proud of you and I hope to see you slaughtering talls like this in the future


  With love -- Ancient Queen LIVY' by Ancient Queen (LIVY)

  Carrier (EM-306-C) is awarded the Royal jelly of proliferation: 'Ah my dear child EM-C, I have not been here to witness your help from the start but I have heard some recommendations.


  I have seen you working hard, placing many eggs around, allowing for fast capture. Sadly our first queen had died which is why I had taken her place


  I am very proud of you my child, I hope you do this well on your path towards prime carrier


  With love -- Ancient Queen LIVY' by Ancient Queen (LIVY)

  Mature Carrier (KL-748-A) is awarded the Royal jelly of proliferation: 'My child

  You have been recommended by your sister for your impressive performance and resistance, helping secure captures from the front, being a great support for the hive

  I am very proud of you

  Love -- Ancient Queen LIVY' by Ancient Queen (LIVY)




