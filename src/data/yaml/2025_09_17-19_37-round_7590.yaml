roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Loiosh Garland, Anatoliy Koltsov, Bar-Maxath, Dale 'The Gambler' Livosky, Stares-at-Stars, Sips-The-Cola, Ricardo Rohtin, Hazel 'Birdbrain' Musca, Brooke Reighner.



  Medal Awards:

  Hazel 'Birdbrain' Musca is awarded the Bronze heart medal: 'As per recommendation of their staff officer, I see fit to commend this marine's efforts. Staff Sergeant Musca performed excellently in the duties of leadership and being a killer, fulfilling their duty until the very bitter end.


  Awarded by Col. Scraps-the-Copper on 9/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Kara 'Bait' Smith is awarded the Distinguished conduct medal: 'As per recommendation of your SO, and groundside leadership, I see it fit to commend your efforts.


  Keep stacking them up, marine. It's always an inspiration to see some new blood that's got what it takes to be a real killer.


  Awarded by Col. Scraps-the-Copper on 9/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





