roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Kurome Nyawkowska, Danielle Sparks, Molie Lightweaver, Ajax Mampth, Jean 'Frog' Dupont, Varisia Lote, Vurok 'FlyBy' Zarethis, Faces-The-Music, Maeve Kali, Gersh Moon, Snamin Aeducan, Vincent 'Seer' Lancaster, Sadie Sims, Shahvee-Tail, Belfor 'White' Waylo, Ismael Ellis, Lucifer Lightweaver, Feece Riddler, Kyriss Winters.



  Medal Awards:

  Staff Sergeant Olivia 'Tick' Lambert is awarded the Distinguished conduct medal: 'For strong and effective leadership as Alpha Squad Leader, maintaining discipline and cohesion through Operation Task Force Over-Provectus on LV-522, Chance's Claim.

  The success of this operation can be directly attributed to her command and decisive actions.


  Awarded by Col. Freya Locke on 02/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke





