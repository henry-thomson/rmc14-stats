roundEndText: >2-

  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Gliese Saturniidae, Erin Baker, Pearson Pavish, Arkod Sinrir, Adrian 'Flak' Yeoh, Deekum, Cheeky Chloe, Darren Black, Markus Morgenstern, Ukawei-Nema, Braden Isemann, Willhab E Hunga, Olive Orr, Eli Pinney, Stella 'Cowabunga' Stewart, Randy Chi, Rina 'Shell-Shocked' Gensvil, Lotash-Saurmor, Isabell Mueller, Moses Blyant, Luke Williams, Emily 'Klutz' Rathen, Bettaius 'pills' Ashford, Francis Monroe, Gin 'Gramps' Matsuo, Long-tooth Alex, Lilac Hana, Mike Banks, Albert 'Moron' Dinkleberg, Kathryn Stalls, Quinn 'Twin1' Day, Ends-The-Bloodlines, Sugar, Evan Christopher, Icarus Shadowborn, Daniel Zoucks, Mike 'Giggles' Baynton, Sonny Bonds, Jacob 'Five Lives' Oakley.



  Medal Awards:

  Oberon 'Obi' Toski is awarded the Distinguished  conduct medal: 'Constructing a damn FORTRESS around sensors, so that we were able to hold it for the remainder of the operation. The intelligence that sensors was able to give me in the CIC proved paramount to our victory. Thank you for holding the line today.


  Awarded by Col. Scraps-the-Copper on 8/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Olivia Lambert is awarded the Distinguished  conduct medal: 'This is a medal that I wish to give on behalf of all of Alpha squad. You were given the dutious task of holding the line, preventing the xenos from escaping from the west reactors. This effort in the end, proved paramount to our victory.


  Awarded by Col. Scraps-the-Copper on 8/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Lorenzo Herder is awarded the Distinguished  conduct medal: 'On behalf of the entirety of your requisitions team, and in no doubt also to the efforts of yourself, you kept our marines well supplied and lethal during the entirety of the operation. That alone is a significant achievement, and I am certain victory would not have came without you running the ammunition, guns, medical supplies, and materials that we used today.


  Awarded by Col. Scraps-the-Copper on 8/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Eikii is awarded the Distinguished  conduct medal: 'As per request of your CMO, I find you willing to receive a commendation for your work today. You did it all - producing chemicals, handling surgeries, and ensuring that requisitions and by extension our groundside corpsmen had what they needed to keep everyone in one piece.


  Awarded by Col. Scraps-the-Copper on 8/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





