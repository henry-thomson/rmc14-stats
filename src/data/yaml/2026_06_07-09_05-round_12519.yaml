roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Renala 'Remi' Rhytrix.



  Royal Jelly Awards:

  Young Hivelord (MT-98) is awarded the Royal jelly of proliferation: 'For a young mind, you did exceptionally well in building the frontline and the backline. You have earned the praise of your sisters, alongside my attention. You're very talented and have a strong sense of dedication in building the structure and restoring much of the lost progress we made early on during the Tall Menace invasion. Despite the hardships, you prevailed, outlived most of your sisters, and endured long enough to support the hive when we needed those bright enough to build and reclaim the land we had lost.




  You did an amazing job securing the backline alone, alongside building up the north of Aerdome, once invaded by the Purple Caste. Yet you persisted. I am so proud of you, daughter. I hope this jelly is everything you need for your hidden talent to shine.' by Elder Queen (SVIA)




