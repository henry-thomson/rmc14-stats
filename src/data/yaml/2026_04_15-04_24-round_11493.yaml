roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  London Baxter.



  Medal Awards:

  Corporal Riley 'Tilter' Stone is awarded the Distinguished conduct medal: 'For distinguished conduct in the leadership of their squad during Recon Epsilon-Abilene, recommended by their officers and their marines, showing due initiative despite dangerous circumstances. Your competence saved lives today.' by Lieutenant Colonel The Force of Nature

  Lance Corporal Araneus Trifolium is awarded the Bronze heart medal: 'During Recon Epsilon-Abilene, with conspicuous gallantry and at risk to themself, made multiple precise maneuvers against the Xenonid Queen to great effect. In the end, they made the final sacrifice to ensure our marines could make it home.' by Lieutenant Colonel The Force of Nature

  Captain Sicilia 'Rose' Drakonovisch is awarded the Distinguished conduct medal: 'Throughout Recon Epsilon-Abilene, reflected great credit upon themselves and the UN Marine Corps with distinguished leadership and initiative, managing the CIC during the deployment of their Commanding Officer. Your speed in processing, disseminating, and acting on information saved countless lives today.' by Lieutenant Colonel The Force of Nature



  Royal Jelly Awards:

  Ancient Praetorian (ORB-384) is awarded the Royal jelly of resilience: 'For pushing your all duringt he moment when I was war queening you kept your resolve through thick and thin. Regardless of the outcome, you shined through what others couldn't. Even during my death, you still kept making the hive proud. Another key moment was you saving my life at one point when I was struck by the tuber, you did your part, and that all I asked for is your effort. 


  Remember! That no matter what happens no metal is stronger than your carapace! Rejoice!!!' by Immature Queen (PRO)

  Mature Drone (XX-959) is awarded the Royal jelly of rejuvenation: 'During dire circumstances when I was at the brink of death you sacrifice your own blood to keep me safe, regardless of what performance lay after that action, your intent was more pure than all that shines through. I want to thank you for doing your part for this hive, and may you keep that integrity and resolve throughout future journeys!' by Immature Queen (PRO)




