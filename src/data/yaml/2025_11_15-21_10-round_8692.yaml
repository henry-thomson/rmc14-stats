roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Fridrih Shtrohaim, Raynald Langston, Brooke Reighner, Sol Kot, Johnny Rivets, Brady 'Baby' Burns, Duncan Mortland, Tony Hoffmann, Shayla Milne, Keith Stohl, Fay 'Lovehate' Murray, Altair 'Christmas' Nightwish, Brings-In-Catch, Bungo Butterbelly, Jack Cuban, Buzz 'saw' Fibres, Rag-Heem, Elliot Winters, Dominic Howell, Kamiel Lancoaster, Cooper Wright, The Branch of Stoicism, Ulrick Birken, Oberon 'Obi' Toski, Arielle Straus, Sabina 'Morale' Brandt, Jesali, Tracey Neely, Garibaldi 'Ballin' Newley, Jasyo, Sebastian 'Justin Time' Eventide, Paris 'Patch' Fiscina, Alice Coffinfill, Viviana Hunter, Markus Volt.



  Medal Awards:

  Brooke Reighner is awarded the Bronze heart medal: 'An operation filled with frustration and loss. How easily things could have been different, hadn't you been taken nor if your many rockets did not get blocked by overzealous marines in your line of fire. A true shame we lost you today - but in the end, you struck fear into the hearts of the enemy.


  Awarded by Col. Scraps-the-Copper on 11/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





