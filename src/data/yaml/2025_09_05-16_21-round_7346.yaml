roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Leonard 'Breacher' State, Nikolay Novikov, Gallagin 'GC Addict' Caitman, Aiden Lark, Marco Biery, Stefan Wolle, Kyra Cowart, Antonina 'Blades' Alaars, Tony James, Auroura Starchaser, Saya Spudson, IronClaw SilverMoon, Rina 'Shell-Shocked' Gensvil, Azum-Neetra, Adam 'Fractured' Johnson, Herbsquirto, Wears-a-Traffic-Cone, Meerana-Onasha.



  Royal Jelly Awards:

  Prime Hivelord (RO-490-CK) is awarded the Royal jelly of resilience: 'Without this hivelord the day would have been lost, they ensured that we had resin to retreat to in our darkest hour. Without there guidance and wisdom we would not have survived the tall onslaught.' by Ancient Queen (ARG)

  Mature Carrier (RE-943-N) is awarded the Royal jelly of proliferation: 'I have lost track of the number of talls this carrier has claimed, so many have fallen to there traps, eggs and tackles. Many a sister owes there existance to this carrier.' by Ancient Queen (ARG)

  Young Defender (STL-266) is awarded the Royal jelly of sabotage: 'For there actions as a defender, during a critical moment this sister shielded mother from a tuber who would have otherwise have killed her. Without her sacrafice, all would have been lost.' by Ancient Queen (ARG)

  Prime Burrower (FO-202-OL) is awarded the Royal jelly of sabotage: 'This burrower has not only claimed the lives of many a yellow. They showed true leadership, commanding a group of sisters to assault the talls backlines. Without there grit and determination victory would not have been possible.' by Ancient Queen (ARG)




