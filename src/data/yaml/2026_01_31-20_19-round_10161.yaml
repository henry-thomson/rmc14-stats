roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Altair 'Christmas' Nightwish is awarded the Bronze heart medal: 'For exceptional bravery in combat while wielding the M5-ATL, Lance Corporal Altair Nightwish disposed of the Queen and multiple other dangerous Xenonids during operation Peacekeeping Mission 431st-Storm on Trijent Dam.

  He fought until the very end, where he unfortunately met his demise.


  Awarded by Col. Freya Locke on 01/31/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





