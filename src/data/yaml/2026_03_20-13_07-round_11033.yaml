roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Leonardo Scusa.



  Royal Jelly Awards:

  Mature Drone (XX-985) is awarded the Royal jelly of rejuvenation: 'I AM REALLY HAPPY WITH YOU TODAY!!!

  You are a really supportive sister for the hive, you have helped your sister so much, with healing them when necessary and also giving plasma to hivelords when needed!

  I have seen few drones being so helpful to all sisters at the same time, you are amazing!!!

  Keep up the good work!!!

  With love LAG.' by Ancient Queen (LAG)

  Elder Ravager (EV-185-IL) is awarded the Royal jelly of slaughter: 'I love seeing you killing the talls!! You did a phenomenal work destroying them!

  Your help in the wipe today was amazing, without you we wouldnt have been able to even achieve half of today!!

  Really proud of your work today, didnt let a single tall escape!!

  With love, LAG!' by Ancient Queen (LAG)

  Mature Praetorian (ABO-249) is awarded the Royal jelly of sabotage: 'Thanks to you, the hive is as better as never!

  With your efforts in the backline, capturing talls and calling out their position, while also assisting in the wipe and holding key positions and chokes, you have helped this hive live today!

  I am really proud of your work today! Keep up the good work!!!

  With love, LAG!!!' by Ancient Queen (LAG)

  Ancient Praetorian (VER-378) is awarded the Royal jelly of sabotage: 'I AM REALLY HAPPY WITH YOUR WORK TODAY!!

  You have proven to help and assist sisters today when they needed it the most. While also helping get captures in the backline, your work today was amazing!

  I am always happy to see you in the hive!!

  With love, LAG!!!' by Ancient Queen (LAG)




