roundEndText: >2-

  [color=red] INTERNAL REPORT (DO NOT LEAK) [/color]

  The crew of the UNS endeavor has gone missing over the Yvettan sea on LV-

  REDACTED on standard patrol duties. While the vessel itself was safe, the 

  normandy has gone missing. A search effort has been undertaken by FORECON 

  unit Grizzly-7, but no sign of the crew has been found as of late.


  It is suspected they were hit by an unidentified anti air measure,
   though the cause of the downing is still disputed.

  The Yvettan sea has been an area prone to ship downings.

  The unidentified missing soldiers unit has been tasked with identifying the 

  cause of these disappearances.


  The crew of the endeavor will be listed as MIA until a final verdict has been 

  reached.


  END REPORT.


  In memoriam of our fallen soldiers:

  Durr Tenet, The Garden of Optimism, Eris 'Squish' Rose, Caitlyn 'Zealot' Shirey, Markus 'Jazz' Burkett, Scytodes Aquatica, Iris Starseeker, Eris 'Squish' Rose, Matica.





  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



