  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Ravager (ATK-790) is awarded the Royal jelly of slaughter: 'This daughter, alongside many others, have accomplished what few could, wiping the tall front castes in a surprise tunnel ambush against all odds, for this I award the jelly of slaughter, for the many talls they have annihilated.' by Elder Queen (NELL)

  Young Boiler (RAP-812) is awarded the Royal jelly of resilience: 'This daughter, among many others, has helped achieve what few could not, in wiping the talls with our tunnel ambush. Their clouds have provided kills, vision blocking, and delays to the talls, allowing us to wipe them much more safely. For this I award them the jelly of resilience' by Elder Queen (NELL)

  Ancient Lurker (DID-596) is awarded the Royal jelly of sabotage: 'During our time of wiping the talls, this daughter has ran around and flanked talls, killing them from behind and the sides, catching the few that scatter and try to escape. For this I award them the jelly of sabotage for ruining the talls' feeble attempts to escape and scatter.' by Elder Queen (NELL)




