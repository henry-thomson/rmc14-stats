roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Angela Whittier, Emulates-the-Synths, Eden Martins, Tako-Ja, Ash 'Silly' Winter, Kroll Dagzug, Tom Thomas, Ariel Silver, Logan Wright, Mike 'GC' Mueller, Ada Sloan, Vervet Williams, Blake Evans, Crimson Marcotte, Maynard J River, Caesar Enrico, Kyla Leech, Juno 'Kleptocat' Kaneko, Mizuno 'Kitty' Drakonovisch, Zoropsis Phalangioides, Lando Muggins, Bites-The-Bullet.



  Royal Jelly Awards:

  Ancient Carrier (MIU-992) is awarded the Royal jelly of proliferation: 'This daughter generated so many eggs for our captures and daughters, their plasma reserves working overtime to produce more children for the hive. Without you i'm sure we would not have had enough children to infect the hosts with, and for this effort you deserve the jelly of proliferation.' by Prime Queen (GIB)

  Prime Ravager (GUH-638) is awarded the Royal jelly of resilience: 'This daugher soaked up many tall spits for me during my time of crisis, when I was tubed and about to die, they stood infront of me, saving my life. For this they deserve the jelly of sabotage' by Prime Queen (GIB)

  Elder Ravager (ANK-143) is awarded the Royal jelly of slaughter: 'This daughter lived through the whole battle, capturing and slaughtering many talls in my name, their crest unshaken and their will unbroken. Their actions this day will not be forgotten.' by Prime Queen (GIB)

  Elder Drone (OXQ-922) is awarded the Royal jelly of sabotage: 'This daughter listened to my orders well, rebuilding hives wherever I told them to build them, helping greatly in the war effort. They kept building and building, until their plasma was empty, and for this they deserve the jelly of sabotage.' by Prime Queen (GIB)

  Young Runner (OR-257-K) is awarded the Royal jelly of rejuvenation: 'This daughter transported many captures, but that is not why they are deserving of this jelly. Their bravery in the battlefield saved a daughter from certain death, allowing them to continue on fighting. This action cannot be overlooked, and they will be awarded the jelly of rejuvenation.' by Prime Queen (GIB)




  [bold]Operation funded by [color=green]Arcturus's Additional Pylons[/color]![/bold]



  [bold]Hive established by [color=purple]Arcturus's Xeno Pet[/color]![/bold]
