roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Drone (TY-851) is awarded the Royal jelly of rejuvenation: 'For supplying me personally committing to the role tasked upon you when you took the mantle of being our main gardener.


  Your fruits were heavily impacting front because it was bascailly giving me the speed I required, to destroy the talls in horrible positions, I also wanna state for the other fruits made that basically healed the injured!


  I wanna say I love every bit of it, and I hope you learn even more, and strive to be the best! Rejoice!' by Prime Queen (PRO)

  Ancient Defender (EVE-488) is awarded the Royal jelly of resilience: 'You a sight to behold, true to your heart of design of being a defender.


  I was knocked down by the wretched tuber... who would of ended my life if it wasn't for you.


  You did what you had to do, for the greater good, acted upon what will of your heart to protect me. You were my everything as all my daughters are. I will remember you, may you not be forgotten...' by Prime Queen (PRO)

  Young Lurker (SU-68) is awarded the Royal jelly of proliferation: 'For making consecutive captures near flight control, and several other area of interest. I am bestowing this jelly upon you, for making a great work of beauty to be seen as a runner who swifted through the ranks of our horde to deliver results by capturing and risking your carapaceless well being.


  It rare to see such minds be taking the route of runner, and pushing through what can truly shine in your heart...


  Keep it up young one, I know you can go ever further! Rejoice!' by Prime Queen (PRO)




