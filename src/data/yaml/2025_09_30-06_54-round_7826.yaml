  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Darius Bohrumbeard, Kalaveer 'Kala' Singh, Ate-Tammy-Thompson, Oliver 'Olives' Robertson, Nina 'Meow' Sheil, Hazel 'Birdbrain' Musca, Peepe, Olivia Lambert.



  Medal Awards:

  Marina 'Eclipse' Corres is awarded the Distinguished conduct medal: 'For going above the duties of an SO. proforming a much needed task on the ship with the ship side deconstruction which aiding the FOB hold long enough to widdle down the hive


  Awarded by Maj. Tyr Ragnarson on 09/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Buzz Fibres is awarded the Distinguished conduct medal: 'you son. have held your squad together through some thick moments. holding FOB when i needed you to. keeping alpha's spirits high long enough for our counter attack with your momentum. giving us the strength we need to win


  Awarded by Maj. Tyr Ragnarson on 09/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ariel Silver is awarded the Distinguished conduct medal: 'You kept your squad together through several wipes. but you all remain standing. this isnt just a medal to you. but a sign of delta's resilience




  Awarded by Maj. Tyr Ragnarson on 09/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Maximus Holdeman is awarded the Distinguished conduct medal: 'Your efforts today have not gone unnoticed son. your assitance in the deconstrustion of non-vital areas of the ship helped our FOB last long enough to weaken the hive




  Awarded by Maj. Tyr Ragnarson on 09/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Chee 'Pressure' Mach is awarded the Distinguished conduct medal: 'You didnt ask to lead. but with the leadership of your squad all dead. you rallied delta together and formed a solid defensive force once the rest of the squads had to move on




  Awarded by Maj. Tyr Ragnarson on 09/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Bettaius 'pills' Ashford is awarded the Distinguished conduct medal: 'With medical lacking much leadership and direction. you really stepped forward to get the things needed done in medical and research




  Awarded by Maj. Tyr Ragnarson on 09/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





