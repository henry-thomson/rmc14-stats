  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Hivelord (ZAO-333) is awarded the Royal jelly of proliferation: 'You were a true designer since the beginning to end, you built up practically every piece of the frozen lands were built from the grounds up. You had 8 hivelords under your command as build leader, and lead them to wherever was necessary. You were put to work as they also fed you plasma non stop whenever you ran out. You were a truly remarkable designer this battle of Shiva. Rejoice!' by Prime Queen (PRO)

  Mature Ravager (JU-421-S) is awarded the Royal jelly of resilience: 'You may of died but you served a purpose none the less, you shielding that defender who was dragging that tall lurker allowed them to drag it far enough just for me to gib it. Understand that even through death you left a mark on the battle. I hope you continue to keep trying your best. Rejoice! In the battle of shiva' by Prime Queen (PRO)




