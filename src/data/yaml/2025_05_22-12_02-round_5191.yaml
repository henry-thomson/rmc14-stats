roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Diarsia 'Dima' Maxima, Iris 'Tempest' Cookia, Kaito, Tony Sprite, Elric Baxter, Emery Cadler, Lia Volkov, Takila 'Coward' Sunburn.



  Royal Jelly Awards:

  Elder Praetorian (WAR-78) is awarded the Royal jelly of resilience: 'This daughter lived throughout our whole war, bringing us fresh hosts and providing much needed support. They worked together with their other daughters in sync. They even dragged me to safety when I was at my lowest and almost dead. They truly brought glory to the name oppressor.' by Prime Queen (GIB)

  Ancient Boiler (ARL-918) is awarded the Royal jelly of slaughter: 'This daughter endured the assault of the white talls, stalling them and keeping them occupied while I could utilize flanks and focus elsewhere. Their power shined in the caves and without them I believe we couldn't have won. They were a force feared by talls and a force respected by me. May queenmother recognize your efforts today.' by Prime Queen (GIB)

  Elder Defender (ARG-786) is awarded the Royal jelly of rejuvenation: 'This daughter sacrificed their life for me when the evil tuber assaulted me. They lowered their crest and absorbed as many spits as possible. Even they died doing this, they ensured I would live for longer and bring us more glory.' by Prime Queen (GIB)

  Elder Defender (BO-300-BO) is awarded the Royal jelly of proliferation: 'This daughter managed to get one of the tubers. They utilized their position and skillfully captured the tuber which had been a plague in our hive. This solidified our victory even more and made our hive grow stronger sisters.' by Prime Queen (GIB)




