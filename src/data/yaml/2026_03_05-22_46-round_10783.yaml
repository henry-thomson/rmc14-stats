roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Zoey Marz, Shoots-for-Moon, The Mushroom of Refinement.



  Medal Awards:

  Lance Corporal Voss is awarded the Distinguished conduct medal: 'For providing consistent and excellent mortar support for our troops throughout the operation. Good work, marine.


  Awarded by Col. Scraps-the-Copper on 3/5/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Sergeant Kara Hathaway is awarded the Medal of valor: 'For holding the line at the northwest caverns, when it was tested and we needed it held the most. You kept the bugs out of the caverns, and helped to keep folks alive.


  Awarded by Col. Scraps-the-Copper on 3/5/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper





  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



