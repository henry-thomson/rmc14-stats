  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Harlow 'Deadman' Kazimierz, Likes-the-Job, Rinka Bunzumi, Eris Ravenhurst, Tess 'Eepy' Lacoil, Karser Tylan, Addison Zoucks, Hates-The-Needles, Lucius Atandart, Batonga, Jim 'Smokey' Werner, Colten Dennis.



  Medal Awards:

  Captain Allyson 'Ally' Bennet is awarded the Bronze heart medal: 'Captain Allyson Bennet has laid down her life in today's operation, yet without her efforts and subsequent sacrifice, the mission Second Company undertook would have ended in utter failure. Their sacrifice was not in vain, and their name will be remembered for their work.


  Awarded by Maj. Hudson 'Hungry' Demuth on 07/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





