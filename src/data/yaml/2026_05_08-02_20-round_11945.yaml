roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Dave Daverson, Joeseff Schmit, Lyria Abbadon, Auric 'Longshot' Dawntide, Nicholas Waldron.



  Medal Awards:

  Sergeant Addyson 'Fortuna' Zappy is awarded the Bronze heart medal: 'While serving as a Fireteam Leader during Inspection Beacon-Sierra, made countless courageous advances that were decisive in the death of the strongest of the Xenonid hive. You sacrificed yourself to take down more Xenonids than can be counted, and reflected the utmost credit upon the UN Marine Corps.' by Lieutenant Colonel The Force of Nature

  Private First Class Yuri Martinez is awarded the Distinguished conduct medal: 'While Serving as a Requisitions Technician during Inspection Beacon-Sierra, performed their duties with exceptional technical expertise, supplying the requisitions bay with a surplus of ammunition and materials that aided in the assault groundside. Your LO personally recommended you, and I am inclined to agree. You have reflected great credit upon yourself, and upheld the highest traditions of the UN Marine Corps.' by Lieutenant Colonel The Force of Nature



  Royal Jelly Awards:

  Mature Drone (BE-758-A) is awarded the Royal jelly of rejuvenation: 'For saving the life of your sisters during in active combat, I thank you for pushing through hazardous conditions in order to save their life! Rejoice!' by Immature Queen (PRO)

  Prime Praetorian (YIP-501) is awarded the Royal jelly of proliferation: 'You fish, you thrive, you conquer! The talls didn't stand a chance with your hooks, and positions that you took. You made at least 9 captures for the hive, impressive, that greatly assisted the survival of the hive. You held eye preventing talls from pushing toward it, and kept on doing engagements that was necessary for the hive. Rejoice!' by Prime Queen (PRO)

  Ancient Runner (NEV-46) is awarded the Royal jelly of slaughter: 'During the engagement of west colony garage you claw, rend, rip. It doesn't matter they all met the same fate as you lay upon them. You wiped the blue caste making it insufferably a swift domino victory that was of which a necessary action required from you. I thank you for slaughtering the talls for the hive, even though your life was lost when you were a berserker, Rejoice!' by Prime Queen (PRO)

  Mature Praetorian (SKY-45) is awarded the Royal jelly of rejuvenation: 'For keeping the ravagers out of harms way and continous watching over them and denying any sort of death for the hive, and not to mention using warding saving quite a few of your sisters, I am bestowing the jelly of rejuvenation. You also played a part in stalling at eye, with that is heavily appreciated. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
