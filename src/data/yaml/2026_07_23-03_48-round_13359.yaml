roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alty Ciel, Lilliana Taggart, Bob Tiltfoot.



  Royal Jelly Awards:

  Ancient Defender (ALT-849) is awarded the Royal jelly of resilience: 'During the engagement of botany, or hydroponics. The Metal beast adventured quite to far, and you decided to fortify to trap it. With that your life came at a cost, but it was true value none the less. I respect that mindset of yours, and I hope you keep it up. Well done my defender.' by Prime Queen (PRO)

  Elder Defender (ZE-695-RG) is awarded the Royal jelly of resilience: 'During the engagement of botany, or hydroponics. The Metal beast adventured quite to far, and you decided to fortify to trap it. With that your life came at a cost, but it was true value none the less. I respect that mindset of yours, and I hope you keep it up. Well done my defender.' by Prime Queen (PRO)

  Ancient Defender (RA-102-ZR) is awarded the Royal jelly of resilience: 'You shielded a praetorian near the brink of death, thanks to that you provided the necessary time to save them. I thank you defender, I know it costed your life, but you saved a sister to continue on for you. which is a respectful cause, rejoice. This occured in Chance, East of Hydroponic.' by Prime Queen (PRO)

  Ancient Hivelord (FAE-326) is awarded the Royal jelly of proliferation: 'You were the hivelord that was with the hive since the beginning, I thank you for building up at the front line, to prevent talls advance. Which provided substantial amount of time at east reactor, this was also important after red talls got wiped. You also, build around security, south of eye so that it was possible to skirmish in the backline. This was in the battle chance. Rejoice!' by Prime Queen (PRO)

  Young Drone (XX-681) is awarded the Royal jelly of rejuvenation: 'You were a significant amount of help on the rear of the battle, at security, medical, and even kitchen area. You help made it way easier to push on evil eye, from that side of the battle. I thank you for doing your part as our healer young mind, as you learned quite a bit. I hope you had fun doing this for us all. Rejoice! This was in the battle of Chance!' by Prime Queen (PRO)




