  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Warrior (XX-296) is awarded the Royal jelly of resilience: 'During the engagement at medical, you sacrificed yourself in exchange for a flame walker. For such resolve and commitment you deserve this jelly for such result. Your truly are on the path of being a true warrior, may you continue to strive for future battles with the hive! Rejoice!' by Prime Queen (PRO)

  Ancient Drone (GUH-705) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself in exchange in saving the valkyrie and a dancer. One at scrub land, and the other at engagement west of evil eye. Keep up working toward saving others and giving them a 2nd chance. It great to see healers who knows the true value of what must be done. Rejoice! 


  This was taken place at the battle of Kutjevo.' by Prime Queen (PRO)




