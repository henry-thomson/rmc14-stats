roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Praetorian (HEK-480) is awarded the Royal jelly of resilience: 'You led your sisters heroically in battle, ensuring that the talls were dealt with swiftly, following orders with precision like no other.


  ashame you fallen in battle at chaple, I will not forget the great charges you led during your time with us.


  May you be forever remembered.' by Prime Queen (PRO)

  Young Hivelord (GE-22-L) is awarded the Royal jelly of proliferation: 'For leading your sisters in the work of logistics, and building.


  I am bestowing this jelly in good faith of your great dedication in following orders, an ensuring your sisters were able to follow along smoothly.


  Thank you for setting up areas that I needed, same goes for all your hive leaders, and drones. that worked with you.' by Prime Queen (PRO)

  Young Lurker (JET-273) is awarded the Royal jelly of slaughter: 'For making valuable engagement at colony garage against purple talls, you were able to down, something like 6?


  overall that actually amazing from a lurker in general, an I just want to state you did amazing.


  Keep going down this route, keep doing your best.


  Hope to see more of that! Rejoice!' by Prime Queen (PRO)

  Young Hivelord (HP-832-I) is awarded the Royal jelly of proliferation: 'For your long an tedious work for the hive in making structures wherever you could. I am bestowing this jelly on the structures you provided to the entirety of the hive, Rejoice!' by Prime Queen (PRO)




