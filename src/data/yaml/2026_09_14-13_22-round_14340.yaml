roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Estrella 'Zombie' Jenkins, Luka 'Wander' Tio.



  Royal Jelly Awards:

  Ancient Lurker (XX-163) is awarded the Royal jelly of sabotage: 'You made a multitude of captures, and including capturing the flame walker, long spitter. Both of which were disruptive to my plans, good work on making sure they paid dearly, for even remotely going against the hive. You did quite a wonderful performance that I was watching. Through time I hope to see you become prime one day. Keep it up lurker.' by Prime Queen (PRO)

  Mature Hivelord (TIN-877) is awarded the Royal jelly of proliferation: 'For building up cargo that of which was skyfired by the talls you built up quite a considerable amount of resin, even if it wasn't used the point is, that you put effort into it and could of been used in the future if things got in poor condition. I thank you for doing what all enjoy seeing, and that is building for the hive! This was taken place in chance Claim, Cargo. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]The Kanin Family[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
