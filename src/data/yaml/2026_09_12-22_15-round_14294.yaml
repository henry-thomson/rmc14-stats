roundEndText: >2-

  "They did not complete the objectives."

  "Its fine. The chief engineer was smart, putting the important stuff deep in the jungle."

  "Yet it was not built."

  "The framework remains. And if we keep at it, we will be on schedule in 3 weeks."

  "Thats 2 weeks too long... we do not have much time. We cannot let Saturn's people know this is being made. The cover story wont last forever. 


  "Why... why the rush? Why the secrecy? Why the staging of the crash site and all the resources?"


  "...Site Delta needs be completed. It needs to be completed if we want to survive."


