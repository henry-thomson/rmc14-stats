roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Emiko AW Kaiten, Aurora 'Birdcage' Lockheart, Alicor 'Pinkie' Merow, Leon Renshaw, Luanne Greenawalker, Jais 'Jazz' Ksaj, Marjory Kimple, Lilliana Taggart, Chez 'Cheese' Woodtiger.



  Royal Jelly Awards:

  Ancient Ravager (YIP-870) is awarded the Royal jelly of slaughter: 'Hive was in a desolate situation, and the horde of ravagers did not make a good impression upon me, but YIP... well she YIP-ed all over. YIP-ed and Yapped and slashed every tall that now talls are beautifully stacked as cubes. i believe she uses them as sharpening tool for her claws...' by Prime Queen (BUH)

  Prime Drone (ASH-306) is awarded the Royal jelly of rejuvenation: '"I was ready to kill myself given the first excuse", from anybody else, this would cause outrage... But from ash, it just came out as eloquantly as it can be!' by Prime Queen (BUH)




  [bold]Operation funded by [color=green]Isadora AW Brooke's videos of Marine Mess-ups[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
