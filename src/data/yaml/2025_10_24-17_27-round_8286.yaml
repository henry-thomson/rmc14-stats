  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Agile 'Frankfurter' Furwood, Richard Lacertilia, Kathya Uncia, Devin Picard, Juno 'Kleptocat' Kaneko.



  Royal Jelly Awards:

  Ravager (XX-165) is awarded the Royal jelly of slaughter: 'You were truly a ravager in this battle. You show no fear, no mercy, only slaughter! The talls didn't stand a single chance against you as you broke them one by one. I have quite load of experience as a ravager, and I do say you did immensely well. For that you are rewarded the jelly of slaughter, for taking out the front line, and commiting devastation attacks against these talls. Rejoice!' by Prime Queen (PRO)




