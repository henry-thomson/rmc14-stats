roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Nesomi.



  Royal Jelly Awards:

  Young Burrower (IR-930-I) is awarded the Royal jelly of sabotage: 'Your incredible tunnel that was south of the tall perch gave us victory over the talls, your quick wit was not to be underestimated, be proud daughter. You have earned the royal jelly of sabotage, which few earn.' by Immature Queen (GIB)

  Young Warrior (CRO-535) is awarded the Royal jelly of sabotage: 'Your work in helping me secure the tall bird and slaughtering the talls onboard was amazing, your crest stood strong while I took down the birds door, securing the existence of our hive. You have earned this jelly, and I hope you treasure it well.' by Immature Queen (GIB)




