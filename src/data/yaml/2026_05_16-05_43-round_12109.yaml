roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Guy Snyder, Sebastian Colina.



  Medal Awards:

  Staff Sergeant Isadora AW Brooke is awarded the Distinguished conduct medal: 'Staff Sergeant Isadora AW Brooke saved my life and went above the normal call of duty of a Honor Guard. She saved my life by telling the medics to stop Overdosing me. Without her efforts and CPRing me I would have died. Her efforts are not unfounded and I am still standing. Due to her going beyond the call of duty and saving my life I have awarded her the medal of Distinguished conduct. Excellent work. Perhaps you could be a better corpman than a honor guard some day.


  Awarded by LtCol. Sicilia Drakonovisch on 05/16/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





