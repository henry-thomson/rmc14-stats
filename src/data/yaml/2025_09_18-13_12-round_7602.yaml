  Ancient Runner (AC-360-ID) is awarded the Royal jelly of slaughter: 'Without this sister it would not have been possible to turn the tide on the tall invasion. They built up 1000 acid and successfully exploded on the talls. This secured a critical wipe, without which we would not have prevailed. The grit and determination of this sister continued even after this mighty feat, and for that they shall be rewarded.' by Ancient Queen (ARG)

  Young Praetorian (PT-914-D) is awarded the Royal jelly of resilience: 'This sister was with us from the start, one of a select few who survived the tall invasion. Despite her young age she led the stall against the talls, giving mother time to mature. Without her leadership and determination vicotry would not have been possible. Bravo!' by Ancient Queen (ARG)




