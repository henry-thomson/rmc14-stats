roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Haylie Treeby.



  Royal Jelly Awards:

  Ancient Hivelord (BL-741-DR) is awarded the Royal jelly of proliferation: 'For building since the beginning, you made areas that were wastelands into beauty of art within minutes. Thanks to your dedication areas of interest were able to built back up with ease with also your hivelord sisters. May you continue to provide support to the hive rejoice! This was taken place in the battle of Soro.' by Immature Queen (PRO)

  Young Boiler (BL-374-D) is awarded the Royal jelly of resilience: 'You were able to be our last line of defense, and that you provided till the end. You endured countless hardships in this battle that would of been the brink of the hive destruction. However the hive came back up on top with many captures, and you providing all the support throughout the open fields of battle of Soro. Rejoice!' by Immature Queen (PRO)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



