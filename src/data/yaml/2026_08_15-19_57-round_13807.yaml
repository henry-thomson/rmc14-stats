  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Mary Collins, Daniella Nivs.



  Royal Jelly Awards:

  Prime Hivelord (VY-356-NL) is awarded the Royal jelly of resilience: 'My Daughter VYNL you lead our build team in the constant building efforts against the talls. Without your effort leading I feared we wouldn't have been able to secure so many of the talls. REJOIEC!' by Elder Queen (FOP)

  Hivelord (OG-464) is awarded the Royal jelly of sabotage: 'My Daughter OG your work as a Resin Whisper help our frontline thrive against the talls. Your build secured us many safety points and kept pressure on the Talls. For your work today this Jelly is rewards. REJOICE!' by Elder Queen (FOP)

  Prime Ravager (NEV-263) is awarded the Royal jelly of slaughter: 'My Daughter NEV as always you were my right claw throughout this battle. Without your advise and abilites to capture so many talls I fear we would have lost far more today. I reward you this Jelly for the continual work you do for the hive. REJOICE!' by Elder Queen (FOP)




