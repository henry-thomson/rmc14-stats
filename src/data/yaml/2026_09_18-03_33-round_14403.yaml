  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alicor 'Pinkie' Merow, Ruco 'Roz' Amenaza, Faces-The-Carrots, Keqqux Kerrter, Aleena Goldenfur, The Glacier of Chaos.



  Royal Jelly Awards:

  Prime Hivelord (VY-21-NL) is awarded the Royal jelly of resilience: 'VYNL was our dear sister that lead builds on so much hives that i lost my count. I am happy of finally being able to award them with this jelly, to show affection to their dear work.


  Rejoice my dear sister, and may your build be as eternal as your kindness!!!' by Prime Queen (RP)




