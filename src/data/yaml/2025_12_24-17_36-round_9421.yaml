roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  unknown, unknown, unknown, Anderson Schafer, unknown, unknown, Kapi Algarve.



  Medal Awards:

  Dante Minnie is awarded the Medal of valor: 'Combat Technician Dante Minnie, fighting in the SPP protectorate of Sorokyne Strata showed what it means to have no fear on this night. Alongside their Weapon Specialist comrade, they spearheaded a breaching operation into Soro's Deep Security. A veritable citadel of resin and XX-121 infestation. They caught the queen sleeping, and executed them in ovipositor. 


  If this wasn't enough, CT Minnie then went on to slay a second queen. Their efforts will never be forgotten, and I implore High Command to forward this medal if I do not survive.... For XX-121 comes for us in the stars, and CT Minnie and I have a fight to win. 


  -Awarded by Lt. Col. Atlas Booted, Falling Falcons.'

  Tahii 'Flak' is awarded the Medal of valor: 'Weapon Scout Specialist Tahii on this night demonstarted what it means to be a part of THE night. Alongside their CT companion, the XX-121 citadel of Deep Security on Sorokyne Strata became their hunting grounds. Finding a queen in ovipositor, the two made quick work of the demon queen. Teaching them no where is safe from the Falcons. 


  Wanting seconds, the Scout 'Flak' then spearheaded a solo breach campaign, dodging entire swarms of bugs, for a heroic but failed attempt to do the same trick twice. Forever remember them as a hero, and a hunter.


  -Awarded by Lt. Col. Atlas Bootes, Falling Falcons.'





