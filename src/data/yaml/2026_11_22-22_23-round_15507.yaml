  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Miles Thomson, Caleb Bloodworth, Zinnia Thiel, Rika Ika Mika, Eddie McShot, John 'Human' Coelho, Jimmy 'Supply Crate' Viscido, Samantha 'Sammy' McGoggins, Socrates Leander, Hark Whelkson, Jack Yetzman, Alexis Kifer, Akari Ryals, Benjamin Bennett, Lenny 'regicide' Kuster.



  Royal Jelly Awards:

  Prime Carrier (WI-44-LZ) is awarded the Royal jelly of sabotage: 'WILZ, we ran out of morphers at one point and all we had for new children was.. your traps and a few eggs. I say few, but you made MANY traps for my hive. I saw 3 talls hit said traps on their escape! Well done, thank you daughter.' by Ancient Queen (EKAJ)




