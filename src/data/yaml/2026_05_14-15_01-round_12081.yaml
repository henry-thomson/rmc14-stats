  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Krag Grudgebearer.



  Medal Awards:

  Gunnery Sergeant Bennett Mortland is awarded the Medal of valor: 'Gunnery Sergeant Bennet Mortland led alpha exceptionally well today. They held cave camp and ensured their squads cohesion against a very fortified enemy foe. When I called for their aid we were all nearly wiped out alpha arrived with prompt calling saving us. Bennett charged straight into the fray saving many including myself. Exceptional work.


  Awarded by LtCol. Sicilia Drakonovisch on 05/14/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Staff Sergeant Scytodi Suniflower is awarded the Distinguished conduct medal: 'Staff Sergeant Scytodi Suniflower maintain squad cohesion and followed orders to the letter. Keeping their squad together and assasinating the queen. This led to the xenos final fall in cohesion and repelled the other countless assaults when encircled at the clinic. This is commendable and should be apperciated. Excellent work today.


  Awarded by LtCol. Sicilia Drakonovisch on 05/14/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





