roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bailey Warren, The Bud of Conviction, Birdua, Keagan Leichter.



  Royal Jelly Awards:

  Young Runner (CA-680-R) is awarded the Royal jelly of slaughter: 'CAR was an acid runner that did 1000 acid boom with my scream which wiped a lot of talls, securing our victory over them.


  Rejoice my daughter! May your growth come to fruition!' by Ancient Queen (RP)

  Young Hivelord (IN-667-K) is awarded the Royal jelly of rejuvenation: 'INK is a young hivelord that it came to my attention they did a great build securing wipes, which also helped us to eventually win.



  Thank you my daughter, and may you keep on your path!!' by Ancient Queen (RP)

  Prime Praetorian (RAD-769) is awarded the Royal jelly of resilience: 'RAD was a valkyrie that made both me and the ravager YIN make it alive with their warding, and saved me with screams too.


  Rejoice my dear daughter! I can always count upon you to be safe!!' by Ancient Queen (RP)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
