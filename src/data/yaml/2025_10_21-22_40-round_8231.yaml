roundEndText: >2-

  After a flight into the once scenic cityscape of Hybrisa Prospera to eliminate an infestation in its caves, the marines of the Sun Riders were beaten back by the xenonids so badly they were forced to evacuate.


  What will happen to the city and the planet it resides on is not something you want to think about as you step off of the dropship, leaving the memory of that place behind.


  VERDICT:

  Xeno major.




