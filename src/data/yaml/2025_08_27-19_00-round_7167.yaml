  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Prime Drone (MIU-960) is awarded the Royal jelly of proliferation: 'For saving my life when i was certain to face death, this daughter sacrificed their body and life for me. This was incredibly well done and i am so proud of you. REJOICE!' by Prime Queen (GIB)

  Ancient Carrier (JEB-814) is awarded the Royal jelly of proliferation: 'This daughter infected numerous talls, their parasite stocks seemingly neverending, their will unbroken. They stood the test of time, alot of strong daughters dying around them, but they helped grow the new generation so we could win the fight. You are the most deserving of the jelly of proliferation.' by Prime Queen (GIB)

  Young Boiler (SN-974-K) is awarded the Royal jelly of slaughter: 'This daughter suffocated talls with their deadly gas, leaving talls quivering and shaking. They were a force to drive talls back and corner them, leading to their eventual wipe. None of the talls escaped your wrath, and for this you have earned the jelly of slaughter.' by Prime Queen (GIB)

  Mature Hivelord (PI-839) is awarded the Royal jelly of sabotage: 'This daughter built up the hive incredibly well, but this jelly is not for that. Their saboteour work while roaming with me allowed me to cut off talls, leading to many captures. They used their wits and stayed alive for the whole fight, while sometimes cutting it close. Please, enjoy your jelly of sabotage, you have earned it.' by Prime Queen (GIB)




