roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Luanne Greenawalker, Drags-Crates, Ardy 'Ape Man' Guy, Maze AW Falx, Buster 'Geezer' Alter, Leah Rose, Aelica 'Mom' Danara, Vulfstagmir Zadovsky, Stella Fischer, Crimestoer Mauler, Marissa Day, Aaron Conrad, Ricky Fischer, Studies-The-Lights, Faustus C Horselady.



  Medal Awards:

  Gunnery Sergeant Altair 'Christmas' Nightwish is awarded the Medal of exceptional heroism: 'Gunnery Sergeant Altair Christmas Nightwish during Patrol Rude-Walk went way above the call of duty. Altair kept extremely good cohesion and flanked the xenos several times, keeping their squad together during desperate scraps with the enemy force. They directed several OBs on demand which without them would have made this operation a complete failure. The ETA, Admin, and Lambda OBs were all coords given by altair. Not only did he do this. I personally watched him charge head first to save several marines throughout the operation. This is not a honor I bestow upon many people, but this is very well earned. During the lambda push Altair valiantly led the charge to save marines that were downed. Excellent work.


  Awarded by LtCol. Sicilia Drakonovisch on 05/22/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





