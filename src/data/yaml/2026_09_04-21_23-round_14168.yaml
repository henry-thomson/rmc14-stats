  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Hayley Weber, Fletcher Forgi, Ned O'Neily, Byrne Keener, Cordelia Somniferum, Kali Evanspear, Makayla Jones, Rhox 'Tanker' Jaex, Isaac Nighteyes, Bootseey 'Flick' Mireaux, Jorge Gonzalez, Harlow Kazimierz, Finch 'Hero' Ward, Meyer Evergarden, Denis Maclough, Cronin 'Fig' Pekoe, Thurgood Ryebell, Bailey Warren, Glorp Blorbleson, Rita Marie Dodginghorse, Monty Benford, Andrew 'Bomber' Honk, Emilia Maekh, Kas'Lurla, Deino-Leem, Juno 'Garnet' Eckart, Lav-Ender, Tasha 'Fumbles' Serrcof, Apollo AW Mosin-Nagant, Molto Quibbles, Carl Young, Chad Wellington, James Taylerson, Roman 'Ranger' Bandera, Harvests-The-Grapes, Jackson 'Riggs' Riggle, Lila Lighteater, Kaasumi-Sumi, Ace Holden, Chad 'Mambo' Ullman, Cliff David, Sari Watts, Is-The-Fish, Bjorn Bluemane, Mark Northey, Vrexor Lioris.



  Medal Awards:

  Captain Hudson 'Hungry' Demuth is awarded the Medal of valor: 'for an excellent show of tactical brilliance while i worked on an encirclment. you somehow dialed in cords on a corned queen. the warhead killing her instantly allowing us to wipe out the remaining hive with ease after a long brutal fight. 


  Awarded by Col. Tyr Ragnarson on 09/04/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





