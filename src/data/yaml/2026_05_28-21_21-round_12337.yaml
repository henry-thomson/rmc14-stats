roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Faces-The-Music, Rinka Izumi, Aurora 'Birdcage' Lockheart, Burns-The-Flowers, Taylee Kusinut, Brennan Richardson, Kyra Cowart, Rocco Hunter, Roland 'Stahl' Kraus, Socrates Scorchedwing, Granola BiggyFooty, Zilxi Xaagukta, Mike Spike, Jamie 'Glaive' Fleming, Evan Rogers, Makayla Mosser, Bill Torres, Stefan Wolle, Barnaby 'Wayland' Marmaduke, Akrem 'Joker' Marshall, Joi, Erdis Murnter, Hank Starseer, Buster 'Geezer' Alter, Ainsley 'bomba' Styles, Slipix'zir Y'Rilslarun, Sam Hackston, John 'expert' Jones, Eliana Stripes, Wulfrun Blue, Zixteq Xeqxae.



  Medal Awards:

  Corporal Chews-the-Wires is awarded the Bronze heart medal: 'through a relentless horde of monster you held the line at sensors against all odds. buying vital time and intel for your brothers and sisters to clear a xeno strong hold. though it cost you your life. your sacrifice will be remembered


  Awarded by Col. Tyr Ragnarson on 05/28/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Gunnery Sergeant Hudson 'Hungry' Demuth is awarded the Medal of valor: 'for your exceptional show of leadership in the face of adversery. you lead your squad to take objectives neglected by other squads. securing our position on the field. and though you were late to save the XO. your ability to rally your troops as fast as you did highlighted your squads efficiency in the face of the others inneficiency this opperation. you are an example of true leadership and are to be rewarded as such


  Awarded by Col. Tyr Ragnarson on 05/28/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





