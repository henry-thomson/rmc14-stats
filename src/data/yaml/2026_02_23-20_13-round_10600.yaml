  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Crusher (MRT-453) is awarded the Royal jelly of resilience: 'For your heroic charge in denying my death when I got tube north west of botany, you ensured my survival by disrupting their spit flow, an generally saved my life.


  Thank you for that, that was an outstanding job.' by Prime Queen (PRO)

  Mature Hivelord (KI-826-T) is awarded the Royal jelly of proliferation: 'For leading builders in the art of infrastructures, you are being bestowed this jelly in ensuring areas that I wanted was built up. You have shined today my hivelord, I hope to see more from you, an see you get better at your role altogether!' by Prime Queen (PRO)

  Prime Praetorian (YIP-11) is awarded the Royal jelly of sabotage: 'For taking out the invisible one, for the hive that was killing or disrupting the hive, for that I am bestowing this jelly for your great take down of a deadly advesary. Good work overall, I love to see your work all the time.


  Not to mention you have gotten a long way as a prime, your work and knowledge I hope is bestowed to everyone thank you for your help all the way to here.


  Rejoice!' by Prime Queen (PRO)




