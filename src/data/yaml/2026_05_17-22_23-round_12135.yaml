roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Makayla Mosser.



  Royal Jelly Awards:

  Prime Praetorian (RAD-78) is awarded the Royal jelly of resilience: 'RAD, you saved me from when I was most hurt by the evil tuber, you over watched your sisters as if their lives meant more than yours. I witnessed all of this and was proud to have you as my valkyrie, so today I reward you with this Jelly to remember this day. REJOICE!!


  See you in the next hive.' by Elder Queen (VCR)

  Mature Hivelord (XX-84) is awarded the Royal jelly of proliferation: 'XX, I woke up and I saw you, building with your heart and for your sisters to keep them safe from the spits of the evil talls, your mazes confused them, your walls solid like a rock. Today I reward you this jelly to remember this day. REJOICE!!


  See you in the next hive.' by Elder Queen (VCR)




