roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  Medal Awards:

  Darfman Forgemog is awarded the Bronze heart medal: 'Perished during the events of Operation Manouvre Buddy-Target. A true regret that we were unable to save you in time.

  Gunnery Sergeant Darfman was beloved by his men, lead them forth fearlessly, and coordinated an effective orbital strike on a hard target.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Bohn 'Zombie' Griff is awarded the Distinguished conduct medal: 'An unorthodox medal to some, but I do not believe so. This mess technician has worked tirelessly to provide the shipside staff and the marines with food, as well as taking a new chef under their wing to teach them the arts of culinary craftsmanship. A job well done is to be commended, no matter which branch of the corps.


  Awarded by Col. Scraps-the-Copper on 9/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





