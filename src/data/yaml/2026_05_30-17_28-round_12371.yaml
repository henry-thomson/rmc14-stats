  Awarded by Colonel Sicilia Drakonovisch on 05/30/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





