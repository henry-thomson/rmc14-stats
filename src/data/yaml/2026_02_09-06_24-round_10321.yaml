roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Scytodi Suniflower.



  Royal Jelly Awards:

  Elder Praetorian (SAL-585) is awarded the Royal jelly of resilience: 'For your sacrafice that allowed the hive to continue. You put yourself infront of multiple tuber shots- protecting me and making our victory possible. Well done.' by Prime Queen (HEK)

  Ancient Drone (FA-144-T) is awarded the Royal jelly of sabotage: 'For your work seiging the second hive mind. Causing the talls to panic and retreat. You and your sisters were the final key to this battle.' by Prime Queen (HEK)

  Prime Drone (XX-21) is awarded the Royal jelly of sabotage: 'For assualting the talls mind, you and your sisters were the final straw that broke the talls back. Causing them to panic and flee. Well done.' by Prime Queen (HEK)

  Prime Ravager (PRO-326) is awarded the Royal jelly of sabotage: 'For leading the assault on the talls hivemind. You and your sisters assault broke the talls morale, leading to a swift and sudden victory after a grueling back and forth. Well done.' by Prime Queen (HEK)

  Mature Boiler (GL-764-M8) is awarded the Royal jelly of slaughter: 'For tireless work sending acid in to the tall ranks. Without you we would have caved in long ago. Well done, daughter.' by Prime Queen (HEK)




