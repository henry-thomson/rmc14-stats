roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Max Firebrush, Plimbo Flombus, Harry Johnson, Kas'Lurla-Skeh'Kasar, Jona 'Biohazard' Knappenberger, Lunar 'Roach' Romanov, Izzy Cattington, Bruce 'Lil Bear' Magor, Adriana 'Twin' Ann, Ups-The-Downs, Addyson 'Fortuna' Zappy, Rhaun 'Marksman' White, Glugnort Glugtug.



  Royal Jelly Awards:

  Mature Burrower (SE-903-R) is awarded the Royal jelly of resilience: 'SER, your great efforts today have paid off greatly. As a burrower you kept the tunnels comming and our hive safe from destruction.


  The tunnels today was the only reason we managed to destroy the talls. Their legs stood no chance in facing our mighty tunnels as they were too slow to keep up.


  From the entire hive, we thank you for your service and your survival instincts. Not only providing tunnels, but also surviving long enough to see them finish off the talls is what all hives need. Your support shall not go without reward.


  YIP!!' by Ancient Queen (YIP)

  Mature Carrier (EM-353-C) is awarded the Royal jelly of proliferation: 'EMC, today you have managed greatness. You were the carrier responsible for our comeback. Without you at our side putting eggs on the tall advances we would never have made the comeback we did.


  All hives should have a carrier so dedicated and efficient as you. Keeping yourself and your eggs safe from harms way making sure never to take undue risks.


  YIP is proud of your work today and you should be proud of yourself.


  YIP!!' by Ancient Queen (YIP)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
