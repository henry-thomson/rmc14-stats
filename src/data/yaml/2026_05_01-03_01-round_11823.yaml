  Royal Jelly Awards:

  Elder Hivelord (FAE-442) is awarded the Royal jelly of rejuvenation: 'Fae, even before the battle started you were demonstrating your focus as a builder. You helped setup the build to receive the talls, and without hesitation throughout the fight you were listening to my calls and building critical areas. Without your dedication to your craft, our work would have been much harder and we would have been nowhere near as prepared. Rejoice!' by Elder Queen (ARES)




