  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Adrian McKnight, Eilidh Eisner, Alexis Mayfield, Denise 'Weast' Demise, Diego Santiago, 'Duke' Qixtaq Teqxae, Morticia Finn, Wren 'Hellhound' Grey.



  Royal Jelly Awards:

  Prime Drone (ASH-12) is awarded the Royal jelly of rejuvenation: 'You were the true healer of the hive, you sacrificed yourself for another so that they could continue to exist and gleefully fight the talls once more. I thank you for doing such action, you provided what you could for this battle, and that what matters. May you continue to prosper in healing others. Rejoice!' by Prime Queen (PRO)




