roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Zarvik Lioren, Mia 'Feisty' Monroe, Aislinn Knoles, Jesse 'Bandit' Sharpe.



  Royal Jelly Awards:

  Mature Hivelord (BAG-593) is awarded the Royal jelly of proliferation: 'For building eagerly for the hive, since the beginning staying with your builder leader NOX. who led you throughout the lands.


  You made an excellent performance pushing your boundaries in setting a thousand walls against the talls.


  I am proud of you daughter. Good work' by Prime Queen (PRO)

  Young Hivelord (MA-965-L) is awarded the Royal jelly of proliferation: 'For building eagerly for the hive, since the beginning staying with your builder leader NOX. who led you throughout the lands.


  You made an excellent performance pushing your boundaries in setting a thousand walls against the talls.


  I am proud of you daughter. Good work' by Prime Queen (PRO)

  Elder Boiler (MAT-400) is awarded the Royal jelly of sabotage: 'Every boil the metal creaks in your view. No metal was stronger than your boils against the impending doom of a tall hive. You have made it an entirely easy job to break through their defenses with your help.


  Rejoice!' by Prime Queen (PRO)

  Mature Praetorian (MO-769) is awarded the Royal jelly of proliferation: 'You were fishing the talls like you were luring the talls with fruit baits, such profound attempts that I enjoy watching.


  You made many attempts in captures, and even a great attempt against the tuber who almost got captured by you but effort is what matters.


  I heard many great things from you, and I hope that this shows that your effort is not ignored, keep up the good work young one. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
