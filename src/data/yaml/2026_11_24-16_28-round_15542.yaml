roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Catthew 'Statue' Jones, Tim Tiptoe, Moss-Boy, Bill Sparkdrawn, Maria 'Maniac' Malzar.



  Medal Awards:

  Sergeant Butch 'Mr Ammo' Ratcliff is awarded the Distinguished conduct medal: 'Sergeant Butch Radcliffe consistently kept the force of marines he served supplied, the force that was fighting in the very intense battle inside caverns during today's operation. This ensured that we could sustain the momentum we bought ourselves and ensured a swifter clearance.


  Awarded by Maj. Hudson 'Hungry' Demuth on 24/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





