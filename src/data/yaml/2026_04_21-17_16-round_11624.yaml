  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Krowie Tezari, Hugo Knapenberger.



  Royal Jelly Awards:

  Prime Praetorian (FLA-87) is awarded the Royal jelly of proliferation: 'For their exceptional captures, like more than 20 at least, FLA is awarded with the jelly of proliferation for rewarding us with multiple captures. I wish i had more spotlight today, but you were truly the highlight of today's hive expansion.


  Rejoice my dear sister, and may your hooks be eternal!!' by Prime Queen (RP)

  Elder Warrior (LE-943-ON) is awarded the Royal jelly of sabotage: 'LEON was a warrior that made many talls be captured and defended multiple draggings, allowing a lot of the FLA hooks and their own lunges to be succeful, even capturing the tall lurker.


  Rejoice my sister! May your braveness be eternal!!' by Prime Queen (RP)




