roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Lance Corporal Tatiana Zaychikova is awarded the Medal of exceptional heroism: 'You Lanca Corporal Tatiana Zaychivova. not only escaped captivity.. but in doing so. got sensors online. freed a fellow captive. killed several larva together. and then when the horde started to swarm you in the nest killed several of them in turn. your show of heroism in the face of innevitable death is inspiring. and will be remembered in the history of the company for generations to come


  Awarded by Col. Tyr Ragnarson on 10/05/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Tyrone Choom is awarded the Bronze heart medal: 'When freed from the nest. you did not hesitate to help your liberator in causing havoc for our enemies backline. your aid in the nest despite being hugged lead to the deaths of several Xenonides and their young larva. not only making your capture worth less. but punching the hive in the gut for their troubles


  Awarded by Col. Tyr Ragnarson on 10/05/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Sergeant Larry 'Fender' Mens is awarded the Distinguished conduct medal: 'For your wonderful work clearing out our backlines of tunnels. cutting off xeno escape routes and quickly running to my call outs on a dime. you have show us your skill as a scout in the marine corp


  Awarded by Col. Tyr Ragnarson on 10/05/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





