  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Paduxi-Utamukeeus, Angus 'Beef' Sealander, Zix Zaozao, Reika 'SweetTooth' Inazuma, Nova Ivy, Mops-the-Floor.



  Royal Jelly Awards:

  Prime Warrior (TO-389-MB) is awarded the Royal jelly of slaughter: 'For your complete and utter  destruction of the talls scav team and amazing fight I reward you with this jelly of Slaughter. Rejoice!!!' by Elder Queen (RAP)

  Mature Lurker (RGB-493) is awarded the Royal jelly of slaughter: 'For the capture of longspit and useful intel I reward you with the jellies of slaughter!!! Rejoice!!!!!! THank you RGB for your captures.' by Elder Queen (RAP)

  Mature Praetorian (KT-673-V) is awarded the Royal jelly of rejuvenation: 'For saving a lot of your sisters, Sacrificing yourself for one of them and amazing later work on the battlefield I reward you with the Jelly of rejuvination! Rejoice!!!' by Elder Queen (RAP)




