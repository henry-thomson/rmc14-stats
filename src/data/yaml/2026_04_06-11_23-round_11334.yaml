roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Osas Xaaqxuq'Qer, Andre Yeskey, Einuko 'Twitch' Steelfeather, Wilco Whittaker, Hard-working Jambi, Harald Francis, Joshua Lee, Ann Muir.



  Medal Awards:

  Private First Class Lydia Lowe is awarded the Distinguished conduct medal: 'While not experienced in their role compared to their peers, Private First Class Lydia Lowe was reported to have performed their duty as a newly instated combat technician to an excellent level.


  They had secured their squad's survival in a tight netted defense against Xenonids that surely would have wiped out their team in western barrens by securing Charlie's position as they were taking casulaties while delayed reinforcements arrived.


  Semper Fi. Good work.' by Colonel Kazi Priestess





