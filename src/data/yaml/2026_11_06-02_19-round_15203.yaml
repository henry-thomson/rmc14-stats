  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  The Branch of Gentleness, Estelle Kanin.



  Royal Jelly Awards:

  Ancient Drone (HA-572) is awarded the Royal jelly of rejuvenation: 'You gave your life for me at a critical moment in our war, without you healing me, all was lost. You were the light in my moment of despair. Thank you daughter.' by Ancient Queen (EKAJ)

  Young Hivelord (IQ-304) is awarded the Royal jelly of proliferation: 'You work and toiled for my kingdom. You built me my hive that we now how forevermore. We could not of done it without your resin. Thank you daughter.' by Ancient Queen (EKAJ)




