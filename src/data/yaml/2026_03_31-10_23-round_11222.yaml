  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Boiler (MW-303) is awarded the Royal jelly of resilience: 'Excellent understanding of their limitations as a boiler, this understanding allowing them to always be in good positions for boils, and they delivered good, consistient results. one of their boils even saved my life.' by Elder Queen (AID)

