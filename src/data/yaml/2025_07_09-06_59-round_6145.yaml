  Royal Jelly Awards:

  Young Spitter (TI-557-E) is awarded the Royal jelly of slaughter: 'Alongside the other boiler, they brung the talls terror by bombarding them relentlessly! in their time as a boiler they were critical to our victories against those talls and covering us while dragging talls... thank you my daughter.' by Elder Queen (GUH)

  Mature Boiler (GE-34-M) is awarded the Royal jelly of slaughter: 'For your amazing preformance alongside the other boiler, you were critical to our victory, helping us wipe many with your relentless boils while also covering our escapes and helping us get many caps! thank my daughter... truly...' by Elder Queen (GUH)

  Young Lurker (DA-239) is awarded the Royal jelly of proliferation: 'FOR YOUR AMAZING CALLOUT, HELPING US FEND OFF THE BLUE TALLS AND COMPLETELY WIPING THEM, THAT ALLOWED US TO KICK THOSE TALLS OUT OF OUR PLANET! Thank you my daughter... i am proud.' by Elder Queen (GUH)




