roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Hanz 'Kernel' Mouske, Gallagin 'GC Addict' Caitman, Vladimir Kamnerezov, Jay Winton, Lucius 'MK-1' Flavius.



  Medal Awards:

  Lance Corporal Ups-The-Downs is awarded the Distinguished conduct medal: 'Lance Corporal Ups-the-Downs has displayed a commendable ability to remain calm and render aid to injured personnel during Operation: Investigation Obsidian-Justice. They have worked without fear or hesitation in treating injured Marines during mass-casualty events. Thanks to their noble efforts and dedication to their duties, many deaths were prevented, and the operation ended in resounding success.' by Lieutenant Colonel Michael Wilson





