roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  Medal Awards:

  Sergeant Lena 'Rainband' Nakonieczna is awarded the Distinguished conduct medal: 'Sergeant Lena Naknieczna, without prior experience or without being requested, stepped up to the task of manning Requisitions and performing most tasks required of a normal Technician so that the Logistics Officer could properly train his new Technician. Good work on showing initiative and lessening the strains our already overworked Requisitions faced.


  Awarded by Maj. Hudson 'Hungry' Demuth on 10/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





