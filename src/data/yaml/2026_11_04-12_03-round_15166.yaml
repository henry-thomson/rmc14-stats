roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  William 'Daybreak' Blackwell, Andrea 'Copycat' Amberburn.



  Royal Jelly Awards:

  Mature Burrower (PP-234) is awarded the Royal jelly of sabotage: 'PPs talents and progress cannot be denied. She work tirelessly on making sure the whole hive can travel all over place!  Her work, and symbiosis with other sisters tired out talls so much that they could barely push, well quite literally they couldn't push at all. For that we are deeply grateful. Help us again PP!' by Prime Queen (LIMA)

  Prime Drone (BU-335-RG) is awarded the Royal jelly of rejuvenation: 'Although I don't award jellies to the apex sisters, this one is an exceptional one. Eternally stuck to the queen like a bad tumor, but in a good way of course, she managed to save many sisters.  
   Always grazing the edge of danger on the frontlines, yet at the same time being safe at all times.  BURG is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)
  Mature Hivelord (RGB-673) is awarded the Royal jelly of resilience: 'For her incredible work as a carrier of supreme caliber, RGB has deserved the royal award!  Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Talls could only despair at the work they would have to slash through! Thank you for your work!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]Lilith's Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]SireHambone[/color]![/bold]
