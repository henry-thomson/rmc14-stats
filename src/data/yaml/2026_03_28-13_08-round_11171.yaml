roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Amaryllis 'Alice' Alison, Harvey Green.



  Royal Jelly Awards:

  Mature Praetorian (AAA-405) is awarded the Royal jelly of resilience: 'You were one of our main valks of the hive, even though you died, I was blessed to have you with us until you were strike down from the sky from the skybird at telecomm, though. you were always our guardian angle ensuring that none of us were getting tubed to death, or sky shelled to death, may you be forever remembered AAA!' by Prime Queen (PRO)

  Young Drone (PI-742) is awarded the Royal jelly of rejuvenation: 'As a gardener you kept supporting one of the flanks or fronts ensuring everybody was stay in peak condition because of your fruits. I thank you for doing a amazing job in ensuring others around you were kept in healthy condition.


  Rejoice!' by Prime Queen (PRO)

  Elder Drone (NY-91-X) is awarded the Royal jelly of rejuvenation: 'For being one of the main gardeners following the Queen Horde, where we kept rotating non stop you were the one to always follow in line, ensuring everybody was in prime condition, I thank you for the journey you made along with us, and you providing your best.


  Your effort alone is what great values hold, rejoice!' by Prime Queen (PRO)

  Elder Drone (BBQ-289) is awarded the Royal jelly of rejuvenation: 'Your healing and profound work on each front has granted us great support in keeping momentum going.


  I heard you saved at least  8 sisters from crit, and much more.


  No matter the danger, you always pat down any sister who was engulfed in flames ensuring their survival.


  Be proud of your effort alone, may you bring forth a thousand victories in the prime hive name!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
