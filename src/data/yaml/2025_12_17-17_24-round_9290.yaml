roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ulhan Duskheart, Kiefer Stohl, John 'Arsonist' Spade, Pitch Black, Charles 'Fox' Roberts, Aria Shark-Scale.



  Royal Jelly Awards:

  Elder Praetorian (JO-422) is awarded the Royal jelly of proliferation: 'You were fishing talls like they enjoy pushing tiny gaps in the hivecore defense, even as talls try to push forward you never let up pulling them in their own fire, and even killing them in the process.


  Overall, I am impressed, rejoice!' by Prime Queen (PRO)

  Elder Hivelord (ARG-67) is awarded the Royal jelly of resilience: 'You kept on repairing, non stop regardless of the circumstances of the great battle of the core! Talls kept turning the walls into swiss resin, no matter how hard I built, you were always there repairing the core non stop, preventing the talls advancement.


  Even when the walls broken when the core was exposed you stood there building and keeping it safe.


  You have done an evil thing today, rejoice!' by Prime Queen (PRO)

  Mature Hivelord (BEL-325) is awarded the Royal jelly of proliferation: 'You were a true whisperer of resin, you told the ground beneath you to build up columns of walls as you channel your energy through the resin below your feet, and made the hivecore hold, even more difficult to break down, your help was tremendous I love every wall you placed with me, when we were both working together, as always keep it up, you have done an excellent job!

  Rejoice!' by Prime Queen (PRO)

  Ancient Warrior (GIB-677) is awarded the Royal jelly of sabotage: 'You were a demon in the night, you prowl upon the tuber in the nick of time, saving the praetorian that was tubed by the fable tuber. after you killed them off, I was able to get up and destroy it permanently. You also made couple of captures at the hivecore battle, that was immensely helpful for the hive, and perhaps even killing some permanently, great job! Rejoice!' by Prime Queen (PRO)

  Ancient Carrier (MIU-470) is awarded the Royal jelly of proliferation: 'For your great impact of the great battle of hivecore, you placed egg traps that allowed, the oppressor, the warriors, and even plus more to make captures for the hive. Without your effort we wouldn't have made those possible. I thank you for your performance, rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Kate's Mercenary Funds[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
