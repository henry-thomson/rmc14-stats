  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Slowy Garrison, Sonata AW Moschetto, Throck 'Cousin' Morton, Brendon MacGregor.



  Royal Jelly Awards:

  Elder Boiler (LAF-255) is awarded the Royal jelly of proliferation: 'LAF, for your efforts in helping secure 6+ captures with your crowd control boiling you are awarded this here jelly of proliferation!


  Not only did you secure captures, you also survived for a very long time as a boiler. Making it all the way till the retreat of the talls. Younger boilers should look to you for the ways to survive in the midst of battle!


  YIP!!' by Ancient Queen (YIP)

  Elder Boiler (LAF-255) is awarded the Royal jelly of sabotage: 'DW, for your actions in sabotaging the tall advances with your earth shattering tremmors you are awarded this jelly of sabotage.


  Not only did you tremmor the talls as they tried desperately to charge. You also helped LAF with their boiler action in getting some incredible boils. Few talls will forget the ground shaking beneath them as they try to run from the boils of our hive.


  YIP!!' by Ancient Queen (YIP)




