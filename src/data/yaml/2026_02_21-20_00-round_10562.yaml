roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Davlat 'granddad' Lukin, Stick 'Blonde' John, Kobeni Pavlova, Nib-Nob, Claire 'Mutie' McGrath, Igor Igorsson, Nezuni, Epistemios Kripasis, Naakoni 'Cinders' Uton, Daedalus Nightflitter, Santiago 'Dubloon' Bonny, Kingcade Jackson, Giovanni 'Brisket' Guess, Ronald Laborde, Nenuko 'Nen' of Ywain, Jolyne 'Wendy' Wensleydale, Yeo 'Sakura' Bunnia, Andrea Newbern, Akrem Marshall, Tar-On, Nick Steel, Iris 'Wrath' Starseeker, Archibald 'Ripcord' Butterfill, Lucian Sepher, Klaus Banner, Maximus Simpus, Flyk 'Lucky' Lambert, Maple Stargazer.



  Royal Jelly Awards:

  Elder Ravager (NEV-820) is awarded the Royal jelly of proliferation: 'Your assistance capturing the tuber, aswell as leading the charge during our destruction of the red crest.


  You have fallen and risen again- a holy feat worth of the Queen Mother. Without you, our hive went through dark times, but now that your back we will finish what we started.' by Prime Queen (HEK)

  Elder Hivelord (DU-144-M) is awarded the Royal jelly of resilience: 'Your fine work leading the build team, your efforts allowed us to constantly stay in the colony and keep outsides of caves.


  Thank to your work, our hive was never trapped. With your continued work, it never will be.


  You are a boon to any hive, well done.' by Prime Queen (HEK)

  Young Hivelord (LO-405) is awarded the Royal jelly of resilience: 'Recommended by your build leader, it was due to your efforts that our structures remained solid and plasma plentiful. It is not easy work, but it is appreciated all the same. Thank you.' by Prime Queen (HEK)

  Young Praetorian (KO-345-L) is awarded the Royal jelly of rejuvenation: 'For your work as a Valk,


  You have saved many our your sisters lives. We were neck and neck with the talls, and any of those kills could have tipped the scales in their favour. 


  Thanks to you, we need not worry about that. Well done, and once again, thank you.' by Prime Queen (HEK)




