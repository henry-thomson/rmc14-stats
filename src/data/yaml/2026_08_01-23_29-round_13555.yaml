roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  John Tanners, Judith 'Jacket' Szymanski, Exi-Brize, Petti Tahae.



  Royal Jelly Awards:

  Elder Drone (HM-952-C) is awarded the Royal jelly of rejuvenation: 'My Daughter HMC you provided such help supporting our builders in this long fight. Providing them Cruor to our builders and me alacrat. For your service to the hive I reward you a Jelly. REJOICE!' by Elder Queen (FOP)

  Prime Praetorian (FLA-152) is awarded the Royal jelly of proliferation: 'My Daughter FLA you stalled so many talls pushed with your pulls and captured even more of them. Without your work with RAD we wouldn't have sustain our numbers. For your service to my hive I reward this Jelly. REJOICE!' by Elder Queen (FOP)

  Ancient Hivelord (SAL-596) is awarded the Royal jelly of resilience: 'My Daughter SAL your are one few remaining builders since the start and your work stalled out the talls so much. Without your constant work with the others we would have never blunted so much talls advances. For your work for the hive I reward this Jelly. REJOICE!' by Elder Queen (FOP)

  Elder Ravager (ASH-725) is awarded the Royal jelly of resilience: 'My Daughter ASH you were the shield for so many of my daugters and even me. You saved so many from death and even captured many talls in the processs. Without you I wouldn't have been able to do this. For your service in my hive I reward this Jelly. REJOICE!' by Elder Queen (FOP)

  Young Hivelord (SP-911) is awarded the Royal jelly of resilience: 'My Daughter SP you along with other builders help hold the line against the talls. Without your effort today we wouldn't been able to do this and for such a young daughter you show great promise. For your service to my hive I reward you with this Jelly. REJOICE!' by Elder Queen (FOP)




