roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Theo Avid, Minji 'Failsafe' Kilgrim.



  Royal Jelly Awards:

  Young Praetorian (DR-6-D) is awarded the Royal jelly of resilience: 'Upon seeing the dreaded tuber, wearing no crest, charging at mother, this daughter did not fail to act. Leaping in front of mother, she sheilded her from the blast. Without her sacrafice mother could have been cut down, leading to a possible victory for the talls. Her efforts did not go unoticed. You showed the true conviction of a prime of this hive. Rejoice!' by Queen (FOCN)

  Elder Hivelord (VA-12-R) is awarded the Royal jelly of resilience: 'Building from the very start of our small and humble hive. The last of our original builders. We required resin so desperatly during this battle, you were always there to provide. Thanks to your claw, crafting each and every wall we have prevailed. Rejoice!' by Queen (FOCN)

  Prime Lurker (MAD-91) is awarded the Royal jelly of proliferation: 'A prime example of a lurker. Your interception on fleeing talls meant many met their doom by your lunge. Without your constant ability to single out retreating talls from the war party, many captures would not have been secured. When the time was right you secured the tall lurker as well, granting protection to many in our hive. We can all learn from your skill and dedication. Bravo!' by Queen (FOCN)

  Mature Praetorian (DEA-977) is awarded the Royal jelly of proliferation: 'Your movements swift, you grasp deadly. You dragged countless talls to their doom. When no other sister could return with a capture, you did. Although still young in your role, you have the makings of a true prime within you. Dodging spit and flame you secured our victory. Bravo!' by Queen (FOCN)




  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



  [bold]Hive established by [color=purple]Lilith's Xenonid Research Division[/color]![/bold]
