roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Dante Kirkson, Icey Iana, Kiko 'Keeko' Winterrey, Andrew 'Bomber' Honk, Vlad Zovich, Donavin Burris, Sam Turner, Dives-The-Deeps, Lily Wells, Shi Yu, Banka-Kai, Blake Palmer, Caleb Bloodworth.



  Medal Awards:

  Private First Class Matthew 'Skidmark' Fields is awarded the Distinguished conduct medal: 'Private First Class Matthew Fields contributed significantly to the efficiency of requisitions and it's future staffing through carrying the majority workload on their back while the Logistics Officer oversaw the training of two new-employs within the department.


  Logistics is the backbone of any good military, and the capacity of one man to carry the load of one company on their back is worth a lot in the field. Keep it up Fields.


  Awarded by LtCol. Kaitlin Zalack on 12/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





