roundEndText: >2

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Dan Groto, Argy Navus, Sigma Draconis, Lana Lester, Lennox Hardy, unknown, Keist Lady Scorchedflight.



  Royal Jelly Awards:

  Elder Boiler (CD-73-V) is awarded the Royal jelly of slaughter: 'You have done a phenomenal job boilers. You were the main sole reason the talls couldn't advance everytime I went ovi, you worked wonderfully with your sisters, and the healers kept you going as well. You made sure each choke, was as much as a hell to even move forward one resin wall. I am proud to say you were an exceptional boiler this battle. May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Prime Drone (AMK-370) is awarded the Royal jelly of rejuvenation: 'You were an exceptional healer drone, you were always providing critical healing at the front line, and me included. You also saved a praetorian, a boiler with sacrifice. I believe you sacrificed twice! You did amazing job, I can't even fathom any healer drone coming close to how well you time things on ensuring the survival of other sisters. Your performance was noted and will not go in vain, may the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (LOL-576) is awarded the Royal jelly of proliferation: 'For your creation of remaking the entire what was use to be the front now was a complete flat wasteland, and then after about a good 20 minutes. It was turned into an entire fortress the talls did not get to escape because of your actions, you have made sure these talls suffer tremendously under your support. Your effort was truly remarkable as it made the encirclement a complete flawless wipe. Even the Queen Mother would be proud, rejoice!' by Prime Queen (PRO)

  Prime Hivelord (SIP-588) is awarded the Royal jelly of proliferation: 'You have done a remarkable job hivelord, you have made a huge impact by rebuilding what use to be the front, and was turned to a wasteland, but you rebuilt it all back up. Ensuring the talls were encircled, and because of that you made it possible to fully wipe the talls. Make captures that I can't even fathom to get because of your remarkable buildings. The Queen Mother would be proud of you for making such a great display of your building potential, Rejoice!' by Prime Queen (PRO)
