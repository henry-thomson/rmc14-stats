  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Aelica 'Mom' Danara.



  Medal Awards:

  Captain Nya 'Kitkat' Firestar is awarded the Medal of exceptional heroism: 'For stunning tactical insight and personal initiative under extreme duress. Captain Nya Firestar proved themselves an exceptional Commander. Their quick thinking and creativity allowed for the Xenonid horde to be quickly isolated and destroyed via a feint retreat.


  Awarded by Col. Clyde McKinney on 26/10/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Clyde McKinney





