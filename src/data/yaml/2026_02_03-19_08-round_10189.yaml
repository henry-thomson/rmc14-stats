roundEndText: >2-

  [color=red]INTERNAL REPORT DO NOT LEAK [/color]

  The crew of the UNS endeavor has gone missing over the Yvettan sea on standard patrol

  duties. while the vessel itself was safe, the normandy has gone missing. A search effort

  has been undertaken by FORECON unit Grizzly-7, but no sign of the crew has been found.


  The current hypothesis is the normandy was struck by an anti-air measure, but this is still

  disputed


  The Yvettan sea, historically, has been prone to ship downings, though there are multiple 

  explanations as to what causes their frequency. Affixed to the addendum of this report are

  several theories, including (LOSS THEORY) (See file)


  UMSU has been tasked with identifying the cause of the crew's disapperance.


  As of current, the endeavor's crew will be listed as MIA until they are found


  END REPORT




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
