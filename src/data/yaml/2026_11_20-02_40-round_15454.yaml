roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Aurora 'Birdcage' Barkheart, Snicket Sharp-Claw, Gabriel Jyllian, Guppy DeMews, Silas 'Chitter' Candlewing.



  Royal Jelly Awards:

  Elder Defender (AL-489-BY) is awarded the Royal jelly of sabotage: 'This was a tough fight today, and we needed lots of hard and dedicated workers. And today, you were the best of that. You got us a total of 9 captures nearly by yourself, supplying the hive with a steady supply of new sisters as they fell on the frontlines. You have greatly helped secure this day, and for that the hive thanks you.


  Love,
    Mother.' by Ancient Queen (JINX)
  Elder Hivelord (TZU-435) is awarded the Royal jelly of proliferation: '3 different times over the course of this battle, the entire tall horde was completly encircled in our resin. That resin does not come from nowhere. You stepped up with the rest of the build team, and you worked overtime just to keep up with the front, building over the entire colony coutnless times as it was destroyed. I have watched you and your sisters building closely today, and can say with certainty that your work was grand today. The hive rests well in your walls.


  Love,
    Mother.' by Ancient Queen (JINX)



  [bold]Operation funded by [color=green]There is no war in Roundy Marines[/color]![/bold]



  [bold]Hive established by [color=purple]SireHambone[/color]![/bold]
