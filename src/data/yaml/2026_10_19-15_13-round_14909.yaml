  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Mariki 'Rocketbird', Kylee Wible, Boris 'Boorish' Petoskey, Kas'Lurla, Dante Minnie, Is-Real-Bird.



  Medal Awards:

  Staff Sergeant June Tolkin is awarded the Medal of valor: 'For an excellent show of leadership. keeping your squads morale high and fighting hard even under confusing circumstances during deployment. your efforts are a great show of valor and a prime example or what it means to be a marine


  Awarded by Col. Tyr Ragnarson on 10/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





