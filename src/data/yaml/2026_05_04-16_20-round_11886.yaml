roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Mizooki 'PillBug' Akiya, Mina Turner, Kaitlin Zalack, Spinax 'Chewy' Bahama, Ivan Cook, Tyrone Choom, Bad-Tail, Licks-The-Fruit.



  Royal Jelly Awards:

  Elder Carrier (EV-403-IL) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, EVIL has deserved the royal award! Sister managed to capture talls time and time again, a literally never ending flow! She was way too resilient for the talls to kill her, and she was a partial mother to the rest of the hive. Oh how we becon EVIL to help the further hive expansion! May her children are plenty!' by Ancient Queen (LIMA)

  Elder Hivelord (FAE-925) is awarded the Royal jelly of resilience: 'Somewhat of a shared jelly along her sister RISK as there was not much of RISK to scrape to award a jelly. Our most honorable sisters kept our wonderful kingdom always weeded, walled off, and tight with the mightiest walls! They stalked the talls with their keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! However sad it is though, they perished saving their hivelord sister.' by Ancient Queen (LIMA)




