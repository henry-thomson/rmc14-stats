roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Willy Pete, Azakul-Ze, Rosemary 'Shenaniganizer' Smox, Jim Hammler, Melly 'Eepy' Kharru, Chuck Hensworth, Reese, Stares-Ominously, Aghata 'Supressfire' Fall, The Bloom of Noxiousness, Kane Murray, Leo Ruivao.



  Royal Jelly Awards:

  Ancient Crusher (BU-520-B) is awarded the Royal jelly of resilience: 'You were a true crusher till the end, you gave it your all. 


  Aiding what fronts you could at your discretion.


  During the engagement near sentinel, you were sadly tubed, but not in vain no.


  With your courage you made the tuber get confident in my lands, and they paid the price for removing you.


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (YIN-847) is awarded the Royal jelly of proliferation: 'for your dedication in building the entire time since you were born.


  You are being rewarded this jelly for you continous effort in ensuring each area was built up, and aid in the siege in the best way you can.


  You have done an excellent performance, may you build forth a 1000 more walls for the hive!


  Rejoice!' by Prime Queen (PRO)

  Elder Drone (AN-565-A) is awarded the Royal jelly of rejuvenation: 'For your dedication and commitment to your role as the healer of the hive, you have help tremendously by providing healing to all sisters around you.


  You have made attrition easier because of your effort, and for that you should be proud of it!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Kate's Mercenary Funds[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
