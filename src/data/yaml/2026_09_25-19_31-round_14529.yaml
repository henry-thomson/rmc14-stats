roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tucker Hanford, Lycia Zonaria, Glorp Blorbleson, Theta 'Frenchie' Sigma, Theo Avid, Elle, Javier 'Machine' Raiden, Nesuli, Sean Burris, Apollo AW Mosin-Nagant, Giovanni 'Brisket' Guess, Erin Baum, Elena Embers, Chirop, Kiko 'Keeko' Winterrey, Bootseey 'Doodle' Mireaux, Meyer 'Wawa' Evergarden, Kun Ironclaw Pack.



  Royal Jelly Awards:

  Prime Hivelord (VY-264-NL) is awarded the Royal jelly of proliferation: 'VYNL, you have led the build team since the start, this work has allowed us survive. Your production of nests and valiant leadership was not lost in the noise of battle, I heard it all. Thank you daughter' by Elder Queen (EKAJ)

  Elder Ravager (LA-759-MB) is awarded the Royal jelly of slaughter: 'You did what I needed, as I needed, without question nor fear. Through thick and thin, terrible calls and amazing calls, you were a pair of claws I could always have in my horde. When I ordered to kill, you did exactly as ordered and killed many talls.. Including a tall lurker! Thank you daughter.' by Elder Queen (EKAJ)




  [bold]Operation funded by [color=green]Lilliths Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]the gibbing of Minju[/color]![/bold]
