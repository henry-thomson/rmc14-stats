roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Emiko AW Kaiten, Luanne Greenawalker, Scarlet 'Scar' Aurora, Ana Zaychikova, Nya 'Kitkat' Firestar, Minji 'Failsafe' Kilgrim.



  Royal Jelly Awards:

  Mature Boiler (FI-926-N) is awarded the Royal jelly of slaughter: 'My only surviving boiler, this daughter's gas was invaluable in preventing the talls from capitalizing on screams, and disorienting and confusing the masses, allowing for many captures and many kills. Your neurotoxin helped us to proliferate, kept us safe, and slaughtered many. In a way, this jelly cannot represent the full scale of your accomplishment.' by Ancient Queen (ZERO)

  Elder Lurker (ALT-387) is awarded the Royal jelly of sabotage: 'After the death of my old flesh, the talls became emboldened. They thought themselves invincible, and scattered to the wind. In that era, this daughter stalked among them... Harvesting them in great numbers, like the gardeners of old. Our numbers grew from a mere enclave to a flourishing hive, and for this we have this daughter to thank in part.' by Ancient Queen (ZERO)

  Ancient Drone (KE-790-EN) is awarded the Royal jelly of slaughter: 'When my old flesh perished, and the talls were barging down our doors, this daughter stood between them and my nascent form. She slaughtered, and slaughtered, and slaughtered again. Under her rage, a prime boomrock spitter fell and was gibbed, saving many sisters from death. After this, she continued her night of slaughter... The soil of this planet will be forever stained by the blood her claws spilled.' by Ancient Queen (ZERO)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
