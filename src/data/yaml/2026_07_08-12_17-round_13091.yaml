roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Hivelord (AE-57-A) is awarded the Royal jelly of proliferation: 'Your effort in organizing the build team and fortifying the areas that were needed to stop the Tall's effort in slaughtering us all was remarkable.


  Your proficiency and your leadership led us to total victory while I was on the frontline, dealing with the Tall Menace.


  Your profound resolve and leadership as well astonished me and made me proud that I had given you the role of leader. It was good to know that you are truly amazing with your ability, as well as your leadership.


  See you in the next hive.' by Elder Queen (SVI)




