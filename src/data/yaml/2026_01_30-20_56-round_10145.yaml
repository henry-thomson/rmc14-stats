roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Dot Greywing, Alan 'Gambit' Braun, Lav-Ender.



  Royal Jelly Awards:

  Young Hivelord (AR-133-R) is awarded the Royal jelly of resilience: 'Our sister showed endless dedication to the art of building. Their walls stood high and mighty! For talls feared to breach them. Maybe our sister continue their terror of encirclement!' by Ancient Queen (LIMA)

  Mature Drone (FN-34) is awarded the Royal jelly of rejuvenation: 'One of the many healers and gardeners keeping our hive fresh and ready for combat! No sister shall die under their watch, and her fruits are widely known for extreme vigour! May our sister keep her garden safe, and the hive slaugher ready!' by Ancient Queen (LIMA)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
