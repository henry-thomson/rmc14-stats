roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Accents 'SmartyPants' Neandertha.



  Royal Jelly Awards:

  Ancient Praetorian (REH-974) is awarded the Royal jelly of rejuvenation: 'For your heroic, and courage action on saving my life I bestow you the jelly of rejuvenation, you were at the right place at the right time, and I narrowly made my escape to survive the tuber incident at the dam. For that your actions were highly appreciated.' by Prime Queen (PRO)

  Mature Drone (AR-410-C) is awarded the Royal jelly of rejuvenation: 'You have done many things for the hive, mainly healing, you were alive since the beginning to end, until you had to sacrifice yourself to keep me in good condition, you were at the battle of hydroponics, that of which is when you sacrificed yourself. you did an excellent job, as our healer for the hive. well done!' by Prime Queen (PRO)

  Young Hivelord (ST-898-L) is awarded the Royal jelly of proliferation: 'I will be bestowing this jelly in good heart of your great help for the hive. Many people think hivelord are boring, but you show how powerful, it can be when it shines secretly in the background. You may of not been the main combatant, but you sure as hell was the main support. For your efforts in creating hospital, excavation, engineering central, and many other places that I requested to be built was done you, I believe you deserve this jelly. Rejoice!' by Prime Queen (PRO)




