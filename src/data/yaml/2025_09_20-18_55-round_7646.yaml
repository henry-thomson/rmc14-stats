roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Mikayla Mainblood, Milo Mills.



  Medal Awards:

  Juniper 'Evergreen' Viridia is awarded the Distinguished conduct medal: 'Managed to survive the events of Operation Sortie Yellow-Arrow, and is a large part of why many others were able to survive. Thank you for your efforts and honesty with me in the field.


  Awarded by Col. Scraps-the-Copper on 9/20/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Ancient Praetorian (GIB-849) is awarded the Royal jelly of slaughter: 'As an praetorian sister, managed to hold the line while the queen was dead, wiped many talls and embraced in an leader role when the queen had died, died as an hero, attacking perch and killing may talls with their death.' by Elder Queen (XO)

  Prime Boiler (ARL-782) is awarded the Royal jelly of slaughter: 'As an Boiler sister, managed to hold off the talls long enough till they had no resilience, her presence today resulted in an impressive victory, her deeds will not be forgotten.' by Elder Queen (XO)

  Elder Praetorian (DE-190-AD) is awarded the Royal jelly of resilience: 'As an valkryie praetorian, managed to do an great work in the backlines, wiping mutiple talls and saving many sisters, her work definetly resulted in our victory today.' by Elder Queen (XO)

  Elder Carrier (CMT-331) is awarded the Royal jelly of proliferation: 'As an carrier sister, stood in guard for captures for an long time, trapping the frontlines resulting in mass captures while working with our T3, she did an great work today!!' by Elder Queen (XO)

  Ancient Drone (REH-573) is awarded the Royal jelly of rejuvenation: 'As an backlining healer drone, managed to aid the backlining T3 team in encircling and wiping the talls, saving mutiple sisters today.' by Elder Queen (XO)




