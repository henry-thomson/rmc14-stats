roundEndText: >2-

  As the insurgency that laid claim to Solaris Ridge now lies dead on the red soil of the colony, a single Sun Rider still lives on.


  The official mission report has a big M.I.A. stamped next to their name, they were never found after a recovery team was sent for the wreckage of the UNS Endeavour after the AA guns blew it to shreds.


  But deep down, the UNMC knows where they went.




