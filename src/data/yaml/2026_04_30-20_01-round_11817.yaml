roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Kalami, Buster 'Geezer' Alter, Arioch 'Phoenix' Arcalis, Zoey 'Killer' Grimshaw, Bugs 'Paperboy' Swedersson, Lyla Su Barrett, Butch Ratcliff.



  Royal Jelly Awards:

  Young Drone (IT-790) is awarded the Royal jelly of rejuvenation: 'By growth and by weed, by fruit and by resin...you are the gardnder.

  You toils and tribulations have supported our hive with your powers of cultivation and rejuvination. Despit your youth, and your releative inexperince in the arts of the garden, you have done well this day. At the reconmdation of multipe sisters, i award you this jelly of rejuvination, for your excllent preformance  and services to the hive.


  REJOICE!' by Immature Queen (CMP)

  Ancient Praetorian (MIA-161) is awarded the Royal jelly of resilience: 'By effort you hunt, by instinct you kill, by skill you survive. You are the dance, the whisper on the wind. From what has been told, you caputred many talls in the effort to this war, returning again and again, despite the troubles and tribulations Dancers face, you prevailed through all of them, and proved to be an excellent member of the hive.


  For your efforts, and services to your sisters, i give you this jelly of resliance' by Immature Queen (CMP)

  Ancient Drone (VA-725-LK) is awarded the Royal jelly of resilience: 'You are our savior, you are the guardian. You are the shield that protects sisters through all the talls have to throw against us. Your service as a Valkyrie was excellent this war. Destorying many of the Mounted spitters, preventing many deaths from sisters. You also caputred the dangerous Special Fire Walker tall, an amazing contribution to the hive. For your efforts, i give you this jelly.


  REJOICE!' by Ancient Queen (CMP)




