roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Kray 'Peckish' Yonn.



  Medal Awards:

  Juno 'Kleptocat' Kaneko is awarded the Distinguished conduct medal: 'Simply an outstanding CAS pilot today. Never stopped giving crucial information to CIC and the marines, slew many bugs with their rockets and lasers.

  You have certainly earned your wings.'

  Ruka is awarded the Bronze heart medal: 'Ruka fearlessly took on the deadly duty of the scout specialist today. With cunning and precision, she slew a sizable number of bugs as they attempted to harass and kidnap our marines from the backlines. This effort with no doubt in my mind saved many of us today from a gruesome fate.

  It is with great shame that we could not save you from the fate you saved many others from.'



  Royal Jelly Awards:

  Ancient Praetorian (NI-738-KI) is awarded the Royal jelly of slaughter: 'STAYED ALIVE FOR 3 HOURS. WAS CRUCIAL. SAVED MY LIFE. KILLED MANY. CAPPED EVEN MORE' by Elder Queen (WAR)




