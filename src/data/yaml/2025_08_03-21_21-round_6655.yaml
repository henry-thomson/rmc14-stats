  Medal Awards:

  Bravely-Runs is awarded the Distinguished  conduct medal: 'Second Lieutenant Bravely-Runs perfectly coordinated with CIC during a critical moment, collapsing a tunnel that would be otherwise used by the XX-121 Xenonid Queen to escape from the encirclement with the sole aid from Lance Corporal Nya Fireheart.'

