  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Dru 'Misinput' Keller, Matthew 'Skidmark' Fields.



  Royal Jelly Awards:

  Elder Hivelord (OO-895-O) is awarded the Royal jelly of rejuvenation: 'your build was amazing and i admire very much all the work you dedicated to the hive. despite you being a very silly sister, i love you very much my darling, and thank you for all your work.' by Prime Queen (RP)

  Mature Defender (FOP-124) is awarded the Royal jelly of rejuvenation: 'thank you for leading our beautiful build team. you were amazing, and you made attrition so strong, i am so proud of you!! thank you for being my daughter today.' by Prime Queen (RP)

  Prime Hivelord (VY-844-NL) is awarded the Royal jelly of rejuvenation: 'your building was impeccable as always. you did an amazing job and i love you very much, you are the greatest teacherr of them all, you deserve all love my sweet purple horse-elephant.' by Prime Queen (RP)

  Prime Ravager (NEV-632) is awarded the Royal jelly of slaughter: 'thank you for trying your best in this horrible hive invasion. i hope your spirit keeps as loyal and fierce as ever. i love you my twin sister!!' by Prime Queen (RP)




