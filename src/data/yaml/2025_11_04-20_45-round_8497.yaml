roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Razor Petrecov, Emiko AW Kaiten, Vex Korrin, Tchekhov Boris, Luanne Greenawalker, Feyrick Slate, Markus Volt, Sam 'Turret' Kuster, Uzame Lajin, Alexia 'Sleepyhead' Trainer, Cinder Eikuni, Johnny Bloodforge, Tye Russell, Licks-the-Ground.



  Royal Jelly Awards:

  Ancient Praetorian (YIP-643) is awarded the Royal jelly of resilience: 'One of the few T3 who have survived since mother was reborn - this sister not only stalled the talls when they were the only surving preatorian. They also guided and held the reactor entrances preventing the tall advance while mother secured critical captures. Bravo!' by Ancient Queen (ARG)

  Mature Crusher (BA-758-LD) is awarded the Royal jelly of slaughter: 'One of the few surviving T3 while mother was reborn. Against all odds this sister held the frontline against the full might of the talls invasion. Without there charges we would not have been able to recover from the tall advance. There skills as a chrusher are much to marvel. Bravo!' by Ancient Queen (ARG)

  Ancient Boiler (BEL-779) is awarded the Royal jelly of resilience: 'A critical part of our success today - without needing instruction this boiler always knew the right place to be, the right boil to send. There cover was perfect, there acid deadly. I am in awe of your success today. The whole hive has you to thank for our salvation.' by Ancient Queen (ARG)

  Prime Hivelord (ZAO-878) is awarded the Royal jelly of resilience: 'This hivelord constantly built and re-enforced the backline. They supported sisters in encircling the talls and earned the admiration of many of their peers. Without there efforts today would not have been possible. Bravo!' by Ancient Queen (ARG)

  Young Carrier (JAM-402) is awarded the Royal jelly of proliferation: 'This carrier was nominated by the hive for always being on hand for captures. Be it egg placement for quick captures, or securing captures from combat sisters. Without there efforts today would not have been possible.' by Ancient Queen (ARG)




