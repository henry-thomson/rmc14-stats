roundEndText: >2-

  An exercise in futility. 12 marines dead and for naught, The Bio Titan lives and is slowly corrupting the planet. The Sun Riders took some heavy losses, friends and family alike. They will be remembered in the coming years. Eventually forgotten and faded into obscurity.


  In memoriam of our fallen soldiers:

  The Manifestation of Fortune, Spiro Velox, Elric Briggs, Tim 'Overload' Tilton, Chee 'Pressure' Mach, Sofia Addison, Beace Poppers, Lexicyr 'Hasty' Zhisefin.





