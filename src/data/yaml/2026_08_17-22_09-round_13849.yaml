roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Randy 'Raghetti' Rodrigues, Iris 'Firemoth' Softcoat, Aliyah Aliapoh, Estrid Kanin.



  Medal Awards:

  Corporal Allison 'Texas' Church is awarded the Medal of valor: 'Corporal Church you lead Bravo Squad through one of the roughest postition I have seen. Over half your squad was gone, most of your CTs were gone, and most of leadership save for you. Yet you perceivered through all of this, you help rebuild FOB and help secure it against further attacks. Your efforts today was massive and your dedication was not missed.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Private First Class Myra Crux is awarded the Distinguished conduct medal: 'Private First Class Crux you were the last remaining CT for Bravo after the massive losts they took. You are well and truly early into your career, but you work today was something that many would struggle to met. Your work was everything we needed and them some.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





