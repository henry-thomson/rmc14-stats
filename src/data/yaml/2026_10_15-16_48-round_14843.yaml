  Young Carrier (NI-390-K) is awarded the Royal jelly of rejuvenation: 'During the battle of LV 624 you made a ravager get back up from critical condition west of research, during the time you were a gardener. For quick thinking you saved them, and provided them a 2nd chance rejoice!' by Prime Queen (PRO)




