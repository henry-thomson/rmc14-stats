roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Hams Kuro, Faust Aschenbrener, Azar 'Sun' Silktongue, Diana Ciccone.



  Medal Awards:

  Mizooki 'PillBug' Akiya is awarded the Medal of valor: 'For an Outstanding show of skill with your ATL. you devestated the horde of the xeno menace before my very eyes. your momentum made sure we never were on the back foot. and even firing your weapon point blank at the risk of your own life


  Awarded by Maj. Tyr Ragnarson on 12/04/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



