  Colton Freewall, Maximus 'Max' Espinosa, Ash 'Silly' Winter.



  Royal Jelly Awards:

  Ancient Ravager (CHO-943) is awarded the Royal jelly of resilience: 'During the time of need when I needed a shield you push through and did what was required.


  Your sacrifice was noted your intent was rewarded.


  Well done Ravager.' by Prime Queen (PRO)

  Ancient Defender (ARG-450) is awarded the Royal jelly of sabotage: 'For grabbing onto the tuber when I screamed north east of dyna, you removed a threat that I required to be removed for the late stages of the battle. Which of course was tremendous I thank you for doing a great job!' by Prime Queen (PRO)

  Young Drone (BI-537-L) is awarded the Royal jelly of proliferation: 'For eagerly doing your best in building for the hive, coming back multiple times to serve the hive in resin.


  You have built many things, I hope you enjoy each an every placement of walls.


  I say for a young mind you did a pretty great job, just be more careful around tall lurkers.


  Now Rejoice!!!' by Prime Queen (PRO)




