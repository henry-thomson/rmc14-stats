roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Light Fudge, Crystal 'Overdose' Mens, Gregory 'Talisman' Dawkes, Salamandross, Nakuma 'Merry-Merry' Wusha, Adrian Fibermann, Jeffery 'Cowboy' Davis, Duke Zimmer, Thomas 'Falcon' Falk, Voss, Ezra Davis, Ruby Indus, Miguel Delpontes, Kayleigh Hill.



  Royal Jelly Awards:

  Young Praetorian (EI-118) is awarded the Royal jelly of resilience: 'For being a first time hive leader, at least for me.


  Doing a wonderful job in ensuring the survival of the hive, and following orders perfectly, you set a great path forward for others to follow. I hope to see more of this, and hopefully you get stronger as time goes by.' by Prime Queen (PRO)

  Hivelord (TE-47-N) is awarded the Royal jelly of proliferation: 'For building walls after walls, there was no limit for you, you built as much as you could and ensuring that the hive prosper with your structures, I am happy with the results you made for the hive. as we utilized every wall that was placed in the talls path.


  Rejoice!' by Prime Queen (PRO)




