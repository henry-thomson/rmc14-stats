roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Nali Silkpaw, Morgan Buzzard, Jeff Dots, Alex 'Charcoal' Vognenko, Xexaeq Xeqquex, Rein 'Red Hood' Rosenthal, Hisses-At-Inconvenience, Shehs-Usheeja, Kexuq Xeaeq, Hareeya-Lan, Cassian Shaner, Myriam Atweeke, Renala, Falena Nighteyes, Yuki 'The Cat' Suzuki, Sharp Button, Lucien Octavius Morel, Ryan 'Grenade Eater' Ironsmith, Ashlynn Duval, Caela Cloudfeather, Allen Diaz, Bison 'Albatross' Briggs, Archibald 'Ripcord' Butterfill, Otumeel-Azeel, Netta, Beace Poppers, Leonard 'Breacher' State, Emilia Rhodesion, Xyto Availia, Orbits-The-Squad, Betularia Temnora, Kobeni Pavlova, Drakun Solvador, Primm 'RustBolt' Harrison, Porto II, Cadence Coldsmith, The Aquifer of Cowardice, Alisha Greene, Andrew Bunten, Nate Turner, Seiho Whisper, Peyton Gadow, Peter 'Parabellum' Cencer, Lucian Reighner, The Rainforest of Activity, Jack Yiplop, Eats-The-Uranium, Shiloh White, Chase Mercer, Ainsley Koepple, Darrel Inaster, Frynzak 'Finn' Nytheis, Lobo Garneys.



  Medal Awards:

  Nao is awarded the Medal of valor: 'Saved many of their comrades in the line of duty, taking out over 20 xenonids as well as multiple SPP forces. This marine has done an absolute honor to the Second Company, and their efforts will not be forgotten from myself, nor their fellow Marines.'



  Royal Jelly Awards:

  Young Ravager (XO-491) is awarded the Royal jelly of slaughter: 'Our ravenger sister, though an extremely long fight, this sister continued to slaughter talls as a vampire lurker, surviving long enough to evolve into a ravenger. Without them we would not have been able to tackle the talls head on. There courage has won us this victory. Bravo' by Elder Queen (ARG)

  Elder Warrior (FI-638-SH) is awarded the Royal jelly of resilience: 'This sister was a critical leader in our battle against the talls, guiding mother - capturing many foolish lone talls and holding the line against the tall advance. Although they appeared late into the battle, there contribution was critical to our victory.' by Elder Queen (ARG)

  Young Hivelord (VE-985) is awarded the Royal jelly of resilience: 'This sister although young was given a critical mission to save the hive. When we were no greater than 6 sisters with no hive structures, this sister was ordered to venture alone to re-establish the hive. They alone sought out locations for hive structures and enabled us to continue to capture talls. Without there contribution and bravery the day would have been lost. This sister showed true courage. Bravo!' by Elder Queen (ARG)




