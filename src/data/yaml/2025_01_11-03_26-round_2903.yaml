  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Mature Praetorian (PV-932-C) is awarded the Royal jelly of rejuvenation: 'Providing nonstop support to me as I was demanding healing attention on the front line. Also was being really great at support as a warden when needed. Great job.' by Prime Queen (PRO-173)

  Elder Drone (BOR-978) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself to me, to keep me going on the front line, your sacrifice was not in vain, it help me get right back into the fight. Including being really great at healing all your sisters.' by Prime Queen (PRO-173)

  Mature Drone (NU-106) is awarded the Royal jelly of rejuvenation: 'You were able to provide a great amount healing during this battle, even able to fill up to the max of your purple reserve. You did wonderful in healing all your sisters. Great job.' by Prime Queen (PRO-173)

  Mature Hivelord (SPR-249) is awarded the Royal jelly of proliferation: 'For your hard effort, even after death you were one of the hivelords that I remember since the beginning. I want to say thank you for building the hive in great condition. Highly appreciated.' by Prime Queen (PRO-173)

  Young Crusher (HV-73-D) is awarded the Royal jelly of resilience: 'For your resilience on being able to tank so much spit since the beginning to end. You were found profoundly useful in the war as you were able to deny saves from the talls, and was a great shield for' by Prime Queen (PRO-173)




