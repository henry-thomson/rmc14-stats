roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Ravager (RP-286) is awarded the Royal jelly of sabotage: 'Since the beginning you help out rush the planet talls, with me when I decided to break them myself.


  After of which you help save a couple of sisters in aero.


  Capture a Special pyromaniac tall during a scream I made against the red and purple caste mist of the carnage whom of which I believe would of caused me issues if never removed.


  Overall performance was satisfactory that benefit the hive greatly, thank you.' by Prime Queen (PRO)

  Young Hivelord (FT-399) is awarded the Royal jelly of proliferation: 'For being one of our hivelord during the beginning of the hive, I saw you working eagerly at junk yard preparing our defenses when we needed it greatly, and working at other areas when ordered, you built up pretty much most of our defenses, with my help during the first 15 minutes of the hive.




  I also want to state you will be a great hivelord one day in the future, that I think you will get the learning curve down eventually, even though you were a first timer in probably leading your sisters.

  you still hold great potential, thank you for working hard for the hive my young hivelord.' by Prime Queen (PRO)




