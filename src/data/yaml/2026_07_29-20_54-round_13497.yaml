roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Chews-the-Wires, Runnie 'Ruckus' Roach.



  Royal Jelly Awards:

  Elder Ravager (JE-554-PH) is awarded the Royal jelly of resilience: 'For sacrificing yourself for the destruction of the metal beast early on in the battle, south of scrub land, sadly you took the entire force of the spit for the hive which led to your death however, thanks to you tanking and shielding we were able to dish enough damage to the metal beast to render it inoperable, making it never to function to harm us ever again. Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (LOL-770) is awarded the Royal jelly of resilience: 'When I got tubed north of botany bridge, you were able to shield me just in the nick of time, to where no more harm would be done to me. Thanks to that I am still alive to give you this jelly and continue my conquest against these talls! I thank you for doing what was necessary for the hive Rejoice!' by Prime Queen (PRO)




