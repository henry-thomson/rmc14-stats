roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Vinezeta, Crimson Marcotte, Nicole Slaw, Stankashi Neuer, Danielle Sparks, Commet 'flame' Brown, The Plateau of Opportunity, Derrick Ellis, Layla Hawkins, Mariso Mightspire, Chalish-Pojeel, Gary Ourple, Vladimir Zvezdochet, Willow Bunner, Cries-Of-Void, Jackson Bishop, Klein Moretti, Chaos Willow, Slowy Garrison, Gilbert Turnip, Marz-Zollassa, Bennett Mortland, Mike 'Giggles' Baynton, Titus Gregory, Aaron Hawker, Moses Blyant, John Smith.



  Medal Awards:

  Icey Iana is awarded the Distinguished conduct medal: 'For stepping into command after the loss of the squad leader and leading with confidence and effectiveness. Her initiative and steady guidance carried the mission forward with flying colors.


  Awarded by Col. Freya Locke on 12/01/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juan Cortez is awarded the Distinguished conduct medal: 'For delivering effective close air support and providing timely, valuable intelligence to ground forces. during operation Project Canned-Staple on Shivas Showball.


  Awarded by Col. Freya Locke on 12/01/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Mona Wolfe is awarded the Distinguished conduct medal: 'For steadfast support on the front line, assisting fellow marines and eliminating numerous Xenonids in direct combat. She contributed greatly to the strength and success of the advance.


  Awarded by Col. Freya Locke on 12/01/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





