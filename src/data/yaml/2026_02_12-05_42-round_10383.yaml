  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Cecelia Rouzet, Gerald Raymond, Clukay 'Heckler' Koch, Dylan Constantinus, Nora Vera, Forks-the-Outlet, Bailey.



  Royal Jelly Awards:

  Elder Drone (KT-248-Y) is awarded the Royal jelly of resilience: 'During a certain engagement when the tuber has fallen infront of me, you stood firm and followed a direct vital shielding to me when needed the most when you were a defender, you have shown great fortification and commitment regardless of what happened to you, I just want you to know personally you did amazing.


  I hope see you grow even more stronger in the future, rejoice!' by Prime Queen (PRO)

  Mature Praetorian (HEK-414) is awarded the Royal jelly of rejuvenation: 'During the time entire battle beginning to end, thick and thin.

  No matter the danger, no matter the threat. You led your sisters to battle. You kept a solid ground in ensuring sisters were coordinated you have done well.' by Prime Queen (PRO)




