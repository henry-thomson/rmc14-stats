roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Burg Slendall, Argy Navus, Troy Humphries, Morticia Finn, Lardbeard, The Orchid of Neutrality.



  Medal Awards:

  Sergeant Buck 'Pretty' Tern is awarded the Distinguished conduct medal: 'While serving as a Fireteam Leader during Detour Hotel-Salt, performed with exceptional courage and unyielding aggression, saving their Squad Leader from a Xenonid warrior attack during a crucial stage of the operation. Your overall conduct during this mission reflected great credit upon yourself, and upheld the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature

  Sergeant Aurora 'Birdcage' Lockheart is awarded the Medal of valor: 'While serving as a Fireteam Leader during Detour Hotel-Salt, performed a high-stakes rescue operation to save a civilian correspondent captured by a Xenonid hive in east caves at great risk to her own life and limb. Your actions reflect great credit upon yourself and upheld the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature

  Second Lieutenant Kaede Leper is awarded the Distinguished conduct medal: 'While serving as the Chief Medical Officer during Detour Hotel-Salt, trained five nurses in medical procedure during the live operation, while still conducting their duties appropriately. Your endurance and commitment to the cause reflects great credit upon yourself and upholds the highest traditions of the UN Marine Corps.' by Lieutenant Colonel The Force of Nature





  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



