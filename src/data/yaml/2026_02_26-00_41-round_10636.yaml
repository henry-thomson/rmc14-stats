roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vesi Lioren, Joe Wozeman, Amya Hunter, Nosuni, unknown, Iku 'Stumbler' Reynoz.



  Royal Jelly Awards:

  Mature Praetorian (RA-705-G) is awarded the Royal jelly of rejuvenation: 'You are our shield, you are our guardian, you the valkyrie. Every watchful, ever stalwert, ever keen on the salvation of sisters in mortal peril.....for your efforts in the protection of at risk sisters in the delay team, and for the many times you saved sisters in the battle for deep sec, i award you this jelly of rejuvnation


  Rejoice, and stand tall!' by Ancient Queen (CMP)

  Young Ravager (BA-877-KA) is awarded the Royal jelly of resilience: 'With claws, you kill. With tail, you terminate. With instinct, you hunt....But those instincts this war were instead turned to  leadership, and strategey! Your intiative, and leadership of the delay team this war enabled me to direct attnetion to other matters, allowing me to coral talls to where they need to be. For your efforts in this war, i give you this jelly.


  Rejoice, and stand tall!' by Ancient Queen (CMP)

  Young Boiler (WA-587-A) is awarded the Royal jelly of slaughter: 'With acid, you attack. With neruo, you neutralize. With boil, you battle...you are our boiler. In the battle for deep sec, your well perfectly placed boiler shots took down multitudes of talls. This snowballed into an eventual tall rout, and our victory this day. Rejoice, our victory is thanks to you.' by Ancient Queen (CMP)

  Elder Drone (FS-384-H) is awarded the Royal jelly of rejuvenation: 'A drones tasks and labors are hard and fatiguing...and yet you did one of the dullest with narry a complaint! Thanks to your crucial support of the build team, the various hivelords were enabled to utterly trap the talls into a death trap of despair! For your dedication to the build team, on behest of the build team, i give you this jelly.


  Rejoice, and stand tall!' by Ancient Queen (CMP)




