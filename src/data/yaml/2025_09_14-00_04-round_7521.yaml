roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Tyro-Ta, Jeff Dots, Oliver 'Olives' Robertson, Angela Whittier, Big Cheddar, Secures-The-Bag, Jack Cuban, Sanne 'Greenie' Weiss, Anya Popov, Steven Aces Aggley, William Morris, Sadie Sims, Rocco Hunter, Runo, Dorothy Beck, Slowy Garrison, Clara Medeor, Bohn 'Zombie' Griff, Marsha Aegir, Huer Menser, Shakes-The-Friendlies, Molto Quibbles, Vash 'AW' Revolver.



  Medal Awards:

  Iris 'Silkweave' Voltia-Softcoat is awarded the Distinguished conduct medal: 'As per recommendation of their peers, Iris Softcoat took upon the mantle of being the operation's mortar operator and performed excellent. Among their feats include multiple confirmed kills, and thwarting movements with incendiary shells.


  Awarded by Col. Scraps-the-Copper on 9/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Hokey Pinkwing is awarded the Distinguished conduct medal: 'This medal goes out to a new combat technician who performed well, as per recommendation of their peers. Private First Class Hokey shows great potential in their career.


  Awarded by Col. Scraps-the-Copper on 9/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ne'Zun  ''GhostLine'' is awarded the Distinguished conduct medal: 'As per recommendation of the XO, I commend you for distinguishd conduct. Another stalward performance in the field of leadership. Time and time again, I give you orders that prove to be quite the challenge, and you manage to curb your marines killer instinct to get the job done.


  Awarded by Col. Scraps-the-Copper on 9/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Nyx Sparkdrawn is awarded the Distinguished conduct medal: 'As per recommendation of the XO, I commend you for your efforts. Working hand-in-hand with Gunnery Sergeant Ne'Zun, you kept the salty dogs of Delta well organized, well supplied, and focused on the task at hand. Delta's orders were pivotal to this operation, and they were done perfectly.


  Awarded by Col. Scraps-the-Copper on 9/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





