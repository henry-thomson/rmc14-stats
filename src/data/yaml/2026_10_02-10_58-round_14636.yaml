roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nahami.



  Royal Jelly Awards:

  Young Praetorian (PE-829-Q) is awarded the Royal jelly of proliferation: 'Today you've impressed your sisters and your mother, your valient fight and pulling talls in helped us greatly in this dire battle against the talls. And for that i shall reward you with the jelly of Proliferation Rejoice! i hope to see more of your strengths!' by Elder Queen (ASH)

  Mature Hivelord (BA-392-C) is awarded the Royal jelly of proliferation: 'With your hard work and building, you ensured that we have cover, safety and most importantly a Home. and with that i shall bestow you the jelly of Proliferation. Rejoice! i hope to see more of your beautiful build!' by Elder Queen (ASH)

  Mature Burrower (TRP-244) is awarded the Royal jelly of sabotage: 'Your hard work today making many deadly acid traps helped us kill many talls and capture many as well along the way of this long rough fight. You've shown what a dedecated burrowed at hand is like and every tall who'm face you in your future will tremble before your acid traps and existance. You will recieve the jelly of Sabotage. Rejoice!! i hope to see more of your deadly traps in the future!' by Elder Queen (ASH)




