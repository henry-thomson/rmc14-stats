roundEndText: >2-

  [bold][color=orange]Weston[/color]-[color=darkgreen]Yamada[/color] Internal Memo[/head]

  [bold][color=red]DO NOT DISTRIBUTE[/color][/bold]

  [italic]Regarding the attack on LV-1413 (Routerra I)[/head]


  This past week, insurgent forces in the area of Solaris Ridge conducted a hostile attack on company facilities. The result was significant loss of company personnel and assets in the region, including the UNCSS Haurchefant with all hands.


  An internal investigation is being conducted into the events that allowed such an attack to succeed. We are committed to redoubling the strength of our security forces to ensure this does not happen again.


  Due to public perception and a significant loss in security forces operating capability, a total withdrawal from the planet is being considered at this time. Further operations in the region do not appear tenable considering the severe danger to company resources. Standby for updates in the coming days.


  [color=darkgreen][bold]CLF Major Victory![/head]





  [bold]Operation funded by [color=green]Lilith's Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
