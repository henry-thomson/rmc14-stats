roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Keegan 'Preacher' Rockwell, Riley 'Tilter' Stone.



  Royal Jelly Awards:

  Young Defender (ID-429) is awarded the Royal jelly of resilience: 'When you were a praetorian, you stride through the open fields with me and did your absolute best, pushing recklessly through fire and harm way as I did, you shined through but sadly your death came eventually from the skyspit at B-Ball Eastern Side, however look back and keep up that same behavior even through recklessness there is resolve!


  Rejoice!' by Prime Queen (PRO)

  Mature Defender (BO-266-B) is awarded the Royal jelly of resilience: 'Making genuine effort at the front line as a runner, you committed through even the hardest environment for such a frail body you once had, you made about 3 captures for the hive, which is great work even in big hives such as this.


  I foresee thousands more captures from you young mind, may you prosper!


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (PI-106-N) is awarded the Royal jelly of proliferation: 'I wanted to go ahead and tell you that your work was really profound to watch from my queen eye during early moments you kept asking for plasma transfers every single moment, no time was wasted, and I even bet you were working as eagerly as you were alive throughout this entire battle. This is definitive reason you are given this jelly for being one of our original hard working builders till now.


  I thank you for setting up defenses where it was witnessed, albeit not all but effort was the most of what you recall upon, and I hope your effort was something you enjoyed.


  remember, to never let nobody shun your efforts, as you were a true hivelord till the end! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



