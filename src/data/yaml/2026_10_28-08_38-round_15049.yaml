roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Apollo Nagant.



  Royal Jelly Awards:

  Prime Hivelord (MAT-674) is awarded the Royal jelly of sabotage: 'MAT, your constant building and captures of the talls led to many of our hive growing. For this, I am eternally grateful. Rejoice, for without you, the hive would've suffered more!' by Elder Queen (OWL)

  Mature Sentinel (AIN-506) is awarded the Royal jelly of rejuvenation: 'AIN, your dedication to keep me and your sisters alive has been noted, and for that, I am grateful. You ultimately ended up sacrficing your life so that I may live and escape. Rejoice!! Your efforts have not gone unoticed.' by Elder Queen (OWL)

  Elder Sentinel (KY-713-LE) is awarded the Royal jelly of proliferation: 'KYLE, without you, the hive would not have captured as many talls. With your help, it eventually led to the talls leaving and the hive growing! Rejoice! For your efforts have not gone unnoticed!' by Elder Queen (OWL)




  [bold]Operation funded by [color=green]Lilith's Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Bustuh 'Geezuh' Altuh[/color]![/bold]
