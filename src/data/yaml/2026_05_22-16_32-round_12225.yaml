roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hugo Knapenberger, Gambit 'Wall-Eater' Stargazer.



  Royal Jelly Awards:

  Ancient Praetorian (FLO-280) is awarded the Royal jelly of rejuvenation: 'FLO, you have saved my life this day, if not for you, me and alot of your sisters would've died. You have shielded them from harm, provided them with your warding pheromones, your tantrums and screams.


  You have done a great deal for this hive, and for this, I award you this jelly. Good work!


  See you in the next hive!' by Ancient Queen (NEV)

  Young Carrier (STR-369) is awarded the Royal jelly of proliferation: 'STR, you have done a great deal for this hive. You have helped secure many captures by providing us with the children you have carried around all day, helping us assimilate these weak talls into our great hive.


  For this, I award you this jelly of proliferation. I am proud of you.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Hivelord (VYN-866) is awarded the Royal jelly of proliferation: 'VYN, I have heard of your great work. You and the build team have built a great amount of resin for our hive, providing cover and safety against the talls. I have also heard you have helped out a young designer today, a great thing to hear.


  For your great work today, I award you this jelly to show you my gratitude.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
