roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  The Spruce of Calmness, Oliver 'Rolling' Stone, Edouard 'Butter' Jenkins, Nyla Bashline, Zoey 'Killer' Grimshaw, Ash Lightweaver, Oliver 'Oil' Robertson, Nakuma 'Merry-Merry' Wusha, Tessa Baker, Ollie Lamplight.



  Royal Jelly Awards:

  Ancient Hivelord (RO-599-SA) is awarded the Royal jelly of proliferation: 'For building for so long, and tedious back and forth against the talls I bestow you this great jelly of proliferation.


  For your outstanding performance! you were one of our main builders since the beginning


  Alot of back and forth and continous effort was made by your own very claws.


  Be proud hivelord, you may rest.' by Prime Queen (PRO)

  Ancient Praetorian (KR-866-IS) is awarded the Royal jelly of resilience: 'You did an outstanding job as our valk, the talls were bent on the erasure of the entire hive, but you stood firm against the endless march of talls attacks.


  You made multiple captures, and many engagements with the hive.


  You took thousands of spit and survive until...


  You were sadly killed at administration, but your effort was not in vain. Thank you for making those honorable memories, they will be forever noted in the hivemind.


  Rejoice!' by Prime Queen (PRO)




