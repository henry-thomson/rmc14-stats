roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Paduxi-Utamukeeus.



  Medal Awards:

  Gunnery Sergeant Altair 'Christmas' Nightwish is awarded the Medal of exceptional heroism: 'For exemplary valour, dedication to duty, and leadership under extreme duress. Gunnery Sergeant Nightwish led their squad while simultaneously coordinating with armoured units and the CIC. Their efforts today blunted many counterattacks and probes, allowing for a quick and effective end to the operation. A shining example of what it means to be a marine, and a soldier whose performance under fire continues to impress.


  Awarded by LtCol. Clyde McKinney on 19/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





