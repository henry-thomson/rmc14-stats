roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bejeen-Tar, Sason Minutissima, Liberty AW Falchion, Absurdist-by-Nature, Miguel Delpontes, Natalye 'Cyclops' Thompson, Minerva AW Nunchucks, unknown, unknown, unknown.



  Royal Jelly Awards:

  Prime Praetorian (YIP-477) is awarded the Royal jelly of proliferation: 'YIP was our sister that captured many talls, granting us 17 larvas. I want to award them for their effort and results, that certainly made our victory.


  Rejoice my daughter, may your hook be eternal!!' by Prime Queen (RP)

  Young Boiler (LO-524-S) is awarded the Royal jelly of sabotage: 'LOS was our boiler sister who evolved right in time to be able to hold off caves and make our hive survive.


  Rejoice my daughter!! May your holds be eternal!!' by Prime Queen (RP)

  Elder Warrior (ARG-362) is awarded the Royal jelly of slaughter: 'For their great effort as a leader both as a backline warrior leader and as Queen while i wasn't able, I want to reward you with this jelly of slaughter for the many talls that fell to your claws in backline.


  Rejoice my daughter!! May your joy be eternal!!' by Prime Queen (RP)

  Ancient Praetorian (ALT-503) is awarded the Royal jelly of slaughter: 'For your great leaderance in the backline as a Warrior, i award you with this slaughter jelly for the talls that died due your deeds.


  Rejoice my daughter!! May your graveyards be eternal!!' by Prime Queen (RP)




