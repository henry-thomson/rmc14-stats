roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Zhyara Vaelora, Wilco Whittaker, Duke Stone, Juniper 'Clownfish' Burger, Jonas Kemble, Kingcade Jackson, Jeff 'poison' Leggings, Jensov Kellogg.



  Royal Jelly Awards:

  Elder Praetorian (FAE-207) is awarded the Royal jelly of rejuvenation: 'FAE, today you managed to save YIP from certain death. The tuber got a moment on YIP but that moment was taken away by your mighty scream.


  Together with RAD you have managed to save our hive and made us claim victory this day. Keep staying with your queen to always make sure our hive prospers.


  YIP!!' by Ancient Queen (YIP)

  Elder Boiler (RAD-927) is awarded the Royal jelly of resilience: 'RAD, today you proved the power of not your caste but your reaction and tactical thinking. You managed to work together with FAE to cover YIP in a moment of weakness to the tuber.


  You two managed to hold off the tuber long enough for YIP to escape certain death. Your bravery is commendable.


  Not only did you perform this hive saving action, you also managed to keep the talls back for most of the fight, making sure they didn't push too far ahead while YIP was in ovi.


  YIP!!' by Ancient Queen (YIP)




  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
