roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Quebulin, Ewari-Diaz, Azric Steele, Mike Fields, Pulls-The-Pins.



  Royal Jelly Awards:

  Prime Drone (DU-902-CK) is awarded the Royal jelly of rejuvenation: 'My dear prime drone duck

  I decided to give you this jelly of rejuvination for what youve done for me at the start of our fight with the talls

  Deciding to rush the planet hosts immiedately I was nearly killed by one of them, you have sacrificed yourself for me

  Without you we truly would have not won this fight

  Later on youve pursued the life of a healer even more, saving more and more sisters, I am very proud of you

  I am very glad to have had you here with me I love you

  -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Mature Runner (TI-755-BS) is awarded the Royal jelly of proliferation: 'My dear daughter TI-BS

  Even though you are a runner now, you once were a carrier!

  A great one, even

  I give you the jelly of proliferation because you were one of our only carriers, and our only eggsac carrier

  You were the deciding factor of our victory today as you have allowed us to infect the talls immiedately after theyve been captured

  You have also assited nev in her oppressor career allowing her to make an impact in this fight

  I am truly grateful for you today, I love you my daughter

  -- Ancient Queen SQSH' by Ancient Queen (SQSH)




