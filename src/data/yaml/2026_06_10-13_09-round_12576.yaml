  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joshua Lee, Talia 'Lifesaver' Deneuve.



  Royal Jelly Awards:

  Mature Hivelord (CA-318-T) is awarded the Royal jelly of resilience: 'CA-T, when the resin was cracked and tattered by the evil clutches of the talls you rised. You took one drone and commanded them to build, you took in the resin theory and more and made our great hive thrive again within your walls and doors. You alone did this with your leadership, so I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)




