roundEndText: >2-

  Evacuation of Hybrisa

  Log 3983-71


  UNMC allies within the area made a emergency recovery at a local establishment called "Bambino's Grill" or something similar. Recovered upwards of 20 civilians and members of public safety who ended up trapped at the location during evacuations.


  It is unknown why these workers were still present, as Mr. Bambino himself has not been found after the evacuation, and is presumed deceased.


  Workers have stated and I quote "I don't know man, but 15 grand for 5 hours of work might not have been worth it."




  [bold]Operation funded by [color=green]Chief Culinary Officer[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
