roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Azmon-Simos, Than Medeas, Polishes-the-Boots, Scrams-Right-In, Tony Chopper, Aurora 'Birdcage' Lockheart.



  Royal Jelly Awards:

  Mature Hivelord (FUR-240) is awarded the Royal jelly of resilience: 'A designer of grand hives, this daughter, building from the start showed wisdom and determination beyond her years. Leading the build team, she has been building from the very start of our hive. Through two mothers she has dedicated herself to her craft. When a critical moment in the battle arrose, she built resin on the talls flank, preventing an escape. Thanks to her efforts the day was won. Rejoice!' by Prime Queen (ARG)

  Young Drone (DO-537) is awarded the Royal jelly of proliferation: 'This daughter has distinguished herself, giving her life for her sisters, not once, not twice, but three times! She sacraficed her life for her queen at a critical moment when no other daughter reacted. Singlehandedly she prevented an untimely demise of our hive. We thank you for your repeated sacrafices. Bravo!' by Prime Queen (ARG)

  Young Ravager (IF-931-V) is awarded the Royal jelly of slaughter: 'Despite her young age, this daughter showed that she can slaughter talls like a prime Beserker. Diving into the tall ball again and again she cut down all the healer talls who opposed her. None could escape her claws this day. We look forward to seeing the prime you will become! Rejoice!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
