roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Psilo Waverave, Crush Mcfall.



  Royal Jelly Awards:

  Ancient Warrior (WA-979-LL) is awarded the Royal jelly of proliferation: 'this sister is one of their kind, protecting other sisters with their body and also capturing in double digits during my screams... REJOICE!!!' by Ancient Queen (XX)

  Prime Ravager (CHO-935) is awarded the Royal jelly of proliferation: 'Sadly this sister is no longer with us. leaving us behind... but without capturing more sisters than the hive would ever need. protecting the hive to the end of her life.' by Ancient Queen (XX)

  Young Drone (RA-998-P) is awarded the Royal jelly of rejuvenation: 'this sister was supplying with endless fruits, helping me escape the slowness of long spit, healing other sisters with fruits and saving the hive... REJOICE!!!' by Ancient Queen (XX)

  Young Drone (BO-196) is awarded the Royal jelly of rejuvenation: 'this sister used their own health and plasma to heal fellow sisters. sacrificing themselves to hold the hive together. saving T3s and helping us get back to capping and combat faster' by Ancient Queen (XX)

  Mature Drone (LE-609-S) is awarded the Royal jelly of rejuvenation: 'this sister, despite being only a young mind healed me when i was about to die and healing many other sisters also. without them the hive would be rotting on the ground. A healer who gave us more than any T3 could... REJOICE!!!' by Ancient Queen (XX)




  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



  [bold]Hive established by [color=purple]Cocaine Accessories[/color]![/bold]
