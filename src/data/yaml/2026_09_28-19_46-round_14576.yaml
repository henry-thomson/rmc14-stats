roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  John Shepard, Cook Justin, Toa Flame, Joey Filmore, Droz 'pilot' Witt.



  Royal Jelly Awards:

  Young Boiler (OLD-328) is awarded the Royal jelly of slaughter: 'Today I've had many boilers. But none have shown themselves as helpful as you were today. Thanks to your useful sappers, traps and expertise on the battlefield. Many special and normal talls have been captured in your name. And for that Im giving you.. The jelly of slaughter! Rejoice for my star contestant! 


  From todays host:' by Queen (HOST)

  Prime Boiler (EH-359-HE) is awarded the Royal jelly of rejuvenation: 'EHHE. Today you've been working WITHOUT FAIL providing me endless boild where I needed them giving us cover, safety and captures on behalf of the hive. With this I grant you the title of todays STAR contestant AND give you the... JELLY OF REJUVINATION! REJOICE!!!' by Queen (HOST)

  Elder Ravager (LA-662-MB) is awarded the Royal jelly of slaughter: 'For the entirety of today, LAMB standing here before you has never, and I say NEVER left MY SIGHT. LAMB has been the most useful dragger, blocker and assistant of the hive. One you all could aspire to be. Their todays performance has exceded my expecatations from an elder. This star contestant has proven themselves over and over again earing them the grand price of the JELLY OF SLAUGTER!!' by Queen (HOST)

  Prime Runner (RO-418-UN) is awarded the Royal jelly of resilience: 'ROUN, You have been my star contestant. And the ONLY leader I've assigned. That is because I've trusted none of the other sisters more to lead this hive in my abscence more than YOU! Furthermore you have provided me with useful intel, captures and general help within the hive. And for that I grant you the grand price of the JELLY OF RESSILANCE! REJOICE!!' by Queen (HOST)




  [bold]Operation funded by [color=green]SireHambone[/color]![/bold]



