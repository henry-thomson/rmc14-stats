roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Silas Moonveil, Azinee-Sakeeus, Trebi Shivava.



  Medal Awards:

  Sergeant Selenops Sundaicum is awarded the Distinguished conduct medal: 'On the reccomendation of your partner on the field. witnessing you kill several high cast xenos. likely keeping the horde from fully wiping out the marines with the mere threat of your pressence.


  Awarded by Lt Col. Tyr Ragnarson on 02/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson



  Royal Jelly Awards:

  Elder Hivelord (EV-827-D) is awarded the Royal jelly of proliferation: 'For the creation of many structures for the hive, and building on the flanks on talls that allowed great manuvers to be possible.


  You also kept cohesion for your sisters for the builder caste whenever possible.


  you have done a genuine great job.


  Rejoice!' by Prime Queen (PRO)

  Young Defender (NC-635) is awarded the Royal jelly of resilience: 'During the beginning of the hive, you were the one who step up to lead your sisters in battle.


  After of which you help led wherver you could, and generally kept things as cohesive as possible.


  After your first death, you came back to lead once more!


  you then reattempt to keep to do your absolute best serving the hive to the best of your abilities, you shielded and commanded as much as you could.


  I am bestowing this jelly of resilience for your absolute resolve in pushing through and coming back for more combat against these talls, it always put a smile on my face to see a mine come back for round 2.


  Keep up the amazing work, may your carapace be stronger than metal resin, an may your carapace burn brighter than any fire!


  Rejoice!' by Prime Queen (PRO)

  Young Praetorian (BO-816-X) is awarded the Royal jelly of rejuvenation: 'For stepping up as hive leader when a hive leader fallen in combat. You stepping up was pretty vital, and actually a genuine good thing that I want to encourage as a behavior.


  I hope to see you lead more an keep cohesion altogether a time high whenever future queens lead.


  You never fail to disappoint your hive, rejoice!' by Prime Queen (PRO)

  Prime Praetorian (RAD-894) is awarded the Royal jelly of rejuvenation: 'For your amazing work in supporting the hive wherever you can, you kept continously melting green sticks, supporting the frontline, and helping with every rotation as you can. Even saving lives here and there.


  I think overall, you being prime example of an excellent valk, keep up the consistent work as usual RAD. Always great to see you have grown in your career as one of the main saviors of a hive.' by Prime Queen (PRO)

  Elder Praetorian (ARF-709) is awarded the Royal jelly of resilience: 'When a hiveleader fallen, you stood up to take their place. Such courage such genuine results you have made. You kept cohesion an made others follow my orders perfectly as you can.


  I enjoy seeing another leader be born amist of mines of the hivemind.


  I implore you to do more in the future, you actually did amazing, let nothing bring you down, always stand up high as you shine through every danger you were through.


  Ashame you did fall, but I will remember you, and so will others.

  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
