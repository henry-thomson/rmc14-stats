roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Bolete, Geel-Parash, Gudny Styrkulfur, Carl Mathews, Dale Hickory, John Heart, Ramona Linton, Brooke Adams, Expects-The-Unexpected, Lissette Beckman, Paul Peterson, Wynne Gunvaldsen, Cherry Rose, Callen Voss, Lorgosto ''Purple'' Coste, Rain 'Ruby' Tyler, Klein Moretti, Kris Gam'Belle, Willie McBright, Willie Manley, Svyatoslav Yevgenyevich, Zion Wheeler.



  Medal Awards:

  First Lieutenant Vinny Shick is awarded the Distinguished conduct medal: 'While I expect you at this point to do well in requestions and run it without a problem. There is merit in doing that and teaching a team of new recruits. You are a shining example of the corps. We are nothing without the next generation. So allow me to praise you this one time for a job well done raising that next generation. 


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Gunnery Sergeant Lucas 'Intern' Grayer is awarded the Distinguished conduct medal: 'Communicated well with requsitions and with his own squad to be able to establish a secure FOB and a secure supply network for the defence of the FOB. Led a team to help corner the hive. An example of a fob and leadership well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Lance Corporal Jessica 'Liberated' Brynley is awarded the Medal of exceptional heroism: 'Jess did not need me when the Queen pushed comms. She, alongside Bravo Fireteam Two, held against the horde with minimal firepower and forces, and killed the Queen. If it were not for her, and the efforts of our SGO Branch of Gentleness, this operation would've gone a lot differently. She won us today without a doubt. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Sergeant Eisenhorn 'Bug-Eater' Sedunn is awarded the Distinguished conduct medal: 'This marine gunner filled in as squad leader, keeping marine cohesion together perfectly, wonderful work befitting a Smart gun operator Sergeant. They led a large squad and led it well. I was worried about giving advanced orders a few times, but not only did they execute. They executed well. I look forward to seeing you promoted to squad lead one day. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





