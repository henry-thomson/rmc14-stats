  Ancient Praetorian (RMI-928) is awarded the Royal jelly of resilience: 'For your heroic sacrifice, on surviving all to the end as one of our last tier 3's, you did so much that I can't even describe how good you did. Without your effort in terms of damaging the tall horde' by Prime Queen (PRO-917)

