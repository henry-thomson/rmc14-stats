roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tiizmo, Julianne Eckhard, Emiko AW Kaiten, Ranii, Joshua Isaman, Luanne Greenawalker, Porter 'Porker' Keopple, Remilynn Scepie, Renault 'Ren' Demuth.



  Royal Jelly Awards:

  Elder Runner (XE-320-NO) is awarded the Royal jelly of slaughter: 'From ravager to runner, what a battle for you went through.


  After you gained enough acid to be utilized, you wiped the entire frontline, west of Evil eye, where it turned the tides massively. 


  Without your effort, I don't think the battle would of went so smoothly from before, thank you for your performance.


  Rejoice!' by Prime Queen (PRO)

  Prime Defender (JE-496-PH) is awarded the Royal jelly of proliferation: 'For being so eager to encircle talls, when they claimed evil eye, and was pushing heavily into reactors, you made a fine job ensuring it was possible.


  this led to some huge benefits from this, thank you.


  Rejoice!' by Prime Queen (PRO)

  Prime Drone (ARL-308) is awarded the Royal jelly of resilience: 'When you were once a boiler, you aided the frontline heavily by either stalling, or making it immenseful possible to destroy talls.

  at reactors, and I believe even helping wipe blue talls who trap themselves instantly.


  Overall, I think you were one of the main powerhouses we had this battle that ensured our victory. thank you for your performance, it is always awesome to have you ARL.' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



  [bold]Hive established by [color=purple]Ruby Hivey SIP.[/color]![/bold]
