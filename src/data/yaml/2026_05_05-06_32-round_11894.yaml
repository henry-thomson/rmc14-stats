roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  unknown, Ron 'Fluffy' Paxton, Ai 'Cornbread' Kokoro.



  Royal Jelly Awards:

  Mature Hivelord (OSO-103) is awarded the Royal jelly of proliferation: 'Since the beginning of the hive, you were one of the major surviving hivelords, you were doing most of the heavy lifting of building hive since the beginning. You were also one of our build leaders. I thank you, for pushing through every single minute. Every wall, every door, it had value in this hive. I hope to see you lead in the future, don't be afraid to take the wheels and go even further and beyond. I know you can always achieve if you try hard enough. 


  Rejoice!' by Prime Queen (PRO)

  Young Defender (HC-465) is awarded the Royal jelly of resilience: 'You were one of the defenders I took notice of fortifying and preventing death to the capture that I was taking near flight control I thank you for doing your duty, as a defender and I hope to see more of this.


  Your learning, and eventually you will be as great as any prime in the hive! Rejoice!' by Prime Queen (PRO)

  Young Carrier (MI-153-U) is awarded the Royal jelly of proliferation: 'During the time you were a drone, you help the builder caste continue to have plasma during all building activities, I thank you for keeping our hivelords going being a sole acting as a plasma battery. Tedious work should always be noted down. Rejoice!' by Prime Queen (PRO)

  Mature Drone (EM-967-C) is awarded the Royal jelly of rejuvenation: 'You were our gardener countless times, through multiple lives you kept on supporting the front with fruits, and most certainly getting me the fruit I require to go as fast as I want. You continue thorugh this tedious long endurance trial of a battle. I am thankful of your wonderful work of pushing through and keeping your sisters well supported. Rejoice!' by Prime Queen (PRO)




