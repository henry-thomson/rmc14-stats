roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Boiler (MA-445-X) is awarded the Royal jelly of slaughter: 'MAX is a young boiler, however, they didnt let me disappointed. They were having a rough start, but soon they got an amazing boil sense doing boil after boil that you think it would be a prime boiler.



  Rejoice my dear daughter, and may you evolve once more!!!' by Prime Queen (RP)

  Mature Drone (HUG-408) is awarded the Royal jelly of rejuvenation: 'HUG was a great healer drone that sacrificed for ARES in a moment of need. Not only that, they were healing our hive like crazy.


  I am very much thankful for your works, and i wish we can enjoy a new hive soon enough.' by Prime Queen (RP)

  Ancient Ravager (RUN-153) is awarded the Royal jelly of resilience: 'RUN, together with ARES and NEV, did an amazing job capturing every tall i spat on. RUN defended all captures and blocked for me and for our other ravagers, showing themselves as a trustable sister.


  May we meet again on our next hive, and rejoice my daughter!!' by Prime Queen (RP)




