  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Elaina Duncan, Little Scurryfoot, Paduxi-Utamukeeus, Inhaki Burrukari, Jesse Iseman, Brigite Silva, Simon Starseeker, Randy 'Raghetti' Rodrigues.



  Royal Jelly Awards:

  Young Defender (ZK-710) is awarded the Royal jelly of resilience: 'This daughter in a heroic moment acted quickly and saved our praetorian INK. Their act of bravery lead them to death, but they saved my daughter who had done much for the hive. Truly an example of what a defender should be' by Prime Queen (GIB)

  Elder Praetorian (INK-377) is awarded the Royal jelly of proliferation: 'This daughter captured many daughters as well as slaughtered them. Their acts of proliferation and determination to grow the hive left me impressed. This daughter deserves the jelly of proliferation, even though they fell in battle, their captures made up for it.' by Prime Queen (GIB)

  Mature Crusher (ONE-457) is awarded the Royal jelly of resilience: 'This daughter was a bastion of resilience, their gigantic size meant that they could tank many spits for my daughters. Their slow movement did not stop them from recognizing great flanking positions and conveying them to me.' by Prime Queen (GIB)
