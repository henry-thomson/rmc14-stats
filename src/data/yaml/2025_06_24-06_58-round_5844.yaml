  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Nikolay 'Revenant' Novikov, Sweet Cheesetail, Orbits-The-Squad, Marco Biery, Wendy Questings, Stares-at-Stars.



  Royal Jelly Awards:

  Young Ravager (XX-729) is awarded the Royal jelly of slaughter: 'Despite trying a New Caste. They performed the role very well. For this I award you this Jelly for the Numerous Slaughter of Talls when I screached, and for when I haven't. May the Queen Mother Guide you forward, always.' by Elder Queen (OXD)

  Mature Drone (EC-198-C) is awarded the Royal jelly of rejuvenation: 'In many situations, while we were experiencing issues. You kept healing despite the numerous other sisters dying. It was very fortunate you were with us. Without you, we may have died instead of being able to attack their Metal hive.' by Elder Queen (OXD)

  Young Carrier (XX-120) is awarded the Royal jelly of proliferation: 'Despite the many T1 Caste's and No Eggs we had. You kept producing them allowing the Hive to grow in a time of Crisis. Without you this Hive would have collapsed surely. I pray the Queen Mother will guide you forward forever and onwards.' by Elder Queen (OXD)




