roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Curious Cosmo.



  Royal Jelly Awards:

  Young Boiler (PH-558-Y) is awarded the Royal jelly of slaughter: 'The Little Queen,


  The faith of a little one, crumpled beneath the ruling hours of war, in a time where there was no ruler, yet you still stood against the odds. Despite the malicious intent and the tendencies of the Tall, driven by their inner rage to put an end to your existence, you endured.


  You went through horror and horrifying hours of war from the very beginning of my conquest. I understand your ability, and you understand that well. Each of your boils carries the heavy weight of your entire existence. You have endured multiple close calls, and I have seen the courage within you, the slaughter you brought upon the Tall, the doom you delivered upon them. It was truly noteworthy of your existence.


  I thank you for your solitary existence as a conqueror, a loyal protector of the Hive, and a daredevil who pushed the limits of your ability.


  I have seen what you are capable of.


  And for that, I see this as a worthy Jelly to be given to you.' by Ancient Queen (SVI)

  Young Boiler (CAN-682) is awarded the Royal jelly of resilience: 'I see your effort through your eyes the physical manifestation of a doom bringer.


  You caused havoc and stalled the Tall from the very beginning of your existence. With your courage and your ability to endure the countless hours across the entire planet, you continued to thrive through all the rubbish and ruin the Old Hive left behind.


  Your pain shall be remembered, for it was born from the faults of multiple Queens who were slain before you.

  You endured until the very end.


  And when you finally fell, it was not because you had given less than everything you could. You had put forth all that you were able to put against the menace of the Tall.


  But the Hivekiller was coming.


  There was no halt. No way. No time left for me.


  This was the end.


  I truly wish you could serve beneath me again...


  Perhaps in another Hive.


  Another universe.


  Somewhere beyond this war, beyond the Tall, beyond all the ruin that brought you to your end.


  Somewhere... I hope I will find you again.' by Ancient Queen (SVI)

  Elder Drone (HUG-569) is awarded the Royal jelly of proliferation: 'Well, I cannot really say much.


  But you put forth so much effort to maintain my existence, carrying me through my weakest state and bringing me back to my peak, until eventually, you too fell.


  You endured more than I could ever ask of you.


  And even though your existence has come to an end, you will be remembered.


  Until this day, I will remember you.


  Your courage.

  Your sacrifice.

  Your countless struggles.


  You were there when I needed you most.


  And for that, you will never be forgotten.' by Ancient Queen (SVI)




