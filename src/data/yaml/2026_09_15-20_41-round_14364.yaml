roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Lyn 'Liquid' Nakamura, Ivana 'Blood Moon' Rhinehart, Zephyr Faraday, Hanne Heimlich, Elias 'Donut' Bennett, Yeon-ah Min, Mariki 'Rocketbird', Mark Steele, Cook Justin, Smoke Jyllian, Sasha 'Bell' Bellina, Coro 'Sobek' Fleissman.



  Medal Awards:

  Second Lieutenant Aurora 'Birdcage' Lockheart is awarded the Bronze heart medal: 'Lieutenant Lockheart you were the vanguard in our gathering of intelligence working through the backline securing them right from under the xenonids. You then dove into caves and secured sensors gaining us much information we needed to secure victory today.


