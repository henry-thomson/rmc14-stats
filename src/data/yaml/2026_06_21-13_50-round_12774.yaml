  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Roland 'Stahl' Kraus, Abyssal Winter, Amber 'Unlucky' Summer, Kaylin 'Kay' Kadel, Meow Wyrmidon, Silas Cometrider, Oxnard Montalvo, Zackary Wood, John 'Auger' Swanson, Vincent Stern, Matthew 'Skidmark' Fields, Merlin Stargazer.



  Medal Awards:

  Lance Corporal Luanne Greenawalker is awarded the Bronze heart medal: 'For operation Investigation Ivory-Saber Launne gave the ultimate sacrifice after displaying unbelievable courage and valor. She dived for sensors with a small group, returned to the front, dived again to kill a almost mature queen, and continued to mow down xenos in her way. The corps is stronger and this victory is paritally thanks to her. Semper Fi.' by Major Breaks-the-Tides





