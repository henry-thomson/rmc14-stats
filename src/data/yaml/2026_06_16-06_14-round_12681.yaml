roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Blossoms-Upon-Snow.



  Royal Jelly Awards:

  Mature Defender (CE-591) is awarded the Royal jelly of resilience: 'The first impression you gave me was astonishing. You sacrificed your life to remove the troubling pest known as Tuber. You gave away your own life for my safety and my existence. You are the hero of the Hive.


  The pest has been removed from the world forever, thriving on the planet that was supposed to stack the odds against us. The pest was removed, allowing me to thrive in a world where they no longer exist. I won in the end, and it was all because of your sacrifice.


  This victory could not have been achieved without you. You are the hero of the Hive, CE. Thank you for everything you have done for me to remove the pest that has been such an annoyance all this time.' by Elder Queen (SVI)




