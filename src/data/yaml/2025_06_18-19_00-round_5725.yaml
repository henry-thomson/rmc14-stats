roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Xavier Tireman.



  Royal Jelly Awards:

  Ancient Praetorian (FLA-56) is awarded the Royal jelly of proliferation: 'For your immensely skilled fishing you were able to put a complete stop to the talls push, at west reactor choke hold. You did even more than that, you were able to take an entire tube spit, and live, and show how pathetic the talls are, I also have witness you make tons of captures as well, and including at A Block further securing more talls death permanently or to be captured. Highly appreciated your effort in this battle.' by Prime Queen (PRO)

  Elder Praetorian (NOX-624) is awarded the Royal jelly of proliferation: 'For your dedication for ensuring a true victory in reactors, you put a complete stop to the talls advance inside reactors by simply just fishing, the talls couldn't handle your finishing so they all ran away. You have shown the talls true fear from your prowess. Ashame you did die but your death wasn't in vain for the many captures you made along the way. Rejoice!' by Prime Queen (PRO)

  Young Drone (XX-966) is awarded the Royal jelly of rejuvenation: 'For your immense help recommended by others or nominated for your support. I am bestowing this jelly upon you for, your rejuvenation of the entire hive, you had made sure each sister was always available to heal from your fruits. That of which allowed recovery to be swift and efficient. For that you deserve this as anybody should. Well done!' by Prime Queen (PRO)

  Young Hivelord (GL-204) is awarded the Royal jelly of proliferation: 'You are given this jelly, for your dedication, and phenomenal work in making sure we always had resin to fall back to, may it be the battle was not long, but your effort is what counts. I hope that you enjoyed building for the hive as much as I enjoy watching you build our defenses. You did great out there young hivelord, keep it up! rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]GC addicted RFNs[/color]![/bold]



