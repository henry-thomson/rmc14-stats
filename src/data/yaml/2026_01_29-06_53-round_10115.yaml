roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Drone (CF-550) is awarded the Royal jelly of proliferation: 'You were here since the beginning of time.


  After the briefing you were assigned to ROCK caste, who of which you fed them plasma after plasma, including plasma fruits.


  Your support knew no bounds, you truly were a shiny example of a great drone for the hive, for you have done an excellent performance for us all!' by Prime Queen (PRO)

  Mature Praetorian (AR-59-ES) is awarded the Royal jelly of resilience: 'For your heroic deeds as a praetorian valk, you did your absolute best in terms of supporting the hive as our only valk during the intial's engagements.


  You may have fallen, but you have served as best as you could, for that you deserve this jelly for we will remember forever.' by Prime Queen (PRO)

  Young Praetorian (AN-620-T) is awarded the Royal jelly of resilience: 'After the fall of ARES, you stood up volunteered to be the next valk successor. You did your best, you prevented some tuber takedowns that I will remember.


  You did your absolute best and that what matters.


  Ashame you have fallen, but I will not forget your spirit for fighting for the hive!' by Prime Queen (PRO)

  Mature Hivelord (WS-328-PR) is awarded the Royal jelly of proliferation: 'For your hard work as our architecture of the hive, you shined by putting your best on where was needed.


  Every wall, every plasma was accounted for, an you made sure the talls suffered for their silly actions.


  May you put forth a thousands more walls for the hive, and cause absolute mayhem. hahaha


  Rejoice!' by Prime Queen (PRO)




