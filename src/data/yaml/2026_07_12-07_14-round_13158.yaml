roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Burrower (KI-663-W) is awarded the Royal jelly of sabotage: 'Although we didn't use tunnels KIW took care of always providing them, saving multiple sisters, and with all seriousness giving us incredible potential to move around. You were the only burrower, and yet you proved your might! Help us G!' by Prime Queen (LIMA)

  Elder Hivelord (DZ-967) is awarded the Royal jelly of resilience: 'DZ proved herself as an incredible show of resilience and survival! Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Through her talents and dedication, talls could not push one step forward! She is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)

  Elder Burrower (BAG-494) is awarded the Royal jelly of rejuvenation: 'BAG was just outright a master of her craft! She was constantly working overtime for her queen and sisters. Always growing incredible artisan quality alacrits, shields, and health for the healers! Supreme work BAG, what a joy to have you be part of this conquest!' by Prime Queen (LIMA)

  Elder Drone (WLF-132) is awarded the Royal jelly of rejuvenation: 'Our main joy of the hive, played a role of utmost importance! Always at the front, saving her queen in times of need. No matter how many times she dies her talents will be of high demand. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. We can only hope she continues to help us the never ending slaughter!' by Prime Queen (LIMA)

  Elder Praetorian (ZAI-695) is awarded the Royal jelly of resilience: 'Although I don't award jellis to the combat sisters, this one is an exceptional one. ZAIs powerful stomppers making tall dizzy and incapable of fight at just the right moment! They saved many of their sisters, and killed just as many talls, directly or indicredly. ZAI needs no introduction, and they will be THE deciding factor of future conquest!' by Prime Queen (LIMA)




