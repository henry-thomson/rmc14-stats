roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Erisia Zolfen, Motthew Evertide, Miles 'Deep Diver' Priebe, Aster Seelis, Erik Knapenberger, Allison Franks, Zune Laborde.



  Medal Awards:

  Evelyn Fitzberg is awarded the Bronze heart medal: 'Though their primary duty may be law, when I called upon them to serve as my Honor Guard, they answered in full. After sustaining multiple injuries, and several deaths, they showed not only are they dedicated to the cause heart and soul, but also are willing to risk their life on the line.'

  Renault 'Ren' Demuth is awarded the Distinguished conduct medal: 'A steadfast officer of the law, and combat. Whenever I hear 'Ren' is on my security detail, I can rest easy knowing I'm safe. A voice of logic and reason, maybe one day THEY should be the one leading the war efforts.'

  Chet 'Friendly Fire' Manley is awarded the Distinguished conduct medal: 'This Intelligence Squad leader ensured that we had vital information through the entire campaign. They led the Intel team with tenacity, and the adaptibility of a spring willow. Foxtrot has them to thank, and so do we all.'



  Royal Jelly Awards:

  Elder Praetorian (ARG-291) is awarded the Royal jelly of rejuvenation: 'This praetoreon saved me not only once, not twice, but three times during the siege upon the talls. For that, I believe they are truly deserving of a royal jelly. Congratulations ARG! Rejoice!' by Mature Queen (DB)




