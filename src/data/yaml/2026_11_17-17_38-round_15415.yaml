roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Robert Rodriguez, Nekuli.



  Medal Awards:

  Corporal Thomas Hammond is awarded the Bronze heart medal: 'Corporal Thomas Hammond has gone above and beyond during Operation Bravo-Knight, as during a supposed final stand, he succesfully broke out of an encirclement, ultimately giving his life in the retreat, ensuring that a couple of marines managed to return home to their loved ones.


  Awarded by Maj. Hudson 'Hungry' Demuth on 17/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth



  Royal Jelly Awards:

  Young Boiler (XAD-836) is awarded the Royal jelly of sabotage: '"Well, I am tired."


  Not a word can I utter about your ability, your greatness, or your potential to become a true Boiler. One of the finest artillerists, one of the most magnificent beings of all. You were the sole reason we won. 


  We started with barely nine sisters while the Queen lay dead. You were the only Tier 3 left, stalling for me and buying me enough time to secure as many captures as I could. The sheer will, bravery, and determination you displayed showed me that you possess everything it takes to become a truly great Apex Boiler.


  I see the potential in you. Despite your youth, you possess tremendous prowess, a sharp mind, the ability to comprehend, and the insight to understand the Queen's vision. You were the Hive only hope of securing victory, and we prevailed through nothing but the sheer prowess of the Hive. And the reason we are still alive today was you.


  Thank you, XAD. You are one of the greatest Boilers I have ever seen. Truly one of the top performers,' by Prime Queen (SVI)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]The gibbing of the Blueberry[/color]![/bold]
