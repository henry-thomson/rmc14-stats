roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Breaks-Her-Hands.



  Royal Jelly Awards:

  Young Hivelord (MA-214-L) is awarded the Royal jelly of rejuvenation: 'First things first, I give this jelly to MAL, who remained alive ever since talls dropped.


  The encircled and encased the damned skytalls in a resiny grave to die in, without her we'd have no shot.' by Elder Queen (DAVE)

  Ancient Praetorian (HUK-116) is awarded the Royal jelly of sabotage: 'For sabotaging the talls push, constantly seeking angles to harass, maim and capture talls, HUK proved absolute that determination, will forever lead to the hives success.' by Elder Queen (DAVE)

  Ancient Ravager (ARG-331) is awarded the Royal jelly of slaughter: 'Where do I being with ARG, they slaughtered and captured so many talls, working completely on their own, in a hive that works claw to claw, their standalone performance by themselves truly sets fear into the hearts of talls.' by Elder Queen (DAVE)

  Young Drone (QA-979) is awarded the Royal jelly of rejuvenation: 'For refueling the whole of the hive, leaving no stomach empty, rejuvinating the whole hive selflessly.


  Without them, we wouldn't have the strength or health to continue, truly the backbone of the hive.' by Elder Queen (DAVE)




  [bold]Operation funded by [color=green]Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
