  Royal Jelly Awards:

  Prime Lurker (PRO-124) is awarded the Royal jelly of resilience: 'When the hive was suffering the most, there was one defender tanking spits and getting caps; you. You were personally with me through the majority of the struggle at the final half of this war, and without you I would have died countless times. Never before in my lifespan have I seen a steelcrest defender perform to this ability, and I am proud to have had you in my hive. For these feats, you undoubtedly earn the jelly of resilience in my eyes.' by Ancient Queen (SEA)

  Elder Lurker (ORB-672) is awarded the Royal jelly of slaughter: 'With your claws and sheer might, you slaughtered tall forces when needed and provided immaculate support. I saw you support the hive by also dragging and taking captures, just as hard as you murdered talls. If you had not been in my hive it is likely the tides would have not turned in our favor. For this, I award you with the jelly of slaughter.' by Ancient Queen (SEA)

  Elder Defender (RIV-118) is awarded the Royal jelly of resilience: 'During the second half of this battle, when I required good combat castes the most, you appeared and did exactly what I not only expected but more. You saved my life many times, and helped me secure many valuable caps. When I screamed, you were right there to punish the talls and drag them away into our hive. Though you fell in battle, the work and effort you put into this hive will be remmembered for generations to come. For your impressive feats, I find it fitting to award you with the jelly of resilience.' by Ancient Queen (SEA)




