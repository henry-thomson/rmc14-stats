roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rodrigo Lacon, Buck 'Pretty' Tern, Fritz AW Dagger, Leroy Keener, Silvie Argentum, Luka Petrovitch, Blossom 'Nibbles' Muncher, Xenia Drakonsdottir, Rory McDonnell, Vuloss, Ceres Clark, Elijah Cowper, Beth Bell, 'Tom' Ten Autumns Under Sunshire, Celia Aval, Nala 'Witch' Whitewitch, Leslie Briggs.



  Medal Awards:

  First Lieutenant Ion Lightweaver is awarded the Distinguished conduct medal: 'Lightweaver diligently assisted a single requisitions technician in their duties. For going above and beyond what is usually needed of staff officers, you are more than deserving of this reward. Hopefully more staff officers will follow in your example.' by Major Danielle Sparks

  Lance Corporal Kain Weller is awarded the Distinguished conduct medal: 'For assisting a lone staff officer after our only requisitions technician went to hypersleep, Weller has more than earned this medal. Thank you for going above and beyond your duty to ensure the groundside marines were supplied.' by Major Danielle Sparks

  Corporal Cay 'Stargazer' Neseko is awarded the Distinguished conduct medal: 'For consistently meeting the rotations of the enemy force with a thick wall of fire, ensuring they were sufficiently suppressed and had a hard time moving around, Corporal Neseko has proved they are more than worthy of this reward. Thank you for your work.' by Major Danielle Sparks





