roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Slimbo Higgins, SIVA, Ryann Coldsmith, Scully 'crossbones' Mason, Starbound Gambit.



  Royal Jelly Awards:

  Ancient Runner (ARG-565) is awarded the Royal jelly of slaughter: 'For standing as a paragon of all hives everywhere, now and always. For using your skills in the art of self-obliteration and acid creation, and for slaughtering a huge chunk of talls with your acid explosion that bought the hive crucial time in reorganizing, i give you this jelly of slaughter.' by Ancient Queen (CMP)

  Young Runner (AL-786) is awarded the Royal jelly of slaughter: 'For your expertie in the destructin of self, and acid minipulation. Although young, you managed to obliterate a good chunk of talls as a double whammy, buying us crucial time. Without your 2nd explosion, we would have likely lost.' by Ancient Queen (CMP)

  Young Drone (XX-497) is awarded the Royal jelly of proliferation: 'There is not much to say, for your act of rebuilding the scavanger metal bird nesting area saved this hive. For your iniative here allowed us to continue onwards. Well done, may you build forever more' by Ancient Queen (CMP)

  Prime Runner (ABO-593) is awarded the Royal jelly of proliferation: 'For calling out isolated talls, for running infecteds back and forth from the frontline to the nesting area, and for capturing many talls, your skills will always be appreciated. May you run through the stars forevermore' by Ancient Queen (CMP)

  Elder Ravager (ANK-276) is awarded the Royal jelly of slaughter: 'In staying alive, and knowing when to let loose your rage, and when to keep it contained, you allowed us to constanlty put offensive pressure on the talls. In time, you manged to slaughter many tall groups. For your efforts, i give you this jelly of slaughter!' by Ancient Queen (CMP)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Totally not your We-Ya CL[/color]![/bold]
