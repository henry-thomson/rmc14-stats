roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Young Boiler (OWO-411) is awarded the Royal jelly of slaughter: 'Our only boiler for the tall invasion. During critical moments this boiler killed many a tall with its boil and spray. It covered mothers retreat and followed her with dedication in her royal guard. Without this boiler victory over the talls would not have been possible! Bravo!' by Elder Queen (ARG)

  Elder Praetorian (BA-110-KA) is awarded the Royal jelly of resilience: 'Our Valkryie sister, this sister demonstrated courage and grit in the face of the tall invasion. Stomping talls for capture, shielding momma from deadly tall spit and protecting other sisters with there armour. Without this sister, many of our hive would not have lived to see the victory over the talls.' by Elder Queen (ARG)

  Young Hivelord (LA-852) is awarded the Royal jelly of resilience: 'Our only suriving hivelord. This sister built the hive from the start, setup critical hive strucutres, and ensured that sisters on the frontline always had resin to fall back to. During mommas pushes they left the safety of resin to weed amoungst the talls and hinder there efforts to recover. Without them we would not have tasted victory today.' by Elder Queen (ARG)




