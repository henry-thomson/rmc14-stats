roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Snicket Sharp-Claw, Joe Rhinehart, Molto Quibbles, Casper Gibson, Kaleb Randolph, Milly Explosion, John 'Port' Larboardson, Fazilia Kostina, Rury Harzon, Quelii Corvus, Lilian Levett, Arielle Straus, Kenneth Khan, Locke Delgado, Dominique Noets, Konian Siennawing, Bleslie Flumpguffin, Emily 'Klutz' Rathen, Deekum-Noyei, Emma Collins, Krieg Barkhart, Kyriss 'Snow' Winters, Nahuel Porter, Grimbo ''Husband'' Methodicus, Lissette Beckman, Higgy Streets, Jasyo, Enkrid Night, Adrien Nett, Bjornsonn Thungsteel.



  Royal Jelly Awards:

  Mature Crusher (ZE-524-RO) is awarded the Royal jelly of resilience: 'To honor the unbreaking obsidian, who knelt not where so many sisters shattered. Your resilience and perseverence saved many, captured many more, and you served as the foundation for all which took place today. This queen extends a heartfelt thanks to you for your fealty.' by Elder Queen (TMM)

  Young Praetorian (MI-550) is awarded the Royal jelly of rejuvenation: 'To honor the one who coats her hands in deathslaying salve, I present the jelly of resilience. How noble your selflessness, bleeding yourself to stem the wounds of others. Today, a single cut spared a thousand more, as you brought me from the brink with a single touch. In that single instant, you stopped talls from winning, giving me life to fight in the name of every sister in this hive. This queen offers you her gratitude for your fealty.' by Elder Queen (TMM)




