roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Ravager (DID-768) is awarded the Royal jelly of slaughter: 'DID, My loyal ravager, in tough times where our hivemind was about to shatter and fall... she rose up to the task and killed so many talls and made a wipe possible! I hope to see her in our hive again. For this, I grant them the jelly of slaughter. Rejoice!' by Elder Queen (XR)

  Prime Praetorian (FI-226-RE) is awarded the Royal jelly of resilience: 'FIRE, Our loyal praetorian. She absolutely supported us till the end, especially during that wipe. Constantly making sure our ravager did not catch on fire and I did not die. they were very helpful today, and very strong. for this, I grant them the jelly of resilience! Rejoice!' by Elder Queen (XR)

  Young Carrier (XV-659) is awarded the Royal jelly of proliferation: 'XV, Our loyal healer! Making sure we did not falter once during the wipe, even if she had to risk her life for it. She is one of the strongest daughters I have seen despite her small body. For this, I grant them the jelly of proliferation! Rejoice!' by Elder Queen (XR)




