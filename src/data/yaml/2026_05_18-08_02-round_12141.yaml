roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Beaky Faust, Davion Levett, Maze AW Falx, Tammy Thompson, Violet Bellum, John Weller, Ron 'Fluffy' Paxton, Bingy Faeheart, Bites-the-Darkness, Alexsandr 'Pinky' Kasper, Gregor Carlos.



  Royal Jelly Awards:

  Mature Ravager (COG-690) is awarded the Royal jelly of resilience: 'COG, you have proven yourself to have what a lot of ravagers envy,

  While also killing and destroying the talls, your courage and bravery, helped us kill the tall menace. I am sad that you did not get to see what this hive has got to become at the end.

  But your sacrifice, allowed me to TEAR and GUT the evil tuber that has killed so many sisters. While also destroying the last hope talls had against us.

  I am really proud of you, today, and forever.

  With love, LAG' by Ancient Queen (LAG)




