roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Phaethon 'Moonie' Moon, Nolan Allen, Nikki 'Ferret' Blackburn, Fitz Wallick, Sprays-the-Needles.



  Medal Awards:

  Tullop 'Chayn Sark' is awarded the Distinguished  conduct medal: 'For excellent communication and organization of FOB personnel and material, I see it fit to commend your efforts. Thank you for keeping the fort held down while we kept up our assault.


  Awarded by Col. Scraps-the-Copper on 8/31/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Althea Leander is awarded the Distinguished  conduct medal: 'The folks over at intelligence performed admirably today. Xenonid corpses were quickly requisitioned by our flight staff, and large sums of intelligence were processed and put forth to the war effort.  Thank you.


  Awarded by Col. Scraps-the-Copper on 8/31/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ne'Zun  ''GhostLine'' is awarded the Distinguished  conduct medal: 'Delta is a squad revered for their utmost aggression and fearlessness in battle. Gunnery Sergeant Ne'Zun was able to carry out an almost impossible order - having these boys hold their ground. Because of this effort, we were able to entirely secure our backline, allowing us to plunge confidently into the caves to strike the belly of the beast and extinguish this infestation.


  Awarded by Col. Scraps-the-Copper on 8/31/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Katerina AW Dragunov is awarded the Distinguished  conduct medal: 'Katerina, Delta SADAR, I had the distinct privilege of fighting alongside. I would say that she saved my life, on a would-be-fateful flank that the Queen had performed, attempting to drive a wedge between our forces. She then proved herself lethal once again, hitting the xenonid queen face-first in the mouth of the cave. This kill bought us time to wreak havoc in the xenonid backlines, as they were scattered without their hivemind to warn their kin of our movements.


  Awarded by Col. Scraps-the-Copper on 8/31/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





