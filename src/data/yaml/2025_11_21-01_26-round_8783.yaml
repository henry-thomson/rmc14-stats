roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Erika Taylor, Daris Kracht, Trill-Quaver, Oberon 'Obi' Toski, Titus Strongleaf, Pepper, Paduxi-Utamukeeus.



  Royal Jelly Awards:

  Ancient Praetorian (ZAO-520) is awarded the Royal jelly of resilience: 'Was a guideful whisper in their queens ear the duration of the talls assault. With their wisdom and assistance we were able to push the talls back to their perch.' by Ancient Queen (HEK)

  Elder Ravager (SEA-592) is awarded the Royal jelly of slaughter: 'Slaughtered the talls backline, making them panic and perform a dangerous assault that lead to their doom,' by Ancient Queen (HEK)

  Ancient Defender (TO-611-MB) is awarded the Royal jelly of sabotage: 'Ravaged the talls on their motherbird.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Arcturus's Additional Pylons[/color]![/bold]



