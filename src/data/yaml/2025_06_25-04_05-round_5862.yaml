  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Giovanni 'Esgio' Guess.



  Royal Jelly Awards:

  Young Carrier (CC-222-O) is awarded the Royal jelly of proliferation: 'For your well positioning of eggs that greatly help the hive, you are being bestowed this jelly of proliferation. Over the course of the battle, I have seen you always be placing eggs that would be utilized by our finest oppressors, your effort is the main reason they can even do crazy stuff like that. You should be proud of what you have done this battle. Unfortunately you have met your demise at botany shielding me, but your effort is what counts the most. REJOICE!' by Prime Queen (PRO)

  Young Praetorian (KL-843-A) is awarded the Royal jelly of resilience: 'I am bestowing this jelly in your heroic dead in shielding me at a critical time in botany, I was in the open, I was getting focused on and almost became critical condition, but due to your actions such as shielding me, I was ensured to not go critical because you were in the talls way taking their spit on purpose you have done the hive a great honor. Rejoice!' by Prime Queen (PRO)

  Young Lurker (TI-392) is awarded the Royal jelly of resilience: 'For your incredible work and dedication to the hive I am bestowing this jelly for your heroic deed of saving sisters in combat by shielding, and also for your incredible help within the hive. Unfortunately it was sad to see you perish as a ravager in botany, but you overcame that by being able to still help the hive in many ways. You did the hive proud! Rejoice!' by Prime Queen (PRO)




