  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Drone (HA-426) is awarded the Royal jelly of rejuvenation: 'A sister… no, something far more than that. A sister who went to unimaginable messaure to secure a victory, paying the price with everything. her life, her memories, and enduring every reincarnation along the way.


  I see now that your sacrifice has secured us a victory. There are hardly any words I can offer that would do justice to what you have endured.


  All I can say is that your sacrifice will never be forgotten.' by Prime Queen (SVI)




