roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Donovan 'Joker' Palmer, Enn Cetana, Sporex Xavian, Yeo 'Sakura' Bunnia, Licks-The-Beans, Alexia 'Sleepyhead' Trainer.



  Royal Jelly Awards:

  Mature Hivelord (NEW-937) is awarded the Royal jelly of sabotage: 'Our hivelord, NEW was consistantly working to encircle the talls during the invasion. Without their efforts we would not have had such success at capturing so many. Without question or ask they faithfully built the hive. One day all hivelords wish to be as wise and dedicated as you. Bravo!' by Prime Queen (ARG)

  Prime Ravager (LI-145-MA) is awarded the Royal jelly of proliferation: 'Our Ravenger from the start, this daughter consistantly dragged captures on mothers screams. Without fail on nearly every occcasion they returned bearing a tall. Many of my daughters would not be alive today without their work. Rejoice!' by Prime Queen (ARG)

  Ravager (QW-430-E) is awarded the Royal jelly of proliferation: 'One of our ravengers. Without their efforts the tall invasion would not have been stopped. During critical moments this daughter slaughtered talls covering captures. Singlehandedly they captured the dreaded flamewalker ensuring our vicotry. Bravo!' by Prime Queen (ARG)

  Young Praetorian (RO-268) is awarded the Royal jelly of proliferation: 'Our Oppressor, RO has been with us since the birth of the hive. Dispite their young age this daughter has performed well above her experience. Her hooks and pulls have enabled many captures from the tall ball. She faithfully followed mother and enabled our vicotry over the tall invasion. We look forward to seeing the prime daughter you are to become. Bravo!' by Prime Queen (ARG)




