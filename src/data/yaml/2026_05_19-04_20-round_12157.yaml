roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Zigor 'Vandal' Skugg, Leah Rose, Olaf Pinkbeard.



  Royal Jelly Awards:

  Elder Praetorian (AVR-681) is awarded the Royal jelly of rejuvenation: 'For saving my life during at a critical moment your phermones were actively the only reason I survived and you boost my carapace density.


  The hive would of been lost, and most likely perished without that little edge of your help.


  It was just absolute perfection, I want to see more of this in the future, keep it up!


  Rejoice!' by Prime Queen (PRO)

  Young Ravager (VV-605) is awarded the Royal jelly of resilience: 'You were our last hedgehog, and you show these talls what you were truly made of. You survived countless engagements with me, and made the talls suffered every time they try to counter push. I was just so thankful because without any counter push from you, the talls would of just walk over the hive, and you pretty much made it really possible to turn this around.


  rejoice!' by Prime Queen (PRO)

  Elder Lurker (NOX-904) is awarded the Royal jelly of sabotage: 'For conserving enough acid as a acid runner you were able to coordinate an explosion with me, and destroy the talls south of colony garage. The Explosion of acid was able to weaken them all the way to the point we had a capture festival because of that. 


  Well done my acid runner! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
