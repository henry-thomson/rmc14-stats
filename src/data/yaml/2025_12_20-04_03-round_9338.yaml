roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Ramone del Rosario, Jim 'Smokey' Werner, Randy Ironbrow, Zoropsis Phalangioides.



  Medal Awards:

  Eric 'Ratling' Lunaheart is awarded the Distinguished conduct medal: 'For their superb work in ensuring medical ran smoothly, and by recommendation of their chief medical officer, I commend this nurse's efforts. Thank you for showin' up today.


  Awarded by Col. Scraps-the-Copper on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Elric 'Oblivious' Powell is awarded the Distinguished conduct medal: 'For their work in running the shipside medbay, in ensuring that over seventy pressurized canisters of general cure and pills were made to keep us all in one piece throughout the entire ordeal of today. I commend your efforts, doctor.


  Awarded by Col. Scraps-the-Copper on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Stares-at-Stars is awarded the Medal of valor: 'For their stalwart leadership over Alpha squad, keeping them in top performance as we held the line against the xenonid horde today on Fiorina Science Annex. The results speak for themselves.


  Awarded by Col. Scraps-the-Copper on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Archibald 'Ripcord' Butterfill is awarded the Distinguished conduct medal: 'As Charlie lost marine after marine, swapping through many different leaders, this responsibility landed square on your shoulders. Needless to say, you performed admirably in the face of overwhelming odds. Good work.


  Awarded by Col. Scraps-the-Copper on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Jeroh 'Uncle Fobbers' Ward is awarded the Distinguished conduct medal: 'For ensuring the FOB was safe after the xenonid horde upon Fiorina Science Annex had attempted to breach it countless times. It seems they grew weary of your efforts, and stopped trying altogether before ending their miserable lives on the FOB before the moment of nuclear detonation. Great work.


  Awarded by Col. Scraps-the-Copper on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Elise Veira is awarded the Distinguished conduct medal: 'For their aid in constructing engineering ring, and maintaining what would be an otherwise untenable position at the survivor camp and Disco as Charlie and Delta held their ground, taking devastating casualties. It would have been far worse had you not been there, however. Good work.


  Awarded by Col. Scraps-the-Copper on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





