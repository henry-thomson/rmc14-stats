roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Skoros 'The Moth' Mothman, Nosuko.



  Royal Jelly Awards:

  Young Defender (ZI-771-P) is awarded the Royal jelly of resilience: 'Although young this daughter made the ultimate sacrafice to the hive. Seeing a moment of weakness in the talls battle lines they lunged the deadly tuber and flinged them into resin. They gave their life for this action but it was enough for mother to tear the tuber limb from limb. Bravo!' by Prime Queen (ARG)

  Prime Hivelord (ZAO-558) is awarded the Royal jelly of sabotage: 'A hivelord from the very start of our hive, this daughter was instrumental in our victory this day. Not only did they pass critical information to mother, leading to multiple talls meeting their doom. They also encircled the talls preventing their escape. The whole hive owes you a debt. REJOICE!' by Prime Queen (ARG)

  Prime Praetorian (MIA-585) is awarded the Royal jelly of proliferation: 'Our Dancer, this daughter dodged spit and flame. Each time she returned to mother she brought a capture. Without fail on every single scream. Her dedication to her craft was a marvel to behold. Many of our hive owe you their lives due to your efforts. Bravo!' by Prime Queen (ARG)

  Ancient Ravager (LU-890-AN) is awarded the Royal jelly of resilience: 'One of our ravengers, this daughter earned an achievement few have. On every scream this daughter covered her sisters retreat. Through her efforts the hive nominated her. She has earned the Love of The Hive. This is no small feat, she distingushed herself so much in her efforts that her nomination was uncontested. Without her, so many would not be alive to see the end of the tall invasion. REJOICE!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
