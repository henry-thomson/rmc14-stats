roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alaina 'Doss' Roswell.



  Royal Jelly Awards:

  Mature Drone (NC-396) is awarded the Royal jelly of rejuvenation: 'During the retreat of the talls at the end moments, young ravager TEA decided to over extend and would of died without your aid of healing them at the critical moment, but sadly you were striked down by the skyspit several times with explosions that eradicated you. However this effort will be remembered for you saving a vital tier 3.' by Prime Queen (PRO)

  Ravager (TEA-146) is awarded the Royal jelly of resilience: 'You were one of the last ravagers standing, being one of the main last ravagers you provided cover and slowing down what talls you could and making captures.


  I want to thank you for being on this journey with me, as you help tremendously in the arts of combat.


  Thank you young ravager.


  Rejoice!' by Prime Queen (PRO)




