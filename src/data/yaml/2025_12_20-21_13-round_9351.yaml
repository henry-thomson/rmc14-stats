roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rhaun-Ironclaw, Boris Scavmanchez, Ralvox 'Bulletstormer' Rilora, Riddler Annexson.



  Royal Jelly Awards:

  Elder Drone (IRA-806) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself to save a vanguard in need on the main front line, you have achieved in ensuring the survival of our most vital warriors at all times. For you deserve this jelly, you have done a excellent performance rejoice!' by Prime Queen (PRO)

  Young Warrior (ABC-165) is awarded the Royal jelly of sabotage: 'For your heroic lunge on the tuber, to ensure them to be gibbed south of botany, where the talls were encircled. You still yet proved your worth as a warrior for the hive by ensuring no talls could put your sisters in harms ways.


  May I see more of this performance great warrior actions in the future. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Kate's 200 Clones[/color]![/bold]
