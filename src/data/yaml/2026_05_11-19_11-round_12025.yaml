roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Lance Corporal Dante Harris is awarded the Medal of exceptional heroism: 'Lance Corporal Dante Harris during operation Project Eta-Bird performed a feat in which we all would have surely died without his action. Dynagrid telecomms was under constant assault and we were losing many to captures and were on the bring of evacuation. However, due to Dante's actions we were able to repel the xenos, and he scored the blow we needed, killing the queen. For this Dante you have earned this medal of exceptional heroism. You are a hero to us all.


  Awarded by LtCol. Sicilia Drakonovisch on 05/11/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Lance Corporal Nezuni-Arksai is awarded the Distinguished conduct medal: 'Lance Corporal Nezuni-Arksai stepped up to help with intel during operation Project Eta-Bird. Without their help in gathering intel we would not have gotten the nuke. They have done a excellent job today and went far beyond the normal call of duty. Excellent work.


  Awarded by LtCol. Sicilia Drakonovisch on 05/11/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





