roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tim Baker, Dakota Carmichael, Erika Marienthal, Jatayu 'Nerd' Corvuson, Adriana 'Twin' Ann.



  Royal Jelly Awards:

  Young Ravager (V-222-C) is awarded the Royal jelly of slaughter: 'V-C, you have performed exquisitely today. You have done your part and more, you have helped the hive in more ways than one. Not only have you contributed greatly to our captures of the talls, but you have also helped killing those foolish enough to try and face us in battle.


  For your great work today, I have decided to award you this jelly of slaughter, so that you may commemorate this day.


  See you in the next hive!' by Elder Queen (NEV)




