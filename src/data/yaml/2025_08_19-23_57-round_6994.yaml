roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Fat Dale, Kristiana Mikhaylov, Damon Reid, Alexander Spacer, Rhys Hendricks, Bobert Brockson, Garry Yelis, Harper Brys, Lilly 'Pipsqueak' Harding, Einuko 'Twitch' Steelfeather, Markus Volt, Hudson 'Joker' Dwayne, Tyrone Choom, Lawrence Roadman, Tricky Pip, Abigail 'Sadistic' Shipwreck, Muz-Skee, Nahami, Harmony Holt, Argy Navus, Dell 'Terra' Dellitrasse, Jimena Parker, Shakes-The-Friendlies, Desmond Pickles, Sam 'Smiles' Spektor, Noriko Shisune, Paduxi-Utamukeeus, Ray Steelmount, Smokey Junipus, Explains-the-Plot, Phillip Williamson.



  Medal Awards:

  Lilly 'Pipsqueak' Harding is awarded the Bronze heart medal: 'Posthumous Commendation


  Corporal Lilly harding served as a Corpsman with distinction. Putting her fellow Marines before herself. In the heat of battle, Lilly sacrificed herself, so another Marine could make it out and live another day.


  Her steady hands saved countless lives, but that one act of sacrifice is what defined her service. Thank you, Corporal.


  Awarded by Maj. Freya Locke on 08/20/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





