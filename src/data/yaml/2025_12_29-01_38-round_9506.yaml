roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vasra Deltora, Canderous Boone, Adeline Garland, Finn 'Fluffy' O'Flaherty, Stares-Ominously, Jared Elderson, Regi Sandman.



  Medal Awards:

  Boris Scavmanchez is awarded the Distinguished conduct medal: 'For your work on the FOB, as well as the sheer ton of deconstruction work you did shipside - you were responsible for a large sum of our engineering efforts today.


  Awarded by Col. Scraps-the-Copper on 12/28/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Atreiya Vuctoiris is awarded the Bronze heart medal: 'For their valiant efforts of leading the frontline against a highly evolved xenonid hive. A true shame it was to lose them on the field, along with the majority of the company. I will curse my ineptitude for as long as I live.


  Awarded by Col. Scraps-the-Copper on 12/28/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Nyx Sparkdrawn is awarded the Distinguished conduct medal: 'For keeping the marines well stocked throughout the entire ordeal that we called Operation Task Force Epsilon-Bravo. Certainly no easy feat.


  Awarded by Col. Scraps-the-Copper on 12/28/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Flick Dean is awarded the Bronze heart medal: 'This marine proved themselves to be a worthy leader of Charlie squad early on in the operation. Had their life not been snuffed out prematurely, I am sure they would have made an excellent higher enlisted, or even officer. We will remember the impression you made on us in such a short amount of time.


  Awarded by Col. Scraps-the-Copper on 12/28/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Eats-The-Shrimp is awarded the Bronze heart medal: 'This marine proved their mettle today during Operation Task Force Epsilon-Bravo. A newly promoted sergeant, thrust into an operation most difficult and demanding, still able to perform their duties until the bitter end. An inspiration for the corps moving forward.


  Awarded by Col. Scraps-the-Copper on 12/28/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Mature Hivelord (XX-24-X) is awarded the Royal jelly of proliferation: 'For your immenseful impact as our hivelord through the beginning to end, you have achieved my respect for your hard work.


  You built up admin when we needed it, and you have kept on building any where you could as much as possible.


  Your building as provided cover to countless sisters, and has halted many talls actions, for that I implore your effort.


  May you build thousands of walls and hives in the future!


  Rejoice!' by Prime Queen (PRO)

  Mature Runner (SI-187-X) is awarded the Royal jelly of sabotage: 'Since the beginning you were born, you were building up acid to help the hive.


  After of which I planned a precise attack on the north pylon tower, and you did a glorious explosion that wiped the entire north pylon defense.


  You did an immense impact that has help us achieve total control over the north tower.


  I implore every second you were with us, may you bring down thousands of defenses! For the hive!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
