  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jim 'Smokey' Werner, Leon Renshaw.



  Medal Awards:

  Sergeant Leon Renshaw is awarded the Bronze heart medal: 'Leon charged the Queen after already repelling her once, he did so alone and managed to not only put the queen into a critical state which allowed us to follow up and finish her off, He also killed many more of her horde resulting in the rest of FORECON being able to survive long enough to recieve reinforcements. He however was captured in the process and unable to be rescued. Leon was brave, courageous, and unwavering in his duty to the corps and his fellow marines. 


  Awarded on behalf of Maj. Reigar Matherstone on 14/10/2126. UNMC FORECON | UNS Hanyut | Force Reconnaissance Detachment | United Nations Marine Corps


  By LtCol. Kaitlin Zalack on 14/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





