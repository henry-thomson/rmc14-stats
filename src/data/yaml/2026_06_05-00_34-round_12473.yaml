roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Drone (WL-764-F) is awarded the Royal jelly of rejuvenation: 'WL-F, great save you have done. While the evil tuber may have gotten a good shot on me, it would not achieve much under your watchful eye. You have helped me recover from this critical hit in no time, allowing us to keep the momentum going and win this day.


  For this, I award you the jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Praetorian (DE-163-AD) is awarded the Royal jelly of slaughter: 'DEAD, you have helped with many things today, wiping talls, capturing them and even saving sisters from poor decisions. You have been a key sister to the hive.


  For this, I award you this jelly of slaughter for your great work.


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Hivelord (CO-606-S) is awarded the Royal jelly of proliferation: 'CO-S, you have done a great deal for this hive. You have built an incredible amount, and have made us so resin highways that allowed us to make rotations in time, which allowed us to make many captures this day.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Hivelord (BEN-209) is awarded the Royal jelly of sabotage: 'BEN, You have done well this day. Your continuous efforts to trap the talls and encircle them with resin has allowed us to corner them at the evil eye, leaving them no escape as we mercilessly captured and killed all that remained. Your efforts have been noted and appreciated.


  For this, I award you the jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)




