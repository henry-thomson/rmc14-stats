roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  John 'baldo' Wheeler, Davlat 'granddad' Lukin.



  Medal Awards:

  Second Lieutenant Cade 'Nuncio' Dupree is awarded the Distinguished conduct medal: 'Lieutenant Dupree has shown excellent leadership and intiative as the Chief Engineer of UNS Almayer. They deployed during Operation Sortie Metal-Strike and played a major role in recovering a FOB that was in extremely poor condition. Preventing both risks to the operation and to the sanity of the CIC staff.


  Awarded by LtCol. Clyde McKinney on 2/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





