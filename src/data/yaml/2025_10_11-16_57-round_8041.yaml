roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  The Precipice of Defeat, Seth Wright, The Leaf of Simplicity, Absurdist-by-Nature, James Robooty, Jonathan Mcscotch, Rhys Hendricks, Is-The-Ugly, Elliot Ackerley, Jay Sealis, Caesar Malachite, Commet 'flame' Brown, Surtur 'Brimstone' Cyrus.



  Medal Awards:

  Lily Slimeweaver is awarded the Distinguished conduct medal: 'For exceptional leadership as Charlie Squad Leader, guiding her marines through operational Mission Intel-Echo on LV-759, Hybrisa Prospera.

  She kept the Marines cohesive, and lead her squad to victory, contributing greatly to mission success.


  Awarded by LtCol. Freya Locke on 10/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Thomas 'Sully' McSullivan is awarded the Distinguished conduct medal: 'For outstanding performance as a gunship pilot, delivering numerous confirmed kills and providing valuable intelligence to CIC during operation Mission Intel-Echo on LV-759 Hybrisa Prospera. He directly contributed to the success of the operation today.


  Awarded by LtCol. Freya Locke on 10/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



