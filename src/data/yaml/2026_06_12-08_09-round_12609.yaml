  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  unknown, unknown, Vyshari Ilmari.



  Royal Jelly Awards:

  Young Hivelord (HA-697-L) is awarded the Royal jelly of resilience: 'HAL, today you proved yorself worthy of the title lord. You have built up everywhere that YIP asked of you. Your great work today together with your team of builders is what secured us victory this day.


  You are the first to recieve a jelly from Prime YIP, and YIP is happy that of all the sisters, it is you. Always keep on working with your teams. Lone you are weak, together you are unstoppable.


  YIP!!' by Prime Queen (YIP)

  Prime Drone (ASH-382) is awarded the Royal jelly of sabotage: 'ASH, today you proved that even drones can impact the battles greatly. You managed to capture the tall empress right under the talls claws and made sure to shatter any hope they had left of winning.


  YIP is proud of you ASH as you are one of our oldest and strongest sisters. Your great dedication to the hive is commendable and YIP hopes that you will keep on working as hard as you did today for future battles to come.


  YIP!!' by Prime Queen (YIP)




