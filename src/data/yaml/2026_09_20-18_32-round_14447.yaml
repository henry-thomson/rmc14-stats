  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Clayton 'Scrapper' Vanbuskirk, Amanda Curry, Artyom 'Razor' Koshlov, Leihka 'Follie' Xyalen, Bravely-Runs, Caesar Lightfiller, Maximus 'Max' Espinosa, Flames-The-Plasma, Astrid Krieger, Slimey Sam, Risk-the-Empire, Starts-The-Fire, Smoke Jyllian, Ariel Silver, Celryn Half-Penny, Takara Nowak, Xarzin Velmara, Kokan, Wets-the-Drystone, Tyson Weller, Silvie Argentum, Avery 'apple pie' Cometrider, Cronin 'Fig' Pekoe.



  Medal Awards:

  Lance Corporal Thales 'Careless' Antares is awarded the Distinguished conduct medal: 'Lance Corporal Antares you spent most of this OP securing crates for Req allowing them to spend more on the breaching we needed. Then you turned around and used that breaching to help us secure much open ground today. For your work today I reward you this medal.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/20/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Sergeant Tail-Tail is awarded the Distinguished conduct medal: 'Sergeant Tail-Tail you spent this whole OP teaching many new nurses in the ways of medical and how medbay operates. You did a job that isn't ask of you and help ready the newest medical staff the Almayer will have. For your service I reward you this medal.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/20/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





