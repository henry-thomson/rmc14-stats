roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rajas Stargazer, Kevin '4th Survivor' Khan, Ether Gloobi, Gary Geico, Addyson 'Fortuna' Zappy, Anastasia 'Butterfingers' Saylor, Baldric Stonefist, Christina Gray.



  Royal Jelly Awards:

  Young Hivelord (UV-683) is awarded the Royal jelly of proliferation: 'Today, you have been awarded this jelly for your hard work and quick thinking with building. Though you are still young, and have lots to learn, you've shown great promise in the field of building. I look forward to seeing and hearing of you work in further hives, and I hope you only become even better in your craft!


  - Love, Mother' by Elder Queen (JIN)

  Ancient Boiler (EH-741-HE) is awarded the Royal jelly of sabotage: 'Your work in the hive today cannot be understated. Boiler is one of the most useful and tactiful castes there are, and you showed off why. You were were you were needed constantly, and made the most annoying boils for the talls. You also did amazing in holding off specific spots in the wipe at reactors, saving us the ever needed few seconds to push it even further each time. The hive thanks you for your efforts.


  - Love, Mother' by Elder Queen (JIN)

  Ancient Warrior (ALT-895) is awarded the Royal jelly of resilience: 'You are being awarded this jelly for your command and colaboration with other sisters in our dire times of the reactor being invaded, and securing a great foothold and getting many captures when it really shouldn't have been likely to. Though you may have died, you died for the hive, and we carry on because of your efforts. The hive thanks you.


  - Love, Mother' by Elder Queen (JIN)




