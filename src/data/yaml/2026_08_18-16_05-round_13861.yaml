roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Is-The-Fish.



  Royal Jelly Awards:

  Elder Crusher (ORB-946) is awarded the Royal jelly of sabotage: 'My dear crusher daughter ORB

  I award you this jelly of sabotage for being a main line with the help of our healers in sabotaging the tall beast

  With your constant pressure on that disgusting tall machinery you have managed to eventually trap it in the northwest side of podlocks towards northwest caves

  Without your help the beast would have rendered wiping talls much more difficult for us

  With Love -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Mature Carrier (SH-562-A) is awarded the Royal jelly of proliferation: 'My dear daughter SH-A

  I bestow upon you this jelly of proliferation for trapping so, so many places

  I believe from what I've heard, and from what I saw with my own eyes

  First of all your trap has managed to capture the foolish lurker who had stepped in it in TMCC trying to secure a kill on one of the runners

  Secondly I have heard and as well you have been recommended to be given this jelly by placing a trap, which was essential for a capture of the tuber

  I believe you will make a great prime carrier, or whichever caste you wish to pursue in the future

  With Love -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Young Hivelord (LY-807) is awarded the Royal jelly of proliferation: 'My dear young hivelord LY

  I give you this jelly of proliferation for your constant building support

  You have been building nonstop from dyna to northwest cave when I have asked for support there

  Your building was an essential part of holding the northwest cave away from a tall push

  I truly am grateful for you today my daughter

  Whichever path you choose, whichever is your first prime, I am sure you will make a great sister

  With Love -- Ancient Queen SQSH' by Ancient Queen (SQSH)




