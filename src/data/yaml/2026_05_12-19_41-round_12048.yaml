roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ronald Laborde, Laika, Jump-And-Stamp, Auburn Wetering, Grimm Nids, Karl Schmidt, Bella AW R0635, Arioch 'Phoenix' Arcalis, Adrian 'Hawaiian' Cook, Resha Wyoming.



  Royal Jelly Awards:

  Young Drone (ST-393) is awarded the Royal jelly of rejuvenation: 'ST, I listened and saw with my own eyes how you were on this battle field today. You were the one always giving your claw to your fellow sisters ensuring they could continue to work, not only that you supported me with your work to thrive. Thank you ST and I give you this Jelly to remember this day. REJOICE!


  See you in the next hive.' by Elder Queen (VCR)

  Ancient Ravager (DA-969-RK) is awarded the Royal jelly of slaughter: 'DARK, I watched you today with your ravager sisters, just one of many but you in already a high regard with the other ravagers stood proud. You brought many talls to your knees and into the loving arms of queen mother to bring new sisters, you did this with ferocity and RAGE. So today I reward you this jelly to remember this day. REJOICE!


  See you in the next hive.' by Elder Queen (VCR)




