roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Agile Furrington, Scarlet Usta, Astanya Kale, Eat-the-Grenade, Renii, unknown, Dominic Howell.



  Royal Jelly Awards:

  Mature Ravager (SKY-332) is awarded the Royal jelly of resilience: 'Spikes and bones, talls suffered from barely batting an eye on me, you were there always for me, and unfortunately died for it, i speak for the entire hive and we all thank you for which we were gonna face certain defeat without you, i was not aware bone could grow that fast but for sure the bullets you took for me must have accounted for it.


  You will remain forever in my mind and hopefully in our hivemind, thank you!' by Prime Queen (BUH)

  Prime Praetorian (MIA-26) is awarded the Royal jelly of slaughter: 'You dance, and you shall dance once more, don't listen to those talls... those pesky talls don't appreciate the true art of dancing, focus on your true audience, your sisters and i speak for them all, we LOVED your performance, However... you must come to me later to teach me how you did that move... y'know... the one where you take your claw to the side... and MURDER THEM ALL!!!' by Prime Queen (BUH)




  [bold]Operation funded by [color=green]TAAAAAAANK!!![/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
