roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Licks-The-Beans.



  Royal Jelly Awards:

  Elder Drone (AA-112) is awarded the Royal jelly of rejuvenation: 'AA was just outright a master of her craft! She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. Talls pushed us, and AA said no thank you not on my watch. Praised be the queen mother, all future wars will be won with her by our side!' by Ancient Queen (LIMA)

  Young Hivelord (SY-217) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls, although this award belongs partially to the rest of the lords as well. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Ancient Queen (LIMA)

  Young Carrier (JP-304) is awarded the Royal jelly of sabotage: 'JP survided slaughter from all sides! Guess what, talls got exactly what they asked for children left and right! What a sight to behold. JP staid alive during the whole massacre which was incredible considering how many sticks there were! She and other carriers proved her skill as the ultimate mother and future of the hive!' by Ancient Queen (LIMA)

  Young Praetorian (TJ-685-O) is awarded the Royal jelly of slaughter: 'Incredibly capable sister no matter her age! TJO proved herself in a flawlessly executed rush! Her accomplishments did not stop there, as she survived the whole war, never allowing talls to push and inch. Saving sisters, killing talls, making new larva, we can only hope she continues to help us the never ending slaughter!' by Ancient Queen (LIMA)

  Elder Praetorian (FLF-433) is awarded the Royal jelly of resilience: 'As the single valkyre, FLF helped shape the whole frontline, flanking talls left and right, saving sisters and the fumbling Queen herself. Every time talls made even a bit of progress, FLF utterly denied them. Every time bird spat on our sisters, FLF was there to save them! Many lives were saved because of her presence, and talents, and her presence secure the victory!' by Ancient Queen (LIMA)




