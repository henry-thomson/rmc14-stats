  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Elder Burrower (XX-564) is awarded the Royal jelly of proliferation: 'Had some amazing caps through clever usage of tunnels. Well done. The hive is proud.' by Elder Queen (HS-56-Q)

  Mature Defender (TTN-349) is awarded the Royal jelly of resilience: 'Stayed a defender since the begining, and lived to tell the tale. They were in active combat to boot, and performing very well. Amazing job!' by Elder Queen (HS-56-Q)

  Elder Drone (NA-856-M) is awarded the Royal jelly of resilience: 'Brought back a sleepy sister despite other sisters showing consistent impatience and frustration. This took a long time, good on you for sticking with it!' by Elder Queen (HS-56-Q)




