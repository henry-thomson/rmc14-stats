roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Daria Kaards.



  Royal Jelly Awards:

  Mature Ravager (NIM-564) is awarded the Royal jelly of slaughter: 'when talls decided to go into research we surrounded them, this sister wiped those talls with their own 2 claws. not just a single wipe, she wiped the talls twice when backup came... REJOICE!!!' by Ancient Queen (HEN)

  Prime Ravager (CHO-270) is awarded the Royal jelly of slaughter: 'during times of need this sister blocked tall spit from hitting me and fellow sisters. ontop of that they used their shards to kill talls at research. coming close to death twice. A sister who is ready to sacrifice it all for the hive... REJOICE!!!' by Ancient Queen (HEN)

  Prime Warrior (FAN-130) is awarded the Royal jelly of rejuvenation: 'this sister used their strong will and old claws to pull talls into eggs. giving us more sisters to fight with. also ontop of that they pulled many crit sisters from the frontlines saving their lives... REJOICE!!!' by Ancient Queen (HEN)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]Cocaine Accessories[/color]![/bold]
