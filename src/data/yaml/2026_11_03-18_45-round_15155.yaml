roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Jaun Riko, Motya Mikhaylov, Ash Herald, Ummidia Subrufa, Clancy Playford, Samuel 'Cabbagehead' Bairstow, Odvard Asmaryan, Fred Messer, Adzi 'Alcoholic' Marz, Isaac Scorchedwing, Envy Syltran, Ups-The-Downs, Harmony Holt, Rhok'zan 'Roxy' Blackwood, Ervar Hayes, George 'Huey' Huebert, Tato 'Crispy' Prank, Nero 'Boomer' Pero, Zygiella Scenicus, Adele Kerberos.



  Medal Awards:

  Private First Class Ruco 'Roz' Amenaza is awarded the Distinguished conduct medal: 'Private First Class Ruco 'Roz' Amenaza has, on their own initiative, began a massive project renovating the memorial of the fallen aboard the UNS Almayer. This memorial brings a lot more honor to our fallen, and allows us to properly send them off into the stars of the Galaxy. For your efforts, PFC Amenaza, I award you the Distinguished Conduct Medal. 


  Awarded by Maj. Hudson 'Hungry' Demuth on 03/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





