roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Emery AW Lorraine, Jonathan Bellford.



  Medal Awards:

  Gunnery Sergeant Wets-the-Drystone is awarded the Bronze heart medal: 'GySgt. Wets-The-Drystone had shown great initiative during Operation Sortie Spartan-Hammer, leading the initiative in many of the offenses despite the risks they posed to themselves. Despite being repeatedly brought to the brink of death and back, their effectiveness never waivered.


  We need more marines with the faith and the will to perform their duty no matter the cost shown today by the GySgt. Wets-The-Drystone. Though they paid their life to set the example, this medal will see them rewarded and remembered for it.


  Awarded by Maj. Kaitlin Zalack on 25/06/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





