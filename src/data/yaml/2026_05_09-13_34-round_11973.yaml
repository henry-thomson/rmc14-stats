roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Killian 'Priest' Benala, Drake 'Dietcola' Di'Angelo, Kaya 'Crackshot' Rodriguez, Clarence 'Geezer' Reategui, Juno 'Kleptocat' Kaneko, Ups-The-Downs, Jean 'Silencieux' Buveuracharne, Michael 'Mikey' McGoggins, Henry Spark, Gloop Gatsby, Xaeter Xeqxaeq, Leucauge Algarve, Aelica 'Mom' Danara.



  Medal Awards:

  Gunnery Sergeant Bennett Mortland is awarded the Distinguished conduct medal: 'Gunnery Sergeant Bennett Mortland during operation Strategic Response Program Echo-Zulu performed exceptionally well under stress. During the queen's constant rotations to colony, caves back and forth, Bennett kept up cohesion and their squad together, repelling countless assaults from a relentless foe. This is commendable as most squads would falter under such pressure. Without Mortland's efforts this operation would've been in grave danger. Excellent leadership today Bennett.


  Awarded by LtCol. Sicilia Drakonovisch on 05/09/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Lance Corporal Harlon Wolf is awarded the Distinguished conduct medal: 'Lance Corporal Harlon wolf used the mortar exceptionally well during today's operation. I personally witnessed exceptional use of it in our pushes to nexus and clearing colony once more. Those shells cleared the path for us to suprise and score many kills. Exceptional work today.


  Awarded by LtCol. Sicilia Drakonovisch on 05/09/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





