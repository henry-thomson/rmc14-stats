roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Artem 'Mogli' Volkov, Andrea 'Dre' Newbern, Nahami, Terrell Vanleer, Tricky Pip, Lily Wells, Sol Umber, Yuki 'The Cat' Suzuki.



  Royal Jelly Awards:

  Prime Hivelord (SIP-71) is awarded the Royal jelly of rejuvenation: 'this sister, along with TAZO helped us hold down both pylons with WONDERFUL build. while i was dancing around they were fortifing the backlines giving us enough time to hold them down... HEE HEE' by Ancient Queen (MJ)

  Mature Hivelord (TA-919-ZO) is awarded the Royal jelly of rejuvenation: 'this sister, along with SIP helped us build up both pylons with AMAZING build. while i was doing my choreography around the talls, they were fortifing the backlines giving us enough time to hold them down... SHAMONE!!!' by Ancient Queen (MJ)

  Prime Praetorian (ZZZ-176) is awarded the Royal jelly of slaughter: 'THIS DANCER is not a backup dancer. they are the MAIN DANCER. the one the hive needed the most, the one who captured the most, the one who moved the best around tall spit, the one who danced the best. helping us secure caps and kills. dancing us to victory... OW!!!' by Ancient Queen (MJ)

  Young Hivelord (SH-713-V) is awarded the Royal jelly of rejuvenation: 'This sister was also among the great builders. helping build up the backline while i was distracting the frontline. without their help we would be missing a king and a hive... WOO-HOO!!!' by Ancient Queen (MJ)

  Drone (KTO-564) is awarded the Royal jelly of proliferation: 'this sister brough us many drinks and plants to eat on while dancing the talls away. without their help the hive would be still down trying to perform their final concert and earn the respect of queen mother... OOH!!!' by Ancient Queen (MJ)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



