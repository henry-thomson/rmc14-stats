  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Ezra Hohenzollern, Apollyon Wills.



  Royal Jelly Awards:

  Mature Hivelord (AL-482) is awarded the Royal jelly of proliferation: 'For leading your sisters in the arts of building. You rebuilded hydroponics, Messhal, dorms. You also rebuilt north section of marshal. With that said, you deserve this jelly for providing efficient results to the hive that I am even to say impressed. It so rare to see leaders lead in these times, and I like to encourage that behavior. Thank you for leaning off the pressure of having to lead every section of the hive. Rejoice!' by Prime Queen (PRO)

  Young Carrier (J-567) is awarded the Royal jelly of proliferation: 'For setting up eggs for the hive that made it tremendously easier during dire times, I thank you for making it where talls were easily put to sleep where needed. Rejoice!' by Prime Queen (PRO)




