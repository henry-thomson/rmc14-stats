roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Minji 'Failsafe' Sodgrim, Reika 'SweetTooth' Inazuma.



  Royal Jelly Awards:

  Elder Boiler (MAT-379) is awarded the Royal jelly of slaughter: 'I have no words, this daughter, with support singlehandedly caused the entire yellow force to panic. They breached the perch multiple times, killing scores of yellows each time. Alone they caused such panic in the tall ranks that the entire tall force had to come just to attempt to silence her. We all look to you in amazement. Bravo!' by Prime Queen (ARG)

  Elder Hivelord (LPH-628) is awarded the Royal jelly of sabotage: 'This daughter has lead the build team from the very start. They have lasted two mothers and countless tall attempts to stop them. They crafted the grand hive we see today, and without them, we would not live. It is no small feat what you have achieved, the wisdom you have shown. We thank you for your work. Rejoice!' by Prime Queen (ARG)

  Elder Drone (BO-162-B) is awarded the Royal jelly of resilience: 'Many daughters have helped in the build teams efforts. You were chosen as the most dedicated. Although the patterns of the resin were lain before you. Your claw has touched each wall and door that graced our hive. Each spit blocked, each daughter saved by your shield is a testimony to your work. Bravo!' by Prime Queen (ARG)

  Prime Praetorian (RAD-459) is awarded the Royal jelly of resilience: 'Our last surviving valkyire. Without you this victory would not have been possible. You have followed mother faithfully and captured, clawed and saved this hive from destruction. Your age and wisdom yet grows and we thank you for the dedication!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Scouts' Banana Cookies[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
