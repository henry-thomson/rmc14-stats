roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Huey McLuvin, Alicor 'Pinkie' Merow, Nezuni-Arksai.



  Royal Jelly Awards:

  Mature Drone (DA-465-N) is awarded the Royal jelly of rejuvenation: 'I saw a tuber that everytime that they tried tubing me, got spat on. A ravager killed them and wiped their caste. I went to gib. No one helped but the ravager...


  Talls counter pushed and put me at brink of death. Due to DAN sacrifice, i was able to live.


  Rejoice my daughter, if conditions were better, tuber would be dead because of you. But, nonetheless, i live because of you.


  May your dedication be eternal!' by Prime Queen (RP)




