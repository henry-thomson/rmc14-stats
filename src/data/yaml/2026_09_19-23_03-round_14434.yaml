roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vulfstagmir Zadovsky, Graeme Wolff, The Rain of Resilience.



  Royal Jelly Awards:

  Elder Praetorian (SL-581) is awarded the Royal jelly of slaughter: 'Frankly. I'm jealous, I wasn't aware queen mother made us with tails this long. You reached them so far. Even into their fob. Moreover, It reaches their dreams, and forever more into their nightmares!


  Who said anything about oppressor being a capture demon, how about a MURDERING DEMONS! Talls guts are now a carpet for the king and queens arrival' by Prime Queen (BUH)

  Ancient Carrier (STU-631) is awarded the Royal jelly of rejuvenation: 'The muffled scream of talls is a true melody to my ears... aah... 

  You sought to distinguish yourself by... undeniably saving my life from certain death! 1 spit away would had done it and the hive would had been doomed by hivekiller. But you did it. You saved it. Take joy in this jelly, even though its not enough. My alacrit is in short supply so i can't help you there.' by Prime Queen (BUH)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Momma Kanin's Sandal[/color]![/bold]
