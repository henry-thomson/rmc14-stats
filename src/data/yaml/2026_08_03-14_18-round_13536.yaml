roundEndText: >2-

  UNMC After Action Report

  UNMC High Command Eyes Only


  “...what's the point in writing this… I don't know if you will even receive this message… the world has gone quiet and we don’t know what to do. ARES is recommending we put people to sleep while we figure things out. The only thing we do know is that the world is a lot quieter than before…”


  “Where did you all go?”


  Episode 1 Complete


  Event markers

  You have lost the ASRS for now.

  Two SPP Sappers and their dropship are available

  Normandy is inoperable for now.

  A bluespace relay booster has been installed.

  Supplies are limited, but not critical

  The Tri-Galactic Joint Task Force is a group of interest.

  The Calamity is your biggest threat now.


  Someone on the Almayer is working against you.


  New objective. Travel to the last known 3G-JTF site at Hybrisa, or get more supplies at Kutjevo.



  In memoriam of our fallen soldiers:

  Micah Atweeke.





