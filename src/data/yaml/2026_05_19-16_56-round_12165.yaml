roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Valery AW Akula, Caesar Emperor, Mary Squibb.



  Medal Awards:

  Captain Malik Fulton is awarded the medal of valor: 'Captain Malik Fulton has exceeded my highest expectations. His consistently exceptional initiative and leadership clawed victory from the jaws of defeat on several occassions. Thanks to his unwavering dedication to duty and valour in the face of the enemy, many lives were saved and a formidable Xenonid colony exterminated. Despite his seniority and good record, he continues to defy both expectations and the odds, even under extreme duress.


  Awarded by Maj. Clyde McKinney on 19/5/2126. 2nd Company' by Major Clyde McKinney

  Second Lieutenant Luanne Greenawalker is awarded the Medal of exceptional heroism: 'for sneaking behind xeno lines all on your own unnoticed by the whole hive. in doing so you killed an immature queen in their hive and disrupted their hive mind for that much longer for us to fight harder. this show of heroism is outstanding even for you. someone ive seen fight off hordes of enemies on your own. its a damn shame you were captured right after but i know you knew they would swarm  in right after the kill. i salute you and your sacrifice


  Awarded by Col. Tyr Ragnarson on 05/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson



  Royal Jelly Awards:

  Ancient Praetorian (FR-120-NC) is awarded the Royal jelly of slaughter: 'FRNC, despite my numerous deaths, your efforts for the hive have helped it win today's battle. It was a hardfought battle and there was little to do as dancer without a queen, but still you have managed to capture many talls this day.


  For you great work, I award you this jelly.


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Hivelord (MO-347-F) is awarded the Royal jelly of resilience: 'MO-F, you have done great this day! You and your hivelords sisters have built the entire backline of the talls while they were being distracted by my deaths, silly me. You have provided great cover for your sisters and have allowed us to prevail this day.


  For this, I award you this jelly of resilience to commend your efforts.


  See you in the next hive!' by Ancient Queen (NEV)

  Young Hivelord (PU-831-P) is awarded the Royal jelly of resilience: 'PU-P, you have done great work today! You have helped construct the entirety of the tall's backline with your fellow hivelords, providing us with the necessary cover to capture and kill those pesky talls.


  For your work, I award you this jelly of resilience. I hope to see you do great work out there again.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
