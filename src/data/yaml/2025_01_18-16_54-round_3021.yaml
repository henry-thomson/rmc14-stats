  Royal Jelly Awards:

  Young Crusher (XX-767) is awarded the Royal jelly of resilience: 'Risked their very lives to stay on me at all times and prevent my own death, I would not be here without this daughter.' by Mature Queen (NL-444-L)

  Elder Praetorian (SL-761-W) is awarded the Royal jelly of slaughter: 'Has survived for a long time in battle, only dying due to my own mistake of pushing in too far and too open, died taking spit for us, allowing us to escape, while also contributing to many slayings on' by Mature Queen (NL-444-L)

  Elder Burrower (XX-956) is awarded the Royal jelly of sabotage: 'Distracting talls behind their perch, even killing and securing two behind traps, very funny and keeps them split. Well done.' by Mature Queen (NL-444-L)

  Mature Crusher (MA-598-C) is awarded the Royal jelly of resilience: 'Survived the whole ordeal, protecting sisters, and leading charges to break tall cades and secure caps. An outstanding daughter for sure.' by Mature Queen (NL-444-L)

  Mature Drone (RS-965-E) is awarded the Royal jelly of rejuvenation: 'Spent their entire lives as a healer, healing our daughters back up so they can continue the fight in the front, even giving their life to heal the others. Thank you for support your xisters.' by Mature Queen (NL-444-L)




