roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Soft 'cedar' Linden, Dante Minnie.



  Medal Awards:

  Juno 'Kleptocat' Kaneko is awarded the Distinguished conduct medal: 'Commended for exemplary performance as our Gunship Pilot during Operation: Peacekeeping Mission Reactive-Mike.


  2nd Lieutenant Kaneko displayed great attention to the battlefield managing to secure multiple perfectly timed strategic airstrikes which resulted in several Tier 3 xenonids being dispatched with brutal efficiency.'

  Wayne 'Stiches' Kali is awarded the Distinguished conduct medal: 'Awarded for displaying exceptional marksmanship during Operation: Peacekeeping Mission Reactive-Mike.


  During a critical moment during the Operation,  Corporal Kali as our Sniper specialist managed to land a killing shot on the fleeing XX-121 Queen resulting in her brutal extermination from the planet Shivas Snowball.

  I can't help but applaud your tennatious spirit, which pushed you to advance without fear, This is the true marine spirit.'





  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



