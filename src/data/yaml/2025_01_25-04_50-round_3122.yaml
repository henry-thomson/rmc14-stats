  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Young Carrier (MY-794-B) is awarded the Royal jelly of proliferation: 'This carrier made sure that the hive was fully stocked with eggs, and let me know when we were running out. They also infected many talls who were captured, so for that, I offer the jelly of Proliferc' by Mature Queen (DB-732)

  Elder Runner (NAM-527) is awarded the Royal jelly of proliferation: 'This runner got many captures whenever I screamed, keeping the hive fully stocked with children! For this I believe this deserves a Jelly of Prolifercation!' by Mature Queen (DB-732)

  Mature Lurker (CRY-379) is awarded the Royal jelly of proliferation: 'Whenever I looked through the eyes of this lurker, they were dragging away a capture! Whenever I was at the frontlines they were dragging away a capture! For this, I believe this lurker deserves a jel' by Mature Queen (DB-732)

  Young Boiler (DR-571-D) is awarded the Royal jelly of slaughter: 'Our one and only boiler for when the talls came down to kill us! They have done an amazing job killing the talls and holding them back when things were not looking the best! For this, I give them the' by Mature Queen (DB-732)

  Mature Hivelord (DI-822-E) is awarded the Royal jelly of resilience: 'This hivelord kept building and building, making sure that when we were flanking the talls that there was little open space! For that I present the Jelly of Resilience! Rejoice!' by Mature Queen (DB-732)




