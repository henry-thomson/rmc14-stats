roundEndText: >2-

  [color=yellow]HERMES begins to cypher away at those coordinates.


  There is a . . . odd air in the Golden Arrow - One mixed of dread and hope. 'War-Eaters?' . . 'Adelheid'? What could it mean . .


  All that you know is that those coordinates lead to elsewhere, somewhere important to those ADVENT bastards.


  You want to save your fellow sun riders? Destroy those War-Eaters? Apprehend Schmidt? Then you march forward, unto those coordinates, unto the dawn.


  OPERATION "ADVENT SHADOW" has begun.


  In remembrance of the fallen:

  Alexa-Lotl, Olivia Lambert, Jeb Swarmer, Bradley Hawkins, Porto II, Primm 'RustBolt' Harrison, Asuka Hiura


  And the captured:

  Talon 'Bassmaster' Best, Braxton 'Brax' Demuth


  Dead SPP

  Rupert Quint, Kalako, The Plateau of Decay, Heir-Am, Eli Kuster, Madagascarchaea Thoracica, Jayden Reade, Xaaqker Ke'xer, Taeqxerr Xum'xuq, Ty Parkinson, Dolores Harding, Keen-eyes Squeakwell, Naoli, Chana-Keel, The Leaves of Perseverance, Kashar Rilora, Eijali, Juan Dimeling, Amber Zalack, Shylar Thryssalis, Ralomi, Eilun, Xeter Qarrxer'qerr, Audrina Owen, Sanax-Baseenar, Taeqxaeq Qarrxum'xum, Taylor Konala, Scott Basinger, Ghulzan Myrenthis, Vrexor Coralith, Duke Ludwig, Eilun, Thomas Ullman, Tayshaneta Sauvagesi, Emery Meissner, Ermintrude Carter, Jayene Artino, Jaseen-Gah, Silm-Weebam, Neza, Varzin Xilareth, Big-heart Quinn, The Plains of Balance, Qerrter Xue'taq, Kerrxum Taeqkeax


  Captured SPP

  Rosa Pycroft[/color]


  In memoriam of our fallen soldiers:

  Asuka Hiura, Olivia Lambert, Alexa-Lotl.





