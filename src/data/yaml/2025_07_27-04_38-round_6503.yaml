  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Kenichi 'Bajillion' Kanezuki, Marshall Poley, Valek, Austin 'Un'Lucky' Eventide, Anthony Jones, Hudson 'Joker' Dwayne.



  Royal Jelly Awards:

  Mature Ravager (TO-831-MB) is awarded the Royal jelly of slaughter: 'In the storm of spit that ended your very own mother, you stood tall. You endured without pause, without plea, and without faltering. In your defiance, our hive stood strong, allowing us the opportunity to strike back in a fury of flesh and rage. Let the blood on your claws glisten and your name be remembered.' by Elder Queen (INK)

  Elder Praetorian (NOO-316) is awarded the Royal jelly of slaughter: 'I honor the carnage carved by your claws and the momentum born of your bloodlust. I commend you dedication in leading the charge into the fray without hesitation. Your actions shattered their lines, broke their spirit, and painted the walls with proof of our supremacy. Let your name be eternally remembered.' by Elder Queen (INK)

  Elder Lurker (ORB-423) is awarded the Royal jelly of slaughter: 'You ran headlong into the talls, knowing that your end would not be a scream, but a searing kiss of acid turning flesh to slurry. All those believing themselves to be survivors found only melting ruin. You were not just a weapon, but purification itself. Let your name be remembered for the sting of acid and the silence that followed.' by Elder Queen (INK)
