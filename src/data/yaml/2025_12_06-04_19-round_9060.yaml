roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Cheech, Porco 'Pork' Jones, Tish Hughes, Michael Stick, John Nahami, Jesse Sandys, Qerrter 'Pearl' Xaaqxum, Pieter Von Akkerman, Sam Osterwise, Geem 'Drop Pod' Etaku, Gold Moonshine, Restless Haven, John 'Unremarkable' Doe, Blake Stone, Rhys Hendricks, Casimir Conrad, Recro Nighteyes, Zeke 'Iron' Feller, Marilyn McKee, Jade Ware, Sebastian 'Lucky' Wilhelm, Lilith AW Derringer, Buck Owens, Rako Gentle, Yahir Lineman, Lexi 'Black Orchid' LaVaux, Rosco 'Sips' Springs, Pepper, Emily Archibald.



  Royal Jelly Awards:

  Young Hivelord (QQ-356) is awarded the Royal jelly of proliferation: 'For your immenseful impact on the battlefield, as a hivelord you made sure to rebuild everything from the most open fields, to the most cramped places. You were there to live and learn through it all!


  The structures that fall were rebuilt by your own claws, skyscrapers that can beat the toughest of metal hives.


  May you remember this moment of your great dedication as a hivelord, and a great architecture of design.


  Rejoice!' by Prime Queen (PRO)

  Mature Ravager (KE-744-EN) is awarded the Royal jelly of slaughter: 'For your immense impact as a berserker, when the hive needed it the most. You ravage through the front line, with no fear no hesitation.


  Even if there two tubers, you turn them into swiss resin!


  You were a late tier 3 that the hive needed and me and everybody appreciated your performance!


  May you a true berserker for future hives! Rejoice!' by Prime Queen (PRO)

  Mature Crusher (JE-979-PH) is awarded the Royal jelly of resilience: 'You were the crusher, the last defense the hive had. I generally though things were going to go horrible. but no! You stood there firm denying the tall advance as much as you could.


  You bought precious time, not just time for me, but time for everyone to grow and molt into powerful warriors.


  Without you, the hive would of been defenseless, Rejoice!' by Prime Queen (PRO)

  Young Crusher (TO-64-MB) is awarded the Royal jelly of resilience: 'You were the crusher, the last defense the hive had. I generally though things were going to go horrible. but no! You stood there firm denying the tall advance as much as you could.


  You bought precious time, not just time for me, but time for everyone to grow and molt into powerful warriors.


  Without you, the hive would of been defenseless, Rejoice!' by Prime Queen (PRO)




