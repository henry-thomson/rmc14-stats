  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Trogloraptor Sundaicum.



  Medal Awards:

  Staff Sergeant Kyriss 'Snow' Winters is awarded the Medal of valor: 'During Investigation Line-Delta, while isolated and facing multiple xenonid combatants, succeeded in rescued three dead marines through constant flaming and tactful movement in a way that reflected great credit upon themself and the UN Marine Corps as a whole. Your bravery, even throughout doubt, is above and beyond all expectation.' by Lieutenant Colonel The Force of Nature





