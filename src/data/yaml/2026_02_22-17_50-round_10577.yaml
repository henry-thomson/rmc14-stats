roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  The Thorns of Stillness, Ryhor Steel, Davlat 'granddad' Lukin, Noah Fisher, Colette Cote, Runo Mars, Andre Yeskey, Lucian Sepher, Belfor 'White' Waylo, Silas Candlewing, Naakoni 'Cinders' Uton, Tycho 'Taco' Miller, Atypoides 'Trigger' Gracilicolli, Sips-On-Puddles, Finch 'Hero' Ward, Ronald Laborde, Winston Wehster, Zixxum, Ratch-Marz, Lydia Lowe, Norman Normel, Chad Boswick, Aristu Nivalia, Zaine Longspirit, Joakim 'Tuna' Thoveson, Minerva AW Nunchucks, Santiago 'Dubloon' Bonny, Anthoney Swafford, Mizooki 'PillBug' Akiya, Zeke Basinger, Chee 'Pressure' Mach, Elias Jackson, Ardy 'Ape Man' Guy, Paul Quota, Oliver 'Rolling' Stone.



  Medal Awards:

  Sergeant Culls-The-Leviathan is awarded the Distinguished conduct medal: 'Sergeant Culls-The-Leviathan proved to be a competent Squad Leader.

  For his reliable, strong and consistent leadership during Operation Shotgun-Viper on the colony of Solaris Ridge.

  I wish to see more people like you in the UNMC.


  Awarded by Col. Freya Locke on 02/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke

  Corporal Archibald 'Ripcord' Butterfill is awarded the Distinguished conduct medal: 'For exceptional service as a corpsman, saving numerous marines through skill, composure, and unwavering dedication fighting the Xenonids during Operation Shotgun-Viper on the colony of Solaris Ridge. 


  Awarded by Col. Freya Locke on 02/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke

  Captain Guillermo Parker is awarded the Distinguished conduct medal: 'For exemplary leadership as Executive Officer and for providing consistent assistance and good judgment throughout Operation Shotgun-Viper on the Colony of Solaris Ridge.


  Awarded by Col. Freya Locke on 02/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke





