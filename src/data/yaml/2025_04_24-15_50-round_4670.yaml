roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In Flanders fields...

  In memoriam of our fallen soldiers: 

  Ivan 'DGun' Uvarov, Nikolai 'Ice' Ivanovitch, Javon 'ill-gotten' Nash, Ash Winter, Jean 'Silencieux' Buveuracharn, Terrence 'T'Chankla' Chenkla, Kandi Kaine, Spike MacLagan, Chee 'Pressure' Mach, Carmen 'Cadaver' Cortez, Kamiel Lancoaster, Elizabeth Burns.



  Medal Awards:

  Freya 'CC' Locke is awarded the Distinguished conduct medal: 'Captain Freya Locke lead the operation groundside, keeping the cohesion high among the squads, leading to the defeat of a multitude of xenonids and multiple established hives. God speed Freya Locke, y'



  Royal Jelly Awards:

  Young Carrier (FI-601-SH) is awarded the Royal jelly of proliferation: 'Yer clever traps lead to 13 wonderful captures fer tha hive, and personally ya helped me capture 3 talls that stupidly rushed me. Fer that reason ah will bestow upon ya the jelly of proliferation.' by Elder Queen (JOHN)

  Young Carrier (SC-875-R) is awarded the Royal jelly of proliferation: 'As ae carrier ya infected and captured many talls fer tha hive. It was ae honor tae have you as one of mae children fer this battle, and ah award you tha jelly of proliferation.' by Elder Queen (JOHN)

  Elder Praetorian (GIB-713) is awarded the Royal jelly of resilience: 'As ae oppresor ya performed ae fantastic job defending tha hive. During our rough battle in tha caves I saw ya stop talls in tha advance and you have earned tha jelly ae resilience for yer great feats' by Elder Queen (JOHN)

