roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bailey Warren.



  Royal Jelly Awards:

  Mature Lurker (KV-306) is awarded the Royal jelly of proliferation: 'You were capturing talls for the horde left and right, no matter where you went, you were making absolute progress even at the brink of death. In the shadows you lurk waiting for the next target to be struck down by your own claws! They never stood a chance against you no matter the area. thanks to your cunning and intelligence of well timed pounces you captured quite a good amount of high priority talls in the earliest of engagements. This was in the battle of Fiorina! Rejoice!' by Prime Queen (PRO)

  Young Warrior (GAS-391) is awarded the Royal jelly of resilience: 'You were a warrior during the early engagements of Fiorina, where you decided to sacrifice yourself in order for tuber downfall. I thank you for commiting for such engagement like a true warrior. You did absolutely amazing I hope you enjoy it as much as I did. Thanks to that I was able to gib the tuber and remove them, making it 3 out of 4 special talls remaining in such short time frame! Rejoice!' by Prime Queen (PRO)

  Young Boiler (REX-316) is awarded the Royal jelly of sabotage: 'For providing great boils during the early engagements of Fiorina, you were granting your sisters good smoke screens, and also denial on shaking and making captures even more easier. I thank you for doing these as it allowed us to prosper. Great job on keeping up with the front as a young boiler. Your help as one out only or one of very few boilers was greatly helpful Rejoice! May your acid burn all those who dare to push!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of fresh Froots[/color]![/bold]
