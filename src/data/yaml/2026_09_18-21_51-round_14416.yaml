roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hans Brandenburg, Perrin Softfeather, Erika Taylor, Velenys 'Elfie' Thalorien.



  Royal Jelly Awards:

  Mature Hivelord (HE-760) is awarded the Royal jelly of proliferation: 'You were a true resin whisper, summoning pillars of resin as shields for your sisters. you did more than just your purpose, you protected those around that kept the hive together. You cover allowed many more captures along the way, and including denying harm to others. Rejoice for your dedication!' by Prime Queen (PRO)

  Ancient Crusher (OLT-464) is awarded the Royal jelly of resilience: 'During the great battle of Fiorina, you were a charger crusher who was doing quite alot of disruption that in turn allowed opportunities to arise, such as capturing talls who were hit by your charge as I made my way to them. This also allowed you to counter their attacks by preventing them from shaking when you decided to continue ramming through their lines. Keep up the good work, it rare to see a crusher use the proper way of crushing. In the sands of time you will be even an apex crusher. Rejoice!' by Prime Queen (PRO)

  Prime Drone (ASH-481) is awarded the Royal jelly of resilience: 'During the time of an engagement east of garden, a mature warrior went in critical condition at a horrendous spot. I tried to shield them, but that wasn't enough, however you came in and gave them that little boon they required to move and get out of harm way, it however costed your life, but in return allowed them to continue. Rejoice for your sacrifice for the better!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
