roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Dan Diggles, Kalaveer 'Kala' Singh, Ilina Belyaeva, Jade Ware, John 'Rook' Weller, Joe Miller, Anya Raub.



  Medal Awards:

  Kaylie 'Twin' Ann is awarded the Bronze heart medal: 'Destroyed the xenonid hive core after being left loose for a moment. The queen had gibbed you for your treachery, proving to the world that the bugs can feel fear.


  Awarded by Col. Scraps-the-Copper on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Altair 'Christmas' Nightwish is awarded the Distinguished conduct medal: 'For a stalwart defense and offense of Solaris Ridge against a highly evolved xenonid hive, I commend your efforts.


  Awarded by Col. Scraps-the-Copper on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Minji 'Failsafe' Kilgrim is awarded the Distinguished conduct medal: 'For a consistent performance with an underfunded ship throughout the entire affair of Operation Patrol Kilo-Arrow. Your strikes allowed us to sieze control of the colony from the bugs and hold on to it until nuclear hellfire could be brought forth.



  Awarded by Col. Scraps-the-Copper on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Paige Estarossa is awarded the Distinguished conduct medal: 'For leading the ship deconstruction efforts, and for assisting with the construction of our fateful FOB that held the advance of a xenonid horde countless times.



  Awarded by Col. Scraps-the-Copper on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Clyde McKinney is awarded the Distinguished conduct medal: 'For your efforts in constructing the FOB and coordinating it's manpower to hold effectively. This FOB was the reason we were able to claim victory - it took beating after beating, cades buckling, men bleeding, but it refused to yield. A macrocosm of what it means to be a marine.



  Awarded by Col. Scraps-the-Copper on 12/14/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





