roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Viktor Kemper, Vellis-Krin, Carlos Kennedy, Alexey 'Russian' Roadman, Rikki Nakesone, Vexillum Regis Obice.



  Medal Awards:

  Captain Altair 'Christmas' Nightwish is awarded the Medal of valor: 'for holding the opperation together through tremendous ground leadership. you kept morale from completely falling apart and making sure we had the facilities to get a last resort weapon. thankfully we did not need to use it. thanks to your work widdling down the bugs


  Awarded by Col. Tyr Ragnarson on 5/27/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



