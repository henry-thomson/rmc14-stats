roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Desmond Pickles, Wesha-Deeja, Selina 'Cavity' Alara.



  Royal Jelly Awards:

  Elder Lurker (LUM-286) is awarded the Royal jelly of proliferation: 'For your great exceptional lurker skills, this is rare to see on the front line, I have seen your work, and it was made it where we have capture many talls thanks to you.


  You were one of the main reason talls were slow down on certain engagements, and I want to thank you for your huge success.


  You have shown how great of a hunter you can be!


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (FA-860-T) is awarded the Royal jelly of proliferation: 'You have done an exceptional job since the beginning, you were building many structures for the hive.


  From all the to the west to the east of these sacred lands...


  You shown great commitment in your role, and for that I can only praise you with the best of the rewards that I can offer to such dedication. 


  May you prosper a thousand fold and bring forth more structures that I would weep to see in it full glory! Rejoice!' by Prime Queen (PRO)

  Young Ravager (GU-539-H) is awarded the Royal jelly of resilience: 'For your outstanding work as being the hedgehog of the hive!


  You have shown bravery and always committed to engagements, whenever you could. 


  You also acted as a great shield for others not just me, and brought distractions upon yourself as a great sponge of spit, you have done well youngster, Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
