roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Private First Class Bruce Magor is awarded the Medal of valor: 'For exceptional conduct on under duress and unflinching valour in the face of the enemy. Private First Class Bruce Magor proved their skill and bravery, maintaining critical defences, even while under constant bombardment from Xenonid boilers.


  Awarded by Col. Clyde McKinney on 19/10/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Clyde McKinney



  Royal Jelly Awards:

  Young Defender (NSK-5) is awarded the Royal jelly of proliferation: 'This sister at the beginning was our only hivelord, they built up backline and even frontline all by themselves. also sacrificing their body for me to return as queen... REJOICE!!!' by Ancient Queen (HEN)




