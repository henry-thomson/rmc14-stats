  Elder Lurker (HLX-948) is awarded the Royal jelly of slaughter: 'With courage and strength, i reward the our own exclusive jelly of Slaughter, you deserved it, you are the embodiment and representation of all our vamp lurkers today, good job!' by Elder Queen (FOOL)

  Ancient Drone (AH-786-H) is awarded the Royal jelly of proliferation: 'You didn't show cowardice, you healed our sisters even in critical situations, i bestow upon the our jelly of Proliferation, good job!' by Elder Queen (FOOL)

