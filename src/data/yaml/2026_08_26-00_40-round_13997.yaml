  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kara 'Bait' Smith, Chews-the-Wires, Khana-Yanagawa, Grant Fulton.



  Medal Awards:

  Staff Sergeant Ren Kestrel is awarded the Distinguished conduct medal: 'Outstanding leadership for Charlie, prioritized the safety of their men and helped recover identification and bodies those that wouldn't be saved. While I did not see it myself, tales of your valor were not quiet. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 8/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





