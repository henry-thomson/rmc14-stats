roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  Royal Jelly Awards:

  Mature Defender (OK-522) is awarded the Royal jelly of resilience: 'One of the sisters I am most proud to have. Thanks to their bravery and willing to sacrifice themselves for me, I managed to survive a deadly situation. They made a great example of what a great defender should be! Rejoice, OK! You are most deserving of this jelly. Queen Mother would be proud of your feats.' by Elder Queen (LOL)

  Young Boiler (XT-314) is awarded the Royal jelly of proliferation: 'One of the first born daughters that survived until the end. Thanks to their timely boils, we managed to secure lots of tall hosts and turn the tide against the slaughter coming to our home. Personally, I am thankful they covered me when I was down and helped me to recover even if it would cost their lives. Rejoice, XT! You are most deserving of this jelly. Queen Mother would be proud of your feats.' by Elder Queen (LOL)

  Young Warrior (XA-323) is awarded the Royal jelly of resilience: 'One of the daughters I am proud to have. They were there when I am at my lowest and helped me to recover from a deadly mistake that would bring an end to hive. Thanks to their bravery and willingness to sacrifice themselves for the hive, we recovered from a situation otherwisely deadly for the hive. Rejoice, XA! You are most deserving of this jelly. Queen Mother would be proud of your feats.' by Elder Queen (LOL)

  Mature Hivelord (EV-853-D) is awarded the Royal jelly of resilience: 'One of the daughters that fought tirelessly before the tall onslaught. They were there when we needed most and helped us to build chokepoints that would end tall menance. Today, they showed us how a hivelord should be to all other hiveminds! Rejoice, EVD! You are most deserving of this jelly. Queen Mother would be proud of your feats.' by Elder Queen (LOL)

  Young Burrower (PIE-672) is awarded the Royal jelly of sabotage: 'One of the daughters that allowed me to win the fight! Thanks to their efforts and timely tunnel, we were able to hijack the bird and secure our victory! Personally, she is one of my favorite daughter for thinking outside of the box and allowing us to do this. Thank you, PIE! You are most deserving of this jelly. Queen Mother would be proud of your feats.' by Elder Queen (LOL)




