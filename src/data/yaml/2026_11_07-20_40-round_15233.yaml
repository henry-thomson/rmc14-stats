roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Mota-Ocheeva, Alice Carr, Linus Cross, Breath of Ashes, Osborn 'Cheeseball' Curry, Zeke Cressman, Eats-the-Mice, Ryan Stalh, Sanford AW Sherman, Alice Coffinfill, Joseph Bailey, Sean Murray, Jasper Perkins, Tides-of-Gray, Icey Iana.



  Medal Awards:

  Corporal Okaw-Jaseen is awarded the Medal of valor: 'Corporal Okaw-Jaseen alongside Corporal Alan Braun have both operated their Armor element with excellency, trapping and securing multiple kills including the Queen. Their ability to adapt and their proactivity is one to be commended. Good work, you two.


  Awarded by Maj. Hudson 'Hungry' Demuth on 08/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth

  Corporal Alan 'Gambit' Braun is awarded the Medal of valor: 'Corporal Okaw-Jaseen alongside Corporal Alan Braun have both operated their Armor element with excellency, trapping and securing multiple kills including the Queen. Their ability to adapt and their proactivity is one to be commended. Good work, you two.


  Awarded by Maj. Hudson 'Hungry' Demuth on 08/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth

  Second Lieutenant Juan Cortez is awarded the Distinguished conduct medal: 'Second Lieutenant Juan Cortez has provided this operation excellent support with communications support, rapid medevacs and timely kills on the enemy hive.


  Awarded by Maj. Hudson 'Hungry' Demuth on 08/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





