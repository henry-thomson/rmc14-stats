  [color=MediumSpringGreen]"So- we got that intel you wanted.. you can see it all here.."[/color]


  [color=darkorange] "Humh. That's weird. Lots of these files look like they're from -that report-"[/color]


  [color=orange]"The one from the 90's? What's it talking about? The waterboarding or something?"[/color]


  [color=darkorange] "It's mostly numbers.. not much we could action with. Maybe some of the intel on proxies is workable but I imagine most of that got dismantled 30 years ago. We'll need to contact our analysts

  [/color]


  [color=MediumSpringGreen] "What report are you talking about?" [/color]


  [color=orange]"Ah- right, you're only like 20 aren't you? I guess it was beforee your time. Sit down a bit. We'll explain." [/color]


