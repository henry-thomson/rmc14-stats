  Royal Jelly Awards:

  Ancient Ravager (XR-493) is awarded the Royal jelly of rejuvenation: 'Have some faith! And once doom hit. Xippy went through her and rose to the task. After 7 ravagers ALL FELL without a single capture, she knew she has to distinguish herself and she did, dragging a neuro'ed tall, the most beautiful sight for a queen to see... my tail tapped with excitement when i saw that. And i hope you will find joy in this upmost delicacy... I don't think it beats an alacrit though.' by Prime Queen (BUH)




