roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Audrey Greenwood, Snow 'White' Pershing, Oliver 'Oil' Robertson, Garry Gimball, Bo 'Bobo' Boden, Stares-at-Stars, Joshua Lee.



  Medal Awards:

  Gunnery Sergeant Stares-at-Stars is awarded the Bronze heart medal: 'While serving as a Squad Leader during Task Force Romeo-Tango, engaged in multiple high-stakes battles against a numerically superior enemy, securing kills on countless T3 Xenonids while surrounded and separated from their squad. Your grit and courage saved this planet, and reflected great credit upon yourself and the UN Marine Corps.' by Lieutenant Colonel The Force of Nature

  Lance Corporal Scratch Patchewurk is awarded the Bronze heart medal: 'While serving as a rifleman during Task Force Romeo-Tango, acted selflessly and with great courage in the face of a lethal Xenonid hive, charging into labyrinths of resin to secure T3 kills in a manner braver than all of their peers combined. Your selfless sacrifice reflected great credit upon yourself and upheld the highest traditions of the UN Marine Corps.' by Lieutenant Colonel The Force of Nature

  Second Lieutenant Freddy 'Rumble' Marrocan is awarded the Distinguished conduct medal: 'While serving as an Intelligence Officer during Task Forcee Romeo-Tango, succeeded in acquiring multiple pieces of vital intelligence under constant threat of Xenonid hive attack. Your skill at reading the state of the battlefield and infiltrating at the right time helped us win this battle.' by Lieutenant Colonel The Force of Nature



  Royal Jelly Awards:

  Elder Hivelord (BU-3-RG) is awarded the Royal jelly of proliferation: 'From the day you were born, you were the one who had thought of becoming a Hivelord. You and your ideas were creative in making your own initiative to build the cave camp and botany alone. Your course of courage, without leadership, is profound. As well, you’re the only builder, the backbone of this hive. However, it is quite a sorrowful ending for the hive that failed to take over the planet, and the failure is saddening. However, our minds remain and switch to another physical body.


  I wished to see you again, on another body. Another mind to prevail.' by Elder Queen (SVI)




