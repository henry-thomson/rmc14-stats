roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jonathan Bellford, Clegan 'Kaboom' Schofield, Texas Ledge, Moses 'Southpaw' White, Desmond Pickles, Keegan Rockwell, Slowy Garrison, Adrian 'Archangel' Gutierrez, Kruger AW Sturmgewehr.



  Medal Awards:

  Corporal Izabella Orbatos is awarded the Distinguished conduct medal: 'For rigorously defending the western flank of caves throughout Program Rolling-Curtain, showing a great measure of discipline that eventually caused the end of the Xenonid horde on this planet. Your experience and work are exceptional.' by Lieutenant Colonel The Force of Nature

  Gunnery Sergeant Conrad Ferdiad is awarded the Distinguished conduct medal: 'Expertly lead bravo squad in their construction and defense  of the FOB while working with limited manpower and materials, as well as held off the push of an entire horde and queen, killing the queen in the process. A marine of outstanding presence.' by Lieutenant Colonel The Force of Nature



  Royal Jelly Awards:

  Elder Carrier (ENZ-300) is awarded the Royal jelly of proliferation: 'For your work in creating many eggs for our traps. Your work not only insured our experiment could continue but you have also saved your sister FLA from certain death as the talls pushed the beach. Well done daughter.' by Prime Queen (HEK)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



