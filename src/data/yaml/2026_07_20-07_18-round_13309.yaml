roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nesyo 'Hippocratic' Konuni, Adoette 'Ears' Winter, Joshua Lee.



  Royal Jelly Awards:

  Ancient Praetorian (FLO-997) is awarded the Royal jelly of rejuvenation: 'FLO, today you managed to bring YIP back to life many times. You managed to know exactly what YIP expeceted of you as valkyre and your mighty roars brought strength to YIP to stand against the tuber.


  If all valkyres worked as you did today, the tubers would not even matter at all for the hive. You would make them completely wasted potential. This is what we love to see from sisters and is why you now recieve this here jelly of rejuvination.


  YIP!!' by Prime Queen (YIP)

  Ancient Ravager (SVI-64) is awarded the Royal jelly of resilience: 'SVI, today you survived the near extinction of the hive. You may have died at the end, but your work as a ravager was mighty helpful.


  With great strength in your shield and great speed in your shed you managed to capture 9 talls, including boomsticker and flamewalker. This work may not be your most captures ever, though it most certainly is one of your greatest works given the circumstance of the hive.


  YIP!!' by Prime Queen (YIP)

  Young Praetorian (BAG-494) is awarded the Royal jelly of resilience: 'BAG, today you showed the might of your survival instincts. You managed to be the last remaining tier 3 alive in the entire hive.


  As the hive was nearing its demise you stood strong in your great carpace. You held back from the greed that kills so many. Your work is for other youngs to look at in awe. Even ancient sisters can learn a thing or two from your survival instincts.


  Great work today, keep your survival instincts sharp like this for the future and you will go to great lengths.


  YIP!!' by Prime Queen (YIP)




  [bold]Operation funded by [color=green]Isadora AW Brooke's videos of Marine Mess-ups[/color]![/bold]



