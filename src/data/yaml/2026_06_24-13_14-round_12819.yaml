roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Merlin Stargazer.



  Royal Jelly Awards:

  Young Ravager (RU-203) is awarded the Royal jelly of resilience: 'You were one of the few ravagers even if you were young, and even if this hive collapsed. You stood strong you learned quite a few tricks. I am sorry my hatred and stress was all I can say for these talls, but I loved every second we spended together. Education is harsh, but you learned so much in so little time. you made this hive proud, I hope you continue to do so. Even if the time were short. Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (CA-201-T) is awarded the Royal jelly of proliferation: 'You were one of my original hivelords, you try to follow orders and you try to do your best. I thank you for building what areas you could I thank you for every moment. Every wall placed served a purpose. Even during the hive collapse I thank you. for doing such activity. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
