roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Luanne Greenawalker, Edward 'Husk' Meyers, Beckett AW Longbow, Rhom-Basa, Darwin Commoner, Carlos Kennedy, Addyson 'Fortuna' Zappy, Olaf 'Fish-eye' Olafson, Aleksi Fraser, Erin Baker, Chews-the-Wires, Victo Sholl.



  Royal Jelly Awards:

  Ancient Ravager (SEA-689) is awarded the Royal jelly of slaughter: 'SEA, you were ruthless. The talls never stood a chance against your might. You have done amazing today, managing to capture the talls and killing many, many more. Even aftr my own mistake, you have kept up your great work, wiping the blue caste with a little support from sisters. That tuber was too weak for you.


  For this, I award you this jelly of slaughter to commemorate your great work today. Nice work.


  See you in the next hive!' by Elder Queen (NEV)

  Elder Hivelord (NOX-483) is awarded the Royal jelly of resilience: 'NOX, although I could not personnally see your exploits this day, I have received word that you have done a great deal this day. You have helped greatly with not only the construction of a great hive, but also with distracting the talls.


  For this, I have decided to award you this jelly of resilience. Good work.


  See you in the next hive!' by Elder Queen (NEV)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
