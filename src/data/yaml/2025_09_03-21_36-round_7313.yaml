roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  Medal Awards:

  Sicilia 'IronHeart' Drakonovisch is awarded the Distinguished  conduct medal: 'It is not every day that I send a captain to lead the front, as this is usually a priviledge and responsibility I entrust only myself to. However, Drakonovisch offered their services on the frontline and I was not one to dismiss. It was certainly awkward for myself, but a very comfortable experience to place so much trust in another officer groundside, knowing that marines would be coordinated, OB coordinates would be gathered, and victory would be achieved without me lifting so much as a finger.


  Awarded by Col. Scraps-the-Copper on 9/3/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Diego Ank is awarded the Distinguished  conduct medal: 'As per recommendation of your staff officer, and reviewed by myself I see it fit to commend your efforts. Our strategies today had to go a bit unorthodox, and you listened without complaint and without hesitation to fulfill the objectives given to you. 


  Awarded by Col. Scraps-the-Copper on 9/3/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





