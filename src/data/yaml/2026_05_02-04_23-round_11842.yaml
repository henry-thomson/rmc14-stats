  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Brian Gosling, Dune 'Friendly Killer' Ale.



  Royal Jelly Awards:

  Elder Defender (BO-399-B) is awarded the Royal jelly of resilience: 'At a critical moment, you decided to fortify or prevent my death altogether it worked as intended. I was at the brink of death gates, I thought I was gone BUT NO you defenders decided to save me. Providing the critical cover I required. That is rare to see I just want to say it was awesome to see that teamwork altogether. I also want to thank you for fortifying for me to gib the tuber, who was really the main reason of my close death.


  If there was even any more ounce of praise I can even give it would be zero words that could describe it. Keep it up, and always shine like that. 


