roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ash 'Cinder' Firefly, Jeb 'Kamikaze' Jackson.



  Royal Jelly Awards:

  Mature Ravager (MAD-682) is awarded the Royal jelly of resilience: 'You were a ravager till the end.


  During your onslaught for the hive, a particular moment is where I saw you fight for the hive, the moment talls were retreating the tuber appeared in my view. Instead of running you decided to charge head on and deny any hesitatance of fear. The only thing on your mind was ripping them apart. That is what I love to see in a ravager of the hive.


  For that you are being bestowed the jelly of resilience, for it may of costed your life, you were a true warrior till the end. May your fury spirit shine in future battles for the hive.


  Rejoice! We will not forget you.' by Prime Queen (PRO)




