  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Panacea, Takos Gibson, Nema-Seek, Clark Fenrir, Is-Real-Bird, Rorik 'Guppy' Harder, Ace Starseeker, Vypnom, Guaco Micheal, Glorp Blorbleson, Steven Green, Lennox Adams, Keifth 'Cash' McCruz, Elizabeth Mozie AW Mosinka, Bradley Braun, Puddin Taine, Johnny 'junior' Jhonson, Lemuen 'Hot-Wheels' En, Klein Moretti, Kudd Les, Clara Rose, Midori 'Wasabi' Tanaka, Nova Aesha, Tatiana Zaychikova, Joachim 'Tank' Phillips, John 'Butterfingers' Thorstone, Gregory Willey, Beedo Waggin, Petra Knez, Nakono, Cordelia Somniferum.



  Royal Jelly Awards:

  Elder Praetorian (FAE-839) is awarded the Royal jelly of proliferation: 'FAE.


  Not only did you saved my life in this fearsome battle, but, you did so as well with many sisters that went through this hive, I could not count how many times you did it, and that, is what amazes me.


  The protector. The Shield of this Hive. May your actions inspire many other sisters! Rejoice!' by Elder Queen (NC)

  Young Ravager (BL-405-DR) is awarded the Royal jelly of resilience: 'BLDR.


  Tall seizer, Host protector, kept the hive alive to the last breath, even when surrounded, made sure to shield your sisters and buy as much time as possible. And it for sure paid off, as I was able to break you and the whole hive out of a very dangerous place.


  And even was one of the first to listen to my command to break out, as well as securing many captures for the hive.


  For this, you deserve this Jelly, as one of the Grand three Guardians of this Hive. Rejoice!!' by Elder Queen (NC)

  Prime Praetorian (ZAI-661) is awarded the Royal jelly of resilience: 'ZAI.


  Created many opportunities for the hive to seize as many talls as possible, and not only that but made sure every pull counts.


  Many annoying talls trying to disrupt the hive, be the dizzy spitter, tall leaders pushing our beloved weeds, our garden, every single one punished.


  For that, you are the third Guardian of this hive, making sure sisters were born every time! Rejoice!!' by Elder Queen (NC)

  Mature Burrower (ABC-635) is awarded the Royal jelly of sabotage: 'ABC.


  Burrower till the end, creating many tunnels for the transport of the hive and the captured talls, making sure the Tall backlines never were comfortable to wander around.


  Harrassing yellows and the north hivemind constantly, which ultimately led us to our victory as their attempt of Hivekiller was interrupted thanks to your continous efforts.


  May you inspire many today, as your actions were of great help of the hive. Rejoice!!' by Elder Queen (NC)




