roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Andy Todd, Jimmy Boeler, Lindsie 'Lynx' Wile, Liberty AW Falchion, Molto Quibbles, Jordie 'Pepsi' Jordan, Chad 'Chadley' Bradley, Collin 'Rock' Ironside, Apollyon Wills, Miun Rongrong, Stubborn Pipsqueak, Perun Perunovski, Anastasia 'Butterfingers' Saylor, Leslie Briggs, Buck Dawkins, Nainortag 'Savior' Yofuaeb, Phoneutria Velox, Brick Rhinehart.



  Royal Jelly Awards:

  Prime Hivelord (VY-30-NL) is awarded the Royal jelly of proliferation: 'It would not be remiss to say that you were the lifeblood of the hive this day VYNL, with your outstanding leaderhip of the construction teams, and your swift but robust resin building in areas that sorely needed it. Without you and your fantastic efforts, the hive would not have lasted until the final fight. 


  For your efforts, your leadership, and your contributions to this hive, i give you this jelly of Proliferation. Long may you hive!' by Ancient Queen (CMP)

  Ancient Warrior (ARG-372) is awarded the Royal jelly of slaughter: 'By claw and by tusk, by skill and by strength, you are the warrior. 


  When all hope seemd lost, and talls were enchroachiing on our final stand, you rallied the sisters, and proposed one, final, fight.


  And thanks to you, and your preformnace that went above and beyond the call of duty, we turned a tragic loss to a amazing victory. Rejoice' by Ancient Queen (CMP)




  [bold]Operation funded by [color=green]Chief Culinary Officer[/color]![/bold]



  [bold]Hive established by [color=purple]Momma Kanin's Sandal[/color]![/bold]
