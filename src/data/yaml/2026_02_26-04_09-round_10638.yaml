  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Rhox 'Tanker' Jaex, Kayten Winters, Paulie 'Conman' Zarroni, Pisaura Florentina, Kevin Hayworth.



  Medal Awards:

  Gunnery Sergeant Stares-at-Stars is awarded the Medal of valor: 'Against both a Xenonid hive and CLF insurgents, fought with gallantry and selfless courage, facing down both the Queen of the hive and the main CLF hideout head-on. Your ferocity saved many lives today, even if they may have costed your own.' by Lieutenant Colonel The Force of Nature





