roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sir Sturgen Codsworth.



  Royal Jelly Awards:

  Ancient Boiler (EH-639-HE) is awarded the Royal jelly of resilience: 'Our only boiler this entire battle. They have withstood the test of time. Age brings many learnings and wisdom, but this daugther has demonstrated that above all, she has the grit and determination to see the battle through. On every engagement she was present to provide critical cover at just the right time. Without instruction or guidence she performed expertly. You have demonstrated that you are a force to be admired. Bravo!' by Prime Queen (ARG)

  Ancient Drone (WI-127-LO) is awarded the Royal jelly of rejuvenation: 'Your mind is old, your carapase is wrinkled. Yet this does not stop you doing what is required. Throughout this battle you have gone above and beyond. Crafting our hive, giving your life for your queen. Although ultimately in vain, you dove with no regard for your own life into the fray to save you sister and mother alike. You have earned the hives love and respect. A more worthy award I cannot give you. Rejoice!' by Prime Queen (ARG)

  Mature Hivelord (FUR-810) is awarded the Royal jelly of resilience: 'Leading the build team is no easy feat. Ussually mother would have to force a sister into this role. You came into the world screaming for it. You didnt ignore your responcibility. Independent of mother, with little guidence you lead the team of hivelords ultimately responcible for todays victory. Your guidence and teachings have enabled this hive to flourish. We look forward to seeing the hives you will one day craft. Rejoice!' by Prime Queen (ARG)

