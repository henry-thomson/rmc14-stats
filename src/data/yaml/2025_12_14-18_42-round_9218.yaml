roundEndText: >2-

  The sun rises.


  The tunnels claimed many lives, with many their bodies were destroyed by the fires, left unclaimed... forever...

  The intelligence, hopefully, was worth the great human cost to gain it.


  Wilfred Nibbleson - Killed instantly in a mortar blast


  Dusty Johnson - Died in the tunnels, bled out

  Pat Patlal - Died in the tunnels

  Sergeant Einuko Steelfeather - Bled out after a firefight in the tunnels, second operation

  Athaliah Crux - died in the tunnels

  Lance corporal Zara Cormorant - Instantly killed via direct SLAW hit

  Asaka - Killed instantaneously via direct SLAW hit

  PFC Asher Withersby - Killed trying to enter the CLF tunnels arms workshop, 

  Lance corporal Ivan D’uvarov - Killed by a suicide rocker launcher instantaneously

  Alexander king - Civilian, went into the CLF tunnels arms workshop (For some reason) Killed near instantly

  PFC Emiliano Murillo - killed instantly by a point Blank HJRA rocket

  Corporal Byrne diggers - Died in the CLF weapons workshop

  Lance corporal Shiftie  Octavious - Died in the CLF weapons workshop

  Private Eats the burger - POW, broke out but ran into a fire and died

  PFC Evelyn Cressman - Died in the CLF weapons workshop

  PFC Azure Feldivik - Died in the CLF weapons workshop

  Alexander King - Died in the CLF weapons workshop

  Private Foster hawking -  Died in the CLF weapons workshop

  Lance corporal Erin baker - Died in the CLF tunnels

  Lance Corporal Bellatrix yazhi - Died charging a CLF gunner

  Lance corporal  Chalaree Beekatan - died in the CLF tunnels

  PFC Tact - Died in the CLF tunnels

  Lance corporal Bridgett Koster - died in the CLF tunnels

  Gunnery Sergeant  Jaques Galdi - Was trapped by flames and asphyxiated

  PFC Fred Garza - Unknown



  In memoriam of our fallen soldiers:

  Eats-The-Burgers, Pat Patlal, Einuko 'Twitch' Steelfeather, Dusty 'Mothman' Johnson, Ivan 'DGun' Uvarov, Azure 'Oreo' Felvidek, Finn AW Glaive, Zara Cormorant, Athaliah 'Serious' Crux, Ted Oppenheimer, Chalaree-Beekatan, Fred Garza.





