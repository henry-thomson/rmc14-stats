roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Dodge Remington, Aelica 'Mom' Danara, Elroy Aegyr, Derick 'Naptime' Hunt, Buster 'Geezer' Alter, John Smith, Carlos catnip Menedez, Jasmine 'Paws' Faust.



  Medal Awards:

  Sergeant Snaps-the-Bolt is awarded the Distinguished conduct medal: 'Sergeant Snaps-the-Bolt you did a mind numbing over hour of battery swapping for comms allowing it to stay up for most of the OP. Then once your SL was sadly captured you took over leadership of Bravo holding it down against the Queen siege before we manage to kill her. Marine I salute you for the work you put in.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/26/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Private Ben Raden is awarded the Distinguished conduct medal: 'Private Raden you are very inexperience for Req, but despite that you quickly did whatever you could to help out req while it was overwhelmed. Private you did well today and help keep the marines in this fight.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/26/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Corporal Emma Fierce is awarded the Distinguished conduct medal: 'Corporal Fierce you put in the work today as a CT for Bravo, securing the many ways into FOB while also deconing as many walls as you could get your hands on. You and the rest of Bravo CTs work is to be admired for what you done today.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/26/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Lance Corporal Wilhelm Winkler is awarded the Distinguished conduct medal: 'Lance Corporal Winkler you help keep Charlie in this fight with the constant reviving and healing of our marines. Not only that you bravely doving into caves near Engineering to save two marines though lost. Your bravery is shown today and for that I salute you marine.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/26/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Gunnery Sergeant Mi Dan is awarded the Medal of valor: 'Gunnery Sergeant Mi Dan you kept Delta together in this long fight being the spearhead of many of our charges. Without you we would have never been able to secure victory. When we held for nuke you took it upon yourself to watch our rear and secure our way out. Then when Queen try to end this you lead a counter attack in admin managing to kill her and much of her horde. You are a model to all squad leaders of the UNMC marine.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/26/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





