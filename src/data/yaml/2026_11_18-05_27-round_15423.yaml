roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Aurora 'Birdcage' Barkheart, Russell Moon, Bailey Warren, Kiko 'Keeko' Winterrey.



  Royal Jelly Awards:

  Elder Ravager (NS-432-KO) is awarded the Royal jelly of slaughter: 'Sister. Daughter. The hive's rage ran through your blood today.. not only were you capable of following up every command, but you were always there whenever a sister, capture.. or a slaughter came to be..


  Your role in this fight led us to wipe a caste not once.. not twice.. but THREE times in the course of this fight.


  Talls could not match nor rival your strength as you've shown today. May your claws stay as sharp as they did so today.. REJOICE!' by Elder Queen (NC)

  Prime Drone (FL-112-W) is awarded the Royal jelly of resilience: 'FLW, you did not only provide to this hive, but outperformed what a gardener could achieve.. 


  Your fruits.. delicacies.. were always there along you when it mattered the most.. keeping all of this hive healthy in an evironement where we needed to move swiftly..


  This achieved us to part of the talls south of Cargo.. without your help, this hive might of not thrived as they did..


  May your help as many sisters as you did today, sharing and providing as much as you can. REJOICE!!' by Elder Queen (NC)

  Prime Drone (KI-477-AA) is awarded the Royal jelly of sabotage: 'Sister KIAA, your effort to this hive don't go unnoticed today.


  Achieved the build that stopped a diver from going too far into our nest before they could destroy it..


  With the help of your sisters rebuilding most of security so it became a living nightmare for talls to clear through again.. they were so afraid of what your walls stand for.. 


  Slowing them down enough for us to claim victory over the talls and giving as much cover as possible. May you buildings stand as strong as ever, may many talls fear what you did today.. and what you'll do in a future.. REJOICE!!' by Elder Queen (NC)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
