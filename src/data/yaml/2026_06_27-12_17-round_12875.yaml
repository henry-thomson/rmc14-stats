  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Carrier (LM-758) is awarded the Royal jelly of proliferation: 'During the battle of Veradero. You were one of our main carriers of the battle, surviving since the beginning of time, you made sure to make eggs placed to where it would put talls to sleep. None awaken from the slumber you bestowed. Thank you for being our carrier young one, you made the battle alot easier thanks to you. Rejoice!' by Prime Queen (PRO)

  Prime Lurker (MAD-225) is awarded the Royal jelly of proliferation: 'You were the demon of the night striking true! Making captures for the hive you did, but most importantly, you removed a high value target the tuber in the mist of combat. I thank you for doing so! Rejoice!' by Prime Queen (PRO)




