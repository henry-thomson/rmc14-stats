roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Pablo Gaine, Juniper 'Clownfish' Burger, Kabeni Forton, Zlu Raspberry, Beekus-Beem, Dell 'Terra' Dellitrasse, Egor Slavanka, Eus 'Snowflake' Hi'Iaka, John 'Hazard' Goose, Aster Seelis, Teeka-Teeus.



  Royal Jelly Awards:

  Ancient Ravager (JA-997-KE) is awarded the Royal jelly of slaughter: 'I award this sister the jelly of slaughter, without their incredible performance as a ravager wiping talls multiple times in a row especially the purple wipe south of dynagrid we would not have won against the talls, they have proved themwelves worthy. REJOICE!!' by Elder Queen (NEY)

  Ancient Ravager (AR-155-ES) is awarded the Royal jelly of slaughter: 'I award this sister the jelly of slaughter, their performance as a ravager is commendable, they assisted in wiping talls multiple times, protecting the south hivemind tower and grabbing tuber are amongst her many feats making her worthy of a jelly. REJOICE!!!!' by Elder Queen (NEY)

  Elder Drone (VYN-805) is awarded the Royal jelly of rejuvenation: 'I award this daughter a jelly for their incredible performance as a healer drone, they saved multiple important tier three sisters with rejuvenations and healed me and many of her peers without fail up until the end, this victory wouldn't have been possible without her. REJOICE!!!!' by Elder Queen (NEY)

  Elder Boiler (CH-277-R) is awarded the Royal jelly of resilience: 'I award this sister the jelly of resilience for not only surviving until the end of the fight while being one of the most vulnerable daughter but also for her great help in many of the wipes and the hold of very vital key areas, this victory would have been impossible without her. REJOICE!!!!' by Elder Queen (NEY)




