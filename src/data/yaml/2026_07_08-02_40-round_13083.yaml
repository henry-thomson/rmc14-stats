roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Drunthar 'Pushflamer' Stoneforge.



  Royal Jelly Awards:

  Elder Boiler (EF-577-EE) is awarded the Royal jelly of slaughter: 'EF-EE, you have done great t his day. You have helped my horde greatly by providing the boils to cover our assaults and retreats. You have helped immensely in this fight and I want to congratulate you.


  For this, I award you the jelly of slaugther for the many talls who perished this day.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Ravager (SVI-892) is awarded the Royal jelly of proliferation: 'SVI, you have been a key sister in this fight against the talls. You have dragged many talls to their doom, allowing us to expand our hive's ranks with more sisters than they could handle.


  For this, I award  you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Ravager (AR-171-ES) is awarded the Royal jelly of proliferation: 'ARES, amazing work today. You have been my best dragger, constantly securing captures at every screams. You have not only captured many, but also saved my life from bad pushes twice in a single day!


  For this, I award you this jelly of proliferation for your amazing work. Keep it up!


  See you in the next hive!' by Ancient Queen (NEV)




