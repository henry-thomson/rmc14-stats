roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Andrew Tuff, Stefan Wolle, Stony Tony, Rico Basshouse, Albrecht 'Alby' Herrmann, Nat 'Creeper' Weeter, Brittani 'Beans' Bash, Nathan Driller, Maria Sheppard, Skips-On-Water, Adriana 'North' Nachtnebel, Afraid-Of-Sunlight, Michael 'Sarge' Effectson, Dazareth Warriz, Dooka-Lei, Ashley Woodward, Takila 'Coward' Sunburn, Heinrick Archsider, Does-The-Dishes, Neoscona Orbweaver.



  Medal Awards:

  Amos 'Gorilla' Ramos is awarded the Distinguished conduct medal: 'Sergeant Amos Ramos scored a vital blow to the xenonid hive that secured our victory today, where they took out their original queen, leading to the demise of many Xenonids. Good work Sergeant.'

  Rube Chapman is awarded the Medal of valor: 'Lance Corporal Rube Chapman showed an excellent display of valor today, to which they saved multiple marines captured in a hive cluster by charging down two xenonids alone, slaughtering them and cutting down their fellow marines who were to surely burst. Admirable work today.'





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



