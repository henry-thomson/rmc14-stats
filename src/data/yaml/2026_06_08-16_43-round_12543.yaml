roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lynn 'Braindead' Styles, Warner 'Lefty' Lafortune, Fenrir 'Ghost' Kahler, Bennett Biery.



  Royal Jelly Awards:

  Ancient Ravager (LU-463-AN) is awarded the Royal jelly of sabotage: 'For capturing the tuber at Weya Cave Entrance. You captured the tuber thanks to a child and you being the cunning lurker you were, striked at the perfect moment. You won the tug of war of fighting over the now asleep tuber and prevailed. Removing an annoying advesary of the battle. I implore your efforts greatly, as it made my mind at ease. It made want to ovi longer, but the talls does not like to heed to warnings. Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (ALT-361) is awarded the Royal jelly of rejuvenation: 'For saving and providing essential support during the battle of Hybrisa, you denied the talls any kills in the hives name. I thank you for providing your sisters a 2nd chance. Because it would of waned my heart to see them return to the void to never be seen again. Your efforts have been noted, and I hope to see this continue forward.' by Prime Queen (PRO)

  Young Praetorian (XX-593) is awarded the Royal jelly of rejuvenation: 'For leading your sisters as an acting hive leader. You warmed my heart seeing you take up the mantle of communicating, even if it was tiny talk it was enough to guide them to where it was needed. I love seeing that, and I hope others can follow your example. You lead your builders in the battle of Hybrisa to where I need them to build at, thank you young praetorian. 


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
