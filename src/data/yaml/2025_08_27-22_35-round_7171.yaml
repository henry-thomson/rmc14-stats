  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Spinax 'Chewy' Bahama, Madison Klaus, Luke Marshall, Eli Baker, Zion 'Reclaimer' Erasmus, Lotash 'Matchstick' Saurmor, Evan Christopher, Tori Reef, Damen Jopper, Sizzle.



  Medal Awards:

  Clukay 'Heckler' Koch is awarded the Distinguished  conduct medal: 'Bravery diving deep into the xeno infested caves to activate the sensor tower, giving the Marines a major advantage in the moment.


  Awarded by Col. Tempestas 'Frostclaw' Glacies on 8/27/2125. 1st Frontier Regiment "Outer Guard" │ 11th Armored Battalion 'Steel Dragons'│ 8th Guard Division │ United Nations Marine Corps'

  Minji 'Failsafe' Kilgrim is awarded the Distinguished  conduct medal: 'Recommendation by 1st Lt, Catherine Laralde on the behalf of 2nd Lt Minji Kilgram for "With the support of me, the CMO, we produced well over 200 pressurized canisters of the medication mixture known as general cure. This amounts to over 980,000 units of general cure, if not over 1,000,000 units."


  Awarded by Col. Tempestas 'Frostclaw' Glacies on 8/27/2125 1st Frontier Regiment "Outer Guard" │ 11th Armored Battalion "Steel Dragons" │ 8th Guard Division│ United Nations Marine Corps'





