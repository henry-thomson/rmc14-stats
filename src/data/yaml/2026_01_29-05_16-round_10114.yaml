roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sebastian 'Lucky' Wilhelm, Stellamaris Hall, Yuki 'The Cat' Suzuki, Mothra Mothwell, Mothley Mothwell, Trisan 'BoneBraker' Mcloskey.



  Royal Jelly Awards:

  Ancient Drone (FL-32-W) is awarded the Royal jelly of rejuvenation: 'You are the shining example of what it means to support the hive. At every stage of the fight, you were there to support your sisters and provide them the healing and bonus they need to prevail. Without sisters like you, none of this would be possible. Rejoice!' by Elder Queen (ARES)

  Elder Ravager (ORB-617) is awarded the Royal jelly of slaughter: 'One of my key ravagers, you were crucial at every part of the fight. Without you, the many captures and wipes that laid the talls bare and afraid would not have been possible. My efforts would have been for naught without your support. Rejoice!' by Elder Queen (ARES)

  Prime Ravager (PRO-939) is awarded the Royal jelly of resilience: 'You are a sister of renown and today you showed the hive why you are so deservedly feared. Every scream and every push, you were there, to deal damage, push back the talls, and grab captures and whisk they away before even I could see what had happened. You assisted in my goals as I called them and without your support I doubt victory would have come as easy. Rejoice!' by Elder Queen (ARES)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
