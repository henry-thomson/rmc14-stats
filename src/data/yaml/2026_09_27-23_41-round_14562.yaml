roundEndText: >2-

  With Site Juniper gone, there is no reason to stay. It did not have the resources you came for, but it did supply you with something else. 


  Hope.


  A cure... or the beginnings of one was in reach when Saturn made their play against the Site. And though most of the personnel are gone with the blastwave, some have managed to come along with you.


  There is only one way to go from here.

  Site Delta


  MISSION MARKERS

  - You have rescued the scientists

  - You have recovered medical supplies

  - You have recovered a second humvee 

  - Spare dropship parts have been recovered

  - Spare vehicle parts have been recovered

  - A quarantine bay has been created.


  - You have found a fragment of the cure.

  - You have recovered 'The Beauty'


  - The Kursk has been damaged

  - The Blighted, if there are any, have progressed

  - Saturn and his people have shown to be able to track you.

  - A Herald of Saturn is known: Dione.


  END OF ACT 1




