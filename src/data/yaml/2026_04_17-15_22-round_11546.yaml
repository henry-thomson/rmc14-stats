roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Gallagin 'GC Addict' Caitman, Squeaky Chip, Bob Obo, Dakota Reimold, Roman Lamphugger, Eilidh Eisner, Kaska 'Punished' Teodoro, Porter 'Porker' Keopple, Alexis Mayfield, Xerces 'Evil' Erson, Pinot 'Puppet' Bruno.



  Medal Awards:

  Corporal Betty Sue is awarded the Distinguished conduct medal: 'At the recomendation of your Staff Sergeant Gregory Dawkes. You will be recieving this distinguished conduct medal. You prevent the FOB from falling in our darkest out when we were pushed back to FOB, building a great FOB that allowed us to continue this operation without the need to evac. Excellent work today Betty.' by Major Sicilia 'Rose' Drakonovisch

  Lance Corporal Squeaky Chip is awarded the Distinguished conduct medal: 'Chip on operation Patrol 642nd-Fury saved several marines from charlie who were on the brink of rotting, their SL included. Your efforts have been recognized. Without your efforts many of charlie would have died and I am unsure if this operation wouldn't have been as successful without you moving to recover those marines putting yourself in harms way. Excellent work today.' by Major Sicilia 'Rose' Drakonovisch





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



