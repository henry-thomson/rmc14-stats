  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Griff Young, Maximus Holdeman, Greedy Jamie, Screams-A-Lot, Deerkaza-Jas, Sails-the-Sea, Slowy Garrison.



  Medal Awards:

  Rina 'Shell-Shocked' Gensvil is awarded the Distinguished conduct medal: 'As per commendation of their fellow corpsmen, I see it fit to award you. Good work keeping our marines in shape throughout this gruesome operation.


  Awarded by Col. Scraps-the-Copper on 10/7/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Jenny 'Fried Egg' Carter is awarded the Bronze heart medal: 'Without regard for their own lives, followed my orders to perform a risky maneuver in an attempt to save the lives of the colonists on Solaris Ridge.


  I should know better than to gamble with the lives of my men, as it would seem I drew a bad hand and lost. And what I had wagered, was your own life.


  I will remember you.


  Awarded by Col. Scraps-the-Copper on 10/7/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

