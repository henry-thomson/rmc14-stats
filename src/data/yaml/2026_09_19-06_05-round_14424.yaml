roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Derick 'Naptime' Hunt, Doji Ravio, Tyshara Valytha, Ralvox Lunithis, Ummidia Fera.



  Royal Jelly Awards:

  Prime Ravager (SVI-957) is awarded the Royal jelly of slaughter: '"RP can you Queen. Can you just Queen."

  "It will be shit. The entire hive is wiped and we lost every nest."

  "Just. Queen."

  "I will just if you promise me that you will wipe the entire tall front."

  "Sure. Just make sure that i do not die."

  "Okay. If you die i will leave this body. Its on you."


  Said and done. 


  Our Prime Ravager SVI, together with the work of the hive, killed the entire tall frontline even when hive was absolutely wiped and lost all ground with the exception of B-Ball. We gutted tuber, we almost died and killed flamewalker, captured the heavy boomsticker, made a massacre on the entire colony.


  I am most certain that talls will never forget of a hive that came back with mostly a Queen, a Ravager and a Valkyrie.


  All sacrifices were not in vain. You made SURE of it. 


  Few are the jellies as deserving as this one, because you were the one who caused our comeback. I would have not claimed the Queen Throne if you didn't promise me the wipe.


  Rejoice my dear sister. Good job.' by Prime Queen (RP)

  Prime Praetorian (ZAI-904) is awarded the Royal jelly of resilience: 'Your work as a Valkyrie made sure our executioner was kept alive and saved me from the brink of death.


  Rejoice my dear sister, and may your courage and loyalty be eternal!!' by Prime Queen (RP)

  Prime Drone (RAD-888) is awarded the Royal jelly of rejuvenation: 'Even arriving late, your heals saved our executioner SVI, our protector ZAI, and our Highness Queen (Myself) dozens of time.


  Rejoice my dear sister, and may your heals be eternal!!' by Prime Queen (RP)




