roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Austin 'Un'Lucky' Eventide.



  Royal Jelly Awards:

  Elder Warrior (DOK-41) is awarded the Royal jelly of resilience: 'You were really a shining moment in my battle, no matter where, no matter the place. You were my defender and shield in arms. During the crisis of the sky talls invasion, you have captured many talls, every scream I did, you captured one. After that you have always were by my side at every moment you were needed. I can't even describe like how impactful you were, because you were the only daughter I had that was immensely just dragging captures to get turn into new daughters. I am proud of you, and I hope that teach others around you how to capture, because generally your a shining example in my hive! Rejoice!' by Prime Queen (PRO)

  Mature Ravager (XX-704) is awarded the Royal jelly of resilience: 'My Ravager, my blade in arms, it a shame you died in this battle, but I did take note of your service for the hive. You were my blade in every need and were also a main force to reckon with that prevented talls from saving the talls I neurospitted at botany, and many other areas that you assisted me with. You have impacted this battle during it early engagement, you have made a bright future for this hive. Rejoice!' by Prime Queen (PRO)




