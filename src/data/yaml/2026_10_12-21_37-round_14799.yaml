roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Edgar Biery, Katherine Kanin, Jack White, Roman 'Ranger' Bondar, Kaede Hesperos.



  Royal Jelly Awards:

  Elder Hivelord (VAL-754) is awarded the Royal jelly of resilience: 'You heeded my call for hivelords when we had aero unweeded at a VERY scary time, your resin along with your sister hivelord saved this hive today. Thank you daughter.' by Elder Queen (EKAJ)

  Mature Hivelord (OWL-123) is awarded the Royal jelly of resilience: 'You heeded my call for hivelords when we had aero unweeded at a VERY scary time, your resin along with your sister hivelord saved this hive today. Thank you daughter.' by Elder Queen (EKAJ)

  Ancient Praetorian (ACE-624) is awarded the Royal jelly of slaughter: 'Ace, we were so fucking dead if we did not have you. I mean this with the bottom of my heart, you dragged off 18 talls from my screams. In total we got 48 from my screams, without you.. that number is so much lower. Thank you daughter' by Elder Queen (EKAJ)




  [bold]Operation funded by [color=green]Isadora AW Brooke's videos of Marine Mess-ups[/color]![/bold]



