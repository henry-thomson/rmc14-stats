roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Porter 'Porker' Keopple, Juno 'Kleptocat' Kaneko.



  Medal Awards:

  Stellnax 'Zirka' Starwalker is awarded the Distinguished conduct medal: 'Through recommendation of your co-pilot officer,


  You went above the expected line of duty as a Dropship Crew Chief. Keeping the dropships intact, clean, and functional is enough work on it's own, but you made sure that each and every marine who boarded had some sense knocked into them before they fought against this xenonid hive. Providing guidance to new marines is a large part of the tradition of excellency that is upheld in the corps, and I'd like to think the results showed within the operation.


  Awarded by Col. Scraps-the-Copper on 11/6/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juno 'Garnet' Eckart is awarded the Medal of valor: 'For diving into the enemy lines to snag the sensors relay for us, I commend your efforts and bravery.  What a spectacle it was to see you in action.


  Awarded by Col. Scraps-the-Copper on 11/6/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





