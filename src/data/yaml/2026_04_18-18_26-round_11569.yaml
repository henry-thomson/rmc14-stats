roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Mike 'Roe Waived' Pizza, Ravos Hall, Kalakian, Benjamin Anderson, Kaiser Whetstone VII, Juan Herrero Ortiz, Alexander Spacer, Goodwin Todd, Darren Mull, Iris Star, Sora 'Beaver' Arinori, Framacio Olimpia Ordovicio, Samuel Gonzales, Sor Ann, Ash Lightweaver, Henry 'Fixer' Voxel, Seneca Steels, Danny 'Ketchup' Heinz, Donny Figglebottom, Bright Nibblewood, Sips-The-Cola, 'Rubicon', In-The-Middle, Jeiske, Glomer 'Viral' Virelume, Alan Briner 'John Solid', Xrimxerr Qarrter'Xe, Naria 'Snow Fox' Reynhard, Nisha Helm, Glup Zarethis, Drake 'Dietcola' Di'Angelo, Bobby Summer, Licks-The-Fruit, Cheesh-Nush, Kathryn Lightner, Swift Sara, Maximus Hawking, Stella Falke.



  Medal Awards:

  Lance Corporal Arioch 'Phoenix' Arcalis is awarded the Distinguished conduct medal: 'You did a amazing job today for a first time pyrotech. I experinced you first hand with your flames, keeping the xenos at bay. Without your efforts we would of surely lost. You are to be commended for your efforts today. Excellent work Arioch.' by Major Sicilia 'Rose' Drakonovisch





