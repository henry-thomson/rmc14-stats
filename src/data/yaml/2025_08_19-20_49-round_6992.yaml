roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Andrew Bunten, Kas'Lurla, Exi-Brize, Lilian 'Free' Mason, Hudson 'Mule' Keifer, Selene Starseeker, Knower Of All, Pursuits-the-Foreman, Isabell Mueller, Avalon 'Goose' Bone-Mender, Andres Demuth, Alyssia 'Stubby' Hill, Myrrhalis Void-Maw, Derrick Fisher, Breaks-the-Tides, Floobert 'Hot Sauce' Squenge, Damon Reid, Chandler Jones, Archibald 'Ripcord' Butterfill, unknown, Joey the Rat, Harper Brys, Vesper Holt, Danny 'Ketchup' Heinz, Kurome 'Nyawka' Nyawkowska, Amara Keudlag, Tar-On.



  Medal Awards:

  Zoropsis Phalangioides is awarded the Medal of valor: 'For charging alongside me straight into the jaws of the enemy, bullets blazing and adrenaline pumping. Though I can not exactly say that this was the point of the smart gun operator, you sure gave them hell marine.


  Awarded by Col. Scraps-the-Copper on 8/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  John Nahami is awarded the Distinguished  conduct medal: 'This cargo technician worked brilliantly and feverishly to keep my marines well supplies during the operation. Multiple commendations from the command staff and the marines have came my way about the requisitions department, and I believe you were a big part of why.


  Awarded by Col. Scraps-the-Copper on 8/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Jimena Parker is awarded the Distinguished  conduct medal: 'You worked feverishly to ensure that the marines under my command did not meet a gruesome end, and that the xenonids numbers were not bolstered. Multiple carriers had been active during the operation we undertook, and it would suffice to say that many of them, including me, fell victim to their traps. I'm sure there are quite a few of us today who owe their livelihoods to your efforts. Thank you!


  Awarded by Col. Scraps-the-Copper on 8/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





