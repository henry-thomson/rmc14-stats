roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Runs-with-Boxes, Tokimasa Ichijo-Yamada, Willow Spacewing, Foe 'FuBAR' Foehammer, Brom Matlock, Trent Zynner, Hyro 'Spitballer' Sasake, Tries-Best, Ray Budzinski, Thurgood Ryebell, Patu Pennington, Ko, Alexa-Lotl, Polishes-the-Boots, Joy Farrow, Vaughn Basmanoff, Alyxandra Rerin, Mate Ipmala, Valerie Diergo, Bonney Doggo.



  Medal Awards:

  Sergeant Sera Watanabe is awarded the Distinguished conduct medal: 'For outstanding performance as a pyrotechnician specialist. The Sergeant delivered flame support, inflicting heavy losses and stopping Queen pushes during operation Mission Painful-Walk on LV-624, Lazarus Landing, contributing to our success.


  Awarded by Col. Freya Locke on 03/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke

  Gunnery Sergeant Bennett Mortland is awarded the Distinguished conduct medal: 'For strong leadership on the ground, leading Alpha squad, keeping them cohesive and disciplined during operation Mission Painful-Walk on LV-624, Lazarus Landing.


  Awarded by Col. Freya Locke on 03/29/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke





