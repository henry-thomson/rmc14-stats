roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Menodora Mothaden.



  Medal Awards:

  Sergeant Aurora 'Birdcage' Barkheart is awarded the Distinguished conduct medal: 'Sergeant Barkheart your work coordinating between CAS, CIC and your own squad was exceptional. Your OBs coords allowed us to make swift progress throughout the colony and allowed us to then quickly crush the Xenonid horde in caves. Without your fine work many more marines would have been lost today and for that you have my personal thanks.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/30/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Second Lieutenant Smoke Jyllian is awarded the Distinguished conduct medal: 'Second Lieutenant Jyllian your work with rest of the Intel team allowed CIC to keep steady pace into this operation with allowing us to get additional supplies. Though what was more important was you recovering many victims of SSD and recovering them back to FOB. You went above what was expected for a IO and for that I thank you marine.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/30/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





