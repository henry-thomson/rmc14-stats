roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Aquila Ryu, Vinny AW Tokarev, Freya 'Foxhound' Skoll, Sebastian Wallick, Freya Ashaeil, Tyr 'Tex' Ragnarson, Randy Camp, Marc Garrison, Bennett Mortland, Orbits-The-Squad, Brick Stonewarden.



  Medal Awards:

  Cody Lewis is awarded the Distinguished conduct medal: 'In dire and hectic conditions, managed to secure multiple incredibly precise AP rockets on high value targets without striking friendlies. They did not fire many rockets, but every shot they made devastated the XX-121 that dared stand in their path.'

  Jamal Johnson is awarded the Distinguished conduct medal: 'Used their rocket launcher to devastating effect, slaying both XX-121 Queens and ensuring that the operation did not stall out in close quarters. Their initiative allowed us to remain moving at all times.'





  [bold]Operation funded by [color=green]Colonist Paychecks[/color]![/bold]



