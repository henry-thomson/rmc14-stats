roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kahara Rirrikvahrir, Mike 'Giggles' Baynton, Elise 'Purple' Veira, Resuno, Floobert 'Hot Sauce' Squenge.



  Medal Awards:

  Corporal Dave 'Big Dave' Small is awarded the Medal of valor: 'Through recommendation of your squad leader,


  Consistently coordinated the efforts of the marines towards the security of the FOB, as well as providing the necessary CAS targets to hold our position. Well done, on all accounts.


  Awarded by Col. Scraps-the-Copper on 4/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Corporal Silas 'Chitter' Candlewing is awarded the Distinguished conduct medal: 'Through recommendation of your squad leader,


  Holding the line for an almost full two hours against the xenonid hive as they tried again, and again to break our lines. It is in part owed to your efforts that we had a safe landing zone and FOB to get folks back home to.


  Awarded by Col. Scraps-the-Copper on 4/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Lance Corporal Matthew 'Skidmark' Fields is awarded the Medal of valor: 'Through recommendation of the auxiliary support officer,


  Never stopped sticking with intelligence, acting as their bodyguards in the most treacherous of moments of the operation. It is due to this effort that we were able to fight for as long as we did.


  Awarded by Col. Scraps-the-Copper on 4/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Lance Corporal Milosch Zviazda is awarded the Bronze heart medal: 'Through recommendation of your staff officer,


  As the Alpha grenadier specialist, this marine was instrumental in repelling many would-be devastating pushes by the xenonids upon our position. Neither did they fire with reckless abandon - ensuring that they had grenades when the right time to strike presented itself. 


  Awarded by Col. Scraps-the-Copper on 4/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper



  Royal Jelly Awards:

  Ancient Ravager (NEV-908) is awarded the Royal jelly of slaughter: 'Our dearest NEV played a beyond vital role in terrorizing the talls from the complete start to the end. She kept rotating, capturing, scouting, and running down anything she could get her deadly claws on. Poor talls could just watch in despair. It is without a doupt that her actions allowed the hive to succeed, and almost got her a succession to the kingly throne! It is with sadness that talls are so cowardly that they missed her reign of terror. NEV must help us in the future, and secure the slaughter ever again!' by Ancient Queen (LIMA)

  Elder Hivelord (MAT-404) is awarded the Royal jelly of resilience: 'Although our incredible hivelord met an early demise, sister MAT managed to stay sharp and focused the whole time. She rotated, built, weeded, and kept her bearings while completely and utterly surrounding the talls. Her walls, the strategic pincer, simply put the terror she was radiating, proved too potent for the weakling talls. As expected, there was no doubt really, from her actions we were victorious! May mother bless us with her presence in our future battles.' by Ancient Queen (LIMA)

  Elder Carrier (IZ-722-AL) is awarded the Royal jelly of sabotage: 'Sister was endlessly at her best working night and rain for the betterment of the hive with her eternal children! Always grazing the edge of danger with her frontline captures, yet at the same time keeping safe at all times. The nests were overflowing with captures, we truly could barely contain them, and our dear sister was a cause of that. The future hives are in desparate need of her skills!' by Ancient Queen (LIMA)

  Mature Hivelord (BI-132-E) is awarded the Royal jelly of resilience: 'Our great hivelord is a proof that age is not required for skill and dedication. For ages sister endured slaughter time and time again. She never gave up, constantly creating chokes for the talls to die on, doors for numerous boilers, and just supreme conditions for our carriers! We can barely guess where her future talents evolve, yet we are certain they will safe us again!' by Ancient Queen (LIMA)

  Ancient Drone (SZG-983) is awarded the Royal jelly of rejuvenation: 'Our deeply value healer always returned to keep the hive fresh! Sister proved her undying dedication to the art of healing, which in turn provided an always battle ready hive. Her actions allowed us to keep the pressure on, and slowly douse any hope that talls had at surving. May the future hives are blessed with her presence as well, for her skills are truly exceptional!' by Ancient Queen (LIMA)




