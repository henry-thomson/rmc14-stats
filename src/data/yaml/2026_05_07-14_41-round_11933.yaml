roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Roman Lamphugger, Bennett Mortland, Skoros Firefly, Addyson 'Fortuna' Zappy, Linda Clark, Khira-Imsaho, Gives-The-Fish, Evelyn Fitzberg.



  Royal Jelly Awards:

  Ancient Ravager (SVI-883) is awarded the Royal jelly of slaughter: 'I AM SO PROUD OF YOU TODAY. You have outlasted all your ravager sisters, against all odds, you have survived today. Together, even in an almost losing battle, thanks to your work, we have turned the tides to our favor. We have gone in the talls metal hive and you have showed them what you really mean, pure fear. Destroying and slashing through them, you truly have shown valor today.

  They hive is eternaly grateful for your work, and so I am. Without you I doubt we could have even wiped the talls. You truly are incredible.

  Keep it up!!!

  With love, LAG!' by Ancient Queen (LAG)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
