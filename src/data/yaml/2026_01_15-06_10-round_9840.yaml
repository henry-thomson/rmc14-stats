roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kalaveer 'Kala' Singh, Nahuel Porter, Yuki 'The Cat' Suzuki, Sofia Addison, Supports-The-Squad, James Joseph, Talkse-liketh-Thiseth.



  Royal Jelly Awards:

  Prime Hivelord (RO-593-CK) is awarded the Royal jelly of proliferation: 'For your immense effort since the beginning, building up excavation.


  Building up hydroponics twice that got skyfired twice!


  You made it quite an interesting battle with your structures, that I was able to enjoy the scenery and break the talls one by one.


  I just hope others drones follow your footsteps, none was putting effort as much as you were, should probably lay down motivation to the support lines.


  Overall, great art, great structures, rejoice! You deserve this!' by Prime Queen (PRO)

  Ancient Hivelord (ORB-90) is awarded the Royal jelly of proliferation: 'Since the beginning you were always eagerly building away, wall by wall.


  Tirelessly working your best, and that what all I required, I hope other drones follow your footsteps, pass your knowledge for all to see.


  You deserve this for your great dedication and work to making this battle a victory!


  Rejoice!' by Prime Queen (PRO)

  Ancient Crusher (TA-390-NK) is awarded the Royal jelly of resilience: 'You were the great wall, the TANK!


  You disrupted many engagements against the talls, captured, stunned. You name it.


  The talls couldn't handle your charges, and let alone, you saved what you could, and beaten up what talls you had in your sight.


  Overall, great performance, hope to see more of it, as you always do.


  Rejoice!' by Prime Queen (PRO)

  Young Defender (XA-603-D) is awarded the Royal jelly of resilience: 'For your great act of shielding me when you a defender is on the brink of death, whilst I was a gibbing a pyro maniac, during the initial 2 minutes of engagements, I want you to recall this memory, of such great work.


  Ashame you are dead, we will remember you great defender!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



