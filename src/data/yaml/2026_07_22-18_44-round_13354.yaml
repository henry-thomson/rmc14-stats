roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Fillmoore Grayson.



  Royal Jelly Awards:

  Prime Defender (PRO-514) is awarded the Royal jelly of proliferation: 'PRO, You have done amazingly rallying up those sisters while I went ovi, making sure cohesion wasn't lost and capturing many talls in the process. You are a true leader.


  For this, I award you this jelly of proliferation, rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Prime Burrower (FO-576-OL) is awarded the Royal jelly of sabotage: 'FOOL, your build in virology caves has not only permitted us to attack the tall's nest, but also prevented said talls from ever acquiring virology, a key location for them. This has hindered the talls and permitted us to thrive.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Ravager (JA-93-KE) is awarded the Royal jelly of slaughter: 'JAKE, You were courageous, always going in every time a tall was incapacitated, making sure to drag them when your sisters feared for their lives. You made sure talls were assimilated into our great hive, and have brought many sisters to this hive.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Cocaine Accessories[/color]![/bold]
