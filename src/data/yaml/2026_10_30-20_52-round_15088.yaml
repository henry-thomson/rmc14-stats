roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Victor Fischer, Lucious Ovid, Tiberius 'Tall Boy' Crowley, Mia Phillips, Ron 'Spitz' Purrman, Shtefan 'Cliff' Skalkyn, Bargo Fargy, Tato 'Crispy' Prank, Robert John Linder, Kenna Koi, Kelly Brook, Rota Karst, Oliver Armer, Clyde Bootes, Enthir Steelforge, Lucy Silverhand, Karl Stone, Petra 'Whiskers' Lancaster, Harmony Holt, Telani, Tangerine Baker, Toa 'Flame' Ahi.



  Medal Awards:

  Sergeant Cronin 'Fig' Pekoe is awarded the Medal of exceptional heroism: 'As grenadier killed over 20 xenos in the entire operation, and single handedly killed multiple Hivelords keeping the hive from rebuilding. The medal of exceptional Heroism is saved for operations saved by a singular marine. Today, you earned it. Well done. 


  Awarded by Colonel Breaks-the-Tides on 10/30/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides

  Chief Warrant Officer Salticidae 'Tik' Weber is awarded the Distinguished conduct medal: 'At key moments proved the Devistating impact of CAS, killing numerous groups of xenos, again and again, he show great skill in dispatching those within their mark. Keeping us in the fight and keeping us winning. Well done. 


  Awarded by Colonel Breaks-the-Tides on 10/30/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides

  Corporal Minji 'Failsafe' Kilgrim is awarded the Medal of valor: 'This SL has managed to save so many marines within the Delta fight of South FOB. Without her help I'd even go as far to say Delta would be down to even less and the operation would be at a loss. Well done!


  Awarded by Colonel Breaks-the-Tides on 10/30/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides

  Sergeant Ruki Trigger is awarded the Distinguished conduct medal: 'A key part in the success of alpha, without them, we may of not been able to keep fighting for as long as we did. Delievered critical supplies managing the squads needs with the chaos of the combat zone relievering pressure of alpha SL to do their leading. Also a warm heart that collected tags. Well done!


  Awarded by Colonel Breaks-the-Tides on 10/30/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides





