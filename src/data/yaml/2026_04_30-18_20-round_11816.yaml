roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Hakozaki 'Megumin' Megumi, LaRamie Huxton, Chews-the-Wires, Vince Vale, Big Meow, Ellanour 'Ellie' Solars.



  Medal Awards:

  Corporal Juan Cortez is awarded the Distinguished conduct medal: 'Showing keen initiative and courage by single handedly advancing on and securing not only a comms tower alone but also 5 tunnels. Furthermore showing skill and strength in killing a boiler which was vital to this operations success.' by Major Reed McMatherson

  Second Lieutenant Riley O'Riley is awarded the Distinguished conduct medal: 'Despite being completely green they managed to keep up with the demands of medical by supplying the ground forces with the medicine needed to keep them in the fight. They showed true spirit and ability and have an interesting career ahead of them.' by Major Reed McMatherson





