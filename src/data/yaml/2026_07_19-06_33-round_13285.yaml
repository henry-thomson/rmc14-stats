  Elder Warrior (ZAI-430) is awarded the Royal jelly of sabotage: 'Making mutiple callouts that helped the hive aswell as informing me of a silly push from the talls that allowed us tuber capture, with out that key moment thing would surely have been harder, well done' by Elder Queen (IED)




