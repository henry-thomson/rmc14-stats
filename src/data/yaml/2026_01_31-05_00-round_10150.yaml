roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Mike Robe.



  Royal Jelly Awards:

  Elder Praetorian (LUA-445) is awarded the Royal jelly of slaughter: 'Thanks to your efforts, the fire that saw the talls slay our Queen turned on them.


  With exceptional skill capturing and pulling the talls into their own flames, this jelly is well earned.' by Ancient Queen (HEK)

  Elder Drone (SI-627-L) is awarded the Royal jelly of proliferation: 'It is not every day a drone sees the backlines, much less a gardener.


  But with your efforts, the backline was able to capture 5+ talls with the aid of your fruits. Further more, this comes from the eyes of your sisters. The highest honor.' by Ancient Queen (HEK)

  Young Defender (AS-978-T) is awarded the Royal jelly of resilience: 'In a amazing feat of heroism, faced down the entire Tall force, saving me at the cost of their own life.



  Without that defining rescue, the talls may have won. But thanks to your efforts- we will never know. Well done.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
