roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Del Smirnov.



  Medal Awards:

  Luanne Greenawalker is awarded the Medal of valor: 'Awarded posthumously, 2nd Lieutenant Greenwalker worked tirelessly to provide crucial intelligence, as well as undertook a dangerous mission into the deep depths of the enemy’s lair to terminate their hive core. Thier actions resulted in the distraction we needed to continue our efforts during Operation: Peacekeeping Mission Direct-Seraph.'



  Royal Jelly Awards:

  Ancient Hivelord (CHI-359) is awarded the Royal jelly of resilience: 'To the great hivelord CHI goes this first ever, royal YIP out. You have proven the resliliance of the hive by constantly building up the hive when requested to do so.


  Your great work has caused us to be victorious this day and YIP is proud of your work. If all lords worked as efficiently and fast as you then no hive would ever fall!


  Rejoice!' by Elder Queen (YIP)

  Elder Boiler (MRT-678) is awarded the Royal jelly of slaughter: 'Today you have proven the power of boilers in tight spaces. You, MRT have proven the raw power of boiling our foes! With you in a hive, no tall dare enter the tight corridors or caves.


  As for this, you will be rewarded the second ever royal YIP! YIP is proud of your work and wishes to see even more like it in the future.


  YIP!!' by Elder Queen (YIP)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]Ruby Hivey SIP.[/color]![/bold]
