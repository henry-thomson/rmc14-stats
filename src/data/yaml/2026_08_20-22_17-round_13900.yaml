roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Drone (NAN-961) is awarded the Royal jelly of rejuvenation: 'My Daughter NAN you pulled of a most glorious save of my life. Not only did you save me you also aided others in their recovery today. You did well and for that this Jelly is yours.' by Elder Queen (FOP)

  Young Drone (CE-23) is awarded the Royal jelly of rejuvenation: 'My Daughter CE you pulled of a most glorious save of my life. Not only did you save me you also aided others in their recovery today. You did well and for that this Jelly is yours.' by Elder Queen (FOP)

  Prime Praetorian (FLA-168) is awarded the Royal jelly of proliferation: 'My Daughter FLA you prove once again why you are one of the greatest Oppressor the hive have to offer. Your work with WI-L today was nothing short of perfection. For your effort I reward you with this Jelly. REJOICE!' by Elder Queen (FOP)

  Mature Carrier (WI-223-L) is awarded the Royal jelly of proliferation: 'My Daughter WI-L you work with FLA today to secure so many talls for us. Your work wasn't one of slaughter, but of the endless eggs needed to capture so many. I cannot wait to see more of what you have to offer, but for now this Jelly is your reward. REJOICE!' by Elder Queen (FOP)

  Mature Praetorian (CD-71-V) is awarded the Royal jelly of resilience: 'My Daughter CD-V you saved many today with your screeches prevent many deaths from vast amount of booms the talls had. You are young, but have proven yourself so much already. I expect even more out of you in the future, but today this Jelly is yours. REJOICE!' by Elder Queen (FOP)




