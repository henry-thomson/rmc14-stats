roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Takara Nowak, Blobby Oozeworth, Loiosh Garland.



  Medal Awards:

  Brooke Reighner is awarded the Bronze heart medal: 'Brooke Reighner took initiative and risked their life to get fuel in our boats for evacuation - holding the reactor core by himself for several minutes. 


  You needn't ask me for recognition or approval - you need only look at the marines we still have alive today.


  Awarded by Col. Scraps-the-Copper on 11/6/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ups-The-Downs is awarded the Medal of valor: 'Excellent leadership over Delta today, as well as showing fearlessness as we fought in battle together against a xenonid hive that had hijacked a dropship to our warship. 


  Awarded by Col. Scraps-the-Copper on 11/6/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





