  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sebastian 'Squish' Eventide, Granola BiggyFooty.



  Royal Jelly Awards:

  Prime Hivelord (ZAO-992) is awarded the Royal jelly of resilience: 'For your amazing effort in building and rebuilding endlessly many resin and many hive allowing us to prosperate and capture talls, i hereby award you with this resilience jelly to show your braveness into frontline building marshals and hydro ponics.


  Rejoice my sister!! May your build be eternal!!' by Prime Queen (RP)

