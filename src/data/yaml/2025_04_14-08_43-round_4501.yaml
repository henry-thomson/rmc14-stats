roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  Medal Awards:

  Roland 'Lion' Tiberius is awarded the Medal of exceptional heroism: 'Private Rolan Tiberius pushed head first into CIC without fear of their life, securing the command centre from the CLF and with another cargo technician, this act of heroism will not be forgotten.'

  Danielle Sparks is awarded the Medal of exceptional heroism: 'Private Danielle Sparks pushed head first into CIC without fear of their life, soley securing the command centre from the CLF with their fellow cargo technician, this act of heroism will not be forgot'



  Royal Jelly Awards:

  Elder Spitter (PWR-906) is awarded the Royal jelly of slaughter: 'For your incredible work harassing and depleting the talls backline while our hive held them off at colony. I cannot count the number you slew, incredible job.' by Mature Queen (HVD)

  Elder Crusher (BU-867-B) is awarded the Royal jelly of resilience: 'For surviving a long and arduous war during which we held a constant disadvantage. You were the bulwark that held strong, and strike terror into the talls hearts. Yung Crusher would be proud.' by Mature Queen (HVD)

  Ancient Praetorian (LO-115-HP) is awarded the Royal jelly of slaughter: 'You were an incredibly skilled Praetorian, making excellent use of your acid to harass and stem the Talls onslaughts, even amidst a ceaseless barrage of boomsticks that took the lives of over a dozen' by Mature Queen (HVD)

  Young Praetorian (CA-928-R) is awarded the Royal jelly of slaughter: 'You made incredible use of the talls own weapons against them, punishing those whose foolish bravery brought them to within your range. Thusly, you made the talls think twice about daring to step into' by Mature Queen (HVD)




