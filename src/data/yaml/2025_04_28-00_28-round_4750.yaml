roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Lissette Beckman, Adrian ''Archangel'' Gutierrez, Blobby Oozeworth, Alec 'Protag' Buchanan, Richard Ryhmes, Joanne Rice, Slowy Garrison, Kate 'Gel' Fleming, Darfman Forgemog, Commet Brown, Chiara Tanaka, Mi'ko Qerrxeq, Bella Sommer, Beady-eyed Gus, Spike 'Light-Foot' Fluff Usta, Yllo Summer, Brock Field, Atlas, Huey Hudson, Althea Leander.



  Royal Jelly Awards:

  Elder Praetorian (GIB-263) is awarded the Royal jelly of slaughter: 'You have shown the most powerful impact of this war as a vanguard, you slaughter in my name. You have killed countless talls in your presence, for that you bestowed this jelly. I hope to queen mother' by Prime Queen (PRO)

  Prime Drone (AMK-629) is awarded the Royal jelly of rejuvenation: 'Your sacrifice was a grandest of all times I haven't seen in a while, you didn't care that you would be gone you instead ensured my life was higher priority, and with that I hope that your wisdom and' by Prime Queen (PRO)

  Ancient Boiler (RIP-952) is awarded the Royal jelly of slaughter: 'You did immensely well Ancient boiler, your high intellect has shown me of how useful a boiler can be at the right time, and right place. You killed countless talls, burn, devestated through your well' by Prime Queen (PRO)

  Young Carrier (DU-866-M) is awarded the Royal jelly of proliferation: 'For your couragous act, of always being available, always making sure captures went smoothly. You always had well placed traps for other sisters to utilize, and even that wasn't enough to describe how' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



