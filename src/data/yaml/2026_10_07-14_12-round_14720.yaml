roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Gunnery Sergeant Nero 'Boomer' Pero is awarded the Distinguished conduct medal: 'Gunnery Sergeant Nero Pero oversaw and led the construction of an excellent Forward Operating while additionally co-operating with their fireteam leaders to ensure our freshly joined recruits were properly educated on the expectations placed upon Bravo and taught the skills to meet them.


  It is within the ranks of new recruits we find new potential for the future, and it is a boon of leadership to recognize the education of the young teaches the very people who will protect us in the future. Thank you for recognizing this gunnery sergeant


  Awarded by LtCol. Kaitlin Zalack on 07/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack

  Corporal Camryn 'Cavalry' Turnehare is awarded the Distinguished conduct medal: 'Corporal Camryn Turnehare provided, in assistance with the other command elements of Bravo, the experience and training ground to foster the minds and skills of fresh recruits into personell capable of developing and maintaining a strong Forward Operating Base.


  Keep this up and I'm confident I'll see you rise through the ranks with the support of those you've helped grow. Keep it up Corporal


  Awarded by LtCol. Kaitlin Zalack on 07/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack

  Corporal Tom 'Melon' Malone is awarded the Distinguished conduct medal: 'Corporal Tom Malone assisted the operation with the carefull and patient efforts to educate the fresh recruits assigned to bravo into marines capable of maintaining a strongpoint on the field and developing it as time goes on.


  We will see their skills sharpened through the hands of personell such as yours Corporal, keep it up and do me proud.


  Awarded by LtCol. Kaitlin Zalack on 07/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





