  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Crusher (XX-941) is awarded the Royal jelly of resilience: 'During the moment and beginning, you served the hive to the best of your abilities, you volunteered to be a hive leader when none wanted to be it. You led by example, and choosen the route of success, and that you did. It was a shame you fallen north of colony power, I would love of kept seeing you crush these talls!


  Overall I hope to see you grow an continue the route of being a fable powerful mine!


  None shall stop you from reaching the stars!


  Rejoice!' by Prime Queen (PRO)




