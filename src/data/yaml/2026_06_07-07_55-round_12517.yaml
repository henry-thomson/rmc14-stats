  Medal Awards:

  Corporal Frank 'Pinkie' Salami is awarded the Distinguished conduct medal: 'Corporal Salami proved to be an excellent Medic. Throughly assisting the squad and their Squad Leader on many ocassions. Keeping the squad together through triage and under extreme duress. A shining example of conduct for UNMC Corpsmen.


  Awarded by Maj. Clyde McKinney on 7/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Clyde McKinney





