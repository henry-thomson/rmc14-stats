roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jayden Miller.



  Medal Awards:

  Hates-The-Needles is awarded the Distinguished conduct medal: 'For stepping up as duty officer this early in their career, ensuring that the marines always had someone at the helm steering them towards victory. I am sure that if you keep at it, and continue to hold the principles of a UNMC officer dear to heart, you will have an excellent career ahead of you.


  Awarded by Col. Scraps-the-Copper on 12/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





