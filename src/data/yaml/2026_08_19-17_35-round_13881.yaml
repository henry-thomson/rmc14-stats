roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Fenrisulfr Thumper, Luka 'Wander' Tio, Titus AW Navaja, Hydie AW Steyr-Hahn, Jais 'Jazz' Ksaj, Hark Willson, Igon Mcdonagh, Willie Manley, Ricky Fischer, Sunny Slimes, Alaz-Vultaren, Grant Fulton, Snicket Sharp-Claw, Silas Sybilla, Alaya Inikondi, Nero 'Boomer' Pero, Sets-the-Walls, Kahara Rirrikvahrir, Seeks-To-Swim, Mariya 'Masha' Zelenko, Night-hunter Squeak, David 'Dig' Diggle, Absurdist-by-Nature, Qarrker Teqxuq'Xeu, Grayson Hunt, Syd Bell, Elena Embers, Bo 'bone meal' O'Neil, Sophie Paynter.



  Medal Awards:

  Staff Sergeant 'Dexter' Xaeter is awarded the Medal of valor: 'During a long and arduous operation, Staff Sergeant Xaeter represented the true UNMC spirit through his decisive actions, aggressive maneuvering and consistent leadership of his squad. Without his concieted efforts, this mission would not be possible. We truly could not have won this without you. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 8/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





