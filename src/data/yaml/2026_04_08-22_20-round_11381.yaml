roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Edith 'Hesti' B Clausell, Faust Mephistopholes.



  Medal Awards:

  Lance Corporal Culls-The-Leviathan is awarded the UNMC High Command Medal of honor: 'For' by UNMC High Command

  Lance Corporal Culls-The-Leviathan is awarded the UNMC High Command Medal of honor: 'For exceptional and intrepid accomplishments in service with the 2nd Company, 4th Battalion, 3rd Regiment, 4th Combat Division, UNMC against hostile Xenonid forces on Sorokyne Strata LV-976, during Operation Patrol Vodka-Honey.


  With the tenacity, courage, and resourcefulness displayed by Sergeant Culls-The-Leviathan, UNMC forces prevailed against a strong and determined enemy. Their gallant fighting spirit and sound tactical judgement provided critical tactical blows to the hostile Xenonid force, decimating their numbers and providing their fellow marines an opening to neutralize the threat. Sergeant Culls-The-Leviathan's ability to remain undaunted in the face of such adversity are in keeping with the highest traditions of the military service and reflect great credit upon themselves and the United Nations Marine Corps.


  High Command hereby awards Sergeant Culls-The-Leviathan the UNMC Medal of Honor, presented by Brigadier General Ruby Blackwitch on 04/08/2126.' by UNMC High Command





