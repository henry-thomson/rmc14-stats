roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Praetorian (AHH-158) is awarded the Royal jelly of resilience: 'This daughter has been a leader of the hive from the very start. Many of the hive owe you their lives. Not only did you protect them during the invasion, you lead them effectively. Inspiring others to rotate into faviourable positions and leading the charge into battle. Bravo!' by Prime Queen (ARG)

  Mature Boiler (LI-387-O) is awarded the Royal jelly of sabotage: 'This daughter put herself in harms way for the hive. Acting as bait for the talls she enabled many captures by baiting the small beast into charging, causing talls to fly into traps. Your cunning this day has outwitted the talls, proving once and for all who is the superiour being. Rejoice!' by Prime Queen (ARG)

  Elder Drone (AB-505-C) is awarded the Royal jelly of slaughter: 'During the final stages of the battle, this daughter answered the call. When mother was weak and unable to push, this daughter leaped into the fray and enabled us to run down the talls within the caves. We moved to quickly without scream cover and routed the talls from the planet. The talls who challenged us fell at our feet, all because of your efforts. Bravo!' by Prime Queen (ARG)




