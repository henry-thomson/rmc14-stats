roundEndText: >2-

  The shadows of the valley fall.

  And the sun rises over the parched sands, like it always does.


  A new day dawns on Eosphorous, that planet lost to time.


  The cattlehands were successful with their cattle run...

  The Skulls no longer hold control over the eastern roads...

  The pandora's box of crater town remains unopened...

  Something lurks deep in the mines...

  Xenos stalk the valleys...


  The sun rises. The curtain falls.




