roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Dakota Holdeman.



  Royal Jelly Awards:

  Mature Drone (DN-513-T) is awarded the Royal jelly of rejuvenation: 'For your noble death in saving your hive leader Tank, who in turned saved the queen from a Death Spitter. Well done Child, and know that mother is proud.' by Elder Queen (CTC)

  Ancient Praetorian (TA-318-NK) is awarded the Royal jelly of resilience: 'For your noble efforts in blocking a death spitter from murdering your queen, know that she is proud of your efforts today. Well done Tank.' by Elder Queen (CTC)

  Young Runner (KEK-671) is awarded the Royal jelly of slaughter: 'For your noble death taking out the Purple caste with a acid explosion, know that mother is deeply pleased with your efforts and timing.' by Elder Queen (CTC)

  Elder Ravager (ORB-347) is awarded the Royal jelly of slaughter: 'For your efforts this today in slaughtering the talls alongside your queen, and inspiring the hive to follow in your path of slaughtering the weak talls. Ravage with Pride my Child.' by Elder Queen (CTC)




