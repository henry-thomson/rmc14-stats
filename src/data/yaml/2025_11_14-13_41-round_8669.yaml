roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  John Flint, Emulates-the-Synths, Carlos Kennedy, Diarsia 'Dima' Maxima, Emiko AW Kaiten, John 'Rook' Weller, Mekanzi 'Fixer' Young.



  Medal Awards:

  Manuel Miller is awarded the Distinguished conduct medal: 'Awarded posthumously, 2nd Lieutenant Miller exceeded all expectations by working tirelessly to gather intelligence and, despite extreme danger, attempted to repair the sensor tower. Unfortunately, they were killed in the line of duty during Operation Sortie Charlie–Target.'





