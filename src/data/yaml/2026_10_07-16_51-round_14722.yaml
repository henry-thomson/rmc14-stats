roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Hivelord (XX-708) is awarded the Royal jelly of rejuvenation: 'The youth! The Junger! The backbone of the hive structure, you are the sole reason why the hive survived and endured through the hellish landscape. When the hive was not required to build, you stood up with your own courage to perform outstanding building with your other sisters, cooperating and communicating. This is a model sister for other sisters to gaze upon! You and the others who assisted you during your youth, guiding you through the true way of Hivelord.


  As far as I know, they have a bountiful amount of gratitude toward your building, and your dedication to the structure that is required! The wall, the resin, the door, each carrying its purposeful meaning to halt the tall menace from advancing further! Millions of tall chops, many demoralized by the resin that you built! Rejoice! I gaze upon a potential mind to be a great, great Hivelord.


  I bestow this jelly upon you for your courage, volunteerism, and initiative to build with your other sisters.


  Well done, XX.' by Ancient Queen (SVI)




