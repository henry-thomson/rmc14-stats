roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Angel Lachner, Edwin Northey, Grumpy Tailsbury, Donny Woollard, Pinot 'Puppet' Bruno, Tygus Raynar, Brings-the-Hugs, Cassius Augustus.



  Royal Jelly Awards:

  Mature Lurker (KV-766) is awarded the Royal jelly of proliferation: 'You were a lurker till the very end, well 2nd time the charm am I right? Overall, in this great battle of Solaris, you made it possible to capture many talls by pouncing and committing to dragging them you were the fastest of them all, that made it possible. Thank you for using your abilities to the best. You deserve this jelly like no other, rejoice!' by Prime Queen (PRO)

  Mature Hivelord (SH-153-I) is awarded the Royal jelly of proliferation: 'You build, build, and build! there was no territory left untouched, beside maybe caves here and there, but the main point is the colony was fortified to the top! With your help you made it easier to make building faster and more efficient with your designer abilities. I do thank you for being the last hivelord, though the work of your other hivelord sisters did as great as well. I hope you learned and had as much fun as I did. Rejoice!' by Prime Queen (PRO)

  Elder Defender (FAE-87) is awarded the Royal jelly of proliferation: 'For capturing talls with your defender abilities you made this hive proud. You actually learned the best way to utilize defender, and I am proud to say that you learned the ropes of what your purpose is meant, and that is to defend! You made sure every piece of land you defended was a capture tall at least from what when I was watching you did what you could. I thank you for being a great defender for the hive Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
