roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Titus Wheelian, Nezoli 'Widowmaker' Sharpfeather, Tanya 'Tempest' Era, Johanne Brauer, Abraham, Ancor Fethcit, Jiminy Krispo, Aelica 'Mom' Danara, Krakaud Stoneguard, Sythok Coralith, Kobell Slinger, Apotheosis Medicae.



  Medal Awards:

  Sergeant Jumpy Whispy is awarded the Distinguished conduct medal: '2nd Lieutenant Retuzziaro provided a significant boon to Inspection Cave-Lancing on LV-624, through their Overwatching they maintained a high squad morale and effectiveness in battle even where command elements may have faltered.


  Through your efforts, you helped bring comfort in knowing Delta was well taken care off. Carry this with pride Lieutenant.


  Awarded by LtCol. Kaitlin Zalack on XX/XX/21XX. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





