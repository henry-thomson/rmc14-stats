roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Joey Nett, Tia tea Times.



  Medal Awards:

  Warrant Officer Yularen 'Sieger' Krennic is awarded the Distinguished conduct medal: 'Warrant officer Yularen Krennic preformed exceptionally quick thinking upon the FOB being breached, securing the alamo and sending it on a flyby to be forced back onto the FOB, making sure that 12 Xenonids were not allowed to survive and reach the Almayer.


  Good work, officer. You may as very well saved the lives of the Almayer staff, saving this operation from doom. Semper Fi.' by Lieutenant Colonel Kazi Priestess





