roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Stan Zeed, Silvie Argentum, Ruki Trigger, Nezuni-Arksai, Lemonus 'Sour' Coralith, Manuel Miller, Miri Katiyam, Reef Vivial, Ollie Aluru, Olivia 'Livvy' Croft, Mina Turner, Flames-The-Plasma, Mittensworth Scratchford, Darbac Spwon, Linda Monroe, Milus Litorinus, Shimpee Prawni, Fritz AW Dagger, Alexis Rahl, Florian Nickolson, Eats-The-Crayons, Tato Prank, Invader Warrot, Aiden Webb, Paduxi-Utamukeeus, Cronin 'Fig' Pekoe, Bipple, Curious Cosmo, Krysha Ysmara, Mariki 'Rocketbird'.



  Medal Awards:

  Sergeant Sporex 'BigToes' Xavian is awarded the Bronze heart medal: 'Sergeant Sporex Xavian stands as a testament to the bravery of marines, despite my sub-par judgement of the situation at hand they listened to a near suicidal order I would've, and to an extend did, followed in prior years.


  Your blood is on my hands, and though I cannot undo the act, I can see your bravery and loyalty in the face of near-certain death rewarded.


  Awarded by LtCol. Kaitlin Zalack on 27/09/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack

  Gunnery Sergeant Vexillum Regis Obice is awarded the Medal of exceptional heroism: 'Gunnery Sergeant Vexillum Regis Obice stands as testatement to the UNMC's ability to solve for problems in every level of it's command structure. Though the circumstances leading up to the event will serve as a painfull reminder for myself, I would be remiss not to rightfully award one responsible for the rescue of my life with their just award.


  Stand proud for the award Gunny, and pray with me that I may never see the circumstances in which it was given repeated.


  Awarded by LtCol. Kaitlin Zalack on 27/09/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





