  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jimmew 'Johns' Todd, Tony Focell.



  Royal Jelly Awards:

  Elder Praetorian (MZ-916) is awarded the Royal jelly of slaughter: 'You just might be her. The prime oppressor, frankly i envy you. I do not know we could have tails... that reach that far. I must compliment the meticulous precision in breaking talls jaws. I did not their limbs could turn at those angles. In my book, you always get additional credit for educating the hive.' by Prime Queen (BUH)

  Elder Praetorian (VCR-881) is awarded the Royal jelly of rejuvenation: 'Certain death without her. She woke me from the deep stasis i was put in by a blunt tube colliding with my forehead by yelling into my ear "WAR". I was not the only fortunate one in the hive to receive such eloquant words.' by Prime Queen (BUH)




