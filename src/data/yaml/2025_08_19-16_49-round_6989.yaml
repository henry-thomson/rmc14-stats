  Royal Jelly Awards:

  Prime Hivelord (HV-73-LD) is awarded the Royal jelly of resilience: 'This hivelord built a great hive in security, making resin that the talls gave up trying to clear. Their resin stood the test of time and allowed us to wipe marines easily.' by Prime Queen (OBOB)

  Mature Hivelord (RIV-968) is awarded the Royal jelly of resilience: 'This daughter built up a-block when talls abandoned it, regaining ground easily and got us plenty of captures to grow the hive, their strong body regurgitated all the resin they could, and for this they deserve this jelly.' by Prime Queen (OBOB)

  Elder Hivelord (UWU-823) is awarded the Royal jelly of resilience: 'This daughter built great capture spots, as well as made sure our hive had resin to fight with. Although not noticed by many, i saw their great efforts and their work will not go unrewarded, good work daughter!' by Prime Queen (OBOB)




