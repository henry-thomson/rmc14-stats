roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Billy Wesley.



  Royal Jelly Awards:

  Prime Drone (DUK-509) is awarded the Royal jelly of rejuvenation: 'You were a great healer drone till the end, you sacrificed your life to save a sister in the battle of Hybrisa. You doing so give them a 2nd chance in contining to fight for the hive instead of a untimely end, that would send them to the dark forever. Keep up the good work because every sacrifice means them still enjoying the ways of life. Rejoice!' by Prime Queen (PRO)

  Elder Praetorian (FIG-34) is awarded the Royal jelly of sabotage: 'For capturing the flame walker south west of dyna, you made it surprisingly more easier to push talls after this achievement. It was so great that I weep joy from what you did today. This was taken place of the great of Hybrisa! May you continue to dance and weave through the battle field like the wind. Rejoice!' by Prime Queen (PRO)




