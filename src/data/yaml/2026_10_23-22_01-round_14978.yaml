roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bobby Bobson, Tangerine Baker, Kain Weller.



  Royal Jelly Awards:

  Mature Praetorian (DE-767-A) is awarded the Royal jelly of rejuvenation: 'Her life became mine. There wasn't a moment of rest as i push with 2 spits away from death... relax daughter, i'm not 1 spit away from death, i can still fight. But still, i commend the effort.

  That tail of yours... how do you grab them so gently your sisters from so far away and save them from certain death?

  Queen mother truly does wonders...' by Prime Queen (BUH)

  Elder Boiler (BE-784-AN) is awarded the Royal jelly of slaughter: 'Your acidity has reached levels that i didn't know queen mother made them. I'm fascinated how you don't melt your own body! Does it make you more nimble? because surviving this long as a boiler and dodging all the sky spit is... FASCINATING!


  There wasn't an ounce of fear... any orders... that could result in y our death, you put that trust in me and listened. We reached the apex form, the queen and boiler duo! the HIVEMIND!' by Prime Queen (BUH)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
