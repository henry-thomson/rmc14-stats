roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Aurora 'Birdcage' Barkheart, Jim 'Smokey' Werner, Walker Robinson, Nhekono.



  Medal Awards:

  Corporal Charon Jenkins is awarded the Distinguished conduct medal: 'For holding down tunnel point and repelling multiple Xenonid forces and killing multiple bugs including a Praetorian. They've never once have been pushed back and refused to give ground. Bravo holds! well done!


  Awarded by Colonel Breaks-the-Tides on 11/13/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides

  Private Sam Wilson is awarded the Distinguished conduct medal: 'For holding down tunnel point and repelling multiple Xenonid forces and killing multiple bugs including a Praetorian. They've never once have been pushed back and refused to give ground. Bravo holds. Well done!


  Awarded by Colonel Breaks-the-Tides on 11/13/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides





