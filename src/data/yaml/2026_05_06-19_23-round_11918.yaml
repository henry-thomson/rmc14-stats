roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Boiler (XX-283) is awarded the Royal jelly of slaughter: 'XX, You have made me proud. You have lived longer than your elder sisters, and supported our hive even in dark times. If it were not for you and your boils. providing great cover to not only engage but also flee from the tall ball, who knows what terrible thing might've happened to our great hive?


  For your great work today, I have decided to award you this jelly of slaughter. I am proud of you this day.


  See you in the next hive!' by Elder Queen (NEV)

  Mature Runner (NOX-999) is awarded the Royal jelly of proliferation: 'NOX, Although I am aware you were saddened by your missed opportunity to become a ravager today, your work as a runner and lurker might've saved our hive. Firstly, capturing the tall lurker very early on as a lurker, then later reborn as a runner, capturing the longspitter. You have also helped alert our hive about the 8 divers going in our SW nest, resulting in 7 captures.


  For this, I award you this jelly of proliferation. We need more great sisters like you.


  See you in the next hive!' by Elder Queen (NEV)




