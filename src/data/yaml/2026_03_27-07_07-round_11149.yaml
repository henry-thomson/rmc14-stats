roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ash 'Silly' Winter.



  Royal Jelly Awards:

  Elder Defender (MAT-562) is awarded the Royal jelly of resilience: 'For sacrificing yourself at west of cargo for a single capture, you did what you made to be, a true defender.


  I thank you for doing such thing, even though it costed your life.' by Prime Queen (PRO)

  Elder Praetorian (NOO-681) is awarded the Royal jelly of proliferation: 'For making a decent number of captures early on when I war queened, when talls went into a horrible position, you scored the captures you could.


  Weaving and dodging through the crowd like a true dancer!


