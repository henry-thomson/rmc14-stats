roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Leonard 'Breacher' State, Tullop 'Chayn Sark'.



  Medal Awards:

  Saani 'Nudget' Goldenfur is awarded the Medal of valor: 'Your exploits have been catching my eye  this operation. You have some frankly stupid courage, but the results of such are completely undeniable. Felling a queen, several tier three castes, and more, your efforts were paramount to victory.


  Awarded by Col. Scraps-the-Copper on 9/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Mona Wolfe is awarded the Distinguished conduct medal: 'Nothing short of excellency from the comfort of the Normandy cockpit today. Hearing no complaints about fultons, medevacs, and personally witnessing the obliteration of many bugs and their fortified positions? It's not something I can say I see every day.


  Awarded by Col. Scraps-the-Copper on 9/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





