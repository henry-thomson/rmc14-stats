roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Paduxi-Utamukeeus, Jack Smith, Eisenhorn 'Bug-Eater' Sedunn, Richard Mason, Bryce 'Badger' Eliza, Koho Silktongue, Stankashi Neuer, Sonny Bonds, Eryk L'Aigle, Drew Rockwell, Noah Alittle, Sam Wilson, Alejandro Kepplinger, Duda Mussia, Porter 'Zombie' Coolidge, Peter 'Cowboy' David.



  Medal Awards:

  Invokes-the-Cobra is awarded the Distinguished  conduct medal: 'For a consistent performance track record with the M5 RPG, I see it fit to commend your efforts. While blowing things up may sound easy, there is indeed some finesse to it and you've shown that you are more than capable of delivering results over, and over again.


  Awarded by Col. Scraps-the-Copper on 8/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Lily Slimeweaver is awarded the Distinguished  conduct medal: 'This rifleman went above the expected line of duty and took it upon themselves to operate the mortar where few people would. Your precise and indiscriminate shelling of key xenonid positions proved paramount to our success today.


  Awarded by Col. Scraps-the-Copper on 8/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Lenny Kuster is awarded the Distinguished  conduct medal: 'Every person in this world needs someone they can rely on - someone who will be right next to them to help the job get done. One of the founding principles of this corps was teamwork and dedication to creed, and you performed along these principles dutifully.


  Awarded by Col. Scraps-the-Copper on 8/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





