roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lev Kotov, Kilometer Dash, Keith Sosa, Michael 'Merlin' Markus, Rirro Darkmist, Hark Willson.



  Royal Jelly Awards:

  Young Hivelord (RUN-693) is awarded the Royal jelly of proliferation: 'You were making resin after resin, making sure the hive always had cover. Not to mention you were here since the beginning, and end. You served a purpose of being the build leader of the hive, and ensuring that everything was set up correctly. in the battle of Hybrisa, your support was appreciated. Rejoice!' by Prime Queen (PRO)

  Praetorian (WA-751) is awarded the Royal jelly of rejuvenation: 'You were one of our vital role the valkyrie, and you were only one to take such course during the battle. I thank you for doing this as much as I love your work. thanks to your warding, your sisters were not able to fall as easily as before. Giving them that extra boon they just need to hold in a little longer. I hope you enjoy this battle as much as I did, for the memories is what we make along the way.' by Prime Queen (PRO)

  Young Drone (CA-363) is awarded the Royal jelly of rejuvenation: 'During the great battle of Hybrisa, you were one of our young healers, who kept the front healthy, thanks to such favorable advantage you bestow upon your sisters by removing their wounds with ease, you made it easier to continue forward. There may of been others around you, but you did amazing performance this battle. I hope to see more of your splendid work, rejoice!' by Prime Queen (PRO)

  Elder Drone (FSH-427) is awarded the Royal jelly of rejuvenation: 'During the great battle of Hybrisa you ensured that the talls had no chance against us thanks to your support in fruits. You provided what you could to you sisters, be it unstable, greater, alacrit, even plasma fruits. You name it, overall your work is highly appreciated. I hope to see more of this in the memories we make together in the future. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Scouts' Banana Cookies[/color]![/bold]



