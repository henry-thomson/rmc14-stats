  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hal Gray, Veit Crux.



  Royal Jelly Awards:

  Young Boiler (BR-41-B) is awarded the Royal jelly of resilience: 'The last of the boilers, and a young one too. Xe possesses wisdom beyond their years, and their genesong shows great promise for the hive. Remain resilient, and cautious- and you have a great future in boiling.' by Elder Queen (YOU)

  Mature Runner (TMM-57) is awarded the Royal jelly of sabotage: 'The understated duty of the runner is in scouting and skirmishing, not just merely waiting to evolve into a lurker... or a Hedgehog ravager. You represented this skill well in your genesong.' by Elder Queen (YOU)

  Prime Ravager (PRO-297) is awarded the Royal jelly of slaughter: 'For excellence in hive-duties pertaining to both lurking and ravaging. As a Lurker you demonstrated the genesong of sabotage by demolishing talls outside their own perch as a vampire lurker, and as a Ravager faced them head on at the tip of the Hive's spear. Truly, an exemplar of the slaughter.' by Elder Queen (YOU)




