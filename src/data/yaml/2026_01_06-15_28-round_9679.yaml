roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Claire 'Mutie' McGrath, Mizooki 'PillBug' Akiya, Cooper Wright, Vaelor Glowleaf, Sofia Addison, Nelson Young, Hudson 'Hungry' Demuth, John 'Arsonist' Spade, Oleed-Ajum, Leonard 'Breacher' State, Elizabeth 'Hairball' Gretz, Victor 'Undertaker' Lichtenstein, Morahkril Quatzra, Daniel Dennis, Nia Lovelace, Zoey 'Killer' Grimshaw, Ash 'Silly' Winter.



  Royal Jelly Awards:

  Ancient Defender (FOX-202) is awarded the Royal jelly of resilience: 'You have made it from the beginning to end as a praetorian, though you were gibbed I didn't forget about you.


  You were something I was able to lean onto during these dire circumstances, the tuber was pretty much useless because of you.


  Not to mention you were really great at doing support at the right moment when I needed it.


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
