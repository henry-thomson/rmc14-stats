roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Charles 'Butterfingers' Muggins, Marissa Day, Altair 'Christmas' Nightwish, Granola 'Biggy' Foots.



  Medal Awards:

  Lance Corporal Valeria Watson is awarded the Distinguished conduct medal: 'Lance corporal Valeria was intstrumental in the operation as SADAR, with out their quick response time. Frontline squads  would not have been able to contest as many queen pushes as we did. You helped us stay in this fight. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 10/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





