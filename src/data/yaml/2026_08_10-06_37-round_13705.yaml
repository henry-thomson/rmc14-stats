roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Anne 'Artichoke' Powell, Bridget.



  Royal Jelly Awards:

  Mature Burrower (FE-283-ET) is awarded the Royal jelly of sabotage: 'FEET, during our entire fight you were constantly giving callouts and updates about what the talls were doing. Your great initiative and contribution to the hive in this regard shall not go unrewarded.


  Migthy is the claw, yet mightier is the communication between our minds. You proved that the hive can grow strong together with constant communication.


  The CUBE we protected today has stood strong thanks to your efforts. You should be proud of your work in the hive.


  YIP!!' by Prime Queen (YIP)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of fresh Froots[/color]![/bold]
