roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  The Stump of Silence.



  Royal Jelly Awards:

  Mature Praetorian (KAM-556) is awarded the Royal jelly of resilience: 'Praetorian, your sacrifice was the stepping stone for the hive success, because without you taking the tube to the face, the tuber wouldn't have never been captured, so I want to thank you for putting in that couragous effort for the hive. You have done an amazing job. even though your time with us was short during when you were a praetorian. It will be forever remembered.


  Rejoice!' by Prime Queen (PRO)




