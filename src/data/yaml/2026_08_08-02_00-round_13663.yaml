roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Ravager (AR-838-ES) is awarded the Royal jelly of resilience: 'ARES, You are the reason why today was even possible. When I foolishly walked into tube, you were the sole sister tanking for me, allowing me to live another day even if it cost your life.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Young Boiler (TIB-869) is awarded the Royal jelly of resilience: 'TIB, You got over your fears with the help of SAL and have done an amazing job holding down central caves, effectively halting the talls.


  For this, I award you the jelly of resilience. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Ravager (XR-949) is awarded the Royal jelly of slaughter: 'XR, One of my greatest combattant. You were here from the start, taking talls when I needed and slaughtering when I asked. You wiped the talls mercilessly, they had to flee.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Ravager (BOG-216) is awarded the Royal jelly of slaughter: 'Bog, You have done an amazing job. Killing and capturing, You handled the talls like they were nothing compared to your might.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Hivelord (SLY-584) is awarded the Royal jelly of proliferation: 'SLY, You made this colony bearable for mother. Your build made an otherwise unfavorable colony something fightable.


  For your great resin, I ward you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)




