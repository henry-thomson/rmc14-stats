  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Adoette Winter, Hates-You, Juggles-The-Knives, Roman 'Ranger' Bandera, Hana Banaga, 'Nesuli'.



  Royal Jelly Awards:

  Young Drone (XX-660) is awarded the Royal jelly of rejuvenation: 'For your outstanding performance, in terms of serving the hive since the beginning to end, I bestow you the jelly of rejuvenation, for being a key vital role within the healing process for all our sisters, you have done excellently well, and you have done a great job. You may be a young mind, but you are going down the right path, based on what I see is that your still learning but at least your learning in the correct way that tremendously help the hive, you are a star in our hive. Great job!' by Prime Queen (PRO)

  Elder Praetorian (CL-572-O) is awarded the Royal jelly of resilience: 'Based on what I have seen you were the survivor of the powerful tier 3's caste since the beginning to end, and without you I wouldn't be able to halt or stop the talls advances that easily. for that I will point out you made many captures for the hive by flinging them to the direction then grasping them to be brought to the nearest egg morpher. You have also saved many sisters I believe by shielding or preventing their death all together. Not to mention you ravage the talls at the north of the perch, killing them swiftly with your sisters. For that you do deserve this jelly well done!' by Prime Queen (PRO)




