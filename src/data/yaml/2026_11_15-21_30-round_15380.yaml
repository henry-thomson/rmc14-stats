roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Wrecks-The-Plan, Slate 'Argo' Barbarossa, Lily Cressman, Pulls-The-Pins, Breath of Ashes, Tato 'Crispy' Prank, Swears-Like-Sailor.



  Royal Jelly Awards:

  Ancient Hivelord (GRY-765) is awarded the Royal jelly of resilience: 'My daughter GRY you were one of the original builders of the hive, helping me and the other 14 hivelords in preparing for the talls. Your resisted them up until the end and for that I rewards you this jelly.


  Rejoice!' by Immature Queen (WOLP)

  Elder Hivelord (SA-646-M) is awarded the Royal jelly of resilience: 'My daughter SAM you were one of the original designer lords that help construct our hive. You supported our 14 other hivelords in massive construction of the resin. For your service in today fight I reward you this Jelly.


  Rejoice!' by Immature Queen (WOLP)

  Elder Praetorian (RUK-69) is awarded the Royal jelly of resilience: 'My daughter RUK you were the last of the original teir 3s supporting the many Queens before me. Your continual effort in being the royal valkyrie has not gone unseen. I reward you this Jelly in thanks for your work.


  Rejoice!' by Ancient Queen (WOLP)

  Elder Hivelord (LM-106-N) is awarded the Royal jelly of resilience: 'My daughter LMN you died then return again and again to help in building. There from the start you always assisted in aiding the many of the designers grand builds. Your resilience in not only your build, but also drive to always come back even as a lesser earn you this Jelly.


  Rejoice!' by Ancient Queen (WOLP)




