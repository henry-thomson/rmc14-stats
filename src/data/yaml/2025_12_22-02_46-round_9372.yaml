roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Roy Skullcrusher, Yarapolk Vernevish, Willow Stargazer, Cinder Eikuni, Reese, Ludwig 'Moleman' Blackmoor, Philbert Garland, Elias Palehaven, Vasra Deltora, Kai-Reedus, Omareth 'Venom' VonRichten, Rhox 'Tanker' Jaex, Ferozo, Canderous Boone, Hubert Sobel, The Fruit of Ignorance, Ash 'Silly' Winter, Heinrick Archsider.



  Royal Jelly Awards:

  Elder Drone (PIL-925) is awarded the Royal jelly of rejuvenation: 'For your immense performance as a healer drone, you have sacrificed a total of 2 times in the entirety of battle. I kept track of your performance, and it was abstounding, you saved so many, healed so many. You were a true healer of the hive, when most recall it as boring task. You have done an excellent job. 


  May you shine in future battles, and even bring more rescues to future hives! Rejoice!' by Prime Queen (PRO)

  Young Ravager (TSA-740) is awarded the Royal jelly of proliferation: 'For your immenseful impact on the frontline, during the early maturity of the hive, you were there capturing, killing, ripping talls in half in my name. None were left to challenge you, but then suddenly you fallen, I was sadden upon your death.


  However, because of your impact, we had an early growth of captures because of you. You were work was noted down, and I will remember the impact you made for the hive!


  Rejoice!' by Prime Queen (PRO)




