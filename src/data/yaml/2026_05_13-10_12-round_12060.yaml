roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Defender (CHO-443) is awarded the Royal jelly of resilience: 'During the engagement of south of bio refinery you fortified to where I was able to capture the tuber and another tall your sacrifice will be noted forever in this battle. thank you for doing what you can' by Prime Queen (PRO)

  Young Defender (YE-934) is awarded the Royal jelly of resilience: 'You decided to shield me from critical injuries, thank you for pushing forward and doing what was necessary for the hive I thank you for being the best shield that was required for the hive. This occured south of bio plant refinery.


  Rejoice!' by Prime Queen (PRO)

  Mature Carrier (HEW-160) is awarded the Royal jelly of proliferation: 'You were one of the major reasons we had talls being put to sleep left and right, and generally you kinda actually saved the hive altogether, because without those eggs I couldn't stop the talls momentum at all without it, so thank you for providing essential egg traps that help made the hive grow today! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
