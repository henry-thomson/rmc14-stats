roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Delta, Roland 'Stahl' Kraus.



  Royal Jelly Awards:

  Young Carrier (AA-680-H) is awarded the Royal jelly of proliferation: 'For your work planting many eggs and securing captures on the frontline, this comes from sisters who have noticed your work. It is rare carriers get noticed, much less ones that are young. So I hope you take this with stride, we need more sisters like you with us!' by Prime Queen (HEK)

  Mature Drone (DE-259) is awarded the Royal jelly of rejuvenation: 'I wish I could reward all of the healers of this war, but jellies are sacred. You have performed admirably and this commendation comes at the behest of your sisters. Well done. 


  Without you, we would have fallen many times over.' by Prime Queen (HEK)

  Mature Praetorian (VAN-104) is awarded the Royal jelly of slaughter: 'For your work securing captures for your sisters.


  I personally seen you turn a open march into a secure fight due to your pulls, that is a hard feat to pull off. 


  This comes at the commendation of your fellow sisters, well done!' by Prime Queen (HEK)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
