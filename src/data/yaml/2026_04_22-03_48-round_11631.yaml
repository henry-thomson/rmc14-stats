roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Burrower (AID-662) is awarded the Royal jelly of sabotage: 'AID, through your efforts, the yellow caste of the talls had no respite. They were always kept on their toes, unable to provide a good anchor for the talls.


  For your amazing work as a burrower, I award you with this jelly, yours to keep entirely.


  See you in the next hive!' by Elder Queen (NEV)

  Elder Warrior (NOX-513) is awarded the Royal jelly of sabotage: 'NOX, I have been told by multiple sisters that you have aided greatly in the perch's constant harassment, and I can say without a doubt that these efforts have contributed greatly in today's victory.


  For your work this day, I award you with your very own jelly. Good work daughter.


  See you in the next hive!' by Elder Queen (NEV)

  Prime Ravager (KR-258-IS) is awarded the Royal jelly of slaughter: 'KRIS, I have seen your work, and it was beautiful. Capturing talls at every chance, dancing around them and executing them with no hesitation. These talls never stood a chance before your might.


  For your amazing work this day, I have decided to award you this jelly of slaughter. Here's to many more!


  See you in the next hive!' by Elder Queen (NEV)




