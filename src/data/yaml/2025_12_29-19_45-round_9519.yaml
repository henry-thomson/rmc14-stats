roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lina Moreno, Juno 'Kleptocat' Kaneko, Hakani Steelnest Pack, Kyra Cowart, Nora Vera, Xaekeax Qerrker, Rufia 'Mayfly' Rufer, Rin Burgundy, Nahami 'Drowsy' Tailfloof, Vesper Mock, Renault 'Ren' Demuth, Galio, Tavish 'Vampire' Ironeater, Rosa Sanchez, John Dribble, Morgan Mothritis, Finn Baum, Dexter Warren, Hugh Dannerson, Tesuko, Velo 'FriendChirp' Flock, Flaps 'Conflag' Walker, Javon 'ill-gotten' Nash, Leo Woolery, Rains of Fire, Fat Dale, Finn Moore, Kyle Winslow, Tyler White, Lenny Figglebottom, John 'Arsonist' Spade, Short-snout Ruby, Long-ears Lucas, Keenan 'The Dog' Epiolos, Arianna Isaman, Carl Bran, Scarlet 'Scar' Aurora.



  Royal Jelly Awards:

  Boiler (TIN-799) is awarded the Royal jelly of slaughter: 'TIN, has proved today, to be the most valuable boiler a hive could ask. I have never seen, a boiler with this levels of skill. Without you, the hive would have perish, you were a key component to destroying the tall menace today.

  Because of this, and your efforts today. I give you this jelly. You deserve it.' by Elder Queen (LAG)

  Prime Burrower (FO-739-OL) is awarded the Royal jelly of resilience: 'Today the hive survives thanks to your efforts, your work helping our boiler and killing the talls, while also helping the rest of the hive maintain the calm during the last moments, proved to be essential to wipe the tall menace.' by Elder Queen (LAG)




