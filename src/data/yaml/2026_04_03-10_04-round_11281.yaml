roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nyx Nova.



  Royal Jelly Awards:

  Elder Drone (MA-703-L) is awarded the Royal jelly of rejuvenation: 'Sister proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. May the future hives are blessed with her presence as well!' by Ancient Queen (LIMA)

  Ancient Drone (BU-406-RG) is awarded the Royal jelly of resilience: 'Sister did not only manage to lead the charge towards a planet tall wipe, but she endlessly kept sacrificing herself for the betterment of the hive with her healing work! Always grazing the edge of danger with her frontline healing, yet at the same time keeping safe at all times. The future hives are in desparate need of her skills!' by Ancient Queen (LIMA)

  Young Hivelord (XX-654) is awarded the Royal jelly of sabotage: 'Young yet incredibly capable sister played a vital role in terrorizing the talls. She kept rotating, weeding, and aciding anything she could get her claws on, and poor talls just watched in despair. We hope to see our sister soon enough!' by Ancient Queen (LIMA)

  Elder Runner (KAT-835) is awarded the Royal jelly of sabotage: 'Although sister met an unfortunate demise, somewhat as she predicted herself, she no less kept the hive constantly informed! She stalked the talls with her keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)

  Ancient Carrier (RAD-29) is awarded the Royal jelly of sabotage: 'Our dearest sister single handedly kept out backline captures flowling, and there were so many of them! All the while she kept trapping even more of them, and forcing talls to second guess their every single step. Any hive without RAD is at a disadvantage, and we don't want to be in their place.' by Ancient Queen (LIMA)




