  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Aurora 'Birdcage' Barkheart, Anna 'Sparta' Lusain, Opal AW SturmGewehr-44, Dallas Deckum.



  Royal Jelly Awards:

  Young Defender (ZA-659) is awarded the Royal jelly of resilience: 'I saw you selflessly throwing yourself into the talls spitting line on multiple occasions, providing valuable cover during their invasion of our caves. Without your crest of steel their spits surely would have meant the end for me and your sisters. For this, I award you this jelly of resilince. Rejoice!' by Elder Queen (FOX)




