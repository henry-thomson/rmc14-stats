roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Defender (MOP-208) is awarded the Royal jelly of resilience: 'MOP, You have been our greatest shield, acting as a wall between us and the talls, always keep not only me but all my boilers safe from the tall's spits.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Drone (WI-55-L) is awarded the Royal jelly of rejuvenation: 'WI-L, You have saved mother from her own recklesness. During the evil eye push, I had gone too far and went critical, but you rushed to my aid without fear of the tall's fire and sacrificed knowing you would die for it.


  For this, I award you this jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)

  Prime Drone (JA-656-K) is awarded the Royal jelly of sabotage: 'JA-K, Your sacrificed was not needed for my survival, but it did allow me to live long enough to gib the tall queen, dropping the tall's morale and cohesion.


  For this, I award you the jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)




