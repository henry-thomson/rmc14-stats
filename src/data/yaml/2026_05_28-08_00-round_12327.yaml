roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Carrier (EMC-407) is awarded the Royal jelly of proliferation: 'For her incredible work as a carrier of supreme caliber, EMC has deserved the royal award! Sister managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war, she was a partial mother to the rest of the hive as the ONLY carrier that I know of! Oh how we becon EMC to help the further hive expansion! May her children are plenty!' by Ancient Queen (LIMA)

  Elder Hivelord (RA-633-ZR) is awarded the Royal jelly of resilience: 'Our incredibly capable RAZR played a vital role in terrorizing the talls, although this award belongs partially to CU as well, they both made prime tier contributions. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Ancient Queen (LIMA)




