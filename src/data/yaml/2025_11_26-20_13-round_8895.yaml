roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Ana Zaychikova, Kenji Sato, Icarus Shadowborn, Raine Ripl, Kyra Cowart, Bailey 'Timber' Hayes, Tiizmo, Adeline Garland, Iva 'Moff' Lynx, Duke Zimmer, Chi Yanne, Miles 'Afro Diver' Cannonball, Syndy 'Cheater' Onnos, Damian Shmit, Rosco 'Sips' Springs, Chunk Lugnut.



  Medal Awards:

  Laura Markova is awarded the Distinguished conduct medal: 'For exemplary leadership of Alpha Squad, guiding her marines with discipline, and confidence. Her excellent command kept the squad effective and coordinated throughout operation Patrol Short-Over on LV-522 Chance's Claim, contributing greatly to mission.


  Awarded by Col. Freya Locke on 11/26/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





