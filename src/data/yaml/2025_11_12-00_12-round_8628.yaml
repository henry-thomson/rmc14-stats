roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jose Cazadores, Connor Cadis, Ralaka, Darren Dugmore, Chin-Ranpu, Trixie Houston, Gnaws-on-Bones, Nesomi, Archibald 'Misfire' Garcia, Minji 'Failsafe' Kilgrim, Mars Amour, Simon Sandford, Jimmy Straub, Blobby Oozeworth, Oliver Bell, Adelice Delahoussaye, Rupert Ivanov, Mizuno 'Kitty' Drakonovisch, Ocean Rain, Bence Peckler, Laura Rahl, Zion 'Reclaimer' Erasmus, Steven Stankum, Arizona 'Ranger' Smith, Gary 'Colander' Hanks, Lucy Bash, Nikki 'Ferret' Blackburn, Miles 'Afro Diver' Cannonball, Kerena Owen, Jim Bean, JG Monnet, Kazo.



  Medal Awards:

  Ajax Graves is awarded the Distinguished conduct medal: 'After their squad leader was tragically captured by a xenonid hive, Graves was plunged into taking charge of Delta Squadron as the smart gunner. I had the distinct honor of fighting alongside them during this battle, and to say the least, they did not disappoint in the matters of brutality and leadership.


  Awarded by Col. Scraps-the-Copper on 11/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ace 'Crimecoat' Flamecoat is awarded the Distinguished conduct medal: 'As the department head of requisitions, it only seems fitting that a large part of their performance today was due to your efforts. The marines and myself had no issue whatsoever getting what we needed for victory over the course of an almost two hour operation - a daunting task for certain.


  My background being in logistics, I can very much appreciate an officer who is dedicated to what I believe to be the primary mechanism of successful warfare - having more shit than your enemy.


  Awarded by Col. Scraps-the-Copper on 11/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Zacharias 'Father' Kobos is awarded the Distinguished conduct medal: 'Through recommendation of your Squad Leader,


  You did a damn fine job today as one of our squad corpsmen. Many wounds were slashed open, bones were broken, much blood was spilled, but we're incredibly damn lucky to have people like you around to keep all of that under control. Thank you!


  Awarded by Col. Scraps-the-Copper on 11/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Sibylla 'Cotton Boll' Disali is awarded the Distinguished conduct medal: 'You, alongside another HIRR batonner were responsible for us scoring quite a few kills that we otherwise would not have done, as well as follying the xenonid queen's efforts at many turns throughout this operation. All of these efforts built up on eachother, contributing surely to the victory that we achieved today.


  Awarded by Col. Scraps-the-Copper on 11/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juan Cortez is awarded the Distinguished conduct medal: 'Simply stellar communication and CAS strikes today. It is rare I hear so much about the state of the battlefield from a birds-eye view, and I can say for certain that the information you gave me avoided us many crucial mistakes.


  Awarded by Col. Scraps-the-Copper on 11/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





