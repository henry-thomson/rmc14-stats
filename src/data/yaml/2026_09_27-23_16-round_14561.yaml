  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sato Ach-Menoe, Velsha Xilareth, Addyson 'Fortuna' Zappy, Wuja-Chalaree, Giovanni 'Brisket' Guess.



  Royal Jelly Awards:

  Elder Ravager (KV-482-AN) is awarded the Royal jelly of resilience: 'For your captures, leadership when i was dead, and surviving since the start, i award you with this jelly of resilience.


  Rejoice my dear sister, and may your loyalty guide many sisters beyond!!' by Prime Queen (RP)

  Young Boiler (LOL-892) is awarded the Royal jelly of slaughter: 'For your work wiping talls when i was immature, and killing the metal beast, i award you with this jelly of slaughter.


  Rejoice my dear daughter, and may your boils keep making talls as good as dead!!' by Prime Queen (RP)

  Mature Hivelord (LM-773-N) is awarded the Royal jelly of rejuvenation: 'Your work as a builder is as fierce as yellow the ones yellow talls build. Your build makes the attrition much more manageable, and i was proud of your work for the entire hive invasion. With your companions, all of you presented to talls what it is to fight against a invencible fortress.


  Rejoice my dear daughters, and may your build be as fast and durable as the best of resins!!' by Prime Queen (RP)

