roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Corey Shaffer, Daniel Brooks, Robert Gun Zander, Eats-The-Pies, Bugs Benedetto, Tex Ferguson, Macy Woodcrest, Axel Card, Blake 'Bark' Barker, Einuko 'Twitch' Steelfeather, Ted Nighteyes, Icarus Shadowborn, James Jamerson, Eiko Tachibana, Sparks-Of-Hope, Sierra Brooks, Norah Thomas, Beedo Waggin, Akira 'Ru' Samir, Ionut Pastrami, Spike MacLagan, The Tropics of Vigor, unknown.



  Royal Jelly Awards:

  Ancient Ravager (KR-566-IS) is awarded the Royal jelly of proliferation: 'You did an exceptional job this battle, matter of fact iwas so significant, to the point to where you were noted on every captured you made. You kept on taking talls left and right, and there was more captures to be done by your claws. You truly were a ravager in this hive, there was alot of close calls to your demise but you pulled through and earned this jelly through hardship, may the queen mother watch over you! Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (KRY-727) is awarded the Royal jelly of proliferation: 'You did an amazing job, in capturing talls left and right. You were a valk praetorian till the end, your demise came at security, but you brought forth an entire new generation through your dedication. Your work will not be forgotten, may a thousand generations speak of your name for how powerful you were in this battle! rejoice!' by Prime Queen (PRO)

  Elder Warrior (WAW-644) is awarded the Royal jelly of resilience: 'You stood proud and firm against the talls defending our hivecore. You doomed about 7 talls roughly that amount, permanently removing them from the battle forever. You made sure the talls couldn't reach hivecore just long enough for me to not to focus on the issue at hand. You truly were a warrior in this hive! May other warriors be just like you! Rejoice!' by Prime Queen (PRO)




