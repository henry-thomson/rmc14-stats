roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Aubrie A Cypret, The Dust of Sol, Sariel, Lucky Fischer, May 'Ant' Olive, Paulie 'Conman' Zarroni, Issac Spock.



  Royal Jelly Awards:

  Prime Ravager (KR-520-IS) is awarded the Royal jelly of slaughter: 'KRIS was my loyal knight which stood at my side and killed every marine who rushed me.


  They also dragged a lot of captures, even capturing 3 tall healers at once.


  Rejoice my daughter!! May your loyalty be rewarded!!' by Ancient Queen (RP)

  Elder Hivelord (XX-484) is awarded the Royal jelly of rejuvenation: 'Our dear hivelord XX-484 rebuilt Engineering, Admin and Medical, finally encircling the talls and allowing our frontline wipe.


  Rejoice my daughter!! I pray to keep seeing more of you!!' by Ancient Queen (RP)

  Elder Warrior (ABO-554) is awarded the Royal jelly of resilience: 'ABO leadered the rush and also leadered backline when talls landed, eventually leading to our victory.


  Rejoice my daughter!! May your determination keep sharp!!' by Ancient Queen (RP)




