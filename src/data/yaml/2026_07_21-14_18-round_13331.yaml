roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vince Vale, David 'Dig' Diggle, Missulena Simus, unknown.



  Royal Jelly Awards:

  Young Boiler (ECO-795) is awarded the Royal jelly of resilience: 'It is only through the great efforts of sister ECO that our hive was able to survive. Brought to the brink of extermination, her endless clouds of acid have killed hundreds, if not more of the skytall menace. Buying enough time for new sisters to emerge and for us to grasp victory out of the claws of the talls. She has more than earned this reward.' by Prime Queen (LEON)




  [bold]Operation funded by [color=green]reversE davE[/color]![/bold]



