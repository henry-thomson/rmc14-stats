  Medal Awards:

  Corporal Sarah Ravenmist is awarded the Medal of valor: 'Corporal Sarah Ravenmist took charge in the darkest moment of their squad, with their Squad Leader lost to the fires of battle they were placed in charge of Bravo and, under their supervision, ensured FOB did not falter. In-fact, as I hear FOB is among the strongest I'd ever seen.


