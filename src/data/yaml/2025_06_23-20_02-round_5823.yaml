  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Pierre 'Quasimodo' Girard, Alex 'Enigma' Arawaks, Iris 'Tempest' Cookia, Night-Streaker.



  Royal Jelly Awards:

  Ancient Hivelord (PRK-833) is awarded the Royal jelly of proliferation: 'For your dedication in making defense for the hive, I am bestowing this jelly for your bravery in ensuring the victory of the hive. The most impactful thing I have personally witness, was you quickly making thick resin walls right next to the perch defenses, which allowed the entire front to easily crumble their defense with ease, with a heighten distance advantage, well done from you. Rejoice!' by Prime Queen (PRO)

  Young Boiler (XX-676) is awarded the Royal jelly of slaughter: 'For your well placed attacks upon the red talls, I am aware of some boils that annihiliated their group with ease. Because of that, you were able to help keep the pressure and counter every attempt of them trying to save talls. Not to mention, you survived since the beginning to end, something that you should be proud of. I hope to see you get stronger in the future, and keep annihilating talls in your way. Rejoice!' by Prime Queen (PRO)




