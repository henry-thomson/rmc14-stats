  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Mark Petrovis.



  Royal Jelly Awards:

  Ancient Lurker (NOX-451) is awarded the Royal jelly of proliferation: 'You are the hunter, you are the nightmare that lurks in the dark. You are the quiet whisper that takes talls in the dead of night. By my count, you personally captured over 20 talls and kept our war against raging. For your unrivaled services to expaning our hive's numbers, i give you this jelly of proliferation.' by Elder Queen (CMP)

  Mature Defender (KAI-59) is awarded the Royal jelly of resilience: 'You are the wall, you are the bastion. Your hide is hard and strong as steel, and your resolve is unbreakable. The pathetic spits of the talls mean nothing to you, for you are a steelcrest, shield of the hive. For protecting and saving the lives of our critical boilers and healers, i give you this jelly,' by Elder Queen (CMP)

  Mature Drone (XY-783-Z) is awarded the Royal jelly of rejuvenation: 'You are our savior, you are our kindly guardian. Your efforts in keeping our sisters healthy and hale manged to maitain ourfrontlines for far longer then they should have had. For your   services in keeping our hive healthy, I give you this jelly' by Elder Queen (CMP)




