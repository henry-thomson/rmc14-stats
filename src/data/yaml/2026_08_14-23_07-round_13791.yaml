roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jack Castle.



  Royal Jelly Awards:

  Ancient Drone (VV-361) is awarded the Royal jelly of rejuvenation: 'VV, You have saved my life with the cost fo your own. I was charging the talls looking for a massacre, but failed to realise how many there were and how few sisters followed me, leading me to a critical state. Despite this, you rushed to my aid and sacrificed yourself to save me.


  For this, I award you this jelly of rejuvenation. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)




