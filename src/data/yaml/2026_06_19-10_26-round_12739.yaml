roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Madelyn 'Cyclops' Rhinehart, Xyto Avaeilia, Xia Venatae.



  Royal Jelly Awards:

  Young Hivelord (ADB-367) is awarded the Royal jelly of resilience: 'I AM SO PROUD OF YOU ADB.

  Even as a young hivelord, your efforts as a build leader helped us a lot against the talls. Keep up the good build, you are an amazing builder, I hope to see you in many other hives, rising them everywhere. I am sure queen mother is watching your builds closely, as proud as me.

  I am really grateful for your build.

