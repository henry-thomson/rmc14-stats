  In memoriam of our fallen soldiers:

  Montag 'Ashes' Ashford, Al 'Duck' Bone-Breaker, Olive Orr, Beady-eyed Little, Damon 'Bite' Wilo, Icarus Shadowborn, Durr Tenet, Wayne 'Cowboy' David, Ends-The-Bloodlines, Tex Ferguson, Creates-many-Problems.



