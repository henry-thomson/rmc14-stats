  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Elle, Azeez-Deeja, Maximilian Magnus Johnson, Elroy Aegyr.



  Royal Jelly Awards:

  Ancient Boiler (GUH-893) is awarded the Royal jelly of slaughter: 'My favourite boiler from all hiveminds out there. We were essentially the same mind at a certain point, you were without fail there everytime i needed you.' by Prime Queen (BUH)

  Elder Praetorian (VA-235-LK) is awarded the Royal jelly of proliferation: 'Scream, scream and screams, i might need screaming lessons from you, how do you do it? saved me from tuber 3 times where it would have been certain death. Her determination was quite ingenious, got a micro panic attack when i left her line of sight for a mere 10 second. Thats a true royal valkyrie!' by Prime Queen (BUH)




