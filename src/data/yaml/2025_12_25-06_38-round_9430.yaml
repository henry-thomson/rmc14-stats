  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Praetorian (KAY-944) is awarded the Royal jelly of proliferation: 'Since the beginning of the sands of time you have ensured the survival of the hive, by continously pulling in talls, and capturing them. Breaking, demoralizing the talls and lessening their numbers overtime during combat.


  Overall you have done an amazing job as a young praetorian.


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (EV-51-D) is awarded the Royal jelly of proliferation: 'I recall seeing you built up the talls nest, after we breach the north side.


  You have made a significant impact by building as fast as possible as a whisperer, you truly know the way of the resin. 


  Your effort has been noted, and I enjoy every bit of it. Rejoice!' by Prime Queen (PRO)




