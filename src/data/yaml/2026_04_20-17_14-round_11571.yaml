roundEndText: >2-

  Though the resistance of the colonists was vast and great, they could not overcome fate. As the bright flashes of the bombs glowed in the distance, their heat radiating like a warm embrace, you smile at the idea that your defiance of the inevitable bought someone you’ll never know, a little bit more time.


  You did not go gentle into the goodnight.

  You raged, raged against the dying of the light






