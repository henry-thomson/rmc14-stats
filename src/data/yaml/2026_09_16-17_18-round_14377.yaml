  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hark Willson.



  Royal Jelly Awards:

  Ancient Drone (BA-973-KA) is awarded the Royal jelly of rejuvenation: 'BAKA, You have saved the life of not only our valkyrie AHH, but also myself, while still tirelessly healing your sisters all day to make sure they were in condition to keep fighting.


  For this, I award you this jelly of rejuvenation. Rejoice!


  See you in the next hive!' by Prime Queen (NEV)




