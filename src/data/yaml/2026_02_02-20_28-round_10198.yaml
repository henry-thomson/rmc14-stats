  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Brom Matlock, Jesse 'FANG' Savat, Yuki 'The Cat' Suzuki.



  Royal Jelly Awards:

  Mature Hivelord (MI-916-M) is awarded the Royal jelly of resilience: 'Sister showed incredible competency with relentless building and managed to stragle the talls, depriving them of spit and any hope for life! Nothing, not even a hive killer can kill this sisters dedication to killing off the talls! May future hives be blessed with her talent!' by Ancient Queen (LIMA)

  Mature Warrior (MR-502-Y) is awarded the Royal jelly of slaughter: 'Sister proved her hunting skills, she weaved around the talls untilt they couldnt even follow her steps. During her hunt she managed to secure and help gut nothing less than a tuber tall! Her skills are much desired and the future hives will beg her for help in killing more talls!' by Ancient Queen (LIMA)




