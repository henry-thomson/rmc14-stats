  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Sir-Stabs-Alot.



  Medal Awards:

  Tavish 'Vampire' Ironeater is awarded the Distinguished  conduct medal: 'For excellent demolitionist work, cutting down the lives of many xenos as we made our advance into their hive. I personally witnessed through overwatch as you slew the final ravager of their brood, through an absolute monster of a shot. You are accurate and precise - two traits you don't quite think of when you hear the term 'demolitionist.' 


  Awarded by Col. Scraps-the-Copper on 8/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Invokes-the-Cobra is awarded the Distinguished  conduct medal: 'Consistent work with your grenade launcher, as well as excellent communication to your squadmates and CIC. Even took initiative to grab a set of OB coordinates, despite us in CIC settling on using another set.


  Awarded by Col. Scraps-the-Copper on 8/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Explains-the-Plot is awarded the Medal of valor: 'This one comes as a recommendation from your squad leader.

  You performed admirably, holding in regard the lives of others above even your own, and with such urgency that your deeds could not have gone ignored today. This selflessness that you displayed in your action represents how every corpsman and marine should lay down their lives for eachother in the field of battle. Truly, an inspiration to the corps.


  Awarded by Col. Scraps-the-Copper on 8/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  The Forest of Chaos is awarded the Distinguished  conduct medal: 'As per recommendation of your squad leader, and verified by myself.

  In the absence of your squad leader, the mantle and responsbility of leadership of Charlie Squad fell upon your shoulders. Though only a corporal, we up here in the CIC can vouch for your leadership abilities as you took upon all of these responsibilities without complaint and carried them out adequately in the face of utmost danger. Excellent work - it's people like you that I know we can rely on to keep the corps working like the well-oiled machine it is.


  Awarded by Col. Scraps-the-Copper on 8/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





