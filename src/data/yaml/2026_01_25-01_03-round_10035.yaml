roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Neeus-Sudie.



  Royal Jelly Awards:

  Ancient Warrior (JA-133-KE) is awarded the Royal jelly of sabotage: 'My daughter, a simple warrior. With her cunning and wit managed to capture many talls. How you may ask? Using dead talls as bait. I saw her efforts in the backline to open a flank upon the talls in research cells. She led a group of sisters with great success, and through her efforts the day was won. May all the hive have your determination and skill. Bravo!' by Ancient Queen (ARG)

  Prime Drone (RO-765-CK) is awarded the Royal jelly of rejuvenation: 'This daughter took on a thankless task. While mother was in ovipositor she fed her plasma so that mother could save many of her daughters via healing. For this task she asked nothing of the hive. In the battle that came, she escorted mother and gave her life for the hive. We rejoice at your sacrifice!' by Ancient Queen (ARG)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



  [bold]Hive established by [color=purple]Rubylord SIP.[/color]![/bold]
