roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Romeo Baxter, Nithcraal 'Bulwark' Enoki, Ilosuni Pato, Paff XV, Bradley Smith, Marco Hutton, Billy Bob, Rax Meowser, Denys 'Rust' Smith, Samson Parker, Lenny Kuster, Ferris 'Frostbite' Treadman, Diane 'Banshee' Modiste, Lobo 'Brownpant' Bonita, Colin 'banjo' Fraiser, Vivian 'Asterius' Magnus, Alyx Glass, Points-and-Shoots, Vin 'Birthday girl' Peyton, Gustavo Thorley, Benjamin Morgan, Mary Squibb, Vexillum Regis Obice.



  Medal Awards:

  Private Baromir Kemerer is awarded the Medal of valor: 'Private Kemerer stood tall and significant during a moment crucial to the operation, where the barricades and marines of FOB buckled under the pressure of a small but desperate xenonid horde they stood tall and provided signficant assistance to the elimination of the queen and their horde permitting the operation to continue to victory.


  You've shown a bravery today beyond that to be expected of your position, and very well might've saved this operation.


  Awarded by Maj. Kaitlin Zalack on 02/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





