roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joeseff Schmit, Marianne 'Rose' Rosemary, Ace Flamecoat.



  Royal Jelly Awards:

  Prime Drone (FL-866-W) is awarded the Royal jelly of resilience: 'Sister FLoWer was our backbone on pushing and holding, healing and making sisters fast to push and capture. They were an amazing gardener that deserve all the praise they got.


  Rejoice my sister, may your garden be eternal!!' by Prime Queen (STAS)

  Elder Praetorian (AHH-5) is awarded the Royal jelly of resilience: 'By surviving every phase of our hive expansion, saving me when tubed and many sisters with a reaction time i wish every valk had, they made sure our victory chance would exist.


  Thank you my daughter!!' by Prime Queen (STAS)

  Elder Drone (HE-174-A) is awarded the Royal jelly of rejuvenation: 'For your many heals as a drone that saved many sisters i deliever you this jelly for your bravery. Thank you for all the healing, rejoice my daughter' by Prime Queen (STAS)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
