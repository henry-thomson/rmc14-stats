roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Ishmael, Ne'Zun, Mervio Ghekon, Paduxi-Utamukeeus, Purp Winter, Vivi Velmara, Lotash-Saurmor, Rafael Stough, Dodges-Responsibility, Nelson Bratton, Hudson 'Joker' Dwayne, Thurgood Ryebell, Abner 'gardener' Doon, Orbits-The-Squad.



  Medal Awards:

  Asska-Ra 'Cobra' is awarded the Distinguished conduct medal: 'Recommendation by 1stLt. Caine Ruffalo on the behalf of SSgt Asska-Ra 'Cobra' for "Holding the FOB and Taught 12 new E1's while also keeping majortiy of their Squad Alive. During a coulda be otherwise disasterus operation"'



  Royal Jelly Awards:

  Mature Carrier (TO-881-MB) is awarded the Royal jelly of proliferation: 'In a very, very difficult time for the Hive. You kept growing eggs allowing us to grow with whatever talls we were carrying with us at the time. You allowed our Hive to Grow in the darkest of Times. I thank you, and I hope you can grow the Queen Mother's Hive one day.' by Elder Queen (OXD)

  Young Runner (MO-532-F) is awarded the Royal jelly of rejuvenation: 'You kept Healing, and Healing, and Healing in a situation in which the Hive should have collapsed. You in tandem with the Carrier made sure we did not collapse. For this I reward you this jelly in hope one day you can grow the Queen Mother's Hive as well. You helped so much that words are not enough to express how well you have done things.' by Elder Queen (OXD)

  Prime Runner (NOX-768) is awarded the Royal jelly of sabotage: 'In our dark times you kept allowing us to grow by sabotaging the talls. Calling out their locations. Capturing them to grow the Hive. And many more. You sabotaged the talls so much, helping cause discord amongst their caste. You more than deserve a Jelly, you deserve to be amongst the Queen Mother's Caste's, sabotaging anything in her path.' by Elder Queen (OXD)

  Young Praetorian (BL-604-U) is awarded the Royal jelly of resilience: 'Despite unfortunate circumstances you were with the Hive since the beginning. You survived while so many other sisters suffered an unfortunate demise. I thank you for helping the Hive live on by being so resilient against the Talls.' by Elder Queen (OXD)

  Young Praetorian (LN-746-K) is awarded the Royal jelly of resilience: 'You along with the other Praetorian, had been with us since the beginning. I thank you for staying with us and resisting the Talls Spit. Without you we would have suffered more than we have.' by Elder Queen (OXD)


