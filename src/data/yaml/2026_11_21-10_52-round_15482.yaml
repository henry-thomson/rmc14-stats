roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Warrior (TA-11-NK) is awarded the Royal jelly of proliferation: 'My Dear Daughter, Without your dedecated work and experiance this battle against the tall would have looked much different than what the outcome has become. You tackled down many dangerous talls putting your very own life on the line, i saw you graze death without fear and pushed on forward to get what needed to be done.. and with that help we captured Lurker tall and managed to get a wipe on the talls which broke their spirits and fleed leaving behind many of their own to their fate. I thank you for your hard work in this hive!! Rejoice!!' by Ancient Queen (ASH)

  Young Hivelord (MIN-887) is awarded the Royal jelly of sabotage: 'My Dear Daughter, you stepped up to become a hivelord and build and make cover for us when we had non, our battle against the tall would have been harder and likely would have cost many dear sisters lives if you didn't step up and build to your hearts will, i thank you for your dedecation and cover which allowed us to pin the talls to their fate! i thank you for that! Rejoice!!' by Ancient Queen (ASH)

  Prime Praetorian (KR-800-IS) is awarded the Royal jelly of resilience: 'My Dear Daughter, You dove in risking your own life saving me from tuber not once, not twice but three times. You've saved the whole hive doing so and ensured the survival of many sisters putting out dangerous fire which could have killed so many.. I thank you for saving your own sisters and mother. Rejoice!!' by Ancient Queen (ASH)




