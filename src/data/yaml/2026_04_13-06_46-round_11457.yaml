roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rhys Hendricks.



  Royal Jelly Awards:

  Ancient Warrior (EVE-236) is awarded the Royal jelly of resilience: 'During the moment of need you shielded me at a critical moment where I was a inch away from death when you fortified to deny any further harm south east of dynagrid entrance.


  It was a bit clumsy of me to ignore the tuber aiming for me, but you did honestly great work on doing your role, keep at it when you were a defender! Rejoice!' by Prime Queen (PRO)

  Young Praetorian (XO-917-O) is awarded the Royal jelly of proliferation: 'For an young oppressor you did absolutely amazing today in this battle, in total assist or not they are all accounted for, you made 8 captures for the hive, you ensured that a new generation was born forth from your hard work!


  Rejoice!' by Prime Queen (PRO)

  Elder Defender (NOX-26) is awarded the Royal jelly of sabotage: 'Well done being quite informative to the hive specifically during the moments silly talls were trying to dive in my lands between TSE Airbase and Casino, they were bundle up like headless prey because of your sabotaging efforts on preventing talls from hive diving.


  Rejoice, because that definitely prevented a horrible scenario to have arrived, and scored us 2 captures because of that.' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
