roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Grease 'Slimy' Stinkerson, Sean Murray, Eva 'Athena' Vasilia, Caleb Bloodworth, Deimos Adette, Ethan Tiger, Sebastian 'Squish' Eventide, Fenton Kirkson, Takos Gibson, Danny 'Ketchup' Heinz, Danny Mcflane, Maria 'Maniac' Malzar, Aghata 'Supressfire' Fall, Jared Riggle, Tom Tonk, Mariki 'Rocketbird', Brick Rhinehart, Bailey 'Lucky' Carmichael, Nero 'Boomer' Pero, Ryder Brooks, Tim Tiptoe, Eats-The-Shrimp, Althea Ascles, Petra Knez, Texas 'Hobo' Winchester, Sly Buunero, Morel, Panacea, Marsh, Olivia 'Haze' Prospero, Raya Aestas, John Shepard, Elijah Clarke.



  Medal Awards:

  Second Lieutenant Aurora 'Birdcage' Barkheart is awarded the Medal of valor: 'for your astounding work on in the normandy killing several key targets among the xeno hive. weakening them enough for our ground troops to finish them off so we may secure victory this day


  Awarded by Col. Tyr Ragnarson on 10/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Deliah Rothman is awarded the Distinguished conduct medal: 'on the recommendation of the ASO. for your work in gathering intel unpromted. making sure our troops had a steady supply of intel after the inevitable death of our so called intel department


  Awarded by Col. Tyr Ragnarson on 10/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Corporal Richard 'Ekron' Goldstein is awarded the Medal of valor: 'for stepping into rather large shoes. saving your squad from crumbling from the death of your SL. your show of valor inspired the men under your command and kept them in the fight long enough for us to secure victory this day


  Awarded by Col. Tyr Ragnarson on 10/17/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





