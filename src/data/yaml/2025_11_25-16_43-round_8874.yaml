  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Julianne Eckhard, Faye Steele, Erin Baker, Asya Emilee, Abigail 'Blue Bird' Dawkins, Wulfrun Blue, unknown.



  Royal Jelly Awards:

  Elder Defender (MRT-527) is awarded the Royal jelly of resilience: 'A prime example of what the defender should be, saves boilers in critical moments and protected crestless sisters! Even more than this, they like a true xenonid captured clueless talls in the backlines and were evil all along. Thus i give you the jellie of resillience, because even when you die you will be back at it again.' by Elder Queen (HII)

  Mature Crusher (JE-161-PH) is awarded the Royal jelly of resilience: 'They had tanked countless rockets for the hive, defended the crestless and slammed talls into the ground. An example of the defender giving its life for the hive. Thus i reward you with a jellie of resillience.' by Elder Queen (HII)




