roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Charles Muggins, Kasher Hellsing, John Weller, Theotima Radiatus, Rhaun-Ironclaw, Blunt-nose Sage, Alfa, Norman A W Bow, Zoey 'Killer' Grimshaw, Eric Boiler, Chuck Strand, Dar'Moar, 'Squealer' Squeak, Chuna-Ullis, Leo Taggart, Geoff Larson, Huna Luxious, Manbo Hachimi.



  Royal Jelly Awards:

  Elder Burrower (JE-682-PH) is awarded the Royal jelly of proliferation: 'I award JEPH the jelly of proliferation for their outstanding work as a burrower, ensuring we have tunnels for an escape route to back out to, keeping other sisters alive from certain doom and also helping rebuild hives and nesting spots.' by Elder Queen (KRIS)

  Prime Praetorian (TO-628-MB) is awarded the Royal jelly of resilience: 'I award TOMB the jelly of resilience for being one of the last tier 3s to survive today. She has kept our front and backlines strong and has aided us greatly, pushing herself to the end.' by Elder Queen (KRIS)

  Ancient Hivelord (ORB-670) is awarded the Royal jelly of proliferation: 'I award ORB the jelly of proliferation for her amazing work in constructing many resin structures for this hive, keeping our hive and the frontline strong and maintained.' by Elder Queen (KRIS)

  Young Boiler (JA-578) is awarded the Royal jelly of slaughter: 'I award JA the jelly of slaughter for the talls she has slain on this day. Before unfortunately falling in battle, she has greatly helped prevent the talls from advancing on their push and has also wiped a large group of talls with me.' by Elder Queen (KRIS)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
