roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Marlon Marshall, Chilwir 'Chilli' Drumarz.



  Medal Awards:

  Caden Nickolson is awarded the Distinguished conduct medal: 'Caden Nickolson, along with Beace Poppers made a terrific and terrifying team of scout specialists today. These two together gave CIC valuable information, performed lethal flanks, and gave the xenonid queen much to fear. 


  Sadly, Beace Poppers' flew too close to the sun and was caught out in one of their engagements. With their partner gibbed, Caden Nickolson vowed to get revenge, and revenge they did get.'





