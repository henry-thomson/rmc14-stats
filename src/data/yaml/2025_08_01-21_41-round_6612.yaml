roundEndText: >2

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Spinax 'Chewy' Bahama, Nomi.



  Royal Jelly Awards:

  Young Hivelord (GC-385) is awarded the Royal jelly of resilience: 'This daughter built an incredible hive on my command. Their resin stood against the talls strongly while providing much needed cover for my other daughters. They listened well and built anywhere and everywhere. Truly a shining example of what a hivelord is supposed to be. Incredible work.' by Prime Queen (GIB)

  Young Praetorian (GN-839-A) is awarded the Royal jelly of rejuvenation: 'This valkyrie saved my life when tuber had me at my weakest moments. Their scream enabled me to get up and fight back. Although they fell in battle, they left an impact on the battle like no other.' by Prime Queen (GIB)

  Elder Ravager (KR-904-IS) is awarded the Royal jelly of slaughter: 'This daughter helped slaughter many talls. Each of my screeches was well used and they spilled alot of tall blood in my name. I count on two occasions that tuber hit me, and this daughter had fought the tall horde for me. You truly have done an amazing job and I am proud.' by Prime Queen (GIB)

  Elder Carrier (PIP-976) is awarded the Royal jelly of proliferation: 'This daughter served well in trapping and making sure every tall was captured. Their eggs helped make everything easier and grew our hive tremendously. They made backup hives, which helped keep our attrition and called out tall locations very well. They have earned the jelly of proliferation.' by Prime Queen (GIB)

  Carrier (SHE-834) is awarded the Royal jelly of proliferation: 'This daughter sticked by my side while simultaneously infecting many talls. These hosts grew to shape our hive and helped us defend against invaders. I did not need to worry about talls breaking out of my daughters, for there was always a trap to infect the tall with. Amazing work' by Prime Queen (GIB)
