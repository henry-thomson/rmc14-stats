roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Second Lieutenant Derick 'Naptime' Hunt is awarded the Medal of valor: 'During Project Clean-Warden, made devastating strikes on the enemy Xenonid hive in multiple places, securing vital kills in a manner reflective of great expertise. Your support wins wars, even if this battle was lost.' by Lieutenant Colonel The Force of Nature



  Royal Jelly Awards:

  Ancient Defender (JA-618-KE) is awarded the Royal jelly of proliferation: 'A excellent job capturing the talls in large quantities replace our lost sisters, and for helping lead the wipe of the blues at Dyna grid. May your service to the Hive continue.' by Elder Queen (CTC)

  Young Hivelord (WT-342) is awarded the Royal jelly of resilience: 'For being there when your sisters needed you most, building upon the talls backline and securing the wipe at dyna grid at a critical moment, you have earned the respect of the Hive!' by Elder Queen (CTC)

  Ancient Praetorian (TA-416-NK) is awarded the Royal jelly of slaughter: 'A excellent job working alongside the other combat castes in wiping the talls back to back, and finally bringing the battle to a close with the death of the dreaded Tuber... Well done Child, serve the hive with pride!' by Elder Queen (CTC)

  Mature Carrier (MUD-1) is awarded the Royal jelly of proliferation: 'A excellent job today, you ensured children were always ready for your sisters to use, and helped ensure plenty of captures from the wipes today. Well done.' by Elder Queen (CTC)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
