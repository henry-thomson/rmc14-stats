roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Clayton Alliman, Bimee-Nosaleeth.



  Royal Jelly Awards:

  Mature Praetorian (RE-441-C) is awarded the Royal jelly of rejuvenation: 'RE-C, you have saved my likfe on more than one occasion, preventing the talls from delivering a great blow to our hive. Not only this, but you have saved the life of many other sisters this day.


  For this, I have decided to award you this jelly to show my gratitude.


  See you in the next hive!' by Elder Queen (NEV)

  Elder Praetorian (MI-736-A) is awarded the Royal jelly of proliferation: 'MI-A, I have seen you work, you have impressed me. Although many sisters doubt the strenght of the dancers, their abilty to drag is unrivaled, and you have shown this to be true. You have helped in the captures of dozens of talls, including the special boomsticker.


  For this, I have decided to award you with your very own jelly, not only to thank you for your work, but to encourage you to keep up the great work.


  See you in the next hive!' by Elder Queen (NEV)




