  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Einyo Topgun, Jibs Mcleafins, Krieg Barkhart, Greyy-Kzeth, Donny Jewell, Zyra Azil, The Pome of Mercuriality, Blelew 'Thunderruns' Uukabinko, Lexi Overstreet, Kazala 'Wyvern', Bohn 'Zombie' Griff, Adam 'Fractured' Johnson, Eliza Hook, Lenny Kuster, Zemlya, Grabs Beekus, Rico 'Bites' Fletcher, Maximus Holdeman, Buzz Fibres, Rattia ''OD'' Bulletgnawer, Anne Kiefer, Diana Ewing.



  Royal Jelly Awards:

  Young Spitter (ZO-236) is awarded the Royal jelly of slaughter: 'You have done an amazing performance out there ZO, for when you were an oppressor, I saw you perform actions as young praetorian that was so talented, you pulled those talls like they owned you fruits. I would say you maybe you should invest more time into you, and see where it takes you! You seem to be the type that will potentially be so evil that I can't even fathom your potential. May the Queen Mother watch over you, and may you deliver more victories for the hive thank you everything.' by Prime Queen (PRO)

  Ancient Boiler (TMM-912) is awarded the Royal jelly of slaughter: 'I am bestowing this jelly for your immense impact on this battle. For starters, the most impactful boil that I of which witness, was you hitting the tuber square on west of research habitation that of provided a smoke screen, for me to exploit, and capture the sad tuber. You also held the disposal evil eye area when talls were pushing forward. You provided smoke screens, and counters against the talls one blob horde of death at every countless turn. Managing to also avoid every green stick in sight. Your service was noted, and you deserve this. May the Queen Mother watch over you!' by Prime Queen (PRO)




