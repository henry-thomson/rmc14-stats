roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Seymour Jenkins.



  Royal Jelly Awards:

  Young Praetorian (SAL-915) is awarded the Royal jelly of rejuvenation: 'A valk, a protector of the hive, for me and others you have shown your weight that was required of you. You ensured my survival when I got stunned at the engagement of engineering.


  You saved a ravager from death, and prevented further harm to them. 


  that is all I can list in terms of achievement, but you have done an excellent performance, well done young valk.


  Rejoice!' by Prime Queen (PRO)

  Young Carrier (BUG-730) is awarded the Royal jelly of proliferation: 'You aid the frontline immensely, by placing eggs for the frontline to utilize for the entire time.


  Without your support, it would of been way harder to capture, and put talls to sleep, I believe to even say you were our only carrier. 


  Such work will forever be noted in this chapter of the hive.


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
