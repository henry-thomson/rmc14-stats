roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  London Baxter, Porter 'Porker' Keopple, Titus Slimian, Jasper Gray, Kresny Corsac, Godot Rodgers.



  Royal Jelly Awards:

  Prime Praetorian (RAD-555) is awarded the Royal jelly of resilience: 'My Daughter I give you this Jelly for your work as a Valkyrie, you manage to save many daughter lives today and allowed us to continue hive mighty slaughter of the Talls.' by Mature Queen (FOP)

  Elder Drone (ZR-76-G) is awarded the Royal jelly of proliferation: 'My Daughter I gift you this Jelly not only for your work weeding the Talls backline, but also for your most importantly healing of our many sisters. Without you we wouldn't have manage to keep the pressure on the Talls. REJOICE!' by Mature Queen (FOP)

  Prime Ravager (NEV-933) is awarded the Royal jelly of slaughter: 'My Daughter I gift you this Jelly for being the Hammer that striked against the Talls resulting into their total defeat. Your ability not only stay alive, not only to weaken their backlines, but also to do a complete wipe. REJOICE!' by Mature Queen (FOP)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]DAVE[/color]![/bold]
