roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Racc N'Bin, Addyson 'Fortuna' Zappy, Purp Winter, Ted 'Pockets' Gold, Beady-eyed Quinn.



  Medal Awards:

  Private First Class Gives-The-Fish is awarded the Distinguished conduct medal: 'At the recomendation of your Logistics Officer, Private First Class Gives-The-Fish you are being awarded the Medal of Distinguished Conduct for your exceptional service in the Requisitions department. Without your efforts I fear we would not have been able to continue this operation as long as we did. With your determination and keeping us supplied you were a vital role. Excellent work today' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Lance Corporal Eris Talonpath is awarded the Distinguished conduct medal: 'Lance Corporal Eris Talonpath displayed exception use of the mortar during operation Peackeeping Mission Iota-Magazine. At the recomendation of your squad leader, you destoryed several hive clusters and used the mortar with maximum effectiveness. Excellent work today Eris.' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Corporal Ocean 'Purple' Rain is awarded the Bronze heart medal: 'Corporal Ocean 'Purple' Rain is awarded this Bronze Medal of Heart for their actions of defending sensors and keeping it online. Although they have perished their sacrifice allowed us to get important information for us to know where the queen was. Allowing us to go as far in this operation as we did. Your sacrifice to the mission will not be forgotten. Rest in peace.' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Gunnery Sergeant Zoey 'Killer' Grimshaw is awarded the Medal of valor: 'Gunnery Sergeant Zoey 'Killer' Grimshaw displayed exceptional heroism and bravery today. Their efforts in leading their squad and following orders on mutliple rotations allowed us to go as far as we did. Even so, She charged head first into hell with me saving several marines from capture. Not only that, but with her efforts we were able to push and finally kill the queen turning the tide of this battle entirely. Zoey, be proud of your actions today. You deserve this medal of honor.' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





  [bold]Operation funded by [color=green]the farms of Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
