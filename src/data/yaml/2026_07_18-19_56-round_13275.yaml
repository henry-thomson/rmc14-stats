roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Nia Glurf, Runnie 'Ruckus' Roach.



  Medal Awards:

  Lance Corporal Cheeky Chloe is awarded the Bronze heart medal: 'Recommended by proxy on behalf of Alpha Demolisionist Ignis Nyx for Bronzeheart medal; Cheeky Chloe singlehandedly chased the First Xenonid Queen into the path of the falling cluster orbital strike, ensuring the queen's death. They have subsequently lost their life after due to the same strike. However, their sacrifice ensured we could wrap around the xenos and destroy the hive. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 7/18/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





