roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Eks-Splode.



  Royal Jelly Awards:

  Prime Praetorian (YIP-418) is awarded the Royal jelly of proliferation: 'YIP, today your pulls were nothing short of amazing. I understand there was a team behind it so i also wish to recognise them. But without your amazing pulls, smart thinking and amazing patience you wouldnt have gotten so many captures.


  Not only did you get a smartspitter, you got a tuber and boomsticker aswell as many other talls keeping the hive refreshed at all times with new sisters.


