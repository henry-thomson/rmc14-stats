roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Granola 'Biggy' Foot, Alicor 'Pinkie' Merow.



  Royal Jelly Awards:

  Mature Hivelord (KSW-671) is awarded the Royal jelly of proliferation: 'For pushing your limit as a hivelord, and building so fast that it was quite a performance to see. You help build up since the beginning and end. I thank you for providing your cover to the hive and great efficiency in working down removing the crater that talls made at medical. This was taken place at Soro. Rejoice!' by Prime Queen (PRO)

  Praetorian (JA-426) is awarded the Royal jelly of sabotage: 'During the engagement west of Engineering, you lunged a tall lurker and made it possible to capture them instantly because of that you deserve this jelly for such great performance as a warrior It rare to see such efficiency from a warrior. Rejoice!' by Prime Queen (PRO)




