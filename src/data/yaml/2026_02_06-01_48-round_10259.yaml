roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Indigo AW Blackbird, Rosalind King.



  Royal Jelly Awards:

  Ancient Drone (DOK-793) is awarded the Royal jelly of slaughter: 'For your succesful acid explosion in central caves, when the talls attempted to reclaim their fallen friends.


  This was the final nail in the coffin for the talls- and deserves praise.' by Ancient Queen (HEK)

  Ancient Ravager (ARG-487) is awarded the Royal jelly of sabotage: 'For your plan to lure the talls into the caves, some had similar ideas- but you were the first. It's success deserves praise.


  Well done!' by Ancient Queen (HEK)

  Elder Praetorian (REE-528) is awarded the Royal jelly of proliferation: 'For your work securing captures with the carriers, allowing us to retake the colony.


  Well done.' by Ancient Queen (HEK)

  Young Carrier (EK-572-O) is awarded the Royal jelly of proliferation: 'For your work securing captures with the Oppresor, despite being young- you allowed this victory today. And I hope that encourages you further.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
