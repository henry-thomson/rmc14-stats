  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sean Burris.



  Royal Jelly Awards:

  Ancient Lurker (KV-451-AN) is awarded the Royal jelly of sabotage: 'The main reason the talls went running this day was because we captured them all. You and your sister MAT helped exponentiate this process, and showed off examplary teamwork within the hive. Though some works may seem meager to some, never doubt the effect that your indiviual actions can have on the future.


  Love,
    Mother' by Elder Queen (JINX)
  Prime Hivelord (MAT-446) is awarded the Royal jelly of sabotage: 'Your work today was splendorus. I've seen your capturing work over many hives, and today was one of your best works yet. You showed great teamwork with your sister KVAN today, resulting in numerous captures, as well as the capture of the tuber! Be proud of the work you do, further yourself, and further the hive.


  Love,
    Mother' by Elder Queen (JINX)



