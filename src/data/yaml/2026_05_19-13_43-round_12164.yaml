roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Juno 'Kleptocat' Kaneko, Altair 'Christmas' Nightwish, Jack Whitman, The Shell of Expression, Amaryllis 'Alice' Alison, Lyra 'Sicario' Verdes, Minji 'Failsafe' Kilgrim, Cedrik Steel, Faces-The-Music, Davlat 'granddad' Lukin, Gallagin 'GC Addict' Caitman, Oran Fisch, Kazo 'Bubblegum' Cloudjumper.



  Medal Awards:

  Corporal Kazo 'Bubblegum' Cloudjumper is awarded the Bronze heart medal: 'Corporal Cloudjumper was vital to the defense of the FOB during the course of Operation Detour bandit-Theory. They lead and succesfully exterminated hive cores, tunnels and other incursions, allowing the LZ to stand up to repeated attacks. Their work today saved countless marine lives, including that of theirr Squad Leader.

  They exhibited exceptional courage, dedication, and intiative, fearlessly facing the enemy against overwhelming odds. I wish I were able to give you this award in person, you were truly one of our finest.


  Awarded by Maj. Clyde McKinney on 19/5/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Clyde McKinney



  Royal Jelly Awards:

  Elder Hivelord (RI-967-KI) is awarded the Royal jelly of proliferation: 'RIKI, it's a thankless job to be a hivelord. You have built not only the entirety of reactors, but also mining. You have worked tirelessly to make our great hive today. It was hard but honest work.


  For this, I award you this jelly of proliferation for your hard work, you great blue hivelord.


  See you in the next hive!' by Elder Queen (NEV)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
