roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Praetorian (DA-982-RK) is awarded the Royal jelly of resilience: 'This daughter has faithfully followed me through thick and thin, captured many talls during my screams, and led the charges before the screams to trip talls so they could not run, this hive would not be what it is today without this daughter. Rejoice.' by Elder Queen (NELL)

  Elder Hivelord (OSO-618) is awarded the Royal jelly of resilience: 'Though this daughter has died, it has not gone unnoticed. This one has taken initiative to build and stall the tall push for as long as they could build even without me there to cover the resin to prolong it. Without this daughter building and weeding as they go, we would not have had as much room and space to move about and rotate as we did. Rejoice.' by Elder Queen (NELL)

  Ancient Runner (NA-195-MY) is awarded the Royal jelly of proliferation: 'This daughter has exceeded their expectations, transporting our captures securely, finding lone talls in the back for us to converge on, and making plenty of captures in their own rights. Our hive would not be as big as it is now if it wasnt for their actions to help us gain more daughters. Rejoice.' by Elder Queen (NELL)




