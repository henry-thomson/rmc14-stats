roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Lance Corporal Dante Minnie is awarded the Medal of valor: 'Displayed exceptional prowess in the field going off alone into the dark to singlehandedly set up the experimental sensors tower while the rest of the marine force was trapped at the LZ, killing several xenonids by themselves and clearing several hive structures like that of a elite special force.

  The actions taken by this marine go far beyond any expectations set by any member of UNMC... its a shame they fell in the line of duty.


  Awarded by Brigadier General on 28/07/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Brigadier General Gervase Aultman





