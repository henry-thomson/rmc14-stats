roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Damian Shmit, Wih-Suureeus.



  Royal Jelly Awards:

  Prime Ravager (GUH-267) is awarded the Royal jelly of resilience: 'GUH, I don't know where to begin. Being one of the first borns, you helped hive and me in many instances. When I lost my old husk, you kept the hive and your fellow sisters safe. When it was time to strike again, you where there with me the push. I must say you deserve resillience the best. Rejoice! Queen Mother would be proud of your feat!' by Elder Queen (LOL)

  Ancient Praetorian (YIP-472) is awarded the Royal jelly of resilience: 'YIP!! One of my first borns and the only prea we had whole time! I don't remember how many times your timely hooks gained us captures and allowed our hive to survive this long and harsh battle! I must say I am glad I have you in my hive and with me to this victory! You are most deserving of this jelly of resillence. Rejoice! Queen Mother would be proud of you.' by Elder Queen (LOL)

  Young Carrier (GS-12) is awarded the Royal jelly of resilience: 'GS, as our one of the eggsac sisters who survived the mayhem we went through, I had to say your presence helped alot. Thanks to your timely eggs we secured talls without much trouble and survived out the slaughter coming to our way! Rejoice. You are most deserving of this jelly. Queen Mother would be proud of your feats!' by Elder Queen (LOL)

  Young Burrower (EE-485-P) is awarded the Royal jelly of sabotage: 'Our only burrower and the one helped most. Thanks to this sister, we could easily assult backlines and cut off the tall reinforcement and reign the colony. Thanks to their tunnels, our fellow sisters could secure the caps easily. Rejoice! You are most deserving of this jelly. Queen mother would be proud of you!' by Elder Queen (LOL)

  Mature Lurker (OXQ-106) is awarded the Royal jelly of slaughter: 'OXQ, you helped us alot. When we first met with talls, you were there to slaughter the blues and kept the heavy push at bay. You were one of the sisters that kept the hive safe when I changed husk and you were there to pull captures when we strike back again! Rejoice. You are most deserving of this jelly. Queen Mother would be proud of you!' by Elder Queen (LOL)




