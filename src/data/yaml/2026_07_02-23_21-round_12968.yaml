  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Corporal Jeff Dots is awarded the Distinguished conduct medal: 'While serving as a Combat Technician during Task Force Rainbow-Animus, swiftly and expertly established defenses for comms while undermanned and low on support. Your initiative and experience reflected great credit upon yourself, and upheld the highest traditions of the UN Marine Corps.' by Lieutenant Colonel The Force of Nature

  Lance Corporal Rough Grace is awarded the Distinguished conduct medal: 'While serving as a Requisitions Technician during Task Force Rainbow-Animus, worked tirelessly to supply the company while training newer RTs alongside it. Your diligence gained the support of your LO, reflected great credit upon yourself, and upheld the highest traditions of the UN Marine Corps.' by Lieutenant Colonel The Force of Nature





