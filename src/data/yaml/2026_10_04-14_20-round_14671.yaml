roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Gunnery Sergeant Buck 'Pretty' Tern is awarded the Medal of valor: 'Gunnery Sergeant Buck Tern provided an excellent example of the initiative and leadership that should be standard among the basic leadership courses within the UNMC. They noticed and took advantage of an opportunity to flank a cornered xenonid hive to ensure no path of escape remained viable. Significantly accelerating the operational timeline ahead of schedule.


  It is leadership such as this you can take with pride Gunny, Initiative such as this will see you rise the ranks if you grasp at the opportunities ahead.


  Awarded by LtCol. Kaitlin Zalack on 04/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





