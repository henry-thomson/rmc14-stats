roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Snaps-the-Bolt, Risks-his-Life, Ostap Visnya, Rodney 'Baus' Thenbrack, Khezuni, Silent Monty, Noelle Meyr, Hammer 'Dawi-Leader' Hotforge, Blade, Liberty AW Falchion, John Willams, Dell 'Terra' Dellitrasse, Jamayle Williams, Gorbus Johnson, Davie Durstine, Collin 'Rock' Ironside, Sergiy 'Hell' Vovk, Calli Ems, Kara 'Bait' Smith.



  Medal Awards:

  Corporal Rita Marie Dodginghorse is awarded the Distinguished conduct medal: 'Corporal Dodginghorse you step up to become Alpha SL once the lost of its original SL was lost and with them much of their moral. You help regain that moral and forge Alpha forward onto our push to victory, marine well done today.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Lance Corporal Antoine Tchou is awarded the Medal of valor: 'Lance Corporal Tchou you blasted your way through the horde with your launcher securing 3 out of the 4 Queen kills. Without your firepower we would have been lost so early into this operation. Marine you even lead the charge when so many feared the horde and for your bravery I salute you.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Private First Class Mien Rongrong is awarded the Distinguished conduct medal: 'Private first Class Rongrong you supported your aSL when they had to take command after the lost of all other of Alpha leadership. You stepped up aiding in alpha regain cohestion when it was at it's lowest and for that I salute you marine.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Lance Corporal Priscilla Fraser is awarded the Distinguished conduct medal: 'Lance Corporal Fraser you in our many mass cas saved many marines lives, rushing forward to save whoever you can. You kept many of your fellow marines lives and saved even more. You showed what it meant to be a hospital corpsman today and for that I salute you.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





