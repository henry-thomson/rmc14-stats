roundEndText: >2-

  You are home free, with the 'asset' in hand. You question what the fuck Weston-Yamada was doing there to send you into hell and to create such a . . thing. You're not one to think, though - The stinge of septic bandages and the ache of combat lull you into docile calmness. Are you numb, or is the air just cold? You cant tell anymore.


  In memoriam of our fallen soldiers:

  Symira, Austin 'Un'Lucky' Eventide, Jolene 'Rook' Weller.





