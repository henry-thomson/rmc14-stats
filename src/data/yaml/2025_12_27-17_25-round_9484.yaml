roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Lori Snowyfawl, Yarapolk 'Traitor' Vernevish, Caesar Malachite, Novak Hendricks, Rip-Zaw, Long-tooth Jack, Leonard 'Breacher' State, Hellion Wolfgang, Polishes-the-Boots, Jasmine Ludwig, George Gimme, Rhys Hendricks, Spike 'Light-Foot' Fluff Usta, Hudson 'Mule' Keifer, Reese, Oliver Greenwood, Nakuma 'Merry-Merry' Wusha, Bob Bobson, Darren Black, Frankie Iris, The Branches of Hope, Bernard von Steiner, Sera Watanabe, Garry Rack, Scrappy 'The Mouth' Giggles, Ace Sparkdrawn, Ivan 'DGun' Uvarov, Stares-at-Stars, Zachariah Callison, Desmond Pickles, Pat Patlal, Frida Norrgard, Bob Bingle, Mizooki 'PillBug' Akiya, Sarah Redd, Nikki, Berga Hades.



  Medal Awards:

  Dante Minnie is awarded the Medal of valor: 'You son landed a beautiful shot on a queen that was causing us headaches for hours. your actions lead to the death of the queen and the gaining of much needed breathing room for us


  Awarded by Lt Col. Tyr Ragnarson on 12/27/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





