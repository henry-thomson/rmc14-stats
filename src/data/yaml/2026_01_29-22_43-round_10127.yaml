roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bites-The-Badge, Pyotr Lebanov, Keith Stohl.



  Medal Awards:

  Buck 'Bucket' Tern is awarded the Medal of exceptional heroism: 'For your show of courage in the field of battle saving many lives at the risk of your own. you shown what it meens to ba a true warrior of the UN


  Awarded by Lt Col. Tyr Ragnarson on 01/29/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Nato Ach-Menoe is awarded the Bronze heart medal: 'specialist of the Alpha squad, for their examplary courage and skill, felling multiple highly evolved Xenonids and by doing so, saving many of their fellow marines' lives.


  Awarded by Lt Col. Tyr Ragnarson on 01/29/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Ancient Hivelord (WIL-804) is awarded the Royal jelly of proliferation: 'Your dedication as served the hive a huge purpose. You built wall after wall, in every location talls pushed through.


  Their aggression was so profound, but we pulled through, we coordinated, and conquered!


  Yall built so much I lost even count how many times I had to command to rotate to a new position.


  Overall, you deserve this! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (SQ-960) is awarded the Royal jelly of proliferation: 'Your dedication as served the hive a huge purpose. You built wall after wall, in every location talls pushed through.


  Their aggression was so profound, but we pulled through, we coordinated, and conquered!


  Yall built so much I lost even count how many times I had to command to rotate to a new position.


  Overall, you deserve this! Rejoice!' by Prime Queen (PRO)

  Young Ravager (CR-331-U) is awarded the Royal jelly of resilience: 'For your resilience, being one of the last hedgehogs standing to the end. You shown profound effort in helping the hive in the best way possible.


  You may have fallen, but your work was noted, and your loyalty was rewarded.


  We will not forget you, and may the hive prosper!' by Prime Queen (PRO)

  Young Spitter (XX-735-Y) is awarded the Royal jelly of slaughter: 'During the beginning, you were assigned with SUN patrol caste, and of which you were so eager and dedicated to help as much as you could.


  You help with taking out eye tower group.


  You provided distractions, you help with captures, you help as much as I could even realize. 


  Your work, and dedication is shown through pure dedication alone!


  Rejoice!' by Prime Queen (PRO)

  Young Carrier (RA-482) is awarded the Royal jelly of proliferation: 'Since the beginning, you became the carrier of the hive. You absolutely did carry the hive on your back, by deploying eggs as much as you could preventing talls from suicidally rushing.


  Your eggs were in such good spots like I can't even tell you how good it was because it was that well done.


  I was able and many others were able to utilize them, an even make it easier to do captures right on the go.


  That absolutely amazing, you prevented the rushs on cargo, hivecore.


  You name it you were there, and you were doing your absolute best, and I hope to see more of that in the future. I hope to see oyu go crazy again as a carrier, that as astonishing to even see from a young mind such as yourself.


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
