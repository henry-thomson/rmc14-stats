roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Squeaky Chip, Kazo, Drinks-the-Razorium.



  Royal Jelly Awards:

  Prime Warrior (ULI-699) is awarded the Royal jelly of proliferation: 'ULI, today you provided the hive with dozens of captures. You managed to make the whole show of capturing talls seem effortless. You together with RAD were a capture machine capturing so many talls.


  Thanks to your work today YIP was able to just sit in ovi for a long time during our fight. This is a great show of the power that a carrier and warrior can have together.


  YIP!!' by Prime Queen (YIP)

  Prime Carrier (RAD-695) is awarded the Royal jelly of proliferation: 'RAD, you are one of YIP's most trusted supports. Today you showed the great power of working together with a warrior as an egg carrier. You together with ULI managed to make a dozen captures.


  You are a beacon of knowledge for other egg carriers to take after. Your great work today managed to help secure us this victory and made YIP able to stay in ovi for a long time.


  YIP is always happy to have you in the hive and will hope to see more of your work together with others in the future!


  YIP!!' by Prime Queen (YIP)




