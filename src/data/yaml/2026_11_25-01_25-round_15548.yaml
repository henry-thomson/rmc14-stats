roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jobert Bobson, Violet Burns.



  Royal Jelly Awards:

  Crusher (ZYZ-3) is awarded the Royal jelly of slaughter: 'My Daughter ZYZ along with your fellow crusher FEET both managed to deal the crippling blow to the talls by crushing their beast. You both gave up the momentium to wipe out the talls and for that I reward you both.


