  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Granola 'Biggy' Foots.



  Royal Jelly Awards:

  Ancient Boiler (NE-436-T3) is awarded the Royal jelly of sabotage: 'Queen mother has been the sponsor of todays operation and they gave us a TON of WHACKY grand prizes for me to give away to you all! And one of those prizes is.. THE JELLY OF SABOTAGE!! NET3. You have been with me the whole time. You have given a wonderful show of the power of boils. You have provided cover for me and many sisters during captures and gave an amazing tool in capturing and killing talls. Throughout the entire event you have managed to gather... A whole 1000 points granting you this GRAND PRIZE!!! Rejoice for our STAR CONTESTANT!!' by Queen (HOST)

  Elder Ravager (RAD-772) is awarded the Royal jelly of resilience: 'Throughout the entire gameshow I've seen YOU specificly cover for your sisters. You've been the living shield and sword of the show. Your sword like claws have been tearing through the talls helping us drag, capture and live through the horrors of my tubes. Due to your assistance in MY survival during the tube and the previous wonderfull achievements. You have gathered 1000 points and been awarded the grand prize of... THE JELLY OF RESILIANCE! REJOICE!!' by Queen (HOST)




