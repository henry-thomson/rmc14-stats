roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Marco Mrajich, Cade Day, Holden Zeal, Angel Lachner, Dante Sommer, Elias 'Donut' Bennett, Commet 'Flame' Brown.



  Royal Jelly Awards:

  Elder Defender (EF-864-EE) is awarded the Royal jelly of sabotage: 'A brave and noble soul, this daughter gave their life for their queen in dire times. When hit by the deadly tuber unexpectedly, this daughter gave her life covering mother. Without her sacrafice the battle may have been lost. There is not a more noble feat than to save ones queen. Bravo!' by Prime Queen (ARG)

  Prime Praetorian (YIP-742) is awarded the Royal jelly of proliferation: 'Our oppressor daughter, working together with RAD, YIP was able to secure many captures and stall the tall invasion. Most critically they flung the flamewalker enabling it to be gibbed by mother. Without her leadership and prowess the day would have been lost. Rejoice!' by Prime Queen (ARG)

  Ancient Drone (TE-902-N) is awarded the Royal jelly of rejuvenation: 'One of our many gardeners, this daughter won the love and affection of the hive. She faithfull insured that fruit was always avaliable and supported her sisters constantly. From her efforts the whole hive found her worthy. This is far more of an achievement than any mother can offer. Rejoice!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]TAAAAAAANK!!![/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
