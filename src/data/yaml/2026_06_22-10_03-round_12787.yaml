roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Burrower (HU-545-D) is awarded the Royal jelly of sabotage: 'Sister worked tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Always alive, yet always present on the front, how is that even possible?! You must help the hive again, your contributions is what makes us succeed.' by Prime Queen (LIMA)

  Young Hivelord (MO-171) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls, as possibly the single lord! Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Prime Queen (LIMA)

  Ancient Drone (IRA-933) is awarded the Royal jelly of rejuvenation: 'Sister IRA proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Always at the front, saving her queen in times of need! No matter how many times queen fumbles, her talents will be of high demand! Help us IRA, make us one of your great gardens.' by Prime Queen (LIMA)




