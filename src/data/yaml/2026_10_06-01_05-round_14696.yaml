  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Heretic 'Saint' Laurent, Nato Ach-Menoe, Steel Flameson, Jais 'Jazz' Ksaj, Jim 'Smokey' Werner, Chad 'Mambo' Ullman, Slowy Garrison, Orlando Fulton.



  Royal Jelly Awards:

  Ancient Drone (LA-969-MB) is awarded the Royal jelly of rejuvenation: 'You are awarded this jelly for saving JEPH from utter doom. Your competence in performing a healer sack and giving the ulitimate gift, Life, is not lost on me. Thank you daughter.' by Immature Queen (EKAJ)

  Ancient Drone (FE-892-ET) is awarded the Royal jelly of rejuvenation: 'You saved many sisters with consistence and constance healing. More importantly, you weeded backlines and ran captures with no complaints and even asked me for plasma, keep doing that, its good work. Thank you my daughter.' by Elder Queen (EKAJ)




