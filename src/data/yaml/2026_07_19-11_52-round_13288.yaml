roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Sergeant Kara 'Wild Boar' Hathaway is awarded the Distinguished conduct medal: 'For exceptional performance as an artillery spotter during Peacekeeping Mission Cedar-House. Sergeant Hathaway personally designated two Orbital Bombardments, along with countless mortar fire missions. Their efforts proved to be instrumental in the operation.


  Awarded by LtCol. Clyde McKinney on 19/7/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney

  Corporal Alan 'Gambit' Braun is awarded the Medal of valor: 'For exceptional valour in the face of the enemy. During an operation that was quickly degrading, Corporal Alan Braun held the line with their tank crew and ensured many marines managed to successfuly evacuate, narrowly escaping death in the process.


  Awarded by LtCol. Clyde McKinney on 19/7/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





