  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Ancient Praetorian (FOX-791) is awarded the Royal jelly of slaughter: 'You did an excellent job in fighting against talls infact so great we were able to wipe the talls due to your efforts, really well done. Even though the talls did boom themselves you did a shining example of getting captures when I scream, and also beating up talls like they were nothing. Spectacular job indeed, Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (ARG-859) is awarded the Royal jelly of resilience: 'You did a spectacular job in making those captures, you held a death grips on every tall that I wanted gone. You were also an essential piece of support for the hive, always making sure the tuber was nothing but a regular tall in my eyes. You did exceedly well this battle, not to mention you also did great healing support duringt he final engagement during the talls retreat.' by Prime Queen (PRO)

  Young Ravager (NO-128-O) is awarded the Royal jelly of slaughter: 'You help tremendously you were the main damage dealer that we needed to ensure a wipe to go smoothly. You stab, slash, gutted many talls in the battle of the talls retreat, not to mention you even help with multiple flanks, even fighting against the wicked tall lurkers that were in their ranks. You did the hive a tremendous service in making sure these talls know what a true ravager is like. Well done!' by Prime Queen (PRO)

  Young Drone (BB-993) is awarded the Royal jelly of sabotage: 'You did something most daughters are not capable of doing without a bit of luck, and with luck you had. You were able to storm the bird, and take out the bird controllers or buy enough time to ensure their defeat, that was good action from you specifically that scored the true defeat of the talls by ensuring none was able to leave alive.' by Prime Queen (PRO)

  Elder Drone (DO-828-C) is awarded the Royal jelly of rejuvenation: 'For your spectacular healing support for the hive, maybe even carrying captures so nobody else wouldn't have to deal with it. You did an immense great job in supporting the hive with your abilities, well done!' by Prime Queen (PRO)




