roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Drekis Valytha.



  Medal Awards:

  Corporal Hanna Dryfus is awarded the Distinguished conduct medal: 'Corporal Dryfus took charge of Delta squad after the loss of their beloved squad leader - keeping them in fighting shape no matter what we were up against. Quality leadership does not come around often, but you may have just shown yourself capable through trial by fire.


  Awarded by Col. Scraps-the-Copper on 3/3/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Second Lieutenant Kasumi Ayako is awarded the Bronze heart medal: 'When I had woken up, they were the last living intelligence officer of our company. Myself and the ASO had the distinct honor of processing what you had found for us - giving us the intel we needed to decisively seal this operation as a UNMC victory. Your efforts and tragic death will be remembered.


  Awarded by Col. Scraps-the-Copper on 3/3/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Corporal Lexi 'Black Orchid' LaVaux is awarded the Distinguished conduct medal: 'As per recommendation of your squad leader - you were instrumental in fortifying and expanding the FOB as much as it was today. Said FOB of course, held the line against the prying bugs many times and allowed us to secure victory along with the landing zone as an added bonus, of course!


  Awarded by Col. Scraps-the-Copper on 3/3/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Sergeant Miles 'Afro Diver' Cannonball is awarded the Distinguished conduct medal: 'Today's operation took a lot of our leadership from us. It's a real shame to lose such experience and beloved marines, but it also gave the opportunity for many others to shine. Those who stepped up to the challenge of leadership proved themselves worthy, and sure as hell soothed a lot of our nerves in CIC as the operational plan was executed.


  Awarded by Col. Scraps-the-Copper on 3/3/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper





