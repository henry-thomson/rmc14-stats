roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Rain 'Red' Tyler, Bletchley Parks, Argy Navus, Lilliana Taggart, Evad Esrever, Cedrik Steel, Baret Elaat, Grant Holmann, Takeshi Azurbane.



  Medal Awards:

  Lance Corporal Olaf Pinkbeard is awarded the Bronze heart medal: 'On the recommendation of your SL for holding the south east pumps to make sure we are fueled. to escape. and slowed the horde down long enough for use to destroy it


  Awarded by Col. Tyr Ragnarson on 05/27/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson



  Royal Jelly Awards:

  Elder Burrower (MZ-957-L) is awarded the Royal jelly of sabotage: 'I am starting to believe MZL is hiding her supreme talents. She works tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! Don't even get me started at the planet talls death! You could see them screaming and their flesh and spitters melting. MZL you must help the hive again, your contributions is what makes us succeed.' by Ancient Queen (LIMA)

  Mature Burrower (VAD-165) is awarded the Royal jelly of proliferation: 'For her incredible work as a carrier of supreme caliber, VAD has deserved the royal award! Sister managed to capture talls time and time again, a literally never ending flow! She was pretty much a second queen! Partial mother to the rest of the hive for sure. Oh how we becon VAD to help the further hive expansion! May her children are plenty!' by Ancient Queen (LIMA)

  Young Crusher (HO-568-G) is awarded the Royal jelly of resilience: 'Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. The most incredible cooperation working with others. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)




