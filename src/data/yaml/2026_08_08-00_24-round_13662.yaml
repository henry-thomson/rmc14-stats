roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Michael 'Highway' Evans, Joshua Lee, Derick 'Naptime' Hunt, Kylee Wible.



  Medal Awards:

  Sergeant Hydie AW Steyr-Hahn is awarded the Distinguished conduct medal: 'Sergeant Steyr-Hahn your quick reactions throughout this operation managed to secure us the victory we got. You managed to secure us two important coords for the OBs and then took actions to prevent the marines from charging into their deaths with a choke push. You did everything and more of what a FTL is expected, I cannot wait to see you continue to surpass my expectations.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/07/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Atlas 'Wolfy' Snowlight

  Gunnery Sergeant Axolie Ferguard is awarded the Distinguished conduct medal: 'Gunnery Sergeant Ferguard you held Charlie together alone for many parts of this operation. You kept your marines moral at a all time high even through roughest of fights. You shown today what makes a Gunnery Sergeant what they are.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/07/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Atlas 'Wolfy' Snowlight





  [bold]Operation funded by [color=green]Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of fresh Froots[/color]![/bold]
