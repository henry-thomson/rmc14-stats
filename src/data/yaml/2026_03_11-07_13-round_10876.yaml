roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jothua 'Mothua' Mothington, Sadie Sims.



  Royal Jelly Awards:

  Prime Warrior (TA-212-NK) is awarded the Royal jelly of resilience: 'For sacrificing yourself south of medical for the special fire tall, they were already being a nuisance by spraying fire all over my resin, but you came and show them the way of the hive.


  Without your effort I wouldn't been able to gib it securely. Great job, your work was noted.


  Rejoice!' by Prime Queen (PRO)

  Mature Praetorian (DIG-487) is awarded the Royal jelly of rejuvenation: 'For making consecutive saves for the hive, regardless of the circumstances.


  You were able to save not just me, but many others around you.


  Even saving a hedgehog from near death.


  I want to even state one achievement where you were the only daughter to drag me to safety when I went into a critical state. I thank you for taking care of me, and the hive.


  rejoice!' by Prime Queen (PRO)

  Young Drone (XX-595) is awarded the Royal jelly of proliferation: 'For building up areas in need for the hive.


  The major achievement in question though is you helping build coordinated with EVD as hive leader, and you worked together to build up medical to entrap talls.


  To of which to my concern was a great achievement in my book.


  Great job young one, I am impressed.' by Prime Queen (PRO)

  Young Praetorian (SP-439-X) is awarded the Royal jelly of proliferation: 'For being the main initiative cause of the flamewalker death, and also being am major help in reeling captures to let others take over an assist.


  I thank you for putting your best, and pushing through with conviction and making this victory possible with all the sisters around you.


  I hope to see more of your splendid work, may you forever prosper!


  Rejoice!' by Prime Queen (PRO)




