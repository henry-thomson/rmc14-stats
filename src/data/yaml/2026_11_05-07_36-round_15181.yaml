roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Drone (HA-116-M) is awarded the Royal jelly of proliferation: 'Our main joy of the hive HAM, played a role of utmost importance! Always at the front, saving her queen and sisters alike in times of need. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. We can only hope she continues to help us the never ending slaughter!' by Prime Queen (LIMA)

  Prime Drone (LA-782-MB) is awarded the Royal jelly of rejuvenation: 'Although I don't award jellies to the apex sisters, this one is an exceptional one. Eternally stuck to the queen like a bad tumor, but in a good way of course, she managed to save many sisters, and feed even the most starving daughters. LAMB is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)

  Mature Carrier (AR-284-ES) is awarded the Royal jelly of sabotage: 'ARES proved herself as an incredible show of resilience and survival. As the future nesting mother by seeding new and better life into the talls. From our humble beginning of boom sticker being dragged to the depths of our hive, to the final grub, ARES was there to provide her nursery skills as the only carrier. Thank you!' by Prime Queen (LIMA)

  Elder Hivelord (KI-955-S) is awarded the Royal jelly of resilience: 'KIS worked hard on utter domaniation and wiping of the tall kind, which she easily accopmlished, but she paid the ultimate price. Tube got her in her sights, and when the hive was at its weakest, the tube pounced! Mauling poor KIS. However you cannot kill a hivelord as capables as KIS, and she lives on in our hearts, and in all of the massive walls she has built! Join us in our future conquest KIS! Be our shield.' by Prime Queen (LIMA)




