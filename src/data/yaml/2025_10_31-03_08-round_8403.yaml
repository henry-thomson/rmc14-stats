  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lily Slimeweaver, Hosea Wang, Gloopy Glurmy, Stu 'Stew' Lizo, Kara 'Bait' Smith, Screams-A-Lot, Leo Taggart, Xaeteq Xueqtac, Beedo Waggin, Rodrik 'Roar' Rodriksson, Cara Reid, Dell 'Terra' Dellitrasse, Lobo 'Brownpant' Bonita, Jane Roadman, Hank Hornsworth, Oberon 'Obi' Toski, Seneca Steels, Atreiya Vuctoiris, Ocean Rain, Jessica Raider, Blobert Fonza, John 'Port' Larboardson, Gohs-Kraci, Kyle Winslow.



  Medal Awards:

  Minji 'Failsafe' Kilgrim is awarded the Distinguished conduct medal: 'On the reccomendation of your CMO. you have been awarded with a symbol of your distinguished conduct for fueling our medical machine with 120 cans of general cure. and keeping our marines healthy


  Awarded by Maj. Tyr Ragnarson on 10/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Hayden 'Loser' Roberts is awarded the Bronze heart medal: 'Dispite yer lack luster start of the opperation. you did serve with distinction. and orginized the tropps on the group to a great degree. the lose of your life greatly effected our ability to chase the queen. im sorry you had to go this way


  Awarded by Maj. Tyr Ragnarson on 10/30/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





