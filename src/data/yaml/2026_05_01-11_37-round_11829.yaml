roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joshua Lee.



  Royal Jelly Awards:

  Young Drone (XX-616) is awarded the Royal jelly of rejuvenation: 'Sister proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Eternally stuck to the queen like a bad tumor, but in a good way of course! By the queen can we not even comprehend her true powers as she reaches older age! May the future hives be blessed with her presence as well.' by Ancient Queen (LIMA)

  Mature Hivelord (RG-503-K) is awarded the Royal jelly of resilience: 'Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)

  Ancient Ravager (YIP-799) is awarded the Royal jelly of slaughter: 'I don't even know where to begin with YIPs legendary status. Perhaps this jelly doesn't even capture the true depth of her skills! Yet no matter the deaths, no matter the hardship, no matter the tall threat YIP stands and talls can only cower in terror of her YIP!' by Ancient Queen (LIMA)

  Young Burrower (CA-640) is awarded the Royal jelly of sabotage: 'CA work tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Always alive, yet always present on the front, how is that even possible?! CA you must help the hive again, your contributions is what makes us succeed.' by Ancient Queen (LIMA)

  Prime Burrower (DW-232) is awarded the Royal jelly of rejuvenation: 'As much as I hold the myself accountable to my rules, I simply cannot ingore the skill, raw talent, dedication, and just fervor that DW shows. Her gardening skills were of the highest quality, always stuck to the queen, always providing shields, never letting anyone die. Is it even a surprise talls had no chance? Maybe only DW knows, after all I don't think we can comprehend her strenght, and talls certainly cannot break our shields and speed DW always provided us with. Such a pleasure to see DW in a hive!' by Ancient Queen (LIMA)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
