roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Dar-Lai, Invokes-the-Cobra, Molto Quibbles, Mathew Davis, Jack Cuban, Michelle Guess, Iva 'Moff' Lynx, Eddie Mcmullen, Natalie Sundaicum, Rowan Welty, Hilux 'Tech' Grant, Kane B Gold, Brook 'Brandy' Bronze, Jackie 'Nibbles' Green, Janet 'Sleepsalot' Kingly, Sienna Moeller, Mark Maar, Valeria Turner, Marcos Magor, Marco Biery, Gallagin 'GC Addict' Caitman, Corinthia Buchanan, Isabelle Ali, Igni 'Ashfall' Searith, Gotthardt Phy, Henry 'fixer' Voxel, Roger Braun, Kara Smith, Aiko AW Musket.



  Royal Jelly Awards:

  Prime Boiler (RNG-474) is awarded the Royal jelly of slaughter: 'I ward the jelly of slaughter to this incredible boiler, not once have they faltered against the talls and their boils held them back for so long allowing us to get many evolution points and right after this they contributed to wiping the talls inside the caves so I believe that this victory wouldn't have been possible without them.. REJOICE!!!' by Elder Queen (NEY)

  Mature Praetorian (OX-553-Q) is awarded the Royal jelly of resilience: 'This sister protected the lives of our most valuable sisters and held for a long time, without their support this victory of ours wouldn't have been possible.. REJOICE!!' by Elder Queen (NEY)

  Young Ravager (AN-990) is awarded the Royal jelly of slaughter: 'For following me since the beginning and her slaughter into caves this victory wouldn't have been possible without her continuous killing and sharpened claws striking the talls REJOICE!!!' by Elder Queen (NEY)

  Elder Ravager (URR-335) is awarded the Royal jelly of slaughter: 'This sister with her mighty strikes has allowed us to wipe the talls for a second time and to catch tall queen which caused us a lot of issues and for that I thank her and award her this jelly REJOICE!!!' by Elder Queen (NEY)

  Elder Ravager (HEN-446) is awarded the Royal jelly of slaughter: 'This daughter has unfortunately passed away however their efforts aren't less than her other peers, she has helped us hold caves and wipe the talls for the first time securing a steady path to victory, REJOICE!!!' by Elder Queen (NEY)




