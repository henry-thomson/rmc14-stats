roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Akimitsu 'Lives Forever' Kintoki, Curtis Mingle, Eurypta 'Yuri' Winter.



  Royal Jelly Awards:

  Young Burrower (YU-748-R) is awarded the Royal jelly of sabotage: 'YUR worke tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Always alive, yet always present on the front, how is that even possible?! YUR you must help the hive again, your contributions is what makes us succeed.' by Prime Queen (LIMA)

  Young Carrier (PM-996) is awarded the Royal jelly of proliferation: 'Constant hugging, spending time with children, seeing them grow, occasional murder of a tall. Such is life of a carrier! Who would complain really? PM sure as hell would not! Incredible work PM! You lived and experienced the whole war since the humble beginnings, up until the utter slaugher of the talls! You stood the test of time, and became the future nesting mother! Oh PM, please help us in our conquest!' by Prime Queen (LIMA)

  Mature Boiler (HGG-13) is awarded the Royal jelly of slaughter: 'Although I don't award jellis to the combat sisters, this one is an exceptional one. HRR talents and work cannot be denied! She worked hard on utter domaniation and wiping of the tall kind, which she easily accopmlished even though talls had new larva hatching! HRR is a hero and a role model to what resillience, determination, and a good old slaughter of the talls represents! Help us HRR! We need you!' by Prime Queen (LIMA)

  Mature Hivelord (XX-457) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls, although this award belongs partially to the rest of the lords as well, XX 457 was a key! Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Prime Queen (LIMA)

  Young Ravager (ERM-965) is awarded the Royal jelly of slaughter: 'Jelly that is of rarity! ERM survided slaughter from all sides! Talls were out to get her, yet guess what! Talls got exactly what they asked for, and ERM slashed their faces right off! What a sight to behold. I avoid combat jellies, and ERM certainly could have done better, BUT no matter what she lived and made her hive proud. She was there when the wipe incident happened!' by Prime Queen (LIMA)




