roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Eliana Stripes, Cassian Baer, Rhayu, Ken Navlaan, Nezuni-Arksai, Liam 'Property Damage' Harper, Ignis 'Nightfire' Nyx, Charles 'Butterfingers' Muggins, Targen Smith, The Weeds of Insanity, Arthur 'Frosty' Kingsley, Otto von Eichensthal, Tilly  Hawkins, Ted 'Pockets' Gold, Thumps-His-Tail, Pinksly Pinkerton, Kaelen, Pinot 'Puppet' Bruno, Jasyo.



  Medal Awards:

  Staff Sergeant Otto von Eichensthal is awarded the Medal of valor: 'Staff Sergeant Otto von Eichensthal led his squad to save alpha when they wiped in celestia. Not only this, but I personally watched as he charged in making the xenos retreat. With his prompt actions he saved many lives and helpped organize their safe retrieval. Although he perished his actions saved many. It is ashame Otto did not live to see this medal. Never forget.


  Awarded by LtCol. Sicilia Drakonovisch on 05/20/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Lance Corporal Chuck Strand is awarded the Distinguished conduct medal: 'Lance Corporal Chuck Strand helped significantly during operation Mission Eagle-Oscar. With their efforts they built extremely useful cades and ensured the FOB stayed secured and communications. Without their efforts we would not have held communications against the constant attacks. Your actions are commendable, doing so under heavy acid attacks from the enemy.


  Awarded by LtCol. Sicilia Drakonovisch on 05/20/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch



  Royal Jelly Awards:

  Ancient Defender (ZE-753-RO) is awarded the Royal jelly of resilience: 'For eating three tuber spits- saving my life multiple times. You are a hero unbreakable, a daughter unkillable, a sister unwavering. You have earned this jelly. Well done.' by Prime Queen (HEK)

  Elder Carrier (STU-818) is awarded the Royal jelly of proliferation: 'For your work supplying the frontlines with endless parasites. Due to our scattering tactics, this was fundimental in our victory against the tall host. Without your aid, we would have lost.' by Prime Queen (HEK)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
