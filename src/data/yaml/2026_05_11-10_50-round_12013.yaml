roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Boiler (NE-976-T) is awarded the Royal jelly of sabotage: 'NET, for your great work today in boiling together with your sister YEP, you shall recieve this here jelly of sabotage.


  You two managed to consistently cover the pushes and always positioned yourselves to boil in the most efficient way to cover our captures. For this we managed to double our capture rate and greatly expedite the downfall of the talls!


  Boilers should look to you for inspiration when learning how to efficiently support the hive.


  YIP!!' by Ancient Queen (YIP)

  Mature Boiler (YEP-867) is awarded the Royal jelly of sabotage: 'YEP, for your great work today in boiling together with your sister NET, you shall recieve this here jelly of sabotage.


  Your boils struck true within the tall ranks, causing their attempts at saving their doomed comrades to fail. You two were instrumental today in the downfall of the talls. Boilers all over should look at your work with envy for how you managed to double our capture rates.


  More boilers should take notes for how to work so efficiently. Without your support today we would never have defeated the tall as fast as we did, be proud of your work.


  YIP!!' by Ancient Queen (YIP)




