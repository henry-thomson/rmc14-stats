  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tyrone Choom.



  Medal Awards:

  Corporal Ardy 'Ape Man' Guy is awarded the Bronze heart medal: 'Corporal Guy you and your fellow crewmate gave their lives holding the retreat for the other marines. Your lives were lost in your sacrifice, but you both manage to help keep dozen other marines live. Your sacrifice will never be forgotten.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Corporal Isaac Scorchedwing is awarded the Bronze heart medal: 'Corporal Scorchedwing you and your fellow crewmate gave their lives holding the retreat for the other marines. Your lives were lost in your sacrifice, but you both manage to help keep dozen other marines live. Your sacrifice will never be forgotten.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight



  Royal Jelly Awards:

  Prime Drone (DU-463-CK) is awarded the Royal jelly of rejuvenation: 'DUCK, you saved my chitinis ass today with a healer sac that brought me back from critical wounds into a healthy fighting shape.. we then turned around and instantly captured the silly ass tuber that dared attack us. Well done daughter.' by Immature Queen (EKAJ)




