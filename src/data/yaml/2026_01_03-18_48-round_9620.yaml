roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Lifts-Iron, Emiko AW Kaiten, Luanne Greenawalker, Jim 'Smokey' Werner, Breaks-the-Tides, Eve Muridae, Lora Fischer.



  Royal Jelly Awards:

  Elder Ravager (WAR-887) is awarded the Royal jelly of slaughter: 'Was the sword to my shield. I personally have seen them face and take down dozens of talls against the odds.' by Ancient Queen (HEK)

  Elder Praetorian (NEV-291) is awarded the Royal jelly of rejuvenation: 'Saw to the recovery and rescue of many sisters. While they did not make it to the end, it was through their efforts we were able to see it. We will see you in a another hive, great sister.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
