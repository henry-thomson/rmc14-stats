roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Blossom 'Nibbles' Muncher, Willow Silktail.



  Royal Jelly Awards:

  Ancient Boiler (EF-762-EE) is awarded the Royal jelly of rejuvenation: 'During an engagement west of  dorms, when I got tubed twice in a row. You provided a smoke screen at the perfect time preventing me receiving any further harm, as there was no healer drones in sight during my time. Rejoice! for you have deserve this jelly.


  This was taken place at the battle of Solaris.' by Prime Queen (PRO)

  Elder Defender (FE-530-ET) is awarded the Royal jelly of resilience: 'when I got tubed twice, you provided your body as a shield till you got killed, I thank you for doing so as it gave me time to get back up. this occured west of dorms, I thank you for doing what you could. Rejoice!


  This was taken place at the battle of Solaris.' by Prime Queen (PRO)

  Elder Spitter (NE-363-T3) is awarded the Royal jelly of proliferation: 'During the time, you were a dancer in the battle of solaris. You provided substantial amount of captures that I lost count I think made maybe more than ten? That pretty great in my eyes. However to get to the point, you provided basically a 2nd generation from the sky talls alone, that is something to commend. I hope to see more of this work in the future when we fight side by side together. Rejoice!


  Taken place in the battle of solaris.' by Prime Queen (PRO)




