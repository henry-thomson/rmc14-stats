roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lyndsey Hardie, Ana Zaychikova, Durr Tenet, Kaylin 'Kay' Kadel, Hazel 'Skyfall' Singh, Luanne Greenawalker, Stankashi Neuer, Sutures-the-Wounds, Faye Steele, Alexia 'Sleepyhead' Trainer, Kyra Cowart, Seymour Jenkins, Snaps-the-Bolt, Kylee Wible, Brady Burns, Saint Barbara, Daniel Zoucks, Peter 'Cowboy' David, Liliana 'Shork' Godwin, Finn Reger II, Kyriss 'Snow' Winters, Emma Faith, Fay Llora, Jean Cartier, Tracey Neely, Trevor 'Scav' White, Solus Winter.



  Royal Jelly Awards:

  Mature Boiler (TOX-663) is awarded the Royal jelly of resilience: 'This daughter not only managed to survive since the start of the hive but also managed to stall the talls when all other T3s where gone and the hive lacked a queen, thank you my daughter' by Queen (XX)

  Mature Carrier (TMM-672) is awarded the Royal jelly of proliferation: 'This carrier managed to cover the entire of the colony with an impresive amount of traps helping capture countless talls that dared to venture into the dark alone, thank you daughter for your hard work saving this hive!' by Queen (XX)

  Ancient Carrier (RA-914-D) is awarded the Royal jelly of resilience: 'By placing their eggss in the way of the tall advance this daughter made talls think twice about every step they took deeper into our hive, securing many captures and infecting a great amount of talls when they where most needed! Thank you my daughter' by Queen (XX)

  Young Hivelord (DR-400-G) is awarded the Royal jelly of resilience: 'Since the start of the hive this sister has been building nonstop reinforcing the entire front and the backlines in order to stall the tall aproach and at the end exterminate them as they were running from our hive! Thank you my daughter.' by Queen (XX)

  Young Hivelord (RA-767-G) is awarded the Royal jelly of resilience: 'All this daughter every saw was a sea of resin of their own creation, forcing the talls to fight for every step they took towards our hive. Which at the end resulted in the demise of the tall menace. Thank you my daugher!' by Queen (XX)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
