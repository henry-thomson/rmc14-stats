roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Manuel Miller, White Banks, Asher Fields, Fortune 'Twin' Ann.



  Royal Jelly Awards:

  Ancient Praetorian (MIA-411) is awarded the Royal jelly of proliferation: 'MIA, you have done great work today! You have captured many talls, helping to secure more sisters for our future. I am very proud of calling you my daugther. Even when our numbers were running low, you kept capturing with ease, even capturing the pyro while they were retreating.


  For this, I award you the jelly of proliferation. Great work!


  See you in the next hive!' by Elder Queen (NEV)

  Young Boiler (SLY-182) is awarded the Royal jelly of slaughter: 'SLY, you outlived your older sisters, despite the talls constant dots, breaking the young boiler's curse. You have mercilessly baraged the talls with your boils, providing excellent cover fire and allowing us to capture the talls well.


  For this, I award you this jelly of slaughter. Rejoice!


  See you in the next hive!' by Elder Queen (NEV)

  Prime Hivelord (WI-932-LO) is awarded the Royal jelly of resilience: 'WILO, you have done great work building our great hive this day. You have erected many resin walls, defended many bodies until they rotted like the filth they are, and have protected many sisters through your work alone.


  For this, I award you the jelly of resilience. Great work out there!


  See you in the next hive!' by Elder Queen (NEV)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
