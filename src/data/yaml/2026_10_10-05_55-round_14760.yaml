roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Travis 'Lemon Cannibal' Dane, Alicor 'Pinkie' Merow, Rezzi, Juan Gonzalez, Nathaniel Acosta, Ei-Teegla, Kelvin Marx, Bell 'Jade' Tolkin, Auburn Crookshanks, Chuna-Jaree, Alan Rickman, Granola 'Biggy' Foots, Geoffrey Fischer, Keifth 'Cash' McCruz, Spip 'Totally Planned' Kause, Bailey Warren, Dune 'Chop'.



  Medal Awards:

  Corporal Eris Greyseer is awarded the Distinguished conduct medal: 'Stepped up without hesitation and with vigour proving they are more than capable of being a Squad Leader under any cirsumstances. 


  The original Squad Leader was found lacking in their duties and this FireTeamLeader continued to fight and lead their squad without interuption and with impressive effectiveness.' by Lieutenant Colonel Reed McMatherson

  Gunnery Sergeant Buck 'Pretty' Tern is awarded the Distinguished conduct medal: 'Showed what it means to be a Squad Leader in the corps. They led their squad through thick and thin enabling the full destruction of the hive.


  Their task of being a squad leader was a difficult one this operationn but they managed to not only survive, but thrive, leading their squad through an incredibly arduous and difficult operation. Without them we would have lost far more than I would have liked. Exceptional work.' by Lieutenant Colonel Reed McMatherson

  Gunnery Sergeant Holding of Root is awarded the Distinguished conduct medal: 'Rallied their squad multiple times to hold the FOB agaisnt an immense xeno attack, not once but multiple times. 


  Their actions led to the direct result of todays victory including the holding and clearing of the comms tower under constant attack from the xenos thus stopping them from gaining any more power. Their actions, and that of their squad, allowed the operationn to run as smoothly as it did. A shining example of what an Squad Leader can do.' by Lieutenant Colonel Reed McMatherson





