roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Orange Perez, Reese Coates, Runo Mars, Tumusiime 'Kommando' Nuwagaba, Ryuko 'Cooker' Solisa, Danny 'Ketchup' Heinz, Sebastian 'Lucky' Wilhelm, Zachary 'Cat' Thompson, Lilith AW Derringer, Indigo AW Blackbird, Blake 'Bark' Barker, Sarah Nighteyes, Sansrin Nisgegch, Locke Delgado, Erick Buttersworth, Sanna Holberg, Blobby Oozeworth, John 'Triple J' Johnson, Ajax Mampth, Soma Kalos, Slim Cognito, Alec Houser, Adrian 'Archangel' Gutierrez, Eustace Makris, Kathya 'Snowball' Uncia.



  Royal Jelly Awards:

  Mature Hivelord (DA-750) is awarded the Royal jelly of proliferation: 'For being one of the original hiveleaders to survive since the beginning, and also being one of the vital build instructor of the hive being able to lead your sisters to areas that required attention.


  I am bestowing this jelly for thanking you for being able to keep things flowing without my needed attention.


  Good job.' by Prime Queen (PRO)

  Young Hivelord (PN-699) is awarded the Royal jelly of proliferation: 'For building non stop and ensuring that areas that were once barren were full of walls and structures built by your own claws.


  Your effort alone was shined through that, I thank you for putting your best.


  and never backing down! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



