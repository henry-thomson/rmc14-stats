roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Jamal Johnson, Marco Biery, Daniel 'Survivor' Kamon, Tim Tilton, Licks-Her-Wounds.



  Royal Jelly Awards:

  Ancient Praetorian (KR-663-IS) is awarded the Royal jelly of slaughter: 'This sister was the reason for our victory on this day. They took position at a critical choke and hooked many a tall onto sticky resin. The talls were unable to recover from the casutalties caused by this sister. They showed true grit and skill in the battle against the talls, a prime example of what an oppressor can achieve.' by Ancient Queen (ARG)

  Young Burrower (CB-875-R) is awarded the Royal jelly of sabotage: 'This sister listened to mother when she put out the call to create clusters at critical choke points and keep them repaired. While other sisters capable of building hive structures did not act, she acted. Her constant attention to the clusters in repair, maintance and creation stalled the talls long enough for us to secure there destruction. Without her actions victory would not have been possible.' by Ancient Queen (ARG)




