  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  The Thorns of Stillness, Herman McBoots, Zozie Wristwatch, Iris 'Nades' Moondancer, Nuno, Olik-Meej, Sebastian  'ZEBRA' Emperor, Luanne Greenawalker, Licks-Her-Wounds, Amos 'Gorilla' Ramos, Solus 'Cratebearer' Cometrider, Cheeky Pawswell, Larry Garrison, Purp Winter, Nya 'Kitkat' Firestar, Ferozo, Ara Cypret, Porter Richards, Julianne Eckhard, Enkrid Night, Jack 'Cardinal' Hornor, Stankashi Neuer.



  Royal Jelly Awards:

  Young Boiler (LX-330) is awarded the Royal jelly of resilience: 'Sister LX-330. You were the saving grace of this hive. Despite your lack of experince, in that this is only your third time in fighting as a sister with us, despit this being only the first time you have ever fought in the body of a boiler, you held well. Your consistant, and valuable boilers bought the hive so so, SO much precious time, and ensured that not only much needed caps were bursted, but that me myself was allowed to mature.


  For your actions in staying alive, defending the hive, and delaying talls. I give you this jelly. 


  Henceforth, may you be known, as LX the LEGENDARY!' by Ancient Queen (CMP)




