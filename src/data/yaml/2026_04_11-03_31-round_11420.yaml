roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Hivelord (VA-311-R) is awarded the Royal jelly of proliferation: 'For pushing your best building up dorms, admin, bar, filitration.


  Goodness that alot, but overall you were one of the ones that step up to lead your sister for building for the hive, and I thank you along the way making each structure foreseen by the enemy at hand.


  wall after wall they all held a purpose within this hive, may you gain more wisdom in the future and show others the way of building resin. 


  Rejoice!' by Prime Queen (PRO)

  Mature Sentinel (JU-778-AN) is awarded the Royal jelly of proliferation: 'For making 6 to 7 captures for the hive that immensely helped the hive grow to where it is now, I thank you for pushing through hardship after hardship.


  No fear was seen through the engagements we both have went through together.


  It is rare to see a sentinel stand out, may I see you get stronger! Rejoice!' by Prime Queen (PRO)

  Young Boiler (XX-22) is awarded the Royal jelly of resilience: 'For being a young boiler, that survived through countless hazardous conditions, I am bestowing the jelly of resilience upon your bravery and courage.


  You made many risky manuvers that would or should of ended your life, such as standing on a green stick that can spit the flames of despair upon boilers such as you, but you went ahead and did it and succeeded!


  I thank you for pushing your best, and enjoying the moments we had together, grow stronger young one.


  Rejoice!' by Prime Queen (PRO)




