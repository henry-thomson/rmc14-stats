roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Auburn Wetering, Annika Hunt, Deangelo Newbern.



  Royal Jelly Awards:

  Young Crusher (BO-676-B) is awarded the Royal jelly of proliferation: 'You were a great warrior till the end, then you became a crusher! You made multiple captures that help the hive intiatives in the first few minutes. You also did your duty as much as you could. Rejoice!' by Prime Queen (PRO)

  Ancient Warrior (EVE-948) is awarded the Royal jelly of resilience: 'When the tuber was aimming directly at me you took up the part to make sure they never spit at me, at cave camp. You lunged and beated them to a oblivion, to where they were knocked out. I do thank you for doing such a thing as I pretty sure I would of died since nobody else was going to be my shield in arms in that moment, thank you. Rejoice!' by Prime Queen (PRO)

  Young Hivelord (RD-820) is awarded the Royal jelly of proliferation: 'For being our young hivelord since the beginning I thank you for doing your best, and building up the hive where it was needed.  Rejoice for you have provided what was required for the hive, such as building up Antifreeze, aero, and research!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
