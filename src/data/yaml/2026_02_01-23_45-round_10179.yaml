  Royal Jelly Awards:

  Young Drone (XX-594) is awarded the Royal jelly of rejuvenation: 'During the time you were born, you help aid the front with many heals, and including you saved many lives from near death experience.


  Your courage and bravery shown no bounds, and you show the talls what you were truly were made of.


  You have deserve this jelly like no other, Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (JA-947-K) is awarded the Royal jelly of proliferation: 'Since the beginning of the hive.


  You stood up to the plate of becoming hive leader for the hive, an you were tasked in leading your builders to wherever I commanded.


  You lead them to multiple areas, botany, marshal, bar valley, you name it.


  You have built up so many areas that had allowed the hive to take over at ease.


  For that you deserve this jelly! Rejoice!' by Prime Queen (PRO)

  Mature Carrier (ZY-364-M) is awarded the Royal jelly of proliferation: 'For your amazing support on the main front you are being rewarded the jelly of proliferation, for making it easier to transport captures with your assistance at every point and turn.


  Without you, it would of been more say difficult to do capture runs with the hive, and for that I thank you for every engagements you assisted in.


  Rejoice!' by Prime Queen (PRO)

  Ravager (GUN-95) is awarded the Royal jelly of proliferation: 'You have help aid the frontline, by making a decent amount of captures I was told you have made at least 5!


  Such restraint for such a ravager you deserve this jelly for helping wherever you can!


  Rejoice!' by Prime Queen (PRO)




