roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Elena Chaban, Deja Pye, Icarus Nightflitter.



  Royal Jelly Awards:

  Ancient Lurker (LUM-652) is awarded the Royal jelly of proliferation: 'For capturing so many talls for the hive that I honestly lost count, you slowly them down was always appreciated and vital for the hive to survive.


  Every capture was noted, every moment.


  You even capture the pyro tall.


  Ashame you died, but I will remember your efforts.' by Prime Queen (PRO)

  Ancient Drone (RA-449) is awarded the Royal jelly of rejuvenation: 'You were one of the major supports of the hive, witnessed by many  I thank you for pushin your best in bring forth fruits of healing, and speed to me. I am thankful I had a dedicated gardener that brought the finest fruits to the front.


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (JA-295-D) is awarded the Royal jelly of proliferation: 'For such as a young hive leader for the build caste, you did quite well. you did as much as you could, and kept building back up areas as needed.


  I am proud of your effort young one, may I see you prosper and rejoice through your career as a mind of the prime hive.


  May none shun you down of your efforts and build forth a thousand more walls for the hive!


  Rejoice!' by Prime Queen (PRO)




