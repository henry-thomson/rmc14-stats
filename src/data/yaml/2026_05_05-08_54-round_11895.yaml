roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Duncan Muller, Adriana 'Twin' Ann, Francis Monroe, Luanne Greenawalker, John Weller, Carter Hincken.



  Royal Jelly Awards:

  Elder Hivelord (HPI-387) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls! Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. Although her demise was a saddening one. We hope to see our sister waste the talls in the future hives as well!' by Ancient Queen (LIMA)

  Ancient Praetorian (MIA-639) is awarded the Royal jelly of slaughter: 'Our dearest MIA played a beyond vital role in terrorizing the talls from the complete start to the end, and most notably keeping cool head! She kept rotating, capturing, scouting, and massacring down anything she could get her deadly claws on. Poor talls could just watch in despair. It is without a doupt that her actions allowed the hive to succeed, and almost got her a succession to the kingly throne! It is with sadness that talls are so cowardly that they missed her reign of terror. MIA must help us in the future, and secure the slaughter ever again!' by Ancient Queen (LIMA)

  Ancient Drone (CRS-492) is awarded the Royal jelly of rejuvenation: 'Sister kept endlessly sacrificing herself for the betterment of the hive with her healing work! Always grazing the edge of danger with her frontline healing, yet at the same time keeping safe at all times. Her presence ensure plentiful captures and fresh sisters at all times. The future hives are in desparate need of her skills!' by Ancient Queen (LIMA)

  Young Burrower (JU-612-R) is awarded the Royal jelly of rejuvenation: 'JUR proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Eternally stuck to the queen like a bad tumor, but in a good way of course! By the queen can we not even comprehend her true powers as she reaches older age! May the future hives be blessed with her presence as well.' by Ancient Queen (LIMA)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
