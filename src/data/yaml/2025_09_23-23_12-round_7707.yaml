  Royal Jelly Awards:

  Young Ravager (SUN-296) is awarded the Royal jelly of slaughter: 'I have been alive, to this day, for over 174 years. Yet throughout all these years, I have not seen such a young ravager excel and dominate talls from start to finish until today. Valiantly, I saw you rescue sisters in need, capture talls when the hive needed it, and effortlessly slicing talls into pieces. And you did it all with the strength and quick thinking of a prime ravager, an impressive feet at your age. I believe that it is you who most deserves a jelly throughout the entire hive that I had the pleasure to command here today. I may only pray for future hives to have you at their side, and for many more queens to see the potential of such a talent. Undoubtedly, you have earned the jelly of slaughter not only in my eyes - but I hope that in queen mother's eyes too.' by Ancient Queen (SEA)




