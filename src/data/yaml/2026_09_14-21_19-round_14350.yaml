roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jade Ware, The Fruit of Ignorance, Ned O'Neily, Roman 'Ranger' Bandera, Texas Winchester, The Stalk of Honesty, Dan Smith, Mien Rongrong, Bingo Marmaduke, Roy Coldfield, Aelica 'Mom' Danara, David 'Dig' Diggle, Rico, Sasha 'Tenebrae' Greaves.



  Medal Awards:

  Captain Risks-his-Life is awarded the Medal of exceptional heroism: 'With medical and Req low on numbers. you took it upon yourself to make sure all the medical gear we needed to function. taking control of the GC production namely and getting it to the front. without your efforts we surely would have failed today. youre a hero in my eyes Captain Risks. even if your efforts were menial


  Awarded by Col. Tyr Ragnarson on 09/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Lucas 'Intern' Grayer is awarded the Medal of exceptional heroism: 'when the queen raided the FOB. your quick thinking trapped her inside where she could not escape the firing line of bravo bullets. putting her down and ending her reign of terror. collapsing the hive mind long enough to get the upper hand to wipe out the rest of the hive and her successor


  Awarded by Col. Tyr Ragnarson on 09/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





