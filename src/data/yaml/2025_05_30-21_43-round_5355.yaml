  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Young Boiler (ER-141-B) is awarded the Royal jelly of slaughter: 'One of our boilers. This sister captured many a tall and slaughtered vastly more. At critical junctures they rotated between various boiling positions under mothers command. During the tall invasion they were responsible for holding the talls at the mouth to our hive, killing any tall who dared to enter.' by Elder Queen (ARG)

  Ancient Hivelord (HVD-536) is awarded the Royal jelly of resilience: 'This sister was one of our 4 hivelords, however they distinguished themselves during the tall invasion by insuring that sisters on the frontline were always protected by resin. Without prompting from mother they setup critical hive structures in frontline locations, hindering the tall advance and helping our sisters vanquish the talls. Without there continued work victory on this day would not have been possible.' by Elder Queen (ARG)

  Elder Praetorian (TA-268-NK) is awarded the Royal jelly of proliferation: 'This sister was one of our two oppressors. They were critical to our sucess in the battle against the talls. Tasked with holding critical chokepoints, this sister held the line against the tall invasion.  Using there hook and fling they captured many a tall working in conjunction with our carriers. There skill and grit lead to victory on this day.' by Elder Queen (ARG)

  Young Praetorian (XX-981) is awarded the Royal jelly of proliferation: 'This sister was one of our oppressors, during the invasion against the talls, dispite her age she distinguished herself during the battle. Tasked with holding critical choke points they used there hook and fling to great effect. Slaughtering any tall in her path while capturing many more. Without her efforts victory would not have been possible' by Elder Queen (ARG)




