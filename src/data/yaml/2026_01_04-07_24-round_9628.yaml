roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Pepper, Sadie Sims, Lena 'Pushup' Woodwork, Lena 'Spider Lily' Milize, Althea Leander.



  Royal Jelly Awards:

  Elder Praetorian (VE-891-X) is awarded the Royal jelly of resilience: 'Your greed knowns no bound, for the world was your fishing spot. No tall was left unhooked upon your existence in this battle. You have shown your dedication an commitment to each engagement, always on the brink of death.


  May I see you prosper and bring more victories and entertainment to me and everyone else. Rejoice!' by Prime Queen (PRO)

  Prime Drone (TR-897-LL) is awarded the Royal jelly of rejuvenation: 'For your dedication, and keeping a steady mind in providing fruits at all times, I am bestowing this jelly in great faith of your impact upon the battle.


  You are shown your willpower at a long an tedious attrition.


  Rejoice!' by Prime Queen (PRO)

  Ancient Drone (OWT-270) is awarded the Royal jelly of rejuvenation: 'For your sheer dedication, of providing healing to others even if it caused you pain, you have shown true commitment to your role. The sacrifices you make for others to be able to continue fighting is what the most important out of you.


  You have made it entertaining for me, and others to keep on fighting the invaders.


  Rejoice! For you deserve this!' by Prime Queen (PRO)

  Young Lurker (XX-695) is awarded the Royal jelly of sabotage: 'For your attempts in fighting west of ablock, being a nuisance to talls and your attempts were noted. You have help aid the hive in making breachs in their lines that help aid the hive in their siege.


  Great job young lurker, may you find more greatness in the future!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Kate's 200 Clones[/color]![/bold]
