roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Tamika Ann, Simon Focell, Arnie 'Goose' Sauter, Mariso Mightspire, George Reyes, Auburn Wetering, Elijah Clarke, Liam Peters, Jak 'Flax' Len, Zoya Usta, Ronald Laborde, Treeby Bluetenberger, Sonata AW Moschetto, Miles 'Afro Diver' Cannonball, Hayley Weber, Porter 'Porker' Keopple, Mede Cid, Wets-the-Drystone, Mina Turner, Easton Williams, Spag, Josephi 'Meowlamo' Catkowski, Larry Acewing, Flip 'Dip' Kellogg, Nesuli, Max Firebrush, Salem Reece, Nibbles Squeakerton, Savors-The-Fruit, Ron 'Spitz' Purrman, Iken Hannelit, Theo Avid, Nades-The-Cades, Krieg Barkhart.



  Medal Awards:

  Private First Class Cassia AW Vigilant is awarded the Distinguished conduct medal: 'for making a ton of cakes in a short amount of time. boosting CIC moral and ensuring we were not hungry so we could effectively lead the opperation


  Awarded by Col. Tyr Ragnarson on 05/20/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Second Lieutenant Manuel Miller is awarded the Medal of exceptional heroism: 'in a moment of dire importance. you recovered several bodies. keeping what we needed alive for our final push to avenge those who didnt need to dire. your moment of courage has shown bright in our darkest hours and allowed me to rally our troops to victory


  Awarded by Col. Tyr Ragnarson on 05/20/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





