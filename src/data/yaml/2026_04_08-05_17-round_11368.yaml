roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Karl Giggs.



  Royal Jelly Awards:

  Ancient Warrior (ULI-283) is awarded the Royal jelly of slaughter: 'Since the beginning when I lay my eye upon you, you were always making elaborate execution that were succesful.


  Recollection of memories of what I found, were you making engagements at eye tower that scored captures and plus more, I implore your efforts, as you have shown these talls your might.


  You even went beyond simply pushing forward through whatever hardship lay for the hive, and I thank you for that.


  May you show the true spirit of being a warrior and let none break you down!


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (RN-898-C) is awarded the Royal jelly of proliferation: 'For stepping up as one of our original hivelords, as build leader. You worked eagerly at any angle or front, building up what areas you could. I can't be specific on every category you did, but I do state you were one of our hard working builders. It was a shame to have lost you west of security the first time from sky spit, or etc on cause of death. I thank you for working hard for the hive, and building every wall that was foreseen.


  May your walls bring only suffering to all enemies, Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
