roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Minerva AW Nunchucks, Finch 'Hero' Ward, Indigo AW Blackbird.



  Royal Jelly Awards:

  Young Boiler (DM-965) is awarded the Royal jelly of slaughter: 'For your boils againt the talls ceaseless horde. It allowed us to break their encirclement and wreak havoc on their numbers. Pushing them out of the caves and allowing us to freely roam the colony once more. Well done.' by Prime Queen (HEK)

  Prime Praetorian (FLA-26) is awarded the Royal jelly of slaughter: 'For your work beating back the talls, sending their boom sticks and halting their flanks. You have been nominated at the behest of your sisters, and this is a prize far greater than I can award. Take this Jelly knowing that your sisters have seen your work and smiled.' by Prime Queen (HEK)

  Ancient Warrior (ORB-944) is awarded the Royal jelly of proliferation: 'Like a bloodhound you dragged talls kicking and screaming towards the horde.


  You tanked a tuber spit, allowing it's early capture at the dismay of it's talls.


  You have done well, beyond normal measure. This comes at my own behest, may you do the same for many hives. WELL DONE!' by Prime Queen (HEK)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Rubylord SIP.[/color]![/bold]
