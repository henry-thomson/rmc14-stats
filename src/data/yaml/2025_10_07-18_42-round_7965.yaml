  Clarissa 'Clara' Maddux, Mariabella Dryfus, Bernard 'Squish' Moonsilver, Sibylla 'Cotton Boll' Disali, Gabriel 'Viper' Yesod, Thales 'Careless' Antares, Kasi, Nathaniel Sagan, Forgets-The-Mission, Avalon 'Goose' Bone-Mender, Ludwig Von Applegate, Long-tooth Spud, Paris 'Patch' Fiscina, Grabs Beekus, Throws-the-Soda, Cabrito Spicycoat, Bar-Maxath, Jack Lensten.



