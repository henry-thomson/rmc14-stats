roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lenny Kuster, Polishes-the-Boots, Valeria Winters, Mike 'Giggles' Baynton.



  Royal Jelly Awards:

  Young Hivelord (JI-342-B) is awarded the Royal jelly of resilience: 'JIB proved herself as an incredible show of resilience and survival! Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Through her talents and dedication, talls could not push one step forward! I beg of you to lend us your skills once again!' by Prime Queen (LIMA)

  Young Hivelord (VV-658) is awarded the Royal jelly of resilience: 'For her incredible work as a lord of supreme caliber, VV has deserved the royal award! No matter how many talls pushed deep in VV had her walls ready, and talls were soon weeded, walled off one after another. It is without a doubt that her actions allowed the hive to succeed, and surely the future hives need her help just as well!' by Prime Queen (LIMA)

  Elder Drone (XX-266) is awarded the Royal jelly of proliferation: 'Our main joy of the hive, sister played a role of utmost importance! Always at the front, saving her queen in times of need. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. We can only hope she continues to help us the never ending slaughter!' by Prime Queen (LIMA)

  Elder Drone (SH-19-A) is awarded the Royal jelly of rejuvenation: 'The award is somewhat shared with other healers, SHA was one of the best examples. SHA was constantly working overtime for her queen and sisters! Talls pushed us, and SHA said no thank you, not on my watch, and everyone was back at full strength yet again! The future hives are in desparate need of her skills!' by Prime Queen (LIMA)

  Ancient Drone (ORI-608) is awarded the Royal jelly of rejuvenation: 'The award is somewhat shared with other healers, ORI was one of the best examples. Eternally stuck to the queen like a bad tumor, but in a good way of course, she kept momsy and everyone else alive. Talls took their last breath, and ORI watched how the light disappeared from their eyes. Murder is after all best served cold, too bad ORI has an incredibly warm heart!  See you in the sky hive!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]Not Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
