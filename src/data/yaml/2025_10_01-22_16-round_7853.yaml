  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Kittia 'The Brick' Bulletspitter, Ignores-His-Safety, Bright Chip, Snaps-the-Bolt, Josephi 'Meowlamo' Catkowski, George Johnson, Jazz 'Mess' Caine, Grace Harshman, Alyson Aggley, Ivan Malina, John Johnson, Buzz Fibres, Harry Moreau, Fail's-His-Dojo, Nesart Onan, The Branch of Gentleness, Sips-The-Cola, Frankie Winters, Jamal Johnson, Dmitriy Ivanov, Fae Deathshead, Aleksandar 'Sasha' Volkov, Takara Nowak, Albrecht 'Alby' Herrmann, Petro Pavlov.



  Royal Jelly Awards:

  Ancient Praetorian (GIB-30) is awarded the Royal jelly of resilience: 'When my first mind was slain, this daughter lead the remaining oppressors. Without there courage, wisdom and guidence, the hvie would not of held out. Bravo!' by Ancient Queen (ARG)

  Prime Runner (GR-538-OK) is awarded the Royal jelly of slaughter: 'This daughter saved up all her acid as a runner, surviving many encounters with talls. At the perfect moment they exploded, slaughtering countless talls and the tall queen. Without their efforts victory would not have been so sweet' by Ancient Queen (ARG)

  Elder Carrier (ENZ-593) is awarded the Royal jelly of proliferation: 'This sister was one of our many egg carriers, they supported the oppressor team through the entire tall invasion. Without there dedicated support and cap handling, many of my daughters would not be alive - Bravo!' by Ancient Queen (ARG)

