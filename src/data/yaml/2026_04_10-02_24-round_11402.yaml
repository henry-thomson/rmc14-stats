roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alijah Brown, Jason Faust, Marcus Roberts, William Schumacher, AW Vitchet, Ryhor Steel, Kaanoli, Jack Porter, Dillon Fernandez, Rhaoli 'Ravioli', Alexander Spacer, Louis Houellebecq.



  Royal Jelly Awards:

  Prime Praetorian (FLA-469) is awarded the Royal jelly of sabotage: 'FLA, our prime praetorian, our opressor, delivered true opression upon the talls. Her capture of their empress shattered their resolve and cohesion, among many other captures. It is FLA we have to thank for the thwarting of the talls dastardly plans, for cutting the head from the serpent host, and for this, I award this jelly.' by Ancient Queen (ZERO)




