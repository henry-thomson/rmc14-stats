  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Niima-Meeli, Brendon 'Blaze' MacGregor.



  Royal Jelly Awards:

  Mature Runner (WI-460-LO) is awarded the Royal jelly of resilience: 'WILO, as a larva during the early rush on the planet talls, YIP almost was struck down and the hive could have ended then and there.


  HOWEVER, your bravery and sacrifice in taking bullets for YIP and dying for it was the tiny little push YIP needed to survive and to end all the talls today.


  Thanks to your great bravery as a larva you have managed to help the hive to a great victory today! Sisters should look to you as an example for how to be brave.


  YIP!!' by Prime Queen (YIP)




