roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Ray 'Yap' Steelshine, Lilac Vitale, Bartholomew Cubbins, Blake 'Bark' Barker, Rodion Romanovich, Dean Gronko.



  Medal Awards:

  Lance Corporal Rodion Romanovich is awarded the Bronze heart medal: 'Lance Corporal Romanovich you were the pillar that supported the Alpha in our push throughout this OP. You help hold the back the horde saving many marines lives in caves. When it came time to hold for the nuke you have given your life to hold main comms. For your sacrifice I reward you this medal.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Lance Corporal Beedo Waggin is awarded the Distinguished conduct medal: 'Lance Corporal Waggin you staved off many of the Queen pushes with your batons preventing her from attempting to wipe us out today. Your importance when it was needed cannot be understated and for that I reward you this medal.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Second Lieutenant Bec Walkins is awarded the Distinguished conduct medal: 'Second Lieutenant Walkins you and the rest of intel I have thanks for providing us with the intel needed to allow us to win this day. Without you all we wouldn't have been able to nuke the xenonids after our hard push through caves. For your service today I reward you this medal.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Corporal Sophia Murray is awarded the Distinguished conduct medal: 'Corporal Murray you took command of Delta for almost this entire OP after the tragic gibbing of your SL so early. You took leadership head on and did what needed of Delta. You did remarkable today and for that I reward you this medal.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Captain Douglas Melchett is awarded the Distinguished conduct medal: 'Captain Melchett you were fresh from the academy, this being your first operation leading, and you done well above what normally is expected. You had a strong mind of what needed to be done and how to get it done. For your work today I reward you this medal and I hope to see more of you in the future as you hone your skills.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/21/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





