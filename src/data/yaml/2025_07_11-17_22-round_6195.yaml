roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  The Summer of Honesty.



  Royal Jelly Awards:

  Prime Drone (MIU-21) is awarded the Royal jelly of rejuvenation: 'You have done an superb peformance Prime MIU, the healer. You were always available at the front, healing so many sisters that I lost count. I was aware of you healing your sisters at the reactor choke, fitness, security. You were really the main reason my combatants were never truly hurt that long. May the Queen Mother watch over you, you have done truly a great job! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (JE-511-PH) is awarded the Royal jelly of proliferation: 'You have done an excellent job in ensuring the hive highways were always made, spreading speed resin like no other. You kept at it, for the entire battle. There was nothing else on your mind only SPEED! you kept always making more speed resin through security, fitness, and reactors. You were truly dedicated to your role as hivelord, and have impacted the battle with your support. You deserve this jelly more than anybody else! Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (FLA-279) is awarded the Royal jelly of proliferation: 'Congratulation you have done an excellent job, in picking off talls one by one. There was no mercy in your attempts of fighting these talls, as you swiftly pulled them to the nearest egg, or the nearest flame. You were truly a huge impact in this battle, as I have witness your performance at reactor choke hold, and also not to mention you engaging from security, during the talls attempt to get toward eye. Overall, spectacular job as always, you make me smile everytime you do your crazy stunts. May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Osborn Curry's majestic hair.[/color]![/bold]



