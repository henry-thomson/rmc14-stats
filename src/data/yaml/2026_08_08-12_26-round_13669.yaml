roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Iris 'Wrath' Starseeker.



  Royal Jelly Awards:

  Mature Ravager (RAD-996) is awarded the Royal jelly of rejuvenation: 'this daughter as a hog protected me from many spits, saving my life countless times. without them the hive would be long dead. REJOICE!!!' by Ancient Queen (HEN)

  Young Praetorian (VK-533) is awarded the Royal jelly of rejuvenation: 'this sister, during the time of need. used their abilities to pull me away from danger. warding me from dying. without their help i would be 6 feet under. REJOICE' by Ancient Queen (HEN)

  Prime Runner (RO-69-UN) is awarded the Royal jelly of resilience: 'this sister, simply a runner, wasn't the strongest claw in our hive, instead the smartest and bravest claw. guiding the sisters and me from spot to spot, catching talls off guard and letting us capture them' by Ancient Queen (HEN)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]SireHambone[/color]![/bold]
