roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Billy 'Dubs' Wesley, Mota-Ocheeva, Caleb Bloodworth, Jack 'Solid' Lensten, Lemonus 'Sour' Coralith, Slate 'Argo' Barbarossa, Manuel Miller, Jimothy McBrenston, Benjamin Bennett.



  Medal Awards:

  Sergeant Sips-The-Cola is awarded the Medal of valor: 'For killing multiple t3s and most of the horde. They were a crucial asset is wiping the xenoid threat from the AO with the help of their squad. Your continued excellence is something to aspire to. Well done!


  Awarded by Colonel Breaks-the-Tides on 10/28/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides

  Lance Corporal Selena Mills is awarded the Distinguished conduct medal: 'For continued support and firing under threat. Her bravery was shown when facing down an ambush of xenos. Saving lives and pushing the deadliest part of the hrode back. Well done!


  Awarded by Colonel Breaks-the-Tides on 10/28/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides





