  [color=purple]All of the marines were wiped out![/color]


  In Flanders fields...

  In memoriam of our fallen soldiers: 

  Cody Lewis, Clement Alekseev, Satoru Cook, Big-Eyes Meadows, Wayne Baxter, Snicket Sharp-Claw, Wyatt Evans, Dorothy 'Granny' Walker, Sigma Draconis, Klukai 'Heckler' Koch, Naz-Mat, Lyzz Torgal, Bill Paxton, Blake 'Bark' Barker, Drazil Valytha, Recycles-The-Walls, Oldmann Jenkins, Aega Row, Conner McNuggins, Sivali, Jessica Raider, Althea Leander, Dante Sommer, Max Harris, Solomon 'Solo' Sharpe, Macy Hughes, Olive Orr, Sam Wells, Nikki 'Ferret' Blackburn, Kaeteq Xaaqxerr'Qer, Hypogaea 'P'nut' Arachis, Reitari Sonari, Rains of Fire, Slowy Garrison, The Branches of Overgrowth, Avalon 'Goose' Bone-Mender, Silkie, Gazby Vazlo.



  Royal Jelly Awards:

  Prime Lurker (PRO-997) is awarded the Royal jelly of proliferation: 'Ya got tha hive many caps, and ya killed many talls as ae vampire. Yer performance was exemplary and ah personally saw many great things. For this reason ya deserve tha jelly ae proliferation.' by Elder Queen (JOHN)

  Elder Praetorian (CRY-645) is awarded the Royal jelly of resilience: 'Ah saw ya personally get many caps fer tha hive. Ya hooked many talls and stood with tha hive fer tha entire battle. For this ya earn tha jelly ae resilience.' by Elder Queen (JOHN)

  Mature Praetorian (FLA-453) is awarded the Royal jelly of resilience: 'Along with yer fellow oppresor, CRY, ah saw yer great work and ability today. Ya got many wonderful caps, and stood with us all the way. Fer that reason ya deserve tha jelly of proliferation.' by Elder Queen (JOHN)




