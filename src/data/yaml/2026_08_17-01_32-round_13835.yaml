roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Kaarin Pianwa, Aurora 'Birdcage' Barkheart, Romi, Leo Ruivao, Clegan 'Kaboom' Schofield, Chelly 'Smokie' Yong.



  Royal Jelly Awards:

  Ancient Hivelord (XX-69) is awarded the Royal jelly of resilience: 'XX, You have built our great hive today along with your hivelord sisters, providing us with durable walls to hide behind when the talls attempted to spit back at us.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Praetorian (FE-301-FF) is awarded the Royal jelly of proliferation: 'FE-FF, You have brought us many captures today, while the talls were pointlessly rotating around, you made sure to fish for the foolish ones that got too close to our walls, securing many captures.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Prime Praetorian (ORB-154) is awarded the Royal jelly of proliferation: 'ORB, I have seen on more than one occasion your pulls, you have secured many talls, including the tuber, for our great hive to use as hosts.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Praetorian (JI-769-NX) is awarded the Royal jelly of rejuvenation: 'JINX, Although your end was unfortunate, you have saved as many sisters as you could today, whether it was by screaming the awake, pulling them out of the way, blocking for them or simply emitting your warding pheromones.


  For this, I award you this jelly of rejuvenation, rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Ravager (ED-13-IT) is awarded the Royal jelly of resilience: 'EDIT, I know it was hard not to charge in head first without consideration for your health, but you managed to restrain yourself. In doing so, I have seen you protect sisters, secure captures and slaughter some talls. You have done well.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Lilliths Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]SireHambone[/color]![/bold]
