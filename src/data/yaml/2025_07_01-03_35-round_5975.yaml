  [color=purple]The xenos hijacked a dropship[/color] [color=green]but were wiped out by the marines![/color]


  In memoriam of our fallen soldiers:

  Caroline Faust.



  Royal Jelly Awards:

  Elder Drone (NO-823-B) is awarded the Royal jelly of proliferation: 'Despite the tall lurker's best efforts to dismantle our hive, it was thwarted by one of my singular, lone daughters.. truly showing the strength of our hive, even in one individual. Well done.' by Ancient Queen (RIV)

  Young Ravager (NE-126-Y) is awarded the Royal jelly of slaughter: 'When all the other T3s had fallen, this daughter stayed with me and made sure to cause disarray in tall backlines with their claws, causing a forceful retreat. Without them, we would not have had the impact we had today.' by Ancient Queen (RIV)




