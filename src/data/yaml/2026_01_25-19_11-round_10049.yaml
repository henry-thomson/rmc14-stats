  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Derrick Ellis, Emilia Maekh, Ivan Ivanchuk, Hareeya-Heem, Peter Thomlinson.



  Royal Jelly Awards:

  Elder Runner (GUH-231) is awarded the Royal jelly of resilience: 'For your heroic duty as a Hive Leader, during the moment of time when I was in ovi.


  You lead a devestating flank on the red talls at botany, which I noticed, and send all the help I could.


  This ensured the wipe of red talls, and that of which we guaranteed a victory against the enemy at hand.


  Your death as a berserker was sad, but you have already done so some much irrepairable damage against the enemy well done!' by Prime Queen (PRO)

  Elder Praetorian (NEV-530) is awarded the Royal jelly of slaughter: 'For leading as a hive leader for all the oppressors, you have followed orders with your unit to the letter, and killed so many talls I lost count.


  You definitely deserve this for how much you have impacted this battle with your leadership.


  I hope to see you get even better at leading even bigger caste in the future.


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (LO-689) is awarded the Royal jelly of proliferation: 'Since the beginning of the hive, you were always eagerly building structures for the hive. Providing vital structures when needed.


  I want to state you have done an amazing job, and I hope to see you continue this role and always provide support to future hives.


  You earned this, rejoice!' by Prime Queen (PRO)




