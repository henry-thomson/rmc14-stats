roundEndText: >2-

  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Sebastian Wallick, Agafia 'Cloud' Verovskaya, Titania Flint, Clusha, John Loss, Harry  'Frostbite'  Wells, Sigurd Faust, Antonina 'Blades' Alaars, Thorfinn 'Weak Link' Nordmann, Horo Whitewitch, Francis 'Rector' Jardine, Norman A W Bow, Solomon 'Solo' Sharpe, Ben Smith, Polishes-the-Boots, Stony Tony, William Hill, Josh Barrett, Adriana 'North' Nachtnebel, Gibby Gumshoe, John 'Grub Eater' Saladder, Albrecht 'Alby' Herrmann, Yao Cometside, Alissa Vasilyeva, Amelia Fields, Yzari 'Chomp' Velmara, William Hollingsworth, Mikhail 'Hellram' Trofimov, Bennett Mortland, June Aegis, Mark Bruster, James Fargo, Hunter Tabogin, Marsha Aegir, Aurora Starseeker, Linus Pyxis, Duncan 'Clone 8' Hardings, Allison Franks, Teagan McDonald.



  Medal Awards:

  Tony James is awarded the Distinguished conduct medal: 'An intrepid Intelligence Officer who can harvest intel out of thin air. Their efforts on the colony of LV-624 ensured that even if we lacked marines, we damned well had the intel for whatever we needed.'

  Agafia 'Cloud' Verovskaya is awarded the Distinguished conduct medal: 'Always keeping a finger on the life of our metal logistics. A true CT who understands the need for cading. Whever I said cade, they were there ensuring my Falcons had a solid line to hold.'

  Jade 'Fiend' Eria is awarded the Distinguished conduct medal: 'A beloved Squad Leader for Alpha Company, and recomended for the medal by thier OW SO. Their heroic bravery, calm, calculated leadership of SL, and overall PROWESS, led to several bad situations becoming good. I personally witnessed the Alpha SL kite thw Queen, and save their entire squad.'

  Victor Vanquish is awarded the Distinguished conduct medal: 'My honor guard, so though I may be biased, no one can discredit their work. Part MP, part Commando, part Doctor, they did it all. From processing prisoners for me in the heat of battle, to ensuring I myself don't die. I wouldnt want anyone else watching my back.'

  Stacks-the-Paper is awarded the Distinguished conduct medal: 'My loyal honor guard, and the voice of reason on my shoulder. Though CO's may look like they are merciless killers, it's the MPs behind them that are the real power. Stacks logic, calm manner in the heat of battle, and over all professional air will get them far in life.'

  Paduxi-Utamukeeus is awarded the Distinguished conduct medal: 'Though I do not condone marines hive diving alone, this was not the case. Our loyal Riflemen pushed ahead, as a VANGUARD OF DILLIGENT deadliness. Their efforts in a 1v1 duel with the Queen bought our army enough time to disptach her, and possibly win us the entire war.'

  Jazzy June is awarded the Distinguished conduct medal: 'A TRUE example of what it means to be Auxiliary. Their efforts ensured the smooth flowing of Normandy's deadly payloads. Not only that, their skilled hand with a scalpel prepped several marines, buying doctors valuable time.'





  [bold]Operation funded by [color=green]Squish[/color]![/bold]



