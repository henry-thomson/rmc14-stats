roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rhys Hendricks, Maddox Lester, Luanne Greenawalker, Gracie Yarwood, Lilliana Taggart.



  Royal Jelly Awards:

  Elder Hivelord (JU-605-AN) is awarded the Royal jelly of resilience: 'JUAN, you beautiful hivelord. You have helped us secure the great wipe in Northeast caves with your resin, stalling the tall's forces long enough to assure our victory. You have done great work today.


  For this, I award you this jelly of resilience. Great work.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Boiler (UA-919) is awarded the Royal jelly of slaughter: 'UA, you have provided your sisters with great support fire, furthermore, you have killed many talls on your own. You have helped immensely in wiping out the tall threath from our great hive.


  For this, I award you this jelly of slaughter as proof of your might.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Drone (ME-353-LT) is awarded the Royal jelly of rejuvenation: 'MELT, you have supported our hive greatly today, providing healing to sisters in need and making sure they were ready to jump back into the fray near instantly. Our force was essentially multiplied by your efforts.


  For this, I award you this jelly of rejuvenation for the great support you have given to your sisters.


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Ravager (VV-819) is awarded the Royal jelly of slaughter: 'VV, you have done great today. Even while being a hegdehog, you have performed on par with your beserker sisters. You have helped greatly with the tall's wipe and assuring a swift end to the threath.


  For this, I award you this jelly of slaughter to commemorate this day.


  See you in the next hive!' by Ancient Queen (NEV)




