roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sekhoia, Astanya Kale, Zy 'Syrup' Mc Callister, Jexis 'Sun' Jahor, Nikolai 'Pyromaniac' Galatea, Kaede Leper.



  Royal Jelly Awards:

  Mature Hivelord (ZR-668-G) is awarded the Royal jelly of proliferation: 'Today you saved your Hive with your build. You built where we needed, put walls where we struggled to live. Your great performance caught many's attention even my own even the talls tried desperately to rid of you but your build was too great for them to push through and with that we gained many captures and it ensured the survival of this hive. I thank you and continue building Rejoice!!' by Elder Queen (ASH)

  Elder Sentinel (JU-354-AN) is awarded the Royal jelly of sabotage: 'Today JU-AN you showed me that even a Sentinel can be as brave as my Teir 3. You Captured many vital talls who show a threat to the hive eliminating them and ridding them of existence but the biggest act i saw today was your bravery.. you pushed past the talls.. Diving inside the Metal beast of all places.. claiming the metal beast. No sister has ever done this before and for that i thank you for your bravery and captures you've made today ensuring our young sisters live and thrive! Thank you for that. Rejoice!!' by Elder Queen (ASH)




