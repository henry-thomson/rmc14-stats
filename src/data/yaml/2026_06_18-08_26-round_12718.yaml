roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Thales 'Careless' Antares, Eva 'Cipher' Hendricks, Juno 'Kleptocat' Kaneko, Faces-The-Music, Fischer AW Foxhound, Rain 'Ruby' Tyler, Crimosaki 'Weast', Archie Cutts, Clancy Playford, Mixes-the-Fuel, Han AW Fallschirmjagergewehr-42.



  Royal Jelly Awards:

  Young Hivelord (SI-889) is awarded the Royal jelly of rejuvenation: 'As a Hivelord, you single-handedly were the only hive builder since the Queen had fallen. As well, you earned yourself praise from the other sisters, alongside my attention. You have proven your worth and your dedication as a builder, rebuilding the ruined places that the Tall had faltered and destroyed.


  You carried out my order while I waged war against the Tall Menace. Your diligence, dedication, and tireless labor have not gone unnoticed. The sisters sing your praises, and I myself acknowledge your achievements.


  You have done well, Hivelord SI. You have earned this jelly.' by Elder Queen (SVI)




