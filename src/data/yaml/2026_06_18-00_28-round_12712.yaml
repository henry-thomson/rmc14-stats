roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Crusher (TA-52-NK) is awarded the Royal jelly of sabotage: 'TANK did an amazing job at showing who the real TANK is. There was an evil Tall Crusher, an Evil TANK that showed up and was running down our sisters.


  TANK fought bravely, bodyblocking them, and taking multiple spit in order to wipe, capture, and disable the evil tall TANK forever.


  They did one of the best performance i've ever seen, and the best at crusher.


