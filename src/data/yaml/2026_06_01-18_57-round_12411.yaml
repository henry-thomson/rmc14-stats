  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Dana Smirnov, Arnie 'Goose' Sauter, Varkun Chronoforge Aethervein, John Swanson, Timothy Eventide, Amber 'Unlucky' Summer, Points-and-Shoots, Shana 'Snow' McTavish, Rae 'Saviour' Scorchedwing, Dot Greywing.



  Medal Awards:

  Captain Rhys Hendricks is awarded the Distinguished conduct medal: 'Captain Rhys Hendricks led a charge into western barrens after a OB. Gathering marines and organizing the assault, this led to the crippling of the hive while other squads faultered and didnt react fast enough, Rhys had the reaction time to capitalize on the Orbital bombardment. This resulted in our victory and the entire hive collapsing with this assault. Excellent work.


  Awarded by Colonel Sicilia Drakonovisch on 06/1/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





