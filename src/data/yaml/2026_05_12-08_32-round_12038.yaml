roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Carter Hincken.



  Royal Jelly Awards:

  Young Hivelord (CA-143-V) is awarded the Royal jelly of resilience: 'CAV, today you were a very active and supportive young builder. Your build was good for such a young lord.


  Keep on improving on your build as you age and you will eventually become one of the greatest builders this hive has ever seen.


  YIP!!' by Ancient Queen (YIP)

  Young Drone (BN-608) is awarded the Royal jelly of proliferation: 'BN, today you went above and beyond what it means to be a gardener. You not only supplied the hive with a lot of fruits, you also helped support our frontline in gathering captures.


  From your bravery we managed to secure 10 captures and you should be proud of your hard work today! It is not often such young drones survive in a role supporting frontlines with captures.


  YIP!!' by Ancient Queen (YIP)




