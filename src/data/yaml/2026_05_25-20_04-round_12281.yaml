roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Dillon Turner, Nyx Oxton, Shanika Pershing.



  Medal Awards:

  Colonel Sicilia 'Rose' Drakonovisch is awarded the UNMC High Command Medal of honor: 'For exceptional heroism and conspicuous gallantry in action against hostile Xenonid forces, above and beyond the call of duty, while serving with the 2nd Company, 4th Battalion, 3rd Regiment, 4th Combat Division on Fiorina Science Annex, during Operation Inspection Charlie-Master. Colonel Mizuno Drakonovisch led her forces in the thick of battle, when cohesion was at an all time low and casualties mounting. With her steadfast leadership and determination, the marines were able to mount a major counterattack to liberate the recently captured marines from her Alpha squad. Not once did she cease in her efforts to take charge, shouting orders and downing hostile xenonids with her own hands. When her vessel, UNS Almayer, was hijacked and overrun by the Xenonid menace, she managed to lead a counterattack with the few remaining marines. The combined might of the survivors wiped the remaining Xenonid hive and their queen. While the station and it's citizens were lost, she saved all of the remaining survivors of her unit. Displaying unrivaled tenacity and audacity, they were able to pull well above their own weight against a determined foe. Their great personal valor and courageous initiative were in keeping with the highest traditions of the military service and reflect great credit upon herself and the United Nations Marine Corps. Awarded by Major General Fritz Mueller on 5/25/2126, United Nations Marine Corps High Command.' by Major General Fritz Mueller





