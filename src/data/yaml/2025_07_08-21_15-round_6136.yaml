roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Muz, Abrihelm 'Gora' Bagniak, Nehemiah Gray, Sarah Sprout, Pachat-Cheparis 'Fog', Selene Temnora, Francis Monroe, Jan Natalis, Rube Chapman, Nahasi, Natoo-Churasu, Miharil-Riker, Tom Fooly, Glorb, Garret Harrison, Neizv-Estni', Marc Ghekon, Brigite Silva, Draeng Grimnirsson, Samuel Gonzales, Jericho Smores, Anthony 'Basilisk' Abrams.



  Royal Jelly Awards:

  Young Boiler (MO-414-G) is awarded the Royal jelly of resilience: 'Although you may be young, your prowess today went far beyond your years. Your boils not only slaughtered many talls, but also provided cover for your sisters from which they were able to act.  Your timing was precise and your placement cruel.' by Elder Queen (INK)

  Elder Crusher (BO-9-OT) is awarded the Royal jelly of resilience: 'BO-OT, today you demonstrated that you are an unbreaking wall of carapace and wrath. Your body bore the worst of the enemy's desperation, and yet you did not fall. You crushed their spirits just as you crushed their corpses beneath you.' by Elder Queen (INK)

  Elder Ravager (BOA-246) is awarded the Royal jelly of slaughter: 'BOA, you were swift as our hunger and twice as cruel. You struck without mercy, finding their weaknesses and exploiting them without mercy. Your claws wrote terror into the talls and sent them scattered howling in the dark.' by Elder Queen (INK)




