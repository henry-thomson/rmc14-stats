roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Praetorian (AHH-295) is awarded the Royal jelly of resilience: 'AHH, You have saved me multiple times today, screaming me awake every time the tuber dared to spit on me. You are the main reason I stand here alive.


  For this, I award you this jelly of resilience, rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Hivelord (RE-488-D) is awarded the Royal jelly of sabotage: 'RE-D, Your work today has made talls waste plenty of time, running in circles around colony trying to break your resin while mother was out capturing many talls. You stalled them effectively the entire day.


  For this, I award you this jelly of sabotage.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Defender (CH-370-IR) is awarded the Royal jelly of proliferation: 'CHIR, Despite your early demise today at the hands of planet talls, you were not discourage as you woke once more as a defender and went on to capture many talls, filling our ranks with many sisters.


  For your work, I award you this jelly of proliferation for all these hosts you have obtained.


  See you in the next hive!' by Ancient Queen (NEV)




