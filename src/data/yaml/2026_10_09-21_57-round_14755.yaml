  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Victor Toobin, Nahami.



  Royal Jelly Awards:

  Mature Defender (TIB-327) is awarded the Royal jelly of resilience: 'During the engagement of store, you decided to fortify to block the metal beast, that of which allowed the hive to break it apart rendering it useless. This was a major help to the hive. I thank you for enduring the pain for the betterment of the hive. Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (BE-560-E) is awarded the Royal jelly of proliferation: 'During the battle of solaris. You provided substantial amount of cover and buildings that help aid the hive growth. Overall you were one of the main contenders of the hivelords that was doing their all. Rejoice for your dedication!' by Prime Queen (PRO)




