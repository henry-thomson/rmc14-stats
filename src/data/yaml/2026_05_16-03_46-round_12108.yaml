roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Lemonus Coralith, Cynte 'Artificer' Lightweaver, Emille Dumont, Hypoprepia 'no eyes' Fucosa, Johnny Squeakems, Danielle Sparks, Stella Nguyen, Stella Falke, David 'Dig' Diggle, Daphne Nighteyes, Cheery Heather, Jones Manuel, Mike 'Giggles' Baynton, Lo Xi, Timmy Pimm, Cries-Of-Void, William ''Earth'' Rolcker, Jimmy Climber, Cole 'Coleslaw' Shaw, Lycosa Ferai, Dar'Moar, Crush Mcfall, Dell 'Terra' Dellitrasse, Jesse Sloan, Zenko Kit Sune, Adrian 'Hawaiian' Cook, Jasyo, Carter 'Donkey' Burns.



  Medal Awards:

  First Lieutenant Stares-at-Stars is awarded the Medal of exceptional heroism: 'For being vital in your deployment. helping bravo hold the comms network. but not only this. in a single push. you and your squad crushed an entired colume of xenos. not just a colume. but their queen as well. this show of bravo's capabilities shows that you as their SOat the temporary lose of your own life was a show of extreme heroism


  Awarded by Col. Tyr Ragnarson on 05/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Sergeant Dave Daverson is awarded the Medal of exceptional heroism: 'Much like your SO. you leadership was not only vital to holding comms. not only vital to killing a queen. not only vital to killing 10 xenos in one fell swoop. but vital to the survival of the company. your show of martial prowess has not gone un-noticed Daverson. and will be remembered by the company forever


  Awarded by Col. Tyr Ragnarson on 05/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Tasha 'Fumbles' Serrcof is awarded the Medal of exceptional heroism: 'You. Tasha Serrcof. your quick thinking saved the lives of everyone in your squad. and was the most key in wiping out the xeno horde. trapping them within our cades to slaughter them for free in a kill box. your show of wit and creativity is outstanding. and is a prime example of what we here in the marines should strive for


  Awarded by Col. Tyr Ragnarson on 05/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Second Lieutenant Anne Ockney is awarded the Medal of valor: 'your efforts today have not gone un-noticed. going above and beyond the call of duty. killing the second queen for one. but mainly for your support all opperation with gathering intel and stabilizing the front in moments of collapse. so on the reccomendation of your ASO. and the XO. your valor is recognized


  Awarded by Col. Tyr Ragnarson on 5/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Jones Manuel is awarded the Bronze heart medal: 'giving you life so your squad may live is one of the greatest things to do. you have gained the respect of your SL and of me this day. your sacrifice will be remembered and memorialized


  Awarded by Col. Tyr Ragnarson on 05/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





