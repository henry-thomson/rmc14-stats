  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Fiona Dimeling, The Birch of Perseverance, Rina 'Shell-Shocked' Gensvil, Acanthos Caniceps.



  Medal Awards:

  Iris 'Nades' Moondancer is awarded the Distinguished conduct medal: 'As recommended by your SL, you performed an excellent job today in the CIC managing logistics and giving out crucial information, pertintent to the operation's success today. Stand tall, second lieutenant, as you have done what many others of your rank have failed to do - impress an enlisted AND your superiors!'

  Lilah Pritchard is awarded the Distinguished conduct medal: 'Excellent work today doctor, your quick thinking and rapid response aboard the Almayer helped to save many lives and a whole lot of headache from the command staff.'

  Donald Doey is awarded the Distinguished conduct medal: 'As part of the auxiliary staff on board the Almayer, they truly made a difference. Many marines were infected and had to be evacuated from the planet in a timely fashion, and Donald Doey did not skip a beat in doing so.'





