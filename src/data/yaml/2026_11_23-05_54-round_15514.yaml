roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tato 'Crispy' Prank, Lardbeard, Adiko Arm-Strong, Ishmael Porter, Mary Nikolova.



  Royal Jelly Awards:

  Elder Sentinel (FE-130-ET) is awarded the Royal jelly of resilience: 'At the battle of the Marshall Office, FE-ET constructed a most impressive Hive Core. The prowess of this bulwark prevented the tall hordes from advancing, it greatly punished those suicidal enough to advance, and most importantly of all it convinved the tall's empress to skyfire their own horde. The hive owe's a great deal of our victory to FE-ET.' by Elder Queen (LW)

  Elder Praetorian (WE-667-H) is awarded the Royal jelly of slaughter: 'Enshrouded under the great Marshall Office Hive Core, WE-H the oppressor ensnared and hunted the tall hordes for sport. Scarcely more could have been slaughtered had the talls been deliberately entering the oppressor's net. A dozen or more were vanquished on this day, and our enemies advance brought to a halt.' by Elder Queen (LW)

  Young Drone (XX-344) is awarded the Royal jelly of rejuvenation: 'On this day, we saw a great gardener. A gardener, whom without their support, our fighting castes would have not seen great victory. A gardener who planted many fruits to heal, and strengthen our hive. Their work saw a dozen or more talls captured or killed by keeping our fighting castes healthy and strong. This gardener was XX-344. We screech for them.' by Elder Queen (LW)




