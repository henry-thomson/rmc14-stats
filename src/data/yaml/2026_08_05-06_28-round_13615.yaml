roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Barry Hawking.



  Royal Jelly Awards:

  Elder Drone (TI-161-B) is awarded the Royal jelly of rejuvenation: 'Our dear gardener TI-B was with us from the start, Always supplying me with alacrit when I needed it. For your great work today, TI-B I reward you this jelly of rejuvenation! Rejoice!' by Elder Queen (XR)

  Mature Hivelord (RP-670) is awarded the Royal jelly of proliferation: 'For being a leader from the start, taking over the designer hivelord that died and building whenever I asked you to, you have proven worthy of this jelly of proliferation! I wish to see you in our hive again, Rejoice!' by Elder Queen (XR)

  Ancient Praetorian (WA-511-LL) is awarded the Royal jelly of slaughter: 'WA-LL, You joined our horde as a vanguard when we needed it the most. You were one of the only tier 3 to be there at the end, getting rid of alot of annoying talls and getting our hive hosts! For this, I reward you the jelly of slaughter. Rejoice!' by Elder Queen (XR)

  Ancient Praetorian (ZAI-529) is awarded the Royal jelly of resilience: 'Sister ZAI has pulled alot of talls into darkness and gotten us more sisters! I have seen them capture a scav in person, which was very joyful to see! for this, I reward ZAI the jelly of resilience. Rejoice!' by Elder Queen (XR)




