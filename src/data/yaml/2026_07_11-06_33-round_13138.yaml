roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Trilly 'Anvil' Vanders, Sean 'Jack' McAllister, Sven Bjornion.



  Royal Jelly Awards:

  Ancient Drone (MEL-127) is awarded the Royal jelly of rejuvenation: 'MEL was just outright a master of her craft! She was constantly working overtime for her queen and sisters. Always growing incredible artisan quality alacrits, shields, and health for the healers! Supreme work MEL, what a joy to have you be part of this conquest!' by Prime Queen (LIMA)

  Ancient Hivelord (CH-920-IR) is awarded the Royal jelly of proliferation: 'CHIR proved herself as an incredible show of resilience and survival! Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Through her talents and dedication, talls could not push one step forward! She is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)

  Mature Carrier (RE-930-L) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, REL has deserved the royal award!  No matter how many talls pushed deep in REL had her eggs ready, and talls were hugged one after another. It is without a doubt that her actions allowed the hive to succeed, and surely the future hives need her help just as well!' by Prime Queen (LIMA)

  Mature Burrower (ECO-728) is awarded the Royal jelly of sabotage: 'ECOs talents and progress cannot be denied. She work tirelessly on making sure the whole hive can travel all over place!  Her work, and symbiosis with other sisters tired out talls so much that they could barely push, and for that we are deeply grateful. Help us again ECO!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]Not Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of fresh Froots[/color]![/bold]
