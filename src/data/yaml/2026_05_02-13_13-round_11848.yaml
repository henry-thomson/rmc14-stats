roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Nesuli, Sips-The-Cola, Lynn 'Braindead' Styles, Erin Baker, Lyudmila Savanna, Icey Iana, Kara 'Wild Boar' Hathaway, Kimiko Sinette, Rag-'Crispy'-Heem, Roman Lamphugger, Kaleb, Bladud Whitewitch, Drake 'Dietcola' Di'Angelo, Kara Lightweaver, Alexis Mayfield, Adriana 'Twin' Ann.



  Medal Awards:

  Lance Corporal Luanne Greenawalker is awarded the Medal of valor: 'Lance Corporal Luanne Greenwalker is to be awarded the medal of valor for valiantly risking her life and rushing to get sensors online deep in enemy territory. Her actions provided CIC valuble info and she had no disregard for her own life. This action is to be commended for her valiant efforts.


  Awarded by LtCol. Sicilia Drakonovisch on 05/02/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch



  Royal Jelly Awards:

  Young Hivelord (TJ-606-O) is awarded the Royal jelly of proliferation: 'You are and amazing Hivelord. Not only you build amazingly. You also listen, and learn to adapt in the battefield. You alone have managed to build the WHOLE backline of the talls. That is incredible. I have never seen a hivelord doing such a good job in a long time. You are truly deserving of this jelly today.

  I am really proud of you, like extremely.

  With love, LAG.' by Ancient Queen (LAG)




