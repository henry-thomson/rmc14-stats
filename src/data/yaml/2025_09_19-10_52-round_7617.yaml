roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Justin Lowe.



  Medal Awards:

  Hudson 'Mule' Keifer is awarded the Distinguished conduct medal: 'Sergeant Keifer has shown to me and the UNMC as a whole what it means to be a true leader during operation "Strategic Response Program All Amerrican-Monsoon" on Solaris Ridge.

  Their work today is truly commendable.


  Awarded by LtCol. Freya Locke on 09/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Olivia Lambert is awarded the Distinguished conduct medal: 'Corporal Lambert has taken up the role of the SL upon their unfortunate demise. Quickly recovering the cohesion and leading with an iron grip.

  They have shown to us one of the core UNMC principles. To take responsibility for others. Thank you Corporal.




  Awarded by LtCol. Freya Locke on 09/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





