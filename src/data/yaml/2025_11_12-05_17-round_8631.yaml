roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Fruhl Stargazer, Lanval Hickam, Buzz 'saw' Fibres, Emilia Rhodesion, Vulcan Volkinac, Snow Fish, Kasa 'Linguist' Jeen, Vulpes Thorn, Locke Delgado.



  Royal Jelly Awards:

  Mature Drone (AT-195-F) is awarded the Royal jelly of rejuvenation: 'To honor the tide of Spring on a planet of ice, whose life-giving fruit gave her sisters the strength to continue onwards, with all their might, in order to strangles the hosts within the forgotten passages. Not once did I look upon the garden and see it as anything less than bountiful, overflowing with fruit, yet feeding so many. This humble queen thanks you for your service.' by Elder Queen (TMM)

  Elder Praetorian (BBY-954) is awarded the Royal jelly of resilience: 'To honor the azure bulwark, whose noble efforts are worthy of the title "Valkyrie." In that canvas painted red with the blood of many, many hosts, I grew hungry to dye it all that color. Too hungry. Only by your noble sacrifice was our dream of slaughter realized. By your death I lived, and by my life many hosts fell. How many were trampled under our feet, thanks to you. For this sacrifice and for this service, this humble queen thanks you.' by Elder Queen (TMM)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
