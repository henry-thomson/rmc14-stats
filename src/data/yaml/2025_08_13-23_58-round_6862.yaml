roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Ara Silica, Tyrone Choom, Blake 'Bark' Barker, Ricardo Rohtin.



  Royal Jelly Awards:

  Prime Crusher (MRT-707) is awarded the Royal jelly of resilience: 'Our only crusher, and our greatest shield. This sister when summoned by mother took up the call. They faithfully followed, protecting sister and slaughtering talls without mercy. Without them many sisters would have been struck down. They continue to be a credit to the hivemind.' by Ancient Queen (NOOB)

  Prime Drone (MIU-376) is awarded the Royal jelly of rejuvenation: 'The battle with the talls was long, spit and fire rained down upon my children. Through it all this sister was ever-present, standing by to patch and repair what the talls had so foolishly broken. At critical junctures this daughter was by my side, enabling us to encirle the talls and size outwards onto there flanks. This sister was a credit to the hive, and many owe them there lives.' by Ancient Queen (NOOB)




