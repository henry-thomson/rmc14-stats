roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Vuk Drexler, Colin Coldwell, Leon Renshaw, Abidin La Mancha, Burt Bonald Bobin, Melissa Mcloskey, Diarsia 'Dima' Maxima, Lyn Fischer, Gordon Goi, Andrea 'Dre' Newbern, Tricky Pip, Ruby McGoop, Nibbles Squeakerton, John Jingler, Mark 'Shadow' James, Ups-The-Downs, Kristen Reighner, Bravely-Runs, Drogar 'Snare' Greeneye, Juno 'Garnet' Eckart.



  Medal Awards:

  Second Lieutenant Rocco Hunter is awarded the Distinguished conduct medal: 'For outstanding performance as a gunship pilot, delivering CAS, intel and successfully paradropping Echo Squad into the combat zone.


  Awarded by Col. Freya Locke on 04/06/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke

  Sergeant Makayla AW Thompson is awarded the Distinguished conduct medal: 'Awarded by Col. Freya Locke on 04/06/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke

  Sergeant Makayla AW Thompson is awarded the Distinguished conduct medal: 'For exceptional courage in returning to the site where Echo died during the paradrop to recover the wounded and fallen. Despite the danger, Sergeant Thompson's actions saved multiple lives.


  Awarded by Col. Freya Locke on 04/06/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Freya J Locke





