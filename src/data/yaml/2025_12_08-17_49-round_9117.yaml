roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Eijan, Purp Winter, Jatayu 'Nerd' Corvuson, Emille Dumont, Faye Steele, Rick Lu Arran, Uzame Lajin, Bob 'Bobbert' Bobson, Iris Starseeker, The Aquifer of Cowardice 'Aqua', Klein Moretti.



  Royal Jelly Awards:

  Ancient Praetorian (BEL-243) is awarded the Royal jelly of proliferation: 'Even though our hive had been all but doomed, the efforts of sister BEL pulled us back from the edge and lead us to victory, pulling hosts into eggs one by one. For her tremendous efforts in ensuring the survival of the hive, bel is awarded with the jelly of proliferation.' by Ancient Queen (LEON)

  Elder Carrier (DOK-424) is awarded the Royal jelly of proliferation: 'After the complete destruction of both our core and the taking of all our eggs by hosts, sister DOK was the one who provided us with children in our time of need. It is because of her that we were able to thrive again, for that, she is awarded the jelly of proliferation.' by Ancient Queen (LEON)




  [bold]Operation funded by [color=green]A CT that builds cades[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
