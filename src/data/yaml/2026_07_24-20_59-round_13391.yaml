roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Ashe Greye, Jay Stark, Krynnara Thryssalis, Ezra Jowers, Shadow-dwelling Bramblewood, Dorothy Basmanoff, unknown, unknown, unknown, Raluli, Titus Wheelian, Alexis 'Concord' Mayfield, Jataka, Erika Marienthal, Kataki, Wets-the-Drystone, Koleda Kalashnikova, Mim-Sigerthe, Nora Burch, Trevor Sandys, Glub 'Goober' Son, Salvadore 'Vespucci' Wemerson, Zarvik Oryndis, unknown, Burns-the-Body, Casimir 'Preacher' McWell, Christina Gray, Donte Holmes, Archie Logue, Emilia 'Phantom' Day, Grant Fulton, Bennett Biery, Xuangir'Lir Mirxei, Olive Orr, Hesus Alejandro, Dante 'Hellion' Star, The Oak of Darkness, Claude Bellic, Rana-Hul.



  Medal Awards:

  Lance Corporal Luxamiss is awarded the Distinguished conduct medal: 'For proving to be invaluable in saving countless marines from capture. Personally saved the Delta SL, pyro spec, and many others, their grenades cripped the hive time and time again. Nothing stood before their overwhelming firepower. 


  Awarded by Lt. Colonel Breaks-the-Tides on 7/24/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





