roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rirro Darkmist, Eats-The-Crayons, Larry 'Fender' Mens, Gary Geico, Tapan 'Dust Bunny' Namaka, Jacob Wilkerson, Rinka Lizzumi, Precious Breakman, Haily 'Blinds' Sauter, Silas Stargazer, Alsu 'Alchemist' Karaman, Lenny 'regicide' Kuster, Fringe-Bouldero.



  Medal Awards:

  Lance Corporal Archon AW Saw is awarded the Distinguished conduct medal: 'Lance Corporal Archon AW Saw you took up the mantle of leadership very early into the OP with lost of your squad leader. Yet even then you proven yourself by pulling together Charlie and rallying them back into the fight. Your efforts has not gone unseen by me or others.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/05/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Atlas 'Wolfy' Snowlight





