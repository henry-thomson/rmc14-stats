roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Pene Schimdte, Erebus Moondancer, Elijah Cowper.



  Royal Jelly Awards:

  Ancient Ravager (XR-753) is awarded the Royal jelly of resilience: 'For your resistance, for your shield, for being a bulwark of the Hive. You are the toughest sister of them all, the one who has gone across the world to protect the weak, the one who has gone through hell and still kept going through all the mess that I have created.


  Through all the internal and external conflicts, all the chaos and everything that happened, I slowly realized that you remained loyal. You proved yourself to be an efficient killer and capturer, and most importantly, you managed to survive the onslaught.


  You went through all of it, and somehow, you're still here. Still standing. Still fighting.


  That alone says a lot about you.' by Ancient Queen (SVI)

  Praetorian (NOX-650) is awarded the Royal jelly of slaughter: 'She who tanze, a sister with an ego that persisted across the stars. The sky was blau and grau. She who danced across the field, slaughtering every tall menace that crossed her eye.


  I noticed that your performance as a dancer was astonishing. A strong foe, a resilient sister who stood against the tall menace and kept fighting, even when the odds were against you.


  You did very well, NOX.' by Ancient Queen (SVI)




