  Royal Jelly Awards:

  Ancient Boiler (OPA-516) is awarded the Royal jelly of resilience: 'You were an astounding boiler, I can't even fathom in deepest of the void to bring up a word to express how determine you were to boil, didn't matter if you were at the brink of death. You truly committed to every boil, and avoided every green stick or melted known to the hive. You truly were a great help in keeping the TALL BALL at bay with your boils. Great positioning and great teamwork and coordination from you at all times. You also help made some captures as well so I will say you did astounding! May the Queen Mother be proud of you!' by Prime Queen (PRO)

  Ancient Praetorian (AUG-511) is awarded the Royal jelly of rejuvenation: 'Great job AUG, I can say you did absolutely amazing, great support, great extinguishing and commitment. You did solid coordination which is greatly appreciated from the ancients and primes. You truly were a amazing daughter to have fight by my side. You made sure to make swift captures at all times. Some hiccups may of been made but you pulled through. also granted the fact you kept overpowering me to have my carapace be stronger so I would take less hurt from the talls pathetic spit.  May the Queen Mother be proud of your work, and dedication! Rejoice!' by Prime Queen (PRO)




