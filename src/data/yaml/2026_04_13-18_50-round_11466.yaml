  Snicket Sharp-Claw, Motthew 'Mof' Mothington, Semi Golardo, Vinyl Sadow, Osbert Werner, Lucifer Moondancer, Agostinho 'Lanceiro', Michael 'Mikey' McGoggins, Simon Mothman, Kade 'Durango' Blackburn, Barnaba Goldberg, Mike 'Giggles' Baynton.



  Royal Jelly Awards:

  Mature Drone (FO-950) is awarded the Royal jelly of proliferation: 'For your building on telecomms and following my orders transforming into a healer and healing me, i grant this Proliferation Jelly upon you.


  May your heals and build be eternal.' by Prime Queen (RP)

  Prime Praetorian (FLA-982) is awarded the Royal jelly of slaughter: 'For your great service to their hive killing and capturing many, i hereby grant this Jelly of Slaughter as a way to reward your efforts.


  For the hive! May your hooks be eternal!' by Prime Queen (RP)




