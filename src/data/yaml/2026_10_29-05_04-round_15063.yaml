roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Leucage 'Freefall' Scenicus, Jason Moron, Jeanine 'Sheepherder' Pygmalion, LizZ 'Ard, Bjorn Bluemane.



  Royal Jelly Awards:

  Prime Hivelord (SAL-444) is awarded the Royal jelly of resilience: 'SAL, you have done what I asked for and more. Not once did I ever see you stop building. Even when the talls came, you kept building throuigh spit and fire. You also gave your flesh and body to protect me when the talls almost killed me! REJOICE SAL!! you have not gone unnoticed.' by Elder Queen (OWL)

  Elder Praetorian (DEA-26) is awarded the Royal jelly of rejuvenation: 'DEA, this jelly is nothing short of well earned. Not only did you save me countless times from when I was tubed, but also your fellow sisters. You gave up your flesh and carapace to protect those around you, and for that, you deserve this. Rejoice! And truly, thank you.' by Elder Queen (OWL)

  Ancient Drone (SLY-244) is awarded the Royal jelly of rejuvenation: 'SLY, you have given everything you had; your plasma, your flesh, and your body, to keep your sisters alive and fighting. Without you, many more would have surely died or been lost to the tall menace. For that, you deserve this jelly. Rejoice!' by Elder Queen (OWL)




