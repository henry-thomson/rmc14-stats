roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nainortag 'Savior' Yofuaeb, Hedley 'Maniak' Gunpowder, Squeaky Chip, Nesuli, Ace 'The Exterminator' Steele.



  Royal Jelly Awards:

  Young Praetorian (MW-116) is awarded the Royal jelly of rejuvenation: 'You have saved me THRICE from the tuber. Only thanks to you is why this hive persists today and flourishes as it did. Rejoice!!!!!' by Elder Queen (RAP)

  Mature Drone (ZA-50) is awarded the Royal jelly of rejuvenation: 'I have been incredibly undecisive and in result moving from place to place. ZA here has been providing me with nearly endless alacrit, greater resin fruits and shields to survive the immense tall spit. And for that I am granting you... The Jelly Of Rejuvination!' by Elder Queen (RAP)

  Elder Ravager (RA-302-ZR) is awarded the Royal jelly of resilience: 'RAZR. You have been following me since the start. NONE of the other ravager sisters stuck to me just as closely as you did. You have been dragging, protecting and in all other ways working to better the hive for which I thank you using this... Jelly Of Resiliance! REJOICE!!!' by Elder Queen (RAP)




  [bold]Operation funded by [color=green]Lilliths Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]RIKI's Alacrit[/color]![/bold]
