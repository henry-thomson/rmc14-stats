roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Berga Hades, Darius Bohrumbeard, Masha Elakha, unknown.



  Royal Jelly Awards:

  Elder Praetorian (FE-161-F) is awarded the Royal jelly of resilience: 'This daughter managed not only to survive from the start of the tall invasion but also Captured and kill many talls with their abduction! They also saved countless sister in the face of imminent death, thank you my daughter.' by Ancient Queen (ABO)

  Elder Praetorian (SL-600-K) is awarded the Royal jelly of resilience: 'This daughter Extinguished and saved countless sisters without ever stoping and on every screech they where there to support me kill and capture the talls, thank you my daughter.' by Ancient Queen (ABO)

  Elder Drone (LOB-666) is awarded the Royal jelly of sabotage: 'LOB managed to build up the entire backline halting the tall retreat and rewarding us with countless of captures and when the talls dared to try to push again they could not pass the sea of resin that was created, thank you my daughter.' by Ancient Queen (ABO)

  Elder Drone (RY-80-R) is awarded the Royal jelly of rejuvenation: 'This daughter helped keep the hive always ready to fight by healing everyone and when they saw a crusher nearing death they gave up their life in order to save them. Thank you daughter!' by Ancient Queen (ABO)

  Young Lurker (NO-990-A) is awarded the Royal jelly of slaughter: 'There acid runner bomb helped us wipe the talls aboard the metal hive making our victory that much easier! thank you daughter' by Ancient Queen (ABO)




