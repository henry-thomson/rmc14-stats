  Royal Jelly Awards:

  Elder Hivelord (JI-509) is awarded the Royal jelly of resilience: 'This daughter stood resilient in the face of the tall menace. The previous queen died, but this did not stop their undying acid heart from stalling the talls push, eventually leading to a massive wipe. For this they deserve the jelly of resilience.' by Prime Queen (GIB)

  Ancient Burrower (BU-134-B) is awarded the Royal jelly of sabotage: 'I saw this daughter delay talls with their traps and tremors. They did great surviving this long battle and i'm sure the previous queen is proud of them, they went through alot and I hope this jelly finds you well.' by Prime Queen (GIB)




