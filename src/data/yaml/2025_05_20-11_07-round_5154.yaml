  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Coosa Laurier, Austin Barnes, Elias Palehaven, Floorbs-Jeelius, Shoots-Many-Bullets, Emery Cadler, Jack Bindoon, Blake 'Candle' Werdin, Thazil Greyheart.



  Royal Jelly Awards:

  Elder Praetorian (NE-895-LL) is awarded the Royal jelly of resilience: 'Our valkyrie and one of our starting 6 sisters. Capped many a tall as a warrior. When times were dire they held the line as a valkyrie and saved many a xister and killed many a tall. Bravo!' by Elder Queen (ARG)

  Elder Praetorian (BUH-645) is awarded the Royal jelly of slaughter: 'Our oppressor, and starting 6 larba. They held the line as a warrior and secured many a cap. After times were dire they became a trusted member of my royal preatorian guard, killing and hooking many a tall.' by Elder Queen (ARG)

  Ancient Drone (ASH-374) is awarded the Royal jelly of rejuvenation: 'One of our starting six larba. Taxed the hive and ensured we always had resin, became our healer when times were dire - securing caps, keeping critical sisters alive and ensuring i did not fall in battle. Bravo!' by Elder Queen (ARG)




