roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Defender (BA-697-G) is awarded the Royal jelly of resilience: 'For sacrificing yourself for me to capture the pyro tall by providing what little cover you could provide with your body, albeit attempt costed your life, effort on you doing what was necessary for the hive for the greater good is what counts the most.' by Prime Queen (PRO)

  Young Boiler (OSO-630) is awarded the Royal jelly of sabotage: 'For knocking down pylon tall defenses when we made hivecore close by to it, you made it quite tremendously easier with your non stop boils, and staying alive throughout the engagements. Thank you for your performance! Rejoice!' by Prime Queen (PRO)

  Elder Praetorian (BR-885-IL) is awarded the Royal jelly of proliferation: 'For making a decent amount that was worth seeing during multiple engagements against the sky talls, you captured roughly 7 talls. That is tremendous value to the hive that kept attrition going strong. Thank you for your performance elder praetorian.' by Prime Queen (PRO)

  Elder Drone (AM-818-A) is awarded the Royal jelly of rejuvenation: 'For providing well timed support that allow me to stay within my area to providing lethal pressure against the sky talls defenses.


  You were always tossing, making, growing, you name it. The support was generally appreciated for it allowed not just me, but others around you to keep going. Rejoice!' by Prime Queen (PRO)




