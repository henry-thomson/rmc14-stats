roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ricardo Rohtin, Jack Solid.



  Royal Jelly Awards:

  Mature Ravager (CG-299-V) is awarded the Royal jelly of resilience: 'One of my first borns who survived until the end. Their presence helped me capture and slaughter many talls. Thanks to them, we could keep harrasing hivemind tower even though we were lacking hitting power. Thank you CG-V. You are most deserving of this jelly. Queen mother would be proud of your feat.' by Elder Queen (LOL)

  Mature Boiler (MS-418-G) is awarded the Royal jelly of resilience: 'As one of my first born, they managed to survive until the end kept the hive strong. Their boils stopped the momentum of the tall tide and kept us from dying. Thanks to their efforts, we could have stall until new sisters evolve. Rejoice! You are most deserving of this jelly. Queen mother would be proud of your feat.' by Elder Queen (LOL)

  Ancient Defender (ROT-359) is awarded the Royal jelly of resilience: 'One of the sisters who showed the most courge and kept me from dying twice. Thakns to their bravery, I survived couple of tube hits and lead to the victory. They also managed to secure few important captures when we are getting pushed back. Rejoice, ROT! You are most deserving of this jelly. Queen mother would be proud of your feat.' by Elder Queen (LOL)

  Ancient Lurker (GIB-397) is awarded the Royal jelly of sabotage: 'I dont know where to start. They are the true form of what a lurker present. Thanks to their countless captures, we managed to keep the hive fueled with new sisters and managed to push back the main horde. They are one of the reason we are the victor today. Rejoice, GIB! You are most deserving of this jelly. Queen mother would be proud of your feat.' by Elder Queen (LOL)

  Elder Lurker (SI-290-X7) is awarded the Royal jelly of sabotage: 'One of the late sisters who continued make a fear rule behind the lines. Thanks to their efforts, many talls got captured and helped hive to grow stronger. They taught us all what a true backliner is. Rejoice SI-X7! You are most deserving of this jelly. Queen mother would be proud of your feat.' by Elder Queen (LOL)




