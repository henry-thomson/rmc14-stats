roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tombathy Chucklechops, Leads-The-Charge, Jimmy 'Johns' Todd, Reika 'SweetTooth' Inazuma.



  Royal Jelly Awards:

  Mature Hivelord (BE-3-RT) is awarded the Royal jelly of resilience: 'For your noble efforts in building resin for the hive  against these sky talls, I grant thy a Jelly of Resilience for your brave efforts in securing vital ground today! Rejoice!' by Elder Queen (CTC)

  Elder Boiler (FE-194-ET) is awarded the Royal jelly of slaughter: 'You have done well today child, I personally witnessed your killing of one of the dreaded tubers, you have done well in protecting your queen and your sisters by slaughtering the talls! Rejoice!' by Elder Queen (CTC)

  Young Praetorian (FN-633) is awarded the Royal jelly of rejuvenation: 'For your valiant efforts in staying alive as a young valkyrie, alongside ensuring your queen was safe from the dreaded talls today! I grant you a jelly of rejuvenation! Rejoice my child!' by Elder Queen (CTC)




