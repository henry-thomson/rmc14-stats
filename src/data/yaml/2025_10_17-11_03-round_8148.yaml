roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Zeth Xi, Nuno.



  Medal Awards:

  Purp Winter is awarded the Bronze heart medal: 'Sergeant Purp Winter fought valiantly in Operation 'Exercise Yankee-Cleanup', eventually being K.I.A. while trying to rescue a fellow marine from the enemy's claws.


  Awarded by LtCol. Daphne Nymphoiry on 10/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Diego Ank is awarded the Distinguished conduct medal: 'Corporal Diego Ank held a prime objective completely alone at times, facing off several hostiles and still not faltering; this act of bravery granted CIC enough information to control the battlefield and achieve victory.


  Awarded by LtCol. Daphne Nymphoiry on 10/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





