roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tiliqua Typus.



  Royal Jelly Awards:

  Prime Praetorian (FR-98-NC) is awarded the Royal jelly of resilience: 'What can I even say. Our only surviving tier 3. Our dancer in the wind, our strike in the dark. You were the cornerstone of every engagement. You held the hive together with tooth and claw. Killing, capturing, rescuing other sisters, nothing was beyond you. I am in awe of what you have contributed. Bravo!' by Prime Queen (ARG)

  Ancient Drone (SPX-66) is awarded the Royal jelly of rejuvenation: 'Mother simply did not understand how amazing a gardener could be until you showed her. On each and every engagement mother had shield from your unstable, speed from your alacrit and rage from your spirit. Not only have you been THE essential support of this hive, you have also secured a capture or two while doing it. I thank you from the bottom of my heart. Rejoice!' by Prime Queen (ARG)

  Young Hivelord (XX-42) is awarded the Royal jelly of sabotage: 'Building from the start of our hive, although young and nameless, you were essential in our victory. Your careful frontline resin enabled us to resist the talls counterpush. Your devious encirclement of the talls all but spelled the end to their efforts. I look forward to seeing the prime you will one day become! Rejoice!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]The gibbing of the Blueberry[/color]![/bold]
