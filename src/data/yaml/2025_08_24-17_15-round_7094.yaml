  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Lotash 'Matchstick' Saurmor, Xerces Erson, Lalla Gardner.



  Medal Awards:

  Kurome 'Nyawka' Nyawkowska is awarded the Distinguished  conduct medal: 'Captain Nyawkowska, you have displayed good leadership and a keen sense of tactis during operation Manoeuvre Yankee-Spear on Solaris Ridge.

  Her steady command and decisions contributed to the effectiveness and safety of her Marines.


  Awarded by LtCol. Freya Locke on 08/24/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





