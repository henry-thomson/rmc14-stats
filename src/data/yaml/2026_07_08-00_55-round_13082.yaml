roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Al Dente, Elle, Beekus-Beem, Ramiris 'Psyop' Aether, Nibbles-The-Fixtures, Gregory Willey, Lenny Kuster, Lug Dober, Iya Olesya, Ruben 'Goldy' Lantern, Fillmoore Grayson, Mary Pupikson, Gregorius Quandal, Sses'ra Qerr-Katish, Andrew Pupikson, Ricky Fischer, Arisa Kobayashi, Seymour 'Hack' Jenkins, Crimestoer 'Claymore' Mauler, Sakeeus ''Cottonball'' Tah, Lexi Marphy.



  Royal Jelly Awards:

  Prime Drone (ASH-50) is awarded the Royal jelly of resilience: 'My daughter you were steadfast in your duty to this hive. You build so much of this hive and manage to keep us fighting until the very end. I reward you this Jelly for your duty. REJOICE!' by Elder Queen (FOP)

  Ancient Ravager (JA-306-KE) is awarded the Royal jelly of slaughter: 'My daughter JAKE we wouldn't have made it this long without you. You slaughtered many talls in our fight for survival, but it wasn't enough yet I reconize your actions in this Jelly. REJOICE!@' by Elder Queen (FOP)




