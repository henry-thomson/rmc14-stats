  Royal Jelly Awards:

  Ancient Runner (RNG-126) is awarded the Royal jelly of sabotage: 'Was in the tall's backline, destroying the evil eye tower and getting 15~ captures. This allowed the Prime Hive to continue to grow and expand. I thank you daughter for your sabotaging skills.' by Elder Queen (ZOE)

  Young Ravager (DBZ-69) is awarded the Royal jelly of sabotage: 'Tackled the tall queen who was encased in my resin walls, which allowed for me to get in the position to gib the Tall Queen. The Prime Hive thanks your efforts.' by Elder Queen (ZOE)

  Ancient Drone (DOK-836) is awarded the Royal jelly of resilience: 'Did the final blow to the talls with their acid runner explosion, bringing an end to their tyranny. Your efforts have not gone unnoticed, my Great Daughter of the Prime Hive.' by Elder Queen (ZOE)

  Elder Ravager (XX-345) is awarded the Royal jelly of slaughter: 'Worked with DBZ and held out for as long as they could. Your efforts allowed me to mature into my greater form. The Prime Hive thanks you!' by Elder Queen (ZOE)




