  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Linda Monroe, Francis Monroe, Boris 'Tagilla' Ivanov, Mike 'Giggles' Baynton, Jane Holiday, Cedrik Steel, Ilya Markov, Josephi 'Meowlamo' Catkowski, Nema-Seewul.



  Medal Awards:

  Warrant Officer Anne Taylor is awarded the Distinguished conduct medal: 'For bringing vital info to the scout using the cameras of one of the ships. you added in destroying and disrupting the xeno back line. its been noticed and logged. but you still wont get my hat


