  Royal Jelly Awards:

  Prime Praetorian (FLA-536) is awarded the Royal jelly of proliferation: 'You were with me since the start of our battle against the talls, and were a crucial part of our victory. While you were fighting by my side, I saw you hook innumerable talls into eggs, pull them into my screams, and secure them for wonderful captures. You have undoubtedly earned the jelly of proliferation for your great work in battle today.' by Ancient Queen (SEA)

  Young Drone (OX-607-Q) is awarded the Royal jelly of rejuvenation: 'You were a key element through out our entire battle against the pathetic tall forces. When I was injured, you were right there ready to heal not only me, but all of your sisters. You sacrificed your own health for the sake of others, and provided immaculate support when it was crucial. For these great deeds, you have easily earned the jelly of rejuvination.' by Ancient Queen (SEA)




