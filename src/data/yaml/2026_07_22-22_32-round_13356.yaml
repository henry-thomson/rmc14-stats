roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Guaco Micheal, Gareth 'Firebug' Flamecoat, John 'Port' Larboardson, Amalia Berenice, Brambles, Cael Esta, Emma 'Paprika' Fierce, Brick Rhinehart.



  Medal Awards:

  Sergeant Aurora 'Birdcage' Lockheart is awarded the Medal of valor: 'Sergeant Lockheart your importance to the operation today cannot be understated. You not only got us all four OB coords with perfect percision, you also took the initiative in leadership. Taking point in recovering dead marines and becoming aSL for Charlie when the SL was taking out of combat. You are a model for what all FTLs inspire to be.' by Major Atlas 'Wolfy' Snowlight





  [bold]Operation funded by [color=green]Not Atlas Bootes[/color]![/bold]



