roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Purp Winter, Stefan Wolle, The Willow of Excitement, Sean 'Sifru' Kadel, Albrecht 'Alby' Herrmann, Alexia Trainer, Bence Peckler.



