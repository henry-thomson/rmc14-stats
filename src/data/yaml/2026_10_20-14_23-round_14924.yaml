roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Komi, Lerkath Quzer'Tan.



  Royal Jelly Awards:

  Prime Hivelord (MAT-341) is awarded the Royal jelly of resilience: 'From designing our grand hive, to shielding and recovering critical sisters, to dragging talls too their doom. It seems nothing is too much for you. Early in the hive you were responcible for large sections of our build. During the assault on T-Coms you recovered another sister who was in need of aid. During the final stages of the push, your resin routed the talls who dared to push us. Bravo!' by Prime Queen (ARG)

  Elder Drone (JA-697-H) is awarded the Royal jelly of rejuvenation: 'Your role ussually goes unnoticed in the hive, constantly providing fruit for others. However on this occasion your efforts proved invauable to our success. Not only have you been feeding your queen through the battle, on two seperate occasions, your fruit healed a critical Ravenger in a dangerous position. Moreover when mother was in OVI your plasma fruit enabled her to build, preventing the talls advance. Bravo!' by Prime Queen (ARG)

  Elder Hivelord (ZY-570-C) is awarded the Royal jelly of sabotage: 'Nominated by others, your critical build, dangerously close to the talls perch enabled many captures and shielded sisters from harm. Building so close to the talls main fortification is a testimony to your skill as a lord of the hive. The whole hive thanks you for your efforts this day. Rejoice!' by Prime Queen (ARG)

  Ancient Ravager (ED-105-IT) is awarded the Royal jelly of rejuvenation: 'When other sister was hit by the deadly tuber, you lept into action. Charging headfirst into danger with no regard for your own life, you body shielded your sister. Without your efforts the tube would have taken another of my hive. I thank you from the bottom of my heart. Rejoice!' by Prime Queen (ARG)

  Prime Defender (JE-175-PH) is awarded the Royal jelly of rejuvenation: 'When other sister was hit by the deadly tuber, you lept into action. Charging headfirst into danger with no regard for your own life, you body shielded your sister. Without your efforts the tube would have taken another of my hive. I thank you from the bottom of my heart. Rejoice!' by Prime Queen (ARG)




