roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Ravager (MKA-311) is awarded the Royal jelly of slaughter: 'MKA achieved what many have ignored and paid the price for. They valued their life above all, stayed on the queen, and I would even guarantee made THE key difference in the tall slaughter. Maybe age does not play such a key role after all?! Or do we all just grow hubris with age, and die to that?! MKA will find out and tell us!' by Prime Queen (LIMA)

  Young Boiler (SH-986-A) is awarded the Royal jelly of slaughter: 'Our incredibly capable sister played a vital role in terrorizing the talls. SHA is an incredible example of cooperation. Her work, and symbiosis with other sisters tired out talls so much that they could barely push! Talls took their last breath, and SHA watched how the light disappeared from their eyes. Slaughter is best served cold, too bad SHA has an incredibly warm heart!' by Prime Queen (LIMA)

  Praetorian (WA-284) is awarded the Royal jelly of slaughter: 'For her incredible work as a valkyrie of supreme caliber, WA has deserved the royal award! Her powerful stomppers making tall dizzy and incapable of fight at just the right moment! They saved many of their sisters, and killed just as many talls! Her talents are in high demand!' by Prime Queen (LIMA)

  Mature Drone (HA-256) is awarded the Royal jelly of rejuvenation: 'Our main joy of the hive, played a role of utmost importance! Always at the front, saving her queen in times of need. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. We can only hope she continues to help us the never ending slaughter!' by Prime Queen (LIMA)

  Prime Drone (ASH-488) is awarded the Royal jelly of rejuvenation: 'Although I don't award jellies to the apex sisters, this one is an exceptional one. Eternally stuck to the queen like a bad tumor, but in a good way of course, she managed to save many sisters.  
   Always grazing the edge of danger on the frontlines, yet at the same time being safe at all times.  ASH is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)



