roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  Medal Awards:

  Angela 'Freeman' Gray is awarded the Distinguished conduct medal: 'This medal was personally recommended by your squad leader and staff officer - OUTSTANDING suppressive fire this operation. The xenos could not take a single marine from us in your presence.'

  Sebastian Wallick is awarded the Distinguished conduct medal: 'Performed their duty of FTL admirably - did the whole nine yards. Kept their team together, called in fire support, ensured supply coordinates were given on time. Nothing wrong with a job well done.'

  Daphne 'CC' Nymphoiry is awarded the Distinguished conduct medal: 'Excellent leadership of Alpha this operation. Kept their marines in check, stayed communicative with CIC. Well done.'

  Ko Fillian 'Coffee' Garrans is awarded the Medal of exceptional heroism: 'Put their life on the line MANY times to save their fellow marines from the clutches of the xenonids. Without your selfless disregard for your own life, many marines would not have made it home today.'




