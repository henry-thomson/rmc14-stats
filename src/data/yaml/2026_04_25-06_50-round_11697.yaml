roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  London Baxter, Owen Conrad.



  Royal Jelly Awards:

  Ravager (XX-818) is awarded the Royal jelly of resilience: 'You were one of the ravagers I saw learning the ways of the ravager, it was a shame to have seen you fallen in a short time, for the fun we could of had together.


  You fallen in battle because of the tuber who strike your heart down east of botany, I will not forget the short work you did for the hive regardless of performance.


  You will be remembered!' by Prime Queen (PRO)




