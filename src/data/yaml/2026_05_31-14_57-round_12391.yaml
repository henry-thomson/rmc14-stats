roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Bryol 'Mint' Choco, Diane 'Banshee' Modiste.



  Medal Awards:

  Lance Corporal Ups-The-Downs is awarded the Medal of valor: 'Lance Corporal Ups-The-Downs fearlessly charged into several xenos at the start of Operation Investigation Smart-Walk. Doing so killed the queen and several T3s. Ups scored so many kills it made a severe dent into the xenos this operation crippling them. Excellent work with your momentum.


  Awarded by Colonel Sicilia Drakonovisch on 05/31/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





