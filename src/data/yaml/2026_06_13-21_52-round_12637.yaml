roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Emiko AW Kaiten, Nova Roth, Bralic Requer, Laura Everness, Dobre Juto, Dawn 'Cavewoman' Carpenter, May Mundane, Denys 'Rust' Smith, Iken Hannelit, Looking-for-Ammo, Melea Marriman.



  Royal Jelly Awards:

  Prime Ravager (KR-317-IS) is awarded the Royal jelly of slaughter: 'KRIS was our Apex ravager that kept wiping. They were a base ravager that captured many at the start with me while also killing behind cades, and later in became a berserker so that our final wipe kept going. They wiped many and kept the wipe going, and for that, i give my heart out for them.



  Rejoice my sister, for alongside you, i have killed many.' by Prime Queen (RP)

  Prime Praetorian (MIA-532) is awarded the Royal jelly of slaughter: 'Your new style of dancing proved that wipes arent just berseker terriority anymore. You captured many with me while also doing nasty tricks wiping all talls we faced. Many has been slaughtered by your claws, with no signs to stop.


  Rejoice my sister, for alongside you, we will dance and show the world the best of the best.' by Prime Queen (RP)

  Ancient Praetorian (EI-983) is awarded the Royal jelly of resilience: 'EI was the valkyrie that let us do the RP2 gambit, in which involved walking into a tube, valkyrie screech, queen screech, and grab tuber alongside LUAN. Their warding also saved me multiple times while they dragged many captures of mine.

  Your support was indispensible and i am very grateful to have you as my valkyrie. 


  Rejoice my sister!! May your warding be eternal!! (please)' by Prime Queen (RP)

  Ancient Boiler (EH-286-HE) is awarded the Royal jelly of slaughter: 'Many boilers did a great job, but you assisted in our last wipe many times. Always walking with me, you made sure no tall would be left to survive.


  Rejoice my sister! May your boils be eternal!!' by Prime Queen (RP)

  Elder Runner (LU-136-AN) is awarded the Royal jelly of slaughter: 'Your claws grabbed many captures, including tuber and many more. You wiped many talls, especially at the final wipe on labs. You did greatly, and i shall award you with this jelly of slaughter.



  Rejoice my sister!! May your wipes be eternal!!' by Prime Queen (RP)




