roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Zoey Cattrell, Kiera 'Boom' Fenrir.



  Royal Jelly Awards:

  Elder Praetorian (FO-318-OL) is awarded the Royal jelly of resilience: 'For charging sucidally through the fire to make final engagements south of Eastern Filitration plant. You still stabbed and pierce even as you broke apart from the flames, that is true resolve there. May I implore your efforts. Rejoice!' by Prime Queen (PRO)

  Young Runner (JO-706-Y) is awarded the Royal jelly of proliferation: 'As a young mind, I been told you have captured a couple of talls by yourself as a runner, that pretty great achievement for a runner, especially by yourself, be proud young mind! Keep up the work!


  Rejoice!' by Prime Queen (PRO)

  Ancient Ravager (NEV-969) is awarded the Royal jelly of slaughter: 'For making quick work or better yet, total annihilation with your help and my cohesion with you. You strike down these talls till they were no more! You slaughter countless in the hive name south of Eastern Filitration Plant, many talls fallen because of your work.


  and I want to say thanks for charging through the fire as I committed that a true berserker right there, commit to tasks and get the job done! Rejoice!' by Prime Queen (PRO)

  Elder Hivelord (CA-323-B) is awarded the Royal jelly of proliferation: 'For building up the entirety or almost the entirety of hospital. I implore your effort, you were the one actively doing your part as hiveleader builder, only some key details I want to mention for future chapters for yourself, is make to sure to be more communicative! So that you don't have to do all the work yourself! I hope that you look back at this jelly as education and achievement for your great work in the future. 


  Remember, may none shun you down your efforts! You alone can make any difference! Rejoice!' by Prime Queen (PRO)




