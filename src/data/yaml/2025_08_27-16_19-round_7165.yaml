  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Elder Boiler (XX-389-XX) is awarded the Royal jelly of slaughter: 'This daughter slaughtered many talls with their boils, choking the very life out of them. Every scream there was a well placed boil, along with your sister ARL. Your teamwork and persistence was to be admired, and im very proud of your work here today.' by Immature Queen (GIB)

  Ancient Runner (ARL-647) is awarded the Royal jelly of resilience: 'Your bravery during this fight could not be measured. You fought the talls by my side until my very last breath in my old carapace. Together we sieged their bird, slaughtering many, but ultimately having to flee. Your resilience during this fight has earned you this jelly.' by Immature Queen (GIB)

  Ancient Ravager (GUH-496) is awarded the Royal jelly of proliferation: 'Your work to grow the hive has not gone unseen. You knew how to work with me, ensuring we got many captures, and that our hive grew in tremendous numbers. This jelly of proliferation is a sign that you did well in the fight against the tall menace, leading to our inevitable victory.' by Immature Queen (GIB)

  Young Drone (LC-222) is awarded the Royal jelly of proliferation: 'For your work as a hivelord and healer drone, you rose to the occasion and you healed our hive when we needed it the most. You knew when to switch castes and for this you earn the jelly of rejuvenation' by Prime Queen (GIB)




