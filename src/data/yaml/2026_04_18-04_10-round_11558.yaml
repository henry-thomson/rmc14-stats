roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  David Anderson, Alty Ciel.



  Royal Jelly Awards:

  Young Boiler (XX-724) is awarded the Royal jelly of slaughter: 'This young boiler has a great path to follow.

  They literally learned as the invasion continued and helped us kill a lot of talls. They were brave and followed me, although hesitating on the start, they certainly were one of the best boilers ive ever seen.


  Rejoice my daughter, may your courage be eternal.' by Prime Queen (RP?)

  Elder Ravager (LU-947-AN) is awarded the Royal jelly of proliferation: 'LUAN dragged multiple captures at literally every screech i did. Killed many talls when they came for my head. They are loyal knight that i trust with my life.


  Rejoice my daughter!!


  May your claws strike as fierce as your determination!!' by Prime Queen (RP?)

  Young Praetorian (VAD-422) is awarded the Royal jelly of resilience: 'VAD was with me at every wipe and every screech, emitting warding pheromones to keep me pumping and dragging captures, also doing overall great support to our hive.



  Rejoice my daughter! May your guarding be eternal!!' by Prime Queen (RP?)




