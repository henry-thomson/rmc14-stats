roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Nomster, Lunam, Recro 'Eyes' Nighteyes, Raven Papilio, Cameron Oneal, Dusty Blonde, Darius 'Nerd' James, Dusty 'Mothman' Johnson, Archibald 'Misfire' Garcia, Tangerine Baker, Crafty Scuttlebug, Tony 'Two-Shoes' Anthero, Rains of Fire, Nathan Prescott, Scout 'Zombie' Kreed, Melvin Merryman, Antonina 'Blades' Alaars.



  Medal Awards:

  Nomi-Kasami is awarded the Distinguished conduct medal: 'Stalwart leadership over Delta squad despite their inexperience. Great work - it has not gone unnoticed today.


  Awarded by Col. Scraps-the-Copper on 12/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ups-The-Downs is awarded the Distinguished conduct medal: 'For assisting their squad lead in coordinating Delta squad - a task that I know to not be an easy one. Your work has not gone unnoticed nor unappreciated.


  Awarded by Col. Scraps-the-Copper on 12/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Martin Nitram is awarded the Medal of valor: 'For taking initiative during the defense of the FOB against a xenonid horde - flanking behind their attack path in the face of almost certain death and inflicting mortal wounds. This effort forced them to retreat, and thus set into place the beginning of the end of the hive.


  Awarded by Col. Scraps-the-Copper on 12/17/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





