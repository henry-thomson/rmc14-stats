  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Billy 'Alien' Alien V, Margo Bragga, Tereseeva Valda, Kal Greene, Ted 'Pockets' Gold.



  Royal Jelly Awards:

  Elder Ravager (VV-846) is awarded the Royal jelly of resilience: 'For with standing two tube spit that brought you near the brink of death one location I can definitely account remembering is when you got tubed at Low Security Cell Block. You were at the inch of your life, even going critical during that moment. However thanks to others taking the blows for you after that, you survived the engagement. Thank you for pushing forward with all your carapace. You bring me glee, knowing there is always a worthy shield for the hive. Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (TO-684-MB) is awarded the Royal jelly of rejuvenation: 'For saving several sisters that been tubed by the pesky tuber tall... I will reward you this jelly for saving not just me, the hedgehog, the boiler that got tubed at Engineering ring. Your sisters implored your efforts for your work, always appreciated to see you still pull your weight after a long time. Rejoice!' by Prime Queen (PRO)




