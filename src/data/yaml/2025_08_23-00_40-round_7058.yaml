roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Keegan Nguyen, Kaleb Randolph, Dusty Nightflitter, Breaks-the-Tides, Velo 'FriendChirp' Flock, Nick Laine, Garske Syc.



  Medal Awards:

  Iva 'Moff' Lynx is awarded the Distinguished  conduct medal: 'Exceptional work as cargo tech during this operation. It tested the limits of many, and you passed with flying colors.


  Awarded by Col. Scraps-the-Copper on 8/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Defends-The-Comrades is awarded the Distinguished  conduct medal: 'Kept the FOB both well maintained, and it's manpower well organized and efficient. A strong bulwark, that the queen failed to break several times.


  Awarded by Col. Scraps-the-Copper on 8/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Invokes-The-Cobra is awarded the Medal of valor: 'Nothing short of exceptional work today. I felt nothing but unbridled rage each and every time your SADAR hits were nullified by the valkyries the xenonids fielded. Yet, despite this, you kept on keepin' on. Our victory is owed a large part to you today.


  Awarded by Col. Scraps-the-Copper on 8/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Minji 'Failsafe' Kilgrim is awarded the Distinguished  conduct medal: 'Great work procuring a simply astounding amount of chemicals for the marines to use today. Every sip of GC saved time for our corpsman that they desperately needed to spend on reviving other fallen comrades.


  Awarded by Col. Scraps-the-Copper on 8/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Sam 'Smiles' Spektor is awarded the Distinguished  conduct medal: 'Rose to the challenge of leadership after their squad leader was captured early on in the operation. Performed quite excellently, no doubt to be a strong replacement for the loss of Gunnery Sergeant Tides.


  Awarded by Col. Scraps-the-Copper on 8/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





