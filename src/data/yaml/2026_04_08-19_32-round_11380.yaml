roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tasumi, Yvette Kolh, Gambit Dusty, Wisp 'Nobody' Dawndancer, Kit Gomez, Kehjumi, Blanka 'Disater' Zuan, Michael 'Mikey' McGoggins, Sips-The-Cola, unknown, unknown, unknown, unknown.



  Royal Jelly Awards:

  Prime Hivelord (TR-232-LL) is awarded the Royal jelly of resilience: 'TRLL, for your efforts as a builder today in keeping the hive strong with resin you shall recieve this here jelly of resilience.


  The talls were mighty this day, but your resin was mightier. Your hard work payed off and meant we came out victorious today.


  All hives wish they had builders dedicated like you.


  YIP!!' by Ancient Queen (YIP)

  Runner (PA-794-F) is awarded the Royal jelly of sabotage: 'PAF, today you proved the power of the tier 1 by scouting as a runner. Your callouts were vital in securing multiple captures of the pesky talls.


  If all runners were as active in scouting as you, the talls would never dare go in groups of less than 10.


  Your efforts today have helped paved the way to our victory, for this you recieve the jelly of sabotage!


  YIP!!' by Ancient Queen (YIP)

  Young Hivelord (ST-639) is awarded the Royal jelly of resilience: 'ST, as a young lord you managed to excede the expectations of even queen mother. Staying alive for much longer than the average young lords, you managed to keep building the hive through it all.


  If you keep the work up in staying alive you can hopefully inspire other young lords to follow in your footsteps. Keep on building the hives and let no tall stop you!


  In your effort to keep the hive safe with your mighty resin you have managed to earn yourself this here jelly of resilience!


  YIP!!' by Ancient Queen (YIP)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
