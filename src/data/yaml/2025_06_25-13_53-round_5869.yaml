roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Janina Wood.



  Royal Jelly Awards:

  Prime Runner (ABO-661) is awarded the Royal jelly of proliferation: 'I am bestowing this jelly for your numerous captures for the hive, that have tremendously help the effort of the battle. Not to mention it pretty much saved the hive because nobody was willing to do captures as much as you were. You did amazing this battle, Rejoice!' by Prime Queen (PRO)

  Ancient Lurker (NOX-554) is awarded the Royal jelly of proliferation: 'You have made an impact on this battle that resulted your total performance of 11 captures in total this battle. That tremendously great for the hive, and that of which has made the talls fall swiftly during their attempt to break into caves. You were a shining example of a runner, during that time, and of which I am glad to have had you this battle. Keep it up! Rejoice!' by Prime Queen (PRO)

  Young Drone (MI-459) is awarded the Royal jelly of rejuvenation: 'For your incredible healing, from transfering plasma, healing many sisters! You have shown how valuable you truly were, you may be young but you are on the correct pathway as a drone, that is something you should be proud of. You have made an impact, most likely the most during the cave battle incident this battle, that of which resulted in decisive victory because of your support. Well done! Rejoice!' by Prime Queen (PRO)

  Young Praetorian (RT-669-X) is awarded the Royal jelly of resilience: 'You were a valuable daughter this battle, infact you were carrying a couple of captures or at least passing it along to other sisters that of which took care of it. You were most useful moment was when you were at the cave choke, providing essential buffs to me, and others around you, and even providing an essential phermone which was warding preventing others death because of that. For that you deserve this jelly, well done! Rejoice!' by Prime Queen (PRO)

  Young Sentinel (ST-129-L) is awarded the Royal jelly of proliferation: 'You may have been born quite late into the war, but you were born at the right time, and went to the right place that of achieved many captures for the hive. During the Cave battle moment, you were able to help achieve 9 captures by either doing it yourself, or slowing them to where you are the main reason they are being captured. You have done well for this hive, I am proud of your effort for securing so many talls for the hive! Rejoice!' by Prime Queen (PRO)




