roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Holding of Root, Sierra Whiskins, Sari Watts, Noelle Lockhart, Axyl Empyrea, Leonard 'Breacher' State, Clerk 'Joy' Joyce, Artyom Guess, Mariabella Dryfus.



  Royal Jelly Awards:

  Ancient Boiler (RA-916-ZR) is awarded the Royal jelly of slaughter: 'This boiler held the line with spit and boil. After the tall invasion foolishly pushed into our caves, this daughter slaughtered them without fail. There actions enabled us to hold a critical choke point and prevent the talls from recovering their dead. Without there efforts the battle could not have been won!' by Ancient Queen (ARG)

  Elder Ravager (NEV-994) is awarded the Royal jelly of proliferation: 'After each skirmish, no matter how brutal, one daughter always managed to secure a capture. Even as only a lurker this daughter distinguished herself. Time and time again when we would dive into the tall ball, this daughter would capture when no others would. When they became a ravenger this did not stop them. Many sisters can learn from your example this day, bravo!' by Ancient Queen (ARG)

  Young Boiler (RPG-207) is awarded the Royal jelly of resilience: 'This daughter of mind has taken many forms today. A boiler, a warrior, a runner... But they have done something no other sister has. Earned the love of their hive. Voted by all other hive members as having made the greatest contribution to our success. Earning the love of the hive is no small feat and your contributions this day go uncounted. Rejoice!!' by Ancient Queen (ARG)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
