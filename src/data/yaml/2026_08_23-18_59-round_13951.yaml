roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tessy Cal'Enea, Manuel Miller, Kaeker Zixxae.



  Royal Jelly Awards:

  Young Burrower (AC-341-E) is awarded the Royal jelly of resilience: 'My Daughter ACE you were always my royal gardener providing me with constant alacrat. Along with that you also provided many fruits to my other daughters. You done well for such a simple role so REJOICE!' by Elder Queen (FOP)

  Ancient Praetorian (ZAI-71) is awarded the Royal jelly of slaughter: 'My Daughter ZAI your work as a oppressor secured us many captures throught our battle. You also work with our boilers to pull many talls into their own death. For the impressive work this Jelly is rewarded. REJOICE!' by Elder Queen (FOP)

  Young Boiler (HI-424) is awarded the Royal jelly of slaughter: 'My Daughter HI you help wipe out the talls in Southeast caves and even before that you help screen many of my screeches. Without you we would have never survived this fight let alone win it. REJOICE!' by Elder Queen (FOP)

  Mature Boiler (G-560) is awarded the Royal jelly of slaughter: 'My Daughter G you help wipe out the talls in Southeast caves and even before that you help screen many of my screeches. Without you we would have never survived this fight let alone win it. REJOICE!' by Elder Queen (FOP)

  Ancient Ravager (DID-843) is awarded the Royal jelly of slaughter: 'My Daughter DID you were my royal ravager for the long fight, you captures much of the talls we had secured today with many being the hated death spitters. You slaughter your way through the talls and without you we would have been defeated long ago. REJOICE!' by Elder Queen (FOP)




