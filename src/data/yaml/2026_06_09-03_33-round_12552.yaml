roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Spilosoma 'Quattro' Urticae, Alexis Andreeva, Vulfstagmir Zadovsky.



  Royal Jelly Awards:

  Mature Praetorian (AID-640) is awarded the Royal jelly of sabotage: 'AID, today you showed the power of teamwork. You led fellow sisters around the flanks, strinking at the talls from angles different from YIP.


  Your distracting strikes helped keep the talls spread out over large areas making our work at the front way easier. May you keep on leading your fellow sisters into battle as great leaders are what make our hive prosper.


  YIP is proud of your work and hope to see you lead sisters more in the future. They can use your guidance.


  YIP!!' by Ancient Queen (YIP)




