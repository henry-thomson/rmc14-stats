roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Pat Patlal, Lenny Trooper, Polishes-the-Boots, Olive Orr, Fenton Mosser, Terra Korzak, Chez 'Cheese' Woodtiger, Alice Yndir, Niima-Meeli.



  Medal Awards:

  Sergeant Culls-The-Leviathan is awarded the Bronze heart medal: 'Gave perfect coordinates the entire operation resulting in the Xenos never having the upper hand for too long. 


  They were eventually captured and nested but managed to shout their own coordinates which landed on them and prevented many others from bursting. 


  This end result, despite their death, was instrumental to the rest of the operation, stopping any advantage the xeno horde had in it's tracks. 


  Rest easy, Sergeant.' by Lieutenant Colonel Reed McMatherson



  Royal Jelly Awards:

  Ancient Praetorian (AHH-641) is awarded the Royal jelly of resilience: 'My Daughter you been around since the start, remaining alive through so much. You safe guarded the hive against many threats and helped us survive so much. For that I am greatful and reward you with this Jelly. REJOICE!' by Elder Queen (FOP)

  Ancient Praetorian (ZAI-577) is awarded the Royal jelly of proliferation: 'My Daughter you were with us for so much of this capturing many talls in the process. Without your work we wouldn't have gotten this fair. For your hard work I gift you this Jelly. REJOICE!' by Elder Queen (FOP)




