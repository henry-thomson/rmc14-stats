roundEndText: >2-

  Though the resistance of the colonists was vast and great, they could not overcome fate. They lay in ruins that were once their homes, next to others they once called friends, foes, comrades, or strangers. The Xenonids move on, taking their plague to the next city. Leaving behind the remnants of a story none will truly know.


  You did not go gentle into the goodnight.

  You raged, raged against the dying of the light




