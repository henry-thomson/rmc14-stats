roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Petra 'Meow Meow' York, Frank Hirst, Victoria Winterson, Doug Dalton, Karl 'Icarus' Baier, Kylee Wible.



  Medal Awards:

  Gunnery Sergeant Ne'Zun '' G-Line '' is awarded the Medal of valor: 'Ne'Zun's leadership and communication during Manoeuvre Option-Claw lead her squad to be highly lethal and in-step with command, turning about the operation and seeing the colony ultimately purged of the xenonid hive. They showed what it means to be a fine Gunnery Sergeant in the UNMC today. Well done.' by Major Breaks-the-Tides





  [bold]Operation funded by [color=green]Tivii the Great[/color]![/bold]



