roundEndText: >2-

  After action report

  UNMC High Command eyes only.

  “...with many of the EXO suits lost, the threat has been neutralized in the region. While AEGIS is upset about the losses, the recovery of the proprietary data cache will allow us to continue manufacturing at a heavy delay. The recovery of the mechs will ensure no major losses of morale, and assist in public relations. The data from the alpha mech will lead to greater improvements to the program, and better mechs in the near future.


  - Absolute Marine Victory





