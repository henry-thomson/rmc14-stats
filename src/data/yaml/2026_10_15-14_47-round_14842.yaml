roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Rosie 'Freshmeat' Celeste, Emile Luxor, Reese Warren, Bennett Biery, Nesuli, Elroy Aegyr, Henry Lord, Nahami, Mori Vance, Drinks-the-Razorium, Ophelia Neuer, Hudson 'Mule' Keifer, Dave 'Big Dave' Small, Maja Paprika, Tim 'Overload' Tilton, Elena 'Gumpy' Gumpson, Charles 'Scrub' Shick, Cecilia 'Wraith' Wile, Ervar Hayes, Risks-his-Life, Camryn 'Cavalry' Turnehare, Khana-Yanagawa, Bootseey 'Doodle' Mireaux.



  Medal Awards:

  Gunnery Sergeant Noelle Meyr is awarded the Medal of exceptional heroism: 'Gunnery Sergeant Noelle Meyr performed the duties of a marine and Squad Leader within an operation against xenonids to the highest degree. Their initiative and bold moves assisted in ensuring the safety of all those within the scope of the operation.


  Regardless of the specifics, I sense that the initiative of the Gunnery Sergeant in boldly pushing into the Alamo while it was boarded by xenonids groundside and there-in killing the Queen variant may have very well ensured the safety of the ship and it's crew, perhaps even the operation at large. Thank you, Gunnery Sergeant.


  Awarded by LtCol. Kaitlin Zalack on 15/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





