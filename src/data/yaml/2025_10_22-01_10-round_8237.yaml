roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kyriss 'Snow' Winters, Guui Gaius, Harnold Herb, Jacob 'Hearse' Pope, Archibald Garcia, Nesi, Snaps-the-Bolt, Olivia Lambert, Aegis Looney, Bungo Butterbelly, Luanne Greenawalker, Dutch O'Donahue, Aghata 'Supressfire' Fall, Lucian Hunter, Andechs 'Hiver' Kalos, Astra 'Pathfinder' Lucius, Kalaveer 'Kala' Singh, Ralaka, Atlas Moondancer, Peter 'Magnet' Tireman, Chee 'Pressure' Mach, Shakes-The-Friendlies, Finn 'Twice-Burst' Velthorn, Konian Siennawing, Declan Do-Bronx, Eddie 'Suppressing Fire' Mcfall.



  Royal Jelly Awards:

  Ancient Drone (BO-448-OT) is awarded the Royal jelly of rejuvenation: 'You were a healer, a true doctor of the hive!


  You made sure to heal not just me, but everyone who needed it. You kept the front line healthy regardless if we lost almost all our tier 3's


  You healed me at a crucial moment when I needed it the most, I am so appreciated to that support it was like the queen mother sent you down from the sky to save me. 


  Overall, you deserve this jelly, and may you conquer more for the Queen Mother Rejoice!' by Prime Queen (PRO)

  Prime Hivelord (ZAO-818) is awarded the Royal jelly of proliferation: 'You were a hivelord, a builder, a true nightmare to these talls. You kept building, only building. There nothing else on your mind, you made sure to make back up hives, in colony. Marshal is an example.


  You also, decided to make clusters that slowed down the talls, and allowing us to have vital opportunities to take the talls one by one, even if they were all in a big ball.


  Without your help, I don't even know what home I would even have without you. Really well done. I am proud of ya! Rejoice!' by Prime Queen (PRO)

  Elder Warrior (BA-55-KA) is awarded the Royal jelly of slaughter: 'For your excellent performance, in the front line, whilst fighting by my side during the most horrendous of situations. You came through, and aided the front line as the best way you could. Taking talls out one by one, and with your resolve you were the one that came on top.


  Truly a warrior of the hive, I will overall say you deserve this jelly for your immense impact of support. 


  May you bring forth more thriving hives.


  Rejoice!' by Prime Queen (PRO)




