roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Hivelord (XU-536-N) is awarded the Royal jelly of proliferation: 'One of the major hivelords setting up great defenses and cover during sieges,  and engagements, possibly one of the major key to our victory. I thank you for pushing your all, and rebuilding every single ounce of regained land.


  You worked pretty hard since the beginning keep it up! Rejoice!' by Prime Queen (PRO)

  Mature Praetorian (KYL-334) is awarded the Royal jelly of resilience: 'Since the beginning of the battle, you were a major help in providing support at our flanks, keeping talls in check and made a couple of scav captures for the hive, your preseverance in pushing through as earned my notice from your sisters, and me. You also even saved one my ravager SVI from death when a capture got denied.' by Prime Queen (PRO)

  Young Carrier (XD-328) is awarded the Royal jelly of proliferation: 'You were one of the next generation carriers who took of the mantle after our first batch of carriers were killed in the act of duty of the hive. I implore your support as you kept the talls nicely asleep as it made transporting talls easier.


  rejoice!' by Prime Queen (PRO)




