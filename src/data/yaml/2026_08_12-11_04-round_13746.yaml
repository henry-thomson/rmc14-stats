roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  Medal Awards:

  Gunnery Sergeant Aelica 'Mom' Danara is awarded the Distinguished conduct medal: 'Gunnery Sergeant Aelica Danara stands as a testament to the leadership expected of Squad Leader, making independent and valuable decisions in the field balancing the necessities of the operation with risk mitigation to her own squad.


  I myself was witness to the carefull, caring leadership that has your squad listen to you and helped them avoid death while turning it around to aid in a push to kill the xenonid queen.


  Stand proud Marine, it is not often you see leadership capable of maintaining this carefull balance as well as you did today.


  Awarded by LtCol. Kaitlin Zalack on 12/08/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





