roundEndText: >2-

  An investigative report will be issued in regards to the casualty that occured during this training exercise. The marine corps will perform psychological evaluations of all marines who participated in this exercise.


  The marine team's efficacy in terms of survival skills will also be evaluated. Several issues were noted (Lack of mess team designation, no proper meal times issued, little to few team building exercises, poor hygine habits, unwanton aggression, etc, etc). A fuller list of issues will be found in an affixed report, which may be found as an addendum.


  A future investigation into the training grounds will be held at an unknown date.





