roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Maksim 'Mason' Aliev, Caleb Bloodworth, Hugo Knapenberger, Saves-Lives, Katrina Dorkem, Squeaky Chip, Dawson 'Hotshot' Siegrist, Blue Reeds Rivers.



  Medal Awards:

  Sergeant Stares-at-Stars is awarded the Distinguished conduct medal: 'Personally led a small team of Breacher Marines to enable our forces to remain with the initiative in our hands. Clearing almost every single wall and obstacle in the way allowing everyone clear lines of fire and sight, and finally leading his small team to push into Marshals with little support and clearing it despite being outnumbered.' by Major Reed McMatherson





