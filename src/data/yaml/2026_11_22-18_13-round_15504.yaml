roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Catthew 'Statue' Jones, Drinks-the-Razorium.



  Royal Jelly Awards:

  Prime Drone (DU-580-CK) is awarded the Royal jelly of rejuvenation: 'DUCK, You have saved a great number of sisters by healing them, but more importantly, by sacrificing yourself every time a sister is on the brink of death. Some say you might do it a bit too often, but the only reason they can say so is because you made sure they would live.


  For this, I award you this jelly of rejuvenation. Rejoice!


  See you in the next hive!' by Prime Queen (RED)

  Mature Ravager (DSO-172) is awarded the Royal jelly of proliferation: 'DSO, you have played your part perfectly. You have lived until the end, blocking for your sisters and dragging tall's to their doom as the horde descended upon them.


  For this, I award you this jelly of proliferation. Rejoice!


  See you in the next hive!' by Prime Queen (RED)

  Ancient Drone (PEK-457) is awarded the Royal jelly of rejuvenation: 'PEK, You have provided a great deal for this hive. Mainly, you have provided alot of fruits to your sisters. You have basically fed the entire horde with your fruits today, and both I and KVAN you deserve this.


  By this, I mean this jelly of rejuvenation for the great feast.


  See you in the next hive!' by Prime Queen (RED)

  Prime Runner (RO-233-UN) is awarded the Royal jelly of proliferation: 'ROUN, or rather, delivaroun? You have have transported not only talls to our nests, but also many fruits made by PEK to our horde to make sure they were always in shape to fight the talls.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Prime Queen (RED)




  [bold]Operation funded by [color=green]SireHambone[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
