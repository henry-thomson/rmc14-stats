roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Michael 'Mikey' McGoggins, Alex Woodrow, Precious Breakman, Mima Starseeker.



  Royal Jelly Awards:

  Elder Drone (SLY-962) is awarded the Royal jelly of rejuvenation: 'SLY, today you have actually managed to save one of our tier 3's. Your great focus and reaction paid off, saving sister VAN. Healers are the backbone of our great hive and you have proved why that is.


  Keep focused and keep the healing going and eventually every mind shall hear of your great healing efforts. YIP is proud to have had you as a healer today.


  YIP!!' by Ancient Queen (YIP)

  Young Hivelord (ZOE-654) is awarded the Royal jelly of resilience: 'ZOE, today you led our build efforts. You may be young, but you still dared to step up and take charge. This is impressive as it isn't often young dare to take charge.


  You still got much to learn, but learn you shall if you keep working as you have today. Your efforts kept the talls stuck inside perch for almost the entire battle. This is very strong of you and your team and YIP is proud of your efforts.


  A nugget of wisdome from YIP would be, as designer, always make sure to work with other lords or drones and never alone. This way your power is far greater than alone.


  YIP!!' by Ancient Queen (YIP)




  [bold]Operation funded by [color=green]Mci[/color]![/bold]



