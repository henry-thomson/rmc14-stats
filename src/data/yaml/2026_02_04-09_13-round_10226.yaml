roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rico 'Quicksilver' Panzera.



  Royal Jelly Awards:

  Prime Ravager (KR-962-IS) is awarded the Royal jelly of proliferation: 'For your tremendous value of putting forth your best, and making many captures for the hive.


  You captured the tuber at south of admin!


  You captured at least 3 tall healers, crippling their healing potential.


  You capture so many talls it was unbelievalbe, you are the main daughter that turned the battle in our favors you worked so well like you were reading my thoughts.


  Well done, Rejoice!' by Prime Queen (PRO)

  Young Hivelord (XX-531) is awarded the Royal jelly of proliferation: 'For putting forth your best, as your first time as hivelord, you built up many walls where it was needed, and delivered results where it counted.


  I want to make you realize how great you were as our 2nd hivelord of the hive, and you were doing amazingly well, under pressure, and under dangerous situations.


  Rejoice!' by Prime Queen (PRO)




