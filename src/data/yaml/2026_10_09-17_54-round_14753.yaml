roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tyshara Marethis, Heidi Marcotte, The Flower of Vivacity, The Glacier of Excitement, Rita Marie Dodginghorse.



  Royal Jelly Awards:

  Prime Praetorian (TO-823-MB) is awarded the Royal jelly of proliferation: 'Since the beginning and end, you were always here to provide support to the hive as our valkyrie. Overall you made a spectacular performance. That of which I can't even state in words. Though I wanna say you were one of the main reasons alot of sisters didn't die today thanks to your warding. I am thankful for you sticking with us till this moment. Rejoice! This was taken place at the battle of Soro.' by Prime Queen (PRO)

  Prime Praetorian (WA-454-LL) is awarded the Royal jelly of resilience: 'Since the beginning you provided support to the front thorugh out the entire battle! You went through as much hardship as I did. you kept on spitting and providing and that what matters. Keep enduring through all the hardships as a base praetorian! Rejoice!' by Prime Queen (PRO)




