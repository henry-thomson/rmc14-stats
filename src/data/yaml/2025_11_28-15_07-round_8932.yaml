roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Goddard Altmann, Niki Ortiz, John 'Lifeline' Spade, Zero, Jean Cartier, Ivan Stough, Bobby 'Bean Head' Blue, Tristram Osset, Gozo Kivi, Kylee Wible, Duke Pyxis, Reid Wilson, Olivia Lambert, Purp Winter, Richard 'Richie' Rhymes, Saves-Lives, Saber 'Vulpis' Herder, Jon 'JL' Lewis, Jack Jones, Gil 'Ghost' Gallagher, Lux 'Char' Winter, Ruby Goobie, John Smith, Homer 'Naked' Anderson, Laura Markova, Titus Laurenzi, Xaaqxer Kaexuer, Altair 'Christmas' Nightwish, Dante Minnie, Ram Noodles, Oberon 'Obi' Toski, Adelice Delahoussaye, Syo Rilie, Larry Garrison, Osborne Lee, Gary 'Colander' Hanks, Shakes-The-Friendlies, Jim Duncan, Lilian Managan, Watches-For-Threats.



  Royal Jelly Awards:

  Mature Boiler (FI-72-N) is awarded the Royal jelly of resilience: 'FI-N not only managed to be the last surviving T3 of our hive but with them staying with me all the time and supporting me on every screech we managed to stall and decimate the tall forces, without you victory would not have been possible. Thank you y daughter!' by Prime Queen (ABO)

  Young Carrier (DE-901-L) is awarded the Royal jelly of proliferation: 'With them on the front every tall was quickly infected and transported to the depths of our hive, This daughter was there in all the dire situation and helped their hive achieve victory. Thank you my daughter!' by Prime Queen (ABO)

  Mature Burrower (SE-746-R) is awarded the Royal jelly of resilience: 'With them placing tunnels all around the planet we could travel anywhere we wanted at haste! the tunnels also contributed into saving countless of our captures. They have managed to secure the future of our hive. Thank you my daughter!' by Prime Queen (ABO)




