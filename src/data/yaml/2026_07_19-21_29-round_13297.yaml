roundEndText: >2-

  With their backs against the wall, FORECON proved themselves to be the tip of the spear. By cutting to the heart of the colony, they saved not only themselves, but every soul on the UN ships that were rushing into the same trap.


  The destruction of Port Nereid will have major ramifications for the logistics of the Fleet, already limping from its prior engagements. It remains unclear if the colony can even be reclaimed.


  [color=lightblue]Today, however, that is not your concern. You survived.





