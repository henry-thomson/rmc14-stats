roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Richard Raucher, Minji 'Failsafe' Kilgrim.



  Royal Jelly Awards:

  Young Boiler (FI-465) is awarded the Royal jelly of slaughter: 'During the battle of LV-624 you were a boiler through beginning to end, I am so thankful I had you because without you. The Hive would of went extinct in caves if it weren't for you. May you strike through waves of talls with your boils, as you provided so much potential through that battle. Great job on learning the ways of boilers as a young one as well, putting these primes to shame. Rejoice!' by Prime Queen (PRO)

  Young Hivelord (AX-640) is awarded the Royal jelly of proliferation: 'For building since the beginning and end of the battle of LV 624 your dedication was noted through my eyes. I hope that you continue your path toward making fine art for the hive in the foreseeable future. keep your great dedication! Rejoice!' by Prime Queen (PRO)




