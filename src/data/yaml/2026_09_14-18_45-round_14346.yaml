roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rains of Fire, Ray 'Yap' Steelshine, Mina Turner, Olivia 'Livvy' Croft, Dvora Cunningham, Ezra Kiefer, Water-Falls, Vladimir 'D-E' Kamnerezov, John 'Spectre' Clarke, Daria 'Theseus' Kaards, Roman 'Ranger' Bandera.



  Medal Awards:

  Staff Sergeant Olivia 'Haze' Prospero is awarded the Distinguished conduct medal: 'on the reccomendation of the bravo SL. they noted your help as key in securing the FOB and making sure it did not fall to xeno infestation through hard work and team work helping take down walls and build them up


  Awarded by Col. Tyr Ragnarson on 09/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Private Johan Karlson is awarded the Distinguished conduct medal: 'on the recommendation from the bravo SL for using your engineering expertise to help secure and fortify the FOB from any xeno attempt to break it. with your skill FOB was made into a powerful fortress that wouldnt fall


  Awarded by Col. Tyr Ragnarson on 09/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson

  Second Lieutenant Mien Rongrong is awarded the Medal of valor: 'your work on the field was essential for us gathering intel. dispite your entire team dying. your work single handidly obtained us enough information to expand our war fighting potention in all aspect. and your valor in doing so alone is an inspiration


  Awarded by Col. Tyr Ragnarson on 09/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





