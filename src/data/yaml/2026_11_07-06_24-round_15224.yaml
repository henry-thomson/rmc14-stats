roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Hivelord (OUG-458) is awarded the Royal jelly of proliferation: 'OUG Has risen to the task of building when our hive had no hivelords! they were the only volunteer to go hivelord when we had noone and so they built till the end of talls! For this, I grant them the jelly of proliferation. Rejoice!' by Elder Queen (FEAR)

  Ancient Drone (ABC-786) is awarded the Royal jelly of rejuvenation: 'ABC, our healer drone has always made sure to keep sisters safe and healed! they made sure no sister died, even risking their life for them. For this, I grant them the jelly of rejuvenation. Rejoice!' by Elder Queen (FEAR)

  Young Ravager (DEA-237) is awarded the Royal jelly of slaughter: 'DEA, Our berserker ravager made sure to kill talls up until the end! They were especially important in the final wipe at cave camp, where they killed so many talls that talls couldnt recover! For this, I grant them the jelly of slaughter. Rejoice!' by Elder Queen (FEAR)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



