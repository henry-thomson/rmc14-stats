  Royal Jelly Awards:

  Young Hivelord (ZU-224) is awarded the Royal jelly of proliferation: 'You are the noose, slowly closing in around the talls. You our foundation: providing saftey, cover, and angles to attack in ample portion. You did significant work building up fortifications in botany, causing the talls to panic and retreat. Though you are young, you showed exellence and courage and your actions help us win this fight, thus, i give you this jelly of proliferation.' by Elder Queen (CMP)

  Prime Drone (MIU-486) is awarded the Royal jelly of rejuvenation: 'You, MIU, are an example to all healer drones. For the whole course of the war have you healed and mended bone and body, allowing sisters to contsatly stay in the fight. Were it not for you, our mighty war machine would have slowed significantly, potentially costing us oppurtinutes needed for victory. Thus, I grant you this jelly of rejuvation. May you forever be our guardian angel!' by Elder Queen (CMP)




