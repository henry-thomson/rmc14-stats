roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Granola 'Biggy' Foot.



  Royal Jelly Awards:

  Young Boiler (RA-915-M) is awarded the Royal jelly of slaughter: 'When the hive doesn't expect it, when the Queen doesn't need it, you involuntarily chose the caste that you were bound to fulfill. Your ability and synchronization astonished me, as you did the very best of your ability in stalling the tall menace until the very end of those dire times.


  Your solo existence was the reason for our victory today. During those dire times, when we were cornered, cowering within our chitin, your resilience and dedication became the reason for our victory in the end.


  Grandwork.' by Ancient Queen (SVI)

  Young Boiler (XX-440) is awarded the Royal jelly of resilience: 'As for our secondary Boiler, who stood against the Tall, bringing death upon many of their counterpushes, even so, your ability to effectively utilize your caste against the Tall menace that settled upon our planet was remarkable. You brought them despair, forcing the Tall to cower behind their metal resin lines.


  You stalled them until the very end of those dire times. You did a grand work in effectively bringing down the Tall menace while I continued my onslaught against them.


  Grand work, XX, you did amazing.' by Ancient Queen (SVI)




