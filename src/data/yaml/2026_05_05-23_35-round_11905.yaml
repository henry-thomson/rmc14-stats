roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Stares-at-Stars, Zenko Kit Sune.



  Royal Jelly Awards:

  Ancient Runner (ORB-227) is awarded the Royal jelly of sabotage: 'Did the most greatest clean grab, to capture the tall empress, at stony field when I made a risky scream.


  You didn't flinch once, and you kept at it, cutting off their entire leadership with that courage.


  Great work!' by Immature Queen (PRO)

  Young Defender (FAE-503) is awarded the Royal jelly of resilience: 'You were the defender who fortified at my position before I collapsed from critical injuries, which undoubtfully prevented my death. west of botany when I was slowed down by water. Thank you for doing what was necessary.' by Prime Queen (PRO)

  Young Hivelord (BO-39-B) is awarded the Royal jelly of proliferation: 'For building a fortress at scrub land where when the talls clear it, you rebuilt it all back up like nothing happened. Impressive, perhaps even too impressive for the hive, overall you did undoubtfully beautiful work that pretty much protected the north pylon thanks to you, which I utilize the royal jelly to make more larvas, and even fire resistances. Rejoice!' by Prime Queen (PRO)

  Young Hivelord (CIG-581) is awarded the Royal jelly of proliferation: 'For working hard with the builders you help tremendously built up botany, and stony field. Making our flanks so wonderful that I can continously exploit the talls sides like no tomorrow. Thank to your work of course... I hope that you continue with the dedication like this, and keep it up in the future. You did absolutely amazing, thank you. Rejoice!' by Prime Queen (PRO)

  Elder Drone (RO-836-E) is awarded the Royal jelly of rejuvenation: 'For making fruits for the entire battle beginning to end, practically following me wherever I went, and kept the front healthy with unstable, greater resin fruits, alacrit to me. You pretty much were one of our main supports in terms of rejuvenation, and buffing your sisters. Thanks to that effort, I implore you with this jelly for such eager work. Rejoice!' by Prime Queen (PRO)




