roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kiko 'Keeko' Winterrey, Entony  White, Endrine Bloodrose, Peter 'Magnet' Tireman, Cook Justin.



  Royal Jelly Awards:

  Drone (BNB-837) is awarded the Royal jelly of rejuvenation: 'this sister was the greatest one of them all. she healed me and the fallen while we were running from the talls. without them we wouldve died to the flank... REJOICE!!!' by Ancient Queen (HEN)

  Ancient Defender (AD-656-DY) is awarded the Royal jelly of proliferation: 'this sister was the main dragger in our hive, they dragged on every scream, every neuro. even on bait neuros. securing us atleast 15 captures.... REJOICE!!!' by Ancient Queen (HEN)

  Mature Ravager (RGB-520) is awarded the Royal jelly of sabotage: 'her name is whispered among sisters as a great leader. who lead the sisters through the fight, also being a T3 from the start and not dying... REJOICE!!!' by Ancient Queen (HEN)




  [bold]Operation funded by [color=green]Rhesa's Blueberry Bobda[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
