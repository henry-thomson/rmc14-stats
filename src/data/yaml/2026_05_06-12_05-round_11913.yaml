roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Aston Yahn.



  Royal Jelly Awards:

  Ancient Ravager (SVI-548) is awarded the Royal jelly of slaughter: 'SVI, today you channeled your inner rage, your hatred for the talls and what they did to our young. You alone went forward with that rage and made the talls suffer from your claws. So today I reward you this jelly to remember this day. REJOICE!!


  See you in the next hive.' by Elder Queen (VCR)




