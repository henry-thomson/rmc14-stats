roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Praetorian (FOP-26) is awarded the Royal jelly of resilience: 'For shielding me during the engagement of filitration when I got tubed, you did what you could and that what matters. I thank you for doing your royal duty as my valk. Rejoice!' by Prime Queen (PRO)

  Prime Ravager (NEV-354) is awarded the Royal jelly of slaughter: 'You were a true berserker, ripping and tearing through the talls line like swiss resin, none of them stood a chance against your might. I am impressed, good job on making sure the wipe was possible with your help rejoice!' by Prime Queen (PRO)

  Ancient Ravager (JA-81-KE) is awarded the Royal jelly of slaughter: 'You were my blade of the hive, that rend the flesh of the talls during the great push of filitration, to engineering. You turn committed and show these talls your rage! you were a great help in ensuring that the tall wipe was possible. Rejoice!' by Prime Queen (PRO)

  Drone (OG-606) is awarded the Royal jelly of rejuvenation: 'For making the great fruits of the hive that help kept us in shape, and perhaps even giving me my favorite fruit the alacrit. Overall you one of the main drones of assistance of healing and buffs that were great for the battle. I thank you from the bottom of my heart Rejoice!' by Prime Queen (PRO)




