roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Cayden AW Longbow, Eiuus-Zeeus, Menodora Cometrider, Tail-Tail, Tajali.



  Royal Jelly Awards:

  Ancient Hivelord (OOO-483) is awarded the Royal jelly of resilience: 'My Daughter OOO along with JAD you both were the hivelords that kept building since the start of out struggle. You both continue to keep the endless wave of resin that slowed talls in their push. Without the both of you we would have never been able to end them.


  REJOICE!' by Ancient Queen (WOLP)

  Elder Hivelord (JAD-205) is awarded the Royal jelly of resilience: 'My Daughter JAD along with OOO you both were the hivelords that kept building since the start of out struggle. You both continue to keep the endless wave of resin that slowed talls in their push. Without the both of you we would have never been able to end them.


  REJOICE!' by Ancient Queen (WOLP)

  Ancient Defender (FAE-957) is awarded the Royal jelly of sabotage: 'My Daughter FAE you captured the Empress alone at a key point in our struggle allowing us to wash over the tall ball slaughtering them all with ease. You help us avenge many of my daughters today.


  REJOICE!' by Ancient Queen (WOLP)

  Prime Ravager (NEV-342) is awarded the Royal jelly of slaughter: 'My Daughter NEV it goes without saying why you are a Apex Ravager you slaughter your way through the talls and secured us many of the captures we needed. Without your work we never been able to secure victory.


  REJOICE!' by Ancient Queen (WOLP)

  Prime Praetorian (ARG-821) is awarded the Royal jelly of sabotage: 'My Daughter ARG you early one help save mine and other daughters lives with your fury allowing many to continue the fight. You sacrifice your life to help us secure the boomrocker in research who has slaughtered my daughters of mine. Your return as a healer was in such a needed time as well. Without that constant work to help us we would have faultered.


  REJOICE!' by Ancient Queen (WOLP)




