roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Purp Winter.



  Royal Jelly Awards:

  Prime Hivelord (ZAO-425) is awarded the Royal jelly of proliferation: 'For your dedication in following orders perfectly. You manage to successfully ensnare the talls with backline weeding, and proceeding the encirclement plan I have envisioned. If I could cry a thousand rivers I would for how beautiful each resin was made. You doomed the talls with your structures, and the hive feasted!


  Rejoice! You deserve this!' by Prime Queen (PRO)

  Young Ravager (OPA-83) is awarded the Royal jelly of resilience: 'Through the beginning of this crude battle, the creatures stood no chance against your carapace. You stood firm, slowing, and preventing talls from counter pushing. You even kept putting pressure where it was needed, you deserve this jelly for your efforts.


  Rejoice!' by Prime Queen (PRO)

  Ancient Drone (FL-387-W) is awarded the Royal jelly of rejuvenation: 'You have done an excellent performance on the frontline, ancient drone. You were the one to deliver fruits where needed and maintained the condition of the hive.


  You have done your royal garden duty on ensuring each and every sister in the hive had a fruit to enjoy. 


  Without your efforts, there wouldn't be as much healthy sisters as there is now. 


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Arcturus's Xeno Pet[/color]![/bold]
