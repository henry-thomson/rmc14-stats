roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Manuel Miller, Kylee Wible, Tom Walsh.



  Royal Jelly Awards:

  Ancient Lurker (ALT-606) is awarded the Royal jelly of resilience: 'You sacrificed yourself to stun the tuber the moment talls perched, which then in  turn got us the tuber, I thank you for your service for when you were a lurker during the few seconds, but it was not in vain and your effort was tenfold a better trade. Rejoice on your resolve!' by Prime Queen (PRO)

  Ancient Drone (VV-793) is awarded the Royal jelly of rejuvenation: 'You sacrificed yourself to bring me back up when I fallen at the hallway west of  south colony caves, I thank you for doing such an  action as it gave me a 2nd chance. I hope to see more healers like you in these times. Rejoice!' by Prime Queen (PRO)

  Young Hivelord (XX-927) is awarded the Royal jelly of proliferation: 'You were a great help in terms of support, and building. Your work was greatly appreciated when you helped XX-890 hivelord, at central cave, and every where else that was your doing. I hope to see you grow to be prime one day, and you torture these talls with 5000 walls. As you should, but overall I hope you learned alot with the hive. Rejoice!' by Prime Queen (PRO)




