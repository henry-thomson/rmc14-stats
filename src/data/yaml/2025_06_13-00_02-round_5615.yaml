roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Adelice Delahoussaye.



  Royal Jelly Awards:

  Young Ravager (NI-470-KI) is awarded the Royal jelly of slaughter: 'This daughter was our beserker ravenger - once the previous queen died they held the line at eye tower long enough for me to mature. Without them fighting back the talls victory would not have been possible on this day. They bravely gave there life defending the eye tower and stalling the talls long enough for us to secure many caps. Bravo!' by Elder Queen (ARG)

  Prime Runner (ABO-924) is awarded the Royal jelly of resilience: 'This sister acted both as our carrier and as a runner. During there time as a carrier they secured many talls using well placed traps. When called upon they became a runner to scout for mother, they captured many lone talls without support from other sisters. During critical junctures in the fight against the talls there amazing commuinication lead us to victory.' by Elder Queen (ARG)

  Prime Praetorian (KRY-458) is awarded the Royal jelly of resilience: 'This sister was our Valkrye, there noble attempt to save our first queen was sadly stopped by the talls. However, this sister showed true courage in the fight against the talls, they bravely held the line at the evil eye tower and stalled the talls advance long enough for me to mature.' by Elder Queen (ARG)

  Mature Boiler (RIV-435) is awarded the Royal jelly of slaughter: 'This sister was our boiler. When the previous queen died they bravely stalled the talls with spray and boil. At critical points they were by my side, acting without instruction to provide cover and slaughter foolish talls who attempted to push us. Without there support victory would not have been possible.' by Elder Queen (ARG)




