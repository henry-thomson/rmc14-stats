roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Cesara McAlpine, Cynte 'Artificer' Lightweaver, Jesse Ramirez, Jane Holiday, Victor Hall, Keturah Laurent, Geel-Parash, Duncan Logue, Kane Fleming, Andrea 'Dre' Newbern, Casey Gibson, Spike MacLagan, Slowy Garrison.



  Medal Awards:

  First Lieutenant Hydie AW Steyr-Hahn is awarded the Medal of exceptional heroism: 'for leading the defense of the western half of Fore side of our ship. keeping fuel running fast enough for us to escape the ship with our lives. your courage in doing so and keeping me informed while doing so marks you as a hero in my books. i hope you survived your duty. and to see you again one day


  Awarded by Col. Tyr Ragnarson on 10/03/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson



  Royal Jelly Awards:

  Young Hivelord (ED-210-IT) is awarded the Royal jelly of proliferation: 'Today, you've proven the excellence of the art of the build, and been on top of building in the heat of the battle, where it was most vital. You built up to and on the perch when it shouldn't have been posisble, and helped us secure our win through this battle of attrition today. Continue growing and continue your good works.


  Love,
    Mother.' by Elder Queen (JINX)
  Young Warrior (BE-441-H) is awarded the Royal jelly of resilience: 'Despite being so young, you showe off the behaviour of a prime warrior today. Going where others feared to, protecting and recovering those thought to be lost, and all around being on your A+ game at all times, you've demonstrate an excelent mentaility for your caste today, and I can't wait to see you in further hives with this.


  Love,
    Mother.' by Elder Queen (JINX)
  Young Hivelord (CC-846) is awarded the Royal jelly of resilience: 'You've done great works today, and should not play down your help. Gardening is a tough task to perfectly maintain, especially on the front, but you've showed great dedication to the craft today, and in doing so helped us secure a foothold where the talls didn't want us the most, and in the ned being a part of winning us the day. Thank you.


  Love,
    Mother.' by Elder Queen (JINX)



