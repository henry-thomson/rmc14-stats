  Rinka Izumi.



  Royal Jelly Awards:

  Ancient Ravager (LU-838-AN) is awarded the Royal jelly of resilience: 'You have lead the group of ravagers even after my death, and you have shown these talls no rest, they were simply no match and i reward you for you leading them even after my premature death.' by Ancient Queen (BUH)

  Mature Ravager (VCR-869) is awarded the Royal jelly of slaughter: 'Blood is still fresh on your claws, and i believe for the rest of your existence it will stay that way, i thank queen mother that your mind is with us as i truly fear you, but keep it towards the talls, Continue the onslaught! Destroy. Them. All!' by Ancient Queen (BUH)




