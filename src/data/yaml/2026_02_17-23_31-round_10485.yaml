roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Warrior (JA-303-KE) is awarded the Royal jelly of slaughter: 'For your backline work securing the majority of our captures.


  Your efforts allowed us to replenish our ranks, sabotage their movement. And make the talls act foolishly. 


  This comes at many request from your sisters, well done.' by Prime Queen (HEK)

  Young Hivelord (XX-932) is awarded the Royal jelly of resilience: 'Your work leading a build team so young is something that deserves recognition.


  Thank you, without your help we would not have been able to reclaim land so effectively. I hope to see your skills as a leader grow.' by Prime Queen (HEK)

  Young Crusher (IRS-887) is awarded the Royal jelly of slaughter: 'Your jelly comes from the notice of your sisters, I have personally seen your work slaughtering talls and your response to my summons was fast as it was effective.


  Well done.' by Prime Queen (HEK)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



