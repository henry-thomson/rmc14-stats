roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Burrower (AID-922) is awarded the Royal jelly of proliferation: 'AID got a wonderful capture on the planet talls through their good knowledge of burrower. As such the rest of our hive easily culled the rest of the uncooperative vermin.' by Elder Queen (TEZZ)

  Ancient Ravager (NEV-309) is awarded the Royal jelly of slaughter: 'NEV Held the line strong and hard in Lambda, preventing the talls from entering our home and eventually leading to the gibbing of the tuber by defending the body with their life.' by Elder Queen (TEZZ)

  Ancient Warrior (JA-284-KE) is awarded the Royal jelly of sabotage: 'Constant harassment of the yellow talls in perch among a few other sisters. They also captured the prime scav tall who dived and caused my earlier death in ETA. Revenge is a dish best served tall.' by Elder Queen (TEZZ)




