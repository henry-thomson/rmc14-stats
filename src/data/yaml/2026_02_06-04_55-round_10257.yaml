roundEndText: >2-

  With the crew of the UNS Almayer beaten and bruised after an infiltration of three undercover CLF agents crippled their security and command teams, allowing for CLF reinforcements to take control of the ship and set it's course for a CLF stronghold, all they are left to do is contemplate what could of been done better as they enjoy their voyage on a lifeboat to a hopefully UN-affiliated rescuer.


  CLF Pyrrhic Victory.




