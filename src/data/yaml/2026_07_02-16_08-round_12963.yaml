roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Wulfrun Blue, Samuel Yeskey, Marie AW Fauchard, Lenny Kuster, Drinks-The-Firewater.



  Royal Jelly Awards:

  Mature Drone (XX-358) is awarded the Royal jelly of rejuvenation: 'XX-358, you were brave today. As a healer you managed to save one of our boilers from certain death. You selflessly gave your life to save them when they needed it the most.


  For your bravery and dedication to the hive you shall receive this here jelly of rejuvination. YIP wishes to see more of your work in the future. Keep working like you have today and you will grow into one of the strongest sisters of the hive.


  YIP!!' by Prime Queen (YIP)

  Ancient Drone (CAR-266) is awarded the Royal jelly of rejuvenation: 'CAR, you were the royal gardener today. You are the first ever royal gardener of YIP and you committed to excellence. No one can top your work today, only match it in its greatness.


  You consistently, at all times, no matter what, provided YIP with spore as needed. YIP never ran out of their spore stacks as you simply would not let that happen. Even when in ovi that was not going to stop you from performing your duty.


  Your work today has set the bar extremely high for future royal gardeners. You should be proud of your performance.


  YIP!!' by Prime Queen (YIP)




  [bold]Operation funded by [color=green]TAAAAAAANK!!![/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
