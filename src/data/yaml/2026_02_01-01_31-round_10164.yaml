roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Remmy 'Specialist' Renshaw, Cedrik Steel, Tyrone Choom, Ludwig 'Moleman' Blackmoor, Jasper 'Stonewall' McClen, Kapi Algarve, Marco Biery.



  Medal Awards:

  Natalya 'Nat' Rosesteel is awarded the Distinguished conduct medal: 'For their diligent overwatch of the FOB and it's surrounding territory - spotting out a desperate attempt by the xenonids to mount a sudden all-in assault directly in the LZ through a series of tunnels that had gone unseen. Had you not been there, we would have lost the FOB.


  Awarded by Col. Scraps-the-Copper on 1/31/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Sasha 'Bell' Bellina is awarded the Distinguished conduct medal: 'Excellent work as the Charlie Demo specialist today. You were like a hunter, scouring the field of operation for their prey - quite the thrill to see. You also proved you had the accuracy of a hunter - hitting a charger crusher mid-charge, stopping it in it's tracks permanently.


  Awarded by Col. Scraps-the-Copper on 1/31/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





