roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Joey Filmore, Horo Whitewitch.



  Royal Jelly Awards:

  Prime Hivelord (RO-611-CK) is awarded the Royal jelly of resilience: 'This daughter served well in the caves war. Their resin was a fortress that made talls stop to a halt. Their positioning in the caves was great as well. They always built where talls had left, ensuring talls would make no progress. For this work they deserve the jelly of resilience.' by Prime Queen (GIB)

  Ancient Hivelord (PRK-67) is awarded the Royal jelly of resilience: 'This daughter was responsible for the cave choke that made talls unable to move. Their strategy of refilling a cluster so much amazes me. Their endless supply of plasma made sure that the talls would not be able to push the choke and for this great effort they shall deserve the jelly of resilience.' by Prime Queen (GIB)

  Prime Hivelord (ENZ-504) is awarded the Royal jelly of resilience: 'This daughter built up the caves and reinforced them well. They may have fallen in battle, but their resin stood strong and mostly impenetrated. We used their resin until the end in their honor. I wish you were here to see the great work you made happen, but i award you this jelly of resilience for the next life.' by Prime Queen (GIB)

  Prime Boiler (WAR-672) is awarded the Royal jelly of slaughter: 'This boiler was my royal entourage during the caves siege. Them sticking together with me made sure talls would suffer in their gas during my screeches. They followed my orders well and slaughtered many in my name. The jelly of slaughter shall decorate this daughter well!' by Prime Queen (GIB)

  Ancient Burrower (EAT-796) is awarded the Royal jelly of resilience: 'This daughter made so many traps in the caves that I couldnt even count them. They made the tall advance slow to a halt and made them reconsider ever pushing caves. Their determination to make caves an impenetrable fortress was shown during this fight and I hope they appreciate this jelly of resilience!' by Prime Queen (GIB)




  [bold]Operation funded by [color=green]Dry Wetbrush[/color]![/bold]



