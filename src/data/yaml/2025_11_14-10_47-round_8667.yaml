roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Carton Lightbringer, Roscoe 'Sips' Springs, Luanne Greenawalker, Thales 'Careless' Antares.



  Royal Jelly Awards:

  Elder Defender (LEF-59) is awarded the Royal jelly of resilience: 'This daughter played a critical roll in turning the tide against host onslaught. Thanks to their bravery and willingness to sacrifice themselves for the hive, we managed to gib a tuber host. Rejoice LEF! You are most deserving of this jelly. Queen Mother would be proud of your feats!' by Elder Queen (LOL)

  Ancient Defender (RO-230-TN) is awarded the Royal jelly of resilience: 'One of the daughters that played critical roll to turn tides against skytall slaughter. Thanks to their bravery and willingness to sacrifice themselves for greater good of hive we have managed to turn the tide. Rejoice, RO-TN! You are most deserving of this jelly. Queen Mother would be proud of your feats!' by Elder Queen (LOL)

  Young Drone (HU-810) is awarded the Royal jelly of rejuvenation: 'One of the healers I am most proud to have. Thanks to their timely aid, I could push positions otherwisely I had to wait until I am in good condition. They showed a great example of what a healer should be to all other daughters! Rejoice, HU! You are most deserving of this jelly. Queen Mother would be proud of your feats!' by Elder Queen (LOL)

  Young Hivelord (UG-113) is awarded the Royal jelly of resilience: 'One of the sisters that tirelessly built according to my orders. Thanks to their fast and clever building we managed to hold the tide against the skytalls and managed to secure a victory. You showed a great example for all other sisters how a Hivelord should be. Rejoice, UG! You are most deserving of this jelly. Queen Mother would be proud of your feats!' by Elder Queen (LOL)

  Mature Hivelord (EF-877-E) is awarded the Royal jelly of resilience: 'One of the first born sisters I am proud to have. Thanks to their endless resin structures, we manage to pull this victory out. Their enermous resin walls stalled sky-hosts long enough to make a turn from a grim situation. Rejoice, EF-E! You are most deserving of this jelly. Queen Mother would be proud of your feats!' by Elder Queen (LOL)




