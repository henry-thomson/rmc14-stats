roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  John 'Guardsman' Volp, Elise Tedrow, Ken Navlaan, Glorp Blorbleson, Saida 'HSV' Murkina, unknown, unknown, unknown, Ruby Mothman, Grumpy Tailsbury, Dom 'Mio' Martin, Timothy Eventide, Rickety Kryn, Izzy Cattington, Leonard 'Breacher' State, Naululi, Maze AW Falx, Levi 'bait', Yuipe Bij, Lesly Muggins, Goeldia Dispar.



  Medal Awards:

  Lance Corporal Jaden Flickinger is awarded the Medal of valor: 'Jaden rushed into the hive despite the overwhelming amount of xenos. Upon hearing their Colonel, commanding officer was captured, this did not make Jaden cower. Instead he rushed directly into the hive to cut the Colonel from weeds, moving to save many others. Let this be an example courage and heroism has rewards. Excellent work.


  Awarded by Colonel Sicilia Drakonovisch on 05/23/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



