roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Drazkit 'Onyx' Rift-Tongue, Brick 'Boot' Bronze, Albrecht Law, Cooper Wright, Seewul-Debameel, Derrick Ellis, Rowdy Felix.



  Royal Jelly Awards:

  Young Burrower (SEA-47) is awarded the Royal jelly of sabotage: 'Your work was not ignored, matter of fact, you did an absolute amazing job. Probably even the best from my point of perspective, you were able to turn freights, into a hell zone for yellow talls. You capture many talls with your amazing placement of traps. Not to mention, you gave the high an absolute great spot to put captures at that made it where I even ovi there myself. I am proud of you, it is ashame you did die, but the hive will always remember your work and dedication. May the Queen Mother guide you to the other side, Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (KRY-599) is awarded the Royal jelly of slaughter: 'For your excellent performance upon these feeble talls, killing, capturing, saving sisters. You were there, always was there from the beginning to end. You have ensured the hive was always standing strong, due to your survival, and ensuring the talls suffer because of your mere existance. You have also help wipe the blue talls with your sisters, that of which made an amazing impact upon our efforts in winning the battle. Once again, keep up the good work, and may the Queen Mother be watching over you! Rejoice!' by Prime Queen (PRO)




