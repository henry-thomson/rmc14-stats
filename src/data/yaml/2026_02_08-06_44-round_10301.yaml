roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Mike Spike, Dirk Brindle, Rex AW Saw.



  Royal Jelly Awards:

  Elder Carrier (EEP-548) is awarded the Royal jelly of proliferation: 'With your traps and guidance, the talls strongest push into botany was held low. Further more, your work and care with your sisters meant not tall was unaccounted for in our hive. Well done.' by Ancient Queen (HEK)

  Young Carrier (M-588-Y) is awarded the Royal jelly of proliferation: 'Your constant supply of eggs allowed our daughters to use their abilities beyond what they could have done individually. It is rare for one so young to receive such a Jelly in their caste, but you deserve it. I look forward to seeing more.' by Ancient Queen (HEK)

  Prime Praetorian (FLA-999) is awarded the Royal jelly of sabotage: 'For keeping the Tuber away from myself and my frontline,

  this is a act of sabotage rare for a preatorian to accomplish. But it was what lead to such amazing plays from all sides. Well done.' by Ancient Queen (HEK)

  Elder Lurker (DOK-615) is awarded the Royal jelly of slaughter: 'For your work leading the backlines. Although you did not live to see our victory, your leadership allowed us to have it. We will see you again in another hive, doing other great things.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
