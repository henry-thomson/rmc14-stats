roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Cure Elim, Emilia Rhodesion.



  Royal Jelly Awards:

  Prime Praetorian (FLA-526) is awarded the Royal jelly of slaughter: 'Each tall corpse was bait for your fishing skills, all was hooked on the bait that you used to alure the entire front to funnel into. During this small battle, you forced the talls to push forward into hiveweed territory to where you continously abuse this fact, by pulling each baited tall. The bodies were stacking, your fishing never stopping, you were a true oppressor to these talls, giving these talls depression. May I see more of your impressive abductions skills in future battles, and may you bring forth thriving hive because of your talent.


  Rejoice!' by Prime Queen (PRO)

  Elder Burrower (AID-645) is awarded the Royal jelly of sabotage: 'You were the great burrower of the battle field, disrupting the talls attempts to save or make great initiative for me to exploit, you were great help in ensuring that the talls suffered from each and every tremor you made. You were a great help during this battle, making flanks as well. I ensured to used your eyes to have a better grasp on the battle field thanks to you. May you bring forth future prosperity to the hive! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Iantha Atikson[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
