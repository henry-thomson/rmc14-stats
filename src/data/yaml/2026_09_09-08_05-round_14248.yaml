roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Conner Merryman, Kira Nuar, Yeo 'Sakura' Bunnia.



  Royal Jelly Awards:

  Mature Hivelord (BRK-365) is awarded the Royal jelly of resilience: 'Crafting our hive from the very start, this daughter has touched each and every corner of resin with her claws. Without her constant effort and dedication our hive would not have withstood the tall invasion. We look forward to seeing the hives you will craft! Rejoice!' by Prime Queen (ARG)

  Ancient Ravager (LOL-833) is awarded the Royal jelly of slaughter: 'Our most fearsome daughter, dragging countless talls to their doom. You waited, you bid your time until the talls overstepped. When the time came you cut them down in their scores. Talls have leared to fear the name LOL this day. Bravo!' by Prime Queen (ARG)

  Praetorian (NOX-803) is awarded the Royal jelly of sabotage: 'Stalling the tall ball with your hook and pull, you independently of mother, with no instruction held the talls from reaching critical areas. All that time you gave constant hivemind updates. Your information and skill were critical in today's battle. Rejoice!' by Prime Queen (ARG)

  Elder Drone (WIL-915) is awarded the Royal jelly of sabotage: 'Critical to our victory this day, our carrier WIL, working independently of mother was able to put fear into the hearts of the talls. She together with an oppressor was able to stall the tall invsion, holding critical areas in our control. Through the battle countless talls were secured and nested by your claw. May many more daughters be birthed by your skill. Rejoice!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Lilliths Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]SireHambone[/color]![/bold]
