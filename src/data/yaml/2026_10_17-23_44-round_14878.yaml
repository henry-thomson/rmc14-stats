roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rita Marie Dodginghorse, Jais 'Jazz' Ksaj, Paxton Sheets, Fenrisulfr AW Thumper, Fischer AW Foxhound, Aurora 'Birdcage' Barkheart, Darline 'Brat' Woods, Merlin Herald, Marz-Deekus.



  Royal Jelly Awards:

  Ancient Drone (POX-626) is awarded the Royal jelly of rejuvenation: 'On not one, but two seperate engagements, this daughter dove into the lines of the talls charging towards mother with a purpose. Giving her life for mine she saved me from certain death on one occasion. On the second she allowed us to push deep into the talls battle lines and secure the final wipe. Your skill and dedication has won this victory today. Bravo!' by Prime Queen (ARG)

  Mature Hivelord (BI-111-Y) is awarded the Royal jelly of sabotage: 'When mother called for a designer at the beginning of our hive, she did not expect a daughter of such young age to have such skill and wisdom. Dedicating herself to her craft, she has designed nearly every corner of our grand hive. During the corse of the invasion, she communicated constantly, moving from area to area to foritfy it. She called out tall positions and movements and avoided the bird all this time. Her survival is a testimony to her grit and determination. We look forward to seeing the hives you shall one day build! Rejoice!' by Prime Queen (ARG)

  Mature Hivelord (TA-485-ZO) is awarded the Royal jelly of sabotage: 'Working with our designer, this lord has touched every wall, door and weed in our hive. They communicated through the battle, calling in tall locations and asking for new build orders. Her resin in A-block and cargo were essential in trapping the talls in the final stages of the battle. May you go on building many a hive to come. Bravo!' by Prime Queen (ARG)

  Mature Praetorian (JE-643-R) is awarded the Royal jelly of resilience: 'From the very start of this hive you have been a major part of our success. Working with another oppressor, you have been a team the talls have feared. Without orders or instructions you moved to stall the tall advance and secured countless captures for the hive. When joined by mother your pulls enabled us to secure vital captures off the ball. Your skill and determination makes me believe that you already have the might of a prime within you. Bravo!' by Prime Queen (ARG)

  Mature Praetorian (LI-433-O) is awarded the Royal jelly of resilience: 'From the very start of this hive you have been a major part of our success. Working with another oppressor, you have been a team the talls have feared. Without orders or instructions you moved to stall the tall advance and secured countless captures for the hive. When joined by mother your pulls enabled us to secure vital captures off the ball. Your skill and determination makes me believe that you already have the might of a prime within you. Bravo!' by Prime Queen (ARG)




