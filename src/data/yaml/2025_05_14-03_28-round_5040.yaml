  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Andrei Ulmeyda.



  Medal Awards:

  Desmond 'Des' Coldsmith is awarded the Distinguished conduct medal: 'Desmond Coldsmith during the events of operation Exercise Thick-Claw was assigned to the infamous demolitionist duty. With their rocket launcher in hand, and a heart of steel in his chest, he slew a great many bugs today. 

  Most amazing of which, were two xenonid queens. I can say for certain that your rocket on the second xenonid queen in Lambda was the deciding factor for this entire operation.'

  Giovanni 'Esgio' Guess is awarded the Distinguished conduct medal: 'Guard duty. It is one of the most simple, oldest, but most important duties in all of military history. I am sure the time you spent waiting behind those barricades felt like an eternity, while it seems the rest of the corps was getting their hands bloody.


  To this act of self-sacrifice, I commend you. Being able to communicate with my marines is nothing I take for granted.'

  Hides-In-Lockers is awarded the Bronze heart medal: 'Hides-in-Lockers spent their final moments terrorizing the xenonid hive with their M5-ATL. Many a xenonid met their end, I have the highest of regrets that we were unable to save you. Though, not was all lost. Your M5-ATL was requisitioned by the Delta SADAR, and it was used to kill the second xenonid queen. It seems the weapon was infused with your killing spirit.


  The corps will feel the loss of such a talented individual for years to come.'





