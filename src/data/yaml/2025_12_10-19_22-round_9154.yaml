roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Clegan 'Kaboom' Schofield, Tristram Osset, Lockie B Foster, John Flint, Peter 'Parabellum' Cencer, Cheeky Pawswell, Marcas 'Lantern' Scott, Wesker Price, Daphne Nymphoiry, Tom Fooly, Kalakian, Jimothy Jollystain the 4th, Judith 'Jacket' Szymanski, Silver Misae, Ron 'Spitz' Purrman, Neizv-Estni'.



  Medal Awards:

  Juno 'Garnet' Eckart is awarded the Medal of valor: 'Repaired sensors, built the fortifications around it, and maintained their position against the attacks of an overwhelming foe multiple times. The information gathered due to this effort was pivotal to our victory.


  Awarded by Col. Scraps-the-Copper on 12/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





