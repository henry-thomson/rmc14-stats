roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Mortimer Lenard, Nate Walker, Krowie Tezari.



  Medal Awards:

  Corporal Roxanne Dreams is awarded the Distinguished conduct medal: 'For distinguished valour and performance as the Demolitionist Specialist of Charlie Squad. Corporal Dreams showed utter commitment to their duty and is personally responsible for the death of a Xenonid Queen. A shining example of bravery in the face of the enemy.


  Awarded by LtCol. Clyde McKinney on 23/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney



