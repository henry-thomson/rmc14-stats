  Awarded by LtCol. Clyde McKinney on 20/7/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





