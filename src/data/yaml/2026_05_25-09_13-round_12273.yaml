roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  E Meowsers.



  Royal Jelly Awards:

  Ancient Drone (SPX-685) is awarded the Royal jelly of proliferation: 'From the initial rush, the day your mind awakened, you guided yourself into a gardener’s proficiency in maintaining abundance, bountiful and full of alacrity bearing multiple fruits that fed the entire hive. You, the only gardener, became the backbone of the hive's structure, keeping our hive well-fed. And as much as it did, it in fact affected the battlefield itself, making the tall fear us.


  Well done, SPX. You deserve this.' by Elder Queen (SVI)

  Elder Hivelord (AKI-816) is awarded the Royal jelly of proliferation: 'You truly earned this, Jelly AKI. You were the only hivelord within our structure, as well as the sole builder. You complied, took initiative, and built across the vast lands of the planet constructing and reinforcing multiple layers of walls to keep the menace away and prolong our existence.


  You were excellent both as a frontliner and a backliner, building whenever the tall ones failed to keep watch. You are the sole reason we won this battle.


  You did amazing, AKI.' by Elder Queen (SVI)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



