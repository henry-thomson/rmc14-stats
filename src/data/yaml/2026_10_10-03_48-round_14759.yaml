roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Maddie Harper, Felix 'Cat' Phillips, Eva 'Athena' Vasilia, Miri Katiyam, Noel 'Scrap' Keener, Ryker Zola, Salvador Krieg, Zack Eventide, Freya Reiter, Granola 'Biggy' Foots, MagVard Sigurdson.



  Medal Awards:

  Corporal Freya Reiter is awarded the Distinguished conduct medal: 'For assisting greatly in the defense of the FOB and killing a xenonid queen, Corporal Reiter, is more than deserving of this award.  


  Continue to do the corps proud, Reiter.' by Major Danielle Sparks





