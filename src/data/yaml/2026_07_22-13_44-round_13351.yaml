roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rob 'Raven' Hammer, Reese Moki, Benjamin Bennett, Zoey 'Hex' Rikker, Luis 'Cowboy' Xarion, Ayin 'Shivers' Hallow.



  Medal Awards:

  Private First Class Zilu Meizhelan is awarded the Distinguished conduct medal: 'Private First Class Zilu Meizhelan showed significant initiative in our primary concern during any operation. That being the security of FOB both pre-emptive and otherwise. Singlehandedly they worked on significant eastern defenses catching an early incursion attempt by xenonids off guard and perhaps even resulting in a Xenonid Queen kill.


  Otherwise, they took significant initiative in clearing out the tunnels south-east of FOB, overall permitting Bravo and more relaxed time when it came to the security of the FOB and primary LZ. Carry on with this initiative marine, a good homefront allows a calm mind in CIC.


  Awarded by Maj. Kaitlin Zalack on 22/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





