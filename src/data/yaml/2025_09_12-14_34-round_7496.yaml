  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Hocus Pocus.



  Medal Awards:

  Rhys Hendricks is awarded the Distinguished conduct medal: 'For quick action in saving a fellow marine in distress, placing duty and the lives of others above all else. Their actions ensured the survival of a fellow soldier, and upheld the UNMC's highest standards.


  Awarded by LtCol. Freya Locke on 09/12/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Isabel is awarded the Distinguished conduct medal: 'For exceptional service as a synthetic, Isabel provided critical support through the operation. Her efforts today proved once more to the UNMC, that syntherics are invaluable.


  Awarded by LtCol. Freya Locke on 09/12/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





