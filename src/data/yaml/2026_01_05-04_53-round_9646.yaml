roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Roberto Andreas, Adam Nome Osman, Brix Alley, Jan Struan.



  Medal Awards:

  Desmond 'Des' Coldsmith is awarded the Distinguished conduct medal: 'For your assistance with your squad leader, organizing the communications relay hold, and defense of the FOB, I see it fit to commend your efforts. Great work today holding the line.


  Awarded by Col. Scraps-the-Copper on 1/4/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Leo Taggart is awarded the Distinguished conduct medal: 'Fire support requires a two man effort. An artillerist, or pilot, and a spotter. Nothing gets fired at without the two working in tandem - and the results showed today. Many bugs met their end to missiles from the sky.


  Awarded by Col. Scraps-the-Copper on 1/4/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juan Cortez is awarded the Distinguished conduct medal: 'For their consistent performance as CAS PO during this operation, as well as for the frankly ludicrous amount of timely, and accurate callouts that your communications allowed me to make. Good work as always.


  Awarded by Col. Scraps-the-Copper on 1/4/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ricky Fischer is awarded the Distinguished conduct medal: 'Per recommendation of the squad leader, for some great shots today as well as accurate and timely callouts. Information wins battles - how else are you supposed to know where to fire?


  Awarded by Col. Scraps-the-Copper on 1/4/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





