roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Lisha Brown.



  Royal Jelly Awards:

  Young Carrier (EM-403-C) is awarded the Royal jelly of rejuvenation: 'EMC, Today I watched you hatch many children for the talls to fall victim to. You brought many of our sisters back from the dead and allowed us to keep on thriving during even the darkest times. You alone brought these children and pushed us forward. Thank you EMC and Rejoice with this Jelly.


  See you in the next hive.' by Elder Queen (VCR)

  Ancient Praetorian (MIA-5) is awarded the Royal jelly of resilience: 'MIA, your skills with your form pranced through the talls like a dancer on ice, your skills making the talls head spin in full 360's was a sight to behold. Your confidence in my screams making many captures successful and bringing many talls to the feet of our hive. Thank you MIA and Rejoice with this Jelly.


  See you in the next hive.' by Elder Queen (VCR)




