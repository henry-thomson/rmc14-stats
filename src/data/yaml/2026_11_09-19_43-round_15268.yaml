roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Lance Corporal Manuel Miller is awarded the Medal of valor: 'Lance Corporal Manuel Miller and Private First Class Rinka Bunzumi, in an act of valor, fought against overwhelming odds, eliminating a team designed to kill marines. The two of them managed to kill three Ravagers and a Lurker in one single fight, sustaining exactly one casualty which was recovered. I salute you for your feat.


  Awarded by Maj. Hudson 'Hungry' Demuth on 09/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth

  Private First Class Rinka Bunzumi is awarded the Medal of valor: 'Lance Corporal Manuel Miller and Private First Class Rinka Bunzumi, in an act of valor, fought against overwhelming odds, eliminating a team designed to kill marines. The two of them managed to kill three Ravagers and a Lurker in one single fight, sustaining exactly one casualty which was recovered. I salute you for your feat.


  Awarded by Maj. Hudson 'Hungry' Demuth on 09/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth

  Corporal Ansgar Firebeard is awarded the Distinguished conduct medal: 'Corporal Ansgar Firebeard, the Charlie's designated Anti-Tank specialist, scored a crucial kill against the Xenonid Queen, which created the momentum required for us to eliminate 80% of the hive's tier 3s in one attack, essentially securing us the ability to win the operation at the pace we did.


  Awarded by Maj. Hudson 'Hungry' Demuth on 09/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





