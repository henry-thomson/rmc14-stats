roundEndText: >2-

  TO ACTIVE MEASURES UNIT 104 COMMAND ELEMENT

  SUBJ: “Shí Rén association”


  Despite interference from the UNMC, and several casualties predominantly from Active measures unit 189, This mission has been deemed a success.


  The UNMC has yet to publically note our presence in ostensibly imperial territory, our internal elements inbedded within their security apparatuses have been tasked with identifying the cause for their own presence in the area.


  New manpower will be folded into Active measures unit 104, and active measures unit 189 will have manpower subsituted from the now decomissioned active measures unit 57.


  END REPORT


  [color=seagreen]SPP MAJOR! [/color]


  In memoriam of our fallen soldiers:

  Anton 'Stitch' Chernetsky, Artyom 'Deceased' Kovalenko, Eris 'Hound' Greyseer.





