roundEndText: >2-

  After three hours, the Sun Riders built an FOB and got to put it to the test against a small CLF group that happened to be in the area.


  In this fighting, the Sun Riders sustained two casualties, and the CLF, two as well.


  The CLF will not be giving up another piece of their homeland without a fight, but when the time comes, there will be reinforcements waiting to meet theirs at the FOB.




