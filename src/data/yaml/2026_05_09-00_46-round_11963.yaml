  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ryuko 'Survivor' Solisa.



  Royal Jelly Awards:

  Ancient Ravager (AR-362-ES) is awarded the Royal jelly of resilience: 'When I got counter pushed by the talls at bar, you shielded me denying my death which was heavily appreciated. Thank you for helping also wipe talls at ablock, and at security. You show these talls that you were a true berserker! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (MA-865-G) is awarded the Royal jelly of proliferation: 'For leading your sisters, you help lead the areas to get rebuilt, were mostly ablock, hydroponic, and then eventually we got eye rebuilt a bit too.


  I thank you for pushing through even active combat zones that required building as well. Keep up the great work hivelord! Rejoice!' by Prime Queen (PRO)




