  Elder Praetorian (CL-231-O) is awarded the Royal jelly of resilience: 'You did an outstanding job on shielding me against the sky talls, when I got tuber at Corporate Executive Office, I was surely to die if you didn't do such a thing, and you help tremendously at that moment, I applaud your great effort in being a proper vanguard for the hive. Well done, also not to mention you also flung talls to get captured, during many occasions and that is also appreciated. I hope to see more of this in the future, Rejoice!' by Prime Queen (PRO)

