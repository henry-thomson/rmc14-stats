roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Olivia Croft, Adrian Carter, Vyshari 'Visi' Velmara, Aradin Thorund, Izzy Cattington, Zhyara Vaelora, Jesus Earl, Mizooki 'PillBug' Akiya, Mina Turner, Elijah Clarke, Etheryn 'Lampshade' Quincy, Zorya Morana, Hugo Knapenberger, Guy Snyder, Hugh Cosmos, Carry Ward, Paulie 'Conman' Zarroni, Ulric Steele, Vince Vale.



  Medal Awards:

  Corporal Cecilia 'Wraith' Wile is awarded the Distinguished conduct medal: 'Corporal Wile exhibited exceptional leadership as the Smart Gun Operator of Charlie Squad. Forced to take command during Operation Program Yellow-Eagle, their initiative and skill saved many lives while exterminating the Xenonid threat.


  Awarded by Maj. Clyde McKinney on 4/24/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Clyde McKinney





