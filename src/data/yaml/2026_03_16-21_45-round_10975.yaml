roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Juno 'Garnet' Eckart, Kala, Lillifen Hellalyl, Drakun Solvador, Matthew 'Skidmark' Fields, Kelvin 'Famine' Chauvin, Cera Watanabe, Elliot Richards.



  Royal Jelly Awards:

  Mature Lurker (XX-29) is awarded the Royal jelly of sabotage: 'Since the beginning, I did witness some of your evil slowing down talls for me catch up with the main horde to interact with them, you made couragous leaps that would decide your fate of success.


  I want to say that is the best way to be a lurker, and I am proud to see your work in action. I hope to see more of this, be always be brave when you have a hive behind you.


  Rejoice!' by Prime Queen (PRO)

  Prime Drone (ASH-485) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself in order for me to make a vital capture against a special tall, the tall lurker. North of Records, you gave me the choice to continue instead of letting go, because a heavy mounted spitter was taking me down as I was doing so. thank you for doing this, it was worth it sacrifice.' by Prime Queen (PRO)

  Mature Praetorian (XNO-352) is awarded the Royal jelly of resilience: 'Since the dawn of time of the hive. You were one of the valkyrie that stood firm against the endless march of the tall invasion.


  You saved many sisters in the art of combat, the fields drenched in acid and enemies. You have done countless rescues that I can't even count for. 


  You kept me in great shape and being watchful over me, during when I was war queening. After a current extent we were able to repel the talls from the eye tower, there was so many wonderful memories I wish I could recount.


  The only shame I have is not shielding you as you shielded me. May you be forever remembered in this new beginning chapter of a new hive...' by Prime Queen (PRO)

  Young Hivelord (HE-837-W) is awarded the Royal jelly of proliferation: 'You were one of our young eager builders of a hive, a new beginning!


  You built effortless resin left, resin right. No matter the area you remold it to your will of the hive, and that what matters.


  I thank you for putting your efforts in pushing forward through the endless march of the tall army, and making it where everyone has a placed they can call home. Thank you for helping the hive!


  Rejoice!' by Prime Queen (PRO)




