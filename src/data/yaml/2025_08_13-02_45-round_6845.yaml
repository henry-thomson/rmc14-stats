  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  unknown, Aponi Yoki, unknown.



  Royal Jelly Awards:

  Ancient Praetorian (ARG-373) is awarded the Royal jelly of proliferation: 'You are grace, you are elegance, you are a dancer of war. Your speed cannot be matched, and your deadly skill in the art of battle is unrivaled. Wherever I went, into both fire and frost, you went with me, attempting to capitalize and cap wherever you could. And you often times suceeded! Thanks you you, our hive swelled with countless more sisters, and for that, I give you this jelly of proliferation.' by Elder Queen (CMP)

  Prime Drone (BFF-693) is awarded the Royal jelly of rejuvenation: 'You my sister, have proven yourself truely worthy of the title "Master Gardener". Wherever i went, I could have expected a healing fruit, which was useful beyond reckoning. Several times I would have pershised without the fruits you provided, and the entire hive benifited from your labors. May you garden forever more!.' by Elder Queen (CMP)

  Prime Warrior (TA-782-NK) is awarded the Royal jelly of sabotage: 'Very often does the phrase "Sabotage" conicide with the line of the defender, but in this case it is more then fitting. You were the menace of the talls' backline this war, capping several halpless talls, boosting our ranks. But more then that, you saved KAI several times, allowing us to dominate the backline even more. Were it not for you, perhaps the talls' morale would have never been broken. For your efforts in striking talls in dark areas, i give you this jelly of sabotage' by Elder Queen (CMP)




