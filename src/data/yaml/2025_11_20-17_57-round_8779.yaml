roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Josephe Starloine, Bellatrix Yazhi, Drinks-the-Razorium, Maximus Soto, Eduardo Zoucks, Alice Coffinfill, Grimbo ''Husband'' Methodicus, Martin Nitram, Lilian Managan, Yeo 'Sakura' Bunnia, Taiga of Stoicism.



  Royal Jelly Awards:

  Prime Drone (ARL-38) is awarded the Royal jelly of rejuvenation: 'the sister to heal every single sister by hand. letting them fight on and being a huge key to victory.' by Elder Queen (REAL)

  Ancient Carrier (ZAO-953) is awarded the Royal jelly of sabotage: 'this sister was the greatest carrier i have ever seen with my eyes. infecting most of our captures winning us this fight... REJOICE!!!' by Elder Queen (REAL)

  Young Boiler (NOB-995) is awarded the Royal jelly of slaughter: 'Being a first born boilers, many sisters died over and over but she kept fighting until the end without dying even once. her boiles held back talls from even reaching caves, holding them all at dyna... REJOICE!!!' by Elder Queen (REAL)

  Young Praetorian (TV-199) is awarded the Royal jelly of proliferation: 'this sister was a first born valk. even tho they were a youngling they managed to save more sisters than i could capture. saving us a lot of work... REJOICE!!!!' by Elder Queen (REAL)

  Elder Hivelord (VY-719-N) is awarded the Royal jelly of resilience: 'this sisters was the main builders who kept rebuilding the open areas of DYNA. without them we would have been pushed to caves and likely perished. truly one of a kind... REJOICE!!!' by Elder Queen (REAL)




  [bold]Operation funded by [color=green]A CT that builds cades[/color]![/bold]



  [bold]Hive established by [color=purple]Ruby Hivey SIP.[/color]![/bold]
