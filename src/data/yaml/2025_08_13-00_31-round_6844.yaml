roundEndText: >2-

  [color=purple]The xenos hijacked a dropship[/color] [color=green]but were wiped out by the marines![/color]


  In memoriam of our fallen soldiers:

  The Ivy of Enrichment, Sierra Brooks, Marina 'Viper' Lame, Stabs-with-Thorn.



  Royal Jelly Awards:

  Elder Defender (MOG-266) is awarded the Royal jelly of resilience: 'You are the shield, you are the fortress. You are the mighty wall that talls shatter their bodies upon. You crest is unbreakable, and your resolve is unshakable. Sister MOG, in that grand fight at Aurora medical, your hardy crest provided an effective defense against the talls pushing. Delaying them to buy more time for an offense, disrupting them during the offense, and protecting vital drone sisters to ensure the fight kept going. For your contributions to the hive, I gift you this jelly. May your crest never waver.' by Immature Queen (CMP)

  Young Drone (SI-174-N) is awarded the Royal jelly of rejuvenation: 'You are our foundation, you are our grower, you are the gardener, spreader of the hard weeds and cultivater of our fruits. Your skills are unmatched, and your instinct is unrivaled. For your efforts in supply critical healing and shield fruits to our sisters during the Aurora Medical fight that enabled other sisters to keep on fighting, I grant you this jelly. May you garden on hives forevermore!' by Elder Queen (CMP)

  Young Drone (SI-174-N) is awarded the Royal jelly of rejuvenation: 'You are our savior, our guardian angel, "they who will not stand as sisters die". Your skills in the art of care and heal during the dangerous and desisive Aurora Medical showdown enabled other sisters to fight near constantly. You also remained safe, spreading weeds when needed, and ensuring that our sisters would always be able to fight at peak form. For your services to our hive, I give you this jelly. May no sister ever die under your care!' by Elder Queen (CMP)

  Prime Ravager (PRO-129) is awarded the Royal jelly of slaughter: 'You, you are the fang, you are the butcher, you are that which kills until there is none left to be killed. Your claws are sharp, your power unmatched, and your instincts as fine as metal. You led the charge at the Aurora Medical Battle, killing almost, if not, the entire skytall frontline force, forcing the talls to retreat in what otherwise would have been a hopless situation. For your skills in leading our sisters, and the wholesale massacre of the skytalls, I give you this jelly of Slaughter.' by Elder Queen (CMP)




  [bold]Operation funded by [color=green]Osborn Curry's majestic hair.[/color]![/bold]



  [bold]Hive established by [color=purple]Tall Slushies LTD[/color]![/bold]
