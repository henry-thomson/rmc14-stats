  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Aelica Danara, Dahlia Droop, Bjornsonn Thungsteel, Gleep Glorp, Rubicon, Crystal Price, Screams-At-Bugs, Fritz AW Dagger, Don Osmont, Volt Rosepurple, Hexura  Terantula, Beekus-Beem, Sly Buunero, Snicket Sharp-Claw, Emera Pitonpounder, Ezra Logos, Preston A Count, Expie, Zilu Qiu, Jaclyn  Johnson, Michael 'Mikey' McGoggins, Alex 'Lightning' White, Dell 'Terra' Dellitrasse, The Blossom of Enervation, Bingy Faeheart, Racc N'Bin, Chilwir 'Chilli' Drumarz.



  Medal Awards:

  Second Lieutenant Ardy 'Ape Man' Guy is awarded the Bronze heart medal: '2nd Lieutenant Ardy 'Ape Man' Guy Gave his life for this operation to be completed. At the recomendation of the ASO they gathered most of the intel for this operation allowing it to be a success. They did their duty to the fullest extent. They will be remembered for their actions.' by Major Sicilia 'Rose' Drakonovisch





