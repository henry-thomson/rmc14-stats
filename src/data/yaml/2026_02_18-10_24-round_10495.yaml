roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Kaela 'Frostbite' Korrin, Nicholas Cressman, Ermintrude Stewart, Shazira Xyvara, Andre 'Gambler' Stepanenko, Dives-the-Caves, Harry Moreau, Glub, Polishes-the-Boots, Etheryn 'Lampshade' Quincy, Emiko AW Kaiten, Harmony Holt, Nora Vera, Buck 'Greed' Tern, Ash Lightweaver, Nato Ach-Menoe.



  Royal Jelly Awards:

  Mature Boiler (HY-414-P) is awarded the Royal jelly of slaughter: 'Thanks to your efforts today, the hive is victorious!!

  Without YOU, we wouldnt have been able to hold the tall menace. You were essential at destroying the last effort of the talls, that lead to their pitiful demise.

  Thank you, for being part of this hive.

  With love, LAG' by Elder Queen (LAG)

  Ancient Carrier (EEP-247) is awarded the Royal jelly of sabotage: 'You were the reason why the talls started fumble. Without your billion traps, this hive would be half the size it is. You where both essential at removing talls, while also giving our hive more sisters.

  Thank you. You are the best carrier I have ever seen.

  With love, LAG' by Elder Queen (LAG)

  Young Carrier (CA-951-N) is awarded the Royal jelly of proliferation: 'Thanks to your help, we were able to get many captures, that without you, would have been lost. Your work in the hive will not be forgotten.

  The hive thanks you for everything you have done to it.

  With much love, LAG.' by Elder Queen (LAG)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Rubylord SIP.[/color]![/bold]
