roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Apollyon Wills, Moss-Boy, Nithcraal 'Firebat' Enoki, Nezoli 'Widowmaker' Sharpfeather, Adzi 'Alcoholic' Marz.



  Royal Jelly Awards:

  Mature Drone (AS-731-S) is awarded the Royal jelly of resilience: 'My dear young drone daughter ASS

  I have decided to give you this jelly of resilience for blocking the spit from firing at me even though you were a drone

  Blocking the spit has allowed me to gib the tuber almost immiedately at the start of the tall invasion, you should know that i am proud for your effort and this is why i give it to you but.. please dont block spit as a squishy caste

  With Love

  -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Prime Praetorian (DE-341-AD) is awarded the Royal jelly of sabotage: 'My dear prime daughter DEAD, even though youve mindlagged onto the bird and sadly left us I have decided to award you this jelly of sabotage for your early capture of flamewalker, alongside your of course precise tail seizes, your support as an oppressor was amazing this fight I am really glad for having you with us today

  With Love

  -- Ancient Queen SQSH' by Ancient Queen (SQSH)




