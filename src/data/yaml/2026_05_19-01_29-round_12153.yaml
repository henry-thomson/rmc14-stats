roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Blanka 'Disater' Zuan, Zyrvana Zailora, Hugo Guess.



  Medal Awards:

  Lance Corporal Carlos 'Helsing' Santiago is awarded the Medal of valor: 'Carlos held lower engi south hall to the very last bullet. He fought with honor and held back the horde as long as he could. He will be remebered for his deeds.


  Awarded by LtCol. Sicilia Drakonovisch on 05/18/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch



  Royal Jelly Awards:

  Prime Hivelord (WI-520-LO) is awarded the Royal jelly of proliferation: 'No matter the danger... you kept going, you kept building through all these sacred lands. Showing the way of true art and that is building walls after walls. It doesn't matter how many of your work has fallen, you kept doing what you meant to do for the hive. I thank you for pushing through and putting work as much as you did.


  Rejoice!' by Prime Queen (PRO)

  Young Drone (GU-97) is awarded the Royal jelly of rejuvenation: 'You were a true gardener, you blossom under the harshest environments. You believe in the gift of growing help to your sisters, and push through multiple engagements. You strategically set up gardens that were able to be utilized by the hive at critical moments. Remember young one, believe in your carapace. You did beautiful.


  Rejoice!' by Prime Queen (PRO)

  Mature Carrier (IL-952-S) is awarded the Royal jelly of proliferation: 'You carry the children through all the lands, and the gift that you bestow was amazing, you made sure the talls were all put nicely to asleep. I implore the fact you were there to help make captures easier, the transition it could of been would been dangerous for the hive if you weren't there. rejoice!' by Prime Queen (PRO)




