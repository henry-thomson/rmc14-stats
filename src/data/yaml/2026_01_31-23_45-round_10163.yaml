roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Clegan 'Kaboom' Schofield, Alden Reade.



  Royal Jelly Awards:

  Prime Praetorian (YA-425-PS) is awarded the Royal jelly of proliferation: 'Our last surviving Dancer. This daughter of mine dragged many a tall to there doom. There captures go uncounted. The dispare they have caused the talls, immeasurable. On several occasions this sister also recovered escaping captures, proving that no tall can escape a dancers grasp. Bravo!' by Ancient Queen (ARG)

  Prime Hivelord (ZAO-63) is awarded the Royal jelly of sabotage: 'Without instruction as one of our many lords this daughter sealed in the tall invasion. Due to there thick resin and quick thinking the talls were wiped. Completely defeated. Your walls stand as a testiment to your success. Bravo!!' by Ancient Queen (ARG)

  Mature Hivelord (DV-58) is awarded the Royal jelly of sabotage: 'This daughter held countless talls in place at south hivemind through there siege resin. Without there contribution to the hive, we would not have found success this day. There commitment to building has been with us from the start. One day we all hope to craft resin so strong. Bravo!' by Ancient Queen (ARG)

  Prime Praetorian (FLA-509) is awarded the Royal jelly of slaughter: 'This daughter distinguished herself on the frontlines. Without her support the victory today would not have been achieved. I cannot count the number of talls that fell to your tail. Most importantly you secured the dreaded tall tuber, removing them from the battle. You put yourself on the line for the hive. Bravo!' by Ancient Queen (ARG)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
