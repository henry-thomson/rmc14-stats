roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Noyei 'Surfer' Teeba, Marisol Garden, Ash Lightweaver, Runo, Khousuni, Darin Semenov, Cook Justin, Fruhl Stargazer, Septic 'Tank' George, Mapple, Bradley Smith, Atlas Bootes, Addyson 'Fortuna' Zappy, Leo 'Snow' Lexis, Sebastian Colina, Tinker 'Blue' Cheese, Chunk Luger, Beaky Faust, Ron 'Fluffy' Paxton.



  Medal Awards:

  Gunnery Sergeant Jeff Dots is awarded the Bronze heart medal: 'Gunnery Sergeant Jeff Dots fought valiantly in operation Recon 431st-Strike. He gave his life to defend many as I witnessed and had the strategic mind to know what to do. Keeping squad cohesion and their squad together he was pivtol in this operation. Unfortunately he did not live to see this medal. May he rest in peace.


  Awarded by LtCol. Sicilia Drakonovisch on 05/17/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch

  Corporal Jesse 'Cowboy' Morgan is awarded the Medal of valor: 'Corporal Jesse 'Cowboy' Morgan during operation Recon 431st-Strike fired many bullets and suppressed the defender swarm of xenos. Without your efforts I believe we wouldnt have gone as far as we did. You stayed by my side to the very end and held the line. Your efforts secured several xeno kills and saved lives. Your life will never be forgotten. Rest in peace.


  Awarded by LtCol. Sicilia Drakonovisch on 05/17/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





