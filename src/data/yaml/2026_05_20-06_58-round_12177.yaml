roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jimmy Crockett, Jei-Am.



  Royal Jelly Awards:

  Mature Hivelord (WL-67-F) is awarded the Royal jelly of proliferation: 'For your tireless work on the build team, allowing our hive to constantly surroned the tall position. Particularly, allowing us to hold core for a prolonged period of time. It is not a easy thing to lead, much less so in the complex work of making a nest. Thank you.' by Prime Queen (HEK)

  Young Drone (TX-689) is awarded the Royal jelly of rejuvenation: 'You have been commended by the entire hive for your healing efforts, for one being so young, this is a astounding achievement. I cannot wait to see your work in the future of our great hivemind, and I hope this jelly inspires you to continue the work you have done today.


  Particularly, your healing allowed us to make those devastating charges in open space, which was a sight to behold.' by Prime Queen (HEK)

  Elder Ravager (XR-726) is awarded the Royal jelly of slaughter: 'For your work leading the hell charge against the blue crest and our final push. Without your ruthless efficiency we would have been dead in the water. Well done.' by Prime Queen (HEK)




