roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Hivelord (YA-701-P) is awarded the Royal jelly of resilience: 'Our incredibly capable sister YAP played a vital role in terrorizing the talls, although this award belongs partially to the rest of the lords as well. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Ancient Queen (LIMA)

  Mature Drone (LU-69) is awarded the Royal jelly of rejuvenation: 'Sister LU was just outright a master of her craft! She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. Talls pushed us, and LU said no thank you not on my watch. In an instand the whole hive was splitting the talls apart, limb by limb. Praised be the queen mother, all future wars will be won with her by our side!' by Ancient Queen (LIMA)

  Young Carrier (EH-166-EH) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, we are most grateful to sister EHEH! She managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war as a single carrier, she was a partial mother to the rest of the hive. Oh how we becon EHEH to help the further hive expansion! May her children are plenty!' by Ancient Queen (LIMA)

  Elder Burrower (MZ-410-L) is awarded the Royal jelly of sabotage: 'It is beyond my understanding how MZL is so supremely fast on the rushes. The whole war started off with MZL dominating the planet talls, and it ended utterlly identically, dominating the sky talls! Even if the talls were able to push past the perch, MZL was on top of their game, complely walking on the edge of danger and slaugher, but staying alive at all times!' by Ancient Queen (LIMA)

  Young Boiler (IN-648-A) is awarded the Royal jelly of slaughter: 'Although somewhat shared with other boilers INA did pristine job coving all her sisters pushes. Her acid took apart EVERYTHING! The tall resin, the flares, even the talls themselves! Always alive, always pressuring, always pushing! I can only imagine what talls must have gone through seeing yet another boil coming at them. The panic, the terror, the despair! If only you could bless us with your presence once again!' by Ancient Queen (LIMA)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of fresh Froots[/color]![/bold]
