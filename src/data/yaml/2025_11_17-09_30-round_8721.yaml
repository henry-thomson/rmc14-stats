roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Samiya 'Sandwich' Najjar, Reese Day, unknown, Hosea Wang, Julianne Eckhard, Kelvin Chauvin.



  Royal Jelly Awards:

  Elder Ravager (LOL-377) is awarded the Royal jelly of resilience: 'I bestow the jelly of resilience to this sister after her incredible ability to adapt to any situations, surviving until the end and being a major asset that contributed to the hive's victory, they kept the morale high and the captures even higher and I believe that without them victory wouldn't have been possible.. REJOICE!!!' by Elder Queen (NEY)

  Mature Hivelord (RI-184-K) is awarded the Royal jelly of proliferation: 'I give this daughter of mine the jelly of proliferation, she has built the hive since the beginning and was in fact one of the only one to build at all and without them this victory would have not been possible at all especially at the hivecore, she also allowed us to find a good flank and get around 7 captures from the yellow caste. REJOICE!!!' by Elder Queen (NEY)




  [bold]Operation funded by [color=green]Arcturus's Additional Pylons[/color]![/bold]



  [bold]Hive established by [color=purple]Weston-Yamada[/color]![/bold]
