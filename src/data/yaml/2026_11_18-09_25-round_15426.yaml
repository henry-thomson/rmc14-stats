roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Haiden 'Fool' Pycroft, Mikhael Groznov.



  Royal Jelly Awards:

  Mature Runner (MIN-830) is awarded the Royal jelly of proliferation: 'MIN, Without your efforts today it would of been a loss for sure. However due to your efforts as a dancer always managing to get captures off my scream and neuros no matter how bad they were, We came out victorious. 


  For that, you get the royal jelly of proliferation. Rejoice for i hope your dancing is just as good for many hives to come.' by Elder Queen (NSKO)

  Elder Praetorian (BW-140) is awarded the Royal jelly of rejuvenation: 'BW, today you have proven you are talented beyond your age. You were always there when both i and the daughers needed it, saving many. Your efforts also managed to bring us many many captures as you prevented the talls from recovering. 


  For that, you get the royal jelly of rejuvination. Rejoice! for i hope to see your talent shine for many hives to come.' by Elder Queen (NSKO)




  [bold]Operation funded by [color=green]There is no war in Roundy Marines[/color]![/bold]



  [bold]Hive established by [color=purple]Lilliths Xenonid Research Division[/color]![/bold]
