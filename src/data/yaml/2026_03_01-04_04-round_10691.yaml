roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Danny 'Ketchup' Heinz.



  Royal Jelly Awards:

  Young Defender (BO-350-A) is awarded the Royal jelly of rejuvenation: 'BOA was a healer that sacrificed for me in my fakeout Queen death. They didn't return, so i award their old body that was a defender.


  Rejoice my daughter! Thanks to you, we have won!!' by Ancient Queen (RP)

  Young Drone (KA-177-T) is awarded the Royal jelly of rejuvenation: 'KAT was my royal healer and valk which saved me multiple times, especially at the last wipes.


  Rejoice my daughter!! May your support keep eternal and helping hive.' by Ancient Queen (RP)

  Elder Ravager (LUA-412) is awarded the Royal jelly of slaughter: 'LUA was the ravager who helped to do the last wipes and kill all talls, being my loyal knight who stood by my side everytime.


  Rejoice my daughter!! May your wipes be eternal!!' by Ancient Queen (RP)

  Young Hivelord (PO-916-N) is awarded the Royal jelly of resilience: 'PON was our young designer hivelord who were building since the beginning.


  My dear daughter.

  You drained so much plasma from me that i think my organs are even failing.

  Rejoice, for you build like no other.' by Ancient Queen (RP)




  [bold]Operation funded by [color=green]Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
