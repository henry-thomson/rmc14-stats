roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Kylee Wible, Robert Richardson, Bence Peckler, Ko, Addyson 'Fortuna' Zappy, Jim Hammler, Xerces 'Evil' Erson.



  Royal Jelly Awards:

  Elder Ravager (LU-682-AN) is awarded the Royal jelly of slaughter: 'LUAN, you have done examplary work out there. You helped capture, kill and demoralize the talls at every turn. Although we couldn't raid the perch like you wanted, your efforts have helped bring this hive to where we are now.


  For your great work, I award you this jelly of slaughter. Amazing work, I am proud.


  See you in the next hive!' by Elder Queen (NEV)

  Mature Carrier (LR-917-N) is awarded the Royal jelly of proliferation: 'LR-N, We need more carriers like you in our hives. Although it might seem like simple work, few sisters want to be the carrier sister. Despite this, they are essential to our hives, and you are a prime example of this, helping in the capture of many talls through your efforts.


  For this, I have decided to award you this jelly of proliferation. Keep at it!


  See you in the next hive!' by Elder Queen (NEV)




