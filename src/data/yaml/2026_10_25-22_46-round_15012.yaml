roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rhea Hale, Chews-the-Wires, Aeizori-Mei Kaeirosae, Fae Ritty, Valery AW Akula, Mordrare Petrro, Cristopher Ratcliff, Petra 'Meow Meow' York, Alexis 'Concord' Mayfield, unknown, unknown, Larry dea-Pain, Cory Desmond.



  Medal Awards:

  Gunnery Sergeant Hydie AW Steyr-Hahn is awarded the Medal of exceptional heroism: 'Gunnery Sergeant Steyr-Hahn you and your squad is what made this fight even possibe. The last remaining frontline SL you carried the wieght of pushing nearly everywhere on this planet. You made the calls that were needed in the field and kept Alpha as the strike force we needed. I dare say you were one of the pillars needed for us this operation.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Second Lieutenant Derick 'Naptime' Hunt is awarded the Distinguished conduct medal: 'Lieutenant Hunt you were one of the pillars that kept this operation together. You scored kill after kill on any target that dare to enter your vision. Without you we wouldn't have ever managed as much as we did today.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Lance Corporal Eva Praskovia is awarded the Distinguished conduct medal: 'Lance Corporal Praskovia you were last surviving frontline Medic you had a the task keeping all marines alive and you indeed did that. Through a hellish battle you kept my Falcons soaring high and for that I thank you.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Sergeant Stu 'Stew' Lizo is awarded the Bronze heart medal: 'Sergeant Lizo your tragic death in the end is one my Falcons will feel for decades to come. You scored the early kill upon the Queen that allowed us to surge forward. You were a pillar of this battle and one I sadly have lost.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight

  Gunnery Sergeant Silent Monty is awarded the Medal of valor: 'Gunnery Sergeant Monty you and your Bravos held against constant assaults trying to break you. Yet against it all you did not break, you repulse every attack made against you and held it strong. You were the center pillar to this operation, holding the FOB and prevent none to enter.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 10/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight



  Royal Jelly Awards:

  Ancient Hivelord (HPI-528) is awarded the Royal jelly of proliferation: 'HPI, you went above and beyond my expectations as leader of the build team. Cities of resin were formed in your wake, and your leadership and cohesion of the build team was some of the best seen in a while. 


  Were it not for you and your efforts in the build team, the hive might have been lost sooner. Well done!' by Ancient Queen (CMP)

  Mature Hivelord (TR-65) is awarded the Royal jelly of proliferation: 'From what I saw, you did excellently as a hivelord. As a member of the build team, you couldn't have done better. I am writing this under a time constraint, but know you preformed beyond the call of duty.


  Well done and rejoice!' by Ancient Queen (CMP)




