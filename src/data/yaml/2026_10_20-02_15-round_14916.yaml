roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Precious Breakman.



  Royal Jelly Awards:

  Mature Boiler (BL-132-D) is awarded the Royal jelly of slaughter: '"Are you sure that you can prevail in such a fragile body of yours? Are you aware of your existence, and the consequences of the dot?"


  I have been aware of your existence since the dawn of time. We struck through a hellish birdscape to wipe the tall with our own tall. We went through countless hardships. My emotions, my view of the warfare- I knew it was over.


  But it never was, to begin with. We won the battle due to your courage and bravery throughout the war against the tall. It was sickening and long. It prevailed through my tears, as if the sky was blooming upon you, and as if I were going to shatter into a million pieces.


  But you prevailed until the end of the battle, victorious.


  Thank you.' by Ancient Queen (SVI)




