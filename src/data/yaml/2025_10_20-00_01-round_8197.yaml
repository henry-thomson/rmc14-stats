roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Argy Navus, Isabelle 'Tezzla' Ali, David Dorf, Minji 'Failsafe' Kilgrim, Manuel Miller, Lance Freedom, Archibald Garcia, Eddie 'Suppressing Fire' Mcfall, Cyril 'Frenchie' De Villiers, Harnold Herb, Paulie 'Conman' Zarroni, Byrne Keener, Tatiana Zaychikova, Homer Baker, Jade Ware, Vistha-Deed.



  Medal Awards:

  Eisenhorn 'Bug-Eater' Sedunn is awarded the Distinguished conduct medal: 'Great work taking co-leadership of Alpha squad today. Myself, and your SL, certainly noticed your efforts to coordinate Alpha and make them a more effective fighting force, ensuring that our victory was on schedule.


  Awarded by Col. Scraps-the-Copper on 10/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Arnold 'Fiend' Friend is awarded the Distinguished conduct medal: 'Excellent work with as one of our demolitionist specialists today. If rank does not deceive, it is understood that you are newer to the field - yet you performed up to our expectations.

  Keep giving us consistent results, and your enlisted career is destined for the stars.


  Awarded by Col. Scraps-the-Copper on 10/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



