roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Garnett Doll, Nades-The-Cades, Glup 'The Ooze' Zarethis, Tali Naako, Chuck Strand.



  Medal Awards:

  Lance Corporal Wolfgang Hartmann is awarded the Distinguished conduct medal: 'Wolfgang Hartmann. For your courage and putting yourself in harms way you went far for this operation and to save lives. At the very start of the operation you heard the call. You moved east and secured the CO down on the ground. This prompt, and decisive decieve action saved their life so they may continue their service to our nation. Your valiant deeds are recognized and we are forever in your debt. If only more marines were brave as you are.' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





