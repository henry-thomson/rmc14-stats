roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nick Laine, Khan Yesoph Westoros, Roland Orlando, Zixxaeq Keqxuq, Kaleb Randolph.



  Royal Jelly Awards:

  Young Drone (XX-974) is awarded the Royal jelly of proliferation: 'While young, this daughter showed no fear, no mercy. They healed while enduring many spits, even saving my life at one point, and for this, I deeply thank them.' by Prime Queen (GIB)

  Ancient Praetorian (DUM-240) is awarded the Royal jelly of proliferation: 'This daughter was the last one of the tier threes to live, catching many hosts in their hooks and sowing fear in the hosts minds. Their work here today was incredible, and I hope they will treasure this jelly.' by Prime Queen (GIB)

  Prime Drone (ORB-244) is awarded the Royal jelly of rejuvenation: 'This healer drone, saw me dying on the ground, writhing in pain, and they rushed to my aid, sacrificing their body and saving my life. Incredible work daughter.' by Prime Queen (GIB)

  Prime Carrier (MIU-282) is awarded the Royal jelly of sabotage: 'This carrier made many traps which in the talls fell and got hugged by our children, making new daughters for me and growing the hive. Their work has not been unnoticed, and they even grew out of their ancient shell, reaching their prime.' by Prime Queen (GIB)

  Young Defender (AF-656) is awarded the Royal jelly of resilience: 'This daughter resiliently built many walls to take cover behind, showing that they have a will to protect her sisters. Good work!' by Prime Queen (GIB)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
