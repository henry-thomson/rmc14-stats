  Elder Defender (LES-543) is awarded the Royal jelly of resilience: 'You are given the jelly of resilience, for your couragous act of shielding and foritfying to prevent the talls from saving said tuber. You are an excellent defender and I hope to see more of that. You have proven your worth for the hive. Well done!' by Prime Queen (PRO)

  Mature Hivelord (KI-6-M) is awarded the Royal jelly of proliferation: 'For your excellent performance in building for the hive, you have ensured the defense was always high and mighty. You have not done much for the hive in terms of combat, but your building were more essential than anything else. Great job upon building botany, garden, and east perch nicely done. Rejoice!' by Prime Queen (PRO)




