roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Thales 'Careless' Antares, Danielle Sparks, Aristu Nivalia, Adriana 'Twin' Ann, Choomba, Teagan McDonald, Isabella Owen.



  Royal Jelly Awards:

  Mature Hivelord (RI-460-SK) is awarded the Royal jelly of resilience: 'Today RISK, you have pathed the way to the hive with your resin. Your mind alone built the patterns and map to our victory againts the talls, making them traverse through a mansion of resin. So I reward you this Jelly, my first Jelly to remember this day FOREVER. REJOICE RISK!!


  See you in the next hive.' by Elder Queen (VCR)

  Elder Hivelord (FAE-352) is awarded the Royal jelly of rejuvenation: 'FAE, today you alone harnessed your resin to build magnificant towers, your resin alone reinforced the our young and pushed away the talls from approaching our sisters. Your resin alone did this today, to remember this event I award you this Jelly as you did amazing. REJOICE!!


  See you in the next hive.' by Elder Queen (VCR)




