roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Dell 'Terra' Dellitrasse, Brenna Rifler.



  Royal Jelly Awards:

  Prime Praetorian (ARG-614) is awarded the Royal jelly of resilience: 'In the most dire moments of the hive, they gave guidance and assistance in many ways possible, be it through words, or through actions. As well as helping myself to improve through this battle, and for that, I thank you ARG, as if it wasn't for you, the hive might of seen it's most dark moments ever.


  Coming from the dead, even after leading and aiding the hive as a Valkyrie, you deserve this jelly of resiliance as one of the most valuable and wise members of this hive. May you guide other hives to this same outcome we've come today. Rejoice!' by Elder Queen (NC)

  Ancient Ravager (BOG-787) is awarded the Royal jelly of slaughter: 'From a hard fought fight, and the path this hive took, you were there at the start of one of the most glorious moments in this hive, slashing claws and tail, jaws and spines, with your immense fury, slowly draining the talls from their healers, their flame spitter which you did not fear from at all. Even when it is one of your major weaknesses.


  Most important of all, you were there to thrive and stand on top of the many bodies you had created, surviving this encounter and showing off the greatness of a True Berserker to your many sisters. Rejoice!' by Elder Queen (NC)

  Prime Praetorian (ZAI-760) is awarded the Royal jelly of proliferation: 'Your time wasn't long in the hive, yet you put so much work and heart into it, so much precision and experience, pulling talls into eggs from one moment to another, using the best chances that you were given and slowly draining the talls from the numbers while adding more to the hive.


  May many sisters learn from you and the patience at which you hooked tall by tall, one by one non-stop. Rejoice!!' by Elder Queen (NC)

  Prime Praetorian (ZAI-760) is awarded the Royal jelly of proliferation: 'Throughout the path the hive took, you aided your sisters in always having some kind of available cover even in bad moments, making sure to always be there and survive to aid more of your sisters, even saving my life in many occasions along the help of your sister OOO.


  May you thrive and help many hives in surviving and aiding as you did so today. Rejoice!!' by Elder Queen (NC)

  Elder Hivelord (OO-941-O) is awarded the Royal jelly of proliferation: 'You aided your sisters in always having some kind of available cover even in bad moments, making sure to always be there and survive to aid more of your sisters, even saving my life in many occasions along the help of your sister JAD.


  May you thrive and aid as many sisters as you did so today, though not only that, as you have led the build team in an exceptional way today. Rejoice!!' by Elder Queen (NC)




