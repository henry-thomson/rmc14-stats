roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Takami, Caelestis Meador, Bence Peckler, Papa 'Buckshot' Pearsall, Naaono, Ara 'Mower' Silica, Skoros Silktongue, Bailey Warren.



  Royal Jelly Awards:

  Young Drone (XX-756) is awarded the Royal jelly of resilience: 'Though dying early on, you came back strong as ever. Your resilience is a testament to all- the hive is, and will always be, eternal.


  You provided building and weeds where and when it was needed the most, thank you.' by Prime Queen (HEK)

  Mature Drone (PL-414-A) is awarded the Royal jelly of resilience: 'Your efforts were noticed, one of the few original daughters remaining. Your fruits and healing saved many of your sisters lives.


  I am sorry you had to see such destruction of the hive, but due to your efforts- their deaths will not have to be in vain. Our hive has grown, and it has overcome thanks to your support.


  Well done.' by Prime Queen (HEK)

  Young Hivelord (FA-342-T) is awarded the Royal jelly of resilience: 'Nominated by your sisters, and noticed by myself.


  Your buildings came in a time where almost half of the colony was flattened. I truly believe, had we not had your buildings. We would have been strong armed and ran down.


  Thank you, this victory is very much thanks to your efforts.' by Prime Queen (HEK)

