roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Michael Barnes, Ace Silktongue, Konian Siennawing, Kekolas Zaun, Crafty Ren, Keli Fooly, Kane Nordenfelt, Ocean Rain, Cali Boyer, Tar-On, Spike MacLagan, Randy 'Raghetti' Rodrigues, Sudie-Mim, Leon 'Vinci' Buchanan, Blake 'Bark' Barker, Oswald Faux, Buzz Fibres.



  Royal Jelly Awards:

  Young Defender (HR-219-V) is awarded the Royal jelly of proliferation: 'For capping talls in metal hive when we are winning in the groundside, you are a legend for doing it and surviving. keep it up!' by Ancient Queen (REN)

  Elder Ravager (URR-605) is awarded the Royal jelly of slaughter: 'When the talls came and brought their skypits, skyfires, and spitters, URR showed them what true slaughter means. During the brief hive collapse, URR survived and gave us enough time to capture other talls while URR fought off those who tried to interfere with the captures, essentially killing them. Keep it up!' by Ancient Queen (REN)

  Young Praetorian (NEY-936) is awarded the Royal jelly of rejuvenation: 'With her carapace and claws, NEY prevented the deaths of her sisters. Using her roar, she saved me and several other sisters from a total hive collapse multiple times, essentially helping them in the final battle against the talls at the eye tower. Keep it up!' by Ancient Queen (REN)




