roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Clyde Caelus, Yeo 'Sakura' Bunnia, Mike 'GC' Mueller, Ashe 'Scramble' Collins, Olivia 'Livvy' Croft, Kevin Clarke, Jett Gum, Kara 'Lifeline' Greenland, Alkash Narkamaninov, Daria Kaards, Nikki Kane, Drew Pycroft, Glub, Hethryn Cliffton, Chelly 'Smokie' Yong, Rano, Lucy 'Pride' Dreamchaser, Hoopoe 'Greenie' Quetzel, Vivian Asterius Magnus, Klaus, Nora 'Soviet' Kuznetzova, Heko, Omar Bickerson, Seth Xi, Lorde Roadman, Lockie 'Venator' Demuth, Mi Dan, Able Howlett, Jesse 'Robot' Willy, Cybele McLeod, Zenari 'Mad Hatter' Morgan, Keith Stohl, Goeldia Walckenaerius, Joseph Blackburn, Jak 'Boot' Quinn, Butch Ratcliff.



  Royal Jelly Awards:

  Mature Carrier (VAN-877) is awarded the Royal jelly of sabotage: 'What has consipered during this war will be etched into the our kinds history! I do not think it is possible to describe the humiliation and utter terror talls felt the moment they reached our sandy caves. VAN proved her might as the embodiement of a resilience by staying alive through the whole massacre, and as the future nesting mother by seeing new and better life into the talls. No matter how many talls pushed deep in VAN had her eggs ready, and talls were hugged one after another, to the point where we could not keep up with captures, and had to kill some ourselves. I am sincerely in disbeliefe how it was still possible to keep the egg flow going. VAN shall be a new hope for the future hives!' by Ancient Queen (LIMA)

  Young Hivelord (VM-996) is awarded the Royal jelly of resilience: 'Our incredibly capable sister VM played a vital role in terrorizing the talls. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive.  It was with her talents that we kept holding the never ending waves of talls, which VM stopped with her major determination. We hope to see our sister waste the talls in the future hives as well!' by Ancient Queen (LIMA)

  Young Burrower (RB-481-Y) is awarded the Royal jelly of sabotage: 'RBY work tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap, stun, and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Although her demise was untimely, she was always present on the front. If we were not as powerful of a hive, RBY made an incredible ace that we kept as a back up. A pristinely place perch tunnel! Your contributions is what makes us succeed RBY!' by Ancient Queen (LIMA)

  Young Praetorian (NEW-621) is awarded the Royal jelly of proliferation: 'NEW is a master of subterfuge! Although she poses as a young sister, and even having a name to match, her skills are clear as day! She managed to save many sisters, queen including, and surviving double tubers, and a tuber with double tubes! Always outnumbered, never out skilled! Her talents are in great need, so that she can eternally stomt the talls to their death! Help us NEW! Become the eternal royal guard!' by Ancient Queen (LIMA)

  Ancient Ravager (XR-745) is awarded the Royal jelly of slaughter: 'Although I don't award jellis to the combat sisters, this one is an exceptional one. XR is working hard towards mastery of the ravager, and her talents and progress cannot be denied. She worked hard on utter domaniation and wiping of the tall kind, which she easily accopmlished even though talls had new larva hatching! XR is a hero and a role model to what resillience, determination, and a good old slaughter of the talls represents! Help us XR! We need you!' by Ancient Queen (LIMA)




