roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Viper.



  Royal Jelly Awards:

  Elder Defender (XL-991) is awarded the Royal jelly of resilience: 'Well done my Elder Defender, You have shown the Tuber that he is nothing more than a normal spitter, your bravery, and courage into stunning that tuber, allowed me to swiftly, neuro spit, and drag them into the abyss. Not to mention you made many captures that have help the hive grow even further. I am proud of your performance, may the Queen Mother watch over you!' by Prime Queen (PRO)

  Young Carrier (HU-822-G) is awarded the Royal jelly of proliferation: 'You have done an excellent job, young carrier, you were always in the front line all the time when needed. You made sure each tall received a child that of which made it easier for us all to have a wonderful time doing transport work. Without you, I would assume everything would be way more difficult, but luckily we had you with us this battle. Your traps also, were beneficial allowing others to drop talls ontop of them to make it easier as well. May the Queen Mother be with you! Rejoice!' by Prime Queen (PRO)

  Young Boiler (MO-141-G) is awarded the Royal jelly of resilience: 'Congratulation young boiler MOG, you have shown these talls that you mean business, and boiling pain. Speaking of boils... you have made sure to delay the talls, and counter every push they made every scream I made. You also made use of your acid spray, and perhaps your tail stabs. I am proud of you, because you even allowed future captures to be possible. The Queen Mother would be proud of you, Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Osborn Curry's majestic hair.[/color]![/bold]



