roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sips 'Toasty' Summer, Colton Oliver, Elise Veira, Charles Muggins, Styx Eventide, Lenny Figglebottom, Chip Philips, Squeak, Aster Seelis, Khali 'Seven' Rai, Xandar T Great, Yeo 'Sakura' Bunnia, Travis 'Rookie' Perkins, Racks-The-Bolt, Thick-fur Scamper, Bob o Handy, Bakes-The-Pies, Kennedy  Haynes, Rodentu Vileni, Gem Chitters.



  Royal Jelly Awards:

  Ancient Lurker (ORB-340) is awarded the Royal jelly of sabotage: 'During the time you were a acid runner since you were born, you gained enough acid to great the best boom of them all.


  Every tall crumble under great coordination, and with that said your main reason it was possible to kill all the talls at evil eye.


  Your effort was amazing, Rejoice!' by Prime Queen (PRO)

  Young Hivelord (AO-972-L) is awarded the Royal jelly of proliferation: 'For your great work since the time you were born in battle, you were always born to be a builder.


  You kept working hard, and kept at it till the end of this battle, you were a great architect for someone who is young.


  Keep at it youngster, you will grow stronger overtime!


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (HR-448-M) is awarded the Royal jelly of proliferation: 'Since the beginning you were born, the first life of the hive, you build and build you did, you also were achieving stuff as a healer but eventually went down the road of a hivelord.


  Your most significant achievement, that of which I had the honor of asking was making resin structures for the backline to front line, north of meridian, which blocked talls, and halted their retreat or advance.


  You have done a great job in ensuring our structures were built with great design.


  Well done Youngster, Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
