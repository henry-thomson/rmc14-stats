roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tristram Osset, Seymour 'Hack' Jenkins, Natori, Locke 'Lancaster' Heart, Dustin Bullard.



  Royal Jelly Awards:

  Ancient Runner (RUN-901) is awarded the Royal jelly of proliferation: 'My predecessor was overzealous, and despite her mistakes, you overlooked them and sacrificed yourself at the beginning of tier 3 and immediately sacrificed for her. Not everybody noticed it but i did. I believe its truly remarkable. Even more when she faced certain death.' by Prime Queen (BUH)

  Ancient Boiler (RA-478-ZR) is awarded the Royal jelly of sabotage: 'The next stage of the hivemind... the same mind, we were in absolute perfect synch and could walk together if we each controlled a foot... Your kind are scarce and i hope you and me combine forever, Truly unstoppable.' by Prime Queen (BUH)




