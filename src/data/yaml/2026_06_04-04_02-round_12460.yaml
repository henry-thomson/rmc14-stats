roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Drone (LIL-117) is awarded the Royal jelly of rejuvenation: 'Your sacrifice will be remembered. You gave me all of yourself when i was on my most vulnerable state, which saved me and made this victory plausible. It would have been way much harder if it wasnt by you.


  Thank you, LIL.' by Prime Queen (RP)

  Ancient Drone (QQQ-738) is awarded the Royal jelly of rejuvenation: 'Your sacrifice will be remembered. You gave me all of yourself when i was on my most vulnerable state, which saved me and made this victory plausible. It would have been way much harder if it wasnt by you.


  Thank you, QQQ.' by Prime Queen (RP)

  Elder Sentinel (ARG-44) is awarded the Royal jelly of sabotage: 'An amazing ravager and even more awesome Sentinel. You dragged and spat on talls capturing more than 15, hell maybe even 20. Talls refused to listen to your warning of wearing carapace and paid the price for it.


  I am proud of you my sister, and i hope we can meet on our next hive invasions.' by Prime Queen (RP)

  Elder Praetorian (LEO-356) is awarded the Royal jelly of resilience: 'For your work in dragging and saving sisters, including your mother once they got at least 10 tubes in their head, you saved my life many times.


  Rejoice my daughter! May your screech be eternal!!' by Prime Queen (RP)

