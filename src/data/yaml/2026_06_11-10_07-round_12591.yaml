roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Glacier, Ronald Laborde, Willow Icewitch.



  Royal Jelly Awards:

  Mature Drone (RE-988-D) is awarded the Royal jelly of rejuvenation: 'RED proved herself as an incredible show of resilience and survival, not only for herself but other sisters as well! As seemingly the only gardener since the start of the war, RED was constantly working overtime for her queen and sisters! Always growing incredible artisan quality alacrits, shields, and health for the healers! RED you really need to teach us how you are so capable!' by Prime Queen (LIMA)

  Ancient Hivelord (ABG-422) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls as our single hivelord. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We hope to see our sister waste the talls in the future hives as well!' by Prime Queen (LIMA)

  Young Carrier (XX-30) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, sister deserves the royal award! Sister managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war, she was a partial mother to the rest of the hive as one of the two carriers. Oh how we becon her to help the further hive expansion! May her children are plenty!' by Prime Queen (LIMA)

  Mature Drone (ED-613-S) is awarded the Royal jelly of rejuvenation: 'Sister EDS kept endlessly sacrificing herself for the betterment of the hive with her healing work! Always grazing the edge of danger with her frontline healing, yet at the same time keeping safe at all times. Whenever queen was parched, she shared plasma with her, which allowed us to keep the unending pressure on the talls! The future hives are in desparate need of her skills!' by Prime Queen (LIMA)




