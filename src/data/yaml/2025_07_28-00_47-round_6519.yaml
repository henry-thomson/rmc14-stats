roundEndText: >2

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Nahami, Xyto Avaeilia, Jane Gerber, Art Currie, Atlas Kasky, The Weeds of Fear.



  Royal Jelly Awards:

  Elder Runner (JE-395-PH) is awarded the Royal jelly of sabotage: 'You were born on the metal hive, but I gave you one goal in mind, and you made sure to go through with it, even if it costed your life. You went into the room where the bird plasma was located, and destroyed it, sabotaging everything they could use against us, which in turn made it immensely easier to not get skyspit upon the ones below. You have done a true sabotage, rejoice!' by Prime Queen (PRO)

  Mature Ravager (ER-563-C) is awarded the Royal jelly of slaughter: 'You have done an amazing job ravager, in fact you did better than most ravagers I have seen thus far, and that is something to be proud of. You were able to swiftly, kill the talls with ease every engagement, you did perfect coordination with me, and the boiler included against the talls last push against our hive. I want to thank you for making a huge impact on the frontline.' by Prime Queen (PRO)

  Mature Boiler (MOG-473) is awarded the Royal jelly of slaughter: 'You have done an amazing impact on the front lines, you prevented the talls from pushing recklessly, and made sure they were countered with each boil. The most impact was during when talls had eye tower, and was pushing through med-sec I do a scream that allowed you to boil so many of them, and the ravager did an evisceration to make them stay in it longer, well done! You truly were an amazing boiler!' by Prime Queen (PRO)

  Elder Praetorian (NOO-424) is awarded the Royal jelly of slaughter: 'For your phenomenal work on the front lines, I am bestowing the jelly of slaughter for the fact that you made a huge impact during the battle of med-sec where the talls had eye tower, and even cleared out south east research habitation. In terms of that you made it where we switched the tables because of you helping out whenever I screamed. Well done! Rejoice!' by Prime Queen (PRO)
