  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Virgil Huxley, Luanne Greenawalker.



  Royal Jelly Awards:

  Ancient Runner (AC-978-ID) is awarded the Royal jelly of slaughter: 'I have never ever seen a wipe like that. You did your acid explosion and killed over 25 talls, including Tuber and Longspitter. ACID really deserves this jelly, for this win would never happen if it wasn't for them.


  Rejoice!' by Elder Queen (RP)

  Prime Ravager (GUH-553) is awarded the Royal jelly of slaughter: 'GUH did a wonderful job as a Hedgehog Ravager, baiting talls and doing some small wipes that did a huge lift up for us.


  Rejoice!' by Elder Queen (RP)




