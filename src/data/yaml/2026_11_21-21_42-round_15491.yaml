roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Byron Benford, Adele 'Pat' Murphy, Felix 'CopyCat' Phill.



  Royal Jelly Awards:

  Prime Praetorian (KR-492-IS) is awarded the Royal jelly of resilience: 'KRIS. You have saved me, my sisters and allowed this show to continue for... well... as long as it did. Your gifts to the hive will NEVER be forgotten. The star moment in the show that our cameras captured was..: The saving of TWO ravagers in nexus! Thats right folks! Kris really impressed me during the nexus fight. Congratulations. I am rewarding you this jelly and a reward of 1000 points! Rejoice!!!' by Immature Queen (HOST)

  Prime Drone (HA-493) is awarded the Royal jelly of rejuvenation: 'HA. Your sacrifices to the hive today have been incredible. You have saved me, your sisters and others multiple times. Without your wonderful and masterful use of plasma we have all lived to see another day- well. However long this day will last. I grant you this reward of 1000 points and this here jelly! Rejoice!!!' by Immature Queen (HOST)




