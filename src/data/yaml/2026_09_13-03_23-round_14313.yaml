  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Kobe Hoover.



  Medal Awards:

  Second Lieutenant Mia James is awarded the Distinguished conduct medal: 'While serving as an Intelligence Officer during Mission Reactive-Saif, stood as the lone survivor of the intel team and made crucial pushes in close coordination with assault elements to secure mission-critical intel. Your grit and determination reflects great credit upon yourself, and upholds the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature

  Corporal Lexi 'Black' LaVaux is awarded the Medal of valor: 'While serving as a Hospital Corpsman during Mission Reactive-Saif, struck deep into enemy positions to rescue their fellow marines and on multiple occasions gained the recommendations of their peers for gallantry. Your selfless and expert service reflects great credit upon yourself, and upholds the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature

  Lance Corporal Paduxi-Utamukeeus is awarded the Distinguished conduct medal: 'While serving as a rifleman during Mission Reactive-Saif, assaulted Xeno positions with ruthless speed and tempo, rescuing myself in Miyahira through their sheer endurance and tolerance of pain, earning both the commendation of myself and their peers. Your selfless service reflects great credit upon yourself, and upholds the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature

  Warrant Officer Rhys Hendricks is awarded the Distinguished conduct medal: 'While serving as a Gunship Pilot during Mission Reactive-Saif, made multiple danger-close strikes that inflicted great losses on the enemy through timing and expertise in the air.. Your ferocity reflects great credit upon yourself, and upholds the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature





