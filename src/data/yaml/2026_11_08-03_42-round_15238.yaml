roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Eats-the-Mice, Levianna.



  Royal Jelly Awards:

  Mature Boiler (BL-944-A) is awarded the Royal jelly of slaughter: 'BL-A, I award you this jelly on behalf of all the other boilers in our hive. You girls have done amazing today, constantly being a nuissance to the talls by melting their stuff AND their faces.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Prime Queen (NEV)

  Young Praetorian (SH-672-V) is awarded the Royal jelly of proliferation: 'SH-V, You have done a great job, even if you are a relatively young sister. You were coordinated with our hive, dragging talls to their doom and trusting your sisters to assist in those captures.


  For this, I award you this jelly of proliferation for your great captures.


  See you in the next hive!' by Prime Queen (NEV)

  Elder Hivelord (MA-398-R) is awarded the Royal jelly of resilience: 'MA-R, Your efforts as a designer have permitted our hive to make great amounts of resin, essentially halting the tall's assault as they could not push through the sheer density of our walls.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Prime Queen (NEV)

  Mature Crusher (NZP-68) is awarded the Royal jelly of resilience: 'NZP, you have protected many sisters today with your hardened body. You took the tall's spit like it was nothing.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Prime Queen (NEV)

  Mature Crusher (SK-460-UB) is awarded the Royal jelly of resilience: 'SKUB, You have saved many sisters today by protecting them from the tall's spit. You have even saved my life on one occassion.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Prime Queen (NEV)




