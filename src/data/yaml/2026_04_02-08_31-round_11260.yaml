roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Darin Semenov.



  Royal Jelly Awards:

  Elder Ravager (EVE-186) is awarded the Royal jelly of proliferation: 'Our last remaining ravenger. When the orginal mother feel in battle this daughter held the line against the talls. Without there efforts to stall the hive would have been overwhelmed. When time came for mother to join the battle this daughter did not fear. On each and every engagement with the tall invasion they secured a capture. When mothers life was at threat they protected. They are the reason our hive exists. Bravo!' by Prime Queen (ARG)

  Young Praetorian (FU-490-K) is awarded the Royal jelly of sabotage: 'Our oppressor, one of the few surviving T3, who gave their life for the hive. When asked against impossible odds to stall the tall invasion so mother could rotate freely, this daughter did not faulter. Although young and inexperienced, they showed wisdom and grit many times their age. Working together with another daughter they considerably slowed the tall advance, buying critical time. Without their efforts the battle would have surely been lost.' by Prime Queen (ARG)

  Young Boiler (BAM-469) is awarded the Royal jelly of sabotage: 'Our boiler daughter. Although very young and inexperienced when given an impossible task this daughter did not fear. They were asked with another of my daughters against all odds to stall the tall invasion alone, allowing mother to rotate freely. There success in this effort enabled us to secure vicotry this day. All of my daughters should wish to be as brave as you one day. Rejoice!' by Prime Queen (ARG)




