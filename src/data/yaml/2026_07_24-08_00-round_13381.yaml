  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Corporal Myles 'Runner' Rifler is awarded the Medal of exceptional heroism: 'For exceptional valour and unflinching heroism in the face of overwhelming odds. Corporal Rifler held against wave after wave of Xenonid harassing attacks, securing a criticial communications array and ensuring the horde paid for each attack in blood. A shining example of dedication to duty for all to follow.


  Awarded by LtCol. Clyde McKinney on 24/7/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





