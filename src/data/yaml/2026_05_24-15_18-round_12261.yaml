roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rinka Izumi, Elric Baxter, Blake Bravo, Pat Patlal, Jal Skallera, Altay ''Syntax'' Khan, John Pena, Scotty Thomson, Easton Williams, White Banks.



  Royal Jelly Awards:

  Ancient Ravager (JA-946-KE) is awarded the Royal jelly of slaughter: 'JAKE, this was a masterclass in beserker ravager. You have spent all day wiping talls effortlessly, surviving until the very end to wipe every last one of them. You have shown them your might and made sure they regret attacking our great hive.


  For this, I award you this jelly of slaughter, well deserved.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Drone (JI-769-N) is awarded the Royal jelly of rejuvenation: 'JIN, you have done well this day. You have healed many sisters and provided them great support, constantly making sure they are able to fight. You have sacrificed yourself to make us see the end of today.


  For this, I award you this jelly of rejuvenation, to show my gratitude.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Boiler (EHE-271) is awarded the Royal jelly of slaughter: 'EHE, you have done great today. You have provided your sisters cover fire, boiled the talls and lived to tell the tale. You have helped immensely today, and I am grateful for your work.


  For this, I award you this jelly of slaughter. Good work.


  See you in the next hive!' by Ancient Queen (NEV)

  Young Boiler (XV-665) is awarded the Royal jelly of resilience: 'XV, incredible work today. You have helped hold the core against t he tall's futile efforts. You have provided great support, extinguishing sisters and boiling the talls. have made sure they regretted their pushes at every opportunity.


  For this, I award you this jelly of resilience to commemorate your great work today.


  See you in the next hive!' by Ancient Queen (NEV)




