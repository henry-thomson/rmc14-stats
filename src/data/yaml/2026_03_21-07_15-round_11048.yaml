roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Emilia Reiter, Cedrik Steel, Breath of Ashes, Reed McMatherson, Davlat 'granddad' Lukin, Laureano Torres, Michael Chapman, Racc N'Bin, Linda Clark, Crystal Price, Nova 'Super' MacLeod.



  Royal Jelly Awards:

  Young Burrower (SB-459) is awarded the Royal jelly of sabotage: 'captured many with their dastardly schemes and tricks, contributing significantly to the hive's growth. Rejoice, my daughter, for your accomplishments do not go unnoticted.' by Ancient Queen (ZERO)

  Young Hivelord (ML-520) is awarded the Royal jelly of resilience: 'though only young, she stepped up when the hive needed her most, working with her fellow builders to fortify critical areas that were used to trap the talls and eventually used to funnel them into a deathtrap. This secured both their demise and our victory. Rare is it for one so young to accomplish so much. Rejoice, my daughter.' by Ancient Queen (ZERO)




