  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Staff Sergeant Aelica 'Mom' Danara is awarded the Distinguished conduct medal: 'Staff Sergeant Aelica 'Mom' Danara performed exceptionally well during this operation. At the recommendation of your Captain you are recieving this medal for your actions. Those being keeping firm grip and leadership over your squad. Not only this but leading an assault into marshals alone. On the normal operation this would be a bad idea, but Aelica accomplished it. Keeping cohesion is important to an operational success and Aelica did that. Excellent work today Aelica, you earned this Medal of Distinguished Conduct.


  Awarded by LtCol. Sicilia Drakonovisch on 05/08/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





