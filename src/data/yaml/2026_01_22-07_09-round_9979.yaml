roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ravager (XX-416) is awarded the Royal jelly of resilience: 'Despite having a small token force of sisters, they stood against the endless horde of tall host. Seeing through to a victory that will be remembered across the entire hivemind to the end of time!!!


  REJOICE!!!!' by Ancient Queen (HEK)

  Elder Praetorian (NEV-670) is awarded the Royal jelly of resilience: 'Against an endless horde of talls, their support not only as a Valkyrie, but a tenacious warrior has allowed our hive to outlast the most ferocious of tall warriors. Well done.


  REJOICE!!!' by Ancient Queen (HEK)

  Ancient Drone (RIK-747) is awarded the Royal jelly of proliferation: 'With their unyielding fruits, our hive managed to heal many a grevious wound, continue a impossible attack, and rejuvinate much needed abilities.


  Victory would not have been possible otherwise.


  Well done.' by Ancient Queen (HEK)

  Prime Drone (TO-306-MB) is awarded the Royal jelly of rejuvenation: 'With their healing, we were able to keep the most grevious of injuries at bay. Death itself fears the power of our hive due to sisters like you.


  Without your constant attention and care, we would have faltered.


  Well done, and well earned.' by Ancient Queen (HEK)

  Prime Defender (TA-745-NK) is awarded the Royal jelly of slaughter: 'I personally witness their captures, despite the difficulties of their caste. They were a warrior of legend.


  Well done daughter, your sisters give you this jelly, and while you may have fallen in battle. You will live in their memories.


  We will see you again, in another nest, in another mind.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



