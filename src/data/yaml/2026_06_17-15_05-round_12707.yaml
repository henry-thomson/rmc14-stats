roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Halo 'Q' Pale, Manuel Miller, Andrew Miller, Zaooxrim Teqtaq, Garry Nacho, Locke 'Lancaster' Heart, Derick 'Naptime' Hunt, Kaylin 'Kay' Kadel, Suzumi Nanami, Rickety Kryn, Thales 'Careless' Antares, Marissa Day, Ramiris 'Psyop' Aether, Chee 'Pressure' Mach, Caha Bush, Liam 'Property Damage' Harper, William Stone, Ferozo, Ann Sawyer, Holds-The-Trigger, Lucybelle 'Armory' Srcthcycs, Amber 'Unlucky' Summer, Nisha Helm, Squeaky Chip, Adelice Delahoussaye, Mossberg Ren, Gosha Gilbert, Isaac Blaze, Sips-The-Cola, Butch Ratcliff, Nibbles McBlunder, Baromir Kemerer, Aiyakah 'Speedy' Novahich.



  Royal Jelly Awards:

  Prime Ravager (PRO-739) is awarded the Royal jelly of resilience: 'Through your dedication and your carapace, by the time the first Queen had fallen, you were the only one who remained through the darkest times of the Hive, thriving alone and capturing multiple Tall to supply the Hive with an unwavering number of daughters to fight against the Tall menace. Your fangs and your sharp resilience proved to be the best of all Ravagers. You outlived and thrived.


  You have proven that you have taken and captured more than 30 Tall, recovering the Hive's population and aiding me in taking down the Turtle Beast that had been terrorizing our Hive on the planet. You were the Hive's only hope, as well as its only hero.


  You did exceptionally well, thriving through all the mess and the leftovers that the old Queen had left behind, giving me the chance to take over the planet.' by Elder Queen (SVI)




