roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Myla Merryweather, Isaac Nightwish, Wags-her-Tail.



  Medal Awards:

  Minji 'Failsafe' Kilgrim is awarded the Distinguished  conduct medal: 'As per recommendation of the CMO, you have performed your duties as an Almayer chemist with utmost excellence today. Producing over 60 pressurized canisters of General Cure, a potent mix of drugs meant for quick recovery in the field - totalling nearly 30,000 units. This sheer volume of output contributed significantly to keeping all our boys in the fight today.'

  Surtur 'Brimstone' Cyrus is awarded the Distinguished  conduct medal: 'This medal is addressed to you, but should be going to all of the MPs on staff today. I, in my infinite cruelty, worked with the ship's AI to set up a bomb drill for you all today. No warnings, no nothing - you all thought it so real.  


  With the task of securing the Almayer in front of you, you all executed this task with utmost diligence and speed. If the bombs were to have been real, the utmost of catastrophes would have been avoided thanks to your work.'

  Krani 'Northward' Asurine is awarded the Distinguished  conduct medal: 'Commended by your lieutenant, for excellent management of your fireteam element, handling of logistics, and for being a pivotal part in spelling the demise of the first queen.'





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



