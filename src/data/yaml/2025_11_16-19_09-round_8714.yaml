roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Erin Baker, Lsoo 'Morass' Slime'Loo, Sylas 'Double-Tap' Harrow, Archibald 'Misfire' Garcia, Oberon 'Obi' Toski, Holden Franks, Nibbles McBlunder, Rick Lu Arran, John Nahami, Titus Hall.



  Medal Awards:

  Ignis 'Nightfire' Nyx is awarded the Bronze heart medal: 'For managing to break free of the xenos grasp within their own hive for long enough to destroy the hive core, I commend you post-humously. Even in the face of overwhelming danger, you remember your duty and fulfilled it to the bitter end.


  Awarded by Col. Scraps-the-Copper on 11/16/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Katerina 'Kat' AW Dragunov is awarded the Medal of exceptional heroism: 'Responsible for the orbital strike on Aerodrome that broke one of the xenonid hive clusters, as well as spearheading the charge into this position. Managed to slay their queen before succumbing to their injuries, marking a significant turning point in the events of the operation.




  Awarded by Col. Scraps-the-Copper on 11/16/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Young Hivelord (DR-30-G) is awarded the Royal jelly of sabotage: 'Prosperous hive is build on the shoulders of great sisters. Today you showed us a good example. With your fast tactical thinking and great effort you were able to build up defences in the backlines diverting large enemy force to deal with it leading to the split in cohesion and a wipe as a result. For this you are given a jelly of sabotage. Hive is proud of you. So am I.' by Ancient Queen (RISK)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
