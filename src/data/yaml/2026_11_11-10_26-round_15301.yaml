roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  Royal Jelly Awards:

  Elder Burrower (BAM-672) is awarded the Royal jelly of sabotage: 'BAM worked tirelessly on making sure the whole hive can travell all over place!  She took care of always providing tunnels, saving multiple sisters, and with all seriousness giving us incredible potential to move around. On top of the whole melting and  trapping talls side work she had! You were the only burrower, and yet you proved your might! Help us BAM!' by Prime Queen (LIMA)

  Young Hivelord (AR-982-S) is awarded the Royal jelly of resilience: 'The award is somewhat shared with other lords, ARS and LX were one of the best examples. Our most honorable sisters kept our wonderful kingdom always weeded, walled off, and tight with their mightiest walls! Talls took their last breath, and they watched how the light disappeared from their eyes. Murder is after all best served cold, and our lords would know a thing about that. See you in the sky hive!' by Prime Queen (LIMA)

  Young Hivelord (LX-202) is awarded the Royal jelly of resilience: 'The award is somewhat shared with other lords, ARS and LX were one of the best examples. Our most honorable sisters kept our wonderful kingdom always weeded, walled off, and tight with their mightiest walls! Talls took their last breath, and they watched how the light disappeared from their eyes. Murder is after all best served cold, and our lords would know a thing about that. See you in the sky hive!' by Prime Queen (LIMA)

  Mature Praetorian (MI-883-N) is awarded the Royal jelly of slaughter: 'Although I don't award jellies to the apex sisters, let alone combat tier 3, this would be an exception. MINs powerful hamstrings worked day and night dragging talls into the depths of their new home! Her end was untimely, but she managed to slay fields of talls before her passing. She will be back, after all heroes never die!' by Prime Queen (LIMA)

  Young Warrior (AC-502-E) is awarded the Royal jelly of slaughter: 'ACEs talents and progress cannot be denied. She was constantly working overtime for her queen and sisters! Sister managed to capture talls time and time again, a literally never ending flow. Always alive, yet always present on the front, how is that even possible?! ACE thank you for your work!' by Prime Queen (LIMA)




