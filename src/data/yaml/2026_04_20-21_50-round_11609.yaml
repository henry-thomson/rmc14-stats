roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Alabaster Fullback, Felix Milkyway, Dork Dwimbleby, Tatiana Zaychikova, Leonard 'Breacher' State, Ash 'Silly' Winter, Juan Cortez, Seth Xi, Grigorij Grigorievitch, Jacob Kerry, Dewi Sue, Lyria Abbadon, Sips-The-Cola, Hank Starseer, Sapphire Aluxin, Jak 'Wall' Len, Beeni, Roland 'Stahl' Kraus, John  Johnson, Maito 'Powerhouse' Kondrea, Yort Jello, Thomas Telaga, Atlas Winter, Maynard 'Marksman' Lewis, Alexis Mayfield, Jones Clementine, Zack Hice, Saida 'HSV' Murkina, Spits-The-Fire, Licks-The-Fruit, Auric Dawntide, Drinks-the-Razorium, Simon Focell, Guaco Micheal, Vivian Bell, Teagan McDonald, Altay ''Kagan'' Khan, Ryker Zola, Pimoa Spoderlad, Culls-The-Leviathan, Nezuni-Arksai, Alexa-Lotl, Poppy Preyson, Nahami, Isaac Murillo, Dune 'Friendly Killer' Ale, Pinot 'Puppet' Bruno.



  Medal Awards:

  Lance Corporal Carote 'Carrot' Noctura is awarded the Distinguished conduct medal: 'At the reccomendation of your Lieutenant Ardy 'Ape Man' Guy. Carote Noctura you are being awarded the Medal of Distinguished Conduct for stepping up when your squad leader passed away in battle. You have proven yourself to be a good leader despite the circumstances. Leading your squad cohesively and following orders. Especially as someone fresh to the positioned, this should be rewarded. And it is being so. Be proud of the work you did today.' by Major Sicilia 'Rose' Drakonovisch





