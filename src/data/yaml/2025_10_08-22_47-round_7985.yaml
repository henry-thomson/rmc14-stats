roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Larry de-Pain, Nick Laine, Alonso Quixote, Gorek 'Slayer' Ironbraid, Aroldo Batata, Bright Chip, Glorp Gnarpson, Ambly-Rhynchus.



  Medal Awards:

  Mike Spike is awarded the Distinguished conduct medal: 'For keeping communications up all opperation. your work did not go unnoticed. and was integral to our orginization


  Awarded by Maj. Tyr Ragnarson on 10/08/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Tim Perywinkle is awarded the Medal of valor: 'when the first queen slammed into our lines. and nearly wiped your squad. you slew the evil beast and bought us the time we needed to orginize and counter attack.


  Awarded by Maj. Tyr Ragnarson on 10/08/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Luanne Greenawalker is awarded the Distinguished conduct medal: 'You slew many a beast. showing us what it means to be a Weapon specialist and a marine. even to the point you almost lost your life. if only i had more marines like that


  Awarded by Maj. Tyr Ragnarson on 10/08/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





