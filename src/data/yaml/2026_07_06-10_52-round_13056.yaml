roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tar-Banalz, Elric Baxter.



  Royal Jelly Awards:

  Young Sentinel (MEL-504) is awarded the Royal jelly of resilience: 'MEL, today you helped build up areas to a degree that you were noted by other sisters for your efforts. Your good work today has helped us win this day.


  Your work was very commendable and YIP is glad you helped build up were it was asked of you. Keep on working hard on building and you shall keep being a pillar of the hive.


  YIP!!' by Prime Queen (YIP)

  Elder Warrior (RO-113-M) is awarded the Royal jelly of sabotage: 'ROM, today you managed to capture the flamewalker all on your own. For your great efforts and your valiant work YIP is thankful.


  The lack of flamewalker is the reason we could eventually hold down Meridian caves and end their land crawler. Thus putting an end to their entire assault and winning us the day.


  Keep on with your brave captures ar a warrior and you shall reach great heights.


  YIP!!' by Prime Queen (YIP)

  Young Hivelord (AL-623-EX) is awarded the Royal jelly of resilience: 'ALEX, you worked hard today as a lord. Always building up areas and working to stall the talls long enough at Dynagrid for us to gain valuable captures down at south perch.


  Your work today has brought us a great victory and for that we are thankful. Keep on working hard on building and you will soon be among the great prime lords.


  YIP!!' by Prime Queen (YIP)




