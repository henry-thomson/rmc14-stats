roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rush Aviator Pack, Felix 'Cat' Phillips.



  Royal Jelly Awards:

  Young Carrier (YU-551-M) is awarded the Royal jelly of proliferation: 'During the end stage of combat, you were one of the vital pieces to making captures transportation easier during the battle ov LV 624. I bestow this in great faith that you did amazing. I can't even say amazing is the right word, it even higher than that. However I want you to keep this to your heart that you were solely the greatest disengager of pushs since that your purpose, yet you strived even higher than that. Without your input into this battle, I fear it would of been quite different. Thank you for doing what you could with the knowledge you had in this battle. Rejoice!' by Prime Queen (PRO)

  Mature Defender (NC-46) is awarded the Royal jelly of resilience: 'During the hive lowest, I was losing hope but I had one something that brought it all back together, and it was you. You were an absolute unit. like not even words can describe how great it was. We were like 2 defenders, 1 carrier, 1 burrower, and a drone. with a dream, however that dream came true we did precise tactical movements at perfection levels that so perfect I weeped tears if I could. I want to say the amount of captures at eastern caves shows how much effort you did today. I hope you remember this, as you were a great daughters. May this be a lesson and education to you, as all hives should see it more. Rejoice! 


  Taken place at the battle of Lv 624' by Prime Queen (PRO)

  Young Defender (PI-775) is awarded the Royal jelly of resilience: 'During the hive lowest, I was losing hope but I had one something that brought it all back together, and it was you. You were an absolute unit. like not even words can describe how great it was. We were like 2 defenders, 1 carrier, 1 burrower, and a drone. with a dream, however that dream came true we did precise tactical movements at perfection levels that so perfect I weeped tears if I could. I want to say the amount of captures at eastern caves shows how much effort you did today. I hope you remember this, as you were a great daughters. May this be a lesson and education to you, as all hives should see it more. Rejoice! 


  Taken place at the battle of Lv 624' by Prime Queen (PRO)

  Young Burrower (LA-740-MB) is awarded the Royal jelly of sabotage: 'During the engagement eastern caves. with only simple words between us we were able to a make a masterful cohesion tactic that made tremendous value of insane amount of captures. It was as if queen mother twined it as fate between us. I am proud of you, for the amazing work you did with me. I hope to see spectacular performance with you in the future. Rejoice!


  This was taken place at the battle of LV 624.' by Prime Queen (PRO)

  Ancient Drone (FE-951-ET) is awarded the Royal jelly of rejuvenation: 'During the hive lowest, you were able to keep the hive in top condition, even almost losing your life at central west caverns, I am proud of the results you made today. It was spectacular to watch you keep me in great condition, and others when we didn't have anything else to lean on during those times. You were a vital piece in support and for that you deserve this jelly. Rejoice!


  This was taken place at Lv 624.' by Prime Queen (PRO)




