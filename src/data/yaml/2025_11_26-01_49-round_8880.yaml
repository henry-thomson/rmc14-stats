roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Speedy 'GTAW' O'Callahan, Ivanovich Lebedev, Luanne Greenawalker, Reginald Goetia, Vesper McKinney, Duurge, Ash 'Silly' Winter, John Larson, Slowy Garrison, Desmond 'Des' Coldsmith, Ryuko 'Survivor' Solisa.



  Medal Awards:

  Einuko 'Twitch' Steelfeather is awarded the Distinguished conduct medal: 'For both the stalwart leadership of the marines around you, and the excellent communications between your squad and myself, your squad leader and myself find this effort worthy of commendation. Thank you for being there - a lot of marines were in the right place at the right time because of you.


  Awarded by Col. Scraps-the-Copper on 11/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Caroline 'Squeaker' Faust is awarded the Distinguished conduct medal: 'For being among one of the few we had on HIRR baton duty today, I had the honor of watching you foil the xenonid queens attempts at defending their hive and spelling her end almost directly. Though some may find the use of the HIRR batons unorthodox, it proves itself deadly in the right hands again and again.


  Awarded by Col. Scraps-the-Copper on 11/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Francis Monroe is awarded the Bronze heart medal: 'For their stellar performance with the grenade launcher, alongside many others today, you have been commended for these efforts. A true shame you were taken from us today.


  Awarded by Col. Scraps-the-Copper on 11/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juan Cortez is awarded the Distinguished conduct medal: 'An angel of death. Nothing represents the concept of technological superiority better than sitting in an air conditioned cockpit, spelling the doom of dozens of xenonids with a few clicks of a button. A consistent performance, and one that was integral to our success here today.


  Awarded by Col. Scraps-the-Copper on 11/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Screams-A-Lot is awarded the Distinguished conduct medal: 'Through recommendation of your staff officer, I see it fit to commend you. Charlie squad stayed well-organized and lethal throughout the operation, where, quite frankly, leaders of a lesser caliber had failed to do the same in the face of an overwhelming threat. 

  Leadership is difficult, but underappreciated. Not in my corps, however.


  Awarded by Col. Scraps-the-Copper on 11/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





