roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Cash Flores.



  Medal Awards:

  Sergeant Denys 'Bambi' Straub is awarded the Distinguished conduct medal: 'For one new to the position of Squad Leader, they have shown remarkable skill and wisdom. For most of the operation, Alpha operated seperately from the other squads. Thanks to this SL's strong head and brave heart, Alpha made it through the operation, killing the Queen in the process. I hope to continue to see your progress. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 8/1/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





