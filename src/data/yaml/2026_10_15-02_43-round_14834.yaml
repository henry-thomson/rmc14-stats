roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Leon 'BBQ' Braun, Solus Astrania, Nathaniel Acosta.



  Royal Jelly Awards:

  Mature Defender (MO-202-O) is awarded the Royal jelly of resilience: '"Do you really care? About yourself? Do you have a mind of your own? The purpose of your existence? Doesn't it... trouble you?"


  My eyes have laid upon the purpose of your existence as a life form, a flesh burdened by hatred, a mind that prevailed through all that remained, a body that carried the future of the Hive. You upheld such expectations.


  I don't know what your idea was, but you, and the time that prevailed through all of this, you have gone through all your thoughts, only to toss away the one thing that gave you a purpose to exist.


  I thank you for your sacrifice for the Hive. Your body and your mind will not be forgotten, as we have won the war upon the station against the Tall Menace. They were fierce and obnoxious, but their doom is now upon them.


  The end is now. My purpose is to grieve for the perished, the lost souls that have gone through all the unimaginable pain.


  This is the end of the line for the Tall, as I thank you for your sacrifice once again.


  Thank you.

  MOO.' by Ancient Queen (NULL)




