roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Short-ears Sawyer is awarded the Distinguished conduct medal: 'it may not seem like much. but you shown what i care for most in a marines. tending to our dead when no one else did. making sure they are given the last bit of respect they were due. if only the rest of your squad cared half as much


  Awarded by Lt Col. Tyr Ragnarson on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Leon Renshaw is awarded the Distinguished conduct medal: 'For keeping the sensors on when everyone else left you on your own. sitting in that vally alone with monsters like these around could only be harrowing


  Awarded by Lt Col. Tyr Ragnarson on 12/19/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





