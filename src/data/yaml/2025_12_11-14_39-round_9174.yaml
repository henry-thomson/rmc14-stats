  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Berga Hades, Licks-the-Ground, Kaleigh Taylor, Bonney 'Bun', Grail Hollow, Ricky Fischer, Reid Wilson, Hitts Zeneki, Suzy Evans, Kiefer Stohl, Gosha Gilbert, Damien Schmitt, Robert Grizzly, Melanie Hyrrokkin, Juno 'Kleptocat' Kaneko, Elijah Clarke, Olivia Croft, Mossy Mayday, Vuk Drexler, Enkrid Night, Helle Stargazer, Richard 'Richie' Rhymes, Geem 'Drop Pod' Etaku, The Shooting of Fauna, Jazmin Ludwig.



  Royal Jelly Awards:

  Prime Drone (MIU-834) is awarded the Royal jelly of rejuvenation: 'This daughter has been of great help during this long battle... she endured... she healed... and helped us stay in the fight longer, THIS DAUGHTER has been the heart of our hive, she never left our side and never took a rest, you made me proud MIU... you really did... my blessing upon you.' by Elder Queen (GUH)




