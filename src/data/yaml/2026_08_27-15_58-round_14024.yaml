roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Cay 'Stargazer' Neseko, Liquorice Mcsquish, Jezomi, Finch 'Hero' Ward, Elroy Aegyr, Huey McLuvin, Starts-The-Fire, Ulric Steele, Mike Doe, Is-The-Fish, Buck 'Pretty' Tern, Maru Sableport, Lenny 'regicide' Kuster, Ashlyn Powell, Tivii, Isaac Hightower, Hark Willson, Kaarin Pianwa, Lapinski Warren, Jonny McCann, Klaus, Ihik'kih Binih, Phil Destric, Jan Znidarsic, Hudson Birken, Eikii, Roksana Silken, Russell Hunt, Ervin Krestel, Hayden 'SKY PASTE' Beail, Steve Nevets, Lacy Hill, Thellia Zaun, Stubby Skylar, Crimestoer 'Claymore' Mauler, Lucas Rockwell, Ater Gorn, Randy Volter, Diarsia 'Dima' Maxima.



  Medal Awards:

  Captain Stares-at-Stars is awarded the Distinguished conduct medal: 'Deployed to the front and lead the marines without hesitation or fear. 


  Continuiously pushing and keeping the xenos from fully encircling the force during a time of crisis. Despite the mounting casualties and odds they managed to pull victory from defeat and turn the tide on the xenos.


  This demonstration of leadership and tactical skill has lead to the victory we have gained here today.' by Lieutenant Colonel Reed McMatherson

  Second Lieutenant Fenrisulfr AW 'Thumper' is awarded the Distinguished conduct medal: 'Provided almost all the intel points we needed today. 

  They singlehandedly went alone to Mining despite it being a nesting ground for the xenos and managed to gathered up all the intel needed for us to continue on. 


  Without them we would not have been able to achieve what we did today.' by Lieutenant Colonel Reed McMatherson





