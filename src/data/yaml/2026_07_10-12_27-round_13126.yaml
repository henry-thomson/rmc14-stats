roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Elizabeth Nightflitter, Billy Brothers, Mary Squibb, Avery 'Ace' Northwood, Suzumi Nanami.



  Medal Awards:

  Lance Corporal Jackie 'Cratehead' Taylor is awarded the Medal of valor: 'Lance Corporal Jackie Taylor stood tall where leadership had fallen, having shown the virtues and initiative required of great leaders within the UNMC they stepped to the plate and took charge of Alpha. Permitting significant gains for the operation and permitting it's eventual success.


  You've shown great promise for growth within the UNMC and it's leadership, I hope you follow it.


  Awarded by Maj. Kaitlin Zalack on 10/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





