roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Ralaka, Schluck Ka-Ching, Eris 'Squish' Rose, The Forest of Chaos, Durr Tenet.



  Medal Awards:

  Nikki 'Ferret' Blackburn is awarded the Distinguished conduct medal: 'As per recommendation of the ASO, and for deeds I witnessed myself...


  Excellent work with gathering intel, and ensuring that the xenonid backlines were stripped clean of weeds and tunnels.


  Awarded by Col. Scraps-the-Copper on 9/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Tavish 'Vampire' Ironeater is awarded the Distinguished conduct medal: 'Great shots with the M5-ATL today. Striking down a ravager, praetorian, and queen at the very least, if not many more. Being such a heavy hitter was crucial to our operation today.


  Awarded by Col. Scraps-the-Copper on 9/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Grum Shattershield is awarded the Medal of valor: 'For stalwart leadership of the corps today under my command, effective communication, and quick designation of orbital strikes. These efforts were paramount to our victory today. Giving the distinct honor to another officer of leading my marines into battle is not something I do often, but you did not disappoint.


  Awarded by Col. Scraps-the-Copper on 9/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ne'Zun  ''GhostLine'' is awarded the Bronze heart medal: 'Excellent leadership of Delta squadron and consistent communication between groundside and shipside elements. It is a shame that you were taken from us today - the corps needs leaders like you to go so ruthlessly into battle.


  Awarded by Col. Scraps-the-Copper on 9/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Iantha Atikson[/color]![/bold]



  [bold]Hive established by [color=purple]Not so Robust MPs[/color]![/bold]
