roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Davion Powell, Emma Raven, Raina AW Lance, John 'Manifest' Argo, Specializes-In-The-Weapons, Ishmael Clark, Mike Zov, The desert of Silliness, Culls-The-Leviathan, Harry Holden, Vinyl Sadow, Charlie 'Sweats-Off' Westoff, Grumbo Jenkins, Fredd Leach.



  Medal Awards:

  Corporal Alan 'Gambit' Braun is awarded the Distinguished conduct medal: 'A most excellent shot placed directly at the queen, in front of half the corps and myself. What a lovely display.


  Great work, marine.


  Awarded by Col. Scraps-the-Copper on 3/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper





