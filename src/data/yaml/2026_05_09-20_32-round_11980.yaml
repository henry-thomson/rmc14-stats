roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Yuri Martinez, Michael 'Mikey' McGoggins, Stares-at-Stars, Grugorgrad 'Slayer' Granitehand, Porter 'Porker' Keopple, Izzy Cattington, Lemus Lem, Trevor Hills, Miles 'Afro Diver' Cannonball, Elijah Clarke, Rinka Izumi, Wets-the-Drystone, Juno 'Kleptocat' Kaneko, Renomi, Dave Daverson, Scarlet Shodan, Lemonus Coralith, Tiche 'Bastion' Immolator, Mortier Thoins, Eus 'Snowflake' Hi'Iaka, Alexis Kifer, Kun Ironclaw Pack, Maximus Hawking, Guppy DeBoots, Patton Hawkins.



  Medal Awards:

  Lance Corporal Sips-The-Cola is awarded the Medal of exceptional heroism: 'When i was struck down at the feet of the queen and her horde. you placed your machine gun down and gunned the queen down to protect my corpse. your act of defiance and heroism is noted and will forever be remembered. bye me and your fellow marines


  Awarded by Col. Tyr Ragnarson on 05/09/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





