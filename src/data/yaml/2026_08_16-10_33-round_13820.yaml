roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Drone (OWT-706) is awarded the Royal jelly of rejuvenation: 'You were one of our major healers during the battle, keeping everyone alive even at their worst moments. I thank you for providing what you could do during this cold warfare against the talls. May you continue to provide healing to your sisters. Rejoice!' by Prime Queen (PRO)

  Young Hivelord (VV-391) is awarded the Royal jelly of proliferation: 'Since the beginning you were our hivelord, building even giant open fields and providing essential cover for your sisters, even helping make encirclement way easier. I thank you for providing your best for what you could offer. You were sadly killed near cave camp. However your efforts did not go in vain as it provided so much to us all. Rejoice!' by Prime Queen (PRO)

  Young Drone (DI-648) is awarded the Royal jelly of rejuvenation: 'I thank you for providing your fruits for as many as you could. You were one of our foundational supports for the battle. Even providing me alacrit so that I may never be slow against the talls. may you prosper and bring fortune to your sisters, for your fruits bring power! Rejoice!' by Prime Queen (PRO)




