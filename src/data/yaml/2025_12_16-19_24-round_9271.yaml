roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Pablito 'Skinny' Morphy, Sar'Eni, Felix Cooper.



  Royal Jelly Awards:

  Elder Ravager (ALT-60) is awarded the Royal jelly of slaughter: 'For slaughtering countless talls with her sister PRO, they saved our hive and wiped most of the talls when the talls grew cocky and pushed our hive. Incredible work daughter.' by Prime Queen (GIB)

  Prime Ravager (PRO-708) is awarded the Royal jelly of slaughter: 'Your work today will not be overlooked, your claws shred through many hosts, ripping them apart and making sure they never rise again. You and your sister ALT made sure to wipe every single host that challenged us, great work daughter.' by Prime Queen (GIB)

  Ancient Carrier (MIU-941) is awarded the Royal jelly of proliferation: 'This one generated many eggs, making sure every host had a child to infect them. Their children made sure that every capture was safely transported to the hive and taken care of. Their support was invaluable as well, and for this they deserve the jelly of proliferation.' by Prime Queen (GIB)




