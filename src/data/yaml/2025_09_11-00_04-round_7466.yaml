  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Olivia Lambert, Shoots-for-Moon, Dakota Rothman, Zozie Wristwatch, Jackson Moon, Daney Pewson, Bar-Bana.



  Royal Jelly Awards:

  Ancient Carrier (MAR-400) is awarded the Royal jelly of resilience: 'You were our beacon of hope - our sole saviour. At a time when the hive needed a sister to stand up to the tall force, you were there. With your relentless show of power and your impressive display of bravery, you put hope into our hive and increased our morale, leading to a glorious tall route. Without you, I am not sure the outcome of this battle would have been the same. And for that, you are the sole sister I deem worthy of the jelly of resilience. May you serve the hive for ages to come.' by Ancient Queen (SEA)




