  Malachi 'Dirty' Driggers, Kris 'Anarchy' Best, Lenny 'regicide' Kuster, Joshua Lee.



  Royal Jelly Awards:

  Young Boiler (KI-49-W) is awarded the Royal jelly of resilience: 'My dearest young daughter KI-W

  From the start of this tall invasion you have stayed alive, not giving into the urge of all boilers which is walking over the sticks and dying for no reason

  I truly am proud of you, you are a young daughter and you have a great journey ahead of you, I am sure you'll make an amazing prime daughter, whichever caste you wish to pursue in the future

  With those words i leave the way you shape your future up to you my dear daughter

  With Love -- Ancient Queen SQSH' by Ancient Queen (SQSH)




