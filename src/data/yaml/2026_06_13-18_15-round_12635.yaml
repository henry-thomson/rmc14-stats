roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Bor 'Stump' Knof, Johnson Wise, Jak 'Boot' Quinn, Apollyon Wills, Archie Logue, Stares-at-Stars, Thwig Starseeker, Jane Juliet.



  Medal Awards:

  Corporal Burns-the-Body is awarded the Distinguished conduct medal: 'For valour and dedication to duty. Corporal Burns-The-Body infiltrated deep into the backlines of a Xenonid hive in order to distrupt their operations and repair a vital sensors tower.


  Awarded by LtCol. Clyde McKinney on 13/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





