roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Mitrus Naughtus, Anne 'Artichoke' Powell, Scott Freeman, Boris Kuznetsov, Bryce 'Badger' Eliza, Laurencia Werner, Flint Pritchard, Swift Sara, Archie Cooper, Hydie AW Steyr-Hahn, Drake 'Dietcola' Di'Angelo, Crush Mcball, Dell 'Terra' Dellitrasse, Spinax 'Chewy' Bahama, Kiri, Act Right, Werner Waldmann, Tanner Johnson, Ashen-Sky, Vern Durgle, Reh-Jay 'A-2', Cahya 'Jawato' Purnama, Manuel Miller, Smoke Jyllian, Noms-the-Wires, Kalakian.



  Royal Jelly Awards:

  Prime Praetorian (FLA-777) is awarded the Royal jelly of proliferation: 'FLA, You have brought this hive many captures. Your work has brought many back to us and has allowed us to push back the tall threath from where they came.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Prime Warrior (JA-298-KE) is awarded the Royal jelly of slaughter: 'JAKE, You have slain and captured many talls this day. However, even more impressive is that you have called out and slain the beast.


  For this great achievement, I award you this jelly of slaughter.


  See you in the next hive!' by Ancient Queen (NEV)

  Prime Runner (RUN-406) is awarded the Royal jelly of proliferation: 'RUN, I have seen you teach the youngs today the way of running. You have took time out of this day to make sure our next generation will be able to fend for themselves.


  For this, I award you this jelly of proliferation for teaching the young runner herd.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Isadora AW Brooke's videos of Marine Mess-ups[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
