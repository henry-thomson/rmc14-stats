roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Praetorian (FLA-522) is awarded the Royal jelly of proliferation: 'FLA, you are one of the other prime oppressors, the one who YIP first looked up to for guidance when young. Today you have proven once again why you hold this title as you have managed to hold off the entire tall push into sensors.


  Your work together with your sisters was vital for stalling the talls and eventually causing them to rout.


  Not only that, your great hook managed to reel in around 10 talls today as well! A great addition to our hive and a strong part in why the talls eventually lost their momentum.


  YIP!!' by Prime Queen (YIP)




