roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Hivelord (DI-261-ES) is awarded the Royal jelly of resilience: 'During the time of your leadership, you lead your sisters to encircle the talls without even my order to do so. I never even planned it nor requested it you did on your own accord. it brought me tears seeing walls instantly surrounding the talls. I was so happy to see it. I wish you were still with us, but I will not forget your support in building up Dyna south section when talls left it. You were a great hivelord. Rejoice!' by Prime Queen (PRO)

