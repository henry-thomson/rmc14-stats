roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Burrower (KI-615-D) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, KID has deserved the royal award! KID managed to trap and utterly melt all of the talls! No matter how our sisters died KID  was omnipresent with her acid, and terror she sowed on the talls! Thanks to her efforts we managed to suffocate the talls even against our losses!' by Prime Queen (LIMA)

  Ancient Carrier (DA-558-VE) is awarded the Royal jelly of proliferation: 'Although I don't award jellis to the prime sisters, DAVE is too much of a valuable claw to not be recognized. Her reputation preceeds her, and we, just like the talls know what comes when DAVE becomes a carrier. Death, destruction, and new life! Incredible work on the captures, and organizing sisters!' by Prime Queen (LIMA)

  Mature Drone (M-24) is awarded the Royal jelly of rejuvenation: 'M was one of incredible use as one of the gardeners. She proved her might as the embodiement of a resilience by keeping everyone alive, and all too healthy for the eventual tall retreat. May her work continue, as sisters like her are of vital importance! Thank you M, thank you for keeping us alive despite are horrid tall diet.' by Prime Queen (LIMA)

  Ancient Hivelord (BL-692-DR) is awarded the Royal jelly of resilience: 'I would wish for BURG to be alive, as they and BLDR were the prime examples as a super duper lording team! Sad to see BURG go, however BLDR did no less work. Thanks to both of them, their dedication, and experience, the hive managed to recover from the losses. Our most honorable sisters kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Thank you BLDR and BURG.' by Prime Queen (LIMA)




