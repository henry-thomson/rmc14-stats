roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Axel 'Trench' Kapp.



  Royal Jelly Awards:

  Prime Praetorian (RAD-867) is awarded the Royal jelly of proliferation: 'Your dedication and your singular purpose of serving under my command have defined your very existence. 


  Under your supervision eye, our unwavering resolve, your indomitable will, and your desire to protect and preserve your fellow sisters during the planet darkest and most desperate hours, your insane dedication swiftly took its toll. 


  You came close to death for the sake of your sisters, never once wavering from your service in the hive.


  Your extraordinary abilities, and the mastery with which givin to you and utilized them, became the very shield that stood between survival and annihilation of the tall menance. 


  Thank you. RAD.' by Elder Queen (SVI)




