roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Charlotte Bennett, Darfman Forgemog.



  Royal Jelly Awards:

  Prime Hivelord (ZAO-559) is awarded the Royal jelly of rejuvenation: 'ZAO got all the build on cave camp ready in minutes together with MAT, JUAN and other hivelords. All of them worked amazing and got cave camp entirely built in a record time of 7 minutes, allowing us to encircle talls and wipe/capture many of them.


  While they might not think it was an amazing performance, i do think this record should be engraved on our memories. Rejoice my sister!!' by Prime Queen (RP)

  Elder Runner (OXD-856) is awarded the Royal jelly of sabotage: 'Your mother was careless and overextended, eventually getting to critical condition in resin. While they were half acid and wanting to burst, they still took the hive at a higher priority and sacrificed their life without a big boom to give me enough time to recover.


  Rejoice my daughter, may your acid be eternal!!' by Prime Queen (RP)




