roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Omareth 'Venom' VonRichten, Ocean Rain, Ula-Beem, Erin 'Damn' Baker, Mizooki 'PillBug' Akiya, Gnaws-on-Bones, Kyriss 'Snow' Winters, Brings-In-Catch, Samuel Gonzales, Abigail Dawkins, Isabell Mueller, Urist Steelbraid, Slick Daylight, Gooby Doober, Hercules 'Grillmaster' Moeller, Lance 'Stuns' Scratch, Angela Whittier, Markus 'Packrat' Dagonet, Blobby Oozeworth, Yao Cometside, Kusaka Zhopki, Samuel Winters, Ajax Graves, Elfyn Musca, Bramus Rockhand, Betty Bingus, Seymour Jenkins, Alejandro Kepplinger, Holden Franks, Ilina Belyaeva, Rury Harzon, Adelice Delahoussaye, Hermes Tritrium, Spike MacLagan, Crimson Marcotte, Bobert Brockson, Bloop Plap, Ted Nighteyes, Jemmy Cornhusk, Deinopis Dispar, Tunnel-building Scamper.



  Medal Awards:

  Stu 'Stew' Lizo is awarded the Medal of valor: 'Hastily and bravely rushed forward at the order of Captain Drakonovisch to assault the XX-121 Queen and rescue injured and revivable marines. Your actions today ensured that the XX-121 did not sustain any meaningful advantage against us, allowing this operation to proceed smoothly. 


  Awarded by LtCol. Cryopagius Lividus on 11/9/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Willow Temnora is awarded the Distinguished conduct medal: 'Sergeant Temnora served as a breacher and a watchful eye. Their efforts in opening the battlefield and watching the backline aided

  in preventing a wipe that could have cost us the entire operation.


