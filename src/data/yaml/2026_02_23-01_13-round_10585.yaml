roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Simon Jyllian, Raises-The-Bar, Scully 'Crossbones' Mason, Boris Scavmanchez, Matthew 'Rain' Aoboshi, Gary C Humperdink, Venz Lammergeier.



  Royal Jelly Awards:

  Elder Drone (KI-25-T) is awarded the Royal jelly of slaughter: 'Your timing with your acid bomb was nearly stopped, but because of that it was all the more glorious when it hit. You wiped an entire squad of talls in one moment which shook the Metal Hive to their core. With one act you swayed the stalemate into a win and showed just how deadly one runner can really be.


  With this grand feat, I award this Jelly of Slaughter. May the hive remember your actions today.' by Elder Queen (INDY)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
