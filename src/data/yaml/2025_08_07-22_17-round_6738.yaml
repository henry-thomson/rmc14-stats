  [color=green]The xeno hive was thrown into disarray after losing its xeno Queen![/color]


  Medal Awards:

  Vince 'Dog' Petrov is awarded the Medal of valor: 'Not only did Squad Leader Vince Petrov lead his team with extreme skill, and smart aggression. But above all else to earn them this honrable medal is their willingness to act fast, without hesitation. We almost lost our Alpha SADAR, a vital soldier in our ranks. The Queen and her horde were all over the tight confines of the Aerodome vessel. SL Petroc did not falter, and pushed in immediately. Preventing the gib of our dear SADAR, fearlessly defying the Queen. Congratulations, SL.'





