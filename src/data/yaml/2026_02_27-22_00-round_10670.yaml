  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rat 'Bug Eater' Titi, Slim Cognito, Buster 'Geezer' Alter, Holding of Root, Burns-The-Flowers, Mim-Sigerthe, Nibbles Squeakerton, Delmar.



  Royal Jelly Awards:

  Elder Burrower (FIG-617) is awarded the Royal jelly of sabotage: 'FIG was one of the greatest burrowers the hive has seen, often charging towards heavy spitters to tremor just to synch with her sister the boiler, She is truly an example for the hive for her communication and her coordination.' by Elder Queen (BUH)

  Mature Ravager (SHE-695) is awarded the Royal jelly of slaughter: 'A daughter that meticulously follows orders and quickly calls on her sister to organise a group that will slaughter group of seperated talls, Saved me in two instances. Killed Tuber AND firewalker to them ending up getting gutted.' by Elder Queen (BUH)




