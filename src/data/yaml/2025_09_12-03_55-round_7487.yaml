  [color=purple]The xenos hijacked a dropship[/color] [color=yellow]but the Almayer crashed before the remaining marines could escape![/color]


  In memoriam of our fallen soldiers:

  Missel Wurz Von Hely, Bravely-Runs, Erika Wehling, Tyrii Amethyst, Eliza Hook, Big Cheddar, Nyx Sparkdrawn, Allen Agent, Jane Gerber, Swift Burrows, Mike 'GC' Mueller, Stefan Wolle, Azzyleom 'Real' Innmeyth, Greg GrassBeard, Wesley 'Irish' Jemison, Korgash Burnt taco Ylora, Paduxi-Utamukeeus, Larfin Agarbrow, Eager 'Piano Man'  Avery.



  Royal Jelly Awards:

  Ancient Praetorian (TO-646-MB) is awarded the Royal jelly of slaughter: 'Your claws are sharp, your tail is long, and your instincts unmatched. Despite many setbacks, you continued to kill and kill and kill, producing a massive pile of tall corpses in the Battle of Lambda Labs, buying us criticial time needed to recover losses. For your services, I give you this jelly of  slaughter' by Elder Queen (CMP)

  Elder Praetorian (CK-561) is awarded the Royal jelly of slaughter: 'You are swfit as wind, yet as deadly as the sharpest fang, you daughter were instrumental in our fight against the talls. You providing much needed ranged attack during the Battle of Lambda Labs, allowing your sisters to continuously provide constant presssure. Were it not for you in critical junctures, we would have likely not held as long as we did. Well done!' by Elder Queen (CMP)




