roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Sophie Bakir, Pierre 'Quasimodo' Girard, Ronald Laborde.



  Medal Awards:

  Jothua 'Mothua' Mothington is awarded the Distinguished conduct medal: 'Diligently held the line of our flanks under my orders. The results of such were as clear as day, seeing as the bugs tried and failed multiple times to break your hold, with devastating losses.


  Awarded by Col. Scraps-the-Copper on 9/7/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Cody Lewis is awarded the Distinguished conduct medal: 'A fantastic shot with the M5-ATL, and one I got to see in person. What an honor, and what a flush of adrenaline it was when you slew the queen in front of half the company. 


  Awarded by Col. Scraps-the-Copper on 9/7/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





