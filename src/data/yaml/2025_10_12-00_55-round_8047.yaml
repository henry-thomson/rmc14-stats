roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Papil Ceru.



  Medal Awards:

  Stu 'Stew' Lizo is awarded the Bronze heart medal: 'The FOB you were responsible for today stood the test wrought upon it - a xenonid hive hellbent on breaching our lines and taking everyone inside.


  In your efforts to prevent this fate, you gave your life. Excellent work, and may your cades stand high and forever.


  Awarded by Col. Scraps-the-Copper on 10/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Jim 'Smokey' Werner is awarded the Distinguished conduct medal: 'Was thrust into the position of leadership of Bravo squad after their squad leader gave their life in the defense of the FOB and it's people. Kept these rowdy bunch together and efficient under the most trying of circumstance.


  Thank you.


  Awarded by Col. Scraps-the-Copper on 10/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





