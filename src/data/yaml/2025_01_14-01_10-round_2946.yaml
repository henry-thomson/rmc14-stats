  [color=green]All of the xenos were wiped out![/color]


  Medal Awards:

  Atrapos Emperor is awarded the Distinguished conduct medal: 'Great shooting today, a commendable effort to be sure. Your rockets rang true as they blew up many a xenonid in our way of victory.'

  Ruka is awarded the Medal of valor: 'Felled three xenonids in close quarters combat today, armed only with a fireaxe and a fiery spirit bent on killing. Though your methods are questionable, you no doubt have a heart of steel.'

  Mark 'Blacklung' Sholl is awarded the Distinguished conduct medal: 'Fine shooting today. It's not often that someone sees a sniper before their decisive shot - but we noticed today, and that sure says something.'

  Grady 'Ironheart' Clark is awarded the Distinguished conduct medal: 'Excellent leadership of Delta squadron today. Some might say that Delta is the rowdiest of the bunch - but you kept them in line and focused!'




