  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jat-Wumeek, Kall Kallovski.



  Royal Jelly Awards:

  Prime Ravager (CHO-448) is awarded the Royal jelly of slaughter: 'This sister felt like the monotone black color of our resin is out of touch and choose to paint it in red, i like the new style. I wonder if it will ever dry off with how many talls she killed...' by Prime Queen (BUH)

  Elder Drone (RW-463) is awarded the Royal jelly of rejuvenation: 'My last ounce of acid almost dripped out of my wounds, but RW merged her body into me giving me enough forces to go back into cover. There was a hero among us... but nobody knew her name... I hope this jelly will change it.' by Prime Queen (BUH)




