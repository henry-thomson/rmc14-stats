roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Lyzara Vaelora, Tabbathia Horn, Andre Catleay, Stefan Wolle, Amythia Whitefire, Kylee Wible, Albrecht 'Alby' Herrmann, Franz Schaefer.



  Medal Awards:

  Yips-and-Yaps is awarded the Distinguished conduct medal: 'Sergeant Yips-and-Yaps killed many xenonids today, scoring detrimental hits on the Xenonid hive, killing their queen, which allowed us to score an advance into the Central caves. Good work Sergeant.'



  Royal Jelly Awards:

  Mature Hivelord (MO-226-P) is awarded the Royal jelly of slaughter: 'As acid runner suicide bombed the central cave entrance death hold through heavy tall resistance, it was the push that we needed which lead to talls running away. Many talls also rotted at the spot. This bomb also gave the hive an amazing place to hold, scaring the talls and making sure they will never come back. Good job' by Elder Queen (FISH)

  Ravager (XX-166) is awarded the Royal jelly of resilience: 'For living the fight groundside, a hellish battle with many events including the queens death, her mind was strong and she never gave up during the fight. This ravager also tanked alot of tuber shots with her thick carapece' by Elder Queen (FISH)

  Young Ravager (B-629-B) is awarded the Royal jelly of resilience: 'For her strong mind and claws. She lived through the hellful fight from the start to the ends, even tanking many tuber shots. She was a strong ravager who protected her other sisters aswell' by Elder Queen (FISH)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
