roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kara 'Bait' Smith, Flave Flanc, Stella 'Lumi' Strut, Mira Dragonovic, Spits-The-Fire.



  Royal Jelly Awards:

  Prime Hivelord (VY-384-NL) is awarded the Royal jelly of proliferation: 'My dear prime daughter, I give you this jelly as a token of appreciation for what youve done today

  I am very grateful for you dedication, youve been here with me from the start, you have been building nonstop

  dyna, east caves, everything i have asked for, you have built it

  I am really really grateful you have been here with me today

  may squish be with you

  with love -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Mature Praetorian (CO-84-S) is awarded the Royal jelly of resilience: 'My dear mature praetorian CO-S

  You have stayed by my side since the start

  Learning the ways of a valk, you have shown great ambition and dedication, I can see that in the future you're ought to become a great prime valk daughter

  You enraged many of my daughters, screamed well many times, I am very grateful for your will today

  With love -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Ancient Warrior (CD-522-V) is awarded the Royal jelly of sabotage: 'My dear daughter

  I give you this jelly of sabotage, for lunging onto the boomstick special tall, without your initiation capturing them would definitely not be possible at that time. With your quick reaction for this, I feel you are deserving of a jelly.

  With love -- Ancient Queen SQSH' by Ancient Queen (SQSH)




