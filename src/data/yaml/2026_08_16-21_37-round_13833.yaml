roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Liana, Evan Pierce, Sero Veil DecadentStar, Lesly Muggins, Tazzli, Jeanne AW Le Prieur.



  Medal Awards:

  First Lieutenant Saani 'Nudget' Goldenfur is awarded the Distinguished conduct medal: 'The UNMC's strongest LO has provided excellent support for the entire operation throughout all of the trials and tribulations we went through today. Your conduct made sure our marines were well supplied.


  Awarded by Lt. Colonel Breaks-the-Tides on 8/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





