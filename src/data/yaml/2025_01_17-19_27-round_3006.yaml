  Harlon Wolf is awarded the Distinguished conduct medal: 'A Staff Officer more than capable of their duty, and proved it this deployment. Their management of Alpha ensured they were always cohesive, and effective.'

  Edgar ''Bloodbag'' Carmille is awarded the Distinguished conduct medal: 'Not onyl delivering excellent news, but assiting in retaking the Almayer in a time of crisis. A Reporter you can trust in the field, and on TV.'

  Faylin 'Le Fey' Kaysis is awarded the Distinguished conduct medal: 'For keeping practically an entire army alive and healthy. Nothing gets sick on their watch. Everything prospers!'



