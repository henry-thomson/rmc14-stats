  Wets-the-Drystone, Fischer AW Foxhound, December AW Zweihander, Rinka Izumi, Zeke Weller, Chews-the-Wires, Dahlia Droop.



  Royal Jelly Awards:

  Prime Praetorian (YIP-802) is awarded the Royal jelly of resilience: 'My daughter YIP you lead a team of sisters to stall the talls as they pushed. Your work bought me time with others to decimate the talls numbers. Not only that you captured many talls with your team and for that I gift you this Jelly for your work. REJOICE!' by Elder Queen (FOP)

  Ancient Ravager (JA-298-KE) is awarded the Royal jelly of sabotage: 'My daughter JAKE your ability to probe the talls weak points and effectively exploit them does not go unseen. You lead the fight not only helping in capturing but weaking the yellows talls by rotting their leader. For your work throughout this fight I reward this Jelly. REJOICE!' by Elder Queen (FOP)




