roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ashlynn Duval, Garret Webb, Yoko Burren.



  Royal Jelly Awards:

  Boiler (CL-327-B) is awarded the Royal jelly of proliferation: 'For a boiler, you did what your purpose served you for. 


  However, many sisters praised you on your proficiency as a boiler. You lived long enough to be noticed by me, she who perished thrice, yet you prevailed longer than my existence alone, let alone your ability of effectively using it.


  You did an amazing job in stalling the Tall out while we suffered through the hours of war without the presence of the queen. 


  Grand work, CLB.' by Ancient Queen (SVI)




