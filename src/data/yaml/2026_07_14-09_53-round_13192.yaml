roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Drone (KAY-923) is awarded the Royal jelly of rejuvenation: 'KAY was just outright a master of her craft! She was constantly working overtime for her queen and sisters. Always growing incredible artisan quality alacrits, shields, and health for the healers! Supreme work KAY, what a joy to have you be part of this conquest!' by Prime Queen (LIMA)

  Ancient Drone (DW-704) is awarded the Royal jelly of rejuvenation: 'Although I don't award jellies to the apex sisters, this one is an exceptional one. DWs powerful stomppers making tall dizzy and incapable of fight at just the right moment! They saved many of their sisters, and now matter how many times they die, heroes never die! DW is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)

  Elder Drone (XX-319) is awarded the Royal jelly of rejuvenation: 'Young and anonymous sister played a vital role in saving us from the talls! The heroes within the hive are numerous, yet hard to see. You wasted no time, sharing your body with that of another sister. For this act of the ultimate work towards making the hive a better place for us all, it is with joy to have you with us. Dont be a stranger! Help us again!' by Prime Queen (LIMA)




