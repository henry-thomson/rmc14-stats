roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Reika 'SweetTooth' Inazuma, Carlos Walker, Mizooki 'PillBug' Akiya, Rag-'Crispy'-Heem, Yeo 'Sakura' Bunnia, Marco Mrajich, Miguel 'Padre' Santiago.



  Royal Jelly Awards:

  Prime Carrier (RAD-349) is awarded the Royal jelly of proliferation: 'Our last remaining carrier, this daugther supported the warriors and secured many critical captures. Without her efforts more than half of our hive would not be here today. The job of a carrier often goes unoticed against the war party of the hive. But you stood out. It is always a pleasure having you in our hives. Rejoice!' by Prime Queen (ARG)

  Mature Boiler (MOP-288) is awarded the Royal jelly of slaughter: 'MOP was our last remaining boiler, giving her life for her queen. Without her sacrafice in the final moments of the battle this day would not have been won. Her efforts secured the final victory over the tall invasion, we honour your work with the death of all those talls who stood against you. Bravo!' by Prime Queen (ARG)

  Drone (XX-310) is awarded the Royal jelly of resilience: 'One of countless drones who have supported the hive. You distinguished yourself in the greatest way possible. You earned the love and respect of your hive. Weeding, supporting other sisters, and providing fruit. Without your constant effort, this hive would not have stood. Rejoice!' by Prime Queen (ARG)

  Mature Hivelord (RE-615-D) is awarded the Royal jelly of resilience: 'One of the few remaining hivelords, you have distinguished yourself today, earning the most difficult achievement. The love and respect of the hive. We always had mighty walls to face the tall invasion thanks to your efforts. we look forward to seeing the prime you will become. Rejoice!' by Prime Queen (ARG)




