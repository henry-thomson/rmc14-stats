roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Preston A Count Muzhper, Alexsandr 'Pinky' Kasper, Licks-The-Fruit.



  Royal Jelly Awards:

  Ancient Carrier (BU-41-B) is awarded the Royal jelly of sabotage: 'For her incredible work as a carrier of supreme caliber, BUB has deserved the royal award! Sister managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war, she was a partial mother to the rest of the hive as one of the two carriers. Oh how we becon BUB to help the further hive expansion! May her children are plenty!' by Ancient Queen (LIMA)

  Mature Carrier (NA-273-P) is awarded the Royal jelly of rejuvenation: 'I don't understand how NAP managed to achieve it, truly still a miracle even a mother cannot fathom! However, sister stayed true to the Queens plans, eternally glued to my side. No mattter the situation NAP was there, when I was healthy NAP was there, when I walked over them NAP was there, when we slaughtered talls left and right NAP was there. For her incredible work it is joy to award her jelly of the highest quality! May sister help us in the future as well.' by Ancient Queen (LIMA)




