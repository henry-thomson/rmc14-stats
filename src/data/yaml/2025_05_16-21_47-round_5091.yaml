roundEndText: >2-

  [color=purple]The xenos hijacked a dropship[/color] [color=green]but were wiped out by the marines![/color]


  In memoriam of our fallen soldiers:

  Camden Cox, Darius Bohrumbeard, Randy 'Raghetti' Rodrigues, Kalakian, Sigma Draconis, Elias 'Donut' Bennett, Renault 'Ren' Demuth.



  Medal Awards:

  Althea Leander is awarded the Distinguished conduct medal: 'Althea Leander, during the events of Operation Recon Spartan-Cigar took on the duty of the demolitions specialist. Even when things were looking most dire, Leander never lost their fighting spirit and they continued to fell bug after bug. Their performance gave the marines hope when there would otherwise be none.


  Thank you.'



  Royal Jelly Awards:

  Elder Burrower (NI-26-KI) is awarded the Royal jelly of resilience: 'You as a burrower valiantly capped many talls, but not only this, you saved my life when I foolishly made a mistake. For this I find it obvious that you deserve the jelly of resilience, and my upmost gratitude for keeping not only me; but the hive alive and well.' by Ancient Queen (SEA)

  Young Lurker (KL-49-P) is awarded the Royal jelly of sabotage: 'Despite the odds, you managed to capture a dangerous lurker tall by yourself. This is a feat that should be rewarded with no less than the jelly of sabotage, and be remmembered by the hive for generations to come.' by Ancient Queen (SEA)

  Prime Runner (PRO-767) is awarded the Royal jelly of sabotage: 'Greatly, you captured a lurker tall for the hive with the help of some sisters. This is an imppressive achievement that I believe should be rewarded with the jelly of sabotage.' by Ancient Queen (SEA)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



