roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jeb Sandford, Mota-Ocheeva, Rhesa, Mason 'The Weasel' Lloris.



  Royal Jelly Awards:

  Ancient Defender (LO-390-VE) is awarded the Royal jelly of proliferation: 'You performed amazing as a defender, being a first in to many talls to trip them so we could capture them. You dragged as asked and didnt ask questions. A silent work horse. Thank you daughter.' by Elder Queen (EKAJ)

  Prime Drone (DU-23-CK) is awarded the Royal jelly of resilience: 'You proved your loyal soul to me instantly when you saced to keep me alive from planet talls, I am VERY greatful you kept me alive. You saved sisters time and time again and always got back up. Thank you daughter.' by Elder Queen (EKAJ)

  Mature Runner (KY-354-R) is awarded the Royal jelly of sabotage: 'You, as a younger runner, did exactly what I expect of the caste. You gave accurate and timely communication with myself to time rotations between hiveminds. You further showed me skill with slowing down talls for the horde. I wish all young runners were like you daughter. Thank you daughter.' by Elder Queen (EKAJ)




  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



  [bold]Hive established by [color=purple]Momma Kanin's Sandal[/color]![/bold]
