roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Hivelord (ESQ-219) is awarded the Royal jelly of resilience: 'Our incredibly capable sister played a vital role in terrorizing the talls! Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. Her mighty walls stood high and strong just like the hive. We can only hope she will help us surround the talls again!' by Ancient Queen (LIMA)

  Young Burrower (WQ-454) is awarded the Royal jelly of sabotage: 'Sister work tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Always alive, yet always present on the front, how is that even possible?! Your contributions is what makes us succeed.' by Ancient Queen (LIMA)

  Elder Drone (WL-337-F) is awarded the Royal jelly of rejuvenation: 'Sister proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Eternally stuck to the queen like a bad tumor, but in a good way of course! By the queen can we not even comprehend her true powers as she reaches older age! May the future hives be blessed with her presence as well.' by Ancient Queen (LIMA)

  Young Praetorian (INK-206) is awarded the Royal jelly of proliferation: 'INK was a prime target for all of the talls! No matter what they did though she was always battle ready, saving sisters over and over again. She powerful stomppers making tall dizzy and incapable of fight at just the right moment! They saved many of their sisters, and killed just as many talls, directly or indicredly. The fate of the future hives depend on their participation!' by Ancient Queen (LIMA)

  Mature Drone (ZE-135-L) is awarded the Royal jelly of rejuvenation: 'ZEL was just outright a master of her craft! The award is somewhat shared with other healers but ZEL was one of the best. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. Talls pushed us, and ZEL said no thank you, not on my watch. In an instant the whole hive was splitting the talls apart, limb by limb. Praised be the queen mother, all future wars will be won with her by our side!' by Ancient Queen (LIMA)




