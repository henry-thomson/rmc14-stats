  Royal Jelly Awards:

  Young Carrier (XX-421) is awarded the Royal jelly of proliferation: 'For making well made traps that talls foolishly fallen for during the engagement of east side of Casino hallway of the doom. 


  You made a laughing stock out of every tall pushing your way, apparently the entire frontline decided to be at your position, and put themselves in a horrible situation, because of your efforts. I am bestowing this jelly for your hard effort, that was because your performance was amazing to watch. 


  I appreciate every second you were with us, may I see more of your work in the future. 


  Rejoice!' by Prime Queen (PRO)




