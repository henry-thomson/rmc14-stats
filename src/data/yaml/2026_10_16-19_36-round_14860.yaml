roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Komi, Olivia 'Livvy' Croft, Margaret White, Klein Moretti, Ace Starseeker.



  Medal Awards:

  Lance Corporal Sam Turner is awarded the Distinguished conduct medal: 'Lance Corporal Turner showed he was the one surviving pyro. He stuck with the squad and flamed for the squad. At key cave operations he kept the queen and her horde from wiping us. Exemplary work for a first op spec. They have caught our eye and we hope to see more of their work in the future. Well done!



  Awarded by Lt. Colonel Breaks-the-Tides on 10/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





