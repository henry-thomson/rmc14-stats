roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Ravager (PS-83-Y) is awarded the Royal jelly of slaughter: 'You were the beast, the absolute berserker of the hive.


  I don't recall every sort of detail but I will recall the most magnificent rage I ever seen. You actually committing and destroying talls left and right, you were a true berserker.


  You were mostly and probably are the main reason talls got wiped north of meridian, one engagement 10 talls dead!


