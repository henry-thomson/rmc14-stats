  Medal Awards:

  Peter Tireman is awarded the Distinguished conduct medal: 'Committing to a deep dive in uncharted territory to repair the sensor tower, giving the marines the location of the xeno tunnels and other key intel during the operation.'

  Cure Elim is awarded the Distinguished conduct medal: 'Committing to a deep dive in uncharted territory to repair the sensor tower, giving the marines the location of the xeno tunnels and other key intel during the operation.'

  Tides-of-Gray is awarded the Distinguished conduct medal: 'Recommendation made by 2ndLt. Connor Cadis On the behalf of SSgt Tides-Of-Grey for "Incredible performance on keeping his squad together and pushing when ordered. He has followed every map direction t'



  Royal Jelly Awards:

  Young Spitter (RA-948) is awarded the Royal jelly of resilience: 'The others didn't see it, but you are the only reason I stayed alive. Your sacrifice let the hive endure, and you tanked with everything you had. You are a hero, thank you.' by Prime Queen (HSQ)




