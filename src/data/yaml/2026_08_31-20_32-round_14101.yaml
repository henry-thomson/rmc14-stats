roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Manuel Miller, Rhea Hale, Iona Kotov, Mia Cooper, Evad Esrever, Kade Kepplinger, Hercules Andromedus, Ardy 'Ape Man' Guy, Karoline 'Opossum'  Whittier, Amber 'Unlucky' Summer, Hudson 'Hungry' Demuth, Alexander Bowman, Derick 'Naptime' Hunt, Dante Minnie, Giovanni 'Brisket' Guess.



  Royal Jelly Awards:

  Young Hivelord (XX-278) is awarded the Royal jelly of proliferation: 'My dear young hivelord

  From the start, which i am proud of you have accompanied our designer hivelord HY-L, helping them build up our defences

  Be it, at the beginning taxing marshal, bar and hydro

  Into then moving to build civ valley and med as I've asked

  I truly am grateful for your hard work today my dear daughter

  It is a shame you have lost this body and your mind have had to return to hivemind

  I can feel you will make a great prime daughter

  With Love -- Ancient Queen SQSH' by Ancient Queen (SQSH)

  Mature Hivelord (HY-223-L) is awarded the Royal jelly of proliferation: 'My dear mature lord HY-L

