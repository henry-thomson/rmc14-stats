roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Buck 'Pretty' Tern, Tivii, Manuel Miller.



  Medal Awards:

  Lance Corporal Svyatoslav Yevgenyevich is awarded the Distinguished conduct medal: 'Lance Corporal Svyatoslav was for a long duration of this operation the sole XM51 operator and responsible for the majority demolition of walls.


  I am certain that without them, we would've had to concede much sooner, if at all. Carry on Lance, you do me proud.


  Awarded by LtCol. Kaitlin Zalack on 08/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





