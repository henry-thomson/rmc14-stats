roundEndText: >2-

  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Vairel 'Scorne' Kilgrim, Mike 'GC' Mueller, Mimics-the-Jungle, Rhox 'Tanker' Jaex, Yinz Anole, Chilwir 'Chilli' Drumarz, Iris 'Tempest' Cookia, Alonso Rodriguez, Slowy Garrison, Fiona Dimeling, Pena Ikari, Robin Olds, Sigma Draconis.



  Medal Awards:

  Helena Machado is awarded the Distinguished conduct medal: 'Provided accurate OB coordinates that assisted us greatly in sealing the fate of the xenonid hive.  With this strike, we took out their hive core and resin defenses, leaving nothing but scorched earth for our boots to trample over them.'

  Althea Leander is awarded the Distinguished conduct medal: 'Excellent work leading the intelligence officers groundside, as well as performing body recovery and and routing your fellow intel gatherers efficiently. There was not much in the way of support personnel in the opening half of the operation, but you made it all work regardless. Thank you!'





  [bold]Operation funded by [color=green]Osborn Curry's majestic hair.[/color]![/bold]



  [bold]Hive established by [color=purple]Fritz's CLF Cell[/color]![/bold]
