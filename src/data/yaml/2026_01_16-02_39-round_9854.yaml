roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Defender (CMP-487) is awarded the Royal jelly of resilience: 'For self sacrificing when an oppressor got tubed, you decided to fortified, which made it where they can run away safely preventing their death.


  Great job to you, and I hope to see more of that!


  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (MA-722) is awarded the Royal jelly of proliferation: 'You built up west of botany, when hive weed killer disappeared, and it was instantly pin wheeled hell for the talls.


  Amazing job, to you!


  You made it were talls retreat was an utter failure because they decided to not use sky fire to leave and go through 20 pin wheels of doom!


  Rejoice!' by Prime Queen (PRO)

  Young Drone (XX-731) is awarded the Royal jelly of proliferation: 'For a youngster, you did an amazing part making up west of botany with an hivelord, that made the walls. You decided to put your effort into making sticky and speed resins!


  That is amazing and it help us tremendously and keep up with the talls backlines at ease.


  rejoice to you, for this was deserved!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



