roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Carrier (BA-112-D) is awarded the Royal jelly of proliferation: 'Constant hugging, spending time with children, seeing them grow, occasional murder of a tall. Such is life of a carrier! Who would complain really? BAD sure as hell would not! Incredible work BAD! You were the only carrier around, since the humble beginnings, up until the utter slaugher of the talls! You stood the test of time, and became the future nesting mother! Oh BAD, please help us in our conquest!' by Prime Queen (LIMA)

  Elder Drone (VAN-145) is awarded the Royal jelly of rejuvenation: 'Sister VAN proved her undying dedication to the art of harvest! She kept healers alive and healthy which in turn providen an always battle ready hive. Eternally stuck to the queen like a bad tumor, but in a good way of course, she provided the necessary speed and zest to every scream! By the queen can we not even comprehend her true powers! May the future hives be blessed with her presence as well.' by Prime Queen (LIMA)

  Mature Hivelord (YAY-116) is awarded the Royal jelly of resilience: 'Our most honorable sister YAY kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. The tall suffering was just a question of time, and YAY we delivered! Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Prime Queen (LIMA)

  Ancient Drone (YUU-176) is awarded the Royal jelly of rejuvenation: 'Sister YUU was just outright a master of her craft! She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. Talls pushed us, and YUU said no thank you not on my watch. In an instand the whole hive was splitting the talls apart, limb by limb. Praised be the queen mother, all future wars will be won with her by our side!' by Prime Queen (LIMA)

  Ancient Burrower (AOF-852) is awarded the Royal jelly of sabotage: 'AOF worked tirelessly on making sure the whole hive can travell all over place! When she was not creating a tunnel after tunnel, she managed to trap and utterly melt all of the talls! You could see them screaming and their flesh and spitters melting. Always alive, yet always present on the front, how is that even possible?! You must help the hive again, your contributions is what makes us succeed!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
