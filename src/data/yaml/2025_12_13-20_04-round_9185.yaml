roundEndText: >2-

  The SPP operation to seize Bosnemori Basho ended in catastrophic failure. Initial landings met no resistance, but investigation revealed the colony had already fallen to a xenomorphic infestation.


  SPP forces and the 271th Reservist Platoon were ambushed in the underground tunnels and suffered severe casualties during a fighting retreat. Survivors were forced to hold the landing zone under constant attack while awaiting delayed extraction under heavy interference.

  Bosnemori Basho is declared lost.

