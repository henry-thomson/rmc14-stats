  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Faces-The-Carrots, Screams-A-Lot, Droog Drystone, Manuel Miller, Sebastian 'Squish' Eventide.



  Royal Jelly Awards:

  Prime Ravager (NEV-664) is awarded the Royal jelly of slaughter: 'By claw and by fang, by brutalilty and by cunning, you are the ravager.


  During the darkest hours of when the hive was without a queen, during the times when hive did have a queen but was on the backfoot nontheless, you slaughtered talls by the dozen. Even alone, you did it, and your massive wipes slowed tall progress to a crawl. Without your wipes, the talls would have been able to gain so much more progress. It would not be remiss to say you were a key factor in a victory. 


  For your efforts, i give you this jelly of slaughter. Long may you ravage. REJOIJCE' by Ancient Queen (CMP)




