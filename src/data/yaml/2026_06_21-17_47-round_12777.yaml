roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Clarissa 'Clara' Maddux.



  Royal Jelly Awards:

  Ancient Praetorian (FR-559-NC) is awarded the Royal jelly of proliferation: 'One of my many Dancer daughters, this mind distinguished herself in the invasion of the talls. On each and every scream this daughter returned with a capture. Her dedication to growing my hive has not gone unnoticed. Many of your sisters owe you their lives. Bravo!' by Prime Queen (ARG)

  Prime Ravager (LI-200-MA) is awarded the Royal jelly of sabotage: 'One of my ravenger daughters, and arguably the most brave. When the metal beast was trapped, she did not fear, she did not run. Charging the metal beast she struck blow after blow disabling her. This allowed mother to capture the metal beast tamer. A brave daughter indeed, we all wish to show her dedication!' by Prime Queen (ARG)

  Young Carrier (XX-618) is awarded the Royal jelly of proliferation: 'Dispite her young age, this daughter distingushed herself, earning the respect and love of the hive. She made the ultimate sacrafice, giving her life for all of us. Working together with VOW an oppressor, she was able to secure many captures and stall the tall invasion. Without her efforts many of us would not be alive today. Rejoice!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Cocaine Accessories[/color]![/bold]
