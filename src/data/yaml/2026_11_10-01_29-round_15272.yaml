roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alicor 'Pinkie' Merow.



  Royal Jelly Awards:

  Ancient Runner (SA-432-D) is awarded the Royal jelly of slaughter: '"You truly know your value, don't you? Do you? It seems like you did."


  The world may have viewed you as a weakling, a martyr among Acid Runners, but you had a different view of the world. You understood the meaning of fighting for your hive, your cell, your Acid Sprout, and your roots against the Tall doom.


  You went through dedication to earn your acid, and you intended to utilize it to its fullest. In the end, you did exactly that. You committed yourself to slaughtering the Tall at the Battle of North Hydro, managing to kill and wipe out the Tall menace, ceasing their movement and stopping their advance as they laid siege upon your hive.


  You became the true Martyr of the Hive, a hero who never expected to become one.


  This Jelly is special, as it is the first Jelly ever given to a Runner like you. Your performance astonished me. It was said that you were special in my hive, one of the best Acid Runners.


  You fought for your hive until the very end.' by Prime Queen (SVI)




  [bold]Operation funded by [color=green]The Kanin Family[/color]![/bold]



  [bold]Hive established by [color=purple]Lilith's Xenonid Research Division[/color]![/bold]
