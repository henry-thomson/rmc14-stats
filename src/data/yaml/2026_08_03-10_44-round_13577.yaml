roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Panacea.



  Medal Awards:

  Gunnery Sergeant Screams-A-Lot is awarded the Distinguished conduct medal: 'For excellent in leadership and conduct, Gunnery Sergeant Screams-A-Lot successfully defended strategic points in the AO. They did this by keeping their squads, morale and cohesion perfect, whilst ensuring adequate defences were constructed. When the time to strike came, they dealt a decisive blow to the enemy, turning the tide of the operation.


  Awarded by LtCol. Clyde McKinney on 3/8/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney

  Second Lieutenant Tabula AW Morningstar is awarded the Distinguished conduct medal: 'For truly exemplary and unflinching commitmend to duty. Despite operating for over 2 hours under extreme duress against a Xenonid horde and being the only survivor of the intelligence team, Second Lieutenant Morningstar maintained the highest discipline and proved instrumental in the success of the operation.


  Awarded by LtCol. Clyde McKinney on 3/8/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





