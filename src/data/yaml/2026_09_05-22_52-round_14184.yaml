  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Molto Quibbles, Joshua Lee, Slowy Garrison, Jade Ware, Elroy Aegyr, Dysdera Walckenaerius, Ramiris 'Psyop' Aether, Deino-Leem, Marshall Poley, Elias 'Donut' Bennett, Jacob Wilkerson, Thurgood Ryebell, Johnathan 'GunNerd' Falena, Noms-the-Wires, Yuki Laurent, Cassian Baer, Alaz-Vultaren, Ivan Petrenko, Antoine Tchou, Nicholas 'friendly' Garneys, David 'Dig' Diggle, Maa-Chaa, Cooper Wright.



  Medal Awards:

  Corporal David 'Dig' Diggle is awarded the Bronze heart medal: 'for keeping sensors alive as long as you possibly could. keeping our live feeds updated with the enemy positions. your sacrifice will be remembered and honored in the hall of the dead


