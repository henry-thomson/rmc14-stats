roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Chip Philips, Purp Winter, Tullop 'Chayn Sark', Juron 'Disaster Girl' Vesnik, Astolphus MacGillycuddy.



  Royal Jelly Awards:

  Mature Hivelord (XX-659) is awarded the Royal jelly of resilience: 'For you work constantly building our hive.


  You built on land that the talls have taken time and time again.

  Such work is tireless, and often thankless. But it is the backbone of our hive.


  Well done.' by Ancient Queen (HEK)

  Prime Praetorian (RAD-766) is awarded the Royal jelly of rejuvenation: 'For your work as a Valk, saving not only my life- but the lives of your sisters.


  Your actions have directly attributed to our victory. Well done.' by Ancient Queen (HEK)

  Prime Lurker (PRO-869) is awarded the Royal jelly of proliferation: 'For your work teaching a new way to lead a hive.


  Teaching is a task that we rarely have time to do.

  It is, however, the most important task, and today- it meant victory.


  You are not short of jellies, but let this one be a example of doing things differently.


  Well done.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
