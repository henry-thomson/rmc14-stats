roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Russell Dennis, July Baker, Juron Vesnik, Nora 'Eisen' Redwood, John 'Rook' Weller, Gives-The-Fish, Deandre Mathews, Sah'avii 'Yaps' Winters, Hoopoe 'Greenie' Quetzel, Jeff Dots, Nikenen McJaggernuts, Zyleomaz 'Neutral' Innmeyth, Purp Winter.



  Royal Jelly Awards:

  Ancient Burrower (FO-209-OL) is awarded the Royal jelly of sabotage: 'For your excellent performance burrower, you were able to continously pressure the tall pylon for ages. Forever you have continously pressure the tall tower hivemind to the point they had to leave it, and you took huge advantage of it to where you diverted the entire main tall force to that location. I am proud of you, your effort alone has greatly contribute to the effort of this wonderful battle. You were entertaining to watch as I bestow my aid to you in many ways. You were a shining example of a true burrower, and may you bestow your knowledge to other burrowers alike and future generation. May the Queen Mother watch over you, rejoice!' by Prime Queen (PRO)

  Mature Hivelord (JI-227) is awarded the Royal jelly of proliferation: 'You were a focused builder through this entire battle. No area left unchecked, you made sure that each area was rightfully fortified. I am proud to say you were always building, there was no break that I witness from you, as you were always low on plasma. You made swift work on the talls flank, by allowing opportunities for other sisters to take advantage of, me included. You were a great hivelord that I will never forget because it truly magnificent to witness. May the Queen Mother watch over you, rejoice!' by Prime Queen (PRO)

  Young Praetorian (IR-984-I) is awarded the Royal jelly of resilience: 'You were truly maginificent to watch my vanguard. You became the last tier 3 that stand in the wake of these pathetic skytalls, that of which they only cowarded behind their resin as they never dared to push forward not even once. However, I took note of the fact that you were rightfully available to help make captures when I was up, and also were making engagements that greatly benefit the hive! I am truly proud of your performance as you made an impact in this battle, may it not be huge, but it was something to definitely take note of.  May other vanguards be just like you! Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (FLA-550) is awarded the Royal jelly of proliferation: 'You truly were once again put on a show that I always enjoy watching. After the first queen death, you have significantly impacted the front line by delaying the talls advancement with your sisters. You utilized the clusters made by other drones, and hivelords to your advantage, when I did become queen I witness the fact that you did as a prime praetorian is expected to do, and see you pull a tall instantly in, and sweep as I build resin walls for you to secure talls easier. Overtime, you permanently removed talls at the west of South Research Caves, this impacted quite a bit. When the talls reached eye tower, I decided to get up, that of which you aided me to get multiple captures once again proving how valuable you were. Last engagement that I remember was when you pull 3 talls into a green stick and they get killed by it! Amazing! Overall, you deserve this jelly for how great you were this battle. May the Queen Mother watch over you, Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Chittering[/color]![/bold]



