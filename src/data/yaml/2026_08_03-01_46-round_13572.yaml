roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Exi-Brize, Qiang 'Titanic' Wu.



  Royal Jelly Awards:

  Elder Hivelord (KV-776) is awarded the Royal jelly of resilience: 'Did an amazing job at fixing nexus, great designer, thank you for your work it made this a much more enjoyable fight than i thought it would be



  Rejoice my daughter' by Prime Queen (RP)

  Young Spitter (TW-148-K) is awarded the Royal jelly of resilience: 'The second designer we had that built so much it made me tear, may your work never be forgotten, rejoice my daughter you are incredible' by Prime Queen (RP)

  Elder Lurker (ED-633-IT) is awarded the Royal jelly of rejuvenation: 'EDIT had healed so many sisters that she could have sacrificed twice.


  She had saved NEV and ARES on gonzo and was healing me everytime.


  A hero, and i wish you keep it that way.


  I love you my sister. good work my darling.' by Prime Queen (RP)

  Prime Ravager (NEV-760) is awarded the Royal jelly of slaughter: 'A perfect warrior, who had killed many on gonzo and also did a great service to the hive. You and ARES did an outstanding job, and i am pleased with your work, my dear sister.


  Queen Mother bless you sister, and that you may rejoice!!' by Prime Queen (RP)




