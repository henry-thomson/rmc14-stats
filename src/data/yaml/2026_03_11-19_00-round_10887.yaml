roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Flave Flanc, Noelle Dollfuss, Amos 'Yokel' Lenkowski, Cera Watanabe, Guff Hardmine, Cid Skaii, Vaughn Basmanoff.



  Royal Jelly Awards:

  Prime Boiler (HAZ-317) is awarded the Royal jelly of resilience: 'For sticking with the hive, through thick and thin, I award HAZ the jelly of resiliance!


  They kept us in the fight and were fundemental to our comeback, without them I'm now sure where we'd be.' by Elder Queen (DAVE)

  Elder Hivelord (XX-881) is awarded the Royal jelly of proliferation: 'For no task to big to handle, XX-881 built and built and built, stalling the talls for yonder to come.


  Their vast mazes confused the talls and lead them into snafu.


  ROAR FOR XX-881!!!' by Elder Queen (DAVE)

  Young Carrier (ST-832-U) is awarded the Royal jelly of rejuvenation: 'Their eggs were fundemental to our revival, without them we would not have the sisters to bare their weight of my sins, falling for tall brain magic and dying.


  I probably must have birthed from one of the very talls they got infected.' by Elder Queen (DAVE)

  Prime Praetorian (ARG-335) is awarded the Royal jelly of sabotage: 'Like a rock in the shoe, a thorn in the back, ARG sabotaged the talls to no end. 


  I without them, the tals numbers wouldn't have thined, their morale wouldn't have been shot.' by Elder Queen (DAVE)




  [bold]Operation funded by [color=green]Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
