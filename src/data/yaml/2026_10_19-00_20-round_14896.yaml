roundEndText: >2-

  [bold][color=red]SPP Naval Infantry Operational Report[/color]

  [color=yellow]17th Vega[/color][/bold]


  17th Vega successfully boarded the station and eliminated a significant amount of deserters. Exfiltration was successful, and the remnants were destroyed.


  It appears that some of the intelligence was also destroyed, and additional claims have been made that the troops read some of it. Thorough post-op evaluation will be required for the entire section.


  [bold]TOP SECRET - DO NOT DISTRIBUTE[/bold]


  [color=yellow]1/2 Intel Crates were recovered![/color]

  [color=green]No Deserters survived![/color]


  [color=yellow][bold]SPP Minor Victory!



  In memoriam of our fallen soldiers:

  Finn Pavlov, Luna Grachevskaya.





  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



  [bold]Hive established by [color=purple]Lilith's Xenonid Research Division[/color]![/bold]
