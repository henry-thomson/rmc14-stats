roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jun Hao, Minji 'Failsafe' Hopgrim, Ana Zaychikova, Fenrisulfr AW Thumper, Lizbeth Fraser, Deliah Rothman, Vexillum Regis Obice.



  Royal Jelly Awards:

  Prime Drone (ARG-35) is awarded the Royal jelly of sabotage: 'ARG captured a planet tall completely ALONE and made them not have flame. They also stalled other planet tall enough so that we could capture them.


  Honestly, the only reason why planet talls didnt live was because of them. Thank you, dear sister.' by Prime Queen (RP)

  Young Drone (HS-655) is awarded the Royal jelly of rejuvenation: 'HS was brave enough to push with me as queen and sacrifice when i got low. They were the reason that even pushing planet talls boldly, we could get out mostly unscathed. This paved the way to our victory, since talls moral was broken, with no such "reward" of the enemy Queen being dead.


  They made me show them true terror.' by Prime Queen (RP)

  Elder Ravager (SO-911-DD) is awarded the Royal jelly of proliferation: 'Your guidance to the other sisters was crucial, and your drags were impressive even to me. You remind me of NEV, as a good base ravager that you are. But not only that, as the time came, i saw that a berserker would finish all this, and true to my orders, you made it come to realization.


  You were the missing piece for this war to be over. I thank you for your captures and wipes, and i assure you, this is one of the jellies are i am the most proud to be awarding.


  May your life be eternal!' by Prime Queen (RP)

  Mature Sentinel (JI-368-NX) is awarded the Royal jelly of proliferation: 'You and FAE stalled tuber and captured 6 talls on total. I am very pleased to see your efforts brewing fruits, and i hope to see more of it again.


  Rejoice!!' by Prime Queen (RP)

  Ancient Ravager (ED-172-IT) is awarded the Royal jelly of slaughter: 'Your wipes were amazing, and you kept close to me even on my death, proving your loyalty once more.


  Rejoice my dear sister, and may your claws grasp the heaven!' by Prime Queen (RP)




