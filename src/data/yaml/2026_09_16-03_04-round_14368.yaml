roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Willhab E Hunga, The Spirit of Fire, Lastimos 'Speedbump' Vintrisi, Fletcher Forgi, Rusty Gettemy, Hugo Walsh, Glorp Blorbleson, Priscilla Fraser, Lycia Zonaria, Terrace McNeal, Jessica 'Liberated' Brynley, Soul Persikov, Lennox Adams, Chester Burnstein, Vexillum Regis Obice, Rick Lu Arran.



  Royal Jelly Awards:

  Ancient Defender (FAE-741) is awarded the Royal jelly of resilience: 'FAE was our tier 1 that even engaging on frontline often did not die once. They had captured a lot of talls and made a lot of captures safe aswell.


  Rejoice my dear sister, and may your black belt be eternal!!' by Prime Queen (RP)

  Ancient Defender (LEO-782) is awarded the Royal jelly of proliferation: 'Died protecting the queen and reborn to continue capturing. A true brave defender that i hope more sisters are like them.


  Rejoice my dear sister, and that your loyalty be eternal!!' by Prime Queen (RP)

  Ancient Praetorian (CMP-979) is awarded the Royal jelly of sabotage: 'You captured tall empress just like on my plan, and also did wonderful captures on my screeches, being one of the tier 3 that did not die until the end. 


  Rejoice my big sister, and that your motherful feeling be eternal!!' by Prime Queen (RP)

  Elder Praetorian (SKY-58) is awarded the Royal jelly of resilience: 'SKY was a tier 2 later turned into tier 3 that did not die, and that kept their support so that i wouldnt die to tubes or daze spit.


  Rejoice my dear daughter, and that your fury be eternal!!' by Prime Queen (RP)




