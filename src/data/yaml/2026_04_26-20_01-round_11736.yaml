  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jona 'Biohazard' Knappenberger.



  Royal Jelly Awards:

  Elder Boiler (UWU-773) is awarded the Royal jelly of slaughter: 'UWU, you have been a great asset to this hive, providing sisters multiple times not only cover but support fire that prevented the talls from killing sisters or our captures.


  Your efforts have been seen, and will be rewardeed with your very won jelly, from me to you. Great work.


  See you in the next hive!' by Elder Queen (NEV)

  Mature Boiler (ZOE-576) is awarded the Royal jelly of slaughter: 'ZOE, I have personally seen you work. It was a great show, talls never knew what hit them. You and your boiler sisters have done great this day, providing all the support necessary to not only capture the talls, but force them into cowering back to their hive!


  For you great work this day, I award you this jelly of slaugther. Keep doing what you're doing daughter.


  See you in the next hive!' by Elder Queen (NEV)




