roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Beace Poppers, Screams-A-Lot, Karl Giggs, Kramo'B Lae-Dukalis, Noelle Lockhart, Andre Yeskey, Rico  Marsh.



  Medal Awards:

  Lance Corporal Ups-The-Downs is awarded the Medal of valor: 'Lance Corporal, Ups-The-Downs went above their duty in caliber and performed a task that was expected of very few elite marines.. They exterminated 3 Xenonid ravagers alone, shortly after the main marine force was almost entirely overwhelmed by the Xenonid hive. Many lives today were saved due to your actions today. Semper Fi, Lance Corporal.' by Lieutenant Colonel Kazi Priestess





