roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jim 'Smokey' Werner, Fenrisulfr AW Thumper, Kain Weller, Ishmael Porter, Opal AW SturmGewehr-44, Lilly 'Pipsqueak' Harding, Michael 'Hands' LaRue, Telani, Travis 'Lucky' Daytona, Apple Pennington, Dallas Deckum, Katarina 'Snowball' Silvia, Shira Tlor, Lapinski 'Carrot' Warren, Catthew 'Statue' Jones, Elias 'Donut' Bennett, Marcia ''Sodapopper'' Vagrant, Eitun, Aaron 'Lockjaw' Wall, Auburn Crookshanks, Zoey Temnora.



  Royal Jelly Awards:

  Ancient Boiler (NE-972-T3) is awarded the Royal jelly of slaughter: 'NET3, You were my most valuable sister today. You have halted the talls in their track with your boils, stopping them from ever recovering those we had killed inside reactors. Today would not be possible without you.


  For this, I award you this jelly of slaughter, rejoice!


  See you in the next hive!' by Prime Queen (PINK)

  Prime Ravager (KR-535-IS) is awarded the Royal jelly of slaughter: 'KRIS, you have served me well today. Your idea to stay and wipe the talls in reactor has lead to a domino effect, causing talls to not only die in mass, but fumble nonstop trying to recover said wiped talls.


  For this, I award you this jelly of slaughter, rejoice!


  See you in the next hive!' by Prime Queen (PINK)

  Drone (HO-409-ST) is awarded the Royal jelly of rejuvenation: 'HOST, You have saved my life at a critical moment for the hive. If I had died to the tuber there, it would've been over for all of us. Your sacrifice has lead us to our victory,


  and for this, I award you this jelly of rejuvenation.


  See you in the next hive!' by Prime Queen (PINK)

  Prime Ravager (GR-119-ED) is awarded the Royal jelly of slaughter: 'GRED, or is it GREED? I never got to ask, since you did perish in today's fight. However, before you left, you have done an amazing show of force to the talls, wiping half if the ball with KRIS' help.


  For this, I award you this jelly of slaughter. Rejoice!


  See you in the next hive!' by Prime Queen (PINK)

  Mature Burrower (HEN-567) is awarded the Royal jelly of proliferation: 'HEN, I have heard from AID that you have captured many, many talls from the tall's nest. Stealing many yellows as a caste you have relatively little experience with, you have done amazingly.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Prime Queen (PINK)




