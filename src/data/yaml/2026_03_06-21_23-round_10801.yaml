roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Warrior (ALT-437) is awarded the Royal jelly of resilience: 'For your heroic leadership, during the beginning of the hive, you have shown how capable you are.


  You charged against multiple engagements, capturing, destroying. you name it, you were there to stop these talls and that you did.


  You even destroyed a deathspitter with your actions, I am highly impressed.


  Ashame you died, but I will remember your hard work.' by Prime Queen (PRO)

  Mature Hivelord (HE-382-X) is awarded the Royal jelly of proliferation: 'For doing your absolute best since the beginning, and building up thousands of walls in the hive name.


  You deserve this jelly for being outstandingly dedicated to your role as a builder of the hive.


  May you build for eons for I wish to see more of your eager work.' by Prime Queen (PRO)

  Mature Boiler (SHE-948) is awarded the Royal jelly of sabotage: 'When talls had land, you made up for it by taking it back.


  You were one of the main units of the hive that was boiling down any area the talls had, an I consumed their territory with pure resin walls each step of the way.


  It was quite entertaining, I enjoy seeing such activity put to great use by boilers, may you prosper!' by Prime Queen (PRO)

  Elder Hivelord (HP-462-I) is awarded the Royal jelly of proliferation: 'Even if inexperience as a hiveleader, you did great. You were able to keep track of hivemind, and generally was able to build up areas of interest that was required of the hive.


  You should be proud of each step of the way you make, not everyone perfect, but every improvement counts, rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
