roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Lilliana Taggart, Bella AW R0635, Althea Leander, Heidi AW Steyr-Hahn, Zestiya 'Lemon' Sowre, Dork Dwimbleby, Breathes-In-Light, London Baxter, Milosch Zviazda, Loiosh Garland, Becca Heath, Rasto Sanders, Lockie 'Venator' Demuth, Eather 'Silver' Shawn, Rosemary AW Glaive, Racc N'Bin, Whitney Petrov, Juniper 'Clownfish' Burger, Slowy Garrison, Clumsy Bob, Dagran 'Juggler' Flopshire.



  Medal Awards:

  Corporal Lockie 'Venator' Demuth is awarded the Bronze heart medal: 'Corporal Lockie Demuth showed outstanding performance as a weapon specialist on the battlefield during this operation. The Corporal reportedly assisted in the death of multiple tier 3 Xenonid instances, as well as the Xenonid Queen. 

  They proficiently made use of their ATL and slayed our most dangerous enemies today, with however great loss. 


  They gave their life for the Falling Falcons and served this company with great honor. You will be remembered Corporal Lockie Demuth.  Semper Fi.' by Colonel Kazi Priestess





