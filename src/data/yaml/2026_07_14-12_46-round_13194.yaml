  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  Joshua Lee, Dahlia Whitewitch, Lenny 'regicide' Kuster, Bill Lombardi.



  Medal Awards:

  Captain Hudson 'Hungry' Demuth is awarded the Bronze heart medal: 'For your duty and sacrifice.  you held together the opperation yourself on the ground pushing marines to achieve things they wouldnt of before your arrival. though you lost your life tragically in the line of duty. you did so pushing marines and saving who you could


  Awarded by Col. Tyr Ragnarson on 07/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





