roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ruki Trigger, Blossom 'Rosy' Nibbles, Bell 'Jade' Tolkin, Lava-Wader, Sylvia Pygmalion, Eddie Salazar, Rasputin 'Blows Up' Bevilacqua, Stubborn Pipsqueak, Prue 'Murder' Blackburn.



  Royal Jelly Awards:

  Elder Praetorian (DEA-152) is awarded the Royal jelly of proliferation: 'DEA, you have offered a continuing service to this hive. From the first queen to the last, you have performed capture after capture, service after service in the face of absolute tall aggression. Through your efforts, our hive was allowed to thrive and I thank you for this. Rejoice!' by Immature Queen (ARES)

  Ancient Praetorian (ED-684-IT) is awarded the Royal jelly of proliferation: 'EDIT, I worked with you for much of the battle and helped you to capture tall after tall, from our first couple into the surely over dozen. It was amazing feats that I saw you perform and even after we lost multiple queens, you held yourself together with grace. It is an honor to have you in my hive. Rejoice!' by Elder Queen (ARES)

  Ancient Hivelord (OOO-298) is awarded the Royal jelly of rejuvenation: 'OOO, you are a well known builder, an essential support in our hive. Despite all of the disruptions to the hive, you and others continued building diligently to ensure we would have the structure needed to win the day despite our setbacks, I am sure things would not have ended up as smooth without your assistance. Rejoice!' by Elder Queen (ARES)

  Mature Drone (XU-207-N) is awarded the Royal jelly of rejuvenation: 'XUN, You may be a younger sister in the hive, but today you proved yourself as adept as even some of the eldest among us. Without your healing and support, our frontline would have collapsed many times over after the repeated assaults of the talls. Having you at my side made me assured of my safety. Rejoice!' by Elder Queen (ARES)

  Mature Ravager (TIB-236) is awarded the Royal jelly of resilience: 'TIB, today I saw you perform on a level well above your years. Many times I witnessed you performing captures, saving sisters from the tall lurker, surviving even the most rigorous fighting, and overall proving yourself to be an essential asset to the hive. I count myself lucky to have been witness to such a performance. Rejoice!' by Elder Queen (ARES)




  [bold]Operation funded by [color=green]Lilith's Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Bustuh 'Geezuh' Altuh[/color]![/bold]
