roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Darren Black, Whitaker Kuznetsov, Nova-Stargazer, Vex Vespidii.



  Royal Jelly Awards:

  Ancient Carrier (WIL-718) is awarded the Royal jelly of proliferation: 'When our entire hive was back against the wall. With only a tiny slice of resin and a core holding the line, this daughter was essential. Her well placed and constant eggs made sure we had a steady flow of captures and were able to recover the hive. Our hive grew by at least 5 times thanks to your work. Rejoice!' by Prime Queen (ARG)

  Elder Hivelord (AL-312-M) is awarded the Royal jelly of sabotage: 'As a resin whispher you were essential in holding back the talls during the battle for the core. Our hive was small, our resin tiny, yet you held the line and supported our many defenders. We look forward to seeing the prime you will become! Rejoice!' by Prime Queen (ARG)

  Mature Hivelord (SA-782-M) is awarded the Royal jelly of sabotage: 'When our hive was at its darkest hour, you kept true to your goal. Expanding our resin eastwards away from the talls, your work enabled us to keep fighting when nearly all hope was lost. Without your constant dedication to building our hive, this battle could not have been won. Bravo!' by Prime Queen (ARG)

  Elder Hivelord (BL-562-D) is awarded the Royal jelly of sabotage: 'Crafting our grand hive from the very start, without your constant work our hive would not have survived the tall invaison. When our back was against the wall you worked with the resin whisper to stall the talls long enough for our hive to grow. Without your dedication, this victory would not have been possible. Rejoice!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]CBK's Lovingly Crafted Pinwheels[/color]![/bold]
