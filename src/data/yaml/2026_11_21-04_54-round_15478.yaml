roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ren Kestrel, Mary Nikolova, Tamo Ryusaki.



  Royal Jelly Awards:

  Ancient Hivelord (BOX-632) is awarded the Royal jelly of resilience: 'My daughters BOX, ET-B. QT all of you worked together to be main reason we could keep alive during this fight. You allowed us to constantly rotate and keep the pressure up no matter what. For all of your servives I reward you this jelly.


  REJOICE!' by Ancient Queen (WOLP)

  Mature Hivelord (ET-94-B) is awarded the Royal jelly of resilience: 'My daughters BOX, ET-B. QT all of you worked together to be main reason we could keep alive during this fight. You allowed us to constantly rotate and keep the pressure up no matter what. For all of your servives I reward you this jelly.


  REJOICE!' by Ancient Queen (WOLP)

  Mature Hivelord (QT-774) is awarded the Royal jelly of resilience: 'My daughters BOX, ET-B. QT all of you worked together to be main reason we could keep alive during this fight. You allowed us to constantly rotate and keep the pressure up no matter what. For all of your servives I reward you this jelly.


  REJOICE!' by Ancient Queen (WOLP)

  Boiler (CL-307-B) is awarded the Royal jelly of sabotage: 'My daughter CL-B you were alive sense the start covering my hive pushes and preventing the talls from chasing us. Your work kept the talls at bay and for that I personally thank you.


  REJOICE!' by Ancient Queen (WOLP)

  Prime Ravager (AR-718-ES) is awarded the Royal jelly of slaughter: 'My Daughter AR-ES you were my chief hive leader protecting our captures and sisters while we battle the talls. You never let the talls have a moment of rest and nearly secured all our important captures. For your service I reward you this jelly.


  REJOICE!' by Ancient Queen (WOLP)




