roundEndText: >2-

  [color=orange][bold]Weston-Yamada After Action Report:[/color][/bold]

  Azure-12 successfully recovered the Executives, as well as the Halcyon representatives involved in the negotiations.


  Unfortunately, some casualties were taken, including one of the executives. Steps are being taken to notify the families and handle settlements.


  Additionally, it appears that an SPP contingent was left groundside. Regrettable to lose the potential PR bonus, but I suppose it was not our conflict.


  [color=green]PMC Victory!




