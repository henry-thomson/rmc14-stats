roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Sara Harris, Tyran Shanner, Hugo Knapenberger.



  Medal Awards:

  Staff Sergeant Steve 'Lung Cancer' Michaels is awarded the Distinguished conduct medal: 'A long standing and hard working MP through and through. Today they advised their freshly promoted CMP and helped handle the department. When a my Chief Engineer was believed to be involved in sedition, they went undercover to collect information leading to arrests. With high praise, I offer this medal. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 7/31/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Staff Sergeant Kaori 'Mad Dog' Yamashita is awarded the Distinguished conduct medal: 'Delta performed excellently this operation, in no small part to the efforts of Ssgt. Yamashita.  She demonstrated exceptional battlefield awareness and communication skills, taking the initiative to most effectively maneuver the squad to victory. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 7/31/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





