roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Clay 'Sleeply' Morgan, Olivia Croft, Midas 'Pinky' Mac Valean, Alexsandr 'Pinky' Kasper, Tasha Serrcof, Becomes-The-Dragon, Aleksandrina 'Alya' Kovaleva, Cedrik Steel, Davud Mehmedovic, Gregory 'Talisman' Dawkes, Grant Fulton, Ron 'Fluffy' Paxton, Giovanni 'Brisket' Guess.



  Royal Jelly Awards:

  Ancient Runner (NEV-89) is awarded the Royal jelly of slaughter: 'NEV, today you have proven to gain the best honor anyone could have. With your help, we have managed to wipe the tall menace swiftfly, your work, tearing apart and destroying talls, was not only an amazing execution, but also really enjoyable to witness. You prove to be a figure of fear to the talls, they shall fear your name.

  Even if the odds were against us, even if we where almost going to die because of the hivekiller. We managed to wipe the talls in their own hivemind.

  But this doesnt end here, we still have work to do, and with you now being a KING, I am proud to keep the hunt going. No tall shall escape our hive.

  I am really proud of you. Show these talls real fear.

  With love LAG.' by Ancient Queen (LAG)




