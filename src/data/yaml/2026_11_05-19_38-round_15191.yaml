  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Salts-The-Fries, Khejali, Harvests-The-Grapes, Mina Turner, Petra Knez, Kyra Cowart, Gary C Humperdink, Benjamin Bennett, Boris 'Boorish' Petoskey, Driscoll Kemerer, Sips 'Toasty' Summer, Dobromir 'Rancho' Babaevich, Ker Xhango, Sumika Aulter, Resha Wyoming, Banka-Kai, William 'Daybreak' Blackwell, Seth Archibald, Varrun 'Booger' Kross, Olivia 'Haze' Prospero, Petra 'Meow Meow' York, Rinka Lizzumi, Lenny 'regicide' Kuster.



  Medal Awards:

  Lance Corporal Paisley Hoopengarner is awarded the Medal of valor: 'Lance Corporal Paisley Hoopengarner has, in a short time after being awoken, scored several operation-defining kills, essentially singlehandedly changing the tide of the battle from an evacuation to a total and utter dominating victory with their actions.


  Awarded by Maj. Hudson 'Hungry' Demuth on 05/11/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Major Hudson 'Hungry' Demuth





