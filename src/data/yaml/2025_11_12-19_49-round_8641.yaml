roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Fights-The-Dark, Buzz 'saw' Fibres, Bailey 'Timber' Hayes, Belfor Waylo, Lenny Figglebottom, Kalako, Hunter Bashline, Licks-the-Acid, Manuel Miller.



  Medal Awards:

  Breaks-the-Tides is awarded the Distinguished conduct medal: 'Upon the demise of Delta's leadership, Sergeant Breaks-The-Tides took upon the role of the Acting SL, and doing so with flying colors.


  They have led Delta with courage and kept them cohesive enough to continue the fight.


  Awarded by Col. Freya Locke on 11/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ambrose Browning is awarded the Distinguished conduct medal: 'As our Logistics Officer, Lieutenant Browning kept the front supplied during operation Patrol Yankee-Spear on Shiva's Snowball.


  Their work, and Requesitions in general was commendable this operation. Without a steady suppy, battles are lost, and Lieutenant Browning once more proven their worth to the UNMC and our war effort.


  Awarded by Col. Freya Locke on 13/11/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Ancient Praetorian (YIP-103) is awarded the Royal jelly of proliferation: 'This daughter, an ancient oppressor made sure every tall felt their hooks in their guts, pulling them towards their certain doom. They repelled the first push of the talls alongside their sister DUM, and for this they have earned this jelly of proliferation.' by Prime Queen (GIB)

  Young Carrier (DUM-552) is awarded the Royal jelly of proliferation: 'DUM, you have served my hive incredibly well, working together with your oppressor kindred, making sure every tall is to be infected and ready to nest. You helped ferry so many captures to our nests. This is truly appreciated, and your work made us win this war against the invasion.' by Prime Queen (GIB)

  Mature Hivelord (VY-402-N) is awarded the Royal jelly of resilience: 'This hivelord, through skyspit and skyfire, kept building until they physically couldnt build anymore. Their resin held strong and gave us an incredible edge in the fight against talls. They have earned this jelly of resilience, and I hope you treasure it as much as I treasured it.' by Prime Queen (GIB)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



  [bold]Hive established by [color=purple]Arcturus's Xeno Pet[/color]![/bold]
