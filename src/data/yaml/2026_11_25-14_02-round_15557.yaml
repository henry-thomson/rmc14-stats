roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tim Tiptoe.



  Royal Jelly Awards:

  Prime Hivelord (VY-152-NL) is awarded the Royal jelly of proliferation: 'VYNL, today along side LK. Your build has got us many many talls. They tried to flee from the eye however your build met them like an immovable wall. By the time they got onto resin it was too late to realise what was coming.


  Your build gave them just enough hope to escape with your build but alas it was a false sense of security. For this you will be given a royal jelly of proliferation. 


