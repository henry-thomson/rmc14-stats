  Alty Ciel, Komodo, Alexis 'Concord' Mayfield, Maria 'Maniac' Malzar, Solus 'Spotstun' Winter, Act Right, Aurora 'Birdcage' Barkheart.



  Royal Jelly Awards:

  Mature Sentinel (NA-796-MY) is awarded the Royal jelly of sabotage: 'For capturing a scav tall preventing talls from getting any sort of value from the relics of the lands to be utilized against us. I thank you for doing this as it provided me joy to know no surprises can be made. Rejoice!' by Prime Queen (PRO)

  Elder Drone (RL-435-Z) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself to save a defender named TM-E in the battle of Chance, you provided them a 2nd chance that allowed them to continue the fight! I thank you for providing these opportunities for your sisters they are highly thankful of your dedication.' by Prime Queen (PRO)

  Ancient Drone (ST-240-AR) is awarded the Royal jelly of rejuvenation: 'You provided me non stop alacrit, and unstable no delay between them. Which allowed me to conquer the talls with ease, thank you for doing a required dedicated role that is always high in demand. You also were here since the beginning provided non stop support with other fruits that were great for the hive, thank you! Rejoice!' by Prime Queen (PRO)




