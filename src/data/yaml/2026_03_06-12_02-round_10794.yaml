roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Diarsia 'Dima' Maxima, Garret 'Sieve' Petrov, Jeff Dots.



  Royal Jelly Awards:

  Young Drone (NK-974) is awarded the Royal jelly of proliferation: 'Hold the tides of talls as a single drone, with her resins, her sister stand strong against the talls. Without her talls would be dive deep of the hive.' by Ancient Queen (MAT)

  Crusher (IM-661-U) is awarded the Royal jelly of sabotage: 'Everytime Deathspitter tried to slaughter her sister, she charge front and prevent them, don't let them kill any of her sister, protect them with her iron will.' by Ancient Queen (MAT)

  Elder Ravager (POC-845) is awarded the Royal jelly of resilience: 'Lead the main push and don't let talls to recover, without her efforts her sisters couldn't get to captured talls to safe. Talls feared whenever they saw her after that moment.' by Ancient Queen (MAT)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



