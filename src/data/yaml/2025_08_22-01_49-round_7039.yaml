roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  The Moor of Decay.



  Medal Awards:

  Mizuno 'Kitty' Drakonovisch is awarded the Distinguished  conduct medal: 'Gunnery Sergeant Mizuno Drakonovisch displayed steady leadership and excellent conduct during operation Investigation Brass-Uniform on LV-759 Hybrisa Prospera.

  Her presence kept the Marines focused and her keen sense of tactics kept them alive.


  Awarded by Maj. Freya Locke on 08/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Nikki 'Ferret' Blackburn is awarded the Distinguished  conduct medal: 'Lieutenant Nikki Blackburn cleared a large portion of the AO on her own, even destroying a Xenonid hive in the process.

  She also secured a large amount of valuable intelligence points, making the operation Investiagtion Brass-Uniform on LV-759 Hybrisa Prospera far easier for the second company.


  Awarded by Maj. Freya Locke on 08/22/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Mister Wiggles!![/color]![/bold]
