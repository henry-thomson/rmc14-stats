  [color=orange]We[color=green]Ya[/color] Operational Report:

  [/color]


  Despite heavy resistance, Azure-12 successfully recovered the target objectives from the UNS Almayer.


  The UN's broken arrow policy soundly destroyed any evidence of the operation. Hazard pay will be awarded.


  Good work operatives.


  [color=green]5/5[/color] objectives were recovered!

  [color=orange]Some[/color] casualties were taken!


