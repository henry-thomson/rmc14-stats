roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Porter 'Porker' Keopple, Mona Wolfe, Ari Buggins, Screams-A-Lot, Zoe Slimora, Sonata AW Moschetto, Icarus Nightflitter, unknown, Fights-The-Dark, unknown, Moss Man, Arcturus, Rina 'Shell-Shocked' Gensvil, Brendon MacGregor, Onna Athena, Mariabella Dryfus, Kit Gomez, Shoots-for-Moon, The Lilac of Weakness.



  Royal Jelly Awards:

  Elder Ravager (HEN-572) is awarded the Royal jelly of slaughter: 'As per recommendation of your sisters you are given this jelly. By their witness, you were the one to lead several successful attacks on the talls leading to the deaths of many and captures of some.

  Unfortunately in the heat of the battle you fell. We will never forget your bravery and dedication to the matters of the hive.

  You will become an example to all the younger sisters. Like a guiding star they will seek guidance in you.

  Hive will never forget you nor your sacrifice. We live due to your actions and we thank you for it.' by Queen (AMEN)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Weston-Yamada[/color]![/bold]
