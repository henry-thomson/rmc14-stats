roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ups-The-Downs.



  Royal Jelly Awards:

  Ancient Defender (SOL-956) is awarded the Royal jelly of resilience: 'SOL, You have done your best to defend sisters, even giving your life on two occasions so they could live to see this through.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Hivelord (OO-5-O) is awarded the Royal jelly of resilience: 'OOO, You have done well today, leading the build effort to make sure sisters had cover against the talls, indirectly shielding them. You even took initiative multiple times to build the entire colony.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Young Praetorian (RU-975-K) is awarded the Royal jelly of rejuvenation: 'RUK, You have done your best to protect sisters, whether it was by screaming them awake or pulling them to safety. You have done all you could to keep as many of them alive as you could.


  For this, I award you this jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Chief Culinary Officer[/color]![/bold]



  [bold]Hive established by [color=purple]the gibbing of Minju[/color]![/bold]
