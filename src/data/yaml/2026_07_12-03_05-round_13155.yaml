roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Donavin Burris.



  Royal Jelly Awards:

  Elder Praetorian (WAW-762) is awarded the Royal jelly of resilience: 'WAW, You have done an amazing job today. Despite my recklesness, you have helped many sisters see this through to the end.


  For this, I award you the jelly of resilience for the many lives saved.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Ravager (DID-428) is awarded the Royal jelly of proliferation: 'DID, you have done a great deal today. You have secured many talls for our great hive, making sure we had a constant stream of sisters added to our ranks. The talls never stood a chance.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Ravager (AR-256-ES) is awarded the Royal jelly of slaughter: 'ARES, I have seen you rip and tear through every tall standing in your way. You have killed to most out of any of us, including me. You have eliminated the tall threat from our hive.


  For this, I award you this jelly of slaughter. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]the Pit[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
