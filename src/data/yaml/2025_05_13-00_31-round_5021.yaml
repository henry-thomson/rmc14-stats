roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Smolder Brightdawn, Recro Nighteyes, Anta Feuer, Zeag Ashford, Sebastian Wallick, Shelly Parker, Stony Tony, Jean Von Fitzgerald, Runo, Kasuni, Minerva-Sky, Sammy Smell, JG Monnet, Patton Sommer, Andrew Bunten.



  Medal Awards:

  Stares-at-Stars is awarded the Distinguished conduct medal: 'Exemplary work ensuring every problem I had was solved before I even knew I had it. They are a promising officer, and field leader. A true ECHO marine.'

  Lai-Neetra is awarded the Distinguished conduct medal: 'Had essentially the same sense for when to advance, and when to OB. Time and time again I found myself writing up orders for an OB, and they're already relaying cords! Not only that, but they are the straw that broke Xenonid resitance, in the infamous Eastern cavern brawl.'

  Peter 'Magnet' Tireman is awarded the Distinguished conduct medal: 'One of the only Alpha medics, and yet I barely see any Alpha riflement going home in body bags. There is no coincidences in the corp. Only marines of solid grade A steel like this one. If I ever get hurt, I know who I'm going to next.'





