roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Elijah Clarke.



  Medal Awards:

  Captain Culls-The-Leviathan is awarded the Distinguished conduct medal: 'Captain Culls-The-Leviathan during Operation: Sortie Iron-November performed exceptionally well. On a hard location and hard LZ to push from, decisive actions and well communication from the Captain assured this missions success. So much so they aimed a OB and sniped the queen ensuring this hives collapse. The Xenos stood no chance with Captain Culls-The-Leviathan at the helm. 


  Awarded by LtCol. Sicilia Drakonovisch on 05/03/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch





