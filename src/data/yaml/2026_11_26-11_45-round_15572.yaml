roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Olivia 'Livvy' Croft.



  Royal Jelly Awards:

  Young Praetorian (RA-812-H) is awarded the Royal jelly of rejuvenation: 'For making sure that both myself and her other sisters remained safe, risking her own life in the process, going in critical multiple time. We were safe, we were protected, and the tall tuber was prevented from taking the life of our ravagers in multiple key moments. We were able to prevent the talls from even securing the colony before their retreat, which would not have been possible without your efforts as a Valkyrie.' by Elder Queen (BRM)

  Ancient Ravager (RA-285-ZR) is awarded the Royal jelly of slaughter: 'For maintaining our pressure against the talls, and also giving me great advice on when to push and where. You helped secure multiple key captures, and in general, survived, while making sure the talls did not get that same privilige.' by Elder Queen (BRM)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



