roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bill Wheeler, Ielenia 'Shelf' Amastacia.



  Royal Jelly Awards:

  Elder Boiler (FE-418-ET) is awarded the Royal jelly of slaughter: 'FEET, your work protecting the core and boiling the talls have been noticed. You were constantly calling shots and warning us whenever talls approached the core.


  For this, I award you this jelly of slaughter. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Crusher (SN-203-K) is awarded the Royal jelly of resilience: 'SN-K, You have been my shield, my protector this day. You have tanked the tube aimed at me not once, but twice in a single day!


  For this I award you the jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Mature Praetorian (ORI-209) is awarded the Royal jelly of resilience: 'ORI, You have saved this hive from its own greed. Whenever I was doing something silly, or a sister protected me from doing said thing, you were there to protect us, save us.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Ravager (BOG-937) is awarded the Royal jelly of slaughter: 'BOG, your claws have been my greatest tool. Be it to wipe the talls breaking our core or to drag them into the deepest parts of our hive, You were there.


  For this, I award you this jelly of slaughter.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Drone (HEX-487) is awarded the Royal jelly of rejuvenation: 'HEX, you have saved mother with your great sacrifice. You have made sure that I could drag the tall to their doom despite their best efforts to end me.


  For this, I award you this jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of fresh Froots[/color]![/bold]
