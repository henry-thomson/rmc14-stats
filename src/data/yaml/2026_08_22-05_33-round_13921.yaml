  Whivyn Welles, Ferris 'Frostbite' Treadman, Stella Voyager.



  Royal Jelly Awards:

  Mature Hivelord (TWO-631) is awarded the Royal jelly of proliferation: 'For your outstanding performance, through the time without order, without authority, or any control of a hivemind, you managed to keep yourself going with the end goal of prevailing until the final defeat.


  You single-handedly carried out my orders swiftly, carried out multiple given tasks, and earned my praise and attention through this. Seeing such performance should not go to waste.


  Congrats, TWO.' by Ancient Queen (SVI)




