roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tayshaneta Gemmosum.



  Royal Jelly Awards:

  Elder Drone (TY-430) is awarded the Royal jelly of rejuvenation: 'My Daughter TY you were the healer that protected so many of our sisters, making sure they kept in the fight. When the time was needed you made a amazing sacrafice to save KVAN from certain death.


  For your service to my Hive I reward this Jelly. REJOICE!' by Elder Queen (FOP)

  Prime Drone (FL-440-W) is awarded the Royal jelly of resilience: 'My Daughter FLW you shown why a Gardener drone is so important to a hive, supplying us with endless fruit so we can continue the slaughter of the talls. Without your work many sister would never have done so amazing.


  For your service to my Hive I reward this Jelly. REJOICE!' by Elder Queen (FOP)




