roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Chilwir 'Chilli' Drumarz, Bryce 'Saint' Lendford, Emiliano'SmartyPants'Staliano, Jaki 'Khausyo' Asima'Akii, Tony Camp, Syd Robertson, Garrett Petrov, Blake 'Bark' Barker, Nikki 'Ferret' Blackburn, Naazano, Norm 'Cheez' Lars, Ivan Ivanchuk, The Dust of Sol, Nimble-Bloom, Elias Jackson, Hokey 'Hotkey' Pinkwing, Stony Tony.



  Medal Awards:

  Corporal Lotash 'Matches' Saurmor is awarded the Distinguished conduct medal: 'Alpha Weapon Specialist Saurmor exemplified the meaning of being a ghost in the city. Their tactical positioning, skilled aim, and daring held many lanes of approach from the enemy. Their Squad Leader noticed this talent, and made sure we all see it too. To join the ranks of marksmen is not just about prestige, but calculated risk and chance.' by Lieutenant Colonel Atlas Bootes





