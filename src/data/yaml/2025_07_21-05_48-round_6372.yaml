roundEndText: >2

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Bison 'Albatross' Briggs, Zablo Mothola, Batsu 'Viper' Hebi.



  Royal Jelly Awards:

  Young Carrier (CT-822) is awarded the Royal jelly of proliferation: 'You have done an insane performance carrier, actually you did a HUGE IMPACT this battle, I can't frankly say even the word huge can describe how well you did this battle. it was AMAZING. You gave each tall I captured, and everybody else who made a capture an egg. You kept me always calm during most situation by being able to instantly give those sky talls a child. I am proud of you for everything, and for every engagement you were apart of.  Even the Queen Mother would be proud of your work! Rejoice!' by Prime Queen (PRO)

  Prime Praetorian (FI-438-RE) is awarded the Royal jelly of resilience: 'You have done an insane job this battle Prime Praetorian, you were with me till the end fighting talls tooth to claw, beating the living hell out of each one of them with no mercy. Ashame you have died this battle, but I did not forget your performance and sheer impact on this battle. Even though the hive was it lowest you always kept the hive at it highest by being the shining example of a true praetorian guarding me till the very end. May the Queen Mother watch over you as you have made us all proud. Rejoice!' by Prime Queen (PRO)

  Young Boiler (PD-671) is awarded the Royal jelly of slaughter: 'You have an done an exceptionally amazing job that it sad that your other related boiler sisters died to not see you have gotten so far in your career as the hive boiler. You were always in the right spot at the right time perhaps, boiling the talls down with no mercy. You countered each tall push that they try to make, you have truly done an amazing job this battle. May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Prime Drone (ASH-146) is awarded the Royal jelly of rejuvenation: 'You supported the front line the entire time, since the beginning to end of the battle. I want to say you were an immense impact this battle in terms of support. Giving fruits to all sisters around when needed the most, allowing us to recover, and keep up the pace on the front. Overall, you did absolutely phenomenal, may the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)
