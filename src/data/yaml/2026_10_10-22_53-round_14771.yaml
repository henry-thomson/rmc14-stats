roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Ilya Fryer, Starts-The-Fire.



  Medal Awards:

  Captain Lumen 'Losinfob' Lamplight is awarded the Distinguished conduct medal: 'Captain Lumen Lamplight performed beyond expectation as an Executive Officer and within the role of acting operational commander. Their orders were sound, calculated and their methods aided in maintain marine cohesion.


  It is rare that I see operations led with an efficiency and capability such as this, truly embodying that which I consider to be the strategical commander. I stand proud to have you serving with me Captain.


  Awarded by LtCol. Kaitlin Zalack on 11/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack

  Corporal Ash Windfeather is awarded the Medal of valor: 'Corporal Ash Windfeather performed their duties within their squad to an extend above what we expect of our Smartgun Operators, where their leadership had fallen they stepped up to carry the banner forward and lead the Squad in it's final motions to victory.


  Initiative and Leadership are great qualities to have within the UNMC, and they spell out a future of growth Corporal. Stand tall, I am certain those before you are equally as proud as I.


  Awarded by LtCol. Kaitlin Zalack on 11/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





