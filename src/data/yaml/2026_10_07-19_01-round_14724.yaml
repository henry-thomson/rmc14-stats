roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Shi Yu, Manuel Miller, Amos 'Gorilla' Ramos.



  Royal Jelly Awards:

  Prime Drone (UWU-787) is awarded the Royal jelly of rejuvenation: 'For sacrificing yourself to prevent my death regardless if it was required or not at south west of research. Keep up the great work on keeping your sisters alive, and even your queen. This was taken place in the battle of LV 624. 


  Rejoice!' by Prime Queen (PRO)

  Young Praetorian (DU-980-CK) is awarded the Royal jelly of rejuvenation: 'You were our last valkyrie overall, your attempts and effort in keeping your sisters alive was marvelous. You even tried to save a defender at nexus but sadly nobody dragged. However I think your performance on trying to keep things in check by providing warding so your sisters can get into a safe position was pretty crucial. Thank you for doing what you can during the battle of LV 624! Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]Lilliths Xenonid Research Division[/color]![/bold]
