roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Fritz AW Dagger, Olivia Croft, Dylan Cal'Enea, Nithcraal 'Bulwark' Enoki, Clover Sati, Yuko, Joshua Lee, Lacy Hill, Karl Stone, Netta Mitchell, Hadley Cressman, Aiyakah 'Speedy' Novahich, Clay 'Sleeply' Morgan, Red Roadhouse.



  Medal Awards:

  Second Lieutenant Derick 'Naptime' Hunt is awarded the Distinguished conduct medal: 'Second Lieutenant Derick 'Naptime' Hunt you are awarded this medal of Distinguished Conduct for your service today. You eliminated several xenos and 3 ravagers upon my arrival. You have done your job exceptionally well, and at the recommendation of your Auxiliary Support Officer I believe it is well deserved. You help the inital recovery from earlier on and forcing the stalemate. Excellent work Derick.


  Awarded by LtCol. Sicilia Drakonovisch on 05/02/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Sicilia 'Rose' Drakonovisch



  Royal Jelly Awards:

  Young Warrior (DE-703) is awarded the Royal jelly of sabotage: 'When almost exactly all tier 3's died, you held the line really well, making the talls regret every single piece of land at hydrodam, as I kept delaying with queen eye powers.


  I thank you for pushing your limits, when you were a boiler, you shine today in this battle, and I hope you can keep it that way.

  Rejoice!' by Prime Queen (PRO)

  Young Hivelord (BO-391) is awarded the Royal jelly of proliferation: 'For being one of our major support caste that built up areas that was required, I thank you from the bottom of my heart for ensuring engineering was  well built, perhaps even every single other area if you can recall.


  Once again you did an absolute amazing job for this hive. I think you will get better and better as time marchs on. 


  No matter the mountain you will surely climb through it all, keep it going young one.' by Prime Queen (PRO)

  Prime Drone (RI-286-KI) is awarded the Royal jelly of rejuvenation: 'For being one of the major gardeners since the beginning, and the end. You survived it all, all the fire, the skyspit, you name it. Whilst also providing essential fruits to me, and everyone around you. I am honestly, impressed. Kept up the pace at all times no matter what. I turn around fruit, turn left there a fruit waiting for me. Well done, prime. 


  Rejoice.' by Prime Queen (PRO)

  Ancient Ravager (SVI-802) is awarded the Royal jelly of slaughter: 'Help tremendously by making wipes at excavation, engineer central. and cargo. All three of these were done majorly from your help. You show these talls your FURY, your RAGE. you knock them down no matter the danger, you existed for one purpose, and that to SLAUGHTER these talls. 


  Keep it going ravager, rejoice!' by Prime Queen (PRO)

  Mature Carrier (TTT-27) is awarded the Royal jelly of proliferation: 'For providing eggs that areas such as engineering, and many other fronts you were a great support caste that help put talls to sleep with your eggs alone. I thank you for helping out as you one of the only few carriers we had. Which again, is appreciated at it highest, without your effort it would probably been way more difficult to do transports without your support. Rejoice!' by Prime Queen (PRO)




