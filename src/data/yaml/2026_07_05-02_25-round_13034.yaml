roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Eats-The-Burgers, Cub Callahan, Zoey 'Killer' Grimshaw, Volxuq Keqxae'xeu, Brenton 'Xeno Remover', London Baxter.



  Medal Awards:

  Staff Sergeant Ren Kestrel is awarded the Bronze heart medal: 'for your sacrifice in the line of duty in the leader. leading your squad against a hopeless sitiuation. you kept your men together and and strong until you couldnt no longer. your duty is one of respect and courage. and i hope your successor is the same


  Awarded by Col. Tyr Ragnarson on 07/04/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Tyr 'Tex' Ragnarson





