  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Hivelord (RB-80-Y) is awarded the Royal jelly of sabotage: 'Today you have been the biggest star in our show. Your amazing work as a hivelord kidnapping divers and defender killing and kidnapping many talls. As well as building out the hive to the best of your ability. I grant you the grand prize of... The Jelly Of Sabotage! Rejoice!!!' by Queen (HOST)

  Young Praetorian (KI-995-W) is awarded the Royal jelly of rejuvenation: 'KIW. Your work today as a valkerie should be an example to many. You have saved your sisters more times than I can count by never leaving my sight AND performing more than excelent put outs and screaches. Without you the tall queen might have been the star of the show. For that I thank you and would like to PERSONALY grant you the grand prize of... The Jelly Of Rejuvenation! Rejoice!!!' by Queen (HOST)




