roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  KuT'aan-Ti'Ta'An, Reki Arbalist, Luka 'Wander' Tio.



  Royal Jelly Awards:

  Mature Boiler (SER-436) is awarded the Royal jelly of slaughter: 'My Daughter SER you were last remaining boiler alive, you shielded my daughters in our pushes. You broke the tall metal resin and you aided in breaking talls will. For your service I reward you this Jelly.


  REJOICE!' by Ancient Queen (WOLP)

  Prime Drone (HA-179) is awarded the Royal jelly of rejuvenation: 'My Daughter HA your quick work as a healer in sacrificing your life for mine allowed us to achieve victory. You kept us in this and allowed us to crush the talls.


  REJOICE!' by Ancient Queen (WOLP)

  Mature Hivelord (UN-623) is awarded the Royal jelly of resilience: 'My Daughter UN you and the other builders were crucial  in our fight, recovering so much lost land and stalling the talls out for our victory today. For your service I reward you this Jelly.


  REJOICE!' by Ancient Queen (WOLP)




