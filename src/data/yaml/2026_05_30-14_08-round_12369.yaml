roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Viktor Varenovski, Amaryllis 'Alice' Alison, Svyatoslav Yevgenyevich, Luka Tio, Alexander Bowman, Gunther AW Malyutka, Nezoli 'Streetrat' Sharpfeather, Davlat 'granddad' Lukin, 'Rootbeer' Root of Sassafras, Xaekeax Volkeax'qux, Xequex Taeq'taq, Diploglena Montivaga, Seed-Neetra.



  Royal Jelly Awards:

  Mature Spitter (AHH-919) is awarded the Royal jelly of resilience: 'AHH, when you were a valk you saved many life's from the grips of the tuber. Even when struck down queen mother looked down upon you with a smile knowing you would not go down so easily, you saved many with your leadership and you never stopped trying. So today I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive!' by Elder Queen (VCR)

  Elder Ravager (XR-45) is awarded the Royal jelly of slaughter: 'XR, you were there from the start and till the end, you're talons and claws I watched strike'd down many talls. Following me to the bloodshed of talls you never doubted your rage and I respect that. So I reward you this Jelly to remember this day, never forget it. REJOICE!!


  See you in the next hive!' by Elder Queen (VCR)




