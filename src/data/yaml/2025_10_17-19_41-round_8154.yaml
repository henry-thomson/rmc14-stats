roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Saves-Lives.



  Royal Jelly Awards:

  Mature Ravager (LOL-233) is awarded the Royal jelly of sabotage: 'Sister. Today you showed great skill leading sabotage team in the tall's backlines. You got us many captures and disrupted tall's communications. Hive is proud of you. So am I.' by Elder Queen (RISK)

  Prime Ravager (PRO-84) is awarded the Royal jelly of slaughter: 'Sister. Today you showed talls that it means to fight against our great hive. I saw how many you killed. Your efforts lead to the complete and utter destruction of the tall's frontline forces which resulted in our victory. Hive is proud of you. So am I.' by Elder Queen (RISK)

  Ancient Praetorian (ZAO-160) is awarded the Royal jelly of slaughter: 'Sister. Today you showed great skill in supporting the hive in this battle for our survival. Not only that with your great efforts and the help of others you were able to slain many talls helping to destroy their frontline forces resulting in our victory. Hive is proud of you. So am I.' by Elder Queen (RISK)




