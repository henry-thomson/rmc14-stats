roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Allyson 'Ally' Bennet, Chews-the-Wires, Aleksi Fraser, Gary C Humperdink, Maria 'Maniac' Malzar.



  Royal Jelly Awards:

  Young Boiler (SL-594-Y) is awarded the Royal jelly of slaughter: 'SL-Y, you have done well this day. Not only have I seen your work at keeping the talls at bay, constantly covering for us with your boils, but many sisters have also vouched for you and your performance. You have not only helped sisters survive otherwise deadly encounters with your boils, but also assisted in many captures, aswell as the deaths of many talls.


  For this, you have earned yourself this jelly as a reminder of your prowess.


  See you in the next hive!' by Elder Queen (NEV)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



