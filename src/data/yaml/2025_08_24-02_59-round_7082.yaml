roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Jose Cazadores, Break-neck 'Cranky' Pebbles, Arnold Friend, Tony James, Regina Vail, Buzz Fibres, Brook 'Brandy' Bronze, Tar-Meen, Erika Rhinehart, Shazira Thryssalis, Marco Biery, Maims-The-Baddies, Masha Elakha, Ko, Burni 'Heat' Senira, Ends-The-Bloodlines, Lucen Jellivane, Adam 'Fractured' Johnson.



  Medal Awards:

  Maple Goman is awarded the Medal of valor: 'As the sole Charlie corpsman from the first drop, this one stuck through thick and thin with their squad. Indeed, Charlie did take many BRUTAL batterings throughout the operation, yet you were able to still keep everyone in one piece. I would like to think that if any of us were to go down in the field of battle, it would be your steady hands, nerves of steel, and selfless heart that would bring us back into the fray.


  Awarded by Col. Scraps-the-Copper on 8/23/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Kevin Khan is awarded the Distinguished  conduct medal: 'This IO was able to keep the intelligence flowing after the early and devastating demise of their two intelligence comrades. It is thanks to your efforts that we were able to stay in the fight for as long as we did.


  Awarded by Col. Scraps-the-Copper on 8/23/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Prime Ravager (PRO-127) is awarded the Royal jelly of slaughter: 'This berzerker never lost hope, never hesitated, and never stopped fighting for the hive. Without their help, we would have been wiped out ages ago. Thanks to their work, many talls have fallen today, with many more becoming hosts for my daughters!' by Elder Queen (LAT)

  Prime Drone (BFF-161) is awarded the Royal jelly of rejuvenation: 'This drone has proven herself a master of healing. She planted countless fruits for the hive, each one being consumed as fast as they were planted. Without her constant supply of fruits, the hive wouldn't have survived the sky-tall's constant spits. The sky-talls never let up, and nether did she!' by Elder Queen (LAT)

  Ancient Drone (KIA-894) is awarded the Royal jelly of rejuvenation: 'This daughter never stopped caring for her sisters. Even when at near death, she never once stopped healing her sisters. She saved dozens of my daughters from dying to the sky-talls. Without her constant work healing and dragging those to safety, we would have lost many to the sky-tall's spits. For this, she deserves this jelly for her never ending work in our war today.' by Elder Queen (LAT)




