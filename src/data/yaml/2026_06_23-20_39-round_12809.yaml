roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Elias 'Donut' Bennett, Porter 'Porker' Keopple, Chez 'Cheese' Woodtiger, Lilly Markov, Sebastian Xavier Fong.



  Medal Awards:

  Sergeant Kilaya-Dezanu is awarded the Distinguished conduct medal: 'Sergeant Kilaya-Dezanu is well regarded as a profesional nurse and has been for a long time. Today you continued your hard work and made sure the corpsman were well stocked and ready for the horrors of war. This has been a long time coming and glad I could finally offer recognition for your amazing work shipside.' by Major Breaks-the-Tides





