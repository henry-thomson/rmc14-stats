  Medal Awards:

  Asher Larson is awarded the Distinguished conduct medal: 'Excellent work helping to coordinate Charlie squad on Operation Detour Hotel-Saturation. I see a great leadership career ahead of you!'

  Stares-at-Stars is awarded the Distinguished conduct medal: 'Excellent strategy and coordination with CIC. Took the initiative for gathering OB coordinates that turned the tide of battle for us here today. Thank you!'

  Atlas 'Fire-Axe' Bootes is awarded the Distinguished conduct medal: 'Excellent shooting today. Your well-placed grenades blocked the escaped and sealed the fate of many a xenonid during Operation Detour Hotel-Saturation.'

  Darfman Forgemog is awarded the Bronze heart medal: 'Without consideration to own life and limb, dove headfirst into the enemy to save Sith-Seths life. If only everyone was as heroic as you were in these acts.'




