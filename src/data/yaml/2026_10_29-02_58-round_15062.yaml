roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kekolas Zaun, Amakka Nia.



  Royal Jelly Awards:

  Elder Praetorian (DEA-607) is awarded the Royal jelly of sabotage: 'DEA, you are a fine example of what a daugter should be. You secured many captures, and ultimately gave up your life for a lurker, eventually leading to the talls leaving. Rejoice!! For your efforts have been rewarded!!' by Elder Queen (OWL)

  Defender (MU-452-H) is awarded the Royal jelly of resilience: 'MUH, on many occasions you gave up your own flash, blood, carapace, and body to put yourself inbetween you and your sisters, saving many of them in the process! Rejoice! Your effort has not gone without notice!!' by Elder Queen (OWL)

  Elder Defender (OCE-670) is awarded the Royal jelly of resilience: 'OCE, you and your fellow defenders gave up your bodies and protected me when I was in a very risky position gibbing the tuber. Had you not, the talls could have easily recovered them and led to my death. Thank you, truly! And rejoice!! For you have not gone unnoticed' by Elder Queen (OWL)

  Ancient Praetorian (ABA-119) is awarded the Royal jelly of rejuvenation: 'ABA, you saved many sisters than would have otherwise been lost to skyspit, tube, or even just regular spit. For this, I, and the entier hive, thank you. Without you, we would've taken many more casualties against the talls! REJOICE!! For you were essential to our winning!!' by Elder Queen (OWL)




