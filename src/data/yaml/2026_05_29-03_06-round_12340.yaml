  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rain 'Red' Tyler, Zilxi Xaagukta, Tio Briggs, Locke Delgado, Ever Nocturne, Juno 'Kleptocat' Kaneko, Alice 'Zombie' Rosemary, Maze AW Falx, Holds-The-Trigger.



  Medal Awards:

  Gunnery Sergeant Darfman Forgemog is awarded the Distinguished conduct medal: 'Gunnery Sergeant Darfman Forgemog held caverns northwest for a jaw dropping 15 minutes while delta and charlie took colony. Inspiring their troops and doing their best to keep marins from suiciding in the hell choke, Darfman proved to me and their squad that they are able to hold their own against the xeno menance. Excellent work Darfman keeping alpha cohesive and holding the choke. You buyed us valuble time today.


  Awarded by Colonel Sicilia Drakonovisch on 05/29/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Colonel Sicilia 'Rose' Drakonovisch





