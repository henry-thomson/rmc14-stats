roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Jessie Daily, Emiliano Murillo, Sebastian Wallick, David Davidson, Wess Reckers, Yao Cometside, Nym Pseudo, Quick-footed 'Scurry' Scurryfoot, Allison Franks, John 'Manifest' Argo.



  Medal Awards:

  Lyana Thoraiki is awarded the Distinguished conduct medal: 'This medal goes not only to Bravo SL, but all of Bravo. They dilligently ensured FOB was a fortress. Not only that, we went on a high stakes rescue mission, almost saving a lone marine, lost in the frozen waste of Shiva's. Furthermore we led a final charge, smashing the last Xenonid nest.'

  Jessie Daily is awarded the Bronze heart medal: 'Though they paid the ultimate price, their efforts to harvest OB coordinates caused devastating effect on the xenonid menace. This scout exemplifies what it means to show patience, and use the tools given to them to superb effect.'





  [bold]Operation funded by [color=green]Not a Speed Demon[/color]![/bold]



