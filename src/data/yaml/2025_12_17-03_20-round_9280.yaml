roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jack Cuban, Jack Candle.



  Medal Awards:

  Jack Cuban is awarded the Medal of exceptional heroism: 'A tale for the ages. Escaping capture from the xenonids within their own hive, wreaking havoc, carving a path of death and destruction as four bugs were slain. Only once this man reached the light at the end of the tunnel, did the xenonid larva burst out of them. Little do the bugs know, vengeance is our strongest driving force - they had spelled their doom without knowing it.


  Awarded by Col. Scraps-the-Copper on 12/16/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





