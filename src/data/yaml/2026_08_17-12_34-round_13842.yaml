roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Joshua Lee, Ferris 'Frostbite' Treadman.



  Medal Awards:

  Gunnery Sergeant Vann Quirin is awarded the Medal of valor: 'For exemplary leadership, personal initiative, and courage in the face of the enemy. Gunnery Sergeant Quirin has exceeded all expectations with their efficient and elegant handling of orders, along with repeatedly demonstrating courage, including but not limited to singlehandedly engaging two high caste Xenonids alone.

  Excellent work from a truly great marine.


  Awarded by LtCol. Clyde McKinney on 17/8/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Clyde McKinney





