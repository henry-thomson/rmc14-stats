roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Dirk 'Hotshot' Rylan.



  Royal Jelly Awards:

  Young Ravager (OWO-601) is awarded the Royal jelly of resilience: 'You've been with me since the start, and despite your young age, you've stood the test of time and proved your mettle in battle. Without you shielding sisters and punishing the talls for their hubris in their pushes, we could have had a very different outcome.


  Well done, daughter, may you repeat this many times henceforth, REJOICE!' by Elder Queen (KVAN)

  Young Hivelord (FR-69-G) is awarded the Royal jelly of proliferation: 'You've ceaselessly gained ground and designed around the trickiest of corners, ensuring that any time talls weren't breaking resin would lead them closer to their doom. Wherever I asked I could always count on you to sprout resin from nothing, transforming every terrain to our advantage ensured our victory to day, and you were key in this process.


  May your build encompass the entire planet, and forevermore keep expanding, REJOICE!' by Elder Queen (KVAN)

  Young Hivelord (BE-433-E) is awarded the Royal jelly of proliferation: 'Though you may be young, your harmony with the resin is evident, you've worked tirelessly to expand our terrain in face of a constant assault, gaining ground while being careless not to let the bird claim you, you've whispered and resin sprouted, talls couldn't gain an inch with you around, and you've slowly encroached upon them until they were truly hopeless.


  Well done, my daughter, I look forward to seeing your work again in the future, keep suffocating the talls with your warm embrace of resin, REJOICE!' by Elder Queen (KVAN)

  Elder Drone (DE-279-L) is awarded the Royal jelly of rejuvenation: 'You've gone above and beyond to ensure your sisters and myself would be combat ready at every turn. You had some helpers in this endeavour, but you alone prevailed to the end, with your help we could engage the tall menace at the height of our power, without you we couldn't have kept our grasp on every engagement, but thanks to your consistent healing and recovery, we never lacked health nor plasma.


  May all Queens have a trusted aidee such as you by their side, and may you rejuvenate sisters evermore with this efficacy, REJOICE my daughter!' by Elder Queen (KVAN)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]the gibbing of Minju[/color]![/bold]
