roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Sips 'Toasty' Summer, Annah AW Bolo.



  Medal Awards:

  Second Lieutenant Altair Jenkins is awarded the Distinguished conduct medal: 'Lieutenant Jenkins you were a major support for the medical staff today. Aiding them tackling the various pressures that arise in your position while still taking time to help train up newer staff. Today you are one of medbay most value staff.


  Awarded by Colonel Atlas 'Wolfy' Snowlight on 11/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Atlas 'Wolfy' Snowlight

  Sergeant Fenrisulfr AW Thumper is awarded the Medal of valor: 'Sergeant Thumper you picked off the many Ravagers we had today. Without your work as the Demo Spec I dare say we would have not been able to wipe out this horde of Xenonids. You were one of the most important piece to our victory today.


  Awarded by Colonel Atlas 'Wolfy' Snowlight on 11/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Atlas 'Wolfy' Snowlight

  Staff Sergeant Clyde Hatch is awarded the Distinguished conduct medal: 'Staff Sergeant Hatch you show exceptional leadership as Charlie SL. This battle was a fast one with 7 ravagers, yet you kept up throughout all of it. You kept the pressure on leading Charlie to great succuss, you showed what makes a truly amazing SL today.


  Awarded by Colonel Atlas 'Wolfy' Snowlight on 11/25/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Atlas 'Wolfy' Snowlight





