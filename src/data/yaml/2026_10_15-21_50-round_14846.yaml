roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Cook Justin, Mazie Ro, Braydon Foster, Neil Lewis, Clyde Hatch, Sweeto Lisboa, Silver 'Ashtray' Mojave.



  Medal Awards:

  Staff Sergeant Oswald Black is awarded the Bronze heart medal: 'Got Cappured in the line of duty, Bursted in the Hive at North Areodrome at Shivas Snowball. They did their Duty to their very end. That duty was keeping me and the 2nd company alive. Rest in peace. 


  Oswald BlackAwarded by Lt. Colonel Breaks-the-Tides on 10/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Corporal Henry Shupe is awarded the Bronze heart medal: 'Through the hell that was put on this man. He went above and beyond after all of his Leaders were wiped out from the bugs. From going from an SGO to a Squad Leader, leading the last of his marines under his command to the death. 


  Awarded by Lt. Colonel Breaks-the-Tides on 10/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Lance Corporal Rough Grace is awarded the Distinguished conduct medal: 'Prior to me waking up, had handled requisitions on her shoulders, acting as the LO. Requisitions would be far more unsteady without her, likely causing the marines to fall towards attrition.


  Awarded by Lt. Colonel Breaks-the-Tides on 10/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Second Lieutenant Bec ''Dragon'' Walkins is awarded the Distinguished conduct medal: 'On his third OP as an IO, he managed to rally with his RFN to consitently save multiple other marines countless time and collect intel regardless of us losing IOs. He helped intel in ways i couldnt expect him to.


  Awarded by Lt. Colonel Breaks-the-Tides on 10/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Corporal Aelica 'Mom' Danara is awarded the Distinguished conduct medal: 'For leading FireTeam Two of Bravo thought out the entir OP holding coms and helping bravo stay coheasive and on task even if by Op end she sadly died in the line of duty.' by Lieutenant Colonel Breaks-the-Tides





