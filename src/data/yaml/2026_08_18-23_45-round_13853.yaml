roundEndText: >2-

  Over the course of several months, what was supposed to be a curbstomp would turn into a brutal slog.


  R.C.M Forces would push, building by building, assailed by entrenched machine gun nests, rockets, and mortars. City blocks would be leveled to the ground, and more and more casualties would mount up.


  The political rammifications would prove pronounced, and while the R.C.M ultimately would seize the city, many knew in their hearts that something substantial had been lost in their triumph.


