roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Lance Corporal Fenton Kirkson is awarded the Distinguished conduct medal: 'Lance Corporal Kirkson you managed to keep Alpha in the fight as the lone HM for half the operation. Your work what kept Alpha on the move and in the fight, for that you are recognized for it.


  Awarded by Major Atlas 'Wolfy' Snowlight on 08/24/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight



  Royal Jelly Awards:

  Elder Praetorian (NE-169-T3) is awarded the Royal jelly of sabotage: 'NET3, you managed to capture a tall lurker as a spitter. That is an impressive feat that deserves recognition. YIP has no idea how you managed as spitter but YIP is impressed.


  May you go on to keep working hard as a spitter and keep capturing talls. YIP hopes you shall come out to fight in many more battles to come.


  YIP!!' by Prime Queen (YIP)




  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



