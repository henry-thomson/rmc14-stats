roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rhys Hendricks, Dexter Warren, Hakani Steelnest Pack, Lydia Rivers, Izumi AW Maxim, Jack '2-tap' Arondo, Elaine Meissner, Marvin Fraser, Skoros Mothman, Pepper, Brooke Evans, Clarence 'Geezer' Reategui, Avalona Brightlance.



  Medal Awards:

  Althea Leander is awarded the Medal of valor: 'It was one hell of an operation for you, marine. From the CIC I watched with bated breath as you managed to free yourself from your xenonid kidnapper, return to your squadron, and take out a praetorian in mutually assured destruction. Not only this, but you helped to keep your squad and the CIC in the know about enemy movements in the backline, easing my tensions and allowing for a more complete knowledge of the enemy we were facing.


  All of these feats, contributed to victory today.


  Awarded by Col. Scraps-the-Copper on 12/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Isabell Mueller is awarded the Distinguished conduct medal: 'Diligent work on the FOB today and for the engineering needs of Bravo and the marine force. You kept comms working for an extended period of time, painstakingly swapping the batteries out of the APC manually, delivering machines to where they needed to go, and ensuring barricade lines were maintained.


  Awarded by Col. Scraps-the-Copper on 12/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Red 'Machina' Swiftcleave is awarded the Medal of valor: 'After their original squad lead had headed to cryo sleep, Swiftcleave was thrust into the position of leadership over Delta squad - something that experience tells me is no easy task. 

  Still, despite the circumstance and sudden changing of them, they were able to keep their marines wrangled together after numerous attacks by the xenonid queen on an unfavorable position. After their position in east Garden had been relieved, they were able to transition to advancing under the XO's leadership.


  Awarded by Col. Scraps-the-Copper on 12/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Hilux 'Tech' Grant is awarded the Distinguished conduct medal: 'Worked well under pressure and dwindling supplies to keep the marines of Alpha squad and various others in fighting condition. Thank you for your work today, marine.


  Awarded by Col. Scraps-the-Copper on 12/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Hugh Dannerson is awarded the Distinguished conduct medal: 'Worked well under pressure and dwindling supplies to keep the marines of Alpha squad and others in fighting condition. Thank you for your work, marine.


  Awarded by Col. Scraps-the-Copper on 12/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





