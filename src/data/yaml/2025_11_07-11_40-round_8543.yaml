roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Joshua Mannington, Nainortag Yofuaeb, Larry 'Fender' Mens, Naani, Connor Bell, Roscoe 'Sips' Springs, Berga Hades, Angela Whittier, Timothy Chickens, Effie Mikasi, Keru Kasai.



  Medal Awards:

  Alexia 'Sleepyhead' Trainer is awarded the Distinguished conduct medal: 'During Operation Patrol Flag–Enterprise, our only awake Requisitions personnel worked tirelessly to fulfill all orders and ensure that the 2nd Company never ran out of supplies.'

  Rom 'Mango' Killinger is awarded the Distinguished conduct medal: 'During Operation: Patrol Flag-Enterprise, Lance Corporal Killinger with their commendable abilities in operating demolitions equipment, managed to be the deciding factor in our Victory, by eliminating several XX-121 specimens and supporting the critical pushes that lead to the queen's death.'





  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



