roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Mina Turner, Garrett Beach, Amos 'Gorilla' Ramos, Petruso Ank, Victoria Petrova, Roaen Morzanth, Chews-the-Wires.



  Medal Awards:

  Staff Sergeant Tabula AW Morningstar is awarded the Medal of valor: 'For exceptional valour and leadership in the face of overwhelming odds, along with an unflinching determination to their duty. Staff Sergeant Tabula AW Morningstar proved themselves to be a rock, grounding the marines in a nearly hopeless situation and allowing us to persevere against overwhelming odds. A truly exceptional leader, and one I am proud to serve with.


  Awarded by Col. Clyde McKinney on 5/10/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Clyde McKinney





  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



  [bold]Hive established by [color=purple]the gibbing of Minju[/color]![/bold]
