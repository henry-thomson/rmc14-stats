roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Charlton Thane, Izya 'Cowboy' Shnipperson.



  Royal Jelly Awards:

  Elder Praetorian (DA-983-RK) is awarded the Royal jelly of proliferation: 'DARK, You have done great work. I have seen you work your magic on talls and secure many captures in the name of our hive, allowing for many sisters to burst this day. Even in a dire situation, you have helped me secure the tall empresses' demise.


  For this, I award you this jelly, to show you my gratitude.


  See you in the next hive!' by Immature Queen (NEV)

  Elder Praetorian (TRI-23) is awarded the Royal jelly of proliferation: 'TRI, although you could not live to receive this jelly in person, I wanted to award it anyway. You have fished up many talls today, even if not all of them have resulted in captures, the kills have provided the hive with valuable time for us to work on capturing more talls.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Immature Queen (NEV)

  Ancient Praetorian (WA-590-LL) is awarded the Royal jelly of proliferation: 'WALL, you have done amazing today. Despite the ups and downs are the hardship we faced on this long and exhausting day, you have prevailed and survived the whole way through. It is through your efforts that we stand victorious this day, and I am proud of calling you my daughter.


  For this, I award you this jelly of proliferation.


  See you in the next hive!' by Elder Queen (NEV)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
