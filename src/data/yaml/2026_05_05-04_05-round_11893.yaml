roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Royce Stern, Eugene AW XM16E1, Ginn-TwoToes, Zixxaeq Keqxuq, Krunni Clelwa, Owai-An, Mathew 'Mothew' Lampyris, Vex Archanos.



  Royal Jelly Awards:

  Ancient Defender (SOL-950) is awarded the Royal jelly of resilience: 'I am rewarding this from deep from my soul from the fact I saw the cleanest fortification from you. Specifically you, there was no greater sacrifice than I ever saw from west of the pylon area as tuber nailed me stragiht on I thank you...' by Prime Queen (PRO)

  Elder Carrier (HE-253-X) is awarded the Royal jelly of proliferation: 'One of our main surviving carrier, till the end of the battle where you were struck down by the skyspit, and you brought forth great results with your egg placements, that just pretty much help with putting talls to sleep, and denied any pushs that would matter. thnak you!' by Prime Queen (PRO)

  Elder Drone (XX-745) is awarded the Royal jelly of rejuvenation: 'For being one of the main healers of the hive you rejuvenated so many sisters I generall lost count, overall you got vouched by your sisters for pushing your all in ensuringt the front was always in great condition.


  Thank you for doing your best!


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Grand Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
