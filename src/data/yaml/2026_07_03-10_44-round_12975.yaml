roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  Royal Jelly Awards:

  Ancient Boiler (BOI-663) is awarded the Royal jelly of slaughter: 'One of my boiler daughters, this daughter distinguished herself, providing expert boils at exactly the right time. Not only did they stall the tall ball long enough for mother to mature, when it came time to take the fight back to the talls, this daugther slaughtered them all. At more than one occasion their boil, so expertly placed, cut the talls battle lines in two. Bravo!' by Prime Queen (ARG)

  Elder Boiler (SG-879-UY) is awarded the Royal jelly of slaughter: 'One of my boiler daughters, this boiler proved their worth this day. They expertly stalled the tall invasion long enough for mother to mature. When the time came to bring the fight back to the talls; this daughter did not fear. Boiling in the open, they risked their life to secure the perfect boil. Without their efforts the day would not have been won. Rejoice!' by Prime Queen (ARG)




