roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Mizooki 'PillBug' Akiya, Lionard Freezer.



  Royal Jelly Awards:

  Prime Hivelord (RO-469-CK) is awarded the Royal jelly of proliferation: 'You were a great impact for this battle, as you have ensured the encirclement of talls.


  I heard from others your dedication was noticed, and that of which I am bestowing jelly upon thee.


  You help build up any areas that was needed like botany, and many other places that of which was required.


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (AA-603) is awarded the Royal jelly of proliferation: 'You were a hivelord that has contributed majorly on the encirclement of the talls, your effort was not in vain, as it ensured victory for the hive.


  May you build a thousand more walls in the futures for other hives! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (MR-795-B) is awarded the Royal jelly of proliferation: 'You were one of the hivelords who majorly contributed to the encirclement, I like to thank you for your effort. as it was utilized to help wipe the talls!


  You will build great future designs for the hive, and it will crumble many foes as they faulter to break your structures! 


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



