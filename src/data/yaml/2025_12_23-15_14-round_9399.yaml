roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Peter 'Parabellum' Cencer, Disfigures-The-Sun, Cries-Of-Void, Mizooki 'PillBug' Akiya, Thunderov, Leon Renshaw, Libitina.



  Royal Jelly Awards:

  Elder Ravager (OXQ-152) is awarded the Royal jelly of slaughter: 'OXQ has showed great bravery against the talls, killing all talls without mercy. Being our last ravager, helping us wipe the tall force pushing into our hivecore.

  Without OXQ, our hive would be gone.

  We owe you everything. Keep killing the talls!!' by Elder Queen (LAG)

  Elder Boiler (TT-777-AN) is awarded the Royal jelly of slaughter: 'TTNN did an amazing job, not only killing the talls themselves with their acid. But also providing amazing support that helped us wipe the talls and end their invasion.

  You are an essential part of our hive.' by Elder Queen (LAG)

  Ancient Drone (AH-995-H) is awarded the Royal jelly of rejuvenation: 'AHH, has saved multiple sisters from dying in the hands of the talls. Including me, without AHH, I wouldnt be here today, nor half of our sisters.

  You are an essential part of the hive, keeping us alive. Without you, we wouldnt be here.' by Elder Queen (LAG)

  Ancient Warrior (FAN-693) is awarded the Royal jelly of slaughter: 'FAN has helped the hive with great captures. But not only that, FAN also was a crucial part to repel the push of the talls. Giving also important information that helped the hive coordinate. Allowing us to finally wipe the talls at our hivecore.

  We are all thankful for what you have done for us today.' by Elder Queen (LAG)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
