roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Brings-In-Catch, Bohn 'Zombie' Griff.



  Royal Jelly Awards:

  Elder Drone (QQ-699) is awarded the Royal jelly of rejuvenation: 'Gardener QQ-699, for the whole defense, provided resin fruits, healing and revitalizing the whole hive to survive against the talls- they were an integral part to our victory. The Queen Mother would be proud.' by Elder Queen (MER)

  Mature Hivelord (SA-125-L) is awarded the Royal jelly of resilience: 'Hivelord SA-125-L was an integral part of constructing our fortifications, leading the creation of the caves, the filtration (and northeast of it) fortifications, and replacement of lost territory, until they finally died in the attempts to make up for what land the Talls had taken. The Queen Mother would be proud, and I am definitely very proud.' by Elder Queen (MER)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Arcturus's Xeno Pet[/color]![/bold]
