roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Althea Leander, Rinka Izumi, Thales 'Careless' Antares, Droog Drystone, Faces-The-Music, Tasha 'Fumbles' Serrcof.



  Medal Awards:

  Lance Corporal Hayley Weber is awarded the Distinguished conduct medal: 'Lance Corporal Weber you stepped up to aid Req when they were struggling with many new techs. This was never expected from a rifleman yet you jumped in and aided them when they needed it, taking pressure off of the LO. For that you have my thanks for the hard work today.


  Awarded by Major Atlas 'Wolfy' Snowlight on 09/04/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





