roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Crokus Orlong.



  Royal Jelly Awards:

  Prime Praetorian (FLA-741) is awarded the Royal jelly of sabotage: 'With the help of others this sister showed great skill in sabotaging talls advance. Showing exeptional teamwork they were able to bring many captures to the hive allowing more sisters to be born. Hive is pround of you. So am I.' by Elder Queen (RISK)

  Prime Drone (ASH-962) is awarded the Royal jelly of resilience: 'Sister. Today you showed to everyone and my what true dedication to the prosperity of the hive means. You were busy working every second and this paid off greatly. Your sisters noticed your dedication and recommended you for this jelly. You became an exemplary sister. Hive is proud of you. So am I.' by Elder Queen (RISK)




