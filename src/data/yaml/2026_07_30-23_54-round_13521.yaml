roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Opie Stone.



  Royal Jelly Awards:

  Prime Ravager (JA-791-KE) is awarded the Royal jelly of resilience: 'JAKE has surprised me by not dying. They carried a huge burden of the hive for a long time, especially on The MedBay Incident.


  I am proud of JAKE, and i hope we can meet for many hives prior.' by Prime Queen (RP)

  Prime Ravager (NEV-934) is awarded the Royal jelly of slaughter: 'NEV has helped me do inomerous captures together with JAKE. They had dragged many and killed even more. 


  Thank you NEV.

  For much more hives that we will encounter in the sky.' by Prime Queen (RP)

  Ancient Ravager (DA-469-RK) is awarded the Royal jelly of proliferation: 'DARK had helped me, JAKE and NEV to not die multiple times, alongside dragging multiple captures. They were very competent, however, they died by my mistakes.


  Yet, i jelly you for your bravery. Rejoice DARK, and for much more hives we meet again.' by Prime Queen (RP)

  Young Boiler (XX-801-O) is awarded the Royal jelly of sabotage: 'XXO was one of our great boilers, that helped to wipe talls. They did an amazing work and evolved a lot while we were on the hive invasion.


  Rejoice my daughter, and may we keep it up for the next hives!!' by Prime Queen (RP)

  Young Boiler (DUK-47) is awarded the Royal jelly of sabotage: 'DUK was one of our dear boilers that helped to destroy the talls. Your boils got better each time you did it, and you perfected it at the end.


  Rejoice my daughter, and may every tall perish for your boils!!' by Prime Queen (RP)




  [bold]Operation funded by [color=green]Old Man Buster[/color]![/bold]



  [bold]Hive established by [color=purple]The Anti-Fop[/color]![/bold]
