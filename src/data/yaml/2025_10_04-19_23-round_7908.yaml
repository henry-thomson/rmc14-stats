roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Bob Bingle, Saber 'Vulpis' Herder, Swift Burrows.



  Medal Awards:

  Flies-By-Night is awarded the Medal of valor: 'For saving the life of their squad leader and many others, on numerous occassions against a most lethal foe. I commend you for your courage.


  Awarded by Col. Scraps-the-Copper on 10/4/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Elder Praetorian (BEL-765) is awarded the Royal jelly of slaughter: 'she and the other opressors pulled in every last one of the talls, and pushed them into the eggs, getting many captures. they also pulled the talls to their death, ending them before they could even notice it. truly one of a kind xeno... REJOICE!!!' by Elder Queen (HEN)

  Elder Praetorian (TMM-755) is awarded the Royal jelly of slaughter: 'she and the other opressors pulled in every last one of the talls, and pushed them into the eggs, getting many captures. they also pulled the talls to their death, ending them before they could even notice it. truly one of a kind xeno... REJOICE!!!' by Elder Queen (HEN)

  Ancient Praetorian (GIB-96) is awarded the Royal jelly of slaughter: 'she and the other opressors pulled in every last one of the talls, and pushed them into the eggs, getting many captures. they also pulled the talls to their death, ending them before they could even notice it. truly one of a kind xeno... REJOICE!!!' by Elder Queen (HEN)

  Prime Praetorian (FLA-875) is awarded the Royal jelly of slaughter: 'she and the other opressors pulled in every last one of the talls, and pushed them into the eggs, getting many captures. they also pulled the talls to their death, ending them before they could even notice it. truly one of a kind xeno... REJOICE!!!' by Elder Queen (HEN)

  Elder Carrier (MIU-367) is awarded the Royal jelly of rejuvenation: 'stood strong with the opressors and supplied the hive with eggs. without them we would lack half the sisters who fought with us. one of the greates carriers of all time, her name will be heard across many hives... REJOICE!!!' by Elder Queen (HEN)




