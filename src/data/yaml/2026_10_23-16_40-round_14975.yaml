  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Fenton Kirkson, Kylee Wible, Zoey 'Hex' Rikker, Nyam The Voidless, Genevieve 'Eve' Merani, Bennett Mortland, Chuck 'Gravy' Stackhouse, Edward 'Static' Diaz, Artheis AW Long-Sword, Cameron Korsakoff, The Lake of Bewilderment, Zeo'Blackout' Black, Jason Eggley, Rick Lu Arran, Ervar Hayes, Kier Barkhart, Tiberius 'Tall Boy' Crowley, Sean Burris, Michael 'Hands' LaRue, Moises Leichter, Petra Knez, Willie Manley, Caleb Bloodworth, Masz Rainer, Larry Schmidt, Zoey 'Killer' Grimshaw, Miranda Sebastine, Roaen Morzanth, Dante Minnie, Fumbles-The-Ball, John Radon, Rykel, Pad-Hareeya, Alagnir, Ylva Moss, Glorp Blorbleson, Elena 'Gumpy' Gumpson.



  Royal Jelly Awards:

  Prime Lurker (LOL-764) is awarded the Royal jelly of proliferation: 'My dear prime daughter LOL..

  I have decided to award you with this jelly for the amount of captures you managed to get today

  Unfortunately we have not won this fight but you must know that I am massively proud of you my dear daughter

  You were a lurker from the start though you have unfortunately died during my second body's ovi

  By staying on me, lunging at talls and with my help securing these captures you have managed to capture around 12 or even more talls, I have never been good at maths my daughter..

  It was a tough battle, I may have made some massive mistakes but you shouldn't never forget how grateful I am for having you alongside me for this fight, I could not have had my morale on this level without you

  Rest well my daughter, until your mind finds another body

  With Love<3

  -- Ancient Queen SQUISH' by Immature Queen (SQSH)

  Ancient Carrier (BUB-865) is awarded the Royal jelly of resilience: 'My dear ancient daughter

  From the start you have stayed alive as one of our 2 carriers

  Placing so, so, so many eggs, allowing for quickly securing captures

  Wandering on backlines, placing eggs on frontlines, I am so grateful for you. There are no words which could express my gratitude I really love you for being here with us, for me

  Unfortunately we ended how we ended, by being nuked

  My mistakes many, yours few..

  With Love<3

  -- Ancient Queen SQUISH' by Ancient Queen (SQSH)




