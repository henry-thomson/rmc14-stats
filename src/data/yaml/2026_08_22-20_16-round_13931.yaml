roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Joanna AW Estoc, Nelliel Terhaus.



  Royal Jelly Awards:

  Elder Praetorian (MZ-267) is awarded the Royal jelly of sabotage: 'Though this battle was short lived, MZ played a key role in our swift victory. With a single, masterful pull of her tail, she brought us not only a large group of talls, but their boomstick slinging menace as well. Both this and her capturing efforts were undoubtedly vital in this war. 


  She has earned herself a jelly of sabotage,  for greatly undermining the strength of the talls, leading to our swift victory.' by Prime Queen (LEON)




