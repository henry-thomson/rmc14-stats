roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  John 'Arsonist' Spade, Aiko 'Gnomes' Swimmersman, Gunsly Warman, Irvine 'Danger' Riker, Spike MacLagan, Scarlet 'Scar' Aurora, Bennett Nicholas, Astrid Elster.



  Royal Jelly Awards:

  Ancient Drone (BUG-96) is awarded the Royal jelly of rejuvenation: 'You were the grand savior for our sisters.


  You sacrificed yourself 3 times, to save a boiler, and two times for the same ravager without hesitation.


  You ensured the front was always healed when needed, and you have done quite an impact for this battle. Rejoice!' by Prime Queen (PRO)

  Mature Ravager (VN-919) is awarded the Royal jelly of resilience: 'For your outstanding performance on the front lines, you were the last of the ravagers, from since the beginning to end, you have ensured to shield me, and many others. You made decent amount of captures. Never backing down no matter the cause or reason, making the talls suffer from your performance. 


  Rejoice!' by Prime Queen (PRO)




