  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Luanne Greenawalker.



  Royal Jelly Awards:

  Elder Ravager (RP-125) is awarded the Royal jelly of resilience: 'RP, today you awoke during the hive with a rage that filled within you. You're leadership, your tenacity, your rage. Drove forward our sisters today to many captures and to the talls running with their tail between their legs, your rage ensuring you did not fall to the wasteful spits of the talls. So today I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive.' by Elder Queen (VCR)




