roundEndText: >2-

  [color=blue]"There will come a time, distant from now, or perhaps nearer yet, when the sun rise on all worlds" [/color]

  [color=white] "Our weapons will find no use, for we'd have no need to turn arm against sibling"[/color]

  [color=blue] "The horizons will creep up, and bring about a great light in the world" [/color]

  [color=teal]"and dim night will never come, to usher us back into that darkness of war" [/color]


  "And as we lead our charge..."

  "...To better futures..."

  "...To broader horizons..."

  "...To safer stars..."

  "...We will never give up in our cause, nor surrender ourselves to despair..."

  "...For as long as the our nations link hand in hand..."


  [bold] [color=gold]"Anything is possible" [/bold] [/color]


  [italic]-Ode to the U.N. Circa 2093 [/italic]


