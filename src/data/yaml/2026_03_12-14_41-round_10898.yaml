roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jim Rumble, Bites-the-Darkness, Eats-the-Pizza, Wilco Whittaker.



  Royal Jelly Awards:

  Young Boiler (ORK-744) is awarded the Royal jelly of resilience: 'Thanks to you, and your efforts today, while also with the work with your sisters, you have proved to be an excellent boiler. Keeping the tall menace controlled and denying any easy push for them.

  I am proud of you today.

  With love, LAG' by Ancient Queen (LAG)

  Young Boiler (DO-611-N) is awarded the Royal jelly of resilience: 'Today you have proven to be an essential part of the hive, helping to control the talls push, while also helping with critical captures while boiling today. I am impressed, and also really thankful for having you in the hive today. Keep the good work!

  With love, LAG' by Ancient Queen (LAG)

  Young Boiler (PE-734) is awarded the Royal jelly of resilience: 'Thanks for being with us today, along side with your sisters, you have proven to be a valuable asset for the hive. I am amazed at your work as a boiler, and really proud of you to be still alive today (and not stand on greensticks, really proud of you for that one)

  Thanks to you, the talls feared us, and retreated once they showed minimal weakness. Keep the good work!

  With love, LAG.' by Ancient Queen (LAG)

  Ancient Praetorian (WA-504-LL) is awarded the Royal jelly of proliferation: 'Thanks to you, the hive is as numerous as it is today, your efforts at capturing talls were amazing, you truly deserve this jelly. Thanks for helping the hive today, and to also fight the tall menace. I am really proud of you.

  With love, LAG.' by Ancient Queen (LAG)




  [bold]Operation funded by [color=green]the farms of Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
