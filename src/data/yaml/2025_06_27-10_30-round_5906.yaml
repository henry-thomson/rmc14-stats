  Mature Boiler (BOB-201) is awarded the Royal jelly of slaughter: 'This sister showed true grit during the tall invasion. One of our last surviving T3, as a member of my royal guard they stayed by my side. There boils slaughtered many talls at key moments allowing us to hold out against there advance. Without there help victory on this day would not have been possible.' by Ancient Queen (ARG)




