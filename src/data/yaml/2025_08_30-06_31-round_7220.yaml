roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Yara Kameroni, Diarsia 'Dima' Maxima, Rowan 'Blind' Gibson, unknown, Byron Magor, unknown.



  Royal Jelly Awards:

  Ancient Boiler (OPA-940) is awarded the Royal jelly of resilience: 'For your insane resilience, by bestowing endless boil after boil, this tedious battle was hard fought and you stood firm in your goal and ensuring our hive survival. You have truly had great awareness of your surroundings after countless warnings from me, that of which you did perfectly. this battle is something to remember for you, this battle was exhausting and I bestow this jelly of resilience upon thee for the great effort and determination, never swaying from aiding me.' by Prime Queen (PRO)

  Elder Boiler (PD-635) is awarded the Royal jelly of resilience: 'You were truly a great boiler from beginning to end, when the hive needed defense you were here and there. Green sticks you avoided, tubers you dodged, you have seen it all! This battle was an exhausting one and you were the main caste that have help keep everything all together, I am proud of your work, and I hope to see more of this in the future, and do sure to bestow your knowledge upon future boilers! Rejoice!' by Prime Queen (PRO)

  Mature Drone (FO-847-O) is awarded the Royal jelly of rejuvenation: 'You did an amazing job in a vital timing when I needed healing the moment, I got tubed TWICE by the same tuber. And you healed me as much as possible just so I can scream and punish the tuber reckless action, I am proud of you, you did amazing. hope to see more of this bravery! Rejoice!' by Prime Queen (PRO)




