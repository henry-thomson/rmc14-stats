roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tony Hoffmann, Drinks-the-Razorium, Joshua Lee.



  Medal Awards:

  Second Lieutenant Elric 'Oblivious' Powell is awarded the Distinguished conduct medal: 'For consistently excellent conduct and performance as a Doctor aboard UNS Almayer. Second Lieutenant Powell continues to exceede expectations and serve as a shining example of conduct for all medical personnel.


  Awarded by LtCol. Clyde McKinney on 25/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney

  Warrant Officer Aurora 'Birdcage' Lockheart is awarded the Bronze heart medal: 'For exceptional bravery. Warrant Officer Lockheart sacrificed their life to buy time during the evacuation of UNS Almayer, ensuring that the remnants of the second Company could escape.

  I only wish I were able to give you this award in person, Semper-Fi.


  Awarded by LtCol. Clyde McKinney on 25/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney



  Royal Jelly Awards:

  Elder Hivelord (KO-748-LT) is awarded the Royal jelly of proliferation: 'From the day you were awoken, you decided to volunteer during the time when the hive needed builders the most. As well, you thrived every time I ordered you to build up the many areas that had been cleared by the Tall Menace. You were the sole reason why we defeated the Tall and claimed the planet as our own.


  We won through your sacrifice, because it was your dedication that led us to this victory and brought us to this day. However, it is sad to see that you perished to the bird.


  Rest well, KOLT. You deserve this.' by Elder Queen (SVI)

  Young Ravager (SH-491-A) is awarded the Royal jelly of resilience: 'With your carapace, you were the sole reason why I have lived to tell the tale of this jelly. With your sharp and resilient carapace, your relentless urge to protect your sisters and shield them against the Destinized Spit, you saved multiple sisters. Your carapace was a carrier wall, per se.


  You single-handedly took down the Tuber by enduring two of their death-boom spits, saving my life countless times. I say that you were truly the strongest daughter I have ever had-the most robust and fearless daughter.


  Great job, SHA! You served me amazingly well throughout my death. Even after I returned, you remained loyal and alive to this day.' by Elder Queen (SVI)

  Ancient Ravager (RAN-422) is awarded the Royal jelly of slaughter: 'With your sharp claws and your relentless attitude, you lived through all the mess that I caused. You even tried to save my life after I was tubered, yet it was never successful. However, you lived on until I thrived back into the hive as the true Empress to rule the throne, and you remained loyal to me even after my death.


  You were the sole reason why the Tall Ones perished. With each rotation, each time, we punished them through your slaughterous intent. You wiped them out and captured many of them.


  In the end, you thrived. You won the war for us. Thank you RAN.' by Elder Queen (SVI)




