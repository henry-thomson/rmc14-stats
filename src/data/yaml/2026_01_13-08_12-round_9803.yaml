roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Hivelord (XO-943) is awarded the Royal jelly of proliferation: 'For building for the hive for the entire time!


  Since the beginning you were always our only hivelord, you have done a great job!


  I want to congratulate you for how far you participated in this battle, 1 hour?


  That quite an ordeal, I hope to see your determination keep going forward on making many more structures for the hive, let none shun you down on your performance! Your the best.


  Rejoice!' by Prime Queen (PRO)

  Elder Drone (ZR-196-G) is awarded the Royal jelly of rejuvenation: 'For your great work since the beginning, even heard others proclaim you revive them 3 times in a row from a critical state as they retreated.


  This work is so appreciated, may you save a thousands sisters during your career as our healer.


  You will surely shine in future battles, and hopefully I see this performance an eagerness to save others.


  Keep up the work, this is what healers are meant to truly be!


  Rejoice!' by Prime Queen (PRO)




