  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Derick 'Naptime' Hunt, Bettaius 'pills' Ashford.



  Medal Awards:

  Staff Sergeant Artemis Brown is awarded the Medal of valor: 'While serving as a Squad Leader during Sortie Alpha-Storm, bravely and on their own initiative, executed two concise and well-timed excursions out of FOB to kill the Xenonid Queen's horde and a group of T2 Xenonids respectively. Your courageous and timely orders reflect great credit upon yourself and uphold the highest traditions of the United Nations Marine Corps.' by Lieutenant Colonel The Force of Nature





