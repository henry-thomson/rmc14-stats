roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Drone (AH-48-H) is awarded the Royal jelly of rejuvenation: 'Impressive performance by this child to keep our sisters in the fight. The talls were stopped in their tracks by the constant flood of sisters thanks to AH-H keeping them healed and capable.' by Elder Queen (TEZZ)

  Prime Ravager (PRO-955) is awarded the Royal jelly of slaughter: 'This sister single handedly preoccupied the planet talls until additional sisters came to assit in the murder and even more so, showed a beautiful display of what sentinel in a optimal enviroment. Dragging the planet tall into their own fire while being stunned was the icing on the cake.' by Elder Queen (TEZZ)

  Young Drone (XX-985) is awarded the Royal jelly of proliferation: 'This sister provided many bountiful harvests for the hive with their fruits. These allows sisters to take optimal engagements without much risk to their own health and caused the talls to flee with their tails between their legs.' by Elder Queen (TEZZ)




