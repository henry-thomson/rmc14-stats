roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Ken Navlaan, Eager Drew, Amy Taylor, Roy Russell, Thales 'Careless' Antares, Catthew 'Statue' Jones, Abel 'Hunt' McKnight, Tim Hice.



  Medal Awards:

  Lance Corporal Juan Gonzalez is awarded the Distinguished conduct medal: 'Due to him cleaning up the ENTIRE Almayer accessible to him of his own fruition and as well deploying when asked, I believe that this marine needs to be acknowledge his good deeds. Prep rooms were clean and they promptly deployed to watch the FOB. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 8/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides

  Corporal Reika 'SweetTooth' Inazuma is awarded the Distinguished conduct medal: 'Helped to recovered after a small wipe and hold position. The queen was met with their firepower and unyielding will. Good communications just to make it all the sweeter. Well done!


  Awarded by Lt. Colonel Breaks-the-Tides on 8/16/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Breaks-the-Tides





