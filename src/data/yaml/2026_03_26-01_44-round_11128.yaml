roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Runner (OO-154-P) is awarded the Royal jelly of resilience: 'For ensuring the survival of your sisters by dragging them away from the talls, I grant you this jelly in honor of your noble efforts for the hive today! Excellent work!' by Elder Queen (CTC)

  Young Warrior (IN-870-K) is awarded the Royal jelly of resilience: 'For your noble efforts in ensuring the hive had plenty of resin till your unforunate death later on, you did well following my orders to build in critical areas, for this you have my thanks.' by Elder Queen (CTC)

  Young Praetorian (XL-973) is awarded the Royal jelly of slaughter: 'For your noble efforts in slaughtering the talls alongside your hive Leader Tank, I grant you this Jelly to honor your efforts in causing the talls to break and flee. Well done Child.' by Elder Queen (CTC)

  Young Drone (RA-183) is awarded the Royal jelly of resilience: 'For your steadfast efforts in building the backline, know that mother was watching, listening and deeply pleased to know the backline is safe. Well done.' by Elder Queen (CTC)




