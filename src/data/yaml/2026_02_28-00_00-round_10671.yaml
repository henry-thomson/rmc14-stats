roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jefferson Airplane, Nimble-Bloom, Ruby Indus, Xyshka ''Jawsome'' Solmareth.



  Royal Jelly Awards:

  Ancient Hivelord (WIL-402) is awarded the Royal jelly of resilience: 'Sister WIL was our Designer Lord Build leader since the beginning, building Dyna, front and backline multiple times and even assisting in captures. They were the only leader to survive since the beginning, hence resilience.


  Rejoice my daughter!! May you show your fierce spirit of battle and peace to every sister in the hive!!' by Ancient Queen (RP)

  Elder Carrier (DIE-874) is awarded the Royal jelly of proliferation: 'For their great work with traps and infecting talls accompanying sisters, DIE was indicated by hive to gain a jelly which i agree upon.


  Thank you my dear daughter, and rejoice!! May your traps be eternal!!' by Ancient Queen (RP)




  [bold]Operation funded by [color=green]the Sipper[/color]![/bold]



