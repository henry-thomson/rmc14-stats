roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Primrose 'Pillbox' Mercator, Helios Dawkins, Calliope 'Orbit' Stargazer.



  Royal Jelly Awards:

  Mature Hivelord (RI-52-SK) is awarded the Royal jelly of resilience: 'RISK, we have all seen your work. Your resin stood tall and durable, while the talls were weak and powerless. They could not break our hive, as you lead the build effort against the talls threath. You have done amazing this day and I am proud of your work.


  Such great work has earned you this jelly of resilience, Rejoice!


  See you in the next hive!' by Elder Queen (NEV)

  Ancient Warrior (ULI-132) is awarded the Royal jelly of proliferation: 'ULI, I have seen your work with RAD. Although they could sadly not make it to the end with us, your duo has managed to capture many talls. You fearlessly lunged at talls, stealing them right under their nose as they could only watch them dissappear in our great hive.


  For your many captures and great work, I award you this jelly of proliferation. Great work out there.


  See you in the next hive!' by Elder Queen (NEV)




