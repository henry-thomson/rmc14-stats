roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Lumen 'Losinfob' Lamplight, Tan-Xemo, Vulfstagmir Zadovsky, Clancy Playford, Olaf Pinkbeard, Uthgar 'Oak Chest' Longbeard, Oliver Cooper, Morticia Finn, Eitun Soneyr, Trilly 'Anvil' Vanders, Blorbus Schlime.



  Medal Awards:

  Lance Corporal Rough Grace is awarded the Medal of valor: 'Lance Corporal Rough Grace single handedly manned and maintained requisitions for a significant part of the early operation. In these actions they maintained a high consistency of supplies, quality of drops and ensured every marine had what they needed.


  Without them, this operation would likely have reached an unforunate ending early on in a lack of supplies. Keep it up Lance Corporal.


  Awarded by Maj. Kaitlin Zalack on 14/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack

  Second Lieutenant Dana Smirnov is awarded the Distinguished conduct medal: '2nd Lieutenant Dana Smirnov stood out amongst the rest of intel, having provided a significant amount of intelligence during heavy moments of the operation. 


  Practically every single point of intel had been used to achieve the outcome that was provided, which would not have been possible without you. Keep it up!


  Awarded by Maj. Kaitlin Zalack on 14/07/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Major Kaitlin Zalack





