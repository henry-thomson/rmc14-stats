roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Katerina AW Dragunov, Geel-Parash, Bec Walkins, Alec Bicknell, John Willams, Leo Ruivao, Jonathan Bellford, Evelyn Phillips, Andy Morgan, Auric 'Goober' Dawntide, Kaoli, Schadel Flint, Oswald Faux, Khauono, Makayla Mosser, Sanne 'Greenie' Weiss, Felix Quinn, Jasmine Ryo Sayegh, Hydie AW Steyr-Hahn.



  Royal Jelly Awards:

  Prime Praetorian (ALT-941) is awarded the Royal jelly of resilience: 'My sister REJOICE for with your planning and your screams you managed to pave a clear path for the hive. With your observations of the battlefield you managed to pick perfect targets for the slaughter. REJOICE for the hive THRIVES, because of you.' by Elder Queen (ORB)

  Prime Drone (ASH-447) is awarded the Royal jelly of rejuvenation: 'My sister, with your healing you managed to keep your fellow sisters alive and in the fight when we needed it most. There were also moments when you saw a chance to deal a critical blow to the talls in our hive caves. Without you, your healing, and your noticing of the talls flaws we would not of made it to where we are today REJOICE.' by Elder Queen (ORB)

  Mature Hivelord (VIV-147) is awarded the Royal jelly of proliferation: 'Sister, with your builds in our hive caves you managed to keep us alive especially the core which was of the upmost importance in keeping the hive alive. With the core up and standing strong defended with your build you allowed us the time to slaughter the talls. REJOICE for without you we wouldnt have time to give just punishment to the talls.' by Elder Queen (ORB)

  Elder Ravager (OCE-789) is awarded the Royal jelly of slaughter: 'Sister OCE, my RAVAGER, without you we would not have the strenght to slaughter the talls that we did in our hive caves. With you and our sister ALT we managed to push into the talls and give them the punishment they deserved for daring to come to our planet. REJOICE for without you we wouldnt have had such a wonderful slaughter.' by Elder Queen (ORB)




  [bold]Operation funded by [color=green]Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]The very sweet smell of Apple Fritters[/color]![/bold]
