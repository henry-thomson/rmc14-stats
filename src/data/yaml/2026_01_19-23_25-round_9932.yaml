roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Stares-Ominously, Chip Philips, Iris Starseeker, Zixxum Xeqkeax, Jorge Poppa, Frederick Dogsbottom, Sam Stewart, Dobryn Igoshin, Lyla Su Barrett, Sparkle Zinnia, Meeh-Chu, Yeeh-Chu.



  Medal Awards:

  Fruhl Stargazer is awarded the Distinguished conduct medal: 'Great work today as Charlie's grenadier specialist. You proved yourself to be a consistent threat to the xenonid hive, and I was there personally to witness your zeal in battle and even got to take a few of the bugs down due to your grenades. 


  Awarded by Col. Scraps-the-Copper on 1/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Rosalind King is awarded the Distinguished conduct medal: 'A team effort between you and the other combat technicians - the FOB today was built quickly and to a high standard. Thank you for building the line that we held today, marine.


  Awarded by Col. Scraps-the-Copper on 1/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Derrick Ellis is awarded the Distinguished conduct medal: 'A team effort between you and the other Bravo combat technicians - the FOB today was built quickly and to a high standard. Thank you for building the line that we held today, marine.


  Awarded by Col. Scraps-the-Copper on 1/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





