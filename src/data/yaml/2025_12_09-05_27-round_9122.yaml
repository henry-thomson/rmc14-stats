roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Medal Awards:

  Quelnath 'Doc' Potal is awarded the Distinguished conduct medal: 'Working in close tandem with sergeant Ayem-Duhn, was able to provide obscene amounts of medicine for our medical personnel in short notice.


  Awarded by Col. Scraps-the-Copper on 12/8/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ayem-Duhn is awarded the Distinguished conduct medal: 'Working in close tandem with lieutenant Quelnath, was able to procure an obscene amount of medical supplies for our medical personnel in short notice.


  Awarded by Col. Scraps-the-Copper on 12/8/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Jamal Johnson is awarded the Bronze heart medal: 'For a most valiant effort against the threat of the xenonids, you had paid the price of your life.


  But not before taking a dozen of those bastards down with you. 


  You will be remembered.


  Awarded by Col. Scraps-the-Copper on 12/8/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





