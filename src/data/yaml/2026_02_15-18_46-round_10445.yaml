roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Pablito 'Skinny' Morphy, Mia Dean, Guppy DeBoots, Nolan Allen.



  Royal Jelly Awards:

  Young Hivelord (XX-743) is awarded the Royal jelly of proliferation: 'By resin and by plasma, by construction and by creation, you are the hivelord. As part of the amazing build team, you were an intergral part in the formation of our stratgey, the encircment of talls in layers upon layers of mazes of resin. Despite your youth, you carried yourself well. May we see more of you in the future!' by Immature Queen (CMP)

  Young Drone (EL-163) is awarded the Royal jelly of rejuvenation: 'You are the foundation, you are our base. You are the lifeblood of any well off hive. By plasma and by resin, by foritude and by founding, you are our drone. As part of the vaunted build team, you were intergral to our decisive maneuver, the surronding of talls with resin. Even in your young state, you showed intiative, and comptetence. For your preformance, you deserve this jelly. Rejoice!  May we see more of you in future hives!' by Ancient Queen (CMP)

  Mature Hivelord (RVN-201) is awarded the Royal jelly of proliferation: 'In hives deep and dark, in resin strong and sturdy, you were the architect. With paitetnece and persistance, you built the deciding factor in this war as part of the building team. For your services, and your excellent preformance, i give you this jelly. Rejoice!' by Ancient Queen (CMP)




