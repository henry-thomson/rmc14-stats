roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  Medal Awards:

  Ivan 'DGun' Uvarov is awarded the Medal of valor: 'You took the initiative with a small fireteam to chase down a queen and her small honor guard and made sure she would not be a threat for the future. leading to you all killing the queen after she gibbed an intelegence officer


  Awarded by Maj. Tyr Ragnarson on 12/03/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Alec Gah is awarded the Bronze heart medal: 'you made a sacrifice not many could make. you slowed the queen down enough for a force of marines to chase her down and kill her leading to our victory. your lose is tragic and we will mourne the lose of such a hero. 


  Awarded by Maj. Tyr Ragnarson on 12/03/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Weston-Yamada[/color]![/bold]
