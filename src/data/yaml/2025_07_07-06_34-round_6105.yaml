roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Reon Wolf, Stella 'Cowabunga' Stewart, Kaiser von Falk, Rebeckah Sybilla, Kevin Adamson.



  Royal Jelly Awards:

  Ancient Boiler (OPA-527) is awarded the Royal jelly of resilience: 'Oh my great boiler, OPA, you were an amazing daughter that stick till the end of time. You were at Evil Tower engagement, against the purple talls. You were at the engagement against red talls when I made a daring flank that of which resulted a couple of captures. You were also at the bar, countering against the dumb planet talls, with their scav tall friends. You were pretty much every where, and your help was tremendous and I appreciate every second you were with me, your boils were able to counter every push, and you stood firm against each push the talls made! Rejoice!' by Prime Queen (PRO)

  Mature Lurker (LDK-959) is awarded the Royal jelly of proliferation: 'For your immense help in capturing talls for the future generation, you have surely earned this jelly. I am proud of your work when you were always giving me information when I needed it, frankly may it not be major information, but information at best, that of which allowed me to know when talls were pushing bar. I believe you shined the most during the bar engagement, where you pounce and stun and captured talls from there. You possibly also captured talls else where, but I am not aware of this, but however you did absolutely amazing. I am proud of you as my lurker, may the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Ancient Hivelord (BFF-684) is awarded the Royal jelly of proliferation: 'For your immense performance, you have shown your dedication to the hive defense. You have made the new hivecore, and help ensured that we always had a place to call home. You made sure your resin was able to delay, stop, or even help capture talls at the front. I say because of your strucutres you were a major impact in this battle, I am proud of you, and hope to continue to see you more. May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)




