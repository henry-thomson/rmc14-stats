roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hysteria 'Pocket' Ven, Guy Irwin, Cove Cithreth, Spike MacLagan.



  Royal Jelly Awards:

  Elder Hivelord (JE-4-PH) is awarded the Royal jelly of proliferation: 'For your continous effort in the battle of research caves, 2nd hivecore location. You and only you! Kept repairing the hivecore non stop providing an ideal advantage on the west pylon tower, without orders, without reason, only goal in mind. I am bestowing this for your tireless effort and determination to create something most hivelords always wish, and that is structures of chaos, you are shown your great wisdom, and for that you deserve this jelly!


  Rejoice!' by Prime Queen (PRO)

  Young Drone (XX-523) is awarded the Royal jelly of rejuvenation: 'For your couragous work, and dedication on the west front ensuring that everyone is healthy and continously doing your best effort in ensuring that, you are being rewarded this jelly for your immenseful impact in this battle. 

  Rejoice!' by Prime Queen (PRO)




