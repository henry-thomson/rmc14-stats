roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kayla Alannah, Neoscona Orbweaver.



  Royal Jelly Awards:

  Prime Praetorian (ARG-803) is awarded the Royal jelly of proliferation: 'With your captures, you show to all who valuable a Dancer can be to a hive.


  With your dance, we performed a show of death. Good work, sister.' by Ancient Queen (HEK)

  Ancient Hivelord (DEV-361) is awarded the Royal jelly of resilience: 'With your building and hivelord work, we were a castle that never fell.


  You are a boon to any hive. Well done.' by Ancient Queen (HEK)

  Prime Burrower (FO-324-OL) is awarded the Royal jelly of resilience: 'For your work managing the clusters, what should have been safety for the talls was harm and pain.


  Your work allowed us this victory, further more, your sisters have seen your effort. Rejoice!' by Ancient Queen (HEK)

  Young Boiler (AZA-358) is awarded the Royal jelly of slaughter: 'It is not common a young Boiler survives a war so brutal.


  Your work was noticed by your sisters, rejoice! That is a higher honor than even I can give. Your consistency allowed us to ruin the talls, and your work should be rewarded.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
