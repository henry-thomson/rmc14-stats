roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Noel Stall, Jade 'Fiend' Eria, Drakun Solvador, Chaffu Ryska, Jayden Miller.



  Royal Jelly Awards:

  Ancient Drone (MIU-315) is awarded the Royal jelly of proliferation: 'This jelly is awarded to the sacrificed body of MIU, while their mind is still with us this vessel specifically saved the Queen's life in moments of strife inches away from death at the most crucial time allowing the talls to be eradicated from caves.' by Prime Queen (BOBO)

  Young Boiler (SE-42) is awarded the Royal jelly of resilience: 'For it is resilience that is most important to a boiler, and this sister along with her twin has shown that, staying alive and safely delivering globs of death she managed to stall the talls push in caves, sealing their fate.' by Prime Queen (BOBO)

  Young Boiler (RY-894) is awarded the Royal jelly of resilience: 'Alongside her other twin boiler, she also too stayed alive and understood the combination of the Queen's scream and her bombardment, precisely executing this combo to kill dozens of talls and provide cover with neurotoxin.' by Prime Queen (BOBO)




