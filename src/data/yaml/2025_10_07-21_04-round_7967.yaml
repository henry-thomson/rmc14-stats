roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Rufus 'Ratchet' McNibs, Alice Coffinfill.



  Royal Jelly Awards:

  Young Drone (XX-188) is awarded the Royal jelly of rejuvenation: 'You have done an amazing performance gardener, you may of died, but you were forever remembered in the heart of hive, your support was noticed, and you have given numerous aid to the frontline, when needed the most, may you be proud of earning this jelly because you earned it! Rejoice!' by Prime Queen (PRO)

  Young Carrier (RAZ-740) is awarded the Royal jelly of proliferation: 'Oh young Carrier, RAZ, you have truly shown your performance for the hive, when it was needed most, during when I was reborn as the 2nd queen, you made sure that the clusters were continously repaired at central caves, you have worked along side a hedgehog ravager, as you provided your immense support when it was needed the most. I am proud of you, and the dedication you had provided for this long battle. Also, to add a extra summary, you have also provided extra children to the hive with your abilities. Overall, you earned this jelly. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Kate's Extended Family[/color]![/bold]



