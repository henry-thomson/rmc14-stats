roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Gives-The-Fish, Saber 'Vulpis' Herder, Aerilaya Faereli, Alan 'Gambit' Braun.



  Royal Jelly Awards:

  Young Ravager (SK-19-Z) is awarded the Royal jelly of slaughter: 'For your successful acomplishment of killing the tuber together with RAD and making YIP able to gib you are awarded this jelly of slaughter.


  Not only did you show great courage in jumping head first at the tuber. You also showed great courage in the fight, even though you fell in this battle. The impact you had was felt through out the entire war.


  YIP!!' by Elder Queen (YIP)

  Elder Carrier (EEP-234) is awarded the Royal jelly of proliferation: 'EEP, a trapper who all hives should have. You set up devious traps all over the hive making sure that no hive diver was safe to take a single step without thinking twice.


  Not only did you manage to stop hive divers, you also managed to get us more sisters expanding our ranks! For this you have YIP's gratitude.


  YIP!!' by Elder Queen (YIP)

  Drone (RE-679-ID) is awarded the Royal jelly of rejuvenation: 'REID, your performance as a healer today was admirable. You kept the hive in motion. Constantly healing sisters and making sure everyone was ready for action.


  You are a beacon of what healers should strive to be. Take great pride in your work.


  YIP!!' by Elder Queen (YIP)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
