roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Iris 'Goobia' Cookia, Lenny Figglebottom, Shoots-for-Moon, Spits-The-Fire, Icarus Stormwing, Cassie 'Casual' Philenia, Sanna Holberg, Aroldo Batata, Dodges-Responsibility, Nikolai 'Niki' Bykova, Alex McShain, Pavel AW Su-27, Iken Hannelit, Silas Candlewing, Michael 'Mikey' McGoggins, Danny 'Ketchup' Heinz, Florian Nickolson, Volk Sobaka, Kaska 'Punished' Teodoro, Andrew Graham.



  Medal Awards:

  Corporal Tiche 'Bastion' Immolator is awarded the Distinguished conduct medal: 'For taking the reigns of our beloved gunnery sergeant Darfman, you were able to fill those shoes quite well. Thank you for being there, marine!


  Awarded by Col. Scraps-the-Copper on 3/9/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Gunnery Sergeant Darfman Forgemog is awarded the Bronze heart medal: 'For sacrificing their life in an aggressive counterpush that was ordered without my knowledge. A remarkable display of the fighting spirit you were well known for throughout the corps.


  You will be missed.


  Awarded by Col. Scraps-the-Copper on 3/9/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper





