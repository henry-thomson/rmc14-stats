roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Sebastian Wallick, Isabella Cecil, Jaelyn Beail, Gary Buttersworth, Janina Wood.



  Royal Jelly Awards:

  Ancient Hivelord (TYZ-148) is awarded the Royal jelly of sabotage: 'Without being prompted by mother this sister started the process of encircling talls, rebuilding and re-weeding botany and admin. They enabled us to trap many talls before they had a chance to retreat. Being our only hivelord there were essential in our victory. Bravo!' by Elder Queen (ARG)

  Mature Praetorian (AWW-359) is awarded the Royal jelly of slaughter: 'This sister followed mother as a member of my royal gaurd, they slaughtered many talls and captured even more during screams. Never leaving my side they showed true courage and grit in the tall invasion. Without there help victory would not have been possible.' by Elder Queen (ARG)

  Young Praetorian (XX-184) is awarded the Royal jelly of proliferation: 'This sister was a member of my royal guard. They followed mother faithfully and ensured that many talls would not escape using hook and fling. With there help many talls were captured on this day. Although they are young, they showed the wisdom and grit of an elder sister this day!' by Elder Queen (ARG)

  Mature Hivelord (IVY-225) is awarded the Royal jelly of resilience: 'This sister without being prompted rebuild destoyed hive structures. During the tall invasion many of our capture zones were taken by the talls, they ensured they were rebuilt quickly. Without there help the hive would not have been able to secure so many captures. Bravo!' by Elder Queen (ARG)




