roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rowan Gibson, Larry BB Shorty, Vin 'Birthday girl' Peyton, Blobby Oozeworth, Stony Tony, Beem-Wuleen, Dives-the-Caves, Tony Camp, David 'Dig' Diggle.



  Royal Jelly Awards:

  Young Hivelord (TS-193) is awarded the Royal jelly of proliferation: 'During the beginning of the hive, you were choosen as build leader, even though the hive crumbled, your work was noted, I hope you volunteer to be hive leader more in the future.


  Ashame the hive didn't succeed, but I hope you had fun though.' by Prime Queen (PRO)

  Elder Warrior (HEK-89) is awarded the Royal jelly of resilience: 'You were a outstanding warrior leading your sisters in battle, you falling in engineering was heart breaking, even if the hive as crumbled.


  Your work was noted, and I hope to see you continue down this pathway.' by Prime Queen (PRO)




