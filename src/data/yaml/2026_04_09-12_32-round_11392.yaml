roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vez-Pura.



  Royal Jelly Awards:

  Elder Drone (ME-165-L) is awarded the Royal jelly of rejuvenation: 'MEL from what ive seen and have been told did the up most effort in keeping her sisters alive and health, to you i give this jelly, well done.' by Elder Queen (IED)

  Ancient Ravager (HEN-36) is awarded the Royal jelly of slaughter: 'Not only helped call out targets and assisted me during are assults but along side NEV prove instremental to winning us this day, well done.' by Elder Queen (IED)

  Ancient Ravager (NEV-562) is awarded the Royal jelly of slaughter: 'Alongside HEH not only did they help slaughter the talls, they prove just how good a well trained ravager is and is an example to them all. well done' by Elder Queen (IED)

  Elder Boiler (UWU-929) is awarded the Royal jelly of sabotage: 'Time and Time again did you help hold back the talls not only that but stopped them from wiping us a few time by delaying them, to you goes this jelly, well done.' by Elder Queen (IED)




