roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kessler Campbell.



  Royal Jelly Awards:

  Mature Sentinel (KY-267-LE) is awarded the Royal jelly of proliferation: 'During the engagemenrt north west of Miyahira, the battle of Hybrisa. You made an engagement against two zero carapace talls where you perfectly kept both knocked down for sisters to arrive to help with capturing them. That was some amazing spit cycling between the two talls. Rejoice for your accomplishment!' by Prime Queen (PRO)

  Young Hivelord (JDE-255) is awarded the Royal jelly of proliferation: 'Built up most of the hive defenses since the beginning to end. You rebuilt Dyna, Ironbridge. Basically most critical required construction was done by your claws. I had witness them all, I am thankful I had a hivelord who was committed to such eager dedicated work. May you continue to provide the hive great homes made by your own wisdom. Rejoice! This taken place of the battle of Hybrisa.' by Prime Queen (PRO)

  Ancient Ravager (ARG-785) is awarded the Royal jelly of slaughter: 'During the time you were an ancient ravager, you made a single wipe that was noted of which was the red talls which scored us quite a decent amount of captures. AFter that you made great engagements north west of Miyahira, even almost capturing the tuber. The most magnificent thing as well was you wiping all the talls at their escape attempt going to a dead end. I am quite impress of your strength. May I continue to see this great work.' by Prime Queen (PRO)




