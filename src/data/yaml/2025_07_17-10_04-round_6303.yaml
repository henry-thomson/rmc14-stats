  [color=purple]All of the marines were wiped out![/color]


  Royal Jelly Awards:

  Elder Drone (VOS-591) is awarded the Royal jelly of rejuvenation: 'I am bestowing this jelly because it show the sacrifice that you made that was absolutely peak performance, you saved ARG the vanguard that was a vital importance in the battle. You have ensured the death of many talls because of your saving on that one vanguard. I am also proud of the fact that you did absolute amazing in providing necessary healing when it was needed at the front your help was highly noted. May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (ARG-529) is awarded the Royal jelly of slaughter: 'You did an absolute amazing job vanguard, you pierce, cleave, rooted. You name it! you were always an essential front line that kept the talls at bay when I ovi'ed you also help reclaimed A block multiple times, to ensure that I could build on their flank and get them killed with ease! I am proud of the way that you followed orders instantly upon me saying them. Absolute unit as always, and I hope to see more of that in the future! Not to mention, you slaughter the talls retreat, when the tuber died finally! May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Young Ravager (FOG-322) is awarded the Royal jelly of resilience: 'You did an absolute amazing job, you help lead the push in A block which allowed us to get the talls flank repeatitively, allowing us to keep putting pressure when it was needed. You also kept on capturing talls when it was needed, and slaughtered the talls main retreat which was their final attempt, may the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (LOL-403) is awarded the Royal jelly of proliferation: 'You were a amazing help at the backlines, whenever I ordered that A block is to be resecured you were there building away, and also allowing me to put my help into it as well. I am also going to state it has help the hive enact upon the yellow talls which allowed us to get many captures. Not to mention your resin structures were able to get us kill the entire front line talls with ease because as they retreated... they met an entire blob of resin that they can't even fathom to pass through. May you pass your knowledge to many other hivelords alike, and drones, so they may prosper as you did! May the Queen Mother watch over you! Rejoice!' by Prime Queen (PRO)




