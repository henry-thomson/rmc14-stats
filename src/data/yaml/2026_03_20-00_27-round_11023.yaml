roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Skofnung Steelwall, Kyle 'Helper' Winslow, Grimgut Steelwall.



  Medal Awards:

  Corporal Leo Taggart is awarded the Distinguished conduct medal: 'For a strong performance as smart gun operator - supporting the correct charges, and communicating with CIC consistently to make sure those charges were correct and lethal. Good work, marine.


  Awarded by Col. Scraps-the-Copper on 3/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Private First Class Nezuni is awarded the Distinguished conduct medal: 'As per recommendation of the Charlie squad leader -


  For giving outstanding mortar support throughout the operation - ensuring that the xenonids had no cover nor hive to retreat to. The result of these efforts were self evident today.


  Awarded by Col. Scraps-the-Copper on 3/19/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper





