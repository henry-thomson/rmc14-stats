roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Tereseeva 'Soviet' Valda, Ash Lightweaver, Moses 'Southpaw' White, Kaede Leper, Cassian Varriger, Rodentu Vileni, Zeke Best, Cydia 'Dubs' Bifasciata, Jasper 'Stonewall' McClen, Loves-the-Company, Luna Reinhardt, Kokan, Russell Day.



  Medal Awards:

  Corporal Kalaveer 'Kala' Singh is awarded the Distinguished conduct medal: 'Corporal Singh you and your crew member Corporal Qauijili'Atuga managed to kill not one but two Queen this day. Both of your excellent preformance today in the Tank has show it true strength. You set a high bar for all vehicle crewman in the UNMC and I hope to see you both keep raising them.


  Awarded by Major Atlas 'Wolfy' Snowlight on 07/31/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Major Atlas 'Wolfy' Snowlight





