roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Quarter-Off, Sebastian Mothman, Xaeter.



  Royal Jelly Awards:

  Young Boiler (AA-92) is awarded the Royal jelly of sabotage: 'For being our artillary of the front, you provided substanial amount of support with your boils, that allowed captures to be with ease, and it also provided as a smoke screen letting me continue forward as I should. I hope you continue your great efforts in providing such valuable support in the future. Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (XX-994-Y) is awarded the Royal jelly of proliferation: 'You were beginning hivelord leader, that built up a great amount of walls and of the hive with your sisters. You also had a designer if I remember correctly, but they did fall at some point, however that still made you able to continue quite greatly in providing what you can in terms of structuring and back up support for the hive. Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Tivii the Great[/color]![/bold]



  [bold]Hive established by [color=purple]Cocaine Accessories[/color]![/bold]
