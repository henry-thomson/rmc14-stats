roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Paff XV, Rockie Kamble, Slime Brown.



  Royal Jelly Awards:

  Young Ravager (RA-76) is awarded the Royal jelly of resilience: 'For your absolute amazing hedgehog skills where you were able to tank so much spit that I lost count.


  Even surviving brink death from a tuber, you shown these talls what were you made of!



  Rejoice!' by Prime Queen (PRO)

  Young Defender (NA-973-P) is awarded the Royal jelly of resilience: 'You showed these talls you meant business tanking and defending all you could.


  One key moment I can recall in detail is you shielding me as I made a capture. Tanking a tube spit to the face, that of which you survived. Well done.' by Prime Queen (PRO)

  Young Hivelord (PIE-428) is awarded the Royal jelly of sabotage: 'Absolute amazing designer skills that I saw on the front, that made quite a great show that allowed me, and many others to take advantage of.


  You did wonderfully placing those evil optimal nodes where I can trap talls.


  Keep up the creativity I like to see it.' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



