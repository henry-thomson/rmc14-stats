  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Milliv, Virgil Dread.



  Royal Jelly Awards:

  Mature Ravager (NOX-20) is awarded the Royal jelly of slaughter: 'You have shown fear into the talls as a berserker NOX,  you got inside the talls bird, killed them all, then also held so long that a bird controller woke up from one of the children getting on them, and they flew you back down that actually wild, you have slaughter quite alot of talls permanently because of that. May the Queen Mother guide you through your next time as a berserker, you have done remarkable, Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (REH-72) is awarded the Royal jelly of proliferation: 'For your remarkable warriors skills, you have earned 6 to 7 captures as a warrior. Most warriors can't even get that to occur but you made it happen! The Queen Mother would be proud of your actions, I hope to see more of that in the future. You have done a significant impact on this battle. Rejoice!' by Prime Queen (PRO)

  Young Warrior (HL-648) is awarded the Royal jelly of resilience: 'As a defender you were truly remarkable, acting a shield for the hive as a Steel Crest. The Major impacts you did this battle was shielding me and many others. Main point you were a great daughter that I was able to rely on to provide cover for me whilst I was making captures. Truly remarkable, and you making all those talls waste spit on you for absolutely no reason. Rejoice!' by Prime Queen (PRO)

  Mature Drone (FR-485-T) is awarded the Royal jelly of rejuvenation: 'You have done remarkable this battle FRT, you were providing crucial healing with your fruits at all times, providing unstable fruits, to greater resin fruits. All were eaten and help the hive tremendously on recovery, including me! You have phenomenal, be proud and may the Queen Mother watch over your future. Rejoice!' by Prime Queen (PRO)




