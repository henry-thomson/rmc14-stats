  In memoriam of our fallen soldiers: 

  Blobby Oozeworth, Dry Wetbrush, Wyatt Evans, John Arcade, Kamiel Lancoaster, Daxter Six, Cash James, Jothua 'Osprey' Mothington, Vince Coldsmith, Stares-at-Stars, Jei-Tulm, Tibarn Magnus, Xeqxuq Qerrxerr, David Davidson, Olivia Lambert, Beedo Waggin, Omi Actias, Pip Soak, Conner ''Cadian'' McNuggins, Thirty-Units-Carbon, Mason 'Trench' Edwards, The Pome of Mercuriality, Heck Bock, Thick-fur Scurryfoot, Ash Vanderholm, Hestia Odessa.



  Medal Awards:

  Althea Leander is awarded the Distinguished conduct medal: 'Recommendation by 2nd Lt, Chee-Kilaya on the behalf of Cpl Althea Leander for "Excellent shooting with the M5-ATL." "Delta SADAR managed to keep themselves alive throughout the duration of the op, hel'

