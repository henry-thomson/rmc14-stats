roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Drakun Solvador, Christopher Mainton, Jericho 'Steel' Skirata, Caleb Bloodworth, Bec ''Dragon'' Walkins, Alexis 'Concord' Mayfield, Scrub McNeuer, Bonney 'Bun' Violet, Elroy Aegyr.



  Royal Jelly Awards:

  Prime Praetorian (ACE-706) is awarded the Royal jelly of sabotage: 'I had grown to take the mantle. And somehow, you managed to get their Queen. Whom upon bursting completely threw the talls coordination apart. Allowing the talls to flee.


  And in their cowardice, upon leaving. We managed to grow our King. Allowing us to benefit upon attacking the Talls Metal hive in the sky. Rejoice sister, for you are very deserving of this jelly. As it helped us quite a bit during a difficult time.' by Elder Queen (OXD)




  [bold]Operation funded by [color=green]the sale of Yeo's stew[/color]![/bold]



  [bold]Hive established by [color=purple]The gibbing of the Blueberry[/color]![/bold]
