roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Mature Ravager (CU-747-BA) is awarded the Royal jelly of rejuvenation: 'For amazing leadership when all old leaders fallen, you stood high leading the sisters you could into battle.


  You were keeping everything together as you were the last leader standing. Overall, I want to say you did a fine job getting orders done.


  Thank you of the bottom of my heart for every second. Rejoice!' by Prime Queen (PRO)

  Young Boiler (PO-452-N) is awarded the Royal jelly of sabotage: 'You sabotaged the main tall defenses at their hivemind, and make it extremely easy to take over.


  The talls stood no chance against your boils, thank you for making it extremely easy to push the talls defenses down with proper coordination.


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (DA-742) is awarded the Royal jelly of proliferation: 'Making builders cohesive, an generally putting forth there best in leading her sisters in logistical areas thast was needed.


  You provided alot of structures and support that allowed us to take out what was needed for the hive.


  Rejoice!' by Prime Queen (PRO)




