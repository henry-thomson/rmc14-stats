roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Otto von Eichensthal, Chews-the-Wires, Bonney 'Bun', Aurora 'Birdcage' Barkheart, Alicor 'Pinkie' Merow.



  Royal Jelly Awards:

  Prime Drone (EF-975-EE) is awarded the Royal jelly of rejuvenation: 'EFEE, You have saved my life during the planet tall rush. I went crit after they had decided to rush me with no regard for their lives, yet you sacrificed yourself to heal me just in time to finish the rush, ending them swiftly.


  For this, I award you the jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)

  Ancient Drone (OWT-420) is awarded the Royal jelly of rejuvenation: 'OWT, You have healed the entire hive multiple times over. You have worked tirelessly to keep sisters healthy so that they could capture and kill all the talls.


  For your work, I award you this jelly of rejuvenation.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Praetorian (LEO-757) is awarded the Royal jelly of resilience: 'LEO, You have saved my life on multiple occasions, be it from the tuber, the longspit or just talls rushing me down. You have made sure mother would make it to the end.


  For this, I award you this jelly of resilience.


  See you in the next hive!' by Ancient Queen (NEV)




