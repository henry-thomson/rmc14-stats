roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jade Ware, Salvadore 'Vespucci' Wemerson, Kramo'Black'Dukalis, Brom Matlock, Bryson Radcliff, Riley O'Riley, Gnaws-on-Bones, Paul 'Rookie' Nelson.



  Medal Awards:

  Lance Corporal Azeel-Tail is awarded the Distinguished conduct medal: 'Lance Corporal Azeel-Tail has proven themselves to be a key asset during Operation: Patrol November-Papa. Without fear or hesitation, they have used an M34 Incinerator extensively to clear out any xenonid resin that stood to oppose our extermination efforts. Thanks to their initiative in taking up the role of a pyrotechnician, our troops were able to safely advance into the tight corridors of the planet LV-624.' by Lieutenant Colonel Michael Wilson

  Lance Corporal Ups-The-Downs is awarded the Distinguished conduct medal: 'During Operation: Patrol November-Papa, Lance Corporal Ups-the-Downs went above and beyond their required duty and exceeded expectations by expertly operating an M85 Grenade Launcher. Thanks to their precision and excellent timing, we were able to terminate multiple xenonid specimens and gain significant ground. They have proven especially effective in the tight choke points within the caves of the planet LV-624.' by Lieutenant Colonel Michael Wilson





  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
