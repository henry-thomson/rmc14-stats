  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Tasha 'Fumbles' Serrcof, Kyra Cowart, Allyson 'Ally' Bennet, Yeo 'Sakura' Bunnia, Beace Poppers.



  Royal Jelly Awards:

  Ancient Hivelord (BL-316-DR) is awarded the Royal jelly of resilience: 'During the rush to kill the planet talls, nearly my entire hive went combat castes. This left us with little time to build the hive. As the lone builder this designer crafted each and every wall of our hive. Without thier efforts we would not have had sufficent resin to beat the tall invasion. Bravo!' by Prime Queen (ARG)




