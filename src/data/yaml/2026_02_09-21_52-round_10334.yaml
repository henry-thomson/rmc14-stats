roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Jason Cross, Sadie Sims.



  Medal Awards:

  Lance Corporal Grogni Unboki is awarded the Distinguished conduct medal: 'you son supported your squad through thick and thin. one of the leading contributers to us pushing through this massive infestation laying down heavy fire support and gunning down anything in their path. and leading to our victory


  Awarded by Lt Col. Tyr Ragnarson on 02/09/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Tyr 'Tex' Ragnarson

  Lance Corporal Blake 'Bark' Barker is awarded the Bronze heart medal: 'you layed down heavy fire with yer new fancy gun. staying mobile and quick. mowing down many of their T3s crippling them before they could fully adapt to what was happening to them


  Awarded by Lt Col. Tyr Ragnarson on 02/09/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Tyr 'Tex' Ragnarson





