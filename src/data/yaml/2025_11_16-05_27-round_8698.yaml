roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Erin Baker, Tyrone Choom, Dusty 'Mothman' Johnson.



  Medal Awards:

  Luanne Greenawalker is awarded the Medal of valor: 'Holding the line against a multitude of boilers, running through fire to save your smart gunner through from the clutches of the queen, and finally killing her yourself once their drone let you out of their grasp.


  I must say, it was impressive and inspiring to watch you from up in the comfort of the CIC. What a feeling it must have been to see you in action in person.


  Awarded by Col. Scraps-the-Copper on 11/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Ivan 'DGun' Uvarov is awarded the Distinguished conduct medal: 'An absolute terror in the backlines, and a marine who has certainly proved themselves to have a killing spirit. Hunting down the final two xenonids under my direction, as well as spelling the demise of three xenonids earlier while we were undertaking efforts to clear our backline - these efforts were not to go unnoticed.


  Awarded by Col. Scraps-the-Copper on 11/15/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





