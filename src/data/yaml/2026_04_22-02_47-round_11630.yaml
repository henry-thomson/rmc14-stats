  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Samuel Gonzales, Mizuno 'Kitty' Drakonovisch, Lilith AW Derringer, Locke Delgado, Squeaky Luna.



  Medal Awards:

  Second Lieutenant Derick 'Naptime' Hunt is awarded the Medal of valor: 'While serving as a AUD-25 Gunship pilot during Exercise Obsidian-Voodoo, performed multiple precise and devastating strikes against Xenonid hostiles that crippled the hive's ability to sustain a defense. They reflected great credit upon themselves and the UN Marine Corps as a whole through their outstanding work.' by Lieutenant Colonel The Force of Nature

  Private First Class Drake 'Dietcola' Di'Angelo is awarded the Distinguished conduct medal: 'While serving as a Rifleman during Exercise Obsidian-Voodoo, fearlessly charged into T3 Xenonid contacts during a high-stakes push against a hive. Their bravery secured later kills, and ensured that medics could work through an offensive defense. If every marine were as steeled as you, we'd have no more wars.' by Lieutenant Colonel The Force of Nature





