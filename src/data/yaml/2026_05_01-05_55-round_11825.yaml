roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Jeiske, Occidere Chuzhak, Nimble 'Cotton' Bloom, Lilliana Taggart, Tasha Serrcof, Minji 'Failsafe' Kilgrim, Emiko AW Kaiten, Jan Korzche, Eris Talonpath, Nova Chapman, Haily 'Hooks' Stal.



  Royal Jelly Awards:

  Mature Drone (LW-739) is awarded the Royal jelly of rejuvenation: 'During a key moment I stood and lay my eyes upon you, you were healing so much that you went critical east of botany. I want to conserve this jelly for your purpose as our healer for ensuring the survival of not just me, but all the sisters around. I thank you for doing what you could. You will not be forgotten.' by Prime Queen (PRO)

  Young Hivelord (BO-266-I) is awarded the Royal jelly of proliferation: 'For pushing pressure on the south end of ablock, creating distraction for the hive, that occupied the sight of enough talls that it was worth mentioning. I also thank you for rebuilding the entire ablock area after they ruthlessly skyfired it in less than not even a minute. Your help was noted! Rejoice!' by Prime Queen (PRO)

  Young Carrier (CC-65) is awarded the Royal jelly of proliferation: 'You were our only carrier, this entire battle. I thank you for putting every tall asleep that you could provide. Overall, you were one of the major support in ensuring talls had a good nap in the nests thanks to you. I am impressed you learned quickly as a role of carrier. Keep it up!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]Xeno Research Laboratory[/color]![/bold]
