roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Garibaldi 'Ballin' Newley, Polo Schmitt, Marcos Magor.



  Royal Jelly Awards:

  Prime Drone (ASH-648) is awarded the Royal jelly of proliferation: 'Your work today was nothing short of spectacular. You kept the build together and led it when it was needed in both the colony and the beach. Though you may have great experience with building in your time, it is never not worth it to give thanks to wonderful build when it is given. Thank you for your hard work and dedication



  -Love, Mother' by Elder Queen (JIN)

  Ancient Defender (PRO-483) is awarded the Royal jelly of sabotage: 'As i said in the ceremony, even though you are known and revered, good work should never go unnoticed. You tactfully snuck into their backline and the perfect moment and secured us an amazing foothold in the colony, securing a win for us. I can speak for the hive when I say we you won us the day. Of course, I cannot forget the countless absurdly daring dives and pushes you made and your amazing work in securing captures.


  -Love, Mother' by Elder Queen (JIN)

  Elder Ravager (ZE-716-RG) is awarded the Royal jelly of resilience: 'You were one of the most loyal sisters to the hive today. You were constantly on point in being exactly where you were needed, and you pressence alone in certain positons shifted the tides of the battle. Again, it may not have seemed like much from your own perspective, but it did wonders for the battle as whole. You deserve this jelly. Do not doubt it.


  -Love, Mother' by Elder Queen (JIN)

  Elder Drone (VAD-541) is awarded the Royal jelly of rejuvenation: 'Your work today keeping any and everyone you could see alive today was wonderful. Healing may seem like the most boring or egergious job at times, but it is nonetheless almost the very lifeblood of a hive at times. The hive as a whole thanks you for your hard efforst today. Rejoice!



  -Love, Mother' by Elder Queen (JIN)




