roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Knox Eterna.



  Royal Jelly Awards:

  Elder Praetorian (NE-21-LL) is awarded the Royal jelly of proliferation: 'I am awarding the Jelly of Proliferation to this sister today for her fine work as an oppressor. This one has fished in many talls and captures for our hive, allowing us to maintain a high number of sisters to fight against the talls on this planet. Rejoice!' by Elder Queen (KRIS)

  Prime Ravager (PRO-539) is awarded the Royal jelly of slaughter: 'We have had many ravagers in our hive today, but I'd like to bestow the Jelly of Slaughter upon this sister for not only helping us wipe the talls on the planet, but also shielding me from near death, saving me. Rejoice!' by Elder Queen (KRIS)

  Hivelord (LMN-46) is awarded the Royal jelly of proliferation: 'This sister has done an excellent job at constructing resin for our hive today, and I would like to give her the Jelly of Proliferation for her work. She has worked alongside the designer hivelord, RAD, making sure the talls had a lot of resin to go through within the caves, stalling them long enough for our sisters to evolve. Rejoice!' by Elder Queen (KRIS)

  Elder Sentinel (ROT-289) is awarded the Royal jelly of slaughter: 'This sister was a boiler before sadly dying on the perch. Nonetheless, I'd like to give her the Jelly of Slaughter for how helpful she proved to be in wiping the talls that have invaded our planet, turning the caves into a burning doom for them, working with our ravagers to wipe them all. Rejoice!' by Elder Queen (KRIS)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
