  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Stabs-with-Thorn.



  Royal Jelly Awards:

  Elder Ravager (GUH-618) is awarded the Royal jelly of resilience: 'Well done my Elder Ravager GUH, you have shown these talls no mercy. You have captured talls I have neurospitted, screamed at, and much more. You were always my shield and blade in arms. No matter where I went or go. You would always be on my side defending me, and attacking talls in my name. You have also went near death many times, but was always unwavering, never faultering infront of the disgusting talls. You were a beacon of the hive, and for that you deserve this jelly for your profound phenomenal performance, may the Queen Mother watch upon you. Rejoice!' by Prime Queen (PRO)

  Young Hivelord (TR-303) is awarded the Royal jelly of sabotage: 'Congratulation my young Hivelord TR-303, you were a vital importance of this battle, by providing eyes on our flanks, and even giving phenomenal reports to me, and the hive. Not just that, but you were building and slowing the talls without a second thought. You were the main reason those talls on the flank suffer, because of you telling the hive, and slowing them down to prevent them from reaching the hivecore. You have help the hive tremendously, it made us gain instantly 5 captures for free. May the Queen Mother oversee your future journies, and protect you. Rejoice!' by Prime Queen (PRO)




