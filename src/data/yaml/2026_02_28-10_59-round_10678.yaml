roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Young Boiler (AST-828) is awarded the Royal jelly of slaughter: 'Even if you are a young boiler, you are a prime at heart. I have never seen a boiler so amazing in their begginings. You truly showed an incredible work today. Helping us keep the talls from escaping and also getting really good captures with your boils.

  And also you showed great teamwork with your boiler sister NEW!

  Keep up the good work. 

  With love, LAG!!' by Elder Queen (LAG)

  Young Boiler (NE-619-W) is awarded the Royal jelly of slaughter: 'Today you have proven yourself to be a fundamental asset of the hive. Without you, this hive wouldnt be here today. Your work as a boiler will not go forgotten by this hive, because you are the reason why we are still here today. I am really proud to give you this jelly today. While being a young boiler, you have proven yourself to be one of the best boilers in all hives.

  You have also proven to synergize with your sisters and working as a team, specially with your boiler sister AST!

  Keep doing such an amazing job.

  With love, LAG!' by Elder Queen (LAG)

  Mature Drone (CB-371-K) is awarded the Royal jelly of rejuvenation: 'Thanks to you, and your effort as a healer. The hive stays alive, (also me!), I am really thankful for your work today, you have proven yourself to know how to act under extreme pressure and still make the right choice.

  Thank you!

  With love, LAG' by Elder Queen (LAG)

  Prime Warrior (FAN-817) is awarded the Royal jelly of slaughter: 'You have managed to kill so many talls today, reducing their numbers a lot, while also holding strategic position that helped us kill even more talls!! Thanks for your work today!!

  I cant forget to mention that you really made a big pile of dead talls today in that choke, was amusing to see.

  It is always good to see you in the hive.

  With love, LAG!' by Elder Queen (LAG)




