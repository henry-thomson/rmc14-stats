roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Zurimena Kalia, Alexis 'Queen' Greenholt, Bong, Jobert Bobson.



  Royal Jelly Awards:

  Elder Boiler (BL-747-DR) is awarded the Royal jelly of sabotage: 'Today, your boils have been nothing short of amazing. You lived through all the trials that were thrown at you and always performed your best, eventually bringing us this victory. For that you get the Royal jelly of sabotage! May your boils prove worthy in many hives to come.' by Elder Queen (NSKO)

  Elder Hivelord (XX-15) is awarded the Royal jelly of resilience: 'Today XX, you have done amazing. Your consistent build gave us the necessary cover to attack the talls and you were constantly building up their backlines making tall retreats hard. This in the end won us this battle. Should your build prove useful for many hives to come.' by Elder Queen (NSKO)

  Elder Carrier (ZAI-999) is awarded the Royal jelly of rejuvenation: 'Your constant traps today allowed us to secure many many captures that would of potentially been lost, You were there whenever we needed it to infect the talls allowing a constant influx of new sisters, which eventually got us victory. May your traps be plentiful in the future and prove such worth again.' by Elder Queen (NSKO)

  Defender (CRY-577) is awarded the Royal jelly of slaughter: 'For your work today as a defender, you managed to solo capture the flamewalker from the tall ball and caused a wipe which made the talls go into a panic, for this work i will be rewarding you today. May your work in future hives be as great as this.' by Elder Queen (NSKO)




  [bold]Operation funded by [color=green]Lilith's Firearm Manufactory[/color]![/bold]



  [bold]Hive established by [color=purple]Lilith's Xenonid Research Division[/color]![/bold]
