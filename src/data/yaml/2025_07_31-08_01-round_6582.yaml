roundEndText: >2

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Little Scurryfoot, Austin 'Un'Lucky' Eventide, Mariana Butterfill.



  Royal Jelly Awards:

  Elder Ravager (ERC-138) is awarded the Royal jelly of resilience: 'One of my hive foundlings, who persisted against talls through the entire battle. Through their might, we were able to crush dozens upon dozens of talls underfoot, until they were driven from our home.' by Ancient Queen (ONE)

  Elder Praetorian (BLO-965) is awarded the Royal jelly of resilience: 'A hive foundling, who, by persisting against all odds, managed to kill and cap a great many talls in battle. At the hive's darkest hour, it is rare to find a T3 who survives so long.' by Ancient Queen (ONE)

  Young Drone (XX-498) is awarded the Royal jelly of rejuvenation: 'A potent healer, who's support was invaluable, and who saved the life of one of my T3s. it is rare to find such talent in one so young.' by Ancient Queen (ONE)

  Prime Drone (TO-170-MB) is awarded the Royal jelly of proliferation: 'A skilled gardener, whose support kept my T3s nourished and constantly in the fight. It is thanks to their aid that my hive found the support it needed to persist, and to destroy talls.' by Ancient Queen (ONE)
