roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Granola 'Biggy' Foot, Kiadrys 'The Red' Karstein, Stellamaris Hall, Eitun Soneyr, Squeaky Chip, Chase Crooks.



  Royal Jelly Awards:

  Elder Praetorian (YEP-260) is awarded the Royal jelly of slaughter: 'A jelly one of a kind! I avoid combat sister jellies, however YEP went out and beyond in this conquest. Whether by luck or skill, she managed to pull in capture after capture, but even more so after initating an extremely valuable fight. Superb work YEP, your contributions made way towards a total domination!' by Prime Queen (LIMA)

  Prime Carrier (ZAO-158) is awarded the Royal jelly of proliferation: 'I will never live this down, however ZAO pull of major manuevers in this conquest. A jelly like no other, her core placements were utterly on point, cathing off any stragglers, and with total decidaction, ZAO was the single carrier, sitting on the edge of the front yet creating eggs left and right! ZAO is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)

  Young Praetorian (NE-914-T3) is awarded the Royal jelly of proliferation: 'Since I am breaking all the norms today. Our most noble valkyrie was on point the whole war. Her powerful stomppers were making tall dizzy and incapable of fight at just the right moment! They saved many of their sisters, and killed just as many talls, directly or indicredly. The future of the hive depends on you!' by Prime Queen (LIMA)

  Hivelord (OG-504) is awarded the Royal jelly of resilience: 'OG proved herself as an incredible show of resilience and survival! Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! Through her talents and dedication, talls could not push one step forward! Your work will be in high demand!' by Prime Queen (LIMA)

  Young Drone (IK-630) is awarded the Royal jelly of rejuvenation: 'Our main joy of the hive IK, played a role of utmost importance! Always at the front, saving her queen in times of need. She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. We can only hope she continues to help us the never ending slaughter!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
