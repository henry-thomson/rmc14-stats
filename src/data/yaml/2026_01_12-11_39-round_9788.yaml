roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Drik 'SECAD'Fulton.



  Royal Jelly Awards:

  Ancient Drone (YIP-297) is awarded the Royal jelly of rejuvenation: 'For your immense impact, by giving me solely just alacrit, you have allowed me to just give me the speed I need.


  It allowed me to capture so many talls, I lost count honestly, and your the only sole reason my sanity did not break.


  For that I bestow this jelly in such good faith to always supply me alacrit, and others. I am proud of the work you did, it was amazing.


  Rejoice!' by Prime Queen (PRO)

  Ancient Defender (ALT-578) is awarded the Royal jelly of proliferation: 'For capturing so many talls for me and the hive, I am bestowing this in good faith for how much you have helped me in this battle.


  Overall you have captured at least ten talls for the hive, that is like 2 larva surges, that is amazing. Expotentially great!


  You deserve this, keep up the mindset always be capturing.


  inspire others around you on how to capture, and be just like you!


  You shown a great example of how to be a great defender!


  Rejoice!' by Prime Queen (PRO)

  Young Praetorian (FO-261) is awarded the Royal jelly of resilience: 'For your hard work, I am sorry that you got destroyed by the sky spit, I should of warned you.


  However, you have shown remarkable growth, I wish I was able to teach you more, so that you learn the ropes a bit more about valk.


  Overall, you shown you have learned how to drag capture, you became the last tier 3 alive. as a young that remarkable, most youngs don't even live through a battle, but you live till the end as best as you could.


  I am going engrave a little teaching, but always use warding to save others around you, I know you can be the best, and the best you will be just keep it up!


  Rejoice!' by Prime Queen (PRO)




