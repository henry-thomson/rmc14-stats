roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Edy Nelson, Silas Swarner, Conrad Arbor, Hersilia Adams, Esmeralda 'Rockin' Stone.



  Royal Jelly Awards:

  Prime Defender (JE-623-PH) is awarded the Royal jelly of resilience: 'For your heroic sacrifice when I got tubed, you decided to fortify to ensure no harm was done to me.


  Even if talls weren't spitting at me, intent is what matters the most as you put me first above else. Great work!


  Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (JE-913-O) is awarded the Royal jelly of proliferation: 'Since the beginning of time, you built every single area talls tried to clear, it was so amazing I could weep a thousand fold.


  Such beauty and dedication should be cherished, for your effort was noted. 


  Building is a vital part of the hive and I thank you for every wall you placed for the hive.


  Rejoice!' by Prime Queen (PRO)

  Young Praetorian (NC-327) is awarded the Royal jelly of resilience: 'For your couragous work you took the mantle of being the 2nd generation of leaders for the hive, and that you did not fail to deliver results.


  You were once a defender, even taking a tube spit head on at the west of evil eye tower.


  After that you became a warrior and fought mostly south of admin, and doing your best, I am proud of your work.


  and now your a praetorian to show how far you have grown.


