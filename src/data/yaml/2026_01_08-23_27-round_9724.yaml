roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Ravager (LS-71-DJ) is awarded the Royal jelly of proliferation: 'Since the beginning you were alive, to end of this battle against the talls, you have captured many infront of me.


  It was a rare sight to see a ravager excel so well that not a berserker for that I want to congratulate you for your great dedication as my daughter.


  You never shown any sort of cowardice against the enemy, was always pitching deep into the enemy lines as possible in every engagement possible.


  Rejoice!' by Prime Queen (PRO)

  Prime Hivelord (RO-503-CK) is awarded the Royal jelly of proliferation: 'Through the beginning, you were always working hard to rebuild lost sacred lands that we once claimed.


  During the battle of nexus, you built it up the moment I gave word to rebuild it!


  For that I want to congratulate you for your hard effort, as you deserve this jelly for such eagerness.


  Rejoice!' by Prime Queen (PRO)

  Ancient Praetorian (JE-709-PH) is awarded the Royal jelly of resilience: 'During the battle of fitness, you heroically saved a crusher even whilst going in a critical state, not to mention you survived it as well.


  I want to congratulate you for your effort in preventing sisters from a fate of death from the tuber.


  Your death was not in vain for you prevented others death because of your resilience!


  Rejoice!' by Prime Queen (PRO)

  Elder Ravager (YIP-38) is awarded the Royal jelly of resilience: 'During many engagements you were always a shield and a true berserker, you capture as many talls and committed even on the brink of death.


  You captured also so many talls or assisted in many instances of such situations.


  You have shown spine that most berserker lack, and I congratulate you for your hard effort.


  Rejoice!' by Prime Queen (PRO)




