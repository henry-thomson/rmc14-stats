roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Craig Lopez, Ocean Rain, Muz-Maxath, Glub 'Goober' Son, Silvie Wible, Awa Grimbles, Ash 'Silly' Winter, Gage Stern, Clukay 'Heckler' Koch, Izabella Orbatos, Danny 'Ketchup' Heinz, Nheka, Able Hazel, Socrates Obscured, Zion 'Reclaimer' Erasmus, Ivan Ivanchuk, Trevor LaRoux, Kaleb Randolph.



  Medal Awards:

  Blake 'Bark' Barker is awarded the Medal of exceptional heroism: 'for your great show of heroism holding. keeping sensors alive through the entire opperation. giving us vital info. you have show what it truly means to be a hero today


