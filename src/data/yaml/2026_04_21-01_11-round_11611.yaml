roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Bob 'Sawman' Goodwin.



  Royal Jelly Awards:

  Prime Defender (CMP-797) is awarded the Royal jelly of resilience: 'For as always you protected those who needed it the most, you saved one of few, of the hive that in my recollection even the tiniest of saving is worth.


  You saved WILO and a ravager at Cave Camp, always be dedicated to protecting those around you, even if you know the result.' by Prime Queen (PRO)

  Young Drone (YE-934) is awarded the Royal jelly of resilience: 'During one of many of the engagements, you were one of the names I recalled who pushed on a horrible order I made south west of botany. I said ignore green stick, and all suffered from my mistake.


  I want to keep that same energy you had always following directions, and may you keep your resolve for future hives that you work with.


  regardless of the danger, you did your duty, and that is all I can ask from anybody, may you not be forgotten.' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]the sale of Atlas Bootes[/color]![/bold]
