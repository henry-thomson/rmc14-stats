roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ricardo Rohtin, Marvin Conrad, Cecilia 'Wraith' Wile, Ivanov Young, Hudson 'Joker' Dwayne, Gallagin 'GC Addict' Caitman, Akrem 'Joker' Marshall, Silas Moonveil, Davlat 'granddad' Lukin, Fenton Mosser, Dante Minnie.



  Royal Jelly Awards:

  Mature Boiler (PAL-112) is awarded the Royal jelly of sabotage: 'With your communication, and perfect synchronisation, you followed me, listened to every single one of my order at the perfection and at the exact moment you asked, unfortunately a rare sight to see in the hive, thank you from the bottom of my heart' by Ancient Queen (BUH)

  Elder Praetorian (EI-104) is awarded the Royal jelly of resilience: 'You held your post for a full 30 minutes at a key chokepoint, ordered sisters not to push like i instructed, and stalled into our victory, without you, we wouldn't have gibbed tuber and without a doubt got us the win. You saved us.' by Ancient Queen (BUH)




