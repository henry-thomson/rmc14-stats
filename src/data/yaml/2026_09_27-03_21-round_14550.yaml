roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Tim, Morty 'Prime' Goldenlocks, Deino-Leem, Terri Dactyl, Maddie Harper, Jason Eggley, Florian Nickolson, Ker Xhango, Marin Marinara, Miri Katiyam, Jeanne Archer, Rodentu Vileni, Rubicon.



  Medal Awards:

  Staff Sergeant Ielenia 'Shelf' Amastacia is awarded the Medal of valor: 'Staff Sergeant Amastacia you did your duty being a critical part of Alamo operations allowing it to work even when it lost it DP. When FOB was breach and your DP literally jumped ship you stay to continue your duty. As far as you knew you were going to your death and yet you remained steadfast. For your bravery and upholding of your duty as the DCC of the Alamo I reward you this Medal of Valor.


  Awarded by LtCol. Atlas 'Wolfy' Snowlight on 09/27/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Lieutenant Colonel Atlas 'Wolfy' Snowlight





