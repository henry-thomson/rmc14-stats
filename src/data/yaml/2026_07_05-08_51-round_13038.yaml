  Royal Jelly Awards:

  Elder Boiler (SG-501-UY) is awarded the Royal jelly of slaughter: 'What is your diet to turn talls into a brown liquid at that speed? I know for sure its not jelly because i never gave you one... and to say the least i'm jealous. I know for sure that it relaxes ones glands and i hope that you take your rest with it. Good job.' by Prime Queen (BUH)

  Young Defender (YUU-494) is awarded the Royal jelly of resilience: 'I whispered in the mind of a tall and i caught a glimpse of one of his feelings, and this feeling was frustration... Your plate of steel was an immovable object in front of our boilers and kept them safe to every type of spit.' by Prime Queen (BUH)




