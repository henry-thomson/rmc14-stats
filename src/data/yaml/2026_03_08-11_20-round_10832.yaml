  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Austin Barnes, White Blekov, Buster 'Geezer' Alter, Riley 'Opfor'.



  Royal Jelly Awards:

  Mature Praetorian (MO-889-NA) is awarded the Royal jelly of proliferation: 'Thanks to you, even if the hive dies, you have managed to get so many captures. I am really proud of you today, sorry if I dont have much time to write this jelly, but the hivekiller is coming.

  I am really proud of your work.

  Thank you.

  With love, LAG' by Elder Queen (LAG)

  Ancient Carrier (RAD-185) is awarded the Royal jelly of proliferation: 'You did manage to help the hive secure a lot of captures today. You did really great, and even managed to get to the end, even if we will die to the hivekiller. I am really proud of you.

  With love, LAG' by Elder Queen (LAG)




