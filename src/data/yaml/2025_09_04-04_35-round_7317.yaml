roundEndText: >2-

  [color=green]All of the xenos were wiped out![/color]


  In memoriam of our fallen soldiers:

  Chee 'Pressure' Mach, Mona Wolfe, Burns-the-Body, Wears-a-Traffic-Cone, Lucian Hunter, Aaron 'Labyrinth' Ribok, Jeroh 'Uncle Fobbers' Ward, Boe Jangle, Stonel Avernus, Explains-the-Plot, Fears-The-End, Johnny Rivets, Kaleb Randolph, Sam 'Smiles' Spektor, Xyto Avaeilia, Einuko 'Twitch' Steelfeather, Ocean Rain, Stony Tony, Alyssa 'Alys' Farely, Atheris kula-Skjuta.



  Medal Awards:

  Veekas 'Preacher' Resari is awarded the Medal of valor: 'For conspicuous gallantry and courage in the face of an XX-121 swarm facing their squad. On flank-guard duty, your squad faced multiple hordes of enemies, and slew them left and right. Your leadership no doubt compelled this.'

  Danielle Sparks is awarded the Distinguished  conduct medal: 'For excellent command & control of their squad while assigned to overwatch. Under their watchful eye, the squad was able to secure multiple key maneuvers that won us Detour All American-House.'





