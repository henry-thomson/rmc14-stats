roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Sebastian 'Justin Time' Eventide, 'Rubicon', Tul-Tanan.



  Medal Awards:

  Second Lieutenant Shahvee-Tail is awarded the Distinguished conduct medal: 'Intelligence Officer Shahvee-Tail provided much needed intel for this operation to go as far as it did. Without their efforts im afraid we wouldnt have been able to give CAS or REQ the much needed budget increases they needed. Shahvee-Tail you showed everyone what it meants to be a Intelligence officer. I commend your effort and putting yourself in harms way. Excellent work today.' by Major Sicilia 'Rose' Drakonovisch



  Royal Jelly Awards:

  Ancient Carrier (RAD-78) is awarded the Royal jelly of proliferation: 'Well done daughter


  It has been reported to me that you have helped in the capture of many talls, even helping in the demise of the tall's very own queen.


  For this, I award you with your very own jelly, as a way to show you how proud i am of you.


  See you in the next hive!' by Mature Queen (NEV)

  Prime Praetorian (ARG-459) is awarded the Royal jelly of proliferation: 'ARG has been a vital part of this hive, capturing tall after tall until they had nothing else they could do but flee before their might.


  Their teamwork with RAD is why this hive could thrive, even leading in the demise of the tall's queen.


  For this, I award you with your very own jelly. Good work my daughter.


  See you in the next hive!' by Mature Queen (NEV)

  Elder Boiler (BAG-931) is awarded the Royal jelly of slaughter: 'BAG, you have been one of my best daugther this day. Your efforts have managed not only to force the tall into cowering back to their hive in the sky, but also aid in the capture of many talls and the protection of many sister.


  You gave them hell, and survived to tell the tale.


  For this, I award you your very own jelly.


  See you in the next hive!' by Mature Queen (NEV)

  Mature Praetorian (KL-420-A) is awarded the Royal jelly of rejuvenation: 'KLA, though your form may not have survived this day, I know your mind will live on in the greater hivemind. You have not only saved me multiple times from the vile tuber, but also helped in the capture and retreat of the tall threat.


  For this, I reward you your very own jelly, even if i cannot give it to you in person.


  See you in the next hive!' by Mature Queen (NEV)

  Elder Defender (NOX-923) is awarded the Royal jelly of resilience: 'NOX, you have proven yourself multiple times of doing whatever it takes to assure the hive's continued success.


  You have not only saved me from tuber with your only life after my own follish mistake, but you have come back as a defender and selflessly protected sisters with your crest, even sacrificing yourself again to do so.


  For this, you have been awarded with your very own jelly.


  See you in the next hive!' by Mature Queen (NEV)




