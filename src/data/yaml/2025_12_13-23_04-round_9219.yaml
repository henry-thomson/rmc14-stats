roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  Medal Awards:

  Dante Minnie is awarded the Medal of valor: 'Crazy bastard snuck behind the entire xenonid hive to repair sensors under their noses. The information gathered from the sensors tower allowed us to perform a maneuver that forever crippled the hive - leading directly to their downfall and our victory today.


  Awarded by Col. Scraps-the-Copper on 12/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Hudson Demuth is awarded the Distinguished conduct medal: 'Excellent work with coordinating Charlie, along with their construction of and defense of the comms relay today. You have no idea how much anguish you saved us up in CIC.


  Awarded by Col. Scraps-the-Copper on 12/13/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





