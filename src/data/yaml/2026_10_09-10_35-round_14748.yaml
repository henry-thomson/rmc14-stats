roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Euagrus Thorelli.



  Medal Awards:

  Sergeant Fenrisulfr AW Thumper is awarded the Distinguished conduct medal: 'Sergeant Fenrisulfr Thumpwer participated in the heroic act of minimizing casualties following a harrowing evacuation and wipe. They had remained behind enemy lines deep within Xenonid territory and when the opportunity arose dragged those who could be saved to a medevac bed, permitting more marines to be rescued post-evacuation along with themselves.


  You perform your duties admirably, Sergeant, stand proud, stand dutifull. We protect our own.


  Awarded by LtCol. Kaitlin Zalack on 09/10/2126. 2nd Company "Falling Falcons" | 4th Battalion | 3rd Regiment | 4th Combat Division | United Nations Marine Corps' by Lieutenant Colonel Kaitlin Zalack





