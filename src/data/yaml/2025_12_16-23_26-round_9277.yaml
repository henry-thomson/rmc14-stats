roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird and entered the metal hive, igniting a brutal battle in the sky.[/color] [color=yellow]In the chaos, the vessel lost control and crashed into the surface before everyone could evacuate. All hands were lost.[/color] [color=purple]Yet, the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Ralaka, Darius 'Nerd' James, Shoots-for-Moon, Velo 'FriendChirp' Flock, Mima Burnwood, Kaleb Randolph.



  Royal Jelly Awards:

  Young Hivelord (CT-124) is awarded the Royal jelly of resilience: 'This lord built walls after walls. They made our sisters not fear the sting of a simple spit, for thier walls caught it instead. For this i give you a royal jelly. Stand proud ct, you are awsome.' by Elder Queen (WAW)

  Ancient Hivelord (TO-536-MB) is awarded the Royal jelly of resilience: 'This sister made many a wall and many a door, they gave our xisters power, not in the way of claws or might, but in the way of comfort, comfort that thier back will be covered by a MIGHTY wall of resin. Stand proud sister.' by Elder Queen (WAW)




