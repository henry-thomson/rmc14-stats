roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Shimpee Prawni, Jesse Ramirez, Stellamaris Hall, Chip Toot, Stares-at-Stars, 'Duke' Qixtaq Teqxae, Kolibri 'Kino' Kosima, Finn Cressman, Voltaine Highmore, Derick 'Naptime' Hunt, Osmund Bluetenberger, Dara 'Arctic' Dew, Long-ears Lucas.



  Royal Jelly Awards:

  Prime Ravager (NEV-741) is awarded the Royal jelly of slaughter: 'Undeniably, uncontestably, got the hive victory, there is no way in any flame hell that we gonna prevail without her. Slashing. Dragging. and Tanking for her senile mother. She did it all, does blood fuel her? Perhaps. But she also know when to change it up and break some jaws.' by Prime Queen (BUH)

  Elder Praetorian (CAR-251) is awarded the Royal jelly of resilience: 'right tail lets stomp, left tail lets stomp, she heard this fad from talls in their whispers and took it to infinite lengths, i still don't like it but it looks great on her. I am quite fond of this "dancing" thing. She convinced me...' by Prime Queen (BUH)




