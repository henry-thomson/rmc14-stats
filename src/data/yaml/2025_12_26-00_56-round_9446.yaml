roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Rick Lu Arran, Bereft of Judgement, Richerson Jr the 5th, Alejandro Dennis, Fat Dale, Samuel Lightweaver, Anne 'Artichoke' Powell.



  Medal Awards:

  Hakani Steelnest Pack is awarded the Distinguished conduct medal: 'Through recommendation of their staff officer,


  You did well to coordinate the marines of Bravo during this operation today. The bugs tried countless times to breach our communications tower and FOB, and failed each time. There were many... how do we say... shortcomings - cades left open, lines left unmanned. But the lines held nonetheless. I am sure it would not have done so without your efforts.


  Awarded by Col. Scraps-the-Copper on 12/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Boris Scavmanchez is awarded the Distinguished conduct medal: 'Almost straight out of boot camp, this maintenance technician had the task of running all of shipside engineering by themselves for an extended period of time. Needless to say, they hit their marks and the OB was ready when I wanted it, and the appropriate materials were delivered. Good work.


  Awarded by Col. Scraps-the-Copper on 12/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
