roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Zenko Kit Sune, Leah Rose.



  Royal Jelly Awards:

  Elder Boiler (EHE-567) is awarded the Royal jelly of sabotage: 'EHE, You listened, you lead, you spit. The perfect boiler, your boils were perfectly in tandem with your fellow boilers and what was needed for your sisters to gain captures and push back talls. It was a sheer sight to see, so today I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)

  Ancient Drone (STR-58) is awarded the Royal jelly of rejuvenation: 'STR, you followed through the spits, the fire, the hell of talls and I saw all of it. Your sisters when in hurting saw you as their guardian angel and I respect confidence in protection of your sisters, it is a treat to see a sister so selfless for the hive. So today I reward you this Jelly to remember this day. REJOICE!!


  See you in the next hive!' by Ancient Queen (VCR)




  [bold]Operation funded by [color=green]Cocaine[/color]![/bold]



  [bold]Hive established by [color=purple]Old Man Buster[/color]![/bold]
