roundEndText: >2-

  [color=green]The xeno hive was wiped out![/color]


  In memoriam of our fallen soldiers:

  Nevaeh Pfeifer, Ryan Adams, Hooper Dovavin, Azjai-Lurz, Jacob Agg, Speedy 'Explosive' Garrison, Douglas Tennant, Maple Goman, Zoropsis Phalangioides, Hitts Zeneki, Samantha Rime.



  Medal Awards:

  Saya Francine is awarded the Distinguished  conduct medal: 'Lance Corporal Francine has shown immense dedication in their duties today, where they ventured deep into unsecure territory in the Solaris cave system, to where they secured the experimental sensor tower multiple times over the course of this operation, ensuring that vital information was secured in our victory.


  Good work Lance Corporal, you have a bright career in the corps ahead of you.'

  Invokes-the-Cobra is awarded the Distinguished  conduct medal: 'Lance Corporal Invokes-the-Cobra has shown their value to the Corps, by handling duties above their paygrade. On this operation today Lance Corporal Cobra as a Combat Technician actively lead their squad, when called upon, exceeding their expectation of not only keeping Alpha alive, but coordinated and cohesive, following orders to a T.


  Good work Lance Corporal Cobra, your performance today has shown that you have the potential to become a great squad leader.'





