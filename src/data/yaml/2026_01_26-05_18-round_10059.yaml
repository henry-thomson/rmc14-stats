roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Amaryllis 'Alice' Alison, Felix Woollard.



  Royal Jelly Awards:

  Ravager (BA-561-AA) is awarded the Royal jelly of slaughter: 'By claw and by Tail, by rage and by fury, you are the Bezerker. When we cornered a singificant group of talls, you were instrumental in wiping them all out. During the final attack, when many of us had to retreat to heal, you alone stood. Fighitng and killing until the very end, slaughtering the group. For your saccrifice for the slaughter, i give you this Jelly.


  Henceforth, may you be known as BAAA the Brutal!' by Ancient Queen (CMP)

  Mature Boiler (SAL-245) is awarded the Royal jelly of resilience: 'By acid and by spit, by boiling and by battle, you are our boiler. During a crucial moment in the hive today, you and our other boiler stood firm in the face of adversity, stalling talls for a long while at a crucial chokepoint. Had you or the other failed, the hive might have been lost. For your stalwert defense of this hive, i give you this Jelly.


  Henceforth, may you be known as SAL the Savior!' by Ancient Queen (CMP)




  [bold]Operation funded by [color=green]Carlos ´Tovarishch´Miguel[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
