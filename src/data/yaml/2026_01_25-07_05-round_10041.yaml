roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Altair 'Christmas' Nightwish, Buck 'Greed' Tern.



  Royal Jelly Awards:

  Ancient Praetorian (JE-282-PH) is awarded the Royal jelly of proliferation: 'For your immense dedication in being the hive NEST leader!


  You have taught many youngs, shepard many tier 1's to go to their respective hive leaders!


  You ensured the protection of the main NEST, and did tiresome work.


  For that I want to bestow upon you this jelly for such hard work for the hive.' by Prime Queen (PRO)

  Ancient Boiler (GRY-296) is awarded the Royal jelly of sabotage: 'For being proactive in the hivemind and generally being eager and always supportative, you have provided substantial great information for other sisters to utilize, and for that I want to bestow you the jelly of Sabotage, for such great work!


  Rejoice!' by Prime Queen (PRO)




