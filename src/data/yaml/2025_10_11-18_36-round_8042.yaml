roundEndText: >2-

  [color=purple]The xenonids hijacked the metal bird, forcing their way into the metal hive to seek the rest of the hosts.[/color] [color=green]However, the marines fought back, eliminating the threat in orbit. Though the ship is safe and evacuated,[/color] [color=purple]the surface remains overrun, and the xenonids endure.[/color]


  In memoriam of our fallen soldiers:

  Kisses-The-Flame, Jamal Johnson, Beansworth the 5th, Kamiel Lancoaster, Rom 'Mango'  Killinger, Donnie McGee, Jupiter Kelly, Ash 'Silly' Winter.



  Royal Jelly Awards:

  Young Drone (RO-268) is awarded the Royal jelly of rejuvenation: 'As an Healer drone, sacrificed herself to save an Warrior sister while we were wiping, the survival of that Warrior sister resulted in an Tuber tall capture.' by Ancient Queen (XO)

  Ancient Praetorian (ZAO-817) is awarded the Royal jelly of slaughter: 'As an Vanguard praetorian, managed to stay with me and enforce many wipes on the tall fronts, her existence gave us an part of the victory.' by Ancient Queen (XO)

  Elder Praetorian (BEL-220) is awarded the Royal jelly of sabotage: 'Did an great work as an Oppressor praetorian, captured many talls and did GREAT for the hive.' by Ancient Queen (XO)

  Ancient Carrier (MIU-168) is awarded the Royal jelly of proliferation: 'As an Carrier sister, managed to infect mutiple tall hosts while working with BEL, their teamwork definetly managed to get us this victory.' by Ancient Queen (XO)




  [bold]Operation funded by [color=green]Iantha Atikson[/color]![/bold]



