roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Leon Renshaw, Linda 'Everwinter', Horie Nuboshi, Yeo 'Sakura' Bunnia, Masamune Ii.



  Medal Awards:

  Captain Malik Fulton is awarded the Medal of valor: 'For exceptional personal initiative and leadership. Captain Malik Fulton assumed direct command of the groundside force and, through quick thinking and decisive action, shattered the stalemate. Their actions today singlehandedly turned the tide of the operation and allowed for the complete extermination of a Xenonid horde with minimal losses.


  Awarded by Col. Clyde McKinney on 10/9/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Clyde McKinney

  Corporal Vince Vale is awarded the Distinguished conduct medal: 'For exemplary personal initiative. Corporal Vince Vale infiltrated the backline of a Xenonid hive and maintained the sensors array, while also supporting the frontline. Their efforts today were instrumental in our victory.


  Awarded by Col. Clyde McKinney on 10/9/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Clyde McKinney





  [bold]Operation funded by [color=green]Isadora AW Brooke's videos of Marine Mess-ups[/color]![/bold]



  [bold]Hive established by [color=purple]Cocaine Accessories[/color]![/bold]
