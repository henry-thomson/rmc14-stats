  Royal Jelly Awards:

  Elder Praetorian (HSQ-424) is awarded the Royal jelly of proliferation: 'For your hard work, and dedication, you have proven yourself this jelly. Through thick and thin, you were there every battle, you have fought beside me, making captures in my wake. You never let down your performance as you performed at your highest peak in ensuring the hive survival, and future. Most engagements I have remembered was you helping capturing at medical, lowsecurity, and much more!


  you will be remembered in my heart, and in this battle, I wish I warned you about the green stick. You will not be forgotten.


  For the hive!' by Prime Queen (PRO)

  Young Hivelord (AZ-681-A) is awarded the Royal jelly of proliferation: 'AZ-681-A, you were remarkable, the opinions of the hive as spoken of your work, you were here since the beginning. Making structure after structure. No break was given, no time was wasted. You were truly at your peak. You may be young, but you are speed resinning in the right direction! May you bring forth future great hive structures!


  Rejoice!' by Prime Queen (PRO)




