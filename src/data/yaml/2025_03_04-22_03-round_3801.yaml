  [color=purple]All of the marines were wiped out![/color]


  Medal Awards:

  Emily 'Klutz' Rathen is awarded the Distinguished conduct medal: 'Recommended by 1st Lt. Horacio Carrillo on the behalf of SSgt Emily Rathen for "Single handedly killed a burst larva who evolved into a lurker inside CiC maintenance tunnels, ending its rain of terror'

  Tides-of-Gray is awarded the Medal of valor: 'Recommendation by 1stLt. Johannes Cabal on the behalf of 2nd Lt Tides-Of-Gray for "Giving his life defending the IOs that made it out and managing to support officers in collecting over 30 points of i'



  Royal Jelly Awards:

  Prime Defender (DEF-501) is awarded the Royal jelly of resilience: 'Sacrificed herself so all the other sisters, including the Queen, could escape. A true defender of the Hive. I am proud.' by Mature Queen (SIN)

  Prime Lurker (PRO-499) is awarded the Royal jelly of proliferation: 'Captured, alone, 25 talls. I think that's enough said. Great job!' by Mature Queen (SIN)

  Mature Burrower (ORB-287) is awarded the Royal jelly of proliferation: 'Today, she created lots of great tunnels that allowed all of our hive to escape the tall threat many and many times. We can confidently say the Hive only survived because of her. Consider this one of' by Mature Queen (SIN)




