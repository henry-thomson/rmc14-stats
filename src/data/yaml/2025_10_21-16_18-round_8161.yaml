roundEndText: >2-

  After a thorough investigation into the death of an MP, and the death of their commanding officer, the forces onboard the UNS Almayer evacuated due to the boarding of a CLF-affiliated mercenary team and the sabotage of the reactor core and astronavigation center.


  Deandre Shirey, undercover CLF operative masquerading as an MT, although unable to secure the Almayer for the front, was able to secure a single dropship. Whether or not it was worth the death of two undercover operatives is for him to decide himself.




  [bold]Operation funded by [color=green]Kate's Extended Family[/color]![/bold]



  [bold]Hive established by [color=purple]Weston-Yamada[/color]![/bold]
