  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Minji 'Failsafe' Kilgrim, Mona Wolfe.



  Medal Awards:

  Tatiana Zaychikova is awarded the Medal of valor: 'i have witnessed you show exceptional valro and skill in the line of duty. applying extreme pressure to the queen to preventing the capture of a fellow marine. and with the momentum of her death. being crucial in the death of many more xeno menaces


  Awarded by Lt Col. Tyr Ragnarson on 12/08/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





