roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Ayumi.



  Royal Jelly Awards:

  Hivelord (KBL-41) is awarded the Royal jelly of proliferation: 'You were one of our main builders that continued since the beginning, building along side the designer hivelord ORB, you rebuilt many areas for the hive! Originally you were a plasma battery for the builder team but you outgrown that phase at some given point, and went beyond, ensuring fortification where needed was vital for the plan to succeed.


  I thank you from the bottom of my heart, that you endured through and make quick work with uncontested land along side your sisters.


  May you build more for the hive rejoice!' by Prime Queen (PRO)

  Elder Ravager (EF-963-EE) is awarded the Royal jelly of proliferation: 'For making 5 captures for the hive that aid the survival of the hive. Most of these captures were made solely by you at cave camp, making quick work for any foolish tall daring to challenge you.


  Graet work on your performance and doing your best!

   Rejocie!' by Prime Queen (PRO)
  Young Praetorian (PB-398-J) is awarded the Royal jelly of rejuvenation: 'During moments when my ravagers were fighting near me when we kept making highly aggressive rotation non stop when the moment arrived, you made it quite easier for my ravagers to not die due to your quick thinking and well performed screams to counter the tuber, and perhaps even more if I could remember key details.


  however, your performance alone was splendid, even a ravager stepping forward to tell me how thankful they are from your help.


  Rejoice, for you have well earned this!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Fop Gang[/color]![/bold]



  [bold]Hive established by [color=purple] JORGE THE POCKET RAT !![/color]![/bold]
