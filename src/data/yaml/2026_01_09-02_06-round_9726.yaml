  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Reon Wolf.



  Royal Jelly Awards:

  Mature Hivelord (UW-112) is awarded the Royal jelly of proliferation: 'You were building  at all times since you were a hivelord, always maintaining the front, or always working on areas that needed attention.


  For that I want to honor your commitment and dedication, working tirelessly for a work that most consider boring, when in reality it has created interesting... situations that of which I exploited because the talls would rather push a small opening than go around it.


  Well done to you hivelord! Rejoice!' by Prime Queen (PRO)

  Young Drone (AF-294) is awarded the Royal jelly of proliferation: 'As a young drone you went down the path of healing the injured around you, doing as much as you could. 


  You always kept making use of recovery nodes, and realigning them where ever it was needed. 


  You always ensured everybody was always in top shape, so you have done an excellent job for the hive, may I see you get to be a mature drone down the line youngster.


  Rejoice!' by Prime Queen (PRO)




