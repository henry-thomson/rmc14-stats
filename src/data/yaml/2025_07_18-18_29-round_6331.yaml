roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Phill Mckracken, Eddie Mcfall, Wendy Crumbs, Tinker Cheese, Nya 'Kitkat' Fireheart.



  Medal Awards:

  Althea Leander is awarded the Distinguished conduct medal: 'When I think of intel, I think of Althea. Their intrepid work secured quite possibly the entire colony. Under their direction, every rock was turned, every corner checked, every light flicked twice. Althea, and the Intelligence squad, shined tonight. Let us pray for the OB shell lost to the Requistions pit.'

  Seeks-to-Fight is awarded the Distinguished conduct medal: 'A culinary wizard, and one step ahead of my stomachs desires. Seeks-to-Fight is not only a Mess Technician, but a cook. You can count on them and their fellow MT to ensure warm meals, reminding us of the old country.'





