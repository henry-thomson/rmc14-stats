roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Robert Jobs, Pojeel-Leem, Claire 'Snoop' Evergarden, Kas'Lurla-Skeh'Kasar, Akira Takamura, Johnathan Eagleburger, Guppy DeMews, Jericho Lucia, Squeaky Chip, Raven Papilio, Colin Page, Naani, Paulie 'Conman' Zarroni, Aims-The-Artillery, Tom ''Thompson'' Vinson, Marcos Sholl, Pebble Leafstream, Elaina Firefly, 'Duke' Qixtaq Teqxae, Rain 'Red' Tyler, Elizabeth AW Rolling-Block, Eric Baldren, Max Harrow, Rujrem Teegla, Ondra Ulrich, Ronald Laborde, Ruby Mothman, Hugo Knapenberger, Manuel Miller, Konami Runner Pack, Rusty Brindle, Ilya Markov, Mao 'Cheshire' Mao.



  Medal Awards:

  Staff Sergeant Chuck Fluckster is awarded the Medal of valor: 'For excellent leadership and performance under extreme duress. Staff Sergeant Fluckster's leadership as the Squad Leader of Alpha squad during today's operation saved the lives of many of their squadmates while enabling a swift end to the operation, including coordinating the termination of a Xenonid Queen.


  Awarded by LtCol. Clyde McKinney on 10/6/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





