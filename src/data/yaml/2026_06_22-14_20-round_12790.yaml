  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Ancient Defender (NE-667-LL) is awarded the Royal jelly of resilience: 'During the engagement south of  Dynagrid Telecomms, the tuber was killed, and I require my shields. I told my hive to cover with their life, and you one of the unfortunates ones to succumb to your injuries. I thank you for pushing through and being the shield we needed, with the short time we had together, you show these talls your will. Rejoice!' by Prime Queen (PRO)

  Prime Lurker (MAD-209) is awarded the Royal jelly of proliferation: 'During the battle of Hybrisa. You were the shadow of the night, the talls had no chance. I was thinking through all this and I saw you were always trying to make captures. every time I look you were slowing talls down to make everything in the world possible for us. You also made it possible to gib the tuber. I was impressed from all that hard work, that I believe you do deserve this. It rare to see a lurker pull out it potential, and you earned this. Through all that dedication you tuned your crafts, and I believe you should always keep going to do such fine work. Keep it up Prime Lurker, you did great. Rejoice!' by Prime Queen (PRO)

  Ancient Hivelord (BUB-923) is awarded the Royal jelly of proliferation: 'During the battle of Hybrisa. You were the Architect of the hive. You built up Celestia, Nova medical, Meridian, Dynagrid, and Dynagrid Telecomms, and many others after that. I encouraged you since the beginning, and you made such fine work. I was actively impress to see no plasma everytime I check upon you. It was great to see you work eagerly for the hive. I thank you for every wall, and door you built for me. For it provided many fortunate events. Rejoice!' by Prime Queen (PRO)




