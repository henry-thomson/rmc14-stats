roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Breaks-the-Tides, Donald Mills, Jacoby Prechtl, Patu Algarve, Fitz Wallick, Ratto D'Fogna, Ion Silverfall, Alice Wibble, Thales 'Careless' Antares, John Ramirez, Fights-The-Dark, Eager Clyde, Mike 'Giggles' Baynton, Lee Alt, Svyatoslav 'Cashback' Nalivkin, Peter 'Parabellum' Cencer, Porter 'Porker' Keopple, Durr Tenet, Sergio Ann, Lux in Tenebris, Greyy-Kzeth, Viktor 'Sabretooth' Logan, Arthur 'Knight' Derthert.



  Medal Awards:

  Tricky Pip is awarded the Medal of valor: 'Tricky Pip has been awarded the medel of valor for pulling my body from the maw of the xeno horde and getting me to a medic. moving with my body though countless hostiles


  Awarded by Maj. Tyr Ragnarson on 09/01/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Elder Spitter (ARL-495) is awarded the Royal jelly of rejuvenation: 'Your sacrifice saved our lives, preventing us from losing our momentum. Your valor today will be remembered, even if your body may not.


  Well done.' by Prime Queen (HSQ)

  Ancient Ravager (GUH-276) is awarded the Royal jelly of slaughter: 'This one acted as the vanguard, fearlessly pushing the tall lines and instilling fear into their hearts. Well done.' by Prime Queen (HSQ)

  Ancient Boiler (TMM-448) is awarded the Royal jelly of resilience: 'This one served as our anchor. Delaying the tall advance until they ran out of steam. We are proud of you, sister.' by Prime Queen (HSQ)

  Elder Praetorian (STL-705) is awarded the Royal jelly of rejuvenation: 'This sister acted as the turning point for the hive. Although she may have arrived late, her presence was felt. She saved many sisters, and allowed us to skirmish the talls effectively.' by Prime Queen (HSQ)

  Elder Praetorian (LCK-412) is awarded the Royal jelly of proliferation: 'This one acted as our trapper, pulling the talls into our lines with extreme vigor. You were an extremely valuable asset today, and I am proud to have fought alongside you.' by Prime Queen (HSQ)




