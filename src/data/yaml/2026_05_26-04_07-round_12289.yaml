roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Wayne 'Stiches' Kali.



  Royal Jelly Awards:

  Young Drone (FL-392) is awarded the Royal jelly of resilience: 'Due to your work supporting and healing your sisters in this brutal campaign for our home. Such tenacity in one so young is very noteworthy, and I look forward to seeing you progress your skills as a drone in many hives- well done.' by Prime Queen (HEK)

  Young Runner (KV-954) is awarded the Royal jelly of resilience: 'For your support in running captures to and from the nest. Allowing our tier threes to stay in the fight where they are needed most, it is not particularly rewarding work, but your efforts were fundimental in keeping our movement fast. Thank you.' by Prime Queen (HEK)

  Young Boiler (KA-461-R) is awarded the Royal jelly of slaughter: 'For your non-stop barrage of acid, while you were not alone in this effort- you have shown tenacity many boilers with your experience did not. Thank you for staying with us and keeping the pressure on the talls- and I look forward to watching you grow in future hives.' by Prime Queen (HEK)

  Elder Praetorian (FE-799-F) is awarded the Royal jelly of resilience: 'For your work in aiding your sisters escape entrapment.


  This was a pivotal moment in the war, without it- we may have very well lost.

  Thank you, this was a great feat in a chaotic battle, and it deserves recognition. This comes at the commendation of your sisters, well done.' by Prime Queen (HEK)




