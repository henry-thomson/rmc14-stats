  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Milos-Oleed.



  Medal Awards:

  Corporal Leon Barkhart is awarded the Distinguished conduct medal: 'Without marine I'd even say the Queen boarding the Alamo would've lead to a full wipe of groundforces. His placement of his turret saved everyones life and managed to kill a Fender, Prae and lower the queen to almost nothing. They saved many lives and deserve a well done!


  Awarded by Colonel Breaks-the-Tides on 11/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Breaks-the-Tides





