roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Iris 'Silkweave' Softcoat.



  Medal Awards:

  Eris 'Squish' Rose is awarded the Medal of valor: 'For their valiant effort in the defense of the Engineering Ring, holding off breaches several times until their inevitable capture by the hands of the xenonid hordes.


  We will not forget the amount of time you bought us, it was crucial to fortifying the Engineering Ring into an absolute nightmare for the bugs - enabling us to nuke this hellish world once and for wall.


  Awarded by Col. Scraps-the-Copper on 1/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Juan Cortez is awarded the Medal of valor: 'Countless kills, countless callouts, countless fights decided.


  From the bottom of my heart and all JTAC enthusiasts, thank you for your performance this operation. It would not have been possible without your efforts.


  Awarded by Col. Scraps-the-Copper on 1/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Luanne Greenawalker is awarded the Bronze heart medal: 'For an exceptionally dangerous venture to the experimental sensors tower, able to keep the tower operational for just long enough to allow myself to coordinate an attack that forced the queen off her ovipositor. With this attack - she was unable to evolve boilers to attempt to even break our final hold. 


  Awarded by Col. Scraps-the-Copper on 1/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Reed McMatherson is awarded the Bronze heart medal: 'Without hesitation, deployed on my orders and rallied the troops under the banner of the UNMC - giving a spark of hope and inspiration in the bleakest moments of the operation. What a tragedy it was that you were taken from us so quickly. 


  Awarded by Col. Scraps-the-Copper on 1/15/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'





  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
