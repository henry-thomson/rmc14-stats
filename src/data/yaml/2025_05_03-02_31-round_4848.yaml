  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Fay ''Torch'' Colt, Neoscona Orbweaver, Sorin Steele, Austin Anderson, Sebastian Wallick, Dodges-Responsibility, Mya 'Silly Cat' Rhinehart, Anaya Mingle, Callius, Sam Grant, Valek.



  Royal Jelly Awards:

  Ancient Boiler (RIP-969) is awarded the Royal jelly of slaughter: 'RIP has stayed alive all throughout this battle, and has been an immense tool with all the screams I've done onto the horde of talls, securing our hive's fate. Without them, we would not have won.' by Ancient Queen (RIV)

  Prime Carrier (GRY-818) is awarded the Royal jelly of proliferation: 'GRY, through this war, never waned in their efforts to keep captures steady. Their traps sufficiently stalled talls and caused disruptions despite their constant attempts to regain control. Great work' by Ancient Queen (RIV)

  Young Carrier (GOB-67) is awarded the Royal jelly of proliferation: 'GOB's precise and strategic placement of eggs allowed me, among many others, to use them to successfully allow our hive to bounce back from low numbers in the midst of the battle. We had so little sis' by Ancient Queen (RIV)




