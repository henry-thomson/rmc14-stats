  Royal Jelly Awards:

  Young Drone (XX-846) is awarded the Royal jelly of rejuvenation: 'XX-846, you have helped your sisters immensely today. Gardener is often a thankless job, but it is a great force multiplier.


  For your great work sustaining our hive at marshal, I award you this jelly of rejuvenation. Rejoice!


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Boiler (SAL-636) is awarded the Royal jelly of resilience: 'SAL, you have done amazingly today. You have helped in the efforts of holding marshal, stalling the talls for the entire day! Even after the fall of the previous leader CRO, you have taken up the mantle and kept marshal defended with great cohesion.


  For this, I award you this jelly for your great prowess.


  See you in the next hive!' by Ancient Queen (NEV)

  Elder Defender (LEO-521) is awarded the Royal jelly of proliferation: 'LEO, You have done great work. You were alert, always ready to drag on screams and aware of the danger around your sisters. You have saved sisters and captured many talls.


  For this great work, I award you this jelly of proliferation.


  See you in the next hive!' by Ancient Queen (NEV)




