  Elder Burrower (FIG-752) is awarded the Royal jelly of sabotage: 'A well coordinated plan was whip up by me, but it wouldn't of been possible without that great performance on execution, each and everyone of your burrower sisters, chained tremor after tremor, and the talls couldn't get back up. I would even say they were crippled because of your performance with the plan that was made.


  I thank every single one of you for executing this plan at the it peak perfection, not to mention  it was just genuinely that good, I can't even good is the way to describe how it went, it was just perfect.


