roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Thrayn Lioris, Albrecht 'Alby' Herrmann, Mason 'The Weasel' Lloris, Rezoli, Bailey Warren, Henry Spark, Slate 'Argo' Barbarossa, Gregory Papadiamantopoulos, Chews-the-Wires, unknown, unknown, unknown, unknown.



  Medal Awards:

  Sergeant Minji 'Failsafe' Hopgrim is awarded the Distinguished conduct medal: 'Sergeant Hopgrim you prove your effectiveness today with your grenade launcher, you secured us multiple high value kills we needed to secure such a quick victory. You broke many of the defensive points that the Xenonids maded allowing the push through the thick of their resin.


  Awarded by Colonel Atlas 'Wolfy' Snowlight on 11/12/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps.' by Colonel Atlas 'Wolfy' Snowlight





