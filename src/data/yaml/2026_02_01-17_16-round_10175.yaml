  Kaiden Osterweis, Vagabond Ron, Chews-On-Bones, Caleb Adams, unknown, Thunder-Tail, unknown, unknown, unknown, unknown, unknown, Emily 'Klutz' Rathen, Rocco Hunter, Lane Berkheimer, Wets-the-Drystone.



