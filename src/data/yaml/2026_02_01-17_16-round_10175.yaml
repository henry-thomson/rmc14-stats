  Young Drone (JA-305-M) is awarded the Royal jelly of rejuvenation: 'For your work as a Drone healing your sisters, with your health you have saved multiple lives and allowed the hive to hold on before we encircled. Well done.' by Ancient Queen (HEK)

  Elder Praetorian (REE-751) is awarded the Royal jelly of slaughter: 'For your work as an oppresor, keeping the talls in their own fire and preventing them from threatening our nest.


  Additionally, you have captured the tuber at a critical time in the war- your performance was noted not only by myself but by your sisters aswell. Well done, may we avenge our Queen.' by Ancient Queen (HEK)




