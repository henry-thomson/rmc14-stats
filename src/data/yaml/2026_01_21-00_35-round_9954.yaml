roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kenji Sato, Hudson 'Hungry' Demuth, Rhys Hendricks, Soft-fur Cheddar.



  Royal Jelly Awards:

  Prime Praetorian (ARG-361) is awarded the Royal jelly of sabotage: 'ARG is one of the best minds in hivemind. They gave us good callouts, good drags and were the ones leadering the tall planet massacre. 


  Rejoice!' by Elder Queen (RP)

  Elder Drone (RA-292) is awarded the Royal jelly of rejuvenation: 'You were one of the pillars to this victory, healing the tier 3s and me in critical moments. Truly one of the best healers in hivemind.


  Rejoice!' by Elder Queen (RP)




