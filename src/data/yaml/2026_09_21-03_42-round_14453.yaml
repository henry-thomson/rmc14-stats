roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Hark Willson, Ruco 'Roz' Amenaza, Aurora 'Birdcage' Barkheart, Alicor 'Pinkie' Merow, December AW Zweihander, Giovanni 'Brisket' Guess, Elena Embers, Jeremiah 'Germ' Gambino.



  Royal Jelly Awards:

  Ancient Praetorian (ACE-423) is awarded the Royal jelly of resilience: 'ACE, in this battle, you danced where others could only fight. You turned capture after capture into a spectacle, moving through the ranks of our prey as though the battlefield itself belonged to you. Even in our darkest hours, when our hive seemed nearly swallowed by the night, you continued to a dance, a single shining star guiding your sisters through the darkness. Your resilience was not merely in enduring this battle, but in reminding us to always move with purpose and beauty. May you continue to dance evermore. Rejoice!' by Ancient Queen (OTTO)




