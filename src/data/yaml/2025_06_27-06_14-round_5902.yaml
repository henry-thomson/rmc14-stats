roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Miles Chauvin.



  Royal Jelly Awards:

  Mature Defender (AWW-729) is awarded the Royal jelly of resilience: 'In a very close tall when I did not see the Boom Tube and was stunned because of it. You managed to block the Talls Spit from being fired at me. I would have surely died if you had not protected me there. I thank you for your support in protecting me. And I hope one day you may also be able to protect the Queen Mother.' by Elder Queen (OXD)

  Mature Praetorian (NO-652-O) is awarded the Royal jelly of resilience: 'Despite unfortunate circumstances in the Hive. You were the only T3 Caste to not meet an unfortunate end in the Hive today. You were here from the beginning, and helped greatly overall in the Hive. Even taking many spits and being able to make it towards the end with us. I thank you for your Resilience. And I hope one day your Resilience is found helping the Queen Mother.' by Elder Queen (OXD)




