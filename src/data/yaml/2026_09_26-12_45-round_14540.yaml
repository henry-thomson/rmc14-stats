roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Avery 'apple pie' Cometrider.



  Royal Jelly Awards:

  Ancient Drone (TJO-954) is awarded the Royal jelly of rejuvenation: 'TJO died for the hive when GREED took over my mind, giving her life to heal for the hive. She has performed her role to the letter of the job, healing what was almost lost!


  Rejoice to this sister, for her life made way to the wiping of the walls.' by Immature Queen (MIN)

  Prime Ravager (SVI-625) is awarded the Royal jelly of slaughter: 'SVI gave her life to stop the evil tuber from hitting other sisters, giving her life and her caste in the process. She will be remembered always for her sacrifice to save her sisters through life and death. 


  Rejoice to this sister for the blood she has spilled and the life she has given!' by Immature Queen (MIN)

  Young Hivelord (XX-356) is awarded the Royal jelly of resilience: 'You assisted in building the crater after the talls fumbled their skyfire, sending it too deep. Your building prolonged their push and brought the fight into our terms. 


  Rejoice to the sisters who hold the hive together!' by Elder Queen (MIN)

  Prime Ravager (SVI-625) is awarded the Royal jelly of slaughter: 'SVI gave her life for the hive, tanking the tuber talls spit for the rest of the hive after a greed run on the light cores. She has killed and saved just as many sisters. The talls blood will flow at your hands again.


  Rejoice to our sister!' by Elder Queen (MIN)




