roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Anaya Zeal, Oleg Mazyn, Olik-Meej.



  Medal Awards:

  Rhys Hendricks is awarded the Bronze heart medal: 'For a most valiant effort against a xenonid infestation as our pyro technician, your existence had proved too much of a slight for the queen. How angry those bugs must have been to do what they had done.


  Awarded by Col. Scraps-the-Copper on 12/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Laura Collins is awarded the Bronze heart medal: 'Died in the line of duty defending the captain with their life. You will not be forgotten.


  Awarded by Col. Scraps-the-Copper on 12/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Screams-A-Lot is awarded the Medal of exceptional heroism: 'For continuously holding the line against a xenonid infestation in the most trying of circumstance. Coordinating your marines, building fortifications, maintaining them, calling supplies, communicating with CIC - all of this nonstop for over an hour. 

  While the outcome of the operation was defeat, it would have been far more shameful had your efforts not been present.


  Awarded by Col. Scraps-the-Copper on 12/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'

  Stu 'Stew' Lizo is awarded the Bronze heart medal: 'For holding the FOB for as long as it managed, you kept your head down and did your job holding our southern position until the bitter end. You will not be forgotten.


  Awarded by Col. Scraps-the-Copper on 12/10/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Ancient Hivelord (TYZ-532) is awarded the Royal jelly of proliferation: 'You help aid the front line as a whispere when it was needed, building and providing cover as we slowly advanced forward. This was all we needed to have the edge to keep the talls from reaching the pylons that was created.


  Rejoice, you did amazing!' by Prime Queen (PRO)

  Mature Carrier (ZD-487) is awarded the Royal jelly of proliferation: 'You allowed your sisters to get 2 captures, and managed to even make a capture yourself.  You were always available when needed, even halting the yellow advance! You have done an excellent job in this battle! 


  Rejoice!' by Prime Queen (PRO)




