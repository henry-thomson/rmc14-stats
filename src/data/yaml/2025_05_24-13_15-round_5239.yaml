roundEndText: >2-

  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Elijah Clarke.



  Royal Jelly Awards:

  Young Boiler (XX-275) is awarded the Royal jelly of slaughter: 'Our only boiler, for the majority of the tall invasion. Skillfully placed boils to kill many a tall. When needed was the backbone of our efforts to stall the talls from reaching the hive. This sister proved to be a true example of a great slaughter of talls. Bravo!' by Elder Queen (ARG)

  Young Praetorian (ASO-914) is awarded the Royal jelly of resilience: 'Our valkyrie sister, during the tall invasion they accompanied me as my personal royal guard. Not only did they capture many a tall, they disrupted tall efforts to reocover, guided other sisters and saved many a sister from tall spit! Without them victory over the invading talls would not have been possible.' by Elder Queen (ARG)

  Elder Lurker (GIB-770) is awarded the Royal jelly of sabotage: 'This sister proved themselves during the tall invasion through there ability to spot tall weaknesses and exploit them. At critical moments they pointed out lone groups of talls enabling them to be capped. They organised the rebuilding of hive structures when our main hive was captured by the tall invasion. A true leader amoungst sisters.' by Elder Queen (ARG)

  Prime Carrier (GRY-174) is awarded the Royal jelly of proliferation: 'This sister was a prime example of an excellent carrier. Placed traps across the colony and was always in the right place at the right time to ensure quick capture of the talls. During critical moments in the battle against the talls, this sister ensured that we had hive to nest talls enabling our victory. Bravo!' by Elder Queen (ARG)




  [bold]Operation funded by [color=green]Mature Queen SOL[/color]![/bold]



  [bold]Hive established by [color=purple]Mister Wiggles!![/color]![/bold]
