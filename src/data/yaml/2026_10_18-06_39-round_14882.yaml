roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Nala 'Witch' Whitewitch, Darline 'Brat' Woods, Miranda Sebastine, Bootseey 'Doodle' Mireaux, Zoey Cattrell, Emile Luxor, Marin Marinara, Federun, Wilhelm Wolf, John Balthazar, Jexis 'Sun' Jahor.



  Royal Jelly Awards:

  Elder Boiler (FE-110-ET) is awarded the Royal jelly of slaughter: '“Sweet little bumblebee,I know what you want from me.”


  You have indeed captured my attention throughout the long hours of war, amid the relentless force-on-force battles between the Tall on Terror. We had grown utterly weary of the fighting, yet you stood out above the rest, bringing slaughter upon the Tall and finally breaking the long siege, detered to put an end to it all.


  Even though you perished in the battle between the Tall and yourself, your purpose was fulfilled. You fought until the very end, and I tried.


  Well done, FEET.' by Ancient Queen (SVI)




