roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Minji 'Failsafe' Kilgrim, Bonney 'Bun', Rinka Izumi, Lilliana Taggart, Psy Juniper, Elroy Aegyr, Deliah Rothman.



  Royal Jelly Awards:

  Mature Drone (XI-660) is awarded the Royal jelly of rejuvenation: 'For your countless contributions to the Hive, you have been recognized.


  You have healed our Hive time and time again, allowing our hive to launch endless attacks without rest. When others would fall, you kept them alive. 


  Through your efforts, the Hive endured, advanced, and conquered.' by Ancient Queen (EMP)




