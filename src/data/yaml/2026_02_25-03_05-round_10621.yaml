roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Shoots-Many-Bullets.



  Royal Jelly Awards:

  Young Hivelord (HL-857) is awarded the Royal jelly of proliferation: 'For your immense dedication in building up the hive structures, maintaining areas we needed when it was barren.


  Your work was noted, and you did an absolute amazing job, be proud of your work.' by Prime Queen (PRO)

  Elder Hivelord (LAF-216) is awarded the Royal jelly of proliferation: 'Great work on maintaining the front, an every areas that was required to be built up.


  I implore every single wall you placed, as the talls had to break them all!


  You have made it easier to keep pace of where to move captures, an other areas to fight at.


  Good work overall, hope to see more of it!' by Prime Queen (PRO)

  Young Boiler (SHE-894) is awarded the Royal jelly of resilience: 'You stood firm in your position in maintaining the hivecore defense.


  The talls try an try. No matter you were through it all preventing them making a single gap in the defense of the hive!


  I thank you for holding your position and preventing major land losts during the time of need.


  Rejoice!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Silvano d'Andrea[/color]![/bold]



  [bold]Hive established by [color=purple]Rubylord SIP.[/color]![/bold]
