roundEndText: >2-

  [color=green]With the queen eliminated, the xenonid hive collapses. For now, the area is safe.[/color]


  In memoriam of our fallen soldiers:

  Lyla Su Barrett, Snicket Sharp-Claw, Erin Baker, Zoey Kimple, Louis Toadvine, Huan Yuchen, Matthew 'Skidmark' Fields, Rhys Hendricks, Jungle Jim, Cook Justin, Kara Hathaway, Varisia Lote, Johnny McConnoll, Roland 'Stahl' Kraus, Lizzardo, Driscoll Kemerer, Kris Blackhart, Lymenzia 'Stubble' Flamewing, Brandyn 'Knight' Bethea, Dork Dwimbleby, Cassian Baer, Pinot 'Puppet' Bruno, Saida 'RGB' Murkina, Julian Hill, Kaanoli, Sly Buunero, Ross Flanagan, Floobert 'Hot Sauce' Squenge.



  Medal Awards:

  Corporal Huan Yuchen is awarded the Bronze heart medal: 'Sacrificed their life and wellbeing to ensure that the comrades around them were not condemned to the fate of capture by the xenonid hive. I was forced to watch with bated breath as it all went down. 


  You will be missed.


  Awarded by Col. Scraps-the-Copper on 4/14/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

