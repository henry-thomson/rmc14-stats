roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Reveals-the-Truth.



  Royal Jelly Awards:

  Elder Hivelord (KV-539-AN) is awarded the Royal jelly of resilience: 'No matter how many times she dies her talents will be of high demand! Our most honorable sister KVAN kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls!  It is without a doupt that her actions allowed the hive to succeed as the talls slogged through her weeds and walls to reach the perch, but alas they couldn't reach it in time. They were just in time for their funeral though!' by Prime Queen (LIMA)

  Elder Carrier (BB-474) is awarded the Royal jelly of proliferation: 'Our incredibly capable sister BB played a vital role in terrorizing the talls. As the future nesting mother by seeding new and better life into the talls. Her traps were numerous, she always provided a free flowing amount of children, and we had no problems accepting talls to our hive! Thank you BB, bless us with your presence once again!' by Prime Queen (LIMA)

  Elder Drone (RD-820) is awarded the Royal jelly of rejuvenation: 'Our incredibly capable sister played a vital role in terrorizing the talls. RD is an incredible example of cooperation. Her work, and symbiosis with other sisters didnt allow talls to breath for even a jiffy! Talls took their last breath, and RD watched how the light disappeared from their eyes. Slaughter is best served cold, too bad RD has an incredibly warm heart!' by Prime Queen (LIMA)

  Ancient Boiler (UWU-332) is awarded the Royal jelly of slaughter: 'Although I don't award jellies to the apex sisters, let alone combat, this one is an exceptional one. UWUs talents cannot be denied, her ability to waste the talls, gas them, melt them, was a thing to behold! She survived under the eternal spit of the bird, a rare standard even among the oldest of sisters. UWU is a living legend, but what do you expect from a sisters of her caliber?!' by Prime Queen (LIMA)




  [bold]Operation funded by [color=green]The Kanin Family[/color]![/bold]



  [bold]Hive established by [color=purple]Momma Kanin's Sandal[/color]![/bold]
