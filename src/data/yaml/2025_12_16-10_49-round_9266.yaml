roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Astolfo MacGillycuddy.



  Royal Jelly Awards:

  Elder Boiler (FI-928-N) is awarded the Royal jelly of slaughter: 'my dear elder boiler FI-928-N

  you were the last t3 standing which is why i give you this jelly to show you my appreciation

  you have been here for our hard times, our other t3s have sadly died to these cowardly talls but you have been by my side from the start, all the way from admin, bar towards lambda and sensors, you have been here along my side

  I am very proud of you, you have shown your determination at the lambda choke, you have been coordinating with me and disciplined listened to my commands, without you we would have not won this battle and talls would have possibly wiped us a long time ago

  I am proud of you for all your effort and loyalty you have shown towards your queen

  may squish be with you

  -- Ancient Queen SQSH' by Ancient Queen (SQSH)




