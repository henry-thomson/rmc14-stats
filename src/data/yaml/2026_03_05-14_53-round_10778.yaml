roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Sar-Weebam.



  Royal Jelly Awards:

  Elder Ravager (EV-339-IL) is awarded the Royal jelly of slaughter: 'She was slaughtering talls from the very start, To the talls end, allowing us to wipe and put pressure despite me, the queen, dying once. Because of her little to none talls escaped our grasp.' by Elder Queen (GDP)

  Mature Praetorian (RA-777-T) is awarded the Royal jelly of proliferation: 'Her constant support of sisters, her timely pulls and pheros, as well as her help in capturing a vast amount of talls led the hive to stand despite the talls throwing their "best"at us.' by Elder Queen (GDP)

  Elder Drone (IV-737-Y) is awarded the Royal jelly of rejuvenation: 'Her constant support with both pheromones and fruits. Her help on the frontlines with captures and weeds. Her spirit: All those things allowed tose who she supported to withstand any tall attack.' by Elder Queen (GDP)

  Young Hivelord (PEA-713) is awarded the Royal jelly of sabotage: 'Her hive plans, and continued support and build despite the talls pushing us almost entirly to our core SECURED us the victory against the menacece.' by Elder Queen (GDP)




  [bold]Operation funded by [color=green]Atlas Bootes[/color]![/bold]



  [bold]Hive established by [color=purple]Admiral Wolp[/color]![/bold]
