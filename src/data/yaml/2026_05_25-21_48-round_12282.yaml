roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Kyle 'Rook' Weller.



  Royal Jelly Awards:

  Elder Ravager (RI-923-SK) is awarded the Royal jelly of slaughter: 'RIKI led the frontline while i was on oviposition. As a true RIKI would, they made a lot of captures and got everyone together being one of the best hive leaders ive saw while i was ovi.


  Rejoice my RIKI! May your RIKI be eternal!!' by Prime Queen (RP)

  Young Hivelord (OG-928) is awarded the Royal jelly of resilience: 'Your built was the backbone of our hive and made sure a lot of our encirclements were safe. You built the hive the entire time and i am proud of you, being the great young hivelord you are.


  Rejoice my sister!! May your resin be eternal!!' by Prime Queen (RP)




