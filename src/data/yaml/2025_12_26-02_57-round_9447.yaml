roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Vasra Deltora, Ana Zaychikova, Luanne Greenawalker, Maximus Hawking, Erin Baker, Keenan 'The Dog' Epiolos, Roy Hastings, Blobby Oozeworth, Saul Fuchs, Shei-Malin, John Forrestall, Psy 'Juni' Juniper, Francis Monroe, Buzz 'saw' Fibres, Athaliah 'Serious' Crux, Boris Scavmanchez, Rujano, Archibald 'Ripcord' Butterfill, Shifty Dale.



  Medal Awards:

  Jim 'Smokey' Werner is awarded the Distinguished conduct medal: 'For holding the line at the communications relay, with a undermanned and frankly undergunned Bravo team. Great effort - a shame we couldn't see the op through.


  Awarded by Col. Scraps-the-Copper on 12/25/2125. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps'



  Royal Jelly Awards:

  Prime Defender (JE-660-PH) is awarded the Royal jelly of rejuvenation: 'You have done well, my sister. You ensured the Prime Hive's survival, saving the life of many sisters with your excellent ability to defend the Prime Hive. I thank you sister, this fight would've not been possible without you.' by Elder Queen (ZOE)

  Mature Ravager (IRS-163) is awarded the Royal jelly of proliferation: 'The Sister who I had voted to be King, personally. Unfortunately, you did not receive the honor of His Grace, but you have done well. Your excellent callouts and ability to suggest flanks allowed us to seize back the garage hive pylon, ensuring the talls retreat and our eventual victory. Thank you, IRS.' by Elder Queen (ZOE)




  [bold]Operation funded by [color=green]Admiral Fop[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
