roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Psy 'Juni' Juniper, Angela Cook, Michael 'Sarge' Effectson, Lauren Lowe, Bob Barret, Kazo Cloudjumpers Pack, Greg Hastings, Ricardo Rohtin, Stu 'Stew' Lizo.



  Royal Jelly Awards:

  Prime Burrower (CTC-827) is awarded the Royal jelly of resilience: 'For survival where others have fallen, you have stayed by my side since the beginning. With your work, a tunnel was always nearby, and your stomp prevented many counter pushes in the caves were it all mattered the most. Well done.' by Ancient Queen (HEK)

  Praetorian (ZOZ-700) is awarded the Royal jelly of resilience: 'For survival where others have fallen, you have stayed by my side since the beginning.


  Talls rely on their fire, with your efforts you were able to make them fear it.

  Good work, you are a boon to any hive and your survival during this intense war is a attribute to that.' by Ancient Queen (HEK)




  [bold]Operation funded by [color=green]Sergeant Iris Moondancer[/color]![/bold]



  [bold]Hive established by [color=purple]Elder Sentinel IR-I[/color]![/bold]
