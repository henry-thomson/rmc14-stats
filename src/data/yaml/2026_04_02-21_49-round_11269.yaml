roundEndText: >2-

  [color=green]The queen has been eliminated, and with her, the hive's coordination falters. The few remaining xenonids pose little threat, but the war is not over.[/color]


  In memoriam of our fallen soldiers:

  Altair Winter, Carote Noctura, Slowy Garrison, Roland 'Stahl' Kraus, Ronald Laborde, Xekeax 'Jo' Keqaeq.



  Medal Awards:

  Private First Class Collin 'Rock' Ironside is awarded the Medal of valor: 'For dearly holding the line, with minimal support, against numerous and ferocious bug attacks at engineering ring. It really is a miracle you managed to hold your own for so long and an effort I appreciate dearly.


  Awarded by Col. Scraps-the-Copper on 4/2/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper

  Gunnery Sergeant Jack Cuban is awarded the Bronze heart medal: 'For stalwart and fearless leadership of Alpha squadron during their time as squad leader. Responsible for the breakthroughs we had made early on in the operation - but this was not to last.

  Still, we will remember your leadership.


  Awarded by Col. Scraps-the-Copper on 4/2/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Colonel Scraps-the-Copper





