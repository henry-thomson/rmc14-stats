roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Prime Praetorian (FLA-876) is awarded the Royal jelly of slaughter: 'During the beginning, you made some really great fishing on the talls near iron bridge. I am not sure exactly how many but it was enough to cause a signifcant difference. After that I order you to go to the pylon to deal with the red talls, which of course you dealt with them effortlessly as they fail to learn to avoid your fishing skills. I am also proud of your team effort in the finale wipe at north of iron bridge. Solid work!' by Prime Queen (PRO)

  Hivelord (OG-204) is awarded the Royal jelly of sabotage: 'You guided your sisters to take over the east pylon north of TMCC, which then turned into a fishing ground for FLA eventually down the road. You were able to do this, with an entire red caste there trying to prevent your advances. Well done, it also cut out their communication quite nicely. Rejoice!' by Prime Queen (PRO)

  Ancient Drone (HAH-712) is awarded the Royal jelly of rejuvenation: 'For saving the life of a lurker in active combat, you provided them a second chance. through your determination to save those around you is a well earned commendation from me. I hope to continue to see you prosper with this mindset, so that you can give all sister a second chance in any category. Rejoice! 


  This was in the battle of Hybrisa!' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Admiral Lilith[/color]![/bold]



  [bold]Hive established by [color=purple]SireHambone[/color]![/bold]
