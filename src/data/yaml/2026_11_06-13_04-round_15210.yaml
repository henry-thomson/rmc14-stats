roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Darren Mull.



  Royal Jelly Awards:

  Prime Ravager (FE-231-AR) is awarded the Royal jelly of slaughter: 'Jelly that is likely one of a kind! FEAR needs no introduction, as yes the legends are true! Although information is hard to come by and even harder to rely on, FEARs work as a solo capturer saved many of our sisters, me including!, as they managed to drag a tuber into the depts of hell, and other grub as well. Help us FEAR save even more sisters!' by Prime Queen (LIMA)

  Elder Drone (SPN-653) is awarded the Royal jelly of rejuvenation: 'SPN was one of the best examples. Eternally stuck to the queen like a bad tumor, but in a good way of course, she kept momsy and everyone else alive. Talls took their last breath, and SPN watched how the light disappeared from their eyes. Murder is after all best served cold, too bad SPN has an incredibly warm heart!' by Prime Queen (LIMA)

  Ancient Drone (HA-644) is awarded the Royal jelly of rejuvenation: 'Her talents cannot be denied! HA kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. Sister kept rotating, weeding, and aciding anything she could get her sickly claws on, and poor talls just watched in despair. They could spit, but HA just mended! Where talls took life, HA just created one a new... A saing among many!' by Prime Queen (LIMA)

  Ancient Carrier (DA-844-VE) is awarded the Royal jelly of sabotage: 'DAVE is well known, maybe too much! Legends about her are told as tall tales! As the future nesting mother by seeding new and better life into the talls, and fear into their children, of what happens to tall babies when they wander too far. Careful you might just step on one of her traps!' by Prime Queen (LIMA)




