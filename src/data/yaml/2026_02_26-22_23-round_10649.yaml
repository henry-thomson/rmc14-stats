roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Huan Yuchen, Seymour 'Hack' Jenkins, Bryan 'MissDaVein' Robins, Lastimos 'Speedbump' Vintrisi.



  Royal Jelly Awards:

  Ancient Ravager (SEA-455) is awarded the Royal jelly of slaughter: 'For leading an absoluting crushing engagements from left to right.


  Your first engagement was a total wipe on red talls, as they decided to be in horrible positions, an got absolutely crushed by your leadership in leading your sisters.


  After of which, you decided to crush purple next, who was completely destroyed and also rendered out of combat forever.


  After of which you were near death in multiple engagements near perch as I try to keep you barely alive with healing.


  Nothing the less, you made it clearly obvious I didn't need to get up.


  Good work on that! Rejoice!' by Prime Queen (PRO)

  Young Ravager (XX-401) is awarded the Royal jelly of slaughter: 'You were with SEA group as a young minded ravager! You made an excellent engagements with her, and helped tremendously in wiping talls. I want to congratulate your work as you should be proud of being a true berserker or at least in the correct pathway.


  Hope to see more of it! Rejoice!' by Prime Queen (PRO)

  Young Praetorian (XN-686-O) is awarded the Royal jelly of rejuvenation: 'You were one of the caste that was keeping the main group held together with your warding phermone to any of a kind assistance in terms of providing crucial phermones that help the hive greatly!


  I want to bestow this jelly for your huge help in ensuring the survival of key castes an doing your absolute best! Rejoice!' by Prime Queen (PRO)

  Mature Hivelord (GU-150-B) is awarded the Royal jelly of proliferation: 'GUB for a first time designer hive leader, and leading the build team.


  I want to say you did absolutely amazing setting up colony, ashame talls didn't really get to see it, but effort alone matters and I thank you for trying an doing your best in terms of setting up defenses, even if they weren't remotely put to use in all ways. Intent is what matters the most.


  Rejoice! for you worked so hard for this.' by Prime Queen (PRO)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]Rubylord SIP.[/color]![/bold]
