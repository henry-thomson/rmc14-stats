roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Paratropis Wisharti, Ethan Tanner, Dryin Stainforth, Therlon Sword, Commet 'Flame' Brown, Charles 'CAGville' Riley, Aria Shark-Scale, Adelice Delahoussaye, Slowy Garrison, Baromir Kemerer, Noodles, Liana.



  Royal Jelly Awards:

  Elder Hivelord (JU-14-AN) is awarded the Royal jelly of resilience: 'You lead all of building and endured the entire hive, even when falling apart, to be rebuilt again and again. You made the backbone of our hive and made sure our team of builders kept building.


  Thank you, my sister.' by Prime Queen (RP)

  Young Hivelord (TW-989-K) is awarded the Royal jelly of resilience: 'For your building with JUAN on the entire colony and enduring the entire hive, even in its lowest points, i hereby award you with this jelly.


  Rejoice my daughter!! May your build be eternal!!' by Prime Queen (RP)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



  [bold]Hive established by [color=purple]DVE[/color]![/bold]
