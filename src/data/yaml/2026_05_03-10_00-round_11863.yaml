roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  Royal Jelly Awards:

  Elder Boiler (RAD-672) is awarded the Royal jelly of slaughter: 'Jelly that is likely one of a kind? RAD survided slaughter from all sides! The Queen was out to get them, yet they lived because the jury decided to give them one more chance. They lived through the trial of skyspit, only to emerge even more ferocious! Talls were out to get their oh so incredible gas. Guess what, talls got exactly what they asked for, and RAD melted their faces right off! What a sight to behold. RAD needs no introduction, and they will be THE deciding factor of future conquest!' by Ancient Queen (LIMA)

  Carrier (XX-508) is awarded the Royal jelly of sabotage: 'We see this sister is getting a lot of reputation for their child carring skills, as such  for her incredible work as a carrier of supreme caliber she must be recognized! Sister managed to capture talls time and time again, a literally never ending flow! Not only did she survive the whole war, she was a partial mother to the rest of the hive. Oh how we becon her to help the further hive expansion! May her children are plenty.' by Ancient Queen (LIMA)

  Mature Hivelord (AKI-964) is awarded the Royal jelly of resilience: 'Our most honorable sister kept our wonderful kingdom always weeded, walled off, and tight with her mightiest walls! She stalked the talls with her keen senses, and not ever gave them a room to breath. Especially so preceeding and following the tall wipe. Truly a professional extension of the hives capabilities! We can only beg her for her help in the future!' by Ancient Queen (LIMA)

  Ancient Defender (CHO-204) is awarded the Royal jelly of proliferation: 'CHO needs no introduction considering her universe wide skills and talents! She did not only manage to lead the charge towards a planet tall wipe, but she endlessly kept sacrificing herself for the betterment of the hive especially with her skills of multi caste multi tasking! Always grazing the edge of danger with her frontline terror, yet at the same time keeping safe at all times. The future hives are in desparate need of her skills!' by Ancient Queen (LIMA)

  Ancient Drone (RLW-350) is awarded the Royal jelly of rejuvenation: 'Sister HII was just outright a master of her craft! She kept endlessly improving the hive with her healing, fresh for battle, ready for world domination. Talls pushed us, and HII said no thank you not on my watch. In an instand the whole hive was splitting the talls apart, limb by limb, and HII simply stood in the corner witnessing the carnage she allowed to happen, made happen really. Praised be the queen mother, all future wars will be won with her by our side!' by Ancient Queen (LIMA)




