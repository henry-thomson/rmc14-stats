roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Marisol Bunten, Jack Cuban, Ruby Flamecoat, Anthony Stroh.



  Royal Jelly Awards:

  Elder Drone (GDP-28) is awarded the Royal jelly of resilience: 'During the dawn an beginning of the hive, you step up to take the mantle of being the leader of your builder sisters.


  You led many interesting an unique ways to keep the build team in strong cohesive order.


  You builded up areas that was ordered an needed, the entire cave being built solely under your supervison.


  You made it enjoyable for everybody that was with you, I want to thank you from the bottom of my heart, of your success.


  You may have fallen in battle, but I did not forget such advesary of profound work.


  May you be forever remember, great hivelord...' by Prime Queen (PRO)

  Ancient Praetorian (CHO-133) is awarded the Royal jelly of rejuvenation: 'You have done an excellent performance since the abrupt of life of a new hive, an you kept the hive front in cohesive fashion when you were made hive leader.


  You also, did amazing amount of saves, an providing essential phermones on where ever was needed. Your work was greatly noted, an I hope to see more of this in the future.


  Rejoice!' by Prime Queen (PRO)

  Ancient Lurker (LUM-720) is awarded the Royal jelly of proliferation: 'During the beginning when you were up to take mantle of being hive leader you help tremendously with flanks, an ensured that cohesion was maintained on the west of medical.


  you made tremendous value amount of captures that kept our numbers steady an which made it easier for me to always maintain ovi, an always support you.


  Rejoice!' by Prime Queen (PRO)

  Young Boiler (RU-732-I) is awarded the Royal jelly of sabotage: 'You were the longest living boiler of the front, an of which prevented many talls from doing any sort of manuvers, an denied them any massive advantage that they could lean onto.


  Your globs of acid an neuro spits allowed me to push up with resin an keep the front moving forward.


  You work was noted, and I thank you for every second of it.


  Rejoice!' by Prime Queen (PRO)




