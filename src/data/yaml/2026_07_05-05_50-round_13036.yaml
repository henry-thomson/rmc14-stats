roundEndText: >2-

  [color=yellow]The ship was scuttled by emergency reactor overload. Marines and xenonids alike were consumed in the blast. No side can claim the vessel.[/color]


  In memoriam of our fallen soldiers:

  unknown, unknown, Vern Durgle, Astolphus MacGillycuddy, unknown, Baret Elaat, Dani 'Maow' Moore, Chez 'Cheese' Woodtiger, Jonathan Bellford.



  Royal Jelly Awards:

  Mature Hivelord (KI-572-S) is awarded the Royal jelly of resilience: 'This daughter answered mothers call for a designer. They crafted a mighty hive and lead the build team. Though her efforts we have prevailed over the tall invasion. From the start you have been building our hive, and may you go on to build many more. Rejoice!' by Prime Queen (ARG)

  Young Defender (YUR-675) is awarded the Royal jelly of sabotage: 'This daughter did what no other could. When the deadly tuber struck another sister, this daugther sprung into action. They fortified in front of her sister, protecting her and ultimatly saving her life. This quick thinking and reaction is to be commended. All my children are precious to me, and this one has kept another alive this day. Bravo!' by Prime Queen (ARG)

  Mature Hivelord (SH-17-A) is awarded the Royal jelly of resilience: 'Although young, this daughter has been building grand hives from the very beginning. Though her efforts we have secured a victory against the talls. As a member of the build team she has worked tirelessly to ensure that our hive is mighty and strong. May you go on to build more grand hives in the days to come! Rejoice!' by Prime Queen (ARG)

  Ancient Lurker (ALT-912) is awarded the Royal jelly of proliferation: 'This daughter is being recognised not for her prowess on the battlefield. But for her keen mind. She constantly gave critical information about tall movements, positions and potential captures over hivemind. Through this many new captures were secured. Communication in the hivemind is critical, and this daughter understands the power of words. Bravo!' by Prime Queen (ARG)




  [bold]Operation funded by [color=green]Reade Schoeler[/color]![/bold]



