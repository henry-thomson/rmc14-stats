roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Titus Wheelian, Callen Voss, Squeakers.



  Medal Awards:

  Gunnery Sergeant Hudson 'Hungry' Demuth is awarded the Medal of exceptional heroism: 'For unflinching dedication to duty and exemplary heroism in the face of the enemy. Gunnery Sergeant Demuth led their squad with distinction, ensuring a swift defeat of the enemy. Additionally, when captured, they slew the Xenonid Queen that had swallowed them with nothing but an M5 Bayonet, defying death itself through sheer force of will. 


  Awarded by LtCol. Clyde McKinney on 27/7/2126. 2nd Company "Falling Falcons" │ 4th Battalion │ 3rd Regiment │ 4th Combat Division │ United Nations Marine Corps' by Lieutenant Colonel Clyde McKinney





