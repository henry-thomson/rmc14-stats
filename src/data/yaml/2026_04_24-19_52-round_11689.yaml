roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Alty Ciel, Nimble 'Cotton' Bloom, Caden Rifler, Aleksi Fraser, Sips-The-Cola, Yahir Lineman, Hudson 'Joker' Dwayne, Blake 'Candle' Werdin, Kux-Chrysaor.



  Royal Jelly Awards:

  Elder Ravager (LU-363-AN) is awarded the Royal jelly of resilience: 'You were actively the only one following orders on aggressively pushing west of mining after the wipe of the tall empress caste, sadly, your other sisters faultered and decided not to follow orders, but I still hold your effort in my heart, thank you for doing your absolute best in ensuring the survival of the hive.


  You will be remembered, rejoice!' by Prime Queen (PRO)

  Elder Ravager (DA-929-RK) is awarded the Royal jelly of slaughter: 'You were one of the main ravagers would incurred wipes south of tall perch,  of which you even help aid the wipe with the talls near mining when tall empress decided to skyfire the area. May your claws always strike true.


  Thank you for pushing forward, and putting your claws to great use.' by Prime Queen (PRO)

  Elder Hivelord (TS-286-S) is awarded the Royal jelly of proliferation: 'You were one of the main hivelords of the hive, that built countless designs for the hive, that gave countless cover for future engagement such as when ablock was empty, or security was left uncontested, or better yet area denial that talls would struggle to get back. I thank you for pushing forward, through the harsh conditions lay before you, and building a great hive for all to see.


  Rejoice!' by Prime Queen (PRO)




