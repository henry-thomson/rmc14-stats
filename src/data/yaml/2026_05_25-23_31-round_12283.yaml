roundEndText: >2-

  [color=lightBlue]The forces of the A.R.G will put the training they recieved to good use, with the soldiers trained here obtaining an elite education, they are expected to form the most elite portions of the army for restoration, serving as officers, specialists, and commanders.

  [/color]

  [color=Tomato]The civil war in the region continues to rage on, but soon, perhaps, it shall end. per chance it will be the royal flag that rises over the palace once more?

  [/color]

  [color=White]There is rumors of an offensive, seeing a large march north to oust the republican forces currently holding the capital. The tactics learned today shall prove pivotal in the outcome...

  [/color]

  Verdict:

  [color=DarkGreen][bolditalic]T.S.E (Strategic) Victory[/bolditalic][/color]




