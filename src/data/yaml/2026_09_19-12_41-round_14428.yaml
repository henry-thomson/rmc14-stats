roundEndText: >2-

  [color=purple]With no prey left to hunt, the xenonids roam freely. The intruders are gone. They have scattered, been slain, or have fled, leaving the hive unchallenged.[/color]


  In memoriam of our fallen soldiers:

  Karl Stone.



  Royal Jelly Awards:

  Ancient Praetorian (WA-661-LL) is awarded the Royal jelly of proliferation: 'This oppressor made our victory possible. Using their hook and sieze we were able to capture many talls working together as a hive. Their grit and determination grew our hive, enough so we could overwhelm the talls. Bravo!' by Prime Queen (ARG)

  Ancient Drone (BA-614-KA) is awarded the Royal jelly of rejuvenation: 'This healer saved countless of my hive. At a critical moment in the battle she charged into the fray to save her queen. Without her constant work and attention this battle could have ended very differently. We thank you for your service to our hive. Rejoice!' by Prime Queen (ARG)

  Mature Ravager (FR-775-G) is awarded the Royal jelly of sabotage: 'The mainstay of our battle line. Without your thick hide and shards sheidling us from tall spit and flame. This battle could have been very difffernt. You proected your sisters with all your might. Many have you to thank for their lives. Bravo!' by Prime Queen (ARG)

  Ancient Drone (ECO-416) is awarded the Royal jelly of resilience: 'This daugther, while alone in the backline, far from support, was able to singlehandedly save our charger OLT. Dragging them to saftey and healing them, you recovered what could have been a devisating loss to the hive. This grit and determination to save another sister shall always be rewarded. Rejoice!' by Prime Queen (ARG)

  Ancient Praetorian (ZIP-341) is awarded the Royal jelly of proliferation: 'Our dancer, what can be said about your grace? You dragged countless talls to their doom. You were swift and graceful in your efforts. My hive would not be the size that it is today without your work. Rejoice!' by Prime Queen (ARG)




