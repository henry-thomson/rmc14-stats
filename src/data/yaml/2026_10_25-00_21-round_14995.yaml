roundEndText: >2-

  [color=green]The last of the xenonids were purged. It’s safe to breathe again... for now.[/color]


  In memoriam of our fallen soldiers:

  Petruso Ank, Alexander Bowman, Roman 'Ranger' Bondar, Komi, Chews-the-Wires, Walker Robinson, Go Minh, Nahami, Nikki ' Yakarai ' Braune, Growth, Ker Xhango, Clairs 'Zerg' Zander, Petra Knez, Argy Navus, Kirk Reactor, Kelly Brook, Kelayani, Bobby Bobson.



  Medal Awards:

  Corporal Argy Navus is awarded the Bronze heart medal: 'Corporal Navus you braverly pushed your way to sensors right from the start providing us important intel early into the OP. You allowed us to counter some of the Queens early pushes and gather their numbers. Sadly when you went a second time a whole team of Xenonids were waiting cutting your life tragically short.


