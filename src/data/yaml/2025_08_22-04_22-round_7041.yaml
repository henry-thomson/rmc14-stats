  [color=purple]All of the marines were wiped out![/color]


  In memoriam of our fallen soldiers:

  Smokey Junipus, Jibs Mcleafins, Zoropsis Phalangioides, Mason 'Grazed' Gray, Bait Chompst, Olivia Lambert, David McCloskey, Aden 'Whistleman' Riggle, Mike Drizzle, Purp Winter, Mothsoma Fireblight, Lockie Kemble, Joi Marshall, Nomi, Ash Lightweaver, Morella Imyarek, Riley 'Hops' Hopskin, Grub, Kaizer Ruvaen, Adam Sterling, Sugar, Figaro 'Firebug' Fiammetta, Kazala 'Wyvern'.



  Royal Jelly Awards:

  Young Lurker (TNJ-969) is awarded the Royal jelly of sabotage: 'You are shadow, you are the night, you are the whisper in the wind. You hide, you sneak, you lie in wait, and you my daughter, managed to cap two tall lurkers. Those lurker talls would have been particularly troublesome to deal with, but thanks to you, I never had to worry about them. Truley, you have proven yourself to be the better lurker.' by Elder Queen (CMP)

  Elder Drone (TE-768-R) is awarded the Royal jelly of rejuvenation: 'In the long and protracted seige of the dam podlocks, you were intergral to its sucess. We could only devote little to the defense, but you my friend ensured your sisters could fight almost constanly, managing to stall out the talls long enough for me to flank. Our sucesss was shaped by your efforts, thus I award you with this jelly. May you garden in stars unseen' by Elder Queen (CMP)




